  <title>R1-14-G1: Seattle Mariners 5, Chicago White Sox 6</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-05: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-14 Game 1 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Chicago White Sox (seed 14) vs Seattle Mariners (seed 19), home pattern 2-2-1-1-1, Game 1 at Guaranteed Rate Field. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with three scoring points settled here and documented, the sources governing throughout. The first settlement is the decisions, which are not printed and are derived from the play log and the run charges on the card. Ed Walsh started for Chicago and was still the pitcher of record when Chicago scored four in the Bottom 8 to take the lead for good (8.0 IP, 10 H, 5 R, 5 ER, 1 BB, 5 SO, 1 HR), so he takes the win. J.J. Putz entered with two out in the Bottom 8 and faced four batters (Ordóñez double, Appling single, Fisk walk, Fielder Jones three-run homer), recording no out, and all four runs of the inning were charged to him (0.0 IP, 3 H, 4 R, 4 ER, 1 BB, 1 HR), so he takes the loss. Bobby Jenks worked a scoreless Top 9 (1.0 IP, 1 H, 0 R) and takes the save, entering with a one-run lead and the bases empty. The second settlement is the Chicago bunt plays. Two Chicago bunts, Collins in the Bottom 1 and Appling in the Bottom 6, each forced the lead runner with the batter safe, and the card scores both as fielder&#x27;s choice at-bats: Collins carries AB 4 and Appling AB 3 with no sacrifice for either, the printed at-bat totals requiring it exactly as the card gives them. Fielder Jones&#x27;s graded Bottom 1 sacrifice bunt decision is the manager&#x27;s call on the Collins play, not a separate plate appearance. The game&#x27;s only sacrifice is Miñoso&#x27;s Bottom 1 fly, so the split lines read SF 1 for Miñoso and SH 0 for every batter, log-proven. The third settlement is the Seattle first base line. Alvin Davis replaced John Olerud at first base for defense in the Bottom 8 and never batted; the Gazette prints no batting line for him, and the Top 8 groundout to first base (3U) belongs to Olerud, whose printed line is AB 4. Davis is carried in this recap only, with no batting line. Run charges match the printed lines exactly: Seattle pitching allows 6 (Johnson 2, Muñoz 0, Rhodes 0, Putz 4, Nelson 0), and Chicago pitching allows 5 (Walsh 5, Jenks 0), all five Seattle runs earned against Walsh. The duplicate test ran before the number was assigned: the R1-14 series entry held no stored games, so no duplicate is possible, and this box score takes the series&#x27; next unplayed number, Game 1. The game: Chicago scored in the Bottom 1, Fielder Jones singling, Collins&#x27;s bunt forcing Jones with Collins safe, Thomas singling Collins to third on the hit and run, and Miñoso lifting a sacrifice fly to center, 1-0. Seattle answered in the Top 2: Raleigh singled and was caught stealing, and Olerud homered to tie it, 1-1. Seattle moved ahead in the Top 4: Martínez walked, Ibañez singled him to second, Raleigh singled Martínez home, and Boone&#x27;s fielder&#x27;s choice scored Ibañez, 3-1. A-Rod doubled in the Top 5 and scored on Martínez&#x27;s single, 4-1. Chicago trimmed it in the Bottom 5: Appling walked, Fielder Jones singled him to third on the hit and run, Collins walked, and Thomas&#x27;s forceout scored Appling, 4-2. Ichiro doubled in the Top 7 and scored on Griffey&#x27;s single, 5-2, and Seattle still led by three going to the Bottom 8. Randy Johnson had held Chicago to two runs through six and two-thirds (6.2 IP, 5 H, 2 R, 2 ER, 3 BB, 1 HBP, 6 SO) before Muñoz finished the seventh. Rhodes opened the Bottom 8, Davis entering at first base in the same frame, and recorded two outs; Putz then gave up Ordóñez&#x27;s double, Appling&#x27;s single scoring Ordóñez, a walk to Fisk, and Fielder Jones&#x27;s three-run homer, 6-5 Chicago, Nelson coming in to get the last out. Jenks closed the Top 9: Seager singled, but Ichiro popped out, A-Rod flied to center, and Griffey flied to left. Seattle stranded 7 and Chicago 8. Home runs: two, Olerud for Seattle (solo, Top 2) and Fielder Jones for Chicago (three-run, Bottom 8). Doubles: three, Ichiro and A-Rod for Seattle and Ordóñez for Chicago. Triples: none. Errors: one, Walsh&#x27;s two-base error in the Top 1 (E1 on the pitcher) letting A-Rod reach second; no run scored from it, and Seattle played errorless ball. Hit batters: one, Miñoso, hit by Johnson in the Bottom 5; HB is carried as 1 for Johnson and 0 for every other pitcher as card-sourced values, and HBP 1 for Miñoso, so the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: one fly, Miñoso in the Bottom 1, on the settled accounting above. Stolen bases: one, Raleigh in the Top 8. Caught stealing: one, Raleigh in the Top 2. Double plays grounded into: none by either club; the two force plays on Chicago bunts and Boone&#x27;s Top 4 fielder&#x27;s choice are single-out plays on the log. Substitutions: one, Davis&#x27;s defensive entry for Olerud in the Bottom 8, carried in this recap only. Batters faced are counted from the play log and tie to the batting PA totals both ways (Seattle 39 PA against 39 Chicago BF: Walsh 35, Jenks 4; Chicago 38 PA against 38 Seattle BF: Johnson 29, Muñoz 2, Rhodes 2, Putz 4, Nelson 1). Seattle PA is AB 38 plus BB 1; Chicago PA is AB 31 plus BB 5 plus HBP 1 plus SF 1. Strikeouts tie both ways: Seattle batting 5 against Chicago pitching 5, Chicago batting 7 against Seattle pitching 7. Thirteen decisions were graded. Fielder Jones made 6 (2 paid off, 1 backfired, 3 neutral): the Bottom 1 sacrifice bunt call was neutral at -0.11; his three hit and run calls went paid off at +0.74 in the Bottom 1, neutral at -0.26 in the Bottom 4, and paid off at +0.74 in the Bottom 5; the Bottom 6 steal send backfired at -0.51, Ordóñez held at first; and the Top 9 change to Jenks was neutral at +0.23. Lou Piniella made 7 (1 paid off, 3 backfired, 3 neutral): the Top 2 steal send was neutral at +0.24, Raleigh caught stealing in an inning Seattle still scored in; the Bottom 7 change to Muñoz was neutral at -0.15; the Top 8 steal send was neutral at -0.26, Raleigh safe at second; and the Bottom 8 unraveled on his calls, the change to Rhodes backfiring at -3.27, the Davis defensive sub backfiring at -3.52, and the change to Putz backfiring at -4.15, the game&#x27;s worst grade, before the change to Nelson paid off at +0.35 on the inning&#x27;s last out. Managers: Fielder Jones (Chicago, also his club&#x27;s leadoff hitter and center fielder) and Lou Piniella (Seattle). Venue is Guaranteed Rate Field. Game 2 availability from Game 1 outs under the house convention: Walsh (24 outs) and Johnson (20 outs) are unavailable, a point the rotation turn makes moot for both starters; Jenks (3 outs), Muñoz (1), Rhodes (2), Putz (0), and Nelson (1) are all free. Chicago leads the series 1-0. Series runs so far: Chicago 6, Seattle 5.">
