  <title>R1-08-G4: Pittsburgh Pirates 15, Toronto Blue Jays 5</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-10-30: a photo of the paper scorecard grid, the app scorecard PDF, and the full graded play-by-play text; official R1-08 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number. The decisions are not printed; they are derived from the play log (John Candelaria started for Pittsburgh, pitched into the 6th with the lead, and Pittsburgh never trailed after the Top 1, so he takes the win; Pat Hentgen was charged with 8 runs in 2 innings and took the loss; there is no save, Roy Face entered with a 7-run lead in the 6th and the final margin was 10). Pittsburgh scored in the Top 1 on Barry Bonds&#x27;s RBI single. The Top 2 broke it open with 7 runs: Ralph Kiner led off with a home run, Manny Sanguillen singled, and Danny Murtaugh&#x27;s hit and run (graded paid off at +5.39, the biggest decision score of the tournament so far, with six runs scoring after it) put runners at the corners on Tommy Leach&#x27;s single; Honus Wagner singled in a run, Andrew McCutchen singled to load the bases, and Roberto Clemente reached on Carlos Delgado&#x27;s 2-base error at 1B, scoring Leach and Wagner (2 runs, no RBI); Bonds followed with a 3-run home run for 8-0. Cito Gaston left a fatigued Hentgen in (graded paid off at +0.50), Willie Stargell struck out, Kiner reached on Joe Carter&#x27;s 1-base error in LF, and the inning finally ended. Gaston&#x27;s luck ran out in the Top 3: the Scott Downs pitching change was graded backfired at -3.77 as Leach and Bill Mazeroski singled and Wagner tripled both in, McCutchen&#x27;s groundout scored Wagner (leaving Downs in was also graded backfired), and Dave Stieb, Toronto&#x27;s rotation number 1 working in long relief, came in and gave up Clemente&#x27;s home run at once (the change graded backfired as well) for 12-0. Toronto&#x27;s only answer came in the Bottom 3: Ernie Whitt singled, Roberto Alomar reached on Leach&#x27;s 1-base error at 3B, Tony Fernandez walked, and Josh Donaldson hit a grand slam, all four runs unearned. Carter&#x27;s solo home run in the Bottom 4 was Toronto&#x27;s last run and the only earned run charged to Candelaria, whose line stands as the card charges it: 5 runs, 1 earned. Stieb threw 5.2 innings of long relief from the 3rd, charged with 3 runs (Clemente&#x27;s homer, and McCutchen&#x27;s 2-run homer in the 8th). The Top 8 carried a streak note: Arky Vaughan pinch-hit for Wagner and walked (graded paid off at +2.00), ending Murtaugh&#x27;s run of seven straight graded backfired platoon pinch hits across Games 1 to 4 (Paul Waner&#x27;s Top 6 pinch hit in this game was the seventh); McCutchen&#x27;s 2-run home run followed for 14-5. Kiner&#x27;s second home run of the game, off Tom Henke in the Top 9 (the Henke change graded backfired), closed the scoring at 15-5. Earned-run notes, booked exactly as the card charges them: Candelaria 5 R and 1 ER (Toronto&#x27;s 4-run 3rd was all unearned after Leach&#x27;s error extended the inning, and Carter&#x27;s solo homer in the 4th was the only earned run); Hentgen 8 R and 7 ER (the card charges 7 of the 8 earned, splitting the two runs that scored on Delgado&#x27;s 2-base error in the 2nd). Pittsburgh&#x27;s printed RBI total is 13 against 15 runs; the other 2 scored on Delgado&#x27;s error (Leach and Wagner came home, Clemente reached), with no RBI, exactly as printed. No hit batters: the scorecard grid&#x27;s pitching tables, in both the PDF and the paper scorecard photo, print HBP 0 for all eight pitchers, so HB 0 for all 8 pitchers and HBP 0 for all batters are card-sourced values carried in the tables below, and the homer, hit batter, and derived plate appearance checks run on real data. Sacrifices: the game&#x27;s only two are Toronto sacrifice bunts to the pitcher, Alomar in the Bottom 5 and Lloyd Moseby in the Bottom 9; Ernie Whitt&#x27;s Bottom 7 bunt was a fielder&#x27;s choice (the lead runner was forced), not a sacrifice, and there were no sacrifice flies. Errors: Pittsburgh 1 (Leach, on Alomar in the Bottom 3); Toronto 2 (Delgado on Clemente and Carter on Kiner, both in the Top 2). The card also prints a caught stealing for Wagner (Top 5, after his single; the play log does not narrate it), carried in the tables as printed. Substitutions: Pittsburgh made two. Paul Waner pinch-hit for Clemente in the Top 6 and stayed in, and Arky Vaughan pinch-hit for Wagner in the Top 8 and stayed in. Toronto made no batting substitutions; Joe Carter started in LF and Lloyd Moseby in CF (George Bell and Devon White did not play), and Pittsburgh started Leach at 3B (Pie Traynor did not play). Graded decisions: Murtaugh 6 (hit and run paid off at +5.39; Waner pinch hit backfired, Vaughan pinch hit paid off at +2.00; pitching changes Face and Giusti paid off, Melancon neutral). Gaston 6 (leaving Hentgen in during the 2nd paid off at +0.50 and leaving Stieb in during the 8th was neutral; the Downs change backfired at -3.77, leaving Downs in backfired, the Stieb change backfired as Clemente homered, and the Henke change backfired as Kiner homered). Availability held from Game 3: Jimmy Key (unavailable, 18 outs in Game 3) and Babe Adams (unavailable, 27 outs in Game 3) both stayed out, correct. Managers: Danny Murtaugh (Pittsburgh) and Cito Gaston (Toronto). Venue is Rogers Centre.">
