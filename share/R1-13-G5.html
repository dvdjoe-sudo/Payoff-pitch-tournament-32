  <title>R1-13-G5: Los Angeles Angels 3, Cleveland Guardians 2</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-04: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-13 Game 5 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cleveland Guardians (seed 13) vs Los Angeles Angels (seed 20), home pattern 2-2-1-1-1, Game 5 at Progressive Field. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with two scoring points settled here and documented, the sources governing throughout. The first settlement is the Top 6 and Sam McDowell&#x27;s line. McDowell opened the sixth with walks to Boone and Ohtani and recorded no out in the inning. Smith relieved and got Trout&#x27;s flyout to center (0.1 IP, one batter faced). Jones relieved, and Guerrero, on Scioscia&#x27;s hit and run, doubled into the gap, both runners scoring on the play: the Gazette play line reads &quot;double, runners score on the hit and run (2 runs)&quot; and Guerrero&#x27;s grid cell carries two RBI dots, so Guerrero carries RBI 2. Both runs are charged to McDowell as his runners, matching his printed line (5.0 IP, 1 H, 3 R, 3 ER, 3 BB, 4 SO): the Top 3 run and the two Top 6 runs are all his, and Jones is charged with none of them. The second settlement is the errors. Los Angeles committed two errors and Cleveland none. The grid error row places them in the Bottom 3 and the Bottom 7, and the Gazette extras line names the fielders, E: Bob Boone, Tim Salmon. Salmon&#x27;s is the Bottom 7 play the log names, Speaker&#x27;s single plus the error by the right fielder, Speaker taking second; it produced no run, Speaker stranded at second. Boone&#x27;s falls in the Bottom 3, on a play the log does not annotate; it produced no run either, and both Cleveland runs are earned on Langston&#x27;s printed line (2 R, 2 ER), booked exactly as printed. The decisions are not printed; they are derived from the play log and the run charges on the card. Mark Langston takes the win (6.0 IP, 7 H, 2 ER, 1 BB, 6 SO), a start after his Game 3 relief win and a Game 4 rest: Los Angeles took the lead for good in the Top 6 on his watch, and he finished the Bottom 6 still leading 3-2. Sam McDowell takes the loss (5.0 IP, 1 H, 3 ER, 3 BB, 4 SO): all three Los Angeles runs are charged to him, including the two go-ahead runs in the Top 6. Francisco Rodriguez takes the save (1.0 IP, 0 H, 0 R, 1 BB, 2 SO): he entered the Bottom 9 with a one-run lead and the bases empty and pitched a full inning. Run charges match the printed lines exactly: Los Angeles pitching allows 2 (Langston 2; Percival, Shields, and Rodriguez none), and Cleveland pitching allows 3 (McDowell 3; Smith, Jones, Clase, and Coveleski none). The duplicate test ran before the number was assigned: the stored games in the series are Game 1, a 3-2 Cleveland win (Los Angeles 2 0 0 0 0 0 0 0 0, Cleveland 0 0 0 3 0 0 0 0 x), Game 2, a 2-1 Cleveland win (Los Angeles 0 0 0 0 1 0 0 0 0, Cleveland 0 0 0 0 0 1 0 0 1), Game 3, a 9-8 Los Angeles win (Cleveland 1 4 1 1 0 0 0 1 0, Los Angeles 2 0 0 2 0 0 0 0 5), and Game 4, a 6-3 Los Angeles win (Cleveland 1 0 0 0 0 0 0 1 1, Los Angeles 0 0 2 0 0 0 0 4 x), and this box score, a 3-2 Los Angeles win at Cleveland on its own linescore with different batting and pitching lines throughout, is no duplicate; the mirror of Game 1&#x27;s score has the other winner and a different linescore. It is the fifth game of the series in play order, booked as Game 5. The game: McDowell and Langston matched zeroes through two, McDowell retiring the first eight Angels before Grich&#x27;s walk. Los Angeles scored in the Top 3: Grich walked, Fregosi bunted him to second, and Boone doubled deep to center, 1-0. Cleveland answered in the Bottom 3: Martinez and Speaker singled, and Lajoie&#x27;s long single to center scored Martinez, 1-1, Cleveland stranding two more. Nothing moved in the fourth or fifth, Jose Ramirez&#x27;s Bottom 2 double and Martinez&#x27;s Bottom 5 single both stranded. Los Angeles won it in the Top 6 on the settled sequence above, Boone and Ohtani walking off McDowell and Guerrero&#x27;s hit-and-run double off Jones scoring both, 3-1. Cleveland got one back in the Bottom 6: Manny Ramirez tripled and Jackson singled him home, 3-2, but Belle&#x27;s forceout and a caught stealing ended the inning. Percival worked the Bottom 7, Salmon entering in right field in the same frame and Speaker reaching second on his error before Lajoie grounded out. Shields worked a clean Bottom 8, and Clase and Coveleski kept the Angels off the board in the eighth and ninth. Rodriguez closed the Bottom 9: Belle and Jose Ramirez struck out, Boudreau walked, and Martinez flew out to left. Cleveland stranded 7 and Los Angeles 2. Home runs: none by either club. Doubles: three, Boone and Guerrero for Los Angeles and Jose Ramirez for Cleveland. Triples: one, Manny Ramirez for Cleveland. Errors: two, both Los Angeles, Boone in the Bottom 3 and Salmon in the Bottom 7 on the settled accounting above; Cleveland played errorless ball. Hit batters: none; HB is carried as 0 for all nine pitchers (Langston, Percival, Shields, Rodriguez, McDowell, Smith, Jones, Clase, and Coveleski) as card-sourced values, and the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: two bunts, Fregosi in the Top 3 and Lajoie in the Bottom 5, so the split lines read SH 1 for each of them and SF 0 for every batter, log-proven (no sacrifice fly was hit). Stolen bases: none; all three of Francona&#x27;s steal sends ended with the runner held or caught, and the printed SB columns are 0 for every batter. Caught stealing: one, Belle in the Bottom 6. Double plays grounded into: one, Fregosi in the Top 7. Substitutions: one. Tim Salmon replaced Guerrero in right field for the Bottom 7 as a defensive substitute and carries the printed line AB 1, H 0 (a Top 9 groundout). No other substitution was made by either club. Batters faced are counted from the play log and tie to the batting PA totals both ways (Los Angeles 32 PA against 32 Cleveland BF: McDowell 19, Smith 1, Jones 6, Clase 3, Coveleski 3; Cleveland 36 PA against 36 Los Angeles BF: Langston 25, Percival 4, Shields 3, Rodriguez 4). Los Angeles PA is AB 28 plus BB 3 plus SH 1; Cleveland PA is AB 33 plus BB 2 plus SH 1. Strikeouts tie both ways: Los Angeles batting 5 against Cleveland pitching 5, Cleveland batting 10 against Los Angeles pitching 10. Thirteen decisions were graded. Terry Francona made 7 (2 paid off, 5 backfired, 0 neutral): all three steal sends backfired, Speaker held in the Bottom 1 at -0.51, Jackson held in the Bottom 6 at -0.86, and Belle caught stealing in the Bottom 6 at -0.76; the Top 6 pitching changes backfired as well, Smith at -0.31 and Jones at -1.37, the game&#x27;s worst grade, Guerrero&#x27;s double coming home behind him; and the Top 8 change to Clase and the Top 9 change to Coveleski paid off at +0.73 each, two scoreless innings with the game already lost. Mike Scioscia made 6 (5 paid off, 0 backfired, 1 neutral): the Top 3 sacrifice bunt paid off at +0.39, Boone&#x27;s double scoring Grich behind it; the Top 6 hit and run paid off at +1.37, the game&#x27;s best grade; all three pitching changes paid off at +0.73, Percival, Shields, and Rodriguez each working a scoreless inning; and the Salmon defensive sub was neutral at +0.23, the error behind him producing no run. Managers: Terry Francona (Cleveland) and Mike Scioscia (Los Angeles). Venue is Progressive Field. Availability compliance: Langston was free for Game 5; the cap from his 6 outs in Game 3 applied to Game 4 only, he did not pitch in Game 4 (no line in the previous game means free), and he started and won. McDowell was Cleveland&#x27;s fresh rotation number 5. Kluber (16 outs in Game 4) and Weaver (18 outs in Game 4), both unavailable, were correctly unused. Game 6 availability: McDowell (15 outs in Game 5) and Langston (18 outs in Game 5) are UNAVAILABLE under the house convention, and the rotations turn in any case; Smith (1 out), Jones (5 outs), Percival, Shields, Rodriguez, Clase, and Coveleski (3 outs each) are free. The series moves to Los Angeles for Game 6. Los Angeles leads the series 3-2.">
