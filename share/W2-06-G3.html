  <title>W2-06-G3: Chicago Cubs 8, Minnesota Twins 6</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 6, Game 3 at Target Field. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Kerry Wood takes the win for Chicago (3.1 IP, 11 BF, 1 H, 0 R, 4 SO): he entered in the bottom of the 5th with Kent Hrbek at second (1 inherited runner, 0 scored, per the Rec&#x27;s extra line), struck out Joe Cronin to end the 5th, and held Minnesota scoreless through the 8th. Lee Smith takes the save (1.0 IP, 4 BF, 1 H, 1 SO), a scoreless 9th finished by Harmon Killebrew&#x27;s strikeout. Rick Aguilera takes the loss for Minnesota (0.2 IP, 5 BF, 2 H, 2 R, 2 ER, 1 BB): Sammy Sosa&#x27;s top-of-the-8th two-run double off him is the decisive play the export&#x27;s summary names. Jhoan Duran is charged with a blown save in the Rec&#x27;s extra line: he entered the top of the 6th with a 6-4 lead and Gabby Hartnett, Bert Blyleven&#x27;s runner, at second (1 inherited, 1 scored: Hartnett scored on Pete Crow-Armstrong&#x27;s single, the run inside Blyleven&#x27;s 5 ER), and Duran&#x27;s own runner, Crow-Armstrong, stole second and scored on Ryne Sandberg&#x27;s single to tie the game 6-6. Jim Kaat (1.1 IP, 5 BF, 1 H, 1 SO) entered in the top of the 8th with Sosa at second and stranded him (1 inherited, 0 scored, per the extra line). Scoring: Minnesota scored first in the bottom of the 2nd: Goose Goslin doubled, Tony Oliva walked, and Hrbek singled Goslin home (1-0). Chicago&#x27;s four-run top of the 4th off Blyleven: Ron Santo singled, Billy Williams&#x27;s hit-and-run groundout advanced him, Ernie Banks doubled Santo home, Hack Wilson walked, Hartnett singled Banks home, Crow-Armstrong singled Wilson home, and Sandberg singled Hartnett home (4-1); Anthony Rizzo was then hit by a pitch before Santo flied out. Minnesota answered in the bottom of the 4th: Killebrew singled, Goslin walked, Oliva&#x27;s forceout erased Goslin at second, and Hrbek singled Killebrew home (4-2). Minnesota&#x27;s four-run bottom of the 5th off Rick Reuschel: Rod Carew singled, Kirby Puckett singled, Killebrew&#x27;s sacrifice fly scored Carew, Goslin singled Puckett home, Oliva doubled Goslin home, and Hrbek doubled Oliva home (6-4); Wood then relieved Reuschel and struck out Cronin to end the inning. Chicago tied it in the top of the 6th (above, 6-6) and won it in the top of the 8th: Sandberg doubled off Aguilera, Rizzo walked, Santo flied out, and Sosa doubled both home (8-6). Ryne Sandberg is the export&#x27;s player of the game: 3 for 5 with a double, 2 RBIs and a run; he singled home a run in the 4th, singled home the tying run in the 6th, and doubled and scored the go-ahead run in the 8th. Key lines: for Chicago, Hartnett 2 for 3 with a double, 2 runs, an RBI and a walk; Crow-Armstrong 2 for 4 with 2 RBIs, a run, a stolen base and a sacrifice bunt; Sosa 1 for 4 with the decisive two-run double, a walk and a caught stealing; and Johnny Kling, who replaced Hartnett at catcher in the bottom of the 8th, singled in the top of the 9th. For Minnesota, Goslin 3 for 3 with a double, 2 runs, an RBI and a walk; Hrbek 3 for 4 with a double and 3 RBIs; Oliva 1 for 3 with an RBI double, a run and a walk; and Blyleven&#x27;s start (5.1 IP, 26 BF, 8 H, 5 R, 5 ER, 3 BB, 1 HBP, 5 SO) went unrewarded. The game was errorless, and defensive lines are booked in the established shape from the printed fielding section (Chicago 27 putouts and 8 assists, Rizzo 12 putouts; Minnesota 27 putouts and 9 assists, Mauer 9 putouts catching, Gaetti 4 assists); the fielding section also prints a run-out credit and a GDP credit for Crow-Armstrong, neither of which enters the defense object&#x27;s putout/assist/error lines, which are booked exactly as printed. Minnesota turned one double play (Sosa&#x27;s top-of-the-1st grounder, a genuine double-play row in the log and Chicago&#x27;s only printed GIDP); Chicago turned none. Stolen bases: Crow-Armstrong off Mauer in the top of the 6th; Sosa was caught stealing (Mauer&#x27;s catching line reads PB 0, 1 stolen base against, 1 caught stealing). Wild pitches: Reuschel 1 (booked in the defense object&#x27;s wild-pitch line exactly as printed). Passed balls: none. One correction to the booking brief, booked as printed: the brief&#x27;s Harmon Killebrew line transposed several columns (RBI 0, BB 1, SO 0, SB 1, SF 0, GIDP 1); the export&#x27;s CSV batting section, its Rec bat array, the box score and the play log all print RBI 1 (the bottom-of-the-5th sacrifice fly), BB 0, SO 1 (the bottom-of-the-9th strikeout), SB 0, SF 1 and GIDP 0, and the printed line is booked; only the printed reading ties Minnesota&#x27;s walks (2) to Chicago&#x27;s staff walks and Minnesota&#x27;s RBIs (6) to its runs. Counting checks: Chicago plate appearances 45 (37 AB, 5 BB, 2 HBP, 1 SH) equal Minnesota&#x27;s 45 batters faced (Blyleven 26, Duran 9, Aguilera 5, Kaat 5); Minnesota plate appearances 40 (36 AB, 2 BB, 1 SH, 1 SF) equal Chicago&#x27;s 40 batters faced (Reuschel 25, Wood 11, Smith 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways, and neither side hit a home run. Every run carries an RBI (Chicago 8 runs on 8 RBIs, Minnesota 6 on 6). Manager grades: the grades list names both managers directly, so no label mapping is needed. Frank Chance graded 9 decisions (5 paid off, 3 backfired, 1 neutral): three hit and runs at 1 paid off and 2 backfired, two pitching changes at 1 paid off and 1 neutral, and his one steal (Crow-Armstrong in the 6th), his defensive sub (Kling in the 8th) and leaving Wood in all paid off, while his one sacrifice bunt backfired. Tom Kelly graded 3 decisions (1 paid off, 2 backfired), all pitching changes: Duran in the 6th and Aguilera in the 8th backfired, Kaat in the 8th paid off. Series graded totals through three games: Chance 28 decisions, Kelly 9. Availability from Game 2 was honored: Mordecai Brown, Johan Santana and Firpo Marberry, all unavailable after their Game 2 workloads, did not pitch. Availability for Game 4 under the convention: Rick Reuschel (14 outs in this game), Bert Blyleven (16 outs) and Kerry Wood (10 outs) are unavailable; Jhoan Duran (5 outs), Rick Aguilera (2), Jim Kaat (4) and Lee Smith (3) are free. Game 4 is at Target Field, and Minnesota faces elimination. Chicago leads the series 3-0. Managers: Frank Chance (Chicago) and Tom Kelly (Minnesota). Venue is Target Field, as printed.">
