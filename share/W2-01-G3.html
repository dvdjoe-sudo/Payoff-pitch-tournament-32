O, 1 WP) closed the inning scoreless. Mariano Rivera takes the save (1.0 IP, 3 H, 1 R, 1 ER, 0 BB, 1 SO): he pitched the full Bottom 10 with a 6-3 lead of exactly three and allowed one run, the save on the lead-of-three-or-fewer plus at-least-one-inning prong, the same prong as Papelbon&#x27;s save in Game 4 of L1-01. The starters took no decisions. Lefty Gomez (6.1 IP, 3 H, 2 R, 2 ER, 4 BB, 0 HBP, 9 SO, 0 HR) left in the Bottom 7 with a 1-0 lead, one out, and runners at first and second; the two runners he left both scored, and Goose Gossage (1.2 IP, 3 H, 1 R, 1 ER, 1 BB, 1 SO, 0 HR) is charged with the third Bottom 7 run, Ellis, who walked off him and scored on Henderson&#x27;s single. Dave Stewart (5.2 IP, 2 H, 1 R, 1 ER, 2 BB, 1 HBP, 5 SO, 1 HR) left in the Top 6 with two out and runners at first and second, and Andrew Bailey (1.1 IP, 0 H, 0 R, 0 ER, 1 BB, 0 SO) stranded them; Stewart&#x27;s only run was Jeter&#x27;s home run. Oakland&#x27;s other relief ran Sean Doolittle (0.2 IP, 2 H, 2 R, 2 ER, 0 BB, 0 SO, 1 HR) and Liam Hendriks (1.1 IP, 0 H, 0 R, 0 ER, 0 BB, 2 SO, 0 HR) around the Top 10. Run charges match the printed lines exactly: New York pitching allows 4 (Gomez 2, Gossage 1, Robertson 0, Rivera 1), and Oakland pitching allows 6 (Stewart 1, Bailey 0, Doolittle 2, Hendriks 0, Eckersley 1, Fingers 2, Honeycutt 0). The duplicate test ran before the number was assigned: the series&#x27; two stored games are Game 1 (New York 8, Oakland 1) and Game 2 (Oakland 6, New York 5), both with different linescores, so this box score takes Game 3. The game: New York threatened in the Top 1, Jeter singling and Judge reaching on Tejada&#x27;s error, before Ruth flied out and Gehrig grounded into a double play. Jeter&#x27;s solo home run off Stewart in the Top 3 opened the scoring, and the 1-0 game held through six, Gomez striking out nine and Stewart allowing only two hits. Oakland took the lead with three in the Bottom 7: Tejada walked, Campaneris pinch-ran, Murphy struck out, Steinbach singled, Gossage came in and walked Ellis to load the bases, Henderson singled Campaneris home to tie, Bando popped out, and Jackson singled Steinbach and Ellis home for a 3-1 lead. New York tied it in the Top 8 off Doolittle: Jeter singled and, after two flyouts, Gehrig hit a two-run home run; Hendriks closed the inning. A scoreless Bottom 8, a scoreless Top 9 off Hendriks, and Robertson&#x27;s scoreless Bottom 9 sent the tie to the tenth. New York scored three in the Top 10: Randolph struck out off Eckersley, Jeter doubled, Fingers intentionally walked Judge and struck out Ruth, and Gehrig hit a three-run home run; Honeycutt walked Mantle, who took second on the wild pitch, and struck out Williams. Oakland scored once in the Bottom 10 off Rivera, Canseco and Campaneris singling with two out and Murphy singling Canseco home, and Steinbach struck out with the tying runs on base. Jeter finished 4 for 4 with a walk, 4 hits, 3 runs, a double, and a home run. New York stranded 6 and Oakland 10. Home runs: three, all New York: Jeter (solo, Top 3, off Stewart), Gehrig (two-run, Top 8, off Doolittle), and Gehrig (three-run, Top 10, off Fingers); Gehrig&#x27;s 5 RBI all came on his two swings. Doubles: one, Jeter&#x27;s in the Top 10. Triples: none. Errors: one, Tejada&#x27;s E6 in the Top 1, Judge reaching on the play; no run resulted, and New York was errorless. Hit batters: one, Berra by Stewart in the Top 5; HB 1 for Stewart and 0 for every other pitcher and HBP 1 for Berra and 0 for every other batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: one, Honeycutt in the Top 10, Mantle advancing to second on it during Williams&#x27;s at-bat, as the Gazette prints; every other pitcher reads 0. Passed balls: none, the fielding tables printing PB 0 for both catchers, Berra and Steinbach. Sacrifices: none; Murphy&#x27;s Bottom 8 bunt popped up to the pitcher for an out, an at-bat, not a sacrifice, so SH 0 and SF 0 for every batter. Stolen bases: one, Henderson for Oakland in the Bottom 3 (second base; Berra&#x27;s catching line reads SB against 1, CS 0). Caught stealing: none. Double plays grounded into: one, Gehrig for New York in the Top 1, turned by McGwire and Tejada, Oakland&#x27;s one double play. Substitutions: New York made one with plate appearances, Bernie Williams replacing DiMaggio in center field for the Bottom 7 and batting twice, so New York prints ten batting lines; Oakland made two, Bert Campaneris pinch-running for Tejada in the Bottom 7, staying in at shortstop, batting twice, and scoring a run, and Matt Olson replacing McGwire at first base for the Top 8 and batting once, so Oakland prints eleven batting lines. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: New York PA is AB 36 plus BB 5 plus HBP 1, which is 42, and the outs plus runs plus stranded identity agrees (30 outs plus 6 runs plus 6 stranded is 42); Oakland PA is AB 39 plus BB 5, which is 44, and the identity agrees (30 outs plus 4 runs plus 10 stranded is 44). Batters faced tie to those totals: New York 42 PA against 42 Oakland BF (Stewart 22, Bailey 5, Doolittle 4, Hendriks 4, Eckersley 2, Fingers 3, Honeycutt 2), counted from the play log, and Oakland 44 PA against 44 New York BF (Gomez 26, Gossage 9, Robertson 3, Rivera 6). Strikeouts tie both ways: New York batting 10 against Oakland pitching 10 (Stewart 5, Bailey 0, Doolittle 0, Hendriks 2, Eckersley 1, Fingers 1, Honeycutt 1), and Oakland batting 11 against New York pitching 11 (Gomez 9, Gossage 1, Robertson 0, Rivera 1). Printed RBI: New York 6 for 6 (Gehrig 5, Jeter 1) and Oakland 4 for 4 (Jackson 2, Henderson 1, Murphy 1); every run in the game carried an RBI. Availability: Game 2&#x27;s long starts sat out as required, Blue (16 outs in Game 2) and Ruffing (20) unavailable and both unused in Game 3, and Fingers, capped at 3 outs after 6 outs in Game 2, recorded exactly 1 out in the Top 10, inside the cap, all under the house outs convention (under 6 outs free, 6 to 8 outs capped at 3, 9 or more outs unavailable); every other arm used was free. For Game 4, Gomez (19 outs) and Stewart (17 outs) are unavailable, and every reliever used is free (Gossage 5 outs, Bailey 4, Hendriks 4, Robertson 3, Rivera 3, Doolittle 2, Eckersley 1, Fingers 1, Honeycutt 1). Thirteen decisions were graded. Dick Williams (Oakland) made 9 (3 paid off, 4 backfired, 2 neutral): the Bottom 3 steal was neutral at -0.26 (Henderson safe at second, no runs followed); the Top 6 change to Bailey paid off at +0.68 (Mantle popped out to end the inning); the Bottom 7 pinch runner, Campaneris for Tejada, paid off at +2.39 (the runner scored in the three-run inning); the Top 8 change to Doolittle backfired at -1.77 (Jeter singled and Gehrig&#x27;s two-run home run tied the game); the Top 8 defensive sub of Olson at first base backfired at -1.52; the Top 8 change to Hendriks paid off at +0.35 (Mantle struck out to end the inning); the Top 10 change to Eckersley backfired at -2.27 (three runs scored in the inning); the Top 10 change to Fingers backfired at -2.59, the game&#x27;s worst grade (the intentional walk and Gehrig&#x27;s three-run home run); and the Top 10 change to Honeycutt was neutral at -0.15 (no runs after he entered). Casey Stengel (New York) made 4 (1 paid off, 2 backfired, 1 neutral): the Bottom 7 defensive sub of Bernie Williams in center field backfired at -2.52 (three runs scored in the inning); the Bottom 7 change to Gossage backfired at -2.37 (Ellis walked and all three runs scored); the Bottom 9 change to Robertson paid off at +0.73 (a scoreless inning with the game tied); and the Bottom 10 change to Rivera was neutral at -0.27 (one run scored against 0.48 expected). Managers: Casey Stengel (New York) and Dick Williams (Oakland). Venue is RingCentral Coliseum. New York leads the series 2-1.">
