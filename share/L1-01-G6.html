  <title>L1-01-G6: Philadelphia Phillies 3, Miami Marlins 5</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-08: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official L1-01 Game 6 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This is Losers Bracket Round 1, Series 1: the Philadelphia Phillies (seed 11) against the Miami Marlins (seed 32), home pattern 2-2-1-1-1, Game 6 at loanDepot Park in Miami. Both clubs carry one series loss and the loser of this series takes its second series loss and is eliminated. Box score record: the three sources carry the linescore, the full batting and pitching lines, a complete graded play log with its own Fielding accounting, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Steve Carlton takes the loss (7.0 IP, 8 H, 5 R, 5 ER, 3 BB, 4 SO, 0 HR); all five Miami runs are charged to him, including both Bottom 8 runs, because he faced Castillo, Yelich, and Sheffield in the eighth without recording an out, and Brad Lidge (1.0 IP, 0 H) recorded the inning&#x27;s three outs after the damage. Josh Johnson took no decision (5.2 IP, 10 H, 3 R, 3 ER, 0 BB, 4 SO, 1 HR); he left with two outs in the Top 6 and the game tied 3-3. The win derivation: Tanner Scott finished the sixth and pitched the seventh scoreless (1.1 IP, 1 BB), A.J. Ramos pitched a scoreless Top 8 (1.0 IP, 1 SO), and Miami took the lead for good in the Bottom 8 while Ramos was Miami&#x27;s pitcher of record, so the win is Ramos&#x27;s. Robb Nen takes the save (1.0 IP, 0 H); he entered the Top 9 at 5-3 and pitched the full inning, the save on the lead-of-three-or-fewer plus at-least-one-inning prong. Run charges match the printed lines exactly: Philadelphia pitching allows 5 (Carlton 5, Lidge 0), and Miami pitching allows 3 (Johnson 3, Scott 0, Ramos 0, Nen 0). The duplicate test ran before the number was assigned: the series&#x27; five stored games are Game 1 (Philadelphia 3, Miami 1), Game 2 (Miami 9, Philadelphia 3), Game 3 (Miami 8, Philadelphia 6 in 11 innings), Game 4 (Philadelphia 4, Miami 2), and Game 5 (Miami 8, Philadelphia 2), all with different scores and linescores, so this box score takes Game 6. The game: after two scoreless innings, Miami scored in the Bottom 3, Realmuto reaching on a fielder&#x27;s choice, Castillo tripling him home, and Yelich singling Castillo home. Philadelphia took the lead with one in the Top 4 (Klein doubled, moved to third on Schmidt&#x27;s groundout, and scored on Howard&#x27;s single) and two in the Top 5 (Ruiz doubled and Rollins hit a two-run home run off Johnson, the game&#x27;s only homer). Miami tied it 3-3 in the Bottom 5 on singles by Realmuto, Castillo, and Yelich. Johnson stayed in through two graded leave-ins and left in the sixth with runners at first and third; Scott stranded them. It stayed tied until the Bottom 8, when Castillo singled to right, Yelich doubled him home, and Sheffield singled Yelich home, all off Carlton, before Lidge came in and retired the side. Nen then closed a clean ninth, with Charles Johnson in at catcher for defense. Philadelphia stranded 6 and Miami 4. Home runs: one, Rollins&#x27;s two-run shot in the Top 5 off Johnson. Doubles: three, Klein and Ruiz for Philadelphia, Yelich for Miami. Triples: one, Castillo in the Bottom 3. Errors: none, by either club, the second straight errorless game in this series. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are card-sourced values, so the hit batter check runs on real data. Wild pitches: none, for any pitcher on either club; the log records no wild pitch, and the zero is a finding, not a gap. Passed balls: none; Realmuto, Charles Johnson, and Ruiz all read 0 in the Fielding tables. Sacrifices: none; Ramirez&#x27;s Bottom 4 bunt was bunted into a double play and counts as an at-bat and a double play grounded into, not a sacrifice, so the lines read SH 0 and SF 0 for every batter. Stolen bases: none, and no caught stealing. Double plays grounded into: three, Klein 1 for Philadelphia and Ramirez 2 for Miami (the Bottom 2 double play and the Bottom 4 bunt double play); Philadelphia turned two double plays and Miami one. Substitutions with plate appearances: none; Philadelphia printed nine batting lines and Miami nine, with Charles Johnson entering as a defensive replacement at catcher in the Top 9 with no plate appearance, carried in this recap and in the defensive lines only. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Philadelphia PA is AB 35 plus BB 1, which is 36, and the outs plus runs plus stranded identity agrees (27 outs plus 3 runs plus 6 stranded is 36); Miami PA is AB 30 plus BB 3, which is 33, and the identity agrees (24 outs plus 5 runs plus 4 stranded is 33, Miami batting only eight innings). Batters faced tie to those totals: Philadelphia 36 PA against 36 Miami BF (Johnson 26, Scott 4, Ramos 3, Nen 3), counted from the play log, and Miami 33 PA against 33 Philadelphia BF (Carlton 30, Lidge 3). Strikeouts tie both ways: Philadelphia batting 5 against Miami pitching 5 (Johnson 4, Ramos 1), and Miami batting 4 against Philadelphia pitching 4 (Carlton 4, Lidge 0). Printed RBI: Philadelphia 3 for 3 (Rollins 2, Howard 1); Miami 5 for 5 (Yelich 3, Castillo 1, Sheffield 1). Defensive lines were built with this booking under Joe&#x27;s 2026-11-07 standing instruction: errors_by stays empty in the existing schema shape because the game was errorless, and a defense object in the established shape carries the putout and assist lines (Miami 27 putouts against Philadelphia&#x27;s nine innings, Philadelphia 24 putouts against Miami&#x27;s eight; wild pitches and passed balls true zeros for every pitcher and catcher). Availability: inside the series the house outs convention reads Game 5 only, and it runs under 6 outs free, 6 to 8 outs capped at 3, 9 or more unavailable. Jose Fernandez threw 18 outs in Game 5 and Cole Hamels 18, so both were unavailable under the convention and correctly went unused. Every pitcher used in this game was free: in Game 5, Scott, Cishek, Bender, and Alfonseca threw 3 outs or fewer for Miami and Garber, McGraw, and Reed 4 or fewer for Philadelphia, and Josh Johnson and Steve Carlton had no Game 5 line at all. Eight decisions were graded. Jack McKeon (Miami) made 6 (6 paid off, 0 backfired, 0 neutral): leaving Johnson in for the Top 5 after Rollins&#x27;s home run paid off at +0.73; leaving him in for the Top 6 paid off at +0.73; the change to Scott in the Top 6 paid off at +0.73, stranding Johnson&#x27;s runners; the change to Ramos for the Top 8 paid off at +0.73; the change to Nen for the Top 9 paid off at +0.73; and the defensive sub, Charles Johnson in at catcher for the Top 9, paid off at +0.48. Charlie Manuel (Philadelphia) made 2 (1 paid off, 0 backfired, 1 neutral): leaving Carlton in for the Bottom 8 was neutral at -0.15, and the change to Lidge in the Bottom 8 paid off at +1.11, the game&#x27;s best grade, though it came after the two winning runs had scored. Managers: Charlie Manuel (Philadelphia) and Jack McKeon (Miami). Venue is loanDepot Park. Miami wins the series 4-2, and Philadelphia is eliminated.">
