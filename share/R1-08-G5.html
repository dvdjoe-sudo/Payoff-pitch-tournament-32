  <title>R1-08-G5: Toronto Blue Jays 7, Pittsburgh Pirates 9</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-10-31: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-08 Game 5 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number with one documented exception, the hit batter settlement below. The decisions are not printed; they are derived from the play log (Roy Face takes the win: Bob Friend left after 5 innings with a 5-4 lead, Toronto tied the game 5-5 in the Top 6 with Face pitching, and Pittsburgh&#x27;s go-ahead 4 runs in the Bottom 6 scored while Face was still the pitcher of record, so Face is the winner; Scott Downs gave up all 4 of those Bottom 6 runs and takes the loss; Mark Melancon takes the save, entering the Top 9 with a 3-run lead at 9-6 and pitching the full inning under the lead-of-three-plus-one-inning condition). Toronto struck first: Alomar and Fernandez singled in the Top 1, Donaldson forced Fernandez, and Delgado&#x27;s sacrifice fly made it 1-0. Pittsburgh answered at once in the Bottom 1: Wagner tripled, Clemente and Bonds walked, and Kiner hit a grand slam off Kevin Gausman for 4-1, Kiner&#x27;s only RBI play of the day. Toronto kept coming: Moseby&#x27;s 2-run home run off Friend in the Top 2 cut it to 4-3, and Moseby&#x27;s RBI double in the Top 4 tied it 4-4; Moseby finished 3 for 3 with 3 RBI. Clemente&#x27;s solo home run off Gausman in the Bottom 5 broke the tie at 5-4. The Top 6 tied it again: McGriff reached on Bonds&#x27;s 2-base error in LF (Pittsburgh&#x27;s only error) and Barfield singled him home, the run unearned, charged to Face&#x27;s line as 1 R and 0 ER. The Bottom 6 decided the series: Cito Gaston went to Scott Downs and the change was graded backfired at -3.77 for the second straight game, as Stargell and Sanguillen singled (Sanguillen&#x27;s drove in the go-ahead run), Murtaugh&#x27;s hit and run was graded paid off at +2.74 when Leach tripled home another, Mazeroski&#x27;s sacrifice fly scored Leach, and Wagner and McCutchen singled in a fourth run for 9-5; Gaston leaving Downs in during the inning was also graded backfired. Toronto got one back in the Top 7 on Delgado&#x27;s RBI single off Dave Giusti (Delgado finished with 3 RBI) and threatened in the Top 8 against Kent Tekulve: Carter singled, Barfield walked, Moseby bunted them over, and Jose Bautista, pinch-hitting for Whitt, was hit by a pitch to load the bases, but Alomar grounded into an inning-ending double play. In the Top 9, Melancon gave up singles to Fernandez and Delgado (Delgado&#x27;s scored Fernandez for 9-7) before striking out McGriff and getting Carter to ground out, closing the series; Murtaugh&#x27;s closer call was graded backfired at -0.77 because of the run allowed, but the save stands. Hit batter settlement: the scorecard photo grid&#x27;s pitchers-faced table prints Tekulve HBP 0, but the PDF box settles it the other way twice, listing &quot;HBP: Jose Bautista&quot; in the Toronto extras and &quot;HBP by: Kent Tekulve 1&quot; in the Pittsburgh extras, and the play log has Bautista hit by Tekulve&#x27;s pitch in the Top 8; the game is therefore booked with HB 1 for Tekulve and HBP 1 for Bautista, and HB 0 for every other pitcher, all card-sourced values carried in the tables below so the homer, hit batter, and derived plate appearance checks run on real data. Downs&#x27;s 2 wild pitches are printed on the scorecard; a wild pitch is not a stored archive field and is noted here only. Sacrifices, split as the card splits them: Delgado&#x27;s sacrifice fly (Top 1) and Moseby&#x27;s sacrifice bunt (Top 8) are Toronto&#x27;s two; Mazeroski&#x27;s sacrifice fly (Bottom 6) is Pittsburgh&#x27;s one. Stolen bases: Fernandez stole second in the Top 9 and Wagner stole second in the Bottom 6, one each as printed. Double plays grounded into, counted from the play log: Toronto 4 (Delgado, Alomar, and Fernandez twice, in the Top 5 and Top 7; the card&#x27;s extras list Fernandez once by name, the log shows both plays), Pittsburgh 1 (Leach, Bottom 7). Substitutions: Bautista pinch-hit for Whitt in the Top 8 and Alejandro Kirk replaced him at catcher in the Bottom 8 (Kirk did not bat); Arky Vaughan pinch-hit for Wagner in the Bottom 8, the platoon pinch hitters finishing the series at 1 paid off in 9 graded calls. Gaston&#x27;s late changes to Eichhorn and Quantrill both graded paid off, holding Pittsburgh scoreless over the last two innings, and his Bautista pinch hit graded backfired at -1.13 on the hit by pitch outcome. Availability held from Game 4 under the house outs convention: Dave Stieb (unavailable, 17 outs in Game 4) and John Candelaria (unavailable, 16 outs in Game 4) did not pitch, and Pat Hentgen (6 outs in Game 4, capped at 3 outs) was not used. Graded decisions: Murtaugh 6 (the Bottom 6 hit and run paid off at +2.74; pitching changes Face neutral, Giusti backfired, Tekulve neutral, the Melancon closer call backfired at -0.77; the Vaughan pinch hit backfired). Gaston 7 (leaving Gausman in during the Bottom 5 paid off; the Downs change backfired at -3.77 and leaving Downs in backfired; the Eichhorn and Quantrill changes paid off, the Kirk defensive sub paid off, and the Bautista pinch hit backfired at -1.13). Managers: Danny Murtaugh (Pittsburgh) and Cito Gaston (Toronto). Venue is PNC Park. Pittsburgh wins the series 4-1, outscoring Toronto 45-25 across the five games. No series MVP is recorded yet; Joe rules on that next.">
