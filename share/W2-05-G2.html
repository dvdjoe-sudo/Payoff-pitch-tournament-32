  <title>W2-05-G2: Cleveland Guardians 3, St. Louis Cardinals 6</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 5, Game 2 at Busch Stadium. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Dizzy Dean takes the win for St. Louis (8.0 IP, 35 BF, 5 H, 3 R, 2 ER, 6 BB, 1 HBP, 6 SO, 2 HR allowed). Stan Coveleski takes the loss for Cleveland (4.2 IP, 22 BF, 6 H, 6 R, 6 ER, 1 BB, 1 HBP, 5 SO, 3 HR allowed, 1 WP). Jason Isringhausen takes the save (1.0 IP, 4 BF, 0 H, 1 SO, 1 WP), pitching the 9th. No holds and no inherited-runner lines appear in the Rec for this game (the Rec carries no extra list at all). Scoring: Cleveland scored first in the top of the 1st, Kenny Lofton singling, stealing second, and scoring when Shoeless Joe Jackson reached on Ozzie Smith&#x27;s one-base error at short (E6); the run is unearned, which is Dean&#x27;s 3 R / 2 ER gap exactly as printed. St. Louis tied it in the bottom of the 1st without an RBI: Ozzie Smith doubled, Stan Musial&#x27;s groundout moved him to third, and he scored from third on the play of Rogers Hornsby&#x27;s strikeout, Coveleski&#x27;s wild pitch (WP 1 as printed), so St. Louis finishes with 5 team RBIs against 6 runs. St. Louis went ahead for good in the bottom of the 3rd: Ken Boyer doubled, Musial walked, and Hornsby hit a three-run home run, the decisive play the export&#x27;s summary names. Cleveland cut it to 4-2 in the top of the 5th on Manny Ramirez&#x27;s solo home run. St. Louis answered in the bottom of the 5th with back-to-back home runs, Hornsby&#x27;s second of the game and Albert Pujols&#x27;s, both off Coveleski, whose day ended there. Cleveland&#x27;s last run came in the top of the 8th, Albert Belle&#x27;s solo home run off Dean. Rogers Hornsby is the export&#x27;s player of the game: 2 for 4 with two home runs, 4 RBIs and 2 runs. Key lines: for St. Louis, Pujols 2 for 4 with the home run and an RBI, Joe Medwick 2 for 4, Boyer 1 for 3 with a double and a run, and Ozzie Smith 1 for 4 with a double and a run; for Cleveland, Lofton 2 for 5 with a double, a stolen base and a run, Belle 1 for 1 with the home run, 2 walks and a hit by pitch, Manny Ramirez 1 for 2 with the home run and a walk, and Jackson 1 for 3 with a walk and a stolen base. Early Wynn (2.1 IP, 8 BF, 1 H, 1 SO) and Emmanuel Clase (1.0 IP, 4 BF, 1 H, 1 SO) held St. Louis scoreless after Coveleski left. The game&#x27;s only error was Ozzie Smith&#x27;s (E6) in the top of the 1st; it is carried in errors_by in the established shape, and defensive lines are booked in the established shape from the printed fielding section (Cleveland 24 putouts and 7 assists, Thome 8 putouts and Victor Martinez 8; St. Louis 27 putouts and 13 assists, Pujols 12 putouts). St. Louis turned two double plays, Lofton&#x27;s top-of-the-4th grounder and José Ramírez&#x27;s top-of-the-5th grounder, both genuine double-play rows in the log and the game&#x27;s only printed GIDPs; Cleveland turned none, and no GIDP difference arises. Red Schoendienst replaced Hornsby at second base for the top of the 9th and took the game&#x27;s final out, Thome&#x27;s liner; he never batted, so he is booked in the defense object only (1 putout), exactly as printed, with no batting line. Stolen bases: Lofton and Jackson off Yadier Molina (his catching line reads PB 0, 2 stolen bases against, 0 caught stealing), and Enos Slaughter off Martinez (PB 0, 1 against, 0 caught). Hit by pitch: Belle by Dean, Slaughter by Coveleski. Wild pitches: Coveleski 1 (the bottom-of-the-1st run) and Isringhausen 1 (the top of the 9th, Lajoie striking out on it and beating the throw; he never scored). Passed balls: none. Counting checks: Cleveland plate appearances 39 (32 AB, 6 BB, 1 HBP) equal St. Louis&#x27;s 39 batters faced (Dean 35, Isringhausen 4); St. Louis plate appearances 34 (32 AB, 1 BB, 1 HBP) equal Cleveland&#x27;s 34 batters faced (Coveleski 22, Wynn 8, Clase 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades: the grades list names both managers directly, so no label mapping is needed. Terry Francona graded 5 decisions (2 paid off, 1 backfired, 2 neutral): two steals at 1 paid off and 1 neutral, two pitching changes at 1 paid off and 1 neutral, and the Speaker pinch-hit backfired. Tony La Russa graded 5 decisions (2 paid off, 2 backfired, 1 neutral): three steals at 2 backfired and 1 neutral, his one pitching change paid off, and the Schoendienst defensive sub paid off. Availability from Game 1 was honored in this game: Feller and Gibson sat. Availability for Game 3 under the convention: Coveleski (14 outs in this game) and Dean (24 outs) are unavailable; Early Wynn (7 outs) is capped at 3 outs; Clase (3 outs) and Isringhausen (3) are free. The series is tied 1-1. Managers: Terry Francona (Cleveland) and Tony La Russa (St. Louis). Venue is Busch Stadium, as printed.">
