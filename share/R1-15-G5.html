  <title>R1-15-G5: Kansas City Royals 8, Baltimore Orioles 1</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-07: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official R1-15 Game 5 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Series: Baltimore Orioles (seed 15) vs Kansas City Royals (seed 18), home pattern 2-2-1-1-1, Game 5 at Oriole Park at Camden Yards. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. David Cone started for Kansas City (5.2 IP, 4 H, 0 R, 0 ER, 1 BB, 2 SO, 0 HR); Kansas City led from the Top 3 on and he left in the Bottom 6 with two out, runners at first and second, and a 5-0 lead, so he takes the win. Mike Flanagan started for Baltimore (6.0 IP, 9 H, 8 R, 8 ER, 4 BB, 7 SO, 1 HR, 1 HB) and is charged with all eight Kansas City runs, the three Top 7 runs included: Brett walked, Witt was hit by a pitch, and Sweeney singled, and all three scored after Bautista replaced him, so Flanagan takes the loss. No save: Jeff Montgomery pitched the Bottom 9 with an eight-run lead, 8-0, and Baltimore&#x27;s only run scored on his watch. Run charges match the printed lines exactly: Baltimore pitching allows 8 (Flanagan 8, and Bautista, Martinez, and Olson none), and Kansas City pitching allows 1 (Montgomery 1, and Cone, Holland, and Herrera none). The duplicate test ran before the number was assigned: the stored games in the series are Game 1 (Baltimore 8, Kansas City 4), Game 2 (Kansas City 8, Baltimore 5), Game 3 (Kansas City 7, Baltimore 2), and Game 4 (Kansas City 4, Baltimore 1), all with different linescores, so this box score is no duplicate and takes the series&#x27; next unplayed number, Game 5. One parent brief figure was corrected on the sources, as in Game 2 of this series: the brief read Greg Holland&#x27;s line as 1 BB and 1 SO, but the Gazette&#x27;s printed pitching table (BB 0, HBP 1, SO 0), its summary line &quot;HBP by: Greg Holland 1&quot;, the Baltimore batting table&#x27;s HBP for Ripken, and the play log (Ripken hit by a pitch in the Bottom 7 on Holland&#x27;s watch, and no Holland walk or strikeout anywhere in the game) all agree, and the totals tie only on the printed reading (Baltimore batting strikeouts 2 against Kansas City pitching strikeouts 2, both Cone&#x27;s; Baltimore batting walks 2 against Cone 1 and Herrera 1), so Holland&#x27;s line is booked as printed: 1.1 IP, 0 H, 0 R, 0 ER, 0 BB, 0 SO, 0 HR, 1 HB. The game: two scoreless innings, then Kansas City scored in bunches off Flanagan. In the Top 3, White singled, Wilson bunted him to second, and Tartabull hit a two-run home run. In the Top 4, Beltrán walked and stole second, Gordon walked, and Pérez singled on the hit and run with both runners scoring. In the Top 5, Brett singled and Beltrán singled him home. In the Top 7, Brett walked, Witt was hit by a pitch, and Sweeney singled on the hit and run with both runners scoring; Bautista came in, Sweeney stole third on Dempsey&#x27;s throwing error, and Beltrán singled him home for the eighth run. Baltimore was shut out for eight innings on four hits and scored only in the Bottom 9: Sisler singled off Montgomery, Powell singled him to third, Ripken flied out, and Brooks Robinson&#x27;s sacrifice fly brought Sisler home. Kansas City stranded 9 and Baltimore 8. Home runs: one, Tartabull&#x27;s two-run shot in the Top 3 off Flanagan. Doubles: none. Triples: none. Errors: one, Dempsey (E2, the throw sailing) on Sweeney&#x27;s Top 7 steal; Kansas City committed none. The Gazette&#x27;s grid footers sit under the batting grids and count the fielding side&#x27;s errors in those half innings, so the printed headers govern the team totals: Kansas City 0, Baltimore 1. Hit batters: two, Witt hit by Flanagan in the Top 7 and Ripken hit by Holland in the Bottom 7; HB 1 for Flanagan and HB 1 for Holland and HBP 1 for Witt and HBP 1 for Ripken are carried as card-sourced values, and every other pitcher&#x27;s HB and every other batter&#x27;s HBP is a card-sourced zero, so the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: three, Wilson&#x27;s bunt in the Top 3 and White&#x27;s bunt in the Top 4 for Kansas City, and Brooks Robinson&#x27;s bunt in the Bottom 7 and his sacrifice fly in the Bottom 9 for Baltimore, the split lines reading SH 1 for Wilson, SH 1 for White, SH 1 and SF 1 for Brooks Robinson, and SH 0 and SF 0 for every other batter. Stolen bases: two, Beltrán in the Top 4 and Sweeney in the Top 7 (third base, on the play Dempsey&#x27;s throw sailed). Caught stealing: none. Double plays grounded into: one, Anderson in the Bottom 1. Substitutions: two with plate appearances, Porter pinch-hitting for Pérez in the Top 7 (a strikeout, then he stayed at catcher and flied out in the Top 9) and Mayberry pinch-hitting for Sweeney in the Top 9 (a strikeout), so the Gazette prints nine Baltimore batting lines and eleven Kansas City batting lines. Baltimore&#x27;s first base line is Sisler&#x27;s: he started and played the whole game at first base, and Murray did not appear. Plate appearances counted fresh from the printed batting lines and the play log enumeration, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Kansas City PA is AB 36 plus BB 5 plus HBP 1 plus SH 2, which is 44, and the outs plus runs plus stranded identity agrees (27 outs plus 8 runs plus 9 stranded is 44); Baltimore PA is AB 31 plus BB 2 plus HBP 1 plus SH 1 plus SF 1, which is 36, and the identity agrees (27 outs plus 1 run plus 8 stranded is 36). Batters faced tie to those totals: Kansas City 44 PA against 44 Baltimore BF (Flanagan 32, Bautista 5, Martinez 3, Olson 4), and Baltimore 36 PA against 36 Kansas City BF (Cone 21, Holland 5, Herrera 4, Montgomery 6). Strikeouts tie both ways: Kansas City batting 12 against Baltimore pitching 12 (Flanagan 7, Bautista 3, Martinez 1, Olson 1), Baltimore batting 2 against Kansas City pitching 2 (Cone 2). Printed RBI: Kansas City 8 for 8 (Tartabull 2, Sweeney 2, Pérez 2, Beltrán 2) and Baltimore 1 for 1 (Brooks Robinson 1). Availability under the house convention, read from Game 4 outs: Greinke (15 outs) and Cuellar (24 outs) were unavailable and did not pitch, both moot on the rotation turn; Appier (6 outs) was capped at 3 outs in this game and did not pitch, so the cap never came into play; Baltimore&#x27;s Game 4 had only Cuellar, so no Baltimore cap was in play; every other pitcher was free. Seventeen decisions were graded. Ned Yost made 14 (7 paid off, 6 backfired, 1 neutral): the Top 7 hit and run with Sweeney batting paid off at +1.81, the game&#x27;s best grade; the Top 4 steal paid off at +1.39 and the Top 4 hit and run at +0.81; all three of his steals paid off; the changes to Holland in the Bottom 6 and Herrera in the Bottom 8 paid off at +0.68 and +0.73; the Porter pinch hit in the Top 7 backfired at -2.03, the game&#x27;s worst grade, Porter striking out with runners at first and third and nobody out; the Top 5 and Top 7 and Top 9 hit and runs backfired at -1.13, -0.61, and -0.76; the change to Montgomery in the Bottom 9 backfired at -0.77; and the Mayberry pinch hit in the Top 9 backfired at -0.73; the Top 5 hit and run was neutral at -0.11. Earl Weaver made 3 (2 paid off, 1 backfired, 0 neutral), all pitching changes: to Bautista in the Top 7 backfired at -0.39, and to Martinez in the Top 8 and Olson in the Top 9 paid off at +0.73 each. Managers: Earl Weaver (Baltimore) and Ned Yost (Kansas City). Venue is Oriole Park at Camden Yards. Kansas City wins the series 4-1 and advances on the winners side; Baltimore drops to the losers side at 0-1 in series and is not eliminated. Series runs: Kansas City 31, Baltimore 17. After losing Game 1, Kansas City won four straight, the last three by a combined 19-4. Series MVP is not yet ruled; the archive series entry carries mvp null pending Joe&#x27;s ruling.">
