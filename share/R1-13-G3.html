  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-04: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-13 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cleveland Guardians (seed 13) vs Los Angeles Angels (seed 20), home pattern 2-2-1-1-1, Game 3 at Angel Stadium of Anaheim. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with two scoring points and one correction settled here and documented, the sources governing throughout. The correction is Joe&#x27;s own, given in chat: an earlier stopped pass at this game described Garret Anderson&#x27;s Bottom 9 homer as a three-run shot; Joe corrected it to a two-run home run, and all three sources confirm him: the play log line reads &quot;Garret Anderson: 2-run HOME RUN!&quot;, the Gazette play line gives &quot;(2 runs)&quot;, and the grid marks two RBI dots on Anderson&#x27;s cell. Anderson is booked with RBI 2 on the homer, and Los Angeles printed RBI ties clean at 9 for 9. The first settlement is the Cleveland Top 8 run. The grid marks Jackson&#x27;s play SAC5, which could read as a sacrifice fly, but the graded log reads &quot;Shoeless Joe Jackson: sacrifice bunt (3B)&quot;: the play is booked as a sacrifice bunt, SH 1 and SF 0 for Jackson, moving Manny Ramirez to second, and Jose Ramirez&#x27;s double behind it drove Manny in for the run. Jackson&#x27;s RBI 2 both come from his singles, in the Top 1 and the Top 2. Jose Ramirez&#x27;s RBI 2 are the Top 4 bases-loaded walk and the Top 8 double. Cleveland printed RBI ties clean at 8 for 8: Speaker 3, Jackson 2, Jose Ramirez 2, Boudreau 1. The second settlement is the Cleveland doubles. The Gazette extras line and the play log give Cleveland three doubles: Speaker in the Top 7, Thome in the Top 2 (a double to CF), and Jose Ramirez in the Top 8; Thome is booked with 2B 1. The decisions are not printed; they are derived from the play log and the run charges on the card. Mark Langston takes the win (2.0 IP, 1 H, 1 ER, 1 BB, 1 SO): he pitched the Top 8 and the Top 9 and was the pitcher of record when Los Angeles walked it off in the Bottom 9. Andrew Miller takes the loss (0.0 IP, 1 H, 1 ER, 1 HR): he faced only Anderson in the Bottom 9, and the go-ahead run is Anderson&#x27;s own run on the walk-off homer, charged to Miller. No save is credited in a walk-off win. The starters take no decisions: Addie Joss (8.0 IP, 10 H, 5 ER, 3 BB, 4 SO, 4 HR) started the Bottom 9 with an 8-4 lead, gave up Ohtani&#x27;s leadoff homer, his fifth run and fourth homer allowed, and left with no out recorded in the ninth and the lead still intact; Frank Tanana (2.1 IP, 8 H, 6 ER, 3 BB, 2 SO, 2 HR) left in the Top 3 trailing 6-2, and Los Angeles came back to win. The Bottom 9 charge sequence, from the log: Ohtani homered off Joss, 8-5; Cody Allen relieved and walked Trout; with the hit and run on, Guerrero struck out while Trout stole second and took third on catcher Martinez&#x27;s throwing error; Allen walked Glaus, and Joyner&#x27;s double scored Trout and Glaus, 8-7; Andrew Miller relieved, and Anderson&#x27;s two-run homer scored Joyner and Anderson himself, 9-8. Allen&#x27;s three charged runs are Trout, Glaus, and Joyner; Miller&#x27;s one charged run is Anderson. Run charges match the printed lines exactly: Los Angeles pitching allows 6 + 1 + 0 + 0 + 0 + 1 = 8 (Tanana the first six, Harvey the Top 4 run, Langston the Top 8 run; Shields, Oliver, and Downs none), and Cleveland pitching allows 5 + 3 + 1 = 9 (Joss five, Allen three, Miller one). The duplicate test ran before the number was assigned: the stored games in the series are Game 1, a 3-2 Cleveland win (Los Angeles 2 0 0 0 0 0 0 0 0, Cleveland 0 0 0 3 0 0 0 0 x), and Game 2, a 2-1 Cleveland win (Los Angeles 0 0 0 0 1 0 0 0 0, Cleveland 0 0 0 0 0 1 0 0 1), and this box score, a 9-8 Los Angeles win on its own linescore with different batting and pitching lines throughout, is no duplicate; it is the third game of the series in play order, booked as Game 3. The game: Cleveland scored in the Top 1 on singles by Lajoie, Manny Ramirez, and Jackson, 1-0. Los Angeles answered at once: Ohtani walked and Guerrero hit a two-run homer, 2-1. Cleveland&#x27;s four-run Top 2 turned the game: Jose Ramirez and Martinez walked, Speaker hit a three-run homer, and after Thome doubled and Manny Ramirez walked, Jackson&#x27;s single scored Thome, 5-2. Boudreau&#x27;s solo homer in the Top 3 made it 6-2 and finished Tanana; Harvey came on. In the Top 4 Cleveland loaded the bases and Jose Ramirez walked in a run, 7-2. Los Angeles got two back in the Bottom 4 on solo homers by Fregosi and Ohtani, 7-4, and the bullpens held it there until the Top 8, when Manny Ramirez walked, Jackson sacrificed him to second, and Jose Ramirez doubled him home, 8-4. Then the Bottom 9 above: five runs on Ohtani&#x27;s homer, two walks, Joyner&#x27;s two-run double, and Anderson&#x27;s two-run walk-off homer. Cleveland stranded 12 and Los Angeles 8. Home runs: seven. Speaker hit a three-run homer in the Top 2 and Boudreau a solo homer in the Top 3 for Cleveland; Guerrero hit a two-run homer in the Bottom 1, Fregosi a solo homer in the Bottom 4, Ohtani solo homers in the Bottom 4 and the Bottom 9, and Anderson the two-run walk-off homer in the Bottom 9 for Los Angeles. Doubles: five, Speaker, Thome, and Jose Ramirez for Cleveland, and Guerrero and Joyner for Los Angeles, Joyner hitting two (Bottom 5 and Bottom 9). Triples: none. Errors: two, one by each club. Grich at second for Los Angeles dropped the throw on Belle&#x27;s steal in the Top 6, and Martinez for Cleveland threw the ball away on Trout&#x27;s steal in the Bottom 9; the Gazette extras lines name both, and each club&#x27;s printed error total is 1. Hit batters: none; HB is carried as 0 for all nine pitchers (Joss, Allen, Miller, Tanana, Harvey, Shields, Oliver, Downs, and Langston) as card-sourced values, and the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: one, Jackson&#x27;s Top 8 bunt, so the split lines read SH 1 for Jackson, SH 0 for every other batter, and SF 0 for every batter, log-proven (no sacrifice fly was hit; the run in the Top 8 scored on the double behind the bunt). Stolen bases: Belle in the Top 6 for Cleveland and Trout in the Bottom 9 for Los Angeles. Caught stealing: Jackson in the Top 6 and Jose Ramirez in the Top 3, both for Cleveland. Double plays grounded into: none for either club. Substitutions: one. Larry Doby replaced Speaker in center field for the Bottom 9 as a defensive substitute; he recorded no plate appearance and carries no batting line, and is carried in this recap only. No other substitution was made by either club. Batters faced are counted from the play log and tie to the batting PA totals both ways (Cleveland 47 PA against 47 Los Angeles BF: Tanana 17, Harvey 9, Shields 5, Oliver 4, Downs 4, Langston 8; Los Angeles 42 PA against 42 Cleveland BF: Joss 37, Allen 4, Miller 1). Cleveland PA is AB 37 plus BB 9 plus SH 1; Los Angeles PA is AB 37 plus BB 5. Cleveland recorded only 25 outs because the Bottom 9 ended on the walk-off homer after one out. Strikeouts tie both ways: Cleveland batting 6 against Los Angeles pitching 6, Los Angeles batting 5 against Cleveland pitching 5. Eighteen decisions were graded. Terry Francona made 9 (3 paid off, 4 backfired, 2 neutral): the Bottom 9 change to Allen backfired at -3.77, the game&#x27;s worst grade, and the Doby defensive sub in the same sequence also graded backfired at -3.77, an error coming behind him; the Bottom 9 change to Miller backfired at -1.59; the Top 6 steal send with Jackson backfired at -1.11, Jackson caught stealing; the Top 2 steal paid off at +3.49, the game&#x27;s best grade, the Top 2 hit and run paid off at +2.89, and the Top 1 steal paid off at +0.49; the Top 3 steal was neutral at -0.11, Jose Ramirez caught stealing in a one-run inning, and the Top 6 steal with Belle was neutral at -0.26. Mike Scioscia made 9 (5 paid off, 1 backfired, 3 neutral): the Bottom 9 hit and run paid off at +2.89, Guerrero striking out while Trout stole second and took third on the error; the Bottom 1 hit and run paid off at +1.74 and the Bottom 1 steal at +1.14, Ohtani held at first before the Guerrero homer; his five pitching changes went: Harvey paid off at +0.50 in the Top 3, Shields neutral at +0.23 in the Top 5, Oliver neutral at +0.23 in the Top 6, Downs paid off at +0.73 in the Top 7, and Langston backfired at -0.77 in the Top 8, the run scoring after the walk, though Langston still took the win; and the Bottom 2 hit and run was neutral at -0.26. Managers: Terry Francona (Cleveland) and Mike Scioscia (Los Angeles). Venue is Angel Stadium of Anaheim. Availability compliance: Ryan (16 outs in Game 2) and Coveleski (12 outs in Game 2) were unavailable under the house convention and correctly went unused; Miller, capped at 3 outs after his 6 outs in Game 2, faced one batter and recorded 0 outs, inside the cap; each club started its rotation number 3, Joss for Cleveland and Tanana for Los Angeles. Game 4 availability: Joss (24 outs in Game 3) is UNAVAILABLE under the house convention, and the rotations turn to the number 4 starters in any case; Tanana (7 outs) is capped at 3 outs; Langston (6 outs) is capped at 3 outs; Harvey (5 outs), Shields, Oliver, and Downs (3 outs each), Allen (1 out), and Miller (0 outs) are free. Cleveland leads the series 2-1. The series stays in Los Angeles for Game 4.">
