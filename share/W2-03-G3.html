  <title>W2-03-G3: Boston Red Sox 8, Houston Astros 2</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 3, Game 3 at Minute Maid Park. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Cy Young takes the win for Boston with a complete game (9.0 IP, 35 BF, 7 H, 2 ER, 2 BB, 3 SO, 1 HR). Mike Scott takes the loss for Houston (2.1 IP, 16 BF, 4 H, 6 R, 3 ER, 4 BB, 2 SO, 1 HR, 1 WP). No save. Scoring: the game opened with matching solo home runs, Ted Williams off Scott in the top of the 1st and Jeff Bagwell off Young in the bottom half. The five-run top of the 3rd decided it, and Scott did not survive it: he walked Speaker, Pedroia and Williams to load the bases with nobody out, and David Ortiz&#x27;s forceout at second scored Speaker (the report&#x27;s decisive play, and an RBI for Ortiz). Scott walked Foxx to reload the bases, and during Dwight Evans&#x27;s at-bat a passed ball scored Pedroia, the game&#x27;s only no-RBI run; Evans struck out on the same sequence but reached on the dropped third strike, and Wade Boggs cleared the bases with a double to center, scoring Ortiz, Foxx and Evans for 3 RBIs. Josh Hader came on and finished the inning (Garciaparra grounded out, Fisk struck out); the Rec&#x27;s extra line reads 1 inherited, 0 scored for Hader. Boston&#x27;s other runs: Garciaparra&#x27;s solo home run off Joe Sambito in the top of the 5th, and one in the top of the 7th when Ortiz doubled off Dave Smith and scored on Evans&#x27;s single. Houston&#x27;s second run came in the bottom of the 6th: Altuve doubled and Berkman doubled him home off Young. Key lines: for Boston, Williams 2 for 4 with the home run, a run and a walk, and the export&#x27;s player of the game; Ortiz 2 for 5 with a double, 2 runs and an RBI; Boggs 1 for 5 with the bases-clearing double and 3 RBIs; Evans 2 for 5 with a run and an RBI; Garciaparra 2 for 4 with the home run. For Houston, Altuve 3 for 4 with two doubles and a run, Alvarez 1 for 4 with a double, Bagwell 1 for 4 with the home run. Pitching lines of note: Young went the distance on 35 batters faced; Hader 1.2 scoreless innings (7 BF, 2 H, 1 SO); Sambito 2.0 IP, 7 BF, 1 H, 1 ER, the run Garciaparra&#x27;s homer; Smith 3.0 IP, 13 BF, 4 H, 1 ER, 1 SO, 1 WP. Errors: none, an errorless game for both clubs. Double plays: Boston turned one (Biggio grounded into it in the bottom of the 5th, the game&#x27;s only printed GIDP and a genuine double-play row in the log); Houston turned none. Stolen bases: none; the game&#x27;s one graded steal decision, Hinch&#x27;s send in the bottom of the 4th, backfired when Altuve did not get a good jump and stayed put. Wild pitches: Scott 1 and Smith 1, as the printed pitching section carries them. Passed balls: Biggio 2, charged in the printed fielding section and in the Rec&#x27;s extra line; the traceable one is the top-of-the-3rd ball during Evans&#x27;s at-bat that scored Pedroia. The defense object books putouts, assists and errors exactly as the printed fielding section carries them: Boston 27 putouts and 7 assists (Ortiz 8 putouts, Williams 6 putouts, Pedroia 2 putouts and 5 assists), Houston 27 putouts and 9 assists (Bagwell 9 putouts, Correa 4 putouts and 3 assists, Bregman 4 assists, Biggio 5 putouts and 1 assist at catcher with the 2 passed balls). One correction to the booking brief: it carried Altuve with one double; the export&#x27;s CSV section, its Rec bat array and the play rows all show two (bottom of the 1st to left, bottom of the 6th to right), and two are booked. Substitutes: none on either side; the only changes were on the mound. Counting checks: Boston plate appearances 43 (39 AB, 4 BB) equal Houston&#x27;s 43 batters faced (Scott 16, Hader 7, Sambito 7, Smith 13); Houston plate appearances 35 (33 AB, 2 BB) equal Young&#x27;s 35 batters faced. Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades: A.J. Hinch graded 5 decisions (2 paid off, 2 backfired, 1 neutral): three pitching changes split 1 paid off, 1 backfired and 1 neutral, the steal send backfired, and leaving his pitcher in paid off. Terry Francona graded no decisions in this game; his final_grades entry is stored as zeros, following the established zero-decision practice. Availability for Game 4 under the convention: Young (27 outs in this game) and Dave Smith (9 outs) are unavailable; Scott (7 outs) and Sambito (6 outs) are capped at 3 outs; Hader (5 outs) is free. Game 2&#x27;s rest rules were honored in this game: Clemens and Oswalt sat. Boston leads the series 3-0. Managers: Terry Francona (Boston) and A.J. Hinch (Houston). Venue is Minute Maid Park, as printed.">
