  <title>W2-04-G2: Chicago White Sox 2, Detroit Tigers 3</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 4, Game 2 at Comerica Park. Detroit wins 3-2 and ties the series 1-1. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: John Hiller takes the win for Detroit (1.0 IP, 3 BF, 0 H), a scoreless top of the 8th with the game tied. Dámaso Marte takes the loss for Chicago (0.1 IP, 4 BF, 2 H, 2 R, 2 ER, 1 BB, 1 SO, 1 HR) and is charged with the blown save in the Rec&#x27;s extra line. Tommy Bridges takes the save (0.1 IP, 1 BF, 1 SO): he entered in the top of the 9th with two inherited runners, the tying run on second, and struck out Carlton Fisk to end the game; the Rec&#x27;s extra line reads 2 inherited, 0 scored for him. Scoring: Detroit scored first, Charlie Gehringer&#x27;s solo home run off Red Faber in the bottom of the 1st. Chicago tied it in the top of the 5th: Luke Appling doubled off Justin Verlander and Fielder Jones singled him home; Jones then stayed put on the steal call and Eddie Collins grounded into an inning-ending double play. Chicago took the lead in the top of the 6th: Frank Thomas singled, Minnie Miñoso bunted and reached when the lead runner was forced, Joe Jackson doubled, and, with Mike Henneman on in relief, Robin Ventura&#x27;s groundout scored Miñoso; the run is charged to Verlander, and Henneman&#x27;s inherited line in the Rec&#x27;s extra line reads 2 inherited, 1 scored. Detroit won it in the bottom of the 8th off Marte: Al Kaline homered to tie the game, Hank Greenberg struck out, Miguel Cabrera walked, and Sam Crawford tripled Cabrera home, the decisive play the export&#x27;s summary names. Hoyt Wilhelm came on and kept it at one run: Bill Freehan&#x27;s fielder&#x27;s choice cut Crawford down at home with the infield in, George Kell singled, and Alan Trammell grounded out; Wilhelm&#x27;s inherited line reads 1 inherited, 0 scored. The top of the 9th: Willie Hernandez took the hold (0.2 IP, 4 BF, 1 H, 1 BB), giving up Ventura&#x27;s single and Appling&#x27;s walk before Bridges closed it. Sam Crawford is the export&#x27;s player of the game: 3 for 3 with a double, the game-winning triple, an RBI and a walk. Key lines: for Detroit, Gehringer 1 for 4 with the home run, Kaline 1 for 4 with the tying home run, Kell 2 for 3 with a hit by pitch; for Chicago, Ventura 2 for 3 with an RBI and a walk, Appling 1 for 3 with a double, a run and a walk, Jackson 1 for 3 with a double. Pitching lines of note: Verlander 5.1 IP, 23 BF, 6 H, 2 ER, 1 BB, 1 SO and the game&#x27;s only wild pitch, the top-of-the-1st third strike that Fielder Jones reached on (Jones struck out, beat the throw, was sacrificed to second and moved to third, and was stranded; the strikeout stands in his line, booked as printed). Faber started for Chicago (5.2 IP, 24 BF, 4 H, 1 ER, 1 BB, 2 SO, 1 HR, 2 HBP: Trammell in the 2nd and Kell in the 4th). Keith Foulke takes a hold in the Rec&#x27;s extra line (1.1 IP, 5 BF, 1 H), entering in the bottom of the 6th with Crawford on second and stranding him (1 inherited, 0 scored). Henneman threw 1.2 scoreless innings for Detroit (5 BF, 1 SO). Errors: none, an errorless game for both clubs; the series&#x27; only errors remain Ventura&#x27;s and Freehan&#x27;s from Game 1. Double plays: Detroit turned one, Collins&#x27;s top-of-the-5th grounder, a genuine double-play row in the log and the game&#x27;s only printed GIDP. One GIDP difference does arise, on the rows&#x27; side: in the bottom of the 7th, Ty Cobb&#x27;s forceout at second (Trammell forced, Cobb safe at first, row seq 58) is coded &quot;DP 6-4-3&quot; in the play rows although only one out was recorded on the play and the play log says no double play was turned; the rows rebuild Cobb with 1 GIDP against his printed 0. Under Joe&#x27;s standing practice the play rows govern and the printed book line is unchanged; the difference is documented here and in the official record. Stolen bases: none, and nobody was caught stealing. Wild pitches: Verlander 1 (the Jones strikeout). Passed balls: none. Substitutes: Dick Allen pinch-hit for Jackson in the top of the 9th and flied out to left. Tony Phillips entered in the top of the 9th as a defensive replacement in left field for Crawford and never batted; he carries no batting line in the export and none is booked, and his fielding line (1 putout, Allen&#x27;s flyout) is booked in the defense object exactly as the printed fielding section carries it. The defense object books putouts, assists and errors exactly as printed: Chicago 24 putouts and 12 assists (Frank Thomas 15 putouts, Appling 5 assists, Ventura 4 assists), Detroit 27 putouts and 18 assists (Greenberg 14 putouts, Trammell 5 assists, Gehringer 5 assists). Counting checks: Chicago plate appearances 36 (33 AB, 2 BB, 1 SH) equal Detroit&#x27;s 36 batters faced (Verlander 23, Henneman 5, Hiller 3, Hernandez 4, Bridges 1); Detroit plate appearances 36 (32 AB, 2 BB, 2 HBP) equal Chicago&#x27;s 36 batters faced (Faber 24, Foulke 5, Marte 4, Wilhelm 3). Hit, walk, hit-by-pitch, home run and strikeout totals tie across the two boxes both ways. Every run carries an RBI (Chicago 2 runs on 2 RBIs, Detroit 3 on 3), and both staffs&#x27; earned runs equal the runs (no unearned runs). Manager grades: the grades list names both managers directly, so no label mapping is needed. Fielder Jones graded 7 decisions (2 paid off, 5 backfired, 0 neutral): his three pitching changes went 2 paid off and 1 backfired (Marte in the 8th), and the sacrifice bunt in the 1st, the steal call in the 5th, the Allen pinch-hit in the 9th and his one hit and run all backfired. Sparky Anderson graded 6 decisions (4 paid off, 1 backfired, 1 neutral): four pitching changes at 3 paid off and 1 neutral, the Phillips defensive sub paid off, and his one hit and run backfired. Series graded totals through two games: Jones 14 decisions (5 paid off, 7 backfired, 2 neutral); Anderson 7 (4 paid off, 1 backfired, 2 neutral). Availability for Game 3 under the convention: Faber (17 outs in this game) and Verlander (16 outs) are unavailable; every other arm used is free (Foulke 4 outs, Marte 1, Wilhelm 2, Henneman 5, Hiller 3, Hernandez 2, Bridges 1, all under 6). Game 1&#x27;s rest rules were honored in this game: Walsh and Newhouser sat, and Cicotte and Lopez, both capped at 3 outs, went unused. The series is tied 1-1. Managers: Fielder Jones (Chicago) and Sparky Anderson (Detroit). Venue is Comerica Park, as printed.">
