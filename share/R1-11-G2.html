  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-02: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-11 Game 2 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Oakland Athletics (seed 22) vs Philadelphia Phillies (seed 11), home pattern 2-2-1-1-1, Game 2 at Citizens Bank Park in Philadelphia, and Oakland leads the series 2-0 with this win. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number, with the run-accounting settlements below and no other knot. The decisions are not printed; they are derived from the play log and the run charges on the card. Andrew Bailey takes the win, a scorer&#x27;s choice: starter Vida Blue pitched only 4.0 innings and faced one batter in the Bottom 5, Klein, whose leadoff home run was Blue&#x27;s sixth run charged, so at under five innings Blue cannot take the win; Liam Hendriks relieved and recorded no outs, allowing Schmidt&#x27;s single and Harper&#x27;s 2-run home run; Bailey then retired Howard, Utley and Ruiz in order, two of them on strikes, for a scoreless Bottom 5 with Oakland ahead 13-8, and the lead never changed hands again (Oakland led from the Top 1 onward and Philadelphia never tied it after the Top 5). Robin Roberts takes the loss: the runs that put Oakland ahead to stay came off him in the Top 1, Philadelphia trailed 6-5 when his work ended after the Top 4, and the Phillies never tied or led again, even though Ranger Suarez gave up the seven-run Top 5 behind him. No save: Dennis Eckersley closed the Bottom 9 with a four-run lead, 15-11. Run charges match the printed lines exactly: Philadelphia pitching allows 6 + 7 + 0 + 1 + 1 = 15 (Roberts six, Suarez seven, Reed none, Lidge one, Papelbon one), and Oakland pitching allows 6 + 2 + 0 + 0 + 2 + 1 + 0 = 11 (Blue six, Hendriks two, Bailey none, Doolittle none, Fingers two, Honeycutt one, Eckersley none). The charge detail: Roberts&#x27;s six are the three in the Top 1 (Henderson unearned, below; Bando and Canseco earned on Canseco&#x27;s 2-run home run), Canseco again in the Top 3 (doubled and scored on Tejada&#x27;s single), and two unearned runs in the Top 4 (Henderson on Rollins&#x27;s error, below; Bando, who scored on McGwire&#x27;s single after the error should have ended the inning), which is why his printed line reads 6 R and only 3 ER. Suarez&#x27;s seven are the entire seven-run Top 5, every run charged to him: Canseco (walked, scored on Steinbach&#x27;s single), Tejada (singled, scored on Ellis&#x27;s single), Steinbach and Ellis (singled, scored on Jackson&#x27;s single), and Henderson, Jackson and McGwire on McGwire&#x27;s 3-run home run. Lidge&#x27;s one is Canseco in the Top 8 (doubled, scored on Murphy&#x27;s single) and Papelbon&#x27;s one is Chavez&#x27;s Top 9 pinch-hit home run. Blue&#x27;s six are the five in the Bottom 4 (Schmidt on Utley&#x27;s double, Howard and Utley on Rollins&#x27;s single, Rollins and Callison on Callison&#x27;s 2-run home run) and Klein&#x27;s Bottom 5 leadoff home run, the one batter Blue faced in the fifth. Hendriks&#x27;s two are Schmidt and Harper in the Bottom 5 (singled, then scored with Harper on Harper&#x27;s 2-run home run). Fingers&#x27;s two are Schmidt and Harper in the Bottom 7, Schmidt unearned (below) and Harper earned on his second home run. Honeycutt&#x27;s one is Ruiz in the Bottom 8. Printed RBI: Oakland 13 (McGwire 4, Canseco 2, Jackson 2, Tejada 1, Murphy 1, Steinbach 1, Ellis 1, Chavez 1) against 15 runs, the two runs without an RBI both being Henderson&#x27;s error runs, settled below; and Philadelphia 10 (Harper 4, Callison 2, Rollins 2, Klein 1, Utley 1) against 11 runs, the one run without an RBI being Ruiz&#x27;s Bottom 8 run, settled below. The settlements: in the Top 1, Henderson singled and stole second, and Bando&#x27;s single plus Schmidt&#x27;s error at third (batter to second) scored him; the scorer charged no RBI on the play, so Henderson&#x27;s run is unearned and carries no RBI, while the two runs on Canseco&#x27;s home run behind it are earned. In the Top 4, Steinbach walked, Ellis flied out, and Henderson forced Steinbach at second; Bando singled Henderson to third, Jackson reached on Rollins&#x27;s error at short and Henderson scored on the play (unearned, no RBI), and McGwire&#x27;s single scored Bando (unearned, coming after what should have been the third out). In the Bottom 7, Schmidt reached on Chavez&#x27;s 2-base error at third and scored on Harper&#x27;s home run: the run is unearned on Fingers&#x27;s line but carries Harper&#x27;s RBI, as a home run run does. In the Bottom 8, Ruiz doubled, Rollins bunted him to third, and he scored on Honeycutt&#x27;s wild pitch during Callison&#x27;s strikeout (the card prints WP: Rick Honeycutt 1), which is why Philadelphia&#x27;s printed RBI total is 10 for 11 runs. The duplicate test ran before the number was assigned: the stored R1-11 Game 1 (Oakland 11, Philadelphia 5) shares neither this game&#x27;s final score nor its linescore, so this box score is no duplicate, and this is the second game of the series in play order, booked as Game 2. The game: Oakland scored three in the Top 1 on Henderson&#x27;s single and steal, Bando&#x27;s single plus error, and Canseco&#x27;s 2-run home run. Canseco doubled and Tejada singled him home in the Top 3, and the two unearned Top 4 runs made it 6-0. Philadelphia&#x27;s five-run Bottom 4 off Blue answered: Schmidt walked, Howard singled, Utley doubled Schmidt home, Rollins singled Howard and Utley home, and Callison hit a 2-run home run to cut it to 6-5. Oakland blew it open with seven in the Top 5 off Suarez, on five singles and McGwire&#x27;s 3-run home run, before Reed came in and shut Oakland down for 2.1 innings. Philadelphia kept hitting: Klein&#x27;s solo home run off Blue leading off the Bottom 5, Harper&#x27;s 2-run home run off Hendriks in the same inning (Bailey then stopped it cold), and Harper&#x27;s second 2-run home run off Fingers in the Bottom 7 after Schmidt reached on Chavez&#x27;s error, cutting it to 13-10. Canseco doubled and Murphy singled him home off Lidge in the Top 8; Ruiz doubled, took third on Rollins&#x27;s bunt, and scored on Honeycutt&#x27;s wild pitch in the Bottom 8; and Chavez, who had pinch-hit in the Top 7 and struck out, hit a solo home run off Papelbon in the Top 9 for the final margin. Eckersley pitched a perfect Bottom 9. Home runs: Oakland three (Canseco, McGwire, Chavez) and Philadelphia four (Callison, Klein, Harper two). Doubles: Canseco two for Oakland and Utley and Ruiz for Philadelphia; no triples. Errors: Philadelphia two (Schmidt in the Top 1, Rollins in the Top 4) and Oakland one (Chavez in the Bottom 7). Hit batters: none; the scorecard grids print an HBP column for every pitcher on both clubs and it reads zero for all twelve, so HB 0 is carried for every pitcher as card-sourced values and the hit batter check runs on real data. Wild pitches, as printed: Blue 1, Honeycutt 1 (the Bottom 8 run described above), and Lidge 1. Sacrifices: Rollins&#x27;s Bottom 8 bunt is the game&#x27;s only sacrifice of either kind, so the split lines read SH 1 for Rollins and SH 0 and SF 0 for every other batter, log-proven. Stolen bases, as printed: Henderson (Top 1). Caught stealing: Henderson (Top 7). Double plays grounded into, counted from the play log: one, Abreu in the Bottom 6 (a 4-6-3 double play behind Doolittle). Substitutions: Oakland made one, Eric Chavez pinch-hit for Sal Bando in the Top 7, stayed in at third base, struck out in the seventh and homered in the ninth (1 for 2); Bando&#x27;s own line carries his Top 1 and Top 4 singles. Philadelphia made no substitution of any kind. Batters faced are counted from the play log and tie to the batting PA totals both ways (Oakland 48 PA against 48 Philadelphia BF: Roberts 22, Suarez 9, Reed 8, Lidge 5, Papelbon 4; Philadelphia 41 PA against 41 Oakland BF: Blue 21, Hendriks 2, Bailey 3, Doolittle 3, Fingers 3, Honeycutt 6, Eckersley 3). Oakland PA is AB 44 plus BB 4; Philadelphia PA is AB 39 plus BB 1 plus Rollins&#x27;s sacrifice bunt. Fourteen decisions were graded. Dick Williams made 9 (5 paid off, 4 backfired, 0 neutral), six of them pitching changes: the Top 1 steal send paid off at +2.39, the game&#x27;s best single grade; the Bottom 5 change to Bailey paid off at +0.73, the Bottom 6 change to Doolittle at +0.73, the Bottom 7 change to Honeycutt at +0.50, and the Bottom 9 change to Eckersley at +0.73; his backfires were the Bottom 5 change to Hendriks at -1.77, the Bottom 7 change to Fingers at -1.27, and the Top 7 pair, the Chavez pinch hitter and the steal send behind it, each at -1.11. Charlie Manuel made 5 (1 paid off, 2 backfired, 2 neutral): the Top 5 change to Suarez backfired at -6.77, the game&#x27;s worst single grade by a wide margin (seven runs scored in the inning behind him), leaving the fatigued Suarez in backfired at -2.77, the change to Reed paid off at +0.35, and the changes to Lidge and Papelbon were neutral at -0.27 each. Managers: Dick Williams (Oakland) and Charlie Manuel (Philadelphia). Venue is Citizens Bank Park. Availability compliance: Hunter (16 outs in Game 1) and Carlton (22 outs) were unavailable under the house convention and correctly did not pitch. Game 3 availability, under the house convention that reads only this game: Blue (12 outs) and Roberts (12 outs) are both UNAVAILABLE, Reed (7 outs) is CAPPED at 3 outs, and Hendriks (0 outs), Fingers (1), Suarez (2), Bailey (3), Doolittle (3), Eckersley (3), Lidge (3), Papelbon (3) and Honeycutt (5) are all free. Both clubs started their rotation number 2, Blue for Oakland and Roberts for Philadelphia; the rotations turn to the number 3 starters for Game 3, the first game in Oakland.">
