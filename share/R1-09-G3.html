  <title>R1-09-G3: Cincinnati Reds 6, Texas Rangers 4</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-10-31: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-09 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cincinnati Reds (seed 9) vs Texas Rangers (seed 24), home pattern 2-2-1-1-1, Game 3 at Globe Life Field, the series&#x27; first game in Texas. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number. The decisions are not printed; they are derived from the play log (Jim Maloney takes the win: he entered the Bottom 7 with the game tied 4-4, retired all six men he faced across the 7th and 8th, and was Cincinnati&#x27;s pitcher of record when Pete Rose&#x27;s 2-run single in the Top 8 put Cincinnati ahead for good; Neftali Feliz takes the loss: he opened the Top 8, gave up Foster&#x27;s double, the intentional walk to Kluszewski and singles to Davis and Rose, and was charged with both go-ahead runs; Aroldis Chapman takes the save: he entered the Bottom 9 at 6-4 and retired Palmeiro, Beltre and Teixeira, striking out two, his second save of the series; Fergie Jenkins takes no decision: 7.0 innings, 10 hits, 4 earned runs, 1 walk, 6 strikeouts, 3 home runs allowed, and he left after the Top 7 with the score tied 4-4). Run charges match the printed lines exactly: Texas pitching allows 4 + 2 + 0 = 6 (Jenkins, Feliz, Kern), and Cincinnati pitching allows 4 + 0 + 0 + 0 + 0 + 0 = 4 (Rijo, Cordero, Franco, Carroll, Maloney, Chapman). Cincinnati scored first, Frank Robinson&#x27;s solo home run off Jenkins in the Top 1, and Texas answered with all four of its runs in the first two innings and nothing after: in the Bottom 1, Ivan Rodriguez and Alex Rodriguez singled around Kinsler&#x27;s caught stealing and a hit and run, and Josh Hamilton hit a 3-run home run off Jose Rijo; in the Bottom 2, Palmeiro walked, took third when Bench&#x27;s throw sailed on the steal send (the game&#x27;s only error), and scored on Beltre&#x27;s double, an RBI double as the card charges it, so the error advanced the runner but did not produce the run, and all four Texas runs are earned. Cincinnati chipped back one swing at a time: Robinson&#x27;s second solo home run in the Top 6, and the tying 2-run home run by Eric Davis in the Top 7 after pinch hitter Ted Kluszewski led off the inning with a single. The Top 8 decided it: Foster doubled off Feliz, Kluszewski was walked intentionally, Edd Roush pinch-ran, Davis singled to load the bases, Larkin struck out, and Rose singled in Foster and Roush for the 6-4 margin; Kern got Morgan to end the inning, and Chapman closed the 9th. Cincinnati&#x27;s bullpen was the story after Rijo: Cordero, Franco, Carroll, Maloney and Chapman threw six scoreless innings with 1 hit, 1 walk and 10 strikeouts between them. Cincinnati&#x27;s printed RBI total is exactly 6 (Rose 2, Robinson 2, Davis 2) against 6 runs, and Texas&#x27;s is exactly 4 (Hamilton 3, Beltre 1) against 4 runs; there is no wild pitch run and no error run in this game, and no run-accounting settlement was needed. Errors: one, Bench&#x27;s throwing error in the Bottom 2, charged to Cincinnati; Texas made none. Sacrifices: none, and no sacrifice flies, for either club; the split SH and SF columns below are all zeros, log-proven. Hit batter: none. The scorecard grids print an HBP column for every pitcher on both clubs, all zeros, so HB 0 is carried for all nine pitchers and HBP 0 for every batter as card-sourced values, and the hit batter check runs on real data. Stolen bases and caught stealing, as printed: Davis stole 2nd in the Top 5; Palmeiro is credited with the Bottom 2 steal on the play Bench&#x27;s throw sailed (he took third on the error); Kinsler was caught stealing in the Bottom 1, the game&#x27;s only caught stealing. One basepath out the log shows only in its base states: in the Top 5, Perez singled and was retired on the bases during Davis&#x27;s single, the log showing 1 out and Davis alone at 1st after the single, which is why the Top 5 records three outs on five plate appearances and why Jenkins&#x27;s batters faced (31), with Feliz&#x27;s 6 and Kern&#x27;s 5, ties Cincinnati&#x27;s 42 plate appearances exactly. Double plays grounded into, counted from the play log: Cincinnati 1 (Bench, Top 9); Texas 0. Substitutions: Kluszewski pinch-hit for Perez in the Top 7 and stayed in as the designated hitter, singling and setting up the tying home run in the 7th and drawing the intentional walk in the 8th, 1 for 1 with a walk and a run; his series pinch hitting is now a single in Game 2 and a single plus an intentional walk here. Roush pinch-ran for Kluszewski in the Top 8 and scored the go-ahead run on Rose&#x27;s single, the reverse of Game 2, when he was thrown out at home; the card&#x27;s printed summary carries a batting line for Roush in this game (0 at-bats, 1 run), unlike Game 2, where it carried none, so the line is written below as the box score carries it, which also keeps Cincinnati&#x27;s batting run total tied at 6. Mark Teixeira started at designated hitter for Texas; Corey Seager did not play. Availability held from Game 2 under the house outs convention: Darvish (13 outs in Game 2) and Walters (17 outs), both unavailable, did not pitch. Game 4 availability, read off this game only (under 6 outs free, 6 to 8 outs capped at 3 outs, 9 or more outs unavailable for the next game): Jenkins threw 21 outs and Rijo 9 outs, so both are unavailable for Game 4; Maloney threw 6 outs and is capped at 3 outs; every other pitcher who appeared threw 5 outs or fewer (Feliz 2, Kern 4, Cordero 3, Franco 3, Carroll 3, Chapman 3) and is free. The rotations turn over to each club&#x27;s number 4 starter for Game 4 in any case, and Game 4 is also at Texas under the home pattern. Twenty-two decisions were graded. Ron Washington made 11 (5 paid off, 6 backfired): his Bottom 1 hit and run paid off at +2.74 (Alex Rodriguez singled and Hamilton homered behind it), the Bottom 1 steal send was graded paid off at +1.89 even though Kinsler was thrown out, because three runs followed in the inning, and the Bottom 2 Palmeiro send paid off at +0.39 with the error on the throw; the other five of his seven steal sends were all held and all backfired; leaving Jenkins in for the Top 7 paid off at +0.73, the Feliz change backfired at -1.27 (the Top 8 go-ahead runs), and the Kern change paid off at +0.73. Sparky Anderson made 11 (5 paid off, 2 backfired, 4 neutral): all five of his pitching changes graded paid off or neutral and none backfired, Cordero and Franco neutral and Carroll, Maloney and the Chapman closer call paid off, the bullpen game that won it; the Kluszewski pinch hit paid off at +1.77 and the Roush pinch runner paid off at +1.37 with the go-ahead run; his four steal sends produced no payoff, two held and backfired and two neutral. Managers: Ron Washington (Texas) and Sparky Anderson (Cincinnati). Venue is Globe Life Field. The series is Cincinnati 2, Texas 1.">
