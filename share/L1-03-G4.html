  <title>L1-03-G4: Philadelphia Athletics 4, Tampa Bay Rays 1</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 3, Game 4 at Tropicana Field, as the graded log prints the venue. #17 Philadelphia Athletics (manager Connie Mack) against #30 Tampa Bay Rays (manager Kevin Cash), home pattern Philadelphia for Games 1, 2, 5 and 7, Tampa Bay for Games 3, 4 and 6. Both clubs carry one series loss, so the loser of the series is eliminated and the winner advances to Losers Round 2. Booked from the full app export set, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the full Rec JSON, the Gazette scorecard PDF, the scorecard photo, and the graded series play-by-play log&#x27;s Game 4 section for the graded decisions. The CSV&#x27;s 88 play rows and the Rec JSON&#x27;s play rows are identical. All sources agree on every figure. The duplicate test ran before the number was assigned: the stored L1-03 series held Game 1 (Philadelphia 7, Tampa Bay 1), Game 2 (Philadelphia 3, Tampa Bay 2) and Game 3 (Tampa Bay 4, Philadelphia 1), all different linescores, so this game takes Game 4. Decisions: Chief Bender takes the win (5.1 IP, 23 BF, 3 H, 0 R, 3 BB, 7 SO; the Rec JSON&#x27;s own win field names him); Shane McClanahan takes the loss (4.0 IP, 16 BF, 4 H, 2 R, 2 ER, 1 BB, 0 SO, 2 HR, 1 WP; the Rec&#x27;s loss field names him). No save: Rube Walberg entered the bottom of the 9th with a 4-0 lead, which is not a save situation. Joe Berry has no decision (2.2 scoreless IP, 11 BF, 1 H, 2 BB, 2 SO; he stranded the bases loaded in the 6th). Scoring: all four Philadelphia runs came on solo home runs. In the top of the 4th, Mickey Cochrane and Jimmie Foxx homered off McClanahan (Baker added a two-out triple and was stranded); Home Run Baker homered off Roberto Hernandez in the top of the 7th; Al Simmons homered off David Price in the top of the 8th. Tampa Bay&#x27;s only run came in the bottom of the 9th off Walberg: Aubrey Huff singled, Toby Hall walked, Kevin Kiermaier forced Hall at second (Huff to third), and pinch-hitter Junior Caminero singled Huff home (Caminero RBI 1). Wendle then singled and Pena popped out to end it with runners at first and third. Each club&#x27;s RBI total equals its run total (PHA 4, TB 1). Philadelphia&#x27;s two errors produced no runs: Home Run Baker&#x27;s error let B.J. Upton reach in the bottom of the 3rd (stranded at second) and Eddie Joost&#x27;s error let Carlos Pena reach in the bottom of the 4th (stranded at first). Tampa Bay was errorless and left 12 runners, the biggest miss the bases loaded with one out in the bottom of the 6th: Bender walked Pena and Zobrist, Berry relieved and walked Lowe to load them, then Bartlett flied out and Huff grounded out. Fielding from the CSV&#x27;s printed fielding section, which agrees exactly with the graded log&#x27;s printed fielding section: Philadelphia 27 putouts and 10 assists with one double play (Zobrist&#x27;s in the bottom of the 2nd, Joost to Collins to Foxx) and the two errors (Joost 1, Baker 1); Tampa Bay 27 putouts and 13 assists with one double play (Moses&#x27;s in the top of the 2nd, Bartlett unassisted at second to Pena). Shane McClanahan threw the game&#x27;s only wild pitch; no passed balls. Elmer Valo&#x27;s top-of-the-7th fly-ball double play on Mack&#x27;s hit and run (Kiermaier caught it and doubled up the runner, Bartlett taking the putout at second) is not a GIDP in the printed line, the same definitional family as the earlier Fletcher and McCovey cases. Counting checks: Philadelphia plate appearances 36 equal Tampa Bay&#x27;s 36 batters faced (McClanahan 16, Castillo 3, Howell 4, Hernandez 4, Price 9); Tampa Bay plate appearances 40 equal Philadelphia&#x27;s 40 batters faced (Bender 23, Berry 11, Walberg 6). Hit, strikeout and walk totals tie across the two boxes both ways. The game&#x27;s play rows traveled with the sources: the 88 native rows were gated against the printed lines before booking and passed gate_pit (every pitching line rebuilt exactly, batters faced included, with the earned-run bound), the linescore gate (rows&#x27; run totals Philadelphia 4, Tampa Bay 1; rows&#x27; errors 2 against Philadelphia and 0 against Tampa Bay), and the PP-WE-2 win probability chain (residual exactly 0.0). gate_bat failed on one field only: Elmer Valo GIDP, rows rebuild 1 (the top-of-the-7th fly-ball double play on the hit and run) against the printed line&#x27;s 0. Under Joe&#x27;s standing practice, ruled 2026-11-10 (the play rows govern over the app&#x27;s printed GIDP definition, and rows are adopted when this definition is the only difference), the rows are adopted verbatim and staged with the booking for the tournament&#x27;s play-by-play store, and the printed line in the book is unchanged. Manager grades: Kevin Cash graded 9 decisions (1 paid off, 3 backfired, 5 neutral): pitching changes 4 (Castillo in the top of the 5th paid off, +0.73; Howell in the top of the 6th neutral, +0.23; Hernandez in the top of the 7th backfired, -0.77; Price in the top of the 8th neutral, -0.27) and pinch hitters 5 (Huff in the bottom of the 5th neutral, -0.00; Kiermaier in the bottom of the 5th neutral, +0.03; Crawford in the bottom of the 5th backfired, -0.73; Wendle in the bottom of the 6th backfired, -0.73; Caminero in the bottom of the 9th neutral, +0.12). Connie Mack graded 3 decisions (1 paid off, 2 backfired, 0 neutral): the bottom-of-the-6th pitching change to Berry paid off (+0.63), the top-of-the-7th hit and run backfired (-0.76, the Valo double play), and the bottom-of-the-9th pitching change to Walberg backfired (-0.77). Availability compliance for this game, checked against Game 3 usage under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Game 3 made Rube Waddell (24 outs) and Blake Snell (12 outs) unavailable for Game 4, and neither pitched; every pitcher used in this game was free (Tampa Bay&#x27;s five Game 3 relievers threw 3 outs each, and Berry did not pitch in Game 3). Availability for Game 5 at Philadelphia: Bender (16 outs) and McClanahan (12 outs) are unavailable; Berry (8 outs) is capped at 3 outs and Price (6 outs) is capped at 3 outs; Walberg, Castillo, Howell and Hernandez threw 3 outs each and are free. Managers: Connie Mack (Philadelphia) and Kevin Cash (Tampa Bay). Venue is Tropicana Field.">
