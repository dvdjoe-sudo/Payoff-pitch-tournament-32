  <title>L1-04-G1: Arizona Diamondbacks 6, Seattle Mariners 13</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 4, Game 1 at T-Mobile Park, as the graded log prints the venue. This booking OPENS the series: the L1-04 slot (Losers Round 1, reseeded losers pool) was formed with this game, #19 Seattle Mariners (manager Lou Piniella) against #29 Arizona Diamondbacks (manager Bob Brenly), home pattern Seattle for Games 1, 2, 5 and 7, Arizona for Games 3, 4 and 6; the formation block stays as the shell carries it (rule reseed-high-vs-low, pool &quot;Losers of the 16 opening-round series&quot;, gate &quot;Round 1 is complete (all 16 opening series)&quot;), with the feeder labels as in the formed L1 entries. Both clubs carry one series loss into this series, so the loser of the series is eliminated and the winner advances to Losers Round 2. Booked from the full app export set, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the standalone plays JSON, the Gazette scorecard PDF, the scorecard photo, and the graded play-by-play log. All sources agree on every figure booked. Decisions: Randy Johnson takes the win for Seattle (7.0 IP, 25 BF, 3 H, 2 R, 2 ER, 1 BB, 8 SO, 1 HR, 1 WP) and Randy Johnson takes the loss for Arizona (1.0 IP, 13 BF, 7 H, 7 R, 7 ER, 3 BB, 2 SO, 1 HR). The same player pitched for both clubs and took both decisions; both lines are booked keyed per (team, player_id) exactly as played, under Joe&#x27;s standing rule from R1-06 Game 4 (Dawson appearing for both clubs in one game): they are different teams, and the game counts exactly as played. No save: Arthur Rhodes entered in the top of the 9th with two outs and Seattle ahead 13-6 and got the last out (0.1 IP, 1 BF). Scoring: Seattle scored three in the bottom of the 1st off Arizona&#x27;s Johnson (Ichiro double, Alex Rodriguez single, Griffey walk, Edgar Martínez&#x27;s two-run single, Buhner&#x27;s RBI single), four in the bottom of the 2nd, all charged to Johnson, who faced four batters in the inning and recorded no outs in it (Ichiro single, Rodriguez walk, Griffey walk, Martínez grand slam), two in the bottom of the 3rd off Andrew Chafin (Ichiro double, Rodriguez two-run home run), and four in the bottom of the 4th off Archie Bradley (Buhner solo home run, Boone single, Seager hit by pitch, and RBI singles by Ichiro, Rodriguez and Griffey). Arizona scored two in the top of the 5th off Seattle&#x27;s Johnson (Finley single, Matt Williams two-run home run), one in the top of the 8th off Andrés Muñoz without a hit (Moreno walk, Goldschmidt walk, a wild pitch during Marte&#x27;s walk, and Gonzalez&#x27;s bases-loaded walk), and three in the top of the 9th off Edwin Díaz (Finley hit by pitch, Moreno walk, Carroll RBI single, Goldschmidt two-run double). Each club&#x27;s RBI total equals its run total (Arizona 6, Seattle 13). The game&#x27;s only hit batsman on the Arizona side, Finley in the top of the 9th, is logged with the flavor line &quot;batter charges the mound&quot;; no ejection appears in any line, and the game is booked exactly as printed. The game was errorless and neither club turned a double play. Ichiro was caught stealing in the bottom of the 6th (Moreno to Marte), the game&#x27;s only completed stolen-base attempt; Piniella&#x27;s other two graded steal sends ended with the runner holding his base. Fielding from the CSV&#x27;s printed fielding section: Arizona 24 putouts and 8 assists; Seattle 27 putouts and 5 assists; no passed balls. Wild pitches: Seattle&#x27;s Johnson one and Muñoz one. Counting checks: Arizona plate appearances 39 (32 AB, 6 BB, 1 HBP) equal Seattle&#x27;s 39 batters faced (Johnson 25, Muñoz 7, Díaz 6, Rhodes 1); Seattle plate appearances 48 (40 AB, 6 BB, 2 HBP) equal Arizona&#x27;s 48 batters faced (Johnson 13, Kim 4, Chafin 5, Bradley 8, Ziegler 5, Valverde 5, Webb 8). Hit, walk and strikeout totals tie across the two boxes both ways. Manager grades: Lou Piniella graded 6 decisions (2 paid off, 4 backfired, 0 neutral): pitching changes 3 (Muñoz in the top of the 8th backfired, -0.77; Díaz in the top of the 9th backfired, -2.77; Rhodes in the top of the 9th paid off, +0.57) and steal sends 3 (the bottom-of-the-2nd send paid off, +3.14, the runner held and four runs scored in the inning; the bottom-of-the-6th send backfired, -0.76, Ichiro caught stealing; the bottom-of-the-8th send backfired, -0.51). Bob Brenly graded 9 decisions (4 paid off, 3 backfired, 2 neutral): pitching changes 6 (Kim in the bottom of the 2nd neutral, +0.23; Chafin in the bottom of the 3rd backfired, -1.27; Bradley in the bottom of the 4th backfired, -3.77; Ziegler in the bottom of the 4th paid off, +0.73; Valverde in the bottom of the 6th neutral, +0.23; Webb in the bottom of the 7th paid off, +0.73), leaving the pitcher in 2 (Chafin in the bottom of the 3rd paid off, +0.50; Bradley in the bottom of the 4th backfired, -1.77), and one hit and run (the top of the 9th, paid off, +1.87). Availability for Game 2 at Seattle, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game; a new series resets availability, so nothing carried over from Round 1): Seattle: Johnson (21 outs) is unavailable; every other Seattle arm is free, nobody capped. Arizona: Webb (6 outs) is capped at 3 outs; every other Arizona arm is free. Managers: Lou Piniella (Seattle) and Bob Brenly (Arizona). Venue is T-Mobile Park, as printed.">
