  <title>R1-01-G2: Miami Marlins 1, New York Yankees 4</title>
  <meta name="description" content="Played by Joe in the playable app and sent to the co-managed tournament games chat on 2026-11-08 as four files: the full graded play by play, the scorecard CSV export, the app scorecard PDF (the Payoff Pitch Gazette, Final Edition, Sunday, November 8, 2026), and the scorecard photo. Joe ruled in chat the same day: &quot;Replace game 2 with this one yanks Marlins,&quot; adopting this playing as the new R1-01 Game 2 under the R1-05, R1-06, and R1-10 Game 1 adoption precedents and the R1-01 Game 1 adoption made earlier that evening; the replaced game (New York 11, Miami 9; W Mike Stanton, L Anthony Bender, SV Mariano Rivera) is preserved untouched in the Yankees records at archive/replaced/. R1-01 is a frozen series and cannot be edited by import, so the replacement was made as a guarded manual edit under Joe&#x27;s ruling, with the validator&#x27;s locked-game fingerprint and the pins the replaced game fed (the locked counting totals and the game&#x27;s played-date pin) reset under dated comments in validate_results.py. The R1-01 series entry and both club records are unchanged, the Yankees having won the replaced game as well, and the series carries no MVP, before or after. All four sources agree on every number: the linescore, the batting and pitching sums, plate appearances against batters faced for every pitcher (Miami 29 against Ruffing&#x27;s 25 and Rivera&#x27;s 4; New York 34 against Alcantara&#x27;s 26, Scott&#x27;s 4, and Ramos&#x27;s 4), and printed RBI (Miami 1 for 1, Sheffield; New York 4 for 4). No seed is printed in any source, so rng_seed is 0, as in the R1-06 and R1-10 adoptions. The decisions are printed in the log: Red Ruffing takes the win (8.0 IP, 2 H, 1 R, 1 ER, 0 BB, 3 SO, 0 HR), Sandy Alcantara the loss (6.0 IP, 7 H, 4 R, 4 ER, 3 BB, 6 SO, 3 HR), and Mariano Rivera the save, a scoreless ninth with a three-run lead. New York&#x27;s runs came on solo home runs by Gehrig in the 2nd and by Ruth and Mantle in the 4th, and on DiMaggio&#x27;s Bottom 6 double after Gehrig singled and Mantle walked. Miami&#x27;s only run came in the 4th and was earned: Castillo singled, stole second on McKeon&#x27;s graded steal call, took third on Yelich&#x27;s sacrifice bunt, and scored on Sheffield&#x27;s groundout. The game was errorless. Hit batters none, printed 0 for both clubs on the scorecard (batter HBP 0 for every hitter and pitcher HB 0 for every pitcher), not a default. Wild pitches none and passed balls none, as printed. Sacrifices: Yelich&#x27;s Top 4 bunt is the game&#x27;s only sacrifice hit (SH 1); there is no sacrifice fly. Grounded into double plays: Ruth (Bottom 1), Berra (Bottom 2), and Realmuto (Top 3). Stolen bases: Castillo&#x27;s steal of second is the game&#x27;s only steal; no caught stealing. Substitutes: Bernie Williams replaced DiMaggio in center field to start the Top 7 (Stengel&#x27;s graded defensive sub) and flied out in his only plate appearance; every other starter on both clubs finished, Miami&#x27;s only changes being its two pitching changes. Defensive lines are booked as a defense object in the established shape, under the same one-series exception Joe directed for the Game 1 replay adopted earlier that evening (he asked for the advanced stats and the defense from these replays), departing from his 2026-11-05 ruling that defensive tracking begins with Winners Round 2 and Losers Round 1 and is never backfilled for Round 1; no other Round 1 game changes, and New York&#x27;s 27 putouts and 13 assists and Miami&#x27;s 24 putouts and 9 assists are exactly the printed fielding tables. Graded decisions, narrated here because final_grades stays empty as in every imported game in this archive: Jack McKeon (Miami) 4 (2 paid off, 0 backfired, 2 neutral): the Top 4 steal paid off (+0.39), the Bottom 6 leave-in of a fatigued Alcantara was neutral (-0.27), the Bottom 7 pitching change to Scott paid off (+0.73), and the Bottom 8 change to Ramos was neutral (+0.23). Casey Stengel (New York) 2 (2 paid off): the Top 7 defensive sub, Williams for DiMaggio, paid off (+0.48), and the Top 9 change to Rivera paid off (+0.73). Managers: Casey Stengel (New York) and Jack McKeon (Miami). Venue is Yankee Stadium. Availability: Game 3&#x27;s recorded lines stand exactly as played under either version of this game, and its data is unchanged; the note is provenance only. Under the replaced game, Alfonseca (6 outs) and Bender (8 outs) were capped at 3 outs for Game 3 and Robertson (9 outs) was unavailable, and Game 3 as played honored those exact marks (Alfonseca and Bender each threw exactly 3 outs and Robertson did not appear). Under this adopted game none of those three threw a pitch in Game 2, so all three stand as free arms retroactively and their Game 3 lines sit inside that reading as well; the unavailable arms under this version are Alcantara (18 outs) and Ruffing (24), and neither appears in Game 3. Rivera threw 3 outs in both versions, Scott threw 3 here and did not appear in the replaced game, and Ramos threw 3 here and did not appear in the replaced game, so Scott&#x27;s 0 outs and Ramos&#x27;s 5 outs in Game 3 are legal under either version. New York leads the series 2-0.">
