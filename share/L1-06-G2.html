  <title>L1-06-G2: Montreal Expos 3, New York Mets 2</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 6, Game 2 at Citi Field, as the master export&#x27;s box score prints the venue. Montreal leads the series 2-0. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every figure in the export agrees with itself across all of its sections. Decisions: Pedro Martinez takes the win for Montreal (6.0 IP, 23 BF, 4 H, 2 R, 2 ER, 2 BB, 5 SO); he is the export&#x27;s Player of the Game. Dwight Gooden takes the loss for New York (5.1 IP, 25 BF, 6 H, 3 R, 3 ER, 2 BB, 6 SO, 2 HR, Vidro and Cabrera). John Wetteland earns the save (1.1 IP, 6 BF, 1 H, 0 R, 1 BB, 2 SO): he entered in the bottom of the 8th with runners at first and third and two out and struck out Strawberry, then in the bottom of the 9th, after Olerud walked and Beltran singled, got Alfonzo and Jones on ground balls to third, stranding the tying run at third and the go-ahead run at second. Scoring: Montreal scored one in the top of the 1st (Vidro solo home run off Gooden). New York scored two in the bottom of the 1st (Lindor doubled, Wright&#x27;s single to right scored him, Strawberry and Piazza walked, and Alonso&#x27;s fielder&#x27;s choice, force at second, scored Wright). Montreal scored two in the top of the 5th (Cabrera&#x27;s solo home run tied it 2-2, Vidro walked, and Walker&#x27;s double to left scored him), and neither club scored again; New York was held scoreless after the 1st. Errors: New York 2, Montreal errorless, and both errors cost nothing: Lindor (shortstop) in the top of the 6th, Dawson reaching on the one-base error; Alfonzo (second base) in the top of the 8th, Carter reaching on the two-base error. Montreal&#x27;s staff earned-run total of 2 ties to New York&#x27;s 2 runs and New York&#x27;s staff total of 3 ties to Montreal&#x27;s 3 runs. Double plays: one turned, by Montreal in the bottom of the 6th (Piazza grounds into a double play, 3-4-3 as the rows code it), matching Piazza&#x27;s printed GIDP of 1; the printed fielding section&#x27;s DP column credits Fairly and Cabrera one each, exactly as printed. Stolen bases: none. Wild pitches: none for either club. Passed balls: none. Substitutes: John Olerud pinch-hit for Alonso in the bottom of the 7th (grounded out to shortstop) and stayed in as the designated hitter, walking in the bottom of the 9th; Brian Schneider replaced Carter at catcher in the bottom of the 8th (three putouts) and never batted; Mike Lansing replaced Vidro at second base in the bottom of the 9th for defense and had no fielding chance, so he carries no fielding line, exactly as the export prints them. Fielding from the CSV&#x27;s printed fielding section: Montreal 27 putouts and 12 assists (Fairly 12 putouts; Cabrera 4 assists); New York 27 putouts and 9 assists (Piazza 12 putouts; Alfonzo 5 assists). Counting checks: Montreal plate appearances 37 (35 AB, 2 BB) equal New York&#x27;s 37 batters faced (Gooden 25, Díaz 5, Wagner 4, Benítez 3); New York plate appearances 36 (32 AB, 4 BB) equal Montreal&#x27;s 36 batters faced (Martinez 23, Reardon 3, Rojas 4, Wetteland 6). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Dick Williams graded 5 decisions, all 5 paid off: pitching changes 3 (Reardon in the bottom of the 7th paid off, +0.73; Rojas in the bottom of the 8th paid off, +0.73; Wetteland in the bottom of the 8th paid off, +0.73) and defensive subs 2 (Schneider at catcher in the bottom of the 8th paid off, +0.48; Lansing at second base in the bottom of the 9th paid off, +0.48). Davey Johnson graded 4 decisions (3 paid off, 1 backfired): pitching changes 3 (Díaz in the top of the 6th paid off, +1.13; Wagner in the top of the 8th paid off, +0.73; Benítez in the top of the 9th paid off, +0.73) and one pinch hitter (Olerud in the bottom of the 7th backfired, -0.73, grounded out). Availability compliance: Steve Rogers (16 outs in Game 1) was unavailable for Montreal and did not pitch; Tom Seaver (8 outs, capped at 3) and Tug McGraw (7 outs, capped at 3) were capped for New York and neither pitched. Larry Walker, ejected in Game 1&#x27;s brawl, played the whole game (4 AB, the go-ahead RBI double in the 5th): the app did not enforce its flavor text&#x27;s five-game suspension, and the book records the Game 1 ejection only, with no suspension machinery, as the Game 1 record set out. Availability for Game 3 at Montreal, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Pedro Martinez (18 outs) is unavailable for Montreal and Dwight Gooden (16 outs) is unavailable for New York; every other arm on both staffs is free; no caps. Managers: Dick Williams (Montreal) and Davey Johnson (New York). Venue is Citi Field, as printed.">
