  <title>R1-11-G4: Philadelphia Phillies 5, Oakland Athletics 2</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-02: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-11 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Oakland Athletics (seed 22) vs Philadelphia Phillies (seed 11), home pattern 2-2-1-1-1, Game 4 at RingCentral Coliseum in Oakland, and Oakland leads the series 3-1 with this Philadelphia win, the Phillies&#x27; first of the series, staving off the sweep. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number, with no run-accounting knot and no settlement needed. The decisions are not printed; they are derived from the play log and the run charges on the card. Curt Schilling takes the win: he threw eight innings (8.0 IP, 6 H, 2 ER, 0 BB, 5 SO, 2 HR), both Oakland runs coming on solo home runs, Jackson in the Bottom 1 and Henderson in the Bottom 6, and the go-ahead runs came off Hudson in the Top 5 while Schilling held the lead the rest of the way. Tim Hudson takes the loss: 5.0 IP, 5 H, 4 ER, 6 BB, 2 SO; he walked Rollins in the Top 5 and Klein&#x27;s two-run single off him put Philadelphia ahead to stay, and he opened the Top 6 by walking Harper and giving Howard a double, and both runners came around on Rollins&#x27;s single off Doolittle, so they charge to Hudson. Jonathan Papelbon takes the save: he entered the Bottom 9 with an exactly three-run lead, 5-2, bases empty, pitched the full inning and retired Jackson, McGwire and Canseco in order, a save on the lead-of-three-plus-one-full-inning prong. Run charges match the printed lines exactly: Oakland pitching allows 4 + 1 + 0 + 0 = 5 (Hudson four, Doolittle one, Bailey none, Honeycutt none), and Philadelphia pitching allows Schilling&#x27;s two against none for Papelbon. The charge detail: Hudson&#x27;s four are Rollins and Ashburn in the Top 5 (Klein&#x27;s single) and Harper and Howard in the Top 6 (Rollins&#x27;s single off Doolittle); Doolittle&#x27;s one is Rollins himself in the Top 6, scored on Callison&#x27;s single; Schilling&#x27;s two are Jackson&#x27;s and Henderson&#x27;s solo home runs. Printed RBI ties as printed with no settlement: Philadelphia 5 (Klein 2, Rollins 2, Callison 1) against 5 runs, and Oakland 2 (Jackson 1, Henderson 1) against 2 runs. The duplicate test ran before the number was assigned: the stored R1-11 games are Game 1 (Oakland 11, Philadelphia 5), Game 2 (Oakland 15, Philadelphia 11) and Game 3 (Oakland 3, Philadelphia 2), none sharing this game&#x27;s final score or linescore, so this box score is no duplicate, and this is the fourth game of the series in play order, booked as Game 4. The game: Jackson&#x27;s solo home run in the Bottom 1 gave Oakland a 1-0 lead that held for four innings while Hudson worked around traffic, six walks on his line, including escaping a bases-loaded two-out jam in the Top 1 when Howard grounded out. Philadelphia broke through in the Top 5: with two out, Rollins walked, Ashburn singled, Callison walked, and Klein singled both runners home for 2-1. In the Top 6, Harper walked and Howard doubled to open the inning, Hudson came out, and Doolittle struck out Utley and got Daulton, but Rollins singled both inherited runners home and Callison singled Rollins home for 5-1. Henderson&#x27;s solo home run in the Bottom 6 was Oakland&#x27;s last run and its last real threat: Oakland managed only three baserunners after the fifth, Steinbach&#x27;s double in the Bottom 8 stranded when Henderson bunted him to third and Chavez flied out. Bailey and Honeycutt held Philadelphia scoreless over the last three innings, and Papelbon closed a clean Bottom 9. Home runs: Oakland two, Jackson and Henderson, both solo; Philadelphia none. Doubles: Klein and Howard for Philadelphia and Steinbach for Oakland; no triples. Errors: one, by Oakland first baseman Mark McGwire in the Top 2 (Utley reached on the error); Philadelphia played errorless ball. Hit batters: none; every pitcher&#x27;s HBP column on both grids reads zero and no batter on either side was hit, so the hit batter check runs on real data. Wild pitches: none. Sacrifices: one, Henderson&#x27;s sacrifice bunt in the Bottom 8, a bunt, so the split lines read SH 1 for Henderson and SH 0 and SF 0 for every other batter, log-proven; there was no sacrifice fly and no other sacrifice on either side. Stolen bases: none; no runner stole a base in the game. Rollins walked in the Top 5 and singled in the Top 6 and scored both times, but he never stole, and his card line reads SB 0. Caught stealing: one, Utley in the Top 2, the game&#x27;s only steal event: he reached on McGwire&#x27;s error and was caught stealing second, exactly as the card records it (CS: Chase Utley). Double plays grounded into, counted from the play log: three. For Philadelphia, Callison in the Top 1 (6-4-3) and Klein in the Top 3 (5-4-3), exactly as the card extras read; for Oakland, Ellis in the Bottom 5 (1-4-3). Substitutions: none by either club; all nine starters on each side played the whole game, Ashburn led off and played center field with Callison in right for Philadelphia, Daulton caught his second straight game and went 1 for 4, and Chavez started at third base again for Oakland with Bando rested. Batters faced are counted from the play log and tie to the batting PA totals both ways (Philadelphia 41 PA against 41 Oakland BF: Hudson 24, Doolittle 6, Bailey 3, Honeycutt 8; Oakland 32 PA against 32 Philadelphia BF: Schilling 29, Papelbon 3). Philadelphia PA is AB 35 plus BB 6, all six walks off Hudson; Oakland PA is AB 31 plus Henderson&#x27;s sacrifice bunt. Six decisions were graded. Charlie Manuel made 3 (1 paid off, 2 backfired, 0 neutral): the Bottom 9 pitching change to Papelbon paid off at +0.73, and his two backfires were the Top 2 steal send that got Utley caught stealing at -1.11 and the Top 3 hit and run at -1.11, the two worst single grades of the game. Dick Williams made 3 (2 paid off, 1 backfired, 0 neutral), all pitching changes: the Top 6 change to Doolittle backfired at -0.79 when Rollins singled both inherited runners home, and the changes to Bailey for the Top 7 and to Honeycutt for the Top 8 paid off at +0.73 each. Managers: Dick Williams (Oakland) and Charlie Manuel (Philadelphia). Venue is RingCentral Coliseum. Availability compliance: Stewart (18 outs in Game 3) and Alexander (24 outs) were unavailable under the house convention and correctly did not pitch. Game 5 availability, under the house convention that reads only this game: Hudson (15 outs) and Schilling (24 outs) are both UNAVAILABLE, Honeycutt (6 outs) is CAPPED at 3 outs, and Doolittle (3 outs), Bailey (3) and Papelbon (3) are all free. Both clubs started their rotation number 4, Hudson for Oakland and Schilling for Philadelphia; the rotations turn to the number 5 starters for Game 5, which goes back to Philadelphia.">
