  <title>R1-09-G4: Cincinnati Reds 0, Texas Rangers 11</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-10-31: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-09 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cincinnati Reds (seed 9) vs Texas Rangers (seed 24), home pattern 2-2-1-1-1, Game 4 at Globe Life Field, the series&#x27; second game in Texas. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log. The decisions are not printed; they are derived from the play log (Gaylord Perry takes the win: 8.0 innings, 6 hits, no runs, 2 walks, 1 hit batter and 5 strikeouts, a shutout carried into the 9th of an 11-0 game; Dolf Luque takes the loss: he started for Cincinnati and was charged with the five runs of the Bottom 3, four of them earned, the inning in which Texas took the lead for good; no save is credited, John Wetteland throwing a scoreless 9th with an 11-run lead). Run charges match the printed lines exactly: Cincinnati pitching allows 5 + 0 + 3 + 3 = 11 (Luque, Carroll, Hahn, Chapman), and Texas pitching allows 0 + 0 = 0 (Perry, Wetteland). One inconsistency inside the sources is settled here: the scorecard PDF&#x27;s printed summary table gives Frank Robinson a walk and no strikeout, but the scorecard grid, the play log and both pitching lines all show Robinson striking out in the Top 4 and never walking (Perry is charged with 2 walks, Pinson&#x27;s and Larkin&#x27;s, and 5 strikeouts, Robinson&#x27;s among them, and Cincinnati&#x27;s plate appearances tie at 37 only on that reading), so Robinson is booked with the strikeout and no walk, and the summary table&#x27;s transposition is noted rather than followed. Texas did all of its scoring in four innings. The Bottom 3 put up five off Luque: Palmeiro led off with a home run, Beltre singled, Sierra forced him, Kinsler reached on Rose&#x27;s error at third on a hit and run, Ivan Rodriguez doubled on the second hit and run of the inning to score Sierra and Kinsler, and Alex Rodriguez hit a 2-run home run. The Bottom 5 put up three off Hahn: Kinsler singled and stole 2nd, Ivan Rodriguez singled him home, Alex Rodriguez singled, Howard reached on Rose&#x27;s second error of the game with Ivan Rodriguez scoring on the play, Hamilton singled to load the bases, and Alex Rodriguez scored on Hahn&#x27;s wild pitch during Gonzalez&#x27;s strikeout (the log annotates the strikeout &quot;(1 run)&quot; and the card charges Hahn WP 1) before Chapman came in and stranded the other two runners. The Bottom 6 put up two off Chapman: Sierra singled, Kinsler, Ivan Rodriguez and Alex Rodriguez walked in succession, the last walk forcing in Sierra, and Howard hit a sacrifice fly to score Kinsler. The Bottom 7 added one: Palmeiro&#x27;s second home run of the game, off Chapman. Perry held Cincinnati scoreless on 6 hits through eight innings, and the Reds stranded 10: Rose reached on Hamilton&#x27;s error to load the bases in the Top 5 before Morgan grounded out, Pinson and Kluszewski stood at the corners in the Top 7, and Votto reached on Beltre&#x27;s error in the Top 8. Wetteland allowed only Kluszewski&#x27;s second single of the game in the 9th. Texas&#x27;s printed RBI total is 9 (Ivan Rodriguez 3, Alex Rodriguez 3, Palmeiro 2, Howard 1) against 11 runs, and the other two runs are accounted on the card: Ivan Rodriguez scored in the Bottom 5 on the play Howard reached on Rose&#x27;s error, which carries no RBI, and Alex Rodriguez scored in the Bottom 5 on Hahn&#x27;s wild pitch. Earned runs as the card prints them: Luque 4 of 5 (Kinsler&#x27;s Bottom 3 run is the unearned one; he reached on Rose&#x27;s error), Hahn 3 of 3 and Chapman 3 of 3, so 10 of Texas&#x27;s 11 runs are earned. Cincinnati scored no runs and its RBI total is 0. Errors: four. Cincinnati made 2, both by Rose at third base (Kinsler&#x27;s Bottom 3 reach and Howard&#x27;s Bottom 5 reach; the card&#x27;s extras list Rose&#x27;s name once and the linescore total is 2). Texas made 2: Hamilton in center field (Rose&#x27;s Top 5 reach) and Beltre at third base (Votto&#x27;s Top 8 reach). Sacrifices: one, Howard&#x27;s Bottom 6 sacrifice fly; no sacrifice bunts for either club. The split SH and SF columns below show SH all zeros and the single SF, log-proven. Hit batter: one. Tony Perez was hit by a Perry pitch in the Top 2. The scorecard grids print an HBP column for every pitcher on both clubs, Perry 1 and all others 0, so HB is carried as card-sourced values (Perry 1, the other five pitchers 0) and HBP 1 for Perez, and the hit batter check runs on real data. Stolen bases and caught stealing, as printed: Kinsler stole 2nd in the Bottom 5, Texas&#x27;s only steal; Ivan Rodriguez was caught stealing in the Bottom 1; Pinson was caught stealing in the Top 2, and no Cincinnati player stole a base. Double plays grounded into, counted from the play log: Cincinnati 1 (Votto, Top 6); Texas 0 (Sierra&#x27;s Bottom 3 and Bottom 7 forceouts are fielder&#x27;s choices, not GIDPs). Substitutions: Ted Kluszewski pinch-hit for Tony Perez in the Top 7 and stayed in as the designated hitter, singling on the hit and run in the 7th and singling again in the 9th, 2 for 2. His pinch-hit first plate appearances in this series now read: retired in Game 1, then singles in Games 2, 3 and 4. Vada Pinson started in left field for Cincinnati; George Foster did not play. Rubén Sierra started at designated hitter for Texas; Mark Teixeira did not play. Edd Roush did not appear. Availability held from Game 3 under the house outs convention: Jenkins (21 outs in Game 3) and Rijo (9 outs), both unavailable, did not pitch, and Maloney, capped at 3 outs, was not used. Game 5 availability, read off this game only (under 6 outs free, 6 to 8 outs capped at 3 outs, 9 or more outs unavailable for the next game): Perry threw 24 outs, Chapman 11 outs and Luque 9 outs, so all three are unavailable for Game 5; Hahn threw 1 out, Carroll 3 outs and Wetteland 3 outs and are free. The rotations turn over to each club&#x27;s number 5 starter for Game 5 in any case, and Game 5 is at Cincinnati under the home pattern, where Chapman&#x27;s unavailability is the headline: Cincinnati&#x27;s closer threw 3.2 innings of long relief in this blowout and cannot pitch Game 5. Twenty-one decisions were graded. Ron Washington made 10 (6 paid off, 3 backfired, 1 neutral): all three of his hit and run calls paid off (Bottom 3, Kinsler&#x27;s error reach, +3.24; Bottom 3, Ivan Rodriguez&#x27;s double, +3.37; Bottom 5, Alex Rodriguez&#x27;s single, +1.39), his six steal sends split evenly (paid off: Bottom 3 Beltre held +3.14, Bottom 5 Kinsler safe +2.39, Bottom 6 Sierra held +1.14; backfired: Bottom 1 Ivan Rodriguez caught -0.76, Bottom 7 Beltre held -0.86, Bottom 7 Sierra held -0.51), and the Wetteland pitching change in the Top 9 graded neutral (+0.23). Sparky Anderson made 11 (4 paid off, 7 backfired): the Carroll change paid off (+0.73), the Hahn change backfired (-2.77, the Bottom 5), and the Chapman change paid off (+1.63, stranding two inherited runners in the Bottom 5); his three decisions to leave Chapman in graded paid off, backfired and paid off (Bottom 6 +1.13, Bottom 7 -0.77 on Palmeiro&#x27;s home run, Bottom 8 +0.73); his three steal sends all backfired (Pinson caught in the Top 2, -0.76; Morgan held in the Top 8, -0.86; Robinson held in the Top 8, -0.51); and the Kluszewski pinch hit graded backfired (-0.61) on expectancy even though Kluszewski singled, as did Anderson&#x27;s hit and run call on the same plate appearance (-0.61). Managers: Ron Washington (Texas) and Sparky Anderson (Cincinnati). Venue is Globe Life Field. The series is tied 2-2.">
