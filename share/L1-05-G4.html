  <title>L1-05-G4: Los Angeles Angels 4, Colorado Rockies 8</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 5, Game 4 at Coors Field, as the master export&#x27;s box score prints the venue. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every source inside the export agrees on every figure booked. Decisions: Matt Belisle takes the win for Colorado (1.1 IP, 4 BF, 0 H, 1 SO; he entered in the top of the 4th with two outs and Los Angeles ahead 4-1, retired Guerrero to end the inning, and threw a scoreless top of the 5th; Colorado tied the game in the bottom of the 4th and took the lead for good in the bottom of the 5th, so he is the pitcher of record, as the export&#x27;s report prints). Jered Weaver takes the loss for Los Angeles (4.2 IP, 22 BF, 7 H, 7 R, 4 ER, 3 SO, 3 HR; all seven Colorado runs through the bottom of the 5th were charged to him). Ubaldo Jimenez takes the save for Colorado (4.0 IP, 15 BF, 3 H, 0 R, 1 SO; he entered the top of the 6th with Colorado ahead 7-4 and threw four scoreless innings to finish the game, a three-plus-inning save, exactly as printed). Scoring: Los Angeles scored one in the top of the 3rd off Marquez, unearned: Boone singled, Ohtani reached on Marquez&#x27;s own error, Trout was hit by a pitch to load the bases, and Guerrero grounded into a double play (shortstop unassisted at second, to first) that scored Boone; no RBI is credited on a double play. Colorado answered with one in the bottom of the 3rd off Weaver, earned (Holliday double, Torrealba strikeout, Tulowitzki popout, Blackmon RBI single). Los Angeles scored three in the top of the 4th off Marquez, all earned: Joyner doubled, Edmonds singled him to third, Grich grounded into a double play that scored Joyner (again no RBI on the play), Fregosi doubled, Boone walked, Ohtani singled Fregosi home, and Trout singled Boone home; Belisle then relieved and retired Guerrero. Los Angeles&#x27;s four runs came on only two credited RBI, Ohtani&#x27;s and Trout&#x27;s singles in the top of the 4th; the other two runs both scored on double-play grounders. Colorado scored three in the bottom of the 4th off Weaver, all unearned: with two outs, Walker doubled, Story reached on Glaus&#x27;s error at third (the would-be third out), and Holliday hit a three-run home run. Colorado scored three in the bottom of the 5th off Weaver, all earned: Tulowitzki popped out, Blackmon hit a solo home run, LeMahieu singled, Helton flied out, and Arenado hit a two-run home run; Harvey relieved and struck out Walker to end the inning. Colorado added one in the bottom of the 7th off Percival, earned (Blackmon groundout, LeMahieu flyout, Helton walk, Arenado RBI double, Walker groundout). Errors: Colorado 1 (Marquez, on Ohtani&#x27;s grounder in the top of the 3rd), Los Angeles 1 (Glaus, on Story&#x27;s grounder in the bottom of the 4th). Colorado turned both of the game&#x27;s double plays (the two ground-ball double plays in the top of the 3rd and top of the 4th); Los Angeles turned none. Stolen bases: Fregosi in the top of the 6th and Ohtani in the top of the 9th, both off Jimenez and both against Torrealba, whose catching line prints 2 stolen bases against and no caught stealings. Wild pitches: Harvey 1, in the bottom of the 6th, moving Torrealba to second during Tulowitzki&#x27;s at-bat (the flyout stranded him). Passed balls: none for either club. Substitutes: Carlos González entered at left field in the top of the 7th for Holliday and grounded out in his only at-bat (bottom of the 8th); Garrett Hampson entered at center field in the top of the 8th for Blackmon as a defensive substitute, never batted, and had no fielding chance, so he carries no batting or fielding line, exactly as the export prints him (his entry is carried in the manager decisions and the play rows). Fielding from the CSV&#x27;s printed fielding section: Los Angeles 24 putouts and 10 assists (Joyner 10 putouts; Grich 4 assists, Fregosi 3, Glaus 3); Colorado 27 putouts and 16 assists (Helton 15 putouts; LeMahieu 7 assists, Story 5, Arenado 4). Counting checks: Los Angeles plate appearances 39 (37 AB, 1 BB, 1 HBP) equal Colorado&#x27;s 39 batters faced (Marquez 20, Belisle 4, Jimenez 15); Colorado plate appearances 35 (34 AB, 1 BB) equal Los Angeles&#x27;s 35 batters faced (Weaver 22, Harvey 5, Percival 5, Shields 3). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Bud Black graded 5 decisions (4 paid off, 1 backfired, 0 neutral): pitching changes 2 (Belisle in the top of the 4th paid off, +0.73; Jimenez in the top of the 6th paid off, +0.73), defensive subs 2 (González at left field in the top of the 7th paid off, +0.48; Hampson at center field in the top of the 8th paid off, +0.48), and one steal (the bottom of the 6th backfired, -0.51, Holliday held at first). Mike Scioscia graded 7 decisions (2 paid off, 2 backfired, 3 neutral): hit and runs 2 (the top of the 1st backfired, -0.76; the top of the 7th backfired, -1.11), pitching changes 3 (Harvey in the bottom of the 5th paid off, +0.35; Percival in the bottom of the 7th neutral, -0.27; Shields in the bottom of the 8th paid off, +0.73), and steal sends 2 (the top of the 6th neutral, -0.26, Fregosi safe; the top of the 9th neutral, -0.26, Ohtani safe). Game 3&#x27;s availability was honored in this game: Frank Tanana (20 outs in Game 3, unavailable) did not pitch, and Aaron Cook (15 outs in Game 3, unavailable) did not pitch. Availability for Game 5 at Los Angeles (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; availability reads only the previous game and lasts exactly one game, so the Game 3 restrictions expire with this game): Los Angeles: Weaver (14 outs) is unavailable; Harvey (4 outs), Percival (3) and Shields (3) are free; every other Los Angeles arm is free, nobody capped. Colorado: Marquez (11 outs) and Jimenez (12 outs) are unavailable; Belisle (4 outs) is free; every other Colorado arm is free, nobody capped. Managers: Mike Scioscia (Los Angeles) and Bud Black (Colorado). Venue is Coors Field, as printed.">
