  <title>R1-09-G5: Texas Rangers 5, Cincinnati Reds 7</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-10-31: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-09 Game 5 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cincinnati Reds (seed 9) vs Texas Rangers (seed 24), home pattern 2-2-1-1-1, Game 5 at Great American Ball Park, the series&#x27; third game in Cincinnati. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number; the one run-accounting settlement below is documented where the play log&#x27;s run annotation and the card&#x27;s printed RBI and wild pitch charges had to be read together. The decisions are not printed; they are derived from the play log (Rob Dibble takes the win: Jim Maloney left in the Top 7 with a 5-2 lead and one out, but Texas tied the game in the inning on runs charged two to Maloney, Howard&#x27;s and Gonzalez&#x27;s, and one to Dibble, Palmeiro&#x27;s, so the lead Maloney left with was lost and he cannot take the win; Dibble finished the Top 7, was Cincinnati&#x27;s pitcher of record when Robinson&#x27;s Bottom 7 home run put the Reds ahead for good, and added a scoreless Top 8; Charlie Hough takes the loss: he started the Bottom 7 in a 5-5 game and gave up Morgan&#x27;s triple and Robinson&#x27;s 2-run home run without recording an out, which is why his line reads 6.0 innings with all 7 Cincinnati runs charged to him; Clay Carroll takes the save: he entered the Top 9 at 7-5 and closed it, Gonzalez struck out, Palmeiro singled, Beltre walked, and Sierra and Kinsler flew out to center). Run charges match the printed lines exactly: Texas pitching allows 7 + 0 + 0 = 7 (Hough, Jeff Zimmerman, Darold Knowles), and Cincinnati pitching allows 4 + 1 + 0 = 5 (Maloney, Dibble, Carroll). The final score matches Game 2&#x27;s (Cincinnati 7, Texas 5 at Cincinnati), but the duplicate test compares linescores too, and everything else differs: the linescore (Texas scored in the 5th and 7th here, against the 7th and 8th in Game 2; Cincinnati in the 2nd, 4th, 5th and 7th, against the 3rd, 5th, 6th and 8th), the starters (the rotation number 5 men, Hough and Maloney, against Walters and Darvish), and every batting and pitching line; it is the next game in play order and is booked as the distinct Game 5. Cincinnati built its lead in layers off Hough, who walked 7: Perez&#x27;s sacrifice fly in the Bottom 2 after Votto&#x27;s double and Pinson&#x27;s groundout moved him to third; Votto&#x27;s solo home run in the Bottom 4; and a 3-run Bottom 5 (Larkin&#x27;s double, Morgan&#x27;s RBI double, walks to Robinson and Bench, a bases-loaded walk to Votto, and Pinson&#x27;s sacrifice fly) for 5-2. Texas&#x27;s runs through six were both in the Top 5: Hamilton singled, Gonzalez doubled on Washington&#x27;s hit and run to score him, and Gonzalez came home later in the inning on the wild pitch settlement below, tying the game 2-2 before Cincinnati&#x27;s Bottom 5 answered. Maloney was otherwise in control: 6.1 innings, 3 hits, 7 strikeouts. The Top 7 tied the game: Howard walked, Hamilton struck out, Gonzalez singled, and Anderson turned to Dibble, whose change graded backfired at -2.37 as Palmeiro walked, Beltre walked to force in Howard, and Sierra singled home Gonzalez and Palmeiro for 5-5 before Kinsler grounded into the 5-4-3 double play that ended the inning. Hough then started the Bottom 7 and never got an out: Morgan tripled and Robinson hit his third home run of the series, the 2-run shot that won the game. Zimmerman finished the Bottom 7 scoreless (Kluszewski&#x27;s pinch-hit groundout among them) and Knowles threw a perfect Bottom 8. Run-accounting settlement, Texas Top 5: the card prints Texas&#x27;s RBI total at 4 (Gonzalez 1, Beltre 1, Sierra 2) against 5 runs, and charges Maloney with 1 wild pitch. The scorecard grid marks each RBI play with red asterisks on the play cell, a convention consistent across both grids in this game (Robinson&#x27;s 2-run home run carries two, each sacrifice fly one, Morgan&#x27;s RBI double one, Gonzalez&#x27;s RBI double one, Beltre&#x27;s bases-loaded walk one). Sierra&#x27;s Top 7 single carries two asterisks and his Top 5 groundout cell carries none, and the printed column credits Sierra with exactly 2 RBI, both on the single; so the un-RBI&#x27;d run is not in the Top 7 at all but in the Top 5: Gonzalez, at third with two out after Palmeiro&#x27;s groundout and Beltre&#x27;s strikeout, scored during Sierra&#x27;s at-bat, and the play log folds the score change into Sierra&#x27;s groundout line (&quot;grounds out to 2B&quot;, TEX 2, CIN 2). The card charges Maloney, who was pitching the Top 5, with the game&#x27;s one Cincinnati wild pitch, and the log narrates no wild pitch anywhere (Hough&#x27;s charged wild pitch is likewise unnarrated and scored nobody, Cincinnati&#x27;s RBI covering all 7 of its runs). The only consistent reading is that Gonzalez scored on Maloney&#x27;s wild pitch during Sierra&#x27;s Top 5 at-bat and Sierra&#x27;s groundout drove in nobody, the same settlement shape as the Key wild pitch in R1-08 Game 3 and the Cordero wild pitch in Game 2 of this series: the log never narrates the wild pitch, the card charges it, and the card governs. Texas&#x27;s printed RBI 4 plus the wild pitch run equals its 5 runs, and Sierra&#x27;s Top 7 single stands as a clean 2-RBI hit exactly as printed. Errors: none, by either club, a clean game in the field. Sacrifices: two sacrifice flies, Perez in the Bottom 2 and Pinson in the Bottom 5, and no sacrifice bunts; the split columns below show SH all zeros and the two SF, log-proven. Hit batter: none. The scorecard grids print an HBP column for every pitcher on both clubs, all zeros, so HB 0 is carried for all six pitchers and HBP 0 for every batter as card-sourced values, and the hit batter check runs on real data. Stolen bases and caught stealing, as printed: no runner stole a base all game; Cincinnati had both caught stealings, Robinson in the Bottom 3 (thrown out on Anderson&#x27;s hit and run as Bench struck out, a strikeout double play) and Pinson in the Bottom 4 after his walk. Double plays grounded into, counted from the play log: Texas 1 (Kinsler, Top 7, ending the tying rally); Cincinnati 0 (Morgan&#x27;s Bottom 1 forceout and Bench&#x27;s Bottom 3 strikeout with Robinson caught stealing are not GIDPs). Substitutions: Ted Kluszewski pinch-hit for Tony Perez in the Bottom 7 and grounded out to second; the spot never batted again, so his line is the one printed plate appearance. His pinch-hit first plate appearances in this series now read: retired in Game 1, singles in Games 2, 3 and 4, and retired again here; the streak of pinch-hit singles is over. Vada Pinson started in left field for Cincinnati again; George Foster did not play. Rubén Sierra started at designated hitter for Texas again; Mark Teixeira did not play. Edd Roush did not appear. Availability held from Game 4 under the house outs convention: Chapman (11 outs in Game 4), Perry (24 outs) and Luque (9 outs), all unavailable out of Game 4, did not pitch. Maloney started for Cincinnati: his Game 3 cap does not carry past Game 4, because the convention reads only the immediately preceding game and he threw no outs in Game 4. Game 6 availability, read off this game only (under 6 outs free, 6 to 8 outs capped at 3 outs, 9 or more outs unavailable for the next game): Maloney threw 19 outs and Hough 18 outs, so both are unavailable for Game 6; Dibble threw 5 outs, Carroll 3, Zimmerman 3 and Knowles 3 and are free; and Chapman, who sat out this game on Game 4&#x27;s outs, is available again. The rotations reset to each club&#x27;s number 1 starter for Game 6 in any case (Ryan for Texas, Hahn for Cincinnati), and the series shifts back to Texas for Game 6 under the home pattern. A quiet night on the decision ledger: eleven decisions graded. Ron Washington made 5 (3 paid off, 2 backfired): the Top 2 hit and run backfired (-0.76, Gonzalez flew out), the Top 5 hit and run paid off at +1.39 (Gonzalez&#x27;s double), both of his pitching changes paid off (Zimmerman in the Bottom 7, +0.73; Knowles in the Bottom 8, +0.73), and the Top 9 steal send backfired (-0.51, Palmeiro held). Sparky Anderson made 6 (1 paid off, 5 backfired): the Bottom 1 steal send backfired (-0.51, Morgan held), the Bottom 3 hit and run backfired (-0.76, the strikeout double play), the Bottom 4 steal send backfired (-1.11, Pinson caught), the Top 7 Dibble change backfired at -2.37 on the runs that tied the game even though Dibble ended up the winning pitcher, the Bottom 7 Kluszewski pinch hit backfired (-0.47), and the Top 9 Carroll change paid off (+0.73) as the closer-by-committee finished the game with Chapman unavailable. Managers: Ron Washington (Texas) and Sparky Anderson (Cincinnati). Venue is Great American Ball Park. Cincinnati leads the series 3-2.">
