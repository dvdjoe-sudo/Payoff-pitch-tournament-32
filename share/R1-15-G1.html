  <title>R1-15-G1: Kansas City Royals 4, Baltimore Orioles 8</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-07: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official R1-15 Game 1 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This game opens the series: Baltimore Orioles (seed 15) vs Kansas City Royals (seed 18), home pattern 2-2-1-1-1, Game 1 at Oriole Park at Camden Yards. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Jim Palmer started for Baltimore and went the distance (9.0 IP, 10 H, 4 R, 4 ER, 3 BB, 0 HBP, 6 SO, 0 HR); Baltimore took the lead for good in the Bottom 2 on his watch and never trailed, so he takes the win. Kevin Appier started for Kansas City and was chased in the Bottom 3 (2.2 IP, 6 H, 7 R, 7 ER, 4 BB, 1 HBP, 0 SO, 2 HR), charged with all seven of Baltimore&#x27;s early runs, so he takes the loss. No save: Palmer pitched a complete game. Run charges match the printed lines exactly: Kansas City pitching allows 8 (Appier 7, Soria 0, Herrera 0, Holland 0, Mingori 0, Quisenberry 1), and Baltimore pitching allows 4 (Palmer 4). The duplicate test ran before the number was assigned: the R1-15 series entry held no stored games, so this box score is no duplicate and takes the series&#x27; first number, Game 1. The game: Kansas City threatened in the Top 1, Wilson doubling and Brett bunting him to third, but Palmer stranded him. Baltimore left two in the Bottom 1. In the Bottom 2, with two out, Dempsey and Blair walked and Bobby Grich hit a three-run homer off Appier, 3-0; Anderson was then hit by a pitch and stranded. Kansas City answered in the Top 3: Pérez singled, Frank White doubled him home, and Wilson singled White home, 3-2, before Wilson was caught stealing to end the rally&#x27;s momentum. Baltimore broke it open in the Bottom 3: Murray singled and Boog Powell hit a two-run homer, 5-2; Brooks Robinson singled, Blair singled him to third, and Grich singled him home, 6-2, chasing Appier; Soria came in and Anderson singled Blair home, 7-2, before Frank Robinson grounded out. Kansas City chipped back in the Top 5, Gordon tripling and White singling him home, 7-3, before Tartabull grounded into a double play. In the Top 7, Porter pinch-hit a walk and White doubled him home, 7-4. Kansas City&#x27;s last chance came in the Top 8, when the Royals loaded the bases with one out on walks to Tartabull and Mayberry around Brett&#x27;s single, but Otis popped out and Gordon struck out, Palmer escaping. Frank Robinson&#x27;s solo homer off Quisenberry in the Bottom 8 made it 8-4, and Palmer closed the Top 9 in order. Kansas City stranded 6 and Baltimore 9. Home runs: three, all Baltimore, Grich&#x27;s three-run shot in the Bottom 2 and Powell&#x27;s two-run shot in the Bottom 3, both off Appier, and Frank Robinson&#x27;s solo shot in the Bottom 8 off Quisenberry. Doubles: three, all Kansas City, Wilson in the Top 1 and White in the Top 3 and Top 7. Triples: one, Gordon in the Top 5. Errors: none on either side. Hit batters: one, Anderson hit by Appier in the Bottom 2; HB 1 for Appier and HBP 1 for Anderson are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: two bunts, Brett in the Top 1 and Anderson in the Bottom 1, so the split lines read SH 1 for Brett, SH 1 for Anderson, and SF 0 for every batter. Stolen bases: none. Caught stealing: two, both Kansas City, Wilson in the Top 3 and Witt Jr. in the Top 6. Double plays grounded into: one, Tartabull in the Top 5. Substitutions: three with plate appearances, Mayberry pinch-hitting for Sweeney in the Top 6 (flyout, then a walk in the Top 8), Porter pinch-hitting for Pérez in the Top 7 (walk and a run, then a flyout in the Top 9), and Sisler replacing Murray at first base for defense in the Top 7 (a single in the Bottom 8), so the Gazette prints eleven Kansas City batting lines and ten Baltimore batting lines. One figure in the parent brief is corrected here on the printed lines: the brief carried Kansas City 38 PA and Baltimore 42 PA, adding a caught stealing on top of the out total, but a caught stealing out is already one of the inning&#x27;s outs; counted from the printed batting lines, Kansas City PA is AB 33 plus BB 3 plus SH 1, which is 37, and Baltimore PA is AB 34 plus BB 5 plus HBP 1 plus SH 1, which is 41, and the play log enumeration and the outs plus runs plus stranded identity agree both ways (Kansas City: 27 outs plus 4 runs plus 6 stranded is 37; Baltimore: 24 outs plus 8 runs plus 9 stranded is 41). Batters faced tie to those totals: Baltimore 41 PA against 41 Kansas City BF (Appier 19, Soria 6, Herrera 4, Holland 3, Mingori 4, Quisenberry 5), and Kansas City 37 PA against Palmer&#x27;s 37 BF. Strikeouts tie both ways: Kansas City batting 6 against Palmer&#x27;s 6, Baltimore batting 4 against Kansas City pitching 4. Twelve decisions were graded. Ned Yost made 10 (4 paid off, 5 backfired, 1 neutral): the Porter pinch hit in the Top 7 paid off at +1.15, the game&#x27;s best grade; the pitching changes to Herrera in the Bottom 5, Holland in the Bottom 6, and Mingori in the Bottom 7 each paid off at +0.73; his steal sends backfired three times, Wilson caught in the Top 3 at -1.11, the game&#x27;s worst grade, Witt Jr. caught in the Top 6 at -0.76, and Tartabull held in the Top 8 at -0.86; the Mayberry pinch hit in the Top 6 backfired at -0.76 and the change to Soria in the Bottom 3 at -0.77; the change to Quisenberry in the Bottom 8 was neutral at -0.27. Earl Weaver made 2 (1 paid off, 1 backfired, 0 neutral): the Sisler defensive sub in the Top 7 backfired at -0.52, and leaving the fatigued Palmer in for the Top 9 paid off at +0.73. Managers: Earl Weaver (Baltimore) and Ned Yost (Kansas City). Venue is Oriole Park at Camden Yards. Game 2 availability from Game 1 outs: Palmer (27 outs) is unavailable under the house convention, moot on the rotation turn; Appier (8 outs) is capped at 3 outs in Game 2; every other pitcher is free. Baltimore leads the series 1-0.">
