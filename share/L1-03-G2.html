  <title>L1-03-G2: Tampa Bay Rays 2, Philadelphia Athletics 3</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 3, Game 2 at Shibe Park (neutral), as the graded log prints the venue. The series was formed with Game 1 (Philadelphia 7, Tampa Bay 1): #17 Philadelphia Athletics (manager Connie Mack) against #30 Tampa Bay Rays (manager Kevin Cash), home pattern Philadelphia for Games 1, 2, 5 and 7, Tampa Bay for Games 3, 4 and 6. Both clubs carry one series loss, so the loser of the series is eliminated and the winner advances to Losers Round 2. Booked from the app export, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the standalone plays JSON, the graded play-by-play log with its fielding lines, the Gazette scorecard PDF and the scorecard photo. All five sources agree on every figure; the scorecard photo merges pinch-hitters into the shared slot row, and the CSV&#x27;s separate substitute lines govern, as booked here. The duplicate test ran before the number was assigned: the stored L1-03 series held only Game 1 (Philadelphia 7, Tampa Bay 1, a different linescore), so this box score takes Game 2. Decisions: Joe Berry takes the win (1.1 scoreless innings: he entered the top of the 8th with runners at first and third and two out and retired pinch-hitter Aubrey Huff, then worked the 9th, allowing only Kevin Kiermaier&#x27;s pinch single); Pete Fairbanks takes the loss, charged with the bottom-of-the-9th run. No save: Berry finished the game himself. Eddie Plank has no decision (7.2 IP, 8 H, 2 R, 2 ER, 4 BB, 9 SO, 34 batters faced) and James Shields has no decision (6.0 scoreless IP, 4 H, 0 BB, 2 SO, 21 batters faced). Run charges close exactly: the two bottom-of-the-8th runs are charged to Jason Adam, whose line reads 2 runs in a third of an inning: Adam walked Eddie Joost and, after Ferris Fain struck out, gave up Eddie Collins&#x27;s single; Fairbanks relieved him, Mickey Cochrane&#x27;s sacrifice bunt moved both runners up, and Al Simmons&#x27;s two-out single scored Joost and Collins to tie the game 2-2. Fairbanks&#x27;s own line carries only the 9th-inning run: Bob Johnson flied out, Home Run Baker walked, Wally Moses doubled Baker to third, and Eddie Joost singled to left to score Baker, the walk-off hit. Tampa Bay&#x27;s runs: in the top of the 2nd, Jason Bartlett tripled and, after Randy Arozarena popped out, Toby Hall singled him home; in the top of the 3rd, Carlos Pena doubled and Ben Zobrist singled him home. Both runs were earned against Plank. Tampa Bay&#x27;s missed chances frame the loss: the Rays loaded the bases with nobody out in the 1st (Upton double, Diaz walk, Longoria single) and got nothing, Pena striking out and Zobrist grounding into the double play; they loaded them again with two out in the 3rd after scoring and Arozarena grounded out; and in the 8th, Lowe walked and Bartlett singled to put runners at first and third with two out before Berry came in and Huff lined out to second. Philadelphia left Johnson at third in the 5th after his leadoff triple. The game was errorless, with one double play each way: Zobrist&#x27;s in the top of the 1st (Collins to Joost to Fain) and Foxx&#x27;s in the bottom of the 4th (Bartlett unassisted at second, to Pena). No home runs, no stolen bases or caught stealings, no wild pitches or passed balls. Fielding from the printed fielding sections, which agree exactly between the CSV and the graded log: Tampa Bay 25 putouts and 7 assists with one double play (the Athletics batted eight full innings plus one out in the 9th); Philadelphia 27 putouts and 7 assists with one double play. Wally Moses had no fielding chances and is omitted from the fielding lines exactly as the sources print him. Counting checks: Tampa Bay plate appearances 39 equal Philadelphia&#x27;s 39 batters faced (Plank 34, Berry 5); Philadelphia plate appearances 35 equal Tampa Bay&#x27;s 35 batters faced (Shields 21, McGee 4, Adam 3, Fairbanks 7). Hit, strikeout and walk totals tie across the two boxes both ways, and each club&#x27;s RBI total equals its run total. The game&#x27;s play rows traveled with the sources: the 83 rows in the standalone plays JSON (identical to the CSV&#x27;s PLAYS (JSON) section) were gated against the printed lines before booking and passed every gate exactly (every batting and pitching line rebuilt from the rows alone, batters faced included, with the earned-run bound; the linescore rebuilt exactly; the rows&#x27; run totals 2 and 3; the rows&#x27; errors 0 against both clubs; and the PP-WE-2 win probability chain closing at a residual of 0.0), and they are staged with the booking for the tournament&#x27;s play-by-play store. Manager grades: Kevin Cash graded 7 decisions (1 paid off, 5 backfired, 1 neutral): pitching changes 3 (McGee in the bottom of the 7th paid off, +0.73; Adam in the bottom of the 8th backfired, -1.77; Fairbanks in the bottom of the 8th backfired, -0.87) and pinch hitters 4 (Huff in the top of the 8th backfired, -0.73; Kiermaier in the top of the 9th was neutral, -0.00; Crawford in the top of the 9th backfired, -0.76; Wendle in the top of the 9th backfired, -0.47). Connie Mack graded 2 decisions (1 paid off, 1 backfired, 0 neutral): the bottom-of-the-7th hit and run backfired (-0.76), and the top-of-the-8th pitching change to Berry paid off (+0.73). Availability compliance for this game, checked against Game 1 usage under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Game 1 made David Price (12 outs) and Lefty Grove (27 outs) unavailable for Game 2, and neither pitched; Jason Adam and Jake McGee (3 outs each in Game 1) were free and pitched legally. Availability for Game 3 at Tampa Bay: Shields (18 outs) and Plank (23 outs) are unavailable; McGee (3 outs), Adam (1 out), Fairbanks (3 outs) and Berry (4 outs) are all free; nobody is capped. Managers: Connie Mack (Philadelphia) and Kevin Cash (Tampa Bay). Venue is Shibe Park (neutral).">
