  <title>R1-06-G5: Montreal Expos 2, Chicago Cubs 3</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as the app scorecard PDF plus the full graded play-by-play text on 2026-10-29; official R1-06 Game 5 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count, and the game closes the series. Box score record: the two sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number. The decisions are not printed; they are derived from the play log (Mordecai Brown entered the top of the 9th with two outs and the game tied 2-2, retired Jose Vidro for the final out, and was the pitcher of record when Chicago walked it off; Jeff Reardon pitched the 8th and 9th for Montreal and the winning run is his; no save). Chicago scored in the 2nd (Hack Wilson single scoring Sammy Sosa), the 7th (Wilson single scoring Billy Williams), and the 9th: Wilson singled, Gabby Hartnett popped out, and Andre Dawson doubled on the hit and run to score Wilson with the walk-off run. Montreal scored twice in the 6th: Larry Walker tripled off Carlos Zambrano and scored on Andre Dawson&#x27;s single off Pedro Strop, and Dawson scored on Gary Carter&#x27;s single. Andre Dawson appears in BOTH lineups again, as in Game 4: he batted 9th for Chicago (1-for-4, the walk-off double, 1 RBI) and 5th for Montreal (1-for-4, 1 RBI, 1 stolen base). Joe ruled in chat on 2026-10-29 (the Game 4 ruling): they are different teams, and the game counts exactly as played, Dawson on both sides. The two printed tables fold hit batters into the BB column, the same fold as Game 4: the batting table prints Billy Williams BB 2 and the pitching table prints Jeff Reardon BB 1, and the play log proves one of those walks is the same hit batter, Williams hit by a Reardon pitch in the Bot 8; Williams walked once for real (Bot 7) and Reardon issued no real walk. So Williams is BB 1, HBP 1 and Reardon is BB 0, HB 1, carried split in the tables below with the play log as the source. Every other walk in the game is a real walk (Chicago batting: Sosa 2; Montreal batting: Guerrero 2, Raines 1; pitching: Vazquez 3, Zambrano 2, Lee Smith 1), and with the split walks tie 3 and 3 and hit batters tie 1 and 1. Sacrifices are printed in the source: SH Gary Carter (Top 4) and SH Gabby Hartnett (Bot 7); no sacrifice flies. Errors: one per club, as printed on the scorecard: Gary Carter (Montreal) and Ron Santo (Chicago, Top 3, Tim Raines reached). No substitutions on either side; all 18 starters finished. Mark Grace started at first base for Chicago; Anthony Rizzo and Pete Crow-Armstrong did not appear. Game 4 availability was honored: Pete Alexander, Bryn Smith, and Andy McGaffigan did not pitch. Bruce Sutter was charged with one wild pitch (printed on the scorecard). Venue is Wrigley Field. Chicago wins the series 4-1; series run totals are Chicago 24, Montreal 15 (Chicago 5, 2, 5, 9, 3; Montreal 4, 4, 4, 1, 2).">
