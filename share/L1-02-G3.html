  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat on 2026-11-08 as three distinct sources: the full graded play-by-play text, the scorecard CSV export, and the app scorecard PDF (the Payoff Pitch Gazette); a fourth file received for this game is byte-identical to the app scorecard PDF (matching MD5), the same document sent twice, so the audit set is the three distinct sources; official L1-02 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Losers Bracket Round 1, Series 2: the Baltimore Orioles (seed 15) against the Washington Nationals (seed 31), from the reseeded pool of the 16 opening-round losers, paired highest against lowest in pairing order. Both clubs carry one series loss into this series, so the loser of this series is eliminated and the winner survives to Losers Round 2. Home pattern 2-2-1-1-1, Game 3 at Nationals Park in Washington, with Game 4 at Washington next and Game 5 back at Baltimore if the series runs that long. Box score record: the three distinct sources carry the linescore, the full batting and pitching lines, the fielding lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Félix Bautista takes the win: he entered with two out in the Bottom 8 and Baltimore trailing 5-3, got Zimmerman to end that inning, and was Baltimore&#x27;s pitcher of record when his club scored six runs in the Top 9 to take the lead for good, then closed the Bottom 9 himself; Dave McNally (7.0 IP) had left with the game tied 3-3, and Gregg Olson, who took the two Bottom 8 runs, never held a lead. Drew Storen takes the loss: he opened the Top 9 with a 5-3 lead, faced three batters, and retired none, and the go-ahead run, Brooks Robinson, who singled off him and scored on Dempsey&#x27;s double off Cordero, is charged to Storen&#x27;s line as printed. There is no save: Bautista, the winning pitcher, finished the game himself. Sean Doolittle is rostered on more than one club in this tournament, and his line here keys under (WSH, doolise01) and never merges with his Oakland lines from W2-01. Run charges match the printed lines exactly: Washington pitching allows 9 (Zimmermann 3, Clippard 0, Doolittle 0, Storen 3, Cordero 3, Rauch 0), and Baltimore pitching allows 5 (McNally 3, Olson 2, Bautista 0). Two of the run charges carry earned-run settlements on the printed lines: Olson&#x27;s two Bottom 8 runs are unearned as printed (his line reads R 2, ER 0), that inning turning on Ripken&#x27;s error, and Zimmermann&#x27;s line reads R 3, ER 2, the Top 6 run unearned as printed, Frank Robinson having taken second on Zimmermann&#x27;s own error before Murray&#x27;s single scored him. The duplicate test ran before the number was assigned: the series had two stored games, Baltimore 6, Washington 1 in Game 1 and Washington 6, Baltimore 4 in Game 2, both different linescores, so this box score takes Game 3. The game: Washington struck first in the Bottom 1, Soto doubling to left and Harper singling him home. Baltimore answered in the Top 2, Powell singling and Ripken hitting a two-run home run off Zimmermann for 2-1. Washington retook the lead in the Bottom 3: Soto walked, Harper doubled him home to tie it, and Rendon singled Harper home for 3-2. Baltimore tied it in the Top 6: Frank Robinson singled and took second on Zimmermann&#x27;s error, and Murray singled him home, the run unearned as printed. Washington then loaded the bases in the Bottom 6 on singles by Johnson and Ramos and a walk to Turner, but Soto grounded out, and in the Bottom 7 Murphy singled and Johnson walked with two out before Ramos flied out. Doolittle walked Grich and Frank Robinson in the Top 8 and Baltimore stranded both. The Bottom 8 put Washington in front: Olson came in for McNally, Span singled, Turner popped out to third on the hit and run, the steal call came and Span did not get a good jump and stayed put, Soto singled and Ripken&#x27;s error moved Span to third and Soto to second, Harper&#x27;s sacrifice fly scored Span, and Rendon&#x27;s single scored Soto, both runs unearned as printed, for 5-3. Baltimore&#x27;s Top 9 scored six runs before an out was recorded: Storen came in, Werth went to left field for Soto, Powell walked, Ripken doubled Powell home for 5-4, and Brooks Robinson singled Ripken home to tie it 5-5; Cordero came in, Dempsey doubled Brooks Robinson home for the lead at 6-5, Blair singled Dempsey home for 7-5, and Grich hit a two-run home run for 9-5; Rauch came in and struck out Anderson, got Frank Robinson on a groundout, and struck out Murray. In the Bottom 9 Sisler went to first base for Murray, Murphy walked, Johnson and Ramos each bunted him a base, and Bautista struck out Span to end it. Washington stranded 14 and Baltimore 4. Home runs: two, Ripken&#x27;s two-run shot in the Top 2 and Grich&#x27;s two-run shot in the Top 9, both scoring the batter and one runner. Doubles: four, Soto and Harper for Washington and Ripken and Dempsey for Baltimore. Triples: none. Errors: two, one a side: Zimmermann for Washington (E1, Top 6, on Frank Robinson&#x27;s single, the batter taking second) and Ripken for Baltimore (E6, Bottom 8, on Soto&#x27;s single, Span taking third and Soto second), and the archive summary carries both errors_by entries in the established shape. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: two as printed, McNally 1 and Storen 1, carried in the printed pitching lines and the Gazette&#x27;s WP lines; neither is narrated as its own play in the log text. Passed balls: none, the fielding tables printing PB 0 for Dempsey and for Ramos. Sacrifices: three: Harper&#x27;s sacrifice fly in the Bottom 8 and the two Bottom 9 bunts, Johnson&#x27;s and Ramos&#x27;s, each moving Murphy one base; every other batter reads SH 0 and SF 0. Stolen bases: none, and none caught; Martinez sent Span in the Bottom 8 and Span did not get a good jump and stayed put, the sources charging no attempt, and Dempsey&#x27;s catching line reads no steals against. Double plays grounded into: two, one a side: Ramos for Washington in the Bottom 2 (4-6-3 through Grich, Ripken, and Murray) and Frank Robinson for Baltimore in the Top 3 (6-4-3 through Turner, Murphy, and Zimmerman); each club turned one double play. Substitutions: two, one a side, both defensive: Jayson Werth replacing Soto in left field for the Top 9 for Washington, never batting and with no fielding chance, exactly as the sources print them, so he appears in no batting or fielding line; and George Sisler replacing Murray at first base for the Bottom 9 for Baltimore, never batting but taking both Bottom 9 bunt putouts, so his defense players line carries 2 putouts with no batting line. Defensive lines are built with this booking under Joe&#x27;s 2026-11-07 standing instruction: errors_by carries both entries in the established shape, and a defense object in the established shape (Baltimore 27 putouts and 11 assists, Washington 27 putouts and 9 assists; Dempsey&#x27;s 3 catcher putouts are exactly Washington&#x27;s 3 strikeouts, and Ramos&#x27;s 6 are exactly Baltimore&#x27;s 6 strikeouts, with no caught stealing to adjust either tie; wild pitches as printed, McNally 1 for Baltimore and Storen 1 for Washington with every other pitcher at 0, and passed balls true zeros for both catchers). Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Baltimore PA is AB 37 plus BB 3, which is 40, and the outs plus runs plus stranded identity agrees (27 outs plus 9 runs plus 4 stranded is 40); Washington PA is AB 36 plus BB 7 plus SH 2 plus SF 1, which is 46, and the identity agrees (27 outs plus 5 runs plus 14 stranded is 46). Batters faced tie to those totals: Baltimore 40 PA against 40 Washington BF (Zimmermann 23, Clippard 3, Doolittle 5, Storen 3, Cordero 3, Rauch 3), and Washington 46 PA against 46 Baltimore BF (McNally 36, Olson 5, Bautista 5), counted from the card. Strikeouts tie both ways: Baltimore batting 6 against Washington pitching 6 (Zimmermann 4, Rauch 2), and Washington batting 3 against Baltimore pitching 3 (McNally 2, Bautista 1). Printed RBI: Baltimore 9 for 9 (Ripken 3, Grich 2, Murray 1, Brooks Robinson 1, Dempsey 1, Blair 1) and Washington 5 for 5 (Harper 3, Rendon 2); every run in the game carried an RBI. Availability from Game 2 was honored: Strasburg (9 outs in Game 2) and Mussina (18 outs) were unavailable and neither was used, every other arm on both clubs was free, and all usage stayed inside it. Availability for Game 4, read from Game 3 outs under the standing convention (under 6 outs free, 6 to 8 outs capped at 3, 9 or more unavailable): McNally (21 outs) and Zimmermann (18 outs) are unavailable, every other arm on both clubs threw 5 outs or fewer and is free, and nobody falls in the capped band. Twelve decisions were graded. Dave Martinez (Washington) made 9 (6 paid off, 3 backfired, 0 neutral): the Top 6 leave-in of Zimmermann, fatigued by the book, paid off at +0.47; the Top 7 pitching change to Clippard paid off at +0.73; the Top 8 pitching change to Doolittle paid off at +0.73; the Bottom 8 hit and run paid off at +0.89; the Bottom 8 steal paid off at +1.49, Span held and two runs scoring in the rest of the inning; the Top 9 pitching change to Storen backfired at -5.77, the game&#x27;s worst grade (Powell walked and six runs scored in the rest of the inning); the Top 9 defensive sub of Werth in left backfired at -5.52; the Top 9 pitching change to Cordero backfired at -3.39 (Dempsey doubled and four runs scored in the rest of the inning); and the Top 9 pitching change to Rauch paid off at +0.73. Earl Weaver (Baltimore) made 3 (2 paid off, 1 backfired, 0 neutral): the Bottom 8 pitching change to Olson backfired at -1.77 (Span singled and two runs scored in the rest of the inning); the Bottom 8 pitching change to Bautista paid off at +0.47; and the Bottom 9 defensive sub of Sisler at first base paid off at +0.48. Managers: Earl Weaver (Baltimore) and Dave Martinez (Washington). Venue is Nationals Park. Baltimore leads the series 2-1.">
