and is marked as a substitute in the tables. It is the game&#x27;s only substitution; Los Angeles made none. The third settlement is the two runs the card leaves without an RBI, both booked exactly as printed, the same shape as R1-12 Game 5. Cleveland&#x27;s printed RBI total is 9 for 10 runs: Speaker has two run-scoring plays, the Top 2 flyout that scored Martinez from third and the Top 3 double that scored Boudreau, but his printed line carries RBI 1, the card scores the Top 2 play as a plain flyout at-bat (his AB is 5, the flyout counting as an at-bat) and Cleveland&#x27;s extras list no sacrifice fly, so the Top 2 run is booked with no RBI and Speaker carries SF 0. Los Angeles&#x27;s printed RBI total is 6 for 7 runs: Trout&#x27;s printed line is RBI 3, all of them on his Bottom 5 three-run single (the Gazette play line reads 3 runs), so his Bottom 9 sacrifice fly, though the extras print it as a sacrifice fly (SF: Mike Trout, Jim Fregosi), carries no RBI on the card, and Ohtani&#x27;s Bottom 9 run is booked with no RBI; Fregosi&#x27;s Bottom 5 sacrifice fly on the same card does carry its RBI (Fregosi RBI 1). The decisions are not printed; they are derived from the play log and the run charges on the card. Bob Feller takes the win (6.0 IP, 5 H, 6 ER, 7 BB, 9 SO, 1 HR): Cleveland led from the Top 2 on, he was the pitcher of record throughout, and the lead was never lost. Nolan Ryan takes the loss (1.2 IP, 4 H, 6 ER, 3 BB, 2 SO, 1 HR): all six Top 2 runs are charged to him before Harvey relieved him with two out. No save is credited: Allen entered the Bottom 9 with a four-run lead (10-6) and the final margin was three (10-7), the tying run never reaching the plate. Run charges match the printed lines exactly: Cleveland pitching allows 7 (Feller 6, Allen 1; Smith and Clase none), and Los Angeles pitching allows 10 (Ryan 6, Harvey 4; Oliver, Downs, Percival, and Finley none). The duplicate test ran before the number was assigned: the stored games in the series are ut singled all three remaining runners home, 10-5. Los Angeles loaded the bases again in the Bottom 6 on singles by Grich and Boone and Ohtani&#x27;s walk, but Trout grounded out. Guerrero&#x27;s leadoff homer in the Bottom 7, on the settled charge to Feller, made it 10-6, and Smith closed the inning. In the Bottom 8 Fregosi singled off Clase but was caught stealing on Boone&#x27;s hit-and-run strikeout, a strikeout and caught stealing double play. Allen worked the Bottom 9: Ohtani tripled and scored on Trout&#x27;s sacrifice fly on the settled no-RBI accounting, 10-7, Guerrero doubled, and Allen struck out Glaus and got Joyner&#x27;s lineout to shortstop to end it. Cleveland stranded 7 and Los Angeles 7. Home runs: two, Thome&#x27;s two-run homer in the Top 2 for Cleveland and Guerrero&#x27;s solo homer in the Bottom 7 for Los Angeles. Doubles: six, Speaker, Lajoie, Manny Ramirez, and Jose Ramirez for Cleveland and Guerrero and Boone for Los Angeles. Triples: two, Martinez for Cleveland and Ohtani for Los Angeles. Errors: none by either club; both printed error totals are 0. Hit batters: none; HB is carried as 0 for all ten pitchers (Feller, Smith, Clase, and Allen for Cleveland; Ryan, Harvey, Oliver, Downs, Percival, and Finley for Los Angeles) as card-sourced values, and the hit batter check runs on real data. Wild pitches: three, Feller 1, Ryan 1, and Downs 1, per the Gazette extras lines. Passed balls: none. Sacrifices: one bunt, Boudreau in the Top 2, and two sacrifice flies for Los Angeles, Fregosi in the Bottom 5 and Trout in the Bottom 9, so the split lines read SH 1 for Boudreau and SF 1 each for Fregosi and Trout, log-proven; Speaker&#x27;s Top 2 flyout is not a sacrifice fly on the card on the settled accounting above. Stolen bases: one, Lofton in the Top 3. Caught stealing: two, Speaker in the Top 8 and Fregosi in the Bottom 8. Double plays grounded into: one, Jose Ramirez in the Top 4; the Bottom 8 strikeout and caught stealing is not one, counted from the play log. Substitutions: one, Belle&#x27;s pinch hit for Lofton in the Top 9 on the settled accounting above. Batters faced are counted from the play log and tie to the batting PA totals both ways (Cleveland 44 PA against 44 Los Angeles BF: Ryan 12, Harvey 9, Oliver 5, Downs 3, Percival 4, Finley 11; Los Angeles 41 PA against 41 Cleveland BF: Feller 30, Smith 3, Clase 3, Allen 5). Cleveland PA is AB 38 plus BB 5 plus SH 1; Los Angeles PA is AB 32 plus BB 7 plus SF 2. Strikeouts tie both ways: Cleveland batting 6 against Los Angeles pitching 6, Los Angeles batting 12 against Cleveland pitching 12. Eighteen decisions were graded. Terry Francona made 9 (3 paid off, 5 backfired, 1 neutral): of his five steal sends, Lofton&#x27;s Top 3 steal paid off at +3.39 and four backfired, Lajoie held in the Top 1 at -0.51, Lofton held in the Top 4 at -0.86, Speaker caught stealing in the Top 8 at -1.11, the game&#x27;s worst grade, and Belle held in the Top 9 at -0.51; his pitching changes to Smith and Clase paid off at +0.73 each, the change to Allen backfired at -0.77, and the Belle pinch hit was neutral at -0.00, Belle singling. Mike Scioscia made 9 (3 paid off, 3 backfired, 3 neutral): his Bottom 5 steal send, Joyner held but the five-run inning rolling behind it, paid off at +4.14, the game&#x27;s best grade; the pitching changes to Percival and Finley paid off at +0.73 each and the changes to Harvey (-0.15), Oliver (-0.03), and Downs (+0.23) were neutral; leaving the fatigued Harvey in for the Top 3 backfired at -0.87, and both hit and runs backfired at -0.76, Guerrero&#x27;s Bottom 5 groundout and Boone&#x27;s Bottom 8 strikeout with Fregosi caught stealing behind it. Managers: Terry Francona (Cleveland) and Mike Scioscia (Los Angeles). Venue is Angel Stadium of Anaheim. Availability compliance: Feller and Ryan were the clubs&#x27; rotation turns for Game 6 and each had no line in Game 5, so both were free; McDowell (15 outs in Game 5) and Langston (18 outs in Game 5), both unavailable, were correctly unused. Game 7 availability: Feller (18 outs in Game 6) and Finley (9 outs in Game 6) are UNAVAILABLE under the house convention; Ryan (5 outs) is free, though the rotations decide Game 7 in any case, and McDowell and Langston, who sat out Game 6, are free again, availability reading only the previous game; Harvey (3 outs), Oliver (4 outs), Downs, Percival, Smith, Clase, and Allen (3 outs each) are free. The series is tied 3-3. Game 7 is at Cleveland.">
