  <title>L1-04-G3: Seattle Mariners 5, Arizona Diamondbacks 1</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 4, Game 3 at Chase Field, as the graded log prints the venue. Booked from the full app export set, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the standalone plays JSON, the Gazette scorecard PDF, the scorecard photo, and the graded play-by-play log. All sources agree on every figure booked. Decisions: Jamie Moyer takes the win for Seattle (7.0 IP, 26 BF, 4 H, 1 R, 1 ER, 1 BB, 5 SO). Brandon Webb takes the loss for Arizona (7.0 IP, 33 BF, 7 H, 5 R, 5 ER, 6 BB, 6 SO): all five Seattle runs are charged to his line. No save: Edwin Díaz pitched a scoreless bottom of the 9th (1.0 IP, 4 BF, 2 SO) but entered with a four-run lead, 5-1, which is not a save situation. Scoring: Seattle scored two in the top of the 4th off Webb (Griffey double, Martínez walk, Buhner groundout advancing both runners, Raleigh sacrifice fly, Davis walk, Boone RBI single), two in the top of the 5th (Ichiro triple, Rodriguez walk, Griffey sacrifice fly, Martínez strikeout, Buhner RBI double), and one in the top of the 7th (Griffey walk, Martínez walk, Buhner RBI single). Arizona scored its only run in the bottom of the 4th off Moyer: Goldschmidt led off with a single, Counsell reached on catcher Raleigh&#x27;s error on a bunt (E2), Gonzalez singled Goldschmidt home, Walker walked to load the bases, Finley popped out, and Williams grounded into an inning-ending double play. The run is earned as printed: Goldschmidt reached on a clean single and was driven in by a clean hit, and Moyer&#x27;s line carries the earned run; the error put the second runner aboard but no unearned run scored. Each club&#x27;s RBI total equals its run total (Seattle 5, Arizona 1). Errors: two, both Seattle&#x27;s, and errors_by carries them in the established shape: Raleigh E2 in the bottom of the 4th (Counsell&#x27;s bunt) and Seager E5 in the bottom of the 9th (Walker reached leading off the inning; Seager had pinch-hit for Beltré in the top of the 8th and stayed in at third base). Arizona was errorless. Double plays: one each. Arizona turned the Beltré double play in the top of the 3rd (6-4-3, Perdomo to Counsell to Goldschmidt, after Davis and Boone opened the inning with singles), and Seattle turned the Williams double play in the bottom of the 4th (4-6-3, Boone to Rodriguez to Davis) to end Arizona&#x27;s only scoring inning with the bases loaded. Substitutions: Kyle Seager pinch-hit for Beltré in the top of the 8th (he struck out against Valverde) and stayed in at third base, which is where his 9th-inning error came; he carries a batting line (AB 1) and a defense line (1 error). Craig Counsell started at second base for Arizona with Marte sitting: AB 4, H 2, and a part in the double play. No stolen bases were attempted successfully and none was caught; the game&#x27;s one graded steal decision (Piniella&#x27;s top-of-the-5th send) ended with Rodriguez holding his base after his walk, and Rodriguez later scored on Buhner&#x27;s double. Fielding from the CSV&#x27;s printed fielding section: Seattle 27 putouts and 7 assists with the 2 errors; Arizona 27 putouts and 8 assists, errorless; no wild pitches and no passed balls. Counting checks: Seattle plate appearances 39 (31 AB, 6 BB, 2 SF) equal Arizona&#x27;s 39 batters faced (Webb 33, Valverde 3, Kim 3); Arizona plate appearances 35 (33 AB, 2 BB) equal Seattle&#x27;s 35 batters faced (Moyer 26, Muñoz 5, Díaz 4). Hit, walk and strikeout totals tie across the two boxes both ways (Seattle batting 9 strikeouts against Arizona pitching 9: Webb 6, Valverde 2, Kim 1; Arizona batting 9 against Seattle pitching 9: Moyer 5, Muñoz 2, Díaz 2). Manager grades: Lou Piniella graded 4 decisions (3 paid off, 1 backfired, 0 neutral): the top-of-the-5th steal send paid off, +0.49 (Rodriguez held, and one run scored in the rest of the inning); the top-of-the-8th pinch hitter (Seager, platoon) backfired, -0.35; and two pitching changes paid off at +0.73 each (Muñoz in the bottom of the 8th, Díaz in the bottom of the 9th). Bob Brenly graded 3 decisions (2 paid off, 0 backfired, 1 neutral): leaving Webb in for the top of the 7th, fatigued by the book, was neutral, -0.27; and two pitching changes paid off at +0.73 each (Valverde in the top of the 8th, Kim in the top of the 9th). Availability audit for this game, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Curt Schilling (21 outs in Game 2) and Félix Hernández (18 outs in Game 2) were both UNAVAILABLE, and neither pitched (the starters were Webb and Moyer). Both clubs stayed legal. Availability for Game 4 at Arizona: Webb (21 outs) and Moyer (21 outs) are unavailable; Valverde (3 outs), Kim (3), Muñoz (3) and Díaz (3) are all free; nobody is capped on either side. Managers: Lou Piniella (Seattle) and Bob Brenly (Arizona). Venue is Chase Field, as printed. Seattle leads the series 3-0, and Arizona faces elimination in Game 4: the loser of this series is eliminated.">
