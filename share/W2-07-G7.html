  <title>W2-07-G7: Los Angeles Dodgers 5, Atlanta Braves 0</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 7, Game 7 at Truist Park. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Los Angeles beat Atlanta 5-0 to win the series four games to three, scoring four times in the 1st and once in the 3rd, all five runs off Warren Spahn and four of them unearned. Decisions: Dazzy Vance takes the win for Los Angeles with a complete-game shutout (9.0 IP, 31 BF, 3 H, 0 R, 0 ER, 2 BB, 6 SO); he is the export&#x27;s player of the game. Warren Spahn takes the loss for Atlanta (8.0 IP, 33 BF, 5 H, 5 R, 1 ER, 3 BB, 6 SO, 3 HR). Kid Nichols (1.0 IP, 3 BF, 2 SO) threw a scoreless 9th. Scoring: the top of the 1st, Zack Wheat walked, Mookie Betts reached on Spahn&#x27;s own error, Shohei Ohtani lined out, and Duke Snider hit a three-run home run (the decisive play the export&#x27;s summary names), Steve Garvey following with a back-to-back solo home run, 4-0; all four runs are unearned in the printed line, the error having extended the inning past the point where Ohtani&#x27;s lineout would have ended it. The top of the 3rd, Ohtani&#x27;s solo home run, the game&#x27;s only earned run, 5-0; Snider singled later in the inning and took second on Andruw Jones&#x27;s error. Atlanta managed only three hits against Vance (Rabbit Maranville&#x27;s 4th-inning double, Ozzie Albies&#x27;s 6th-inning single and Freddie Freeman&#x27;s 8th-inning single) and was shut out for the second time in the series; Ronald Acuna Jr. started in Hank Aaron&#x27;s spot and went 0 for 4. Los Angeles turned one double play (Acuna in the bottom of the 6th, coded DP 6-4-3), a genuine double-play row whose batter&#x27;s printed GIDP matches, so no GIDP difference arises; Atlanta turned none. Defensive lines are booked in the established shape from the printed fielding section (Los Angeles 27 putouts and 9 assists, Steve Garvey 9 putouts, Max Muncy and Pee Wee Reese 3 assists each, Jackie Robinson a hand in the double play; Atlanta 27 putouts and 9 assists, Freddie Freeman 10 putouts, Joe Torre 8 putouts catching, Rabbit Maranville and Ozzie Albies 4 assists each). Atlanta&#x27;s two errors were Spahn&#x27;s in the 1st and Andruw Jones&#x27;s in the 3rd, and Jones&#x27;s fielding line also carries RO 2 and GDP 2 in the export&#x27;s extra columns, booked exactly as printed. Stolen bases: none, and no caught stealings. Wild pitches: none. Passed balls: none. Hit by pitch: none. Counting checks: Los Angeles plate appearances 36 (33 AB, 3 BB) equal Atlanta&#x27;s 36 batters faced (Spahn 33, Nichols 3); Atlanta plate appearances 31 (29 AB, 2 BB) equal Vance&#x27;s 31 batters faced. Hit, walk, home run and strikeout totals tie across the two boxes both ways. All five Los Angeles runs carry RBIs (team total 5: Snider 3, Ohtani 1, Garvey 1); Atlanta was shut out. Manager grades: the grades list names the manager directly, so no label mapping is needed. Bobby Cox graded 1 decision (1 paid off): his pitching change to Nichols for the top of the 9th paid off, a scoreless inning with two strikeouts. Tommy Lasorda graded no decisions in this game. Availability for this game was honored: Greg Maddux (21 outs in Game 6), Sandy Koufax (15 outs) and Clem Labine (9 outs) sat. Los Angeles wins the series 4-3 and advances on the winners side; Atlanta takes its first series loss and drops to Losers Round 2. The series export names Dazzy Vance the Series MVP, and under Joe&#x27;s standing rule he is booked as the series MVP; the runner-up booked with him is Greg Maddux. Managers: Tommy Lasorda (Los Angeles) and Bobby Cox (Atlanta). Venue is Truist Park, as printed.">
