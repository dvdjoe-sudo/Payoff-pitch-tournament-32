  <title>R1-15-G4: Baltimore Orioles 1, Kansas City Royals 4</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-07: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official R1-15 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Series: Baltimore Orioles (seed 15) vs Kansas City Royals (seed 18), home pattern 2-2-1-1-1, Game 4 at Kauffman Stadium. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Zack Greinke started for Kansas City (5.0 IP, 3 H, 1 R, 1 ER, 2 BB, 4 SO, 0 HR); Kansas City led from the Bottom 1 on and he finished five innings with a 3-1 lead, so he takes the win. Mike Cuellar started for Baltimore and went the distance in defeat (8.0 IP, 9 H, 4 R, 4 ER, 0 BB, 4 SO, 1 HR) and is charged with all four Kansas City runs, so he takes the loss. Kevin Appier takes the save, derived: he entered the Top 8 with Kansas City leading 4-1 and pitched the last two innings scoreless and hitless (2.0 IP, 0 H, 0 R, 0 BB, 0 SO), which satisfies the standard prong of entering with a lead of three runs or fewer and pitching at least one full inning, finishing with the lead intact. Run charges match the printed lines exactly: Baltimore pitching allows 4 (Cuellar 4), and Kansas City pitching allows 1 (Greinke 1, and Mingori, Quisenberry, and Appier none). The duplicate test ran before the number was assigned: the stored games in the series are Game 1 (Baltimore 8, Kansas City 4), Game 2 (Kansas City 8, Baltimore 5), and Game 3 (Kansas City 7, Baltimore 2), all with different linescores, so this box score is no duplicate and takes the series&#x27; next unplayed number, Game 4. The game: Kansas City scored single runs in each of the first three innings and Baltimore never caught up. In the Bottom 1, Tartabull singled and Witt hit the first of his two triples to drive him home. In the Bottom 2, Gordon singled, Pérez singled him along on Yost&#x27;s hit and run, and Wilson singled Gordon home. In the Bottom 3, Witt tripled again and Sweeney singled him home. Baltimore&#x27;s only run came in the Top 5: Ripken walked, Dempsey singled, and Blair forced Dempsey at second with Ripken scoring on the play, the card printing Blair&#x27;s RBI. Kansas City&#x27;s fourth run was Pérez&#x27;s solo home run off Cuellar in the Bottom 6. Baltimore managed five hits all day, Grich&#x27;s two of them, and their last look produced only Anderson&#x27;s reach on Sweeney&#x27;s error at first (E3) in the Top 8 before Frank Robinson grounded into a double play on Appier&#x27;s watch. Baltimore stranded 6 and Kansas City 6. Home runs: one, Pérez&#x27;s solo shot in the Bottom 6 off Cuellar. Doubles: two, both Baltimore, Grich in the Top 3 and Blair in the Top 7. Triples: two, both Witt, in the Bottom 1 and the Bottom 3. Errors: one, Sweeney (E3) on Anderson&#x27;s Top 8 reach; Baltimore committed none. The Gazette&#x27;s grid footers sit under the batting grids and count the fielding side&#x27;s errors in those half innings, so the headers govern the team totals: Baltimore 0, Kansas City 1. Hit batters: one, Sweeney hit by Cuellar in the Bottom 5; HB 1 for Cuellar and HBP 1 for Sweeney are carried as card-sourced values, and every other pitcher&#x27;s HB and every other batter&#x27;s HBP is a card-sourced zero, so the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: none; the card prints no sacrifice notation anywhere, and the split lines read SH 0 and SF 0 for every batter. Stolen bases: none; Yost sent the runner twice (Bottom 1 and Bottom 3) and the log records the runner held both times, and the card&#x27;s SB column is zero for every batter. Caught stealing: none. Double plays grounded into: two, both Baltimore, Blair in the Top 3 and Frank Robinson in the Top 8. Substitutions: one with plate appearances, McRae pinch-hitting for Gordon in the Bottom 6 and staying in left field (he flied out in the Bottom 6 and the Bottom 8), so the Gazette prints nine Baltimore batting lines and ten Kansas City batting lines. Plate appearances counted fresh from the printed batting lines and the play log enumeration, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Kansas City PA is AB 33 plus HBP 1, which is 34, and the outs plus runs plus stranded identity agrees (24 outs plus 4 runs plus 6 stranded is 34, Kansas City batting eight innings); Baltimore PA is AB 31 plus BB 3, which is 34, and the identity agrees (27 outs plus 1 run plus 6 stranded is 34). Batters faced tie to those totals: Kansas City 34 PA against 34 Baltimore BF (Cuellar 34), and Baltimore 34 PA against 34 Kansas City BF (Greinke 19, Mingori 5, Quisenberry 4, Appier 6; Greinke&#x27;s and Appier&#x27;s totals each sit one under the outs plus hits plus walks sum because Blair&#x27;s Top 3 and Frank Robinson&#x27;s Top 8 double plays each produced a second out without a second batter). Strikeouts tie both ways: Kansas City batting 4 against Baltimore pitching 4 (Cuellar 4), Baltimore batting 5 against Kansas City pitching 5 (Greinke 4, Quisenberry 1). Printed RBI: Kansas City 4 for 4 (Witt 1, Wilson 1, Sweeney 1, Pérez 1) and Baltimore 1 for 1 (Blair 1). Availability under the house convention: Appier&#x27;s Game 1 cap applied to Game 2 only and does not reach this game; he had not pitched since Game 1 and was free. Gubicza (16 outs in Game 3) was unavailable and did not pitch, moot on the rotation turn; McNally (5 outs in Game 3, under six) was free but unused as the rotation turned; Flanagan&#x27;s cap from Game 3 applied to this game only and he did not pitch; Baltimore&#x27;s other Game 3 relievers were all short-outing and free, and only Cuellar pitched for Baltimore anyway. Eight decisions were graded. Ned Yost made 7 (5 paid off, 1 backfired, 1 neutral): the Bottom 2 hit and run paid off at +0.74, the game&#x27;s best grade; all three of his pitching changes paid off at +0.73 each (to Mingori in the Top 6, to Quisenberry in the Top 7, and to Appier in the Top 8); the Bottom 1 steal paid off at +0.49 with the runner held; the Bottom 3 steal backfired at -0.51, the game&#x27;s worst grade, the runner held and nothing scored; and the McRae pinch hit in the Bottom 6 was neutral at +0.27. Earl Weaver made 1 (1 paid off, 0 backfired, 0 neutral): leaving the book-fatigued Cuellar in for the Bottom 8 paid off at +0.73. Managers: Earl Weaver (Baltimore) and Ned Yost (Kansas City). Venue is Kauffman Stadium. Game 5 availability from Game 4 outs: Greinke (15 outs) and Cuellar (24 outs) are unavailable under the house convention, moot on the rotation turn; Appier (6 outs) is capped at 3 outs in Game 5; every other pitcher is free. Kansas City leads the series 3-1.">
