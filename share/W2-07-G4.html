  <title>W2-07-G4: Atlanta Braves 0, Los Angeles Dodgers 5</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 7, Game 4 at Dodger Stadium. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Los Angeles blanked Atlanta 5-0 behind a Don Drysdale complete-game shutout and tied the series 2-2. Decisions: Don Drysdale takes the win for Los Angeles (9.0 IP, 34 BF, 6 H, 0 R, 0 ER, 1 BB, 9 SO, 0 HR), the export&#x27;s player of the game, never leaving the mound and allowing one walk (Dale Murphy in the 4th). John Smoltz takes the loss for Atlanta (7.0 IP, 33 BF, 8 H, 5 R, 4 ER, 5 BB, 6 SO, 3 HR). Gene Garber (1.0 IP, 4 BF, 0 H, 1 BB) threw a scoreless 8th. Scoring: the bottom of the 2nd, Duke Snider homered (the decisive play the export&#x27;s summary names) and Steve Garvey followed with a back-to-back home run, 2-0; the bottom of the 3rd, Mookie Betts homered, 3-0; the bottom of the 6th, Garvey reached on Rabbit Maranville&#x27;s error at shortstop, took third on Mike Piazza&#x27;s single, and scored on Max Muncy&#x27;s forceout at second, an unearned run with Muncy keeping the RBI, 4-0; and the bottom of the 7th, Zack Wheat singled, Betts and Shohei Ohtani walked to load the bases, and Snider grounded into a double play with Wheat scoring on the play, a run with no RBI (the row carries runs 1, rbi 0), 5-0. Atlanta&#x27;s best chance came in the top of the 2nd: Joe Torre singled, Murphy&#x27;s forceout erased him, and Freddie Freeman&#x27;s single put Murphy at third before Andruw Jones struck out; Atlanta never got another runner past second. Freeman and Torre each went 2 for 4 for Atlanta. For Los Angeles, Piazza added 2 hits catching, Garvey scored twice, and Snider drove in one and scored one while grounding into both of Atlanta&#x27;s double plays. Errors: Atlanta made the game&#x27;s only error, Maranville&#x27;s at shortstop in the bottom of the 6th, and it cost the unearned run traced above; Los Angeles was errorless, and four of Smoltz&#x27;s five runs are earned as printed. Defensive lines are booked in the established shape from the printed fielding section (Atlanta 24 putouts and 8 assists, Torre 6 putouts catching, Maranville 4 assists and his error, Albies 3 assists, Freeman 6 putouts, and two double plays, Snider&#x27;s in the 3rd and the 7th, both genuine double-play rows with his printed GIDP of 2 to match; Los Angeles 27 putouts and 3 assists, Piazza 10 putouts catching, Reese 3 putouts and 2 assists, Snider 5 putouts). Stolen bases: none. Wild pitches: none. Passed balls: none. Hit by pitch: none. Counting checks: Atlanta plate appearances 34 (33 AB, 1 BB) equal Drysdale&#x27;s 34 batters faced; Los Angeles plate appearances 37 (31 AB, 6 BB) equal Atlanta&#x27;s 37 batters faced (Smoltz 33, Garber 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Los Angeles&#x27;s five runs carry four RBIs, the fifth scoring on Snider&#x27;s double play as traced above; Atlanta scored no runs. Manager grades: the grades list names both managers directly, so no label mapping is needed. Tommy Lasorda graded 2 decisions (0 paid off, 2 backfired), both hit and runs: Reese&#x27;s fielder&#x27;s choice in the bottom of the 2nd (Piazza forced at second) and Reese&#x27;s flyout in the bottom of the 8th with Muncy at first. Bobby Cox graded 3 decisions (1 paid off, 1 backfired, 1 neutral): his two calls to leave Smoltz in split backfired and neutral, and his pitching change to Garber for the 8th paid off. Availability for Game 5 under the convention: Don Drysdale (27 outs in this game) and John Smoltz (21 outs) are unavailable; Gene Garber (3 outs) is free. Game 3&#x27;s availability was honored: Warren Spahn (27 outs in Game 3) and Dazzy Vance (19 outs) sat. The series is tied 2-2. Managers: Bobby Cox (Atlanta) and Tommy Lasorda (Los Angeles). Venue is Dodger Stadium, as printed.">
