  <title>R1-09-G2: Texas Rangers 5, Cincinnati Reds 7</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-10-31: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-09 Game 2 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cincinnati Reds (seed 9) vs Texas Rangers (seed 24), home pattern 2-2-1-1-1, Game 2 at Great American Ball Park. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number; the two run-accounting settlements below are documented where the play log&#x27;s run annotations and the card&#x27;s printed RBI and wild pitch charges had to be read together. The decisions are not printed; they are derived from the play log (Bucky Walters takes the win: Cincinnati took the lead for good in the Bottom 3 on Eric Davis&#x27;s solo home run off Yu Darvish and never trailed, and Walters started and pitched 5.2 scoreless innings, leaving in the Top 6 with a 5-0 lead; Yu Darvish takes the loss as the starter charged with the Bottom 3 go-ahead run and the four Bottom 5 runs, leaving after Johnny Bench&#x27;s 2-run single made it 5-0; Aroldis Chapman takes the save: he entered the Top 9 at 7-5 with the tying run at the plate and retired Corey Seager, Ian Kinsler and Ivan Rodriguez in order). Run charges match the printed lines exactly: Texas pitching allows 5 + 1 + 0 + 1 = 7 (Darvish, Jeff Zimmerman, Neftali Feliz, Jim Kern), and Cincinnati pitching allows 0 + 1 + 4 + 0 + 0 = 5 (Walters, Rob Dibble, Francisco Cordero, John Franco, Chapman). Bucky Walters was the story early: 5.2 innings, 3 hits, no runs, 1 walk, 3 strikeouts, stranding Josh Hamilton at third in the 2nd and Kinsler at second in the 6th. Cincinnati built the lead in layers: Davis&#x27;s solo home run in the Bottom 3; a 4-run Bottom 5 keyed by Sparky Anderson&#x27;s hit and run (graded paid off at +2.89, the inning&#x27;s first run expectancy beaten by all four runs) in which Davis and Pete Rose singled, Joe Morgan walked, Frank Robinson hit a 2-run double and Bench a 2-run single, all off Darvish, with Ron Washington&#x27;s call to leave the fatigued Darvish in for Bench graded backfired at -0.87; and a Bottom 6 run when pinch hitter Ted Kluszewski singled, Barry Larkin singled, and Rose doubled Kluszewski home for 6-0. Texas&#x27;s only run through seven was Frank Howard&#x27;s solo home run off Dibble in the Top 7. The Top 8 nearly flipped the game: Anderson&#x27;s change to Cordero was graded backfired at -3.77, the worst single decision score of the tournament so far, matching the -3.77 Downs was graded at in R1-08 Games 4 and 5, as Seager doubled, Howard singled him in, and the inning&#x27;s last three runs came across in Juan Gonzalez&#x27;s plate appearance (settlement below) to make it 6-5; Franco got the last two outs of the inning. Cincinnati answered in the Bottom 8 with the Larkin run off Kern (settlement below) for 7-5, and Chapman closed it. Run-accounting settlement, Texas Top 8: the card prints Texas&#x27;s RBI total at 4 (Howard 2, Gonzalez 2) against 5 runs, and charges Cordero with 1 wild pitch. The play log annotates Gonzalez&#x27;s single as &quot;(3 runs)&quot; and never narrates a wild pitch. The log&#x27;s base states settle it: after Howard&#x27;s single the state was 2 out, bases 1st and 3rd, score TEX 2 (Seager home, Alex Rodriguez at 3rd, Howard at 1st); Hamilton&#x27;s walk loaded the bases with Alex Rodriguez still at 3rd, so the wild pitch did not occur during Hamilton&#x27;s plate appearance; Gonzalez&#x27;s single then ends the play with the bases showing 1st only and the score TEX 5. The only consistent reading is that Cordero&#x27;s wild pitch scored Alex Rodriguez during Gonzalez&#x27;s at-bat, before the single (TEX 3, no RBI), and Gonzalez&#x27;s single drove in Howard and Hamilton for his card-printed 2 RBI (TEX 5). It is the same settlement shape as the Key wild pitch in R1-08 Game 3: the log never narrates the wild pitch, the card charges it, and the card governs. Texas&#x27;s printed RBI 4 plus the wild pitch run equals its 5 runs. Run-accounting, Cincinnati Bottom 8: there is no missing RBI and no settlement was needed beyond reading the card and the log&#x27;s base states together; Cincinnati&#x27;s printed RBI are Rose 1, Morgan 1, Robinson 2, Bench 2 and Davis 1, which sum to 7, matching the 7 runs. The Bottom 8 run is Larkin&#x27;s: Kluszewski walked off Kern, Edd Roush pinch-ran and was thrown out at home on Larkin&#x27;s double (the log&#x27;s post-play state is 2 out, bases 2nd, Larkin at 2nd alone, which is why Larkin&#x27;s printed RBI is 0 and the graded pinch runner note says the runner did not score), Rose walked, and Morgan&#x27;s single to left scored Larkin for Morgan&#x27;s 1 RBI and the 7-5 final margin. Wild pitch: the card charges Cordero with 1 wild pitch; a wild pitch is not a stored archive field and is noted here and in the settlement only. Errors: none, by either club, a clean game in the field for the second straight game. Sacrifices: none, and no sacrifice flies, for either club; the split SH and SF columns below are all zeros, log-proven (Ivan Rodriguez&#x27;s Top 6 groundout advanced Kinsler to second but is a plain groundout, exactly as the card scores it). Hit batter: none. The scorecard grids print an HBP column for every pitcher on both clubs, all zeros, so HB 0 is carried for all nine pitchers and HBP 0 for every batter as card-sourced values, and the hit batter check runs on real data. Stolen bases and caught stealing, as printed: no runner stole a base all game (all nine steal sends across both managers were held, except one thrown out); Johnny Bench was caught stealing in the Bottom 4 after his walk, Cincinnati&#x27;s only caught stealing, and Texas had none. Double plays grounded into, counted from the play log: Texas 1 (Alex Rodriguez, Top 1); Cincinnati 0 (Morgan&#x27;s Bottom 3 forceout is not a GIDP). Substitutions: Kluszewski pinch-hit for Tony Perez in the Bottom 6 and stayed in as the designated hitter, singling in the 6th (and scoring on Rose&#x27;s double) and walking in the 8th, 1 for 1 with a run; Edd Roush pinch-ran for Kluszewski in the Bottom 8 and was thrown out at home on Larkin&#x27;s double; Roush never batted and the card gives him no batting line, so he is omitted from the batting table and carried in this recap only, the same handling as Alejandro Kirk in R1-08 Game 5. Availability held from Game 1 under the house outs convention: Eppa Rixey (8 outs in Game 1, capped at 3 outs) did not pitch, and Nolan Ryan (21 outs) and Noodles Hahn (10 outs), both unavailable, did not pitch. Game 3 availability, read off this game only (under 6 outs free, 6 to 8 outs capped at 3 outs, 9 or more outs unavailable for the next game): Darvish threw 13 outs and Walters 17 outs, so both are unavailable for Game 3; every reliever who appeared threw 5 outs or fewer (Zimmerman 5, Feliz 3, Kern 3, Dibble 4, Cordero 2, Franco 1, Chapman 3) and is free. The rotations turn over to each club&#x27;s number 3 starter for Game 3 in any case, and the series shifts to Texas for Games 3 and 4 under the home pattern. Basepath aggression graded all night and almost never rewarded: twenty decisions total. Ron Washington made 7 (2 paid off, 5 backfired): three more steal sends (Top 1 Kinsler, Top 6 Kinsler, Top 7 Gonzalez) all held and all backfired, the Darvish leave-in backfired at -0.87, and the Jim Kern change backfired at -0.77 when the Bottom 8 insurance run scored; the Zimmerman change (+0.76) and the Feliz change (+0.73) paid off. Sparky Anderson made 13 (5 paid off, 5 backfired, 3 neutral): the Bottom 5 hit and run paid off at +2.89 and ignited the 4-run inning, the Dibble change paid off, the Kluszewski pinch hit paid off with the single that started the Bottom 6 run (the same call backfired in Game 1), the Bottom 8 steal send at 1 out graded paid off on the inning&#x27;s run expectancy, and the Chapman closer call paid off; the Cordero change backfired at -3.77, four of his six steal sends backfired (Bench was thrown out on one of them), one steal send was neutral, and the Franco change and the Roush pinch runner graded neutral. Managers: Ron Washington (Texas) and Sparky Anderson (Cincinnati). Venue is Great American Ball Park. The series is tied 1-1.">
