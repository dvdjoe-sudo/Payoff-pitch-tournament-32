  <title>R1-10-G4: Los Angeles Dodgers 1, Milwaukee Brewers 0</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-01: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-10 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Los Angeles Dodgers (seed 10) vs Milwaukee Brewers (seed 23), home pattern 2-2-1-1-1, Game 4 at American Family Field in Milwaukee. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number, with no run-accounting knot and no settlement needed. The decisions are not printed; they are derived from the play log and the run charges on the card. Don Drysdale takes the win: eight scoreless innings, four hits, three walks, four strikeouts and one wild pitch, and he was Los Angeles&#x27;s pitcher of record when the game&#x27;s only run scored in the Top 8. Ken Sanders takes the loss: he entered in the Top 7 with two out and Garvey on second, retired Piazza to end that inning, pitched a scoreless Top 8 until Robinson&#x27;s two-out solo home run, the only run charged to any pitcher in the game, and finished the Top 9; Milwaukee never scored, so the homer stands as the losing run on his line. Corbin Burnes takes a hard-luck no-decision: six scoreless innings, one hit, one walk, six strikeouts and one hit batter, leaving a 0-0 game. Mike Marshall takes the save: Drysdale walked Yelich and Thomas to open the Bottom 9, Yelich having stolen second between the walks, and Marshall entered with no outs, runners at first and second and a 1-0 lead, the tying run already on base, and got all three outs himself, Cooper&#x27;s 6-4-3 double play (Gómez, pinch-running for Thomas, forced at second, Yelich taking third) and Jenkins&#x27;s fly out to left; the save stands on the tying-run-on-base prong and independently on a full inning finished with a lead of three or fewer. Run charges match the printed lines exactly: Milwaukee pitching allows 0 + 0 + 1 = 1 (Burnes and Fingers none, Sanders the Robinson home run), and Los Angeles pitching allows 0 + 0 = 0. Printed RBI ties clean both ways: Los Angeles 1 (Robinson) against 1 run, and Milwaukee 0 against 0 runs. The duplicate test ran before the number was assigned: the stored R1-10 games are Game 1 (Milwaukee 5, Los Angeles 6), Game 2 (Milwaukee 6, Los Angeles 3) and Game 3 (Los Angeles 4, Milwaukee 1), none sharing this game&#x27;s final score or linescore, so this box score is no duplicate, and this is the fourth game of the series in play order, booked as Game 4. The game: a scoreless duel for seven innings. Milwaukee&#x27;s early chances died at Drysdale&#x27;s hand and its own: Molitor singled to open the Bottom 1 and was caught stealing, Yount then struck out on Drysdale&#x27;s wild pitch and beat the throw to first but was stranded, and Thomas doubled with one out in the Bottom 4 and never moved, Cooper and Jenkins flying out behind him. Los Angeles managed only Ohtani&#x27;s Top 4 single off Burnes through six innings. Fingers took the Top 7, gave Ohtani a groundout and Snider a strikeout, then Garvey doubled to left; Sanders came in and retired pinch hitter Piazza to strand him. In the Top 8, after Cey flied out and Reese grounded out, Robinson homered to right off Sanders for the game&#x27;s only run. Drysdale then walked the first two batters of the Bottom 9 and Marshall closed it as described. The game&#x27;s only home run is Robinson&#x27;s; the only doubles are Garvey&#x27;s and Thomas&#x27;s; neither club hit a triple. Hit batter: Snider was hit by Burnes in the Top 2 (printed on the Gazette extras line, HBP by Corbin Burnes 1, and in both grids), and the scorecard grids print an HBP column for every pitcher on both clubs, so HB 1 is carried for Burnes and HB 0 for the other five pitchers as card-sourced values, and Snider carries HBP 1, so the hit batter check runs on real data. Wild pitch: Drysdale 1, printed, on Yount&#x27;s Bottom 1 strikeout; the play is one plate appearance and one at-bat, already inside the totals. Sacrifices: Snider&#x27;s Top 9 sacrifice bunt is the game&#x27;s only sacrifice of either kind, so the split columns show SH 1 for Snider and SH 0 and SF 0 for every other batter, log-proven. Stolen bases: Yelich stole second in the Bottom 9 (printed). Caught stealing: Molitor in the Bottom 1 (printed). The two other steal sends in the log (Murphy&#x27;s second Bottom 1 send, Yount held at first, and no other send produced an attempt) were held runners, not attempts. Double plays grounded into, counted from the play log: Cooper in the Bottom 9 for Milwaukee, the game&#x27;s only one; Los Angeles grounded into none. Substitutions: Piazza pinch-hit for Campanella in the Top 7 and flied out (0 for 1); Fielder pinch-hit for Braun in the Bottom 7 and flied out (0 for 1); Wheat replaced Guerrero in left field in the Bottom 8 as a defensive substitution and had no plate appearance, so he carries no batting line; Gómez pinch-ran for Thomas in the Bottom 9 and was forced at second on the double play, no plate appearance, so he carries no batting line. Garvey started at first base with Hodges sitting, Guerrero started in left field, Thomas started in center field, Braun started at designated hitter and Cooper started at first base with Scott sitting. Batters faced are counted from the play log and tie to the batting PA totals both ways (Los Angeles 33 PA against 33 Milwaukee BF: Burnes 21, Fingers 3, Sanders 9; Milwaukee 33 PA against 33 Los Angeles BF: Drysdale 31, Marshall 2). Thirteen decisions were graded. Tommy Lasorda made 3 (2 paid off, 1 backfired): the Top 7 pinch hitter Piazza backfired at -0.57, flying out with Garvey on second; the Bottom 8 defensive substitution of Wheat for Guerrero in left paid off at +0.48 on a clean inning; and the Bottom 9 change to Marshall paid off at +1.69, the double play and the fly out closing a 1-0 game with the tying and winning runs aboard. Pat Murphy made 10 (2 paid off, 7 backfired, 1 neutral): all three of his graded steal decisions backfired, the Bottom 1 send that ended with Molitor caught stealing at -1.11, the second Bottom 1 send with Yount held at -0.51, and the Bottom 9 send Yelich completed safely at -0.61 because the inning still died scoreless; both hit and runs backfired, Yount&#x27;s Bottom 3 popout at -0.76 and Molitor&#x27;s Bottom 5 forceout at -0.76; both Top 7 pitching changes paid off, Fingers at +0.73 and Sanders at +0.57; the Bottom 7 pinch hitter Fielder backfired at -0.50; leaving Sanders in for the Top 9, graded with Sanders fatigued by the book in the game, was neutral at +0.23; and the Bottom 9 pinch runner Gómez backfired at -1.44, forced at second on the game-ending double play without scoring. Managers: Tommy Lasorda (Los Angeles) and Pat Murphy (Milwaukee). Venue is American Family Field. Availability compliance: Vance (16 outs in Game 3) and Woodruff (15) were unavailable under the house convention and correctly did not pitch. Game 5 availability, under the house outs convention read off this game only: Drysdale threw 24 outs and Burnes 18, so both are UNAVAILABLE for Game 5; Sanders threw 7 outs and is CAPPED at 3 outs; Marshall (3 outs) and Fingers (2) are free. Availability reads only the previous game, so Koufax and Higuera are free again. Los Angeles leads the series 3-1, Milwaukee faces elimination, and Game 5 moves back to Dodger Stadium in Los Angeles.">
