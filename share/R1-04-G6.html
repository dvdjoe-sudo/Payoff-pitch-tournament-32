&quot;7 for 21, 3 3B, 3 RBI, 1 R, .333&quot; (the stored line had also gone stale on the 2026-11-08 corrections, which had already moved his Game 3 RBI to 1). All four sources agree on every number: the linescore, the batting and pitching sums, plate appearances against batters faced for every pitcher (Detroit 46 against Johnson&#x27;s 15, Kim&#x27;s 5, Chafin&#x27;s 6, Valverde&#x27;s 3, Bradley&#x27;s 5, Ziegler&#x27;s 5, Putz&#x27;s 4, and Schilling&#x27;s 3; Arizona 34 against Newhouser&#x27;s 34), and printed RBI (Detroit 12 for 13, the one run without a printed RBI being Cabrera&#x27;s in the Top 7, which scored on Moreno&#x27;s second passed ball of Freehan&#x27;s plate appearance; Arizona 4 for 4), booked exactly as printed. No seed is printed in any source, so rng_seed is 0, as in the R1-06, R1-10, and R1-01 adoptions. The decisions are printed in the log: Hal Newhouser takes the win with a complete game (9.0 IP, 3 H, 4 R, 4 ER, 6 BB, 1 HB, 6 SO, 1 HR) and Randy Johnson the loss (2.2 IP, 6 H, 6 R, 6 ER, 1 BB, 2 SO, 2 HR); there is no save, Arizona using eight pitchers. Detroit scored three in the 2nd on Freehan&#x27;s three-run home run off Johnson (Greenberg and Veach aboard), three in the 3rd on Veach&#x27;s three-run home run off Johnson (Gehringer and Cabrera aboard), two in the 5th off Chafin (Kaline on Veach&#x27;s forceout, Greenberg on Freehan&#x27;s sacrifice fly), three in the 7th (Kaline&#x27;s solo home run off Bradley; Cabrera on Moreno&#x27;s second passed ball of Freehan&#x27;s plate appearance against Bradley; and Veach on Freehan&#x27;s single off Bradley, both runs after the homer unearned as printed because the passed balls moved both runners), and two in the 9th on Freehan&#x27;s two-run home run off Putz (Cabrera aboard). Arizona scored two in the 5th on Williams&#x27;s two-run home run off Newhouser (Finley aboard) and two in the 7th (Gonzalez on Williams&#x27;s single, Walker thrown out at the plate on Kaline&#x27;s throw on the same play, and Finley on Moreno&#x27;s forceout). Freehan finished 4 for 4 with two home runs and 7 RBI; Veach drove in 4. The game was errorless. Hit batters: Finley, hit by Newhouser in the Bottom 9 (the log adds that the batter charged the mound; no ejection or injury is recorded in any source and none is booked). Wild pitches: Newhouser 1 and Putz 1, as printed; passed balls: Moreno 2, as printed. Sacrifice flies: Freehan (Top 5), the game&#x27;s only one; sacrifice hits: none. Grounded into double plays: Walker (Bottom 2), Trammell (Top 7), and Goldschmidt (Bottom 8). Stolen bases: none, and no runner was caught stealing. Substitutes: none on either club; Detroit used nine men, Arizona nine men and eight pitchers. Defensive lines are booked as a defense object in the established shape, under the same replay exception Joe directed for the R1-01 replays (a Round 1 game carrying defense because the replay was played with full tracking); Detroit&#x27;s 27 putouts and 13 assists and Arizona&#x27;s 27 putouts and 12 assists are exactly the printed fielding tables. Graded decisions, narrated here because final_grades stays empty as in every app-era game in this archive: Bob Brenly (Arizona) 8 (2 paid off, 3 backfired, 3 neutral): the Top 3 change to Kim neutral (-0.15), the Top 5 change to Chafin backfired (-1.77), the Top 5 leave-in of a fatigued Chafin paid off (+0.47), the Top 6 change to Valverde paid off (+0.73), the Top 7 change to Bradley backfired (-2.77), the Top 7 change to Ziegler neutral (+0.26), the Top 9 change to Putz backfired (-1.27), and the Top 9 change to Schilling neutral (-0.15). Sparky Anderson (Detroit) 1: the Bottom 9 leave-in of a fatigued Newhouser paid off (+0.73). Managers: Sparky Anderson (Detroit) and Bob Brenly (Arizona). Venue is Chase Field. Detroit won the series 4-2.">
