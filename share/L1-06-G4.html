  <title>L1-06-G4: New York Mets 3, Montreal Expos 6</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 6, Game 4 at Olympic Stadium, as the master export&#x27;s box score prints the venue (marked neutral in the print). Montreal leads the series 3-1. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every figure in the export agrees with itself across all of its sections. Decisions: Bryn Smith takes the win for Montreal (6.0 IP, 23 BF, 5 H, 1 R, 1 ER, 1 BB, 3 SO); he is the export&#x27;s Player of the Game. Jerry Koosman takes the loss for New York (6.2 IP, 29 BF, 6 H, 6 R, 6 ER, 3 BB, 1 HBP, 5 SO, 1 HR, Vidro&#x27;s three-run shot). There is no save: Andy McGaffigan pitched the final 2.0 innings for Montreal (9 BF, 4 H, 2 R, 2 ER) but entered the top of the 8th with a five-run lead, 6-1, so no save situation ever arose, and the export&#x27;s record carries no save (its summary prints S: -). Tim Burke threw a scoreless 7th for Montreal (3 BF, 1 SO) and is credited with a hold in the export&#x27;s record; Jesse Orosco finished for New York (1.1 IP, 4 BF, 2 SO). Scoring: Montreal scored one in the bottom of the 1st (Raines singled, stole second, and scored on Walker&#x27;s groundout to shortstop). New York tied it in the top of the 3rd (Jones singled and Lindor doubled him home off Smith). Montreal went ahead for good in the bottom of the 6th: Vidro and Walker singled and Gary Carter&#x27;s double to left scored both, the export report&#x27;s decisive play. Montreal added three in the bottom of the 7th on Vidro&#x27;s three-run home run off Koosman, scoring Fairly and Wallach ahead of him. New York scored its last two in the top of the 8th off McGaffigan (Jones singled, Lindor doubled, Hernandez&#x27;s sacrifice fly scored Jones, and Strawberry&#x27;s single scored Lindor). Errors: none for either club; the game was errorless, and the earned-run totals tie exactly: New York&#x27;s staff total of 6 equals Montreal&#x27;s 6 runs and Montreal&#x27;s staff total of 3 equals New York&#x27;s 3 runs. Double plays: one per club. New York turned one in the bottom of the 5th (Wallach grounds into a double play, 6-4-3 as the rows code it), matching Wallach&#x27;s printed GIDP of 1, and Montreal turned one in the top of the 6th (Piazza, 1-6-3 as the rows code it), matching Piazza&#x27;s printed GIDP of 1; the printed fielding section&#x27;s DP column credits Hernandez, Lindor and Alfonzo one each for New York and Fairly, Cabrera and Smith one each for Montreal, exactly as printed. Stolen bases: Raines stole one for Montreal with Piazza catching (one attempted, one successful, exactly as the printed fielding section records). Beltran was caught stealing for New York in the top of the 9th by Schneider (one attempted, none successful against Schneider, exactly as printed). Wild pitches: none for either club. Passed balls: none. Substitutes: John Olerud pinch-hit for Alonso in the top of the 7th and stayed in as the designated hitter, batting once more in the top of the 9th; Brian Schneider replaced Carter at catcher for Montreal in the top of the 9th (defensive sub) and did not bat. Fielding from the CSV&#x27;s printed fielding section: New York 24 putouts and 6 assists (Lindor 3 assists); Montreal 27 putouts and 9 assists (Wallach 4 assists). Counting checks: New York plate appearances 35 (33 AB, 1 BB, 1 SF) equal Montreal&#x27;s 35 batters faced (Smith 23, Burke 3, McGaffigan 9); Montreal plate appearances 33 (28 AB, 3 BB, 1 HBP, 1 SH) equal New York&#x27;s 33 batters faced (Koosman 29, Orosco 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Dick Williams graded 4 decisions (3 paid off, 1 backfired, 0 neutral): one steal (Raines in the bottom of the 1st paid off, +0.39), pitching changes 2 (Burke in the top of the 7th paid off, +0.73; McGaffigan in the top of the 8th backfired, -1.77, giving up New York&#x27;s two 8th-inning runs) and one defensive sub (Schneider at catcher in the top of the 9th paid off, +0.48). Davey Johnson graded 3 decisions (1 paid off, 2 backfired, 0 neutral): one pitching change (Orosco in the bottom of the 7th paid off, +0.35), one pinch hitter (Olerud in the top of the 7th backfired, -0.73, lined out to shortstop) and one steal (Beltran in the top of the 9th backfired, -0.76, thrown out by Schneider). Availability compliance: Jacob deGrom (18 outs in Game 3) was unavailable for New York and did not pitch; Dennis Martinez (18 outs in Game 3) was unavailable for Montreal and did not pitch. Availability for Game 5 at New York, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Jerry Koosman (20 outs) is unavailable for New York and Bryn Smith (18 outs) is unavailable for Montreal; Andy McGaffigan (6 outs) is capped at 3 outs for Montreal; every other arm on both staffs is free. Managers: Dick Williams (Montreal) and Davey Johnson (New York). Venue is Olympic Stadium, as printed.">
