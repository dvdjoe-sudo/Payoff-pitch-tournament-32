  <title>L1-02-G5: Washington Nationals 4, Baltimore Orioles 5</title>
  <meta name="description" content="Played by Joe in the app and sent to the co-managed tournament games chat on 2026-11-09 as four files: the box score CSV export carrying the PLAYS (JSON) section, the standalone plays JSON holding the same rows as the CSV&#x27;s PLAYS section, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official L1-02 Game 5 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Losers Bracket Round 1, Series 2: the Baltimore Orioles (seed 15) against the Washington Nationals (seed 31), from the reseeded pool of the 16 opening-round losers, paired highest against lowest in pairing order. Both clubs carry one series loss into this series, so the loser of this series is eliminated and the winner advances to Losers Round 2. Baltimore leads the series 3-1, so Washington plays to survive and Baltimore to close it out. Home pattern 2-2-1-1-1, Game 5 at Oriole Park at Camden Yards in Baltimore. Box score record: the sources carry the linescore, the full batting and pitching lines, the fielding lines, a complete graded play log, and the game&#x27;s full play rows, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed in the Gazette, the CSV, or the log and are derived from the play log and the run charges on the card. Mike Flanagan takes the win: he threw a complete game (9.0 IP, 8 H, 4 R, 4 ER, 7 BB, 8 SO, 0 HR, 41 batters faced) and was never relieved, his club taking the lead for good while he was the pitcher of record in the Bottom 7. Sean Burnett takes the loss: he pitched the Bottom 7, walked Murray, and Murray scored the go-ahead run on Ripken&#x27;s double, the run charged to Burnett&#x27;s line as printed (1.0 IP, 1 H, 1 R, 1 ER, 1 BB, 1 SO, 5 batters faced). There is no save: Flanagan finished the game himself. Livan Hernandez took no decision (6.0 IP, 8 H, 4 R, 4 ER, 2 BB, 3 SO, 29 batters faced): he left after the Bottom 6 with the game tied 4-4. Stephen Strasburg threw a scoreless Bottom 8 (1.0 IP, 3 batters faced, 1 strikeout). Run charges match the printed lines exactly: Washington pitching allows 5 (Hernandez 4, Burnett 1, Strasburg 0), and Baltimore pitching allows 4 (Flanagan 4). Every run in the game is earned as printed; there is no earned-run settlement in this game. The duplicate test ran before the number was assigned: the series had four stored games, Baltimore 6, Washington 1 in Game 1, Washington 6, Baltimore 4 in Game 2, Baltimore 9, Washington 5 in Game 3, and Baltimore 4, Washington 3 in 11 innings in Game 4, all different linescores, so this box score takes Game 5. The game: nobody scored through five innings. Flanagan worked around traffic all night: Turner&#x27;s Top 1 single, Rendon&#x27;s Top 2 walk, back-to-back walks to Turner and Soto in the Top 3, and Nick Johnson&#x27;s two-out double in the Top 4 putting runners at second and third before Ramos popped out to short. Baltimore&#x27;s best early chances died the same quiet way: Ripken doubled in the Bottom 2 and Brooks Robinson singled him to third, but Dempsey struck out and Blair grounded out to third; in the Bottom 4 Brooks Robinson doubled and Dempsey bunted him to third, but Blair grounded out to short; and Turner&#x27;s error on Anderson&#x27;s Bottom 3 grounder put two aboard with one out and Baltimore came away empty. Washington broke through in the Top 6: Harper walked, Rendon and Zimmerman singled to load the bases with nobody out, Murphy doubled two runs home to right, Johnson&#x27;s groundout to short scored Zimmerman, and Ramos doubled Murphy home for 4-0; Span flied out and Turner struck out behind it. Baltimore answered in the same half inning: Murray and Powell singled, Ripken doubled both of them home, Brooks Robinson walked, Dempsey bunted the runners to second and third, and Blair singled two runs home to tie the game 4-4; Martinez left the fatigued Hernandez in and it paid off on the card, Grich lining out to short and Anderson flying out to left to end the inning. The Bottom 7 decided the series: Burnett, pitching the one inning his Game 4 workload allowed him, struck out Frank Robinson, walked Murray, and got Powell&#x27;s flyout to center, and Ripken doubled Murray home for 5-4, the third of Ripken&#x27;s three doubles on the night. Sisler took over at first base for the Top 8, and the double play he finished, Brooks Robinson starting it on Johnson&#x27;s grounder after Zimmerman and Murphy had opened the inning with singles, killed Washington&#x27;s last real threat; Ramos struck out behind it. Strasburg threw a perfect Bottom 8. In the Top 9 Flanagan, left in by the book while fatigued, retired Span and Turner, walked Soto and Harper with two out, and ended the game and the series on Rendon&#x27;s popout to Grich. Washington stranded 10 and Baltimore 8. Home runs: none, a series clincher with no ball leaving the park; the game&#x27;s only extra-base hits are seven doubles, three of them Ripken&#x27;s plus Brooks Robinson&#x27;s for Baltimore and Murphy&#x27;s, Johnson&#x27;s, and Ramos&#x27;s for Washington. Errors: one, Turner&#x27;s on Anderson in the Bottom 3, charged to Washington in errors_by in the established shape; Baltimore was errorless. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: none, the CSV printing WP 0 for all four pitchers. Passed balls: none, the fielding tables printing PB 0 for Ramos and for Dempsey. Sacrifices: two, both of them Dempsey sacrifice bunts (the Bottom 4 and the Bottom 6), and his line carries SH 2. Stolen bases: none, and none caught; Martinez sent a runner three times (Turner in the Top 1, Zimmerman in the Top 4 and again in the Top 8) and each time the runner did not get a good jump and stayed put, the sources charging no attempt, and each catcher reads no steals against. Double plays grounded into: one, Johnson&#x27;s in the Top 8, turned Brooks Robinson to Sisler at first (the log&#x27;s 3B to 3rd to 1st) with the tying runs aboard. Substitutions: one: George Sisler replacing Eddie Murray at first base as a defensive sub for the Top 8 for Baltimore; he had no plate appearance, so he carries no batting line, only a defense players line (1 putout, the finishing end of the Top 8 double play); Washington made none and prints nine batting lines, Baltimore nine. Defensive lines are built with this booking under Joe&#x27;s 2026-11-07 standing instruction: errors_by carries Turner&#x27;s one error for Washington, and a defense object in the established shape (Baltimore 27 putouts and 8 assists, Washington 24 putouts and 7 assists; Dempsey&#x27;s 8 catcher putouts are exactly Washington&#x27;s 8 strikeouts, and Ramos&#x27;s 5 catcher putouts are exactly Baltimore&#x27;s 5 strikeouts, with no caught stealing to adjust either tie; wild pitches true zeros for all four pitchers as the CSV prints, and passed balls true zeros for both catchers). Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Washington PA is AB 34 plus BB 7, which is 41, and the outs plus runs plus stranded identity agrees (27 outs plus 4 runs plus 10 stranded is 41); Baltimore PA is AB 32 plus BB 3 plus SH 2, which is 37, and the identity agrees (24 outs plus 5 runs plus 8 stranded is 37). Batters faced tie to those totals: Washington 41 PA against 41 Baltimore BF (Flanagan faced every batter), and Baltimore 37 PA against 37 Washington BF (Hernandez 29, Burnett 5, Strasburg 3), counted from the card. Strikeouts tie both ways: Washington batting 8 against Baltimore pitching 8 (Flanagan 8), and Baltimore batting 5 against Washington pitching 5 (Hernandez 3, Burnett 1, Strasburg 1). Printed RBI: Baltimore 5 for 5 (Ripken 3, Blair 2) and Washington 4 for 4 (Murphy 2, Johnson 1, Ramos 1); every run in the game carried an RBI. The game&#x27;s play rows travel with the sources under the new export: the 85 rows in the CSV&#x27;s PLAYS (JSON) section and the standalone plays JSON were gated against the printed lines before booking (every batting and pitching line rebuilt from the rows alone exactly, batters faced included, the linescore rebuilt exactly, the rows&#x27; run totals 5 and 4, the rows&#x27; errors 0 against Baltimore and 1 against Washington, and the win probability chain closing at zero), and they are staged with the booking for the tournament&#x27;s play-by-play store. Availability from Game 4 was honored: Cuellar (24 outs in Game 4) and Gonzalez (18 outs) were unavailable and neither pitched; Burnett (6 outs in Game 4) was capped at 3 outs for this game and recorded exactly 3, the cap met to the out in the inning that beat him; Flanagan and Hernandez did not pitch in Game 4 and were free, and Strasburg (3 outs in Game 4) was free. Eight decisions were graded. Dave Martinez (Washington) made 6 (2 paid off, 3 backfired, 1 neutral): all three of his steal sends backfired with the runner held each time, the Top 1 and Top 4 sends at -0.51 each and the Top 8 send of Zimmerman the game&#x27;s worst grade at -0.86 (no runs scored in the rest of the inning against 0.86 expected); the Bottom 6 leave-in of Hernandez, fatigued by the book, paid off at +0.76 (Grich lined out, no runs scored in the rest of the inning); the Bottom 7 pitching change to Burnett was neutral at -0.27 (the go-ahead run scored in the rest of the inning against 0.48 expected); and the Bottom 8 pitching change to Strasburg paid off at +0.73. Earl Weaver (Baltimore) made 2 (2 paid off, 0 backfired, 0 neutral): the Top 8 defensive sub of Sisler at first base paid off at +0.48 (a clean inning in the field that turned the game&#x27;s only double play), and the Top 9 leave-in of Flanagan, fatigued by the book, paid off at +0.73 (Span flied out, no runs scored in the rest of the inning). Managers: Earl Weaver (Baltimore) and Dave Martinez (Washington). Venue is Oriole Park at Camden Yards. Baltimore wins the series 4-1: Washington is eliminated, the second club out of the tournament after Philadelphia, and Baltimore advances to Losers Round 2.">
