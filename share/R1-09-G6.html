  <title>R1-09-G6: Cincinnati Reds 1, Texas Rangers 9</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-10-31: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-09 Game 6 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cincinnati Reds (seed 9) vs Texas Rangers (seed 24), home pattern 2-2-1-1-1, Game 6 at Globe Life Field, the series&#x27; third game in Texas. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number; no run-accounting settlement was needed, because the printed RBI totals tie exactly to the run totals for both clubs. The decisions are not printed; they are derived from the play log (Nolan Ryan takes the win: he started, threw 7.0 innings of 2-hit ball, and left with a 6-1 lead that Texas never came close to losing, the only run off him Pete Rose&#x27;s solo home run in the Top 6; Noodles Hahn takes the loss: Texas scored in each of his three innings and led 4-0 when he left, on Kinsler&#x27;s leadoff home run in the Bottom 1, Palmeiro&#x27;s sacrifice fly in the Bottom 2, and Howard&#x27;s 2-run home run in the Bottom 3, and Cincinnati never tied or led at any point after that; no save is credited: Neftali Feliz entered the Top 8 at 6-1 and John Wetteland the Top 9 at 9-1, neither a save situation). Run charges match the printed lines exactly: Texas pitching allows 1 + 0 + 0 = 1 (Ryan, Feliz, Wetteland), and Cincinnati pitching allows 4 + 1 + 0 + 1 + 3 = 9 (Hahn, Cordero, Franco, Dibble, Rijo). The duplicate test ran before the number was assigned: the stored games in the series are Game 1 (Texas 7, Cincinnati 4 at Cincinnati), Game 2 (Cincinnati 7, Texas 5 at Cincinnati), Game 3 (Cincinnati 6, Texas 4 at Texas), Game 4 (Texas 11, Cincinnati 0 at Texas) and Game 5 (Cincinnati 7, Texas 5 at Cincinnati); a 9-1 Texas win matches none of them on clubs, score or linescore, and it is the next game in play order, booked as the distinct Game 6. Texas scored in six of its eight innings and was never threatened. Kinsler opened the Bottom 1 with a home run off Hahn. The Bottom 2 made it 2-0: Hamilton singled, Gonzalez singled on Washington&#x27;s hit and run with the runners taking two bases, and Palmeiro&#x27;s sacrifice fly scored Hamilton, before Gonzalez was caught stealing and Beltre singled. The Bottom 3 made it 4-0 on Alex Rodriguez&#x27;s single and Howard&#x27;s 2-run home run, with Hamilton doubling behind it. Cordero&#x27;s Bottom 4 added one: Palmeiro walked and Ivan Rodriguez singled him home. Franco stranded Gonzalez&#x27;s triple in the Bottom 5. Cincinnati&#x27;s only run was Rose&#x27;s Top 6 home run, the first of his series; the same inning carried the game&#x27;s only error, Palmeiro&#x27;s at first base on Morgan&#x27;s reach, and its brief spark died on Anderson&#x27;s hit and run, Bench striking out with Morgan thrown out stealing for the double play, after Robinson&#x27;s single. Dibble&#x27;s Bottom 6 allowed one more: Sierra tripled and Kinsler singled him home for 6-1. Rijo threw a scoreless Bottom 7, then the Bottom 8 put it away: Beltre doubled, Sierra doubled him home, Ivan Rodriguez doubled Sierra home, and after walks to Alex Rodriguez and Howard and Hamilton&#x27;s strikeout, Gonzalez walked with the bases loaded to force in Ivan Rodriguez, before Anderson left the fatigued Rijo in and Palmeiro struck out to end the inning. Ryan&#x27;s line is the story of the game: 7.0 innings, 2 hits, 1 earned run, 3 walks, 9 strikeouts, 1 home run allowed; he struck out the side in the Top 4 (Morgan, Robinson and Bench) and allowed both of his hits in the Top 6. Cincinnati managed 3 hits all night: Rose&#x27;s home run and Robinson&#x27;s single off Ryan, and Morgan&#x27;s Top 8 triple off Feliz, which was stranded when Robinson struck out. Texas had 15 hits: every starter but Palmeiro had at least one, and Palmeiro still drove in the Bottom 2 run on his sacrifice fly and scored in the Bottom 4 after his walk. Errors: one, Palmeiro&#x27;s at first base in the Top 6, charged on Morgan&#x27;s reach; Cincinnati had none. No run followed the error: Morgan was caught stealing two batters later and Cincinnati scored nothing further in the inning, and its only run, Rose&#x27;s home run earlier in the same inning, was earned and charged to Ryan as printed. Sacrifices: one sacrifice fly, Palmeiro in the Bottom 2, and no sacrifice bunts; the split columns below show SH all zeros and the one SF, log-proven. Hit batter: none. The scorecard grids print an HBP column for every pitcher on both clubs, all zeros, so HB 0 is carried for all eight pitchers and HBP 0 for every batter as card-sourced values, and the hit batter check runs on real data. Stolen bases and caught stealing, as printed: Votto stole second in the Top 7 for Cincinnati&#x27;s only stolen base; Morgan was caught stealing in the Top 6 on the hit and run, and Gonzalez was caught stealing in the Bottom 2 for Texas. Double plays grounded into, counted from the play log: none for either club; Bench&#x27;s Top 6 strikeout with Morgan caught stealing is a strikeout double play, not a GIDP, the same handling as Game 5&#x27;s Bottom 3, and the two Texas forceouts (Ivan Rodriguez in the Bottom 6, Gonzalez in the Bottom 7) are not GIDPs. Substitutions: Ted Kluszewski pinch-hit for Tony Perez in the Top 7 and grounded out to second; the spot never batted again, so his line is the one printed plate appearance. His pinch-hit first plate appearances in this series now read: retired in Game 1, singles in Games 2, 3 and 4, and retired in Games 5 and 6. Vada Pinson started in left field for Cincinnati again; George Foster did not play. Rubén Sierra started at designated hitter for Texas again; Mark Teixeira did not play. Edd Roush did not appear. Availability held from Game 5 under the house outs convention: Maloney (19 outs in Game 5) and Hough (18 outs), both unavailable out of Game 5, did not pitch; Chapman, available again after sitting out Game 5 on Game 4&#x27;s outs, was simply not used. Game 7 availability, read off this game only (under 6 outs free, 6 to 8 outs capped at 3 outs, 9 or more outs unavailable for the next game), and it is the headline of the series: Ryan threw 21 outs and Hahn 9 outs, so both Game 1 starters are UNAVAILABLE for Game 7 and neither can appear in the decider in any role; Rijo threw 6 outs and is capped at 3 outs; Cordero, Franco, Dibble, Feliz and Wetteland threw 3 outs each and are free; and Chapman, Zimmerman and Knowles were untouched and are free, as are both projected Game 7 starters, the Game 2 starters Darvish for Texas and Walters for Cincinnati. Game 7 is at Great American Ball Park under the home pattern, winner take all. Sixteen decisions were graded. Ron Washington made 5 (3 paid off, 2 backfired): the Bottom 2 hit and run paid off (+0.39, Gonzalez singled and the runners took two), the Bottom 2 steal send backfired (-0.76, Gonzalez caught stealing), the Bottom 6 steal send backfired (-0.51, Kinsler held after his RBI single), and both of his pitching changes paid off (Feliz in the Top 8, +0.73; Wetteland in the Top 9, +0.73). Sparky Anderson made 11 (2 paid off, 6 backfired, 3 neutral): the Top 3 hit and run backfired (-0.76, Davis flew out), the Cordero change for the Bottom 4 backfired (-0.77, the run that made it 5-0), the Top 5 steal send backfired (-0.51, Pinson held), the Franco change for the Bottom 5 paid off (+0.73, a scoreless inning around Gonzalez&#x27;s triple), the Top 6 hit and run backfired at -1.13 (Bench struck out and Morgan was caught stealing, the double play that killed Cincinnati&#x27;s only rally), the Dibble change for the Bottom 6 was neutral (-0.27), the Top 7 steal send backfired (-0.86, Votto held after his walk), the Kluszewski pinch hit backfired (-0.76, a groundout to second), a second Top 7 steal send was neutral (-0.26, Votto stole second during Kluszewski&#x27;s at-bat), the Rijo change for the Bottom 7 was neutral (+0.23), and leaving the fatigued Rijo in during the Bottom 8 paid off (+1.00, Palmeiro struck out with the bases loaded to end the inning). Managers: Ron Washington (Texas) and Sparky Anderson (Cincinnati). Venue is Globe Life Field. The series is tied 3-3.">
