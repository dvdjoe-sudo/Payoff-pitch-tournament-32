  <title>L1-06-G1: Montreal Expos 6, New York Mets 4</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 6, Game 1 at Citi Field, as the master export&#x27;s box score prints the venue. This booking OPENS the series: the L1-06 slot (Losers Round 1, reseeded losers pool) was formed with this game, #21 New York Mets (manager Davey Johnson) against #27 Montreal Expos (manager Dick Williams), home pattern New York for Games 1, 2, 5 and 7, Montreal for Games 3, 4 and 6; the formation block stays as the shell carries it (rule reseed-high-vs-low, pool &quot;Losers of the 16 opening-round series&quot;, gate &quot;Round 1 is complete (all 16 opening series)&quot;), with the feeder labels as in the formed L1 entries. Both clubs carry one series loss into this series, so the loser of the series is eliminated and the winner advances to Losers Round 2. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every figure in the export agrees with itself across all of its sections. Decisions: Steve Rogers takes the win for Montreal (5.1 IP, 28 BF, 6 H, 2 R, 2 ER, 4 BB, 1 HBP, 3 SO, 1 HR, 1 WP). Tug McGraw takes the loss for New York (2.1 IP, 14 BF, 3 H, 3 R, 3 ER, 4 BB, 4 SO); he entered in the top of the 3rd after Tom Seaver&#x27;s ejection and was charged with the tying and go-ahead runs. Andy McGaffigan earns the save (0.1 IP, 1 BF): he entered in the bottom of the 9th with runners at first and second, two out, and Montreal ahead 6-4, and got the final out on a fly ball to center. Scoring: New York scored two in the bottom of the 1st off Rogers (Hernandez hit by pitch, Wright struck out, Strawberry two-run home run). Montreal tied it with two in the top of the 4th off McGraw (Carter and Dawson aboard, Fairly two-run double). Montreal scored one in the top of the 5th off McGraw (Guerrero&#x27;s double on the hit and run scored Staub from first). Montreal scored two in the top of the 7th off Billy Wagner (Wallach two-run double, Carter and Dawson scoring). New York scored two in the bottom of the 7th off Jeff Reardon (Piazza two-run home run, Strawberry aboard). Montreal scored its last run in the top of the 8th off Jesse Orosco (Carter&#x27;s double scored Staub). The brawl: in the top of the 3rd, with two out and the bases empty, Seaver hit Larry Walker with a pitch and the rare play fired (play row seq 25): batter and pitcher both ejected, with the app&#x27;s flavor text suspending each of them five games. The book records the ejections as played; it carries no suspension-availability machinery, so Game 2 availability stays outs-based (below). Rusty Staub took over Walker&#x27;s lineup spot in right field and scored two runs; McGraw took the mound. One play-row stamp was corrected under Joe&#x27;s ruling of 2026-11-13: row seq 25 carries pitcher NYM|mcgratu01 as exported, but its own steps show Seaver threw the pitch (&quot;Larry Walker (L) vs Tom Seaver (RHP)... PATIENT vs RHP at 46 -&gt; HBP&quot;, then the ejection steps, McGraw entering only afterward), and the printed pitching lines charge the plate appearance to Seaver (BF 12, HBP 1) and not to McGraw (BF 14, HBP 0). The row&#x27;s pitcher field was corrected to NYM|seaveto01 in the staged rows and the monolith plays string, documented here and in the official record; the printed book lines do not change, and with the single correction every admission gate passes. Errors: Montreal 1, Cabrera (E6), in the bottom of the 1st, Alonso reaching on the one-base error after the inning&#x27;s two runs had already scored on Strawberry&#x27;s home run; it cost nothing, and New York&#x27;s staff earned-run total of 6 ties to Montreal&#x27;s 6 runs while Montreal&#x27;s staff total of 4 ties to New York&#x27;s 4 runs. New York was errorless. No double plays were turned and no batter grounded into one. Stolen bases: none; Montreal sent the runner twice in the top of the 1st and Raines was held both times, which are Dick Williams&#x27;s two graded backfired steals. Wild pitches: Rogers 1, in the bottom of the 2nd during Wright&#x27;s popout; runners advanced and no run scored. Passed balls: none for either club. Substitutes: Staub (right field for the ejected Walker from the top of the 3rd; walked, walked and singled, scored two runs); John Olerud pinch-hit for Alonso in the bottom of the 7th, doubled, and stayed in as the designated hitter, batting again in the bottom of the 9th; Brian Schneider replaced Carter at catcher in the bottom of the 8th (one putout, never batted); Mike Lansing replaced Vidro at second base in the bottom of the 9th for defense and had no fielding chance, so he carries no fielding line, exactly as the export prints them. Fielding from the CSV&#x27;s printed fielding section: Montreal 27 putouts and 9 assists (Fairly 11 putouts; Vidro 4 assists); New York 27 putouts and 7 assists (Piazza 12 putouts; Lindor 3 assists). Counting checks: Montreal plate appearances 47 (37 AB, 8 BB, 2 HBP) equal New York&#x27;s 47 batters faced (Seaver 12, McGraw 14, Díaz 5, Wagner 4, Orosco 7, Benítez 5); New York plate appearances 45 (37 AB, 7 BB, 1 HBP) equal Montreal&#x27;s 45 batters faced (Rogers 28, Reardon 4, Rojas 5, Burke 3, Wetteland 4, McGaffigan 1). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Dick Williams graded 11 decisions (6 paid off, 2 backfired, 3 neutral): steals 2 (the top of the 1st backfired, -0.86, Raines held; the top of the 1st backfired, -0.51, Raines held), hit and runs 2 (the top of the 5th paid off, +0.74, Guerrero&#x27;s double scored Staub; the top of the 8th neutral, +0.24), pitching changes 5 (Reardon in the bottom of the 6th paid off, +1.13; Rojas in the bottom of the 7th neutral, +0.23; Burke in the bottom of the 8th paid off, +0.73; Wetteland in the bottom of the 9th neutral, +0.23; McGaffigan in the bottom of the 9th paid off, +0.68, the save), and defensive subs 2 (Schneider at catcher in the bottom of the 8th paid off, +0.48; Lansing at second base in the bottom of the 9th paid off, +0.48). Davey Johnson graded 6 decisions (3 paid off, 1 backfired, 2 neutral): one left-pitcher-in (the top of the 5th paid off, +0.41, McGraw left in fatigued and finished the inning), pitching changes 4 (Díaz in the top of the 6th paid off, +0.73; Wagner in the top of the 7th backfired, -1.77, hit the first batter and two runs scored in the inning; Orosco in the top of the 7th paid off, +0.91; Benítez in the top of the 9th neutral, +0.23), and one pinch hitter (Olerud in the bottom of the 7th neutral, -0.23, doubled). Availability for Game 2 at New York, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game; a new series resets availability, so nothing carried over from Round 1): Montreal: Rogers (16 outs) is unavailable; every other Montreal arm is free, nobody capped. New York: Seaver (8 outs) and McGraw (7 outs) are each capped at 3 outs; every other New York arm is free. Managers: Dick Williams (Montreal) and Davey Johnson (New York). Venue is Citi Field, as printed.">
