  <title>L1-05-G2: Colorado Rockies 0, Los Angeles Angels 9</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 5, Game 2 at Angel Stadium of Anaheim, as the graded log prints the venue. Booked from the full app export set, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the standalone plays JSON, the Gazette scorecard PDF, the scorecard photo, and the graded play-by-play log. All sources agree on every figure booked. Decisions: Nolan Ryan takes the win for Los Angeles (8.0 IP, 30 BF, 2 H, 0 R, 0 ER, 3 BB, 2 HBP, 13 SO) and Kyle Freeland takes the loss for Colorado (2.1 IP, 13 BF, 7 H, 5 R, 5 ER, 0 BB, 1 SO). No save: Francisco Rodríguez pitched the top of the 9th with Los Angeles ahead 9-0 (1.0 IP, 5 BF, 1 H, 1 BB, 2 SO, 1 WP). Scoring: Los Angeles scored one in the bottom of the 1st (Ohtani triple, Trout RBI groundout). Los Angeles scored four in the bottom of the 3rd: the first three charged to Freeland (Boone double, Trout RBI single, Guerrero RBI double on the hit-and-run, Glaus RBI single) and the fourth run Glaus&#x27;s own, scored on Joyner&#x27;s RBI double off Brian Fuentes but charged to Freeland as his runner; Fuentes closed the inning with no runs charged to himself. Los Angeles scored two in the bottom of the 5th off Boone Logan (Joyner walk, Grich sacrifice bunt, Fregosi RBI single, Boone RBI single), one in the bottom of the 6th off Rafael Betancourt (Guerrero single and stolen base, Joyner RBI double), and one in the bottom of the 8th off Matt Belisle (Trout single and stolen base, Joyner sacrifice fly). Colorado never scored: Ryan allowed singles to Holliday and Arenado and a double to Arenado across eight shutout innings, and his two hit batters were Galarraga in the top of the 3rd and Tulowitzki in the top of the 4th. An errorless game for both clubs. Each club turned one double play: Colorado&#x27;s in the bottom of the 2nd (Fregosi grounded into the 5-4-3 double play, Arenado to LeMahieu to Helton) and Los Angeles&#x27;s in the top of the 6th (Walker grounded into the double play, Glaus to Grich to Joyner). Fielding from the CSV&#x27;s printed fielding section: Colorado 24 putouts and 10 assists; Los Angeles 27 putouts and 7 assists; no passed balls. Wild pitches: Colorado&#x27;s Logan two and DiPoto one; Los Angeles&#x27;s Rodríguez one. Counting checks: Colorado plate appearances 35 (29 AB, 4 BB, 2 HBP) equal Los Angeles&#x27;s 35 batters faced (Ryan 30, Rodríguez 5); Los Angeles plate appearances 42 (39 AB, 1 BB, 1 sacrifice bunt, 1 sacrifice fly) equal Colorado&#x27;s 42 batters faced (Freeland 13, Fuentes 9, Logan 6, Betancourt 5, DiPoto 4, Belisle 5). Hit, walk and strikeout totals tie across the two boxes both ways. Manager grades: Mike Scioscia graded 8 decisions (6 paid off, 1 backfired, 1 neutral): steal sends 4, all paid off (the bottom-of-the-5th send with Joyner aboard, no outs, +1.14, runner held; the bottom-of-the-5th send with Joyner aboard, one out, +1.49, runner held; the bottom-of-the-6th send, +0.74, Guerrero stole second; the bottom-of-the-8th send, +0.39, Trout stole second), hit and runs 3 (the bottom-of-the-3rd call paid off, +2.74, Guerrero&#x27;s double scored two on the play; the bottom-of-the-3rd call paid off, +0.74, Joyner&#x27;s double; the bottom-of-the-7th call backfired, -0.76, Boone struck out), and one pitching change (Rodríguez in the top of the 9th neutral, +0.23). Bud Black graded 7 decisions (2 paid off, 4 backfired, 1 neutral): pitching changes 5 (Fuentes in the bottom of the 3rd backfired, -0.74, Joyner doubled on the next plate appearance; Logan in the bottom of the 5th backfired, -1.77, Joyner walked; Betancourt in the bottom of the 6th neutral, -0.27; DiPoto in the bottom of the 7th paid off, +0.73; Belisle in the bottom of the 8th backfired, -0.77, Trout singled), one left-pitcher-in (Logan left in during the bottom of the 5th paid off, +0.47), and one steal send (the top of the 7th with Holliday aboard backfired, -0.51, runner held). Availability for Game 3 at Colorado, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; availability reads only the previous game and lasts exactly one game, so the Game 1 restrictions on Finley and Jimenez expired with Game 2): Los Angeles: Ryan (24 outs) is unavailable; Rodríguez (3 outs) is free; every other Los Angeles arm is free, nobody capped. Colorado: Freeland (7 outs) is capped at 3 outs; Fuentes (5 outs), Logan (3), Betancourt (3), DiPoto (3) and Belisle (3) are free; every other Colorado arm is free. Game 1&#x27;s availability was honored in this game: Finley and Jimenez, both unavailable, did not pitch. Managers: Mike Scioscia (Los Angeles) and Bud Black (Colorado). Venue is Angel Stadium of Anaheim, as printed.">
