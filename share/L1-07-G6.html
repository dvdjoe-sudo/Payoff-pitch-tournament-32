  <title>L1-07-G6: Milwaukee Brewers 4, San Diego Padres 3</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 7, Game 6 at Petco Park, as the master export&#x27;s box score prints the venue. San Diego won Game 1 (11-8), Milwaukee won Game 2 (10-7) and Game 3 (5-3), San Diego won Game 4 (4-3) and Game 5 (19-13), and San Diego led the series 3-2 entering this game. Milwaukee, facing elimination, scored three runs in the top of the 9th to win 4-3 and tie the series 3-3; Game 7 at Milwaukee decides the series, and the loser is eliminated. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Decisions: Rollie Fingers takes the win for Milwaukee: he pitched a scoreless bottom of the 8th (1.0 IP, 4 BF, 1 H, 0 R, 1 SO) and was the pitcher of record when Milwaukee rallied in the 9th; he also threw 0.2 innings for San Diego in the top of the 9th (see below), so he pitched for each club in the same game, as he did in Game 1 of this series, and his two lines are booked per (team, player_id) exactly as played and never merged. Luke Gregerson takes the loss for San Diego (0.1 IP, 5 BF, 3 H, 3 R, 3 ER, 1 BB, 1 SO), charged with all three Milwaukee runs in the 9th; the export&#x27;s extra list carries his blown save. Josh Hader earns the save for Milwaukee (1.0 IP, 4 BF, 1 H, 0 R, 1 SO). Brice Turang was the export&#x27;s Player of the Game (1 for 3, 1 R, 1 RBI, 1 BB, 1 SB): his 9th-inning single drove in the first run of the rally and he scored the go-ahead run on a wild pitch. Scoring: San Diego scored in the bottom of the 2nd: Tenace walked, Finley grounded out with Tenace advancing, and Loretta&#x27;s single scored Tenace; Tatis then grounded into a double play on the hit and run. Milwaukee tied it in the top of the 5th: Jenkins singled and was caught stealing; Turang walked, stole second with catcher Tenace&#x27;s throw sailing (SB+E2) and took third, then was thrown out at home on Braun&#x27;s fielder&#x27;s choice; Yelich singled and Molitor&#x27;s single scored Braun; Yount walked to load the bases and Cecil Cooper, pinch-hitting for George Scott, grounded out to third to end the inning. San Diego went back ahead in the bottom of the 5th: Loretta tripled off Teddy Higuera, Dan Plesac relieved, and Tatis&#x27;s sacrifice fly scored Loretta, charged to Higuera (the export carries Plesac&#x27;s inherited runners as 1 in, 1 scored). San Diego added one in the bottom of the 6th: Adrian Gonzalez walked off Plesac, Devin Williams relieved, and Finley&#x27;s double scored Gonzalez, charged to Plesac (Williams&#x27;s inherited runners 1 in, 1 scored). Milwaukee won it in the top of the 9th off Gregerson: Fielder walked, Contreras singled, Jenkins struck out, Turang&#x27;s single scored Fielder, and Braun&#x27;s single scored Contreras; Rollie Fingers, pitching for San Diego, relieved Gregerson and, during Yelich&#x27;s plate appearance, threw a wild pitch that scored Turang from third with no RBI; Yelich walked, Carlos Gomez pinch-ran for him, and Molitor (on the hit and run) and Yount grounded out. Hader closed the bottom of the 9th: Finley singled, Loretta and Tatis hit into forceouts, and Gwynn struck out. The no-RBI run: Milwaukee scored 4 runs on 3 printed RBIs (Molitor 1, Turang 1, Braun 1); the fourth is Turang&#x27;s wild-pitch run in the top of the 9th (play row sequence 82), charged earned to Gregerson exactly as printed, and the earned-run totals tie exactly: San Diego&#x27;s staff total of 4 equals Milwaukee&#x27;s 4 runs and Milwaukee&#x27;s staff total of 3 equals San Diego&#x27;s 3 runs. No home runs were hit in the game, after ten in Game 5. Double plays: one, turned by Milwaukee in the bottom of the 2nd (Tatis grounds into a double play on the hit and run, as the play rows code it). Tatis&#x27;s printed GIDP is 0 and the printed fielding section carries no DP credits, so the play rows&#x27; GIDP of 1 for Tatis is the only difference between the rows and the printed lines: under the standing practice (Joe, 2026-11-10) the play rows govern on the GIDP definition and are adopted automatically with the printed line unchanged, the same hit-and-run case as Art Fletcher in W2-02 Game 1, Willie McCovey in W2-02 Game 2, Al Valo in L1-03 Game 4 and Christian Yelich in Game 3 of this series. Errors: one, San Diego&#x27;s Gene Tenace (E2, the throwing error on Turang&#x27;s 5th-inning steal); it scored nobody. Milwaukee was errorless. Stolen bases: Milwaukee&#x27;s Turang one; Jenkins was caught stealing once, and the fielding section charges Tenace with two stolen bases attempted against, one stolen and one caught. Wild pitches: one, San Diego&#x27;s Rollie Fingers in the top of the 9th, the pitch Turang scored on. Passed balls: none. Hit by pitch: Winfield, by Plesac. Substitutes: Milwaukee&#x27;s Cecil Cooper pinch-hit for George Scott in the top of the 5th and stayed in at first base; Carlos Gomez pinch-ran for Yelich in the top of the 9th and stayed in; B.J. Surhoff replaced William Contreras at catcher in the bottom of the 9th (defensive sub) and did not bat; he carries a fielding line only (1 putout), exactly as printed. San Diego&#x27;s Gary Sheffield replaced Manny Machado at third base in the top of the 8th (defensive sub) and stayed in, doubling in his only at-bat; Brian Giles replaced Dave Winfield in left field in the top of the 9th (defensive sub), never batted and had no fielding chance, and carries no batting or fielding line, exactly as printed. Fielding from the CSV&#x27;s printed fielding section: Milwaukee 27 putouts and 9 assists, errorless (Yount 4 assists, Molitor 3; Cooper also carries one range out, as printed); San Diego 27 putouts and 11 assists and 1 error (Tenace 10 putouts and the error, Gonzalez 10 putouts, Tatis 4 assists; Finley also carries one range out, as printed). Counting checks: Milwaukee plate appearances 39 (34 AB, 5 BB) equal San Diego&#x27;s 39 batters faced (Peavy 25, Adams 3, Bell 3, Gregerson 5, Fingers 3); San Diego plate appearances 38 (32 AB, 4 BB, 1 HBP, 1 SF) equal Milwaukee&#x27;s 38 batters faced (Higuera 18, Plesac 6, Williams 6, Fingers 4, Hader 4). Hit, walk, hit-by-pitch, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Pat Murphy graded 10 decisions (3 paid off, 4 backfired, 3 neutral): two steals (Jenkins caught stealing in the top of the 5th neutral, -0.11; Turang&#x27;s steal in the top of the 5th paid off, +0.74), one pinch hitter (Cooper in the top of the 5th backfired, -1.00, grounding out with the bases loaded and two out), four pitching changes (Plesac in the bottom of the 5th backfired, -0.30; Devin Williams in the bottom of the 6th neutral, -0.09; Fingers in the bottom of the 8th paid off, +0.73; Hader as closer in the bottom of the 9th neutral, +0.23), one pinch runner (Gomez in the top of the 9th backfired, -0.88), one hit and run (the top of the 9th backfired, -1.13) and one defensive sub (Surhoff at catcher in the bottom of the 9th paid off, +0.48). Bruce Bochy graded 8 decisions (3 paid off, 3 backfired, 2 neutral): two hit and runs (the bottom of the 2nd backfired, -0.76, on Tatis&#x27;s double play; the bottom of the 6th neutral, -0.11), four pitching changes (Adams in the top of the 7th paid off, +0.73; Bell in the top of the 8th paid off, +0.73; Gregerson in the top of the 9th backfired, -2.77, with three runs scoring in the rest of the inning; Fingers in the top of the 9th neutral, -0.12) and two defensive subs (Sheffield at third base in the top of the 8th paid off, +0.48; Giles in left field in the top of the 9th backfired, -2.52). Series graded totals through six games: Murphy 74 decisions (29 paid off, 32 backfired, 13 neutral); Bochy 44 (22 paid off, 15 backfired, 7 neutral). Availability compliance: Eric Show (11 outs in Game 5), Mike Caldwell (11 outs in Game 5) and Ben Sheets (11 outs in Game 5) were unavailable and none pitched; Trevor Hoffman (6 outs in Game 5) was capped at 3 outs and did not pitch at all. Availability for Game 7 at Milwaukee: Jake Peavy (18 outs in this game) and Teddy Higuera (13 outs) are unavailable; nobody else reached six outs, so there are no caps and everyone else is free. Series state: the series is tied 3-3. Series runs: San Diego 47, Milwaukee 43 (90 total, extending the tournament&#x27;s highest-scoring series). Clubs: Milwaukee 4-7 in games, San Diego 3-7, each 0-1 in series. Game 7 is at Milwaukee; the loser is eliminated. Managers: Pat Murphy (Milwaukee) and Bruce Bochy (San Diego). Venue is Petco Park, as printed.">
