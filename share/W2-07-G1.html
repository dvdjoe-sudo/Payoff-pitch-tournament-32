  <title>W2-07-G1: Los Angeles Dodgers 0, Atlanta Braves 1</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 7, Game 1 at Truist Park. This booking forms the series in its archive slot: Atlanta, the #7 seed, against Los Angeles, the #10 seed, the reseeded Winners Round 2 pairing, with Atlanta home for Games 1, 2, 5 and 7. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. A 1-0 pitchers&#x27; duel, the lowest-scoring game shape there is: five hits total, no home runs, and the only run walked in through the bullpen door in the bottom of the 7th. Decisions: Greg Maddux takes the win for Atlanta (7.0 IP, 22 BF, 1 H, 0 R, 0 ER, 0 BB, 8 SO), the export&#x27;s player of the game; his one hit allowed was Ron Cey&#x27;s single in the top of the 6th, and he stranded him there after Pee Wee Reese&#x27;s sacrifice bunt and Jackie Robinson&#x27;s groundout. Jim Brewer takes the loss for Los Angeles (0.2 IP, 5 BF, 0 H, 1 R, 1 ER, 3 BB, 1 SO). He entered in the bottom of the 6th with two inherited runners (Ozzie Albies had walked and Rabbit Maranville had singled off Sandy Koufax; the Rec&#x27;s extra line reads 2 inherited, 0 scored for Brewer) and stranded them, striking out Chipper Jones, walking Hank Aaron to load the bases, and getting Eddie Mathews&#x27;s flyout. In the bottom of the 7th Brewer walked Joe Torre and Freddie Freeman, and Kenley Jansen relieved: Dale Murphy grounded into a double play (SS unassisted at 2nd, to 1st) that erased Freeman, and Andruw Jones doubled Torre home with the game&#x27;s only run, charged to Brewer; Jansen&#x27;s extra line reads 2 inherited, 1 scored. Craig Kimbrel earns the save (1.0 IP, 4 BF, 0 H, 1 BB, 2 SO), working around Jackie Robinson&#x27;s leadoff walk in the 9th: Pedro Guerrero struck out as a pinch hitter, Robinson held at first on a poor jump, Mookie Betts&#x27;s forceout erased him, and Shohei Ohtani struck out to end it. Mike Remlinger takes the hold (1.0 IP, 5 BF, 1 H, 1 HBP): in the top of the 8th he hit Duke Snider, got Gil Hodges&#x27;s flyout, gave up Campanella&#x27;s single, and escaped when Ron Cey&#x27;s fielder&#x27;s choice cut Snider down at home with the infield in and Reese grounded out. Scoring: the bottom of the 7th only, as traced above; Andruw Jones&#x27;s double is the decisive play the export&#x27;s summary names. Sandy Koufax took a no-decision in a start that deserved better (5.1 IP, 19 BF, 2 H, 0 R, 1 BB, 3 SO): the two hits off him were Chipper Jones&#x27;s single in the 4th and Maranville&#x27;s single in the 6th. Atlanta&#x27;s three hits were Maranville&#x27;s single, Chipper Jones&#x27;s single, and Andruw Jones&#x27;s double (1 RBI, the game&#x27;s only one). Los Angeles&#x27;s two hits were Cey&#x27;s single off Maddux and Campanella&#x27;s single off Remlinger. Joe Torre scored the run without a hit (0 for 2, 1 walk); Albies walked twice in three trips. The game was errorless, and defensive lines are booked in the established shape from the printed fielding section (Los Angeles 24 putouts and 6 assists, Campanella 6 putouts catching, Reese 3 assists; Atlanta 27 putouts and 10 assists, Torre 11 putouts catching, Albies 4 assists). One double play was turned: Murphy&#x27;s bottom-of-the-7th grounder, SS unassisted at 2nd to 1st, a genuine double-play row in the app&#x27;s native rows (coded DP 6-4-3) and Atlanta&#x27;s only printed GIDP; Reese carries the putout and the assist and Hodges the second putout in the fielding credits. No stolen bases and no caught stealings; the one graded steal decision was Robinson staying put on a poor jump in the 9th (graded backfired for Lasorda). Wild pitches: none. Passed balls: none. Hit by pitch: Snider, by Remlinger in the top of the 8th, the game&#x27;s only one. Counting checks: Los Angeles plate appearances 31 (28 AB, 1 BB, 1 HBP, 1 SH) equal Atlanta&#x27;s 31 batters faced (Maddux 22, Remlinger 5, Kimbrel 4); Atlanta plate appearances 31 (26 AB, 5 BB) equal Los Angeles&#x27;s 31 batters faced (Koufax 19, Brewer 5, Jansen 7). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Atlanta&#x27;s one run carries its one RBI; Los Angeles scored none. Manager grades: the grades list names both managers directly, so no label mapping is needed. Tommy Lasorda graded 4 decisions (2 paid off, 2 backfired): two pitching changes, both paid off (Brewer in the 6th, Jansen in the 7th), the Guerrero pinch-hit backfired (9th-inning strikeout), and the one steal backfired (Robinson&#x27;s poor jump in the 9th). Bobby Cox graded 2 decisions, both neutral: his two pitching changes (Remlinger in the 8th, Kimbrel in the 9th). Availability for Game 2 under the convention: Greg Maddux (21 outs in this game) and Sandy Koufax (16 outs) are unavailable; Kenley Jansen (6 outs) is capped at 3 outs; Jim Brewer (2 outs), Mike Remlinger (3) and Craig Kimbrel (3) are free. Atlanta leads the series 1-0. Managers: Bobby Cox (Atlanta) and Tommy Lasorda (Los Angeles). Venue is Truist Park, as printed.">
