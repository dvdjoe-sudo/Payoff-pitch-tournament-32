  <title>L1-01-G1: Miami Marlins 1, Philadelphia Phillies 3</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-07: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official L1-01 Game 1 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This is Losers Bracket Round 1, Series 1: the Miami Marlins (seed 32) against the Philadelphia Phillies (seed 11), the two highest-against-lowest pairing of the reseeded losers pool. Both clubs lost their opening series, Miami to the Yankees in R1-01 and Philadelphia to Oakland in R1-11, so both carry one series loss and the loser of this series is eliminated. The pairing follows BRACKET.md: when a stage forms, its pool is reseeded by original tournament seed and paired highest against lowest, the series of a stage numbered in pairing order; the 16 opening losers by seed run Philadelphia 11 at the top down to Miami 32 at the bottom, so Philadelphia against Miami is the first pairing, L1-01, and the archive slot&#x27;s own formation entry states the same rule and gate (reseed-high-vs-low, losers of the 16 opening-round series, forms when Round 1 is complete). The slot still sat as an unfilled shell with no clubs when this box score arrived, the opening round having closed with R1-16 earlier the same day, so the formation was written into the L1-01 entry as part of this booking: Philadelphia as team_a at seed 11, Miami as team_b at seed 32, home pattern 2-2-1-1-1 with Philadelphia home for Games 1, 2, 5, and 7. Home pattern 2-2-1-1-1, Game 1 at Citizens Bank Park in Philadelphia. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Steve Carlton takes the win: he pitched the complete game (9.0 IP, 5 H, 1 R, 1 ER, 2 BB, 1 HBP, 8 SO, 0 HR) and was Philadelphia&#x27;s pitcher of record when Philadelphia took the lead for good in the Bottom 9. Robb Nen takes the loss: he pitched the Bottom 9 and both Philadelphia runs in the inning are charged to him on the card (0.2 IP, 3 H, 2 R, 2 ER, 0 BB, 1 SO, 0 HR). There is no save: Carlton, the winning pitcher, finished the game himself. Josh Johnson started for Miami and takes no decision (6.0 IP, 3 H, 1 R, 1 ER, 5 BB, 0 HBP, 9 SO, 1 HR); he left after six innings with the game tied 1-1, and Tanner Scott (1.0 IP, scoreless) and A.J. Ramos (1.0 IP, 1 BB, 1 HBP, 1 SO) bridged the seventh and eighth before Nen. Run charges match the printed lines exactly: Philadelphia pitching allows 1 (Carlton 1), and Miami pitching allows 3 (Johnson 1, Scott 0, Ramos 0, Nen 2). The duplicate test ran before the number was assigned: the series had no stored games, this being its first, so the box score takes Game 1. The game: Miami scored in the Top 1, Yelich tripling with one out and Sheffield singling him home, and that was Miami&#x27;s whole offense. Philadelphia&#x27;s first hit carried its own trouble: Callison singled to open the Bottom 1 and took second on Cabrera&#x27;s error, but Johnson struck out Klein and Schmidt to strand him at third. Rollins tied the game in the Bottom 3 with a solo home run off Johnson. Cabrera doubled in the Top 4 and Floyd reached on Rollins&#x27;s error behind him, putting runners at first and third with two out, but Conine popped out to third and Miami never got another runner past second. It stayed 1-1 into the Bottom 9: Nen struck out Utley and got Ruiz on a grounder, then Rollins singled to center, Callison singled to center with Rollins taking third, and Abreu doubled to right, both runners scoring, a walk-off double. Miami stranded 7 and Philadelphia 9. Home runs: one, Rollins&#x27;s solo shot for Philadelphia in the Bottom 3 off Johnson. Doubles: two, Cabrera for Miami (Top 4) and Abreu for Philadelphia (Bottom 9, the game-winner). Triples: one, Yelich for Miami (Top 1). Errors: two, one for each club, Cabrera for Miami (E5, Bottom 1, on Callison&#x27;s single, the batter taking second) and Rollins for Philadelphia (E6, Top 4, Floyd reaching); neither error produced a run, and every run in the game is earned on the card. Hit batters: two, Yelich hit by Carlton in the Top 8 (the benches were warned) and Abreu hit by Ramos in the Bottom 8 (the log calls it retaliation); HB 1 for Carlton and HB 1 for Ramos and HBP 1 for Yelich and HBP 1 for Abreu are carried as card-sourced values, and every other pitcher&#x27;s HB and every other batter&#x27;s HBP is a card-sourced zero, so the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: two bunts, both Castillo for Miami (Top 3 and Top 5), so the split lines read SH 2 for Castillo and SH 0 and SF 0 for every other batter; Callison&#x27;s popped-up bunt in the Bottom 5 is an at-bat, not a sacrifice. Stolen bases: none. Caught stealing: none. Double plays grounded into: two, Cabrera for Miami in the Top 8 and Utley for Philadelphia in the Bottom 4, one double play turned by each club. Substitutions: one with a plate appearance, Ed Delahanty pinch-hitting for Ryan Howard in the Bottom 8 and striking out, so the Gazette prints ten Philadelphia batting lines; Miami printed nine. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on, and the walk-off double ending the Bottom 9 with two outs recorded, so Philadelphia&#x27;s outs identity runs on 26: Miami PA is AB 30 plus BB 2 plus HBP 1 plus SH 2, which is 35, and the outs plus runs plus stranded identity agrees (27 outs plus 1 run plus 7 stranded is 35); Philadelphia PA is AB 31 plus BB 6 plus HBP 1, which is 38, and the identity agrees (26 outs plus 3 runs plus 9 stranded is 38). Batters faced tie to those totals: Miami 35 PA against 35 Philadelphia BF (Carlton 35), and Philadelphia 38 PA against 38 Miami BF (Johnson 25, Scott 3, Ramos 5, Nen 5), counted from the play log. Strikeouts tie both ways: Miami batting 8 against Philadelphia pitching 8 (Carlton 8), and Philadelphia batting 12 against Miami pitching 12 (Johnson 9, Scott 1, Ramos 1, Nen 1). Printed RBI: Miami 1 for 1 (Sheffield 1) and Philadelphia 3 for 3 (Abreu 2, Rollins 1). Availability: this is the first game of a new series in a new round, and bullpen availability resets between rounds, so every arm on both clubs was free; no restriction from either club&#x27;s opening series carries in. Six decisions were graded. Jack McKeon (Miami) made 5 (1 paid off, 3 backfired, 1 neutral): his sacrifice bunt calls in the Top 3 and the Top 5 both backfired at -0.61, the runners moving up but no run scoring either inning; the change to Scott for the Bottom 7 paid off at +0.73, the game&#x27;s best grade; the change to Ramos for the Bottom 8 was neutral at +0.23, the next batter, Abreu, reaching on the hit by pitch but no run scoring; and the change to Nen for the Bottom 9 backfired at -1.27, the game&#x27;s worst grade, two runs scoring to end the game. Charlie Manuel (Philadelphia) made 1 (0 paid off, 1 backfired, 0 neutral): the Delahanty pinch hit for Howard in the Bottom 8 backfired at -0.68, Delahanty striking out with runners at first and second. Managers: Jack McKeon (Miami) and Charlie Manuel (Philadelphia). Venue is Citizens Bank Park. Philadelphia leads the series 1-0.">
