  <title>L1-01-G2: Miami Marlins 9, Philadelphia Phillies 3</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-07: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official L1-01 Game 2 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This is Losers Bracket Round 1, Series 1: the Miami Marlins (seed 32) against the Philadelphia Phillies (seed 11), home pattern 2-2-1-1-1, Game 2 at Citizens Bank Park in Philadelphia. Both clubs carry one series loss and the loser of this series is eliminated. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Sandy Alcantara takes the win outright: he completed five innings and more (5.2 IP, 7 H, 3 R, 2 ER, 2 BB, 0 HBP, 3 SO, 0 HR) and was Miami&#x27;s pitcher of record when Miami took the lead for good in the Top 6. Robin Roberts takes the loss (8.0 IP, 5 H, 5 R, 5 ER, 3 BB, 0 HBP, 7 SO, 1 HR); the four Top 6 runs that put Miami ahead to stay are all charged to him. There is no save: Tanner Scott (1.1 IP, scoreless, 1 BB, 1 SO), A.J. Ramos (1.0 IP, scoreless, 1 BB, 1 SO), and Robb Nen (1.0 IP, scoreless, 1 BB) finished it, Nen entering the Bottom 9 with a six-run lead at 9-3, no save situation under any prong. Jonathan Papelbon took the Top 9 beating for Philadelphia (0.1 IP, 3 H, 4 R, 3 ER, 0 BB, 0 SO, 1 HR) and Brad Lidge got the last two outs (0.2 IP, scoreless, 1 SO). Run charges match the printed lines exactly: Miami pitching allows 3 (Alcantara 3, Scott 0, Ramos 0, Nen 0), and Philadelphia pitching allows 9 (Roberts 5, Papelbon 4, Lidge 0). The duplicate test ran before the number was assigned: the series&#x27; one stored game is Game 1, a 3-1 Philadelphia win with a different score and linescore, so this box score takes Game 2. The game: it was scoreless into the fourth, Luis Castillo walking and getting caught stealing in a scoreless Top 1 after McKeon sent him. Miami broke through in the Top 4: Yelich singled, stole second on another send, and scored on Sheffield&#x27;s single to center. Philadelphia answered at once in the Bottom 4, Schmidt singling, Harper walking, Howard doubling Schmidt home, and Ruiz grounding out to second with Harper scoring, and added one in the Bottom 5, Callison doubling, Abreu reaching on Cabrera&#x27;s error, and Callison scoring as Klein grounded into a double play, for a 3-1 lead. Miami&#x27;s Top 6 decided it: Yelich walked, Sheffield singled him home to cut it to 3-2, Stanton walked, and after Cabrera popped out, Hanley Ramirez hit a three-run home run off Roberts for a 5-3 lead. It held at 5-3 into the Top 9, when Papelbon came on and the inning ran Cabrera single, Ramirez forceout, Floyd single, Conine reaching on Rollins&#x27;s error with Ramirez scoring, and Realmuto&#x27;s three-run home run, four runs and a 9-3 final margin before Lidge closed the inning. Miami stranded only 2 all game and Philadelphia 8. Home runs: two, both for Miami, Ramirez&#x27;s three-run shot in the Top 6 off Roberts and Realmuto&#x27;s three-run shot in the Top 9 off Papelbon. Doubles: four, all for Philadelphia, Abreu (Bottom 3), Howard (Bottom 4), Callison (Bottom 5), and Ruiz (Bottom 6). Triples: none. Errors: two, one for each club, Cabrera for Miami (E5, Bottom 5, Abreu reaching) and Rollins for Philadelphia (E6, Top 9, Conine reaching), the same two fielders who erred in Game 1. Two of the game&#x27;s twelve runs are unearned on the card: Callison&#x27;s Bottom 5 run against Alcantara, who is printed at 3 R and 2 ER, the fifth inning having been extended by Cabrera&#x27;s error before the run scored on the double play; and Conine&#x27;s Top 9 run against Papelbon, who is printed at 4 R and 3 ER, Conine having reached on Rollins&#x27;s error before scoring on Realmuto&#x27;s home run. Ramirez&#x27;s Top 9 run, which scored on the error play itself, carries no RBI. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are card-sourced values, so the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: none, so the split lines read SH 0 and SF 0 for every batter. Stolen bases: one, Yelich for Miami in the Top 4. Caught stealing: one, Castillo for Miami in the Top 1, one of that inning&#x27;s outs and never an add-on in the plate appearance arithmetic. Double plays grounded into: two, both Klein for Philadelphia (Bottom 5 and Bottom 7), both turned by Miami. Substitutions: one with a plate appearance, Ed Delahanty pinch-hitting for Ryan Howard in the Bottom 8 and popping out to second, so the Gazette prints ten Philadelphia batting lines; Miami printed nine. One reading note: the scorecard grid&#x27;s shared Howard and Delahanty row aligns Delahanty&#x27;s popout ambiguously by column, but the graded play log, the Gazette&#x27;s own compact play log, and the decisions summary all place the pinch hit in the Bottom 8, and the printed lines are booked on that footing. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Miami PA is AB 35 plus BB 3, which is 38, and the outs plus runs plus stranded identity agrees (27 outs plus 9 runs plus 2 stranded is 38); Philadelphia PA is AB 33 plus BB 5, which is 38, and the identity agrees (27 outs plus 3 runs plus 8 stranded is 38). Batters faced tie to those totals: Miami 38 PA against 38 Philadelphia BF (Roberts 31, Papelbon 5, Lidge 2), counted from the play log, and Philadelphia 38 PA against 38 Miami BF (Alcantara 26, Scott 4, Ramos 4, Nen 4). Strikeouts tie both ways: Miami batting 8 against Philadelphia pitching 8 (Roberts 7, Papelbon 0, Lidge 1), and Philadelphia batting 5 against Miami pitching 5 (Alcantara 3, Scott 1, Ramos 1, Nen 0). Printed RBI: Miami 8 for 9 (Sheffield 2, Ramirez 3, Realmuto 3), the ninth run, Ramirez in the Top 9, scoring on the error play with no RBI; Philadelphia 2 for 3 (Howard 1, Ruiz 1), the third run scoring on Klein&#x27;s Bottom 5 double play with no RBI. Availability: inside the series the house outs convention reads Game 1 only. Steve Carlton threw 27 outs in Game 1 and was unavailable, and correctly went unused; Josh Johnson threw 18 outs in Game 1 and was likewise unavailable and unused. The Game 1 relievers were all short-outing and free: Nen (2 outs), Scott (3), and Ramos (3) all pitched here legally, and Roberts had no Game 1 line, so he was free to start. Eleven decisions were graded. Jack McKeon (Miami) made 8 (5 paid off, 1 backfired, 2 neutral): the Top 1 steal that got Castillo caught backfired at -1.11; the Top 4 steal that put Yelich in scoring position paid off at +0.39; leaving Alcantara in for the Bottom 5 was neutral at -0.15; the Top 6 steal call on Yelich, who held at first, paid off at +3.49, the game&#x27;s best grade, four runs scoring in the inning; leaving Alcantara in for the Bottom 6 paid off at +0.73; the change to Scott in the Bottom 6 paid off at +0.57; the change to Ramos for the Bottom 8 was neutral at +0.23; and the change to Nen for the Bottom 9 paid off at +0.73. Charlie Manuel (Philadelphia) made 3 (1 paid off, 2 backfired, 0 neutral): the Delahanty pinch hit for Howard in the Bottom 8 backfired at -0.76, Delahanty popping out; the change to Papelbon for the Top 9 backfired at -3.77, the game&#x27;s worst grade, four runs scoring; and the change to Lidge in the Top 9 paid off at +0.50. Managers: Jack McKeon (Miami) and Charlie Manuel (Philadelphia). Venue is Citizens Bank Park. The series is tied 1-1.">
