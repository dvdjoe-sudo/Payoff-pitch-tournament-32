  <title>L1-08-G4: Texas Rangers 6, Toronto Blue Jays 7</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 8, Game 4 at Rogers Centre, as the master export&#x27;s box score prints the venue. Toronto leads the series 3-1, and Texas faces elimination in Game 5 at Globe Life Field. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. The export&#x27;s own sections all agree with each other and with every figure in the booking brief. Decisions: Pat Hentgen takes the win for Toronto (6.0 IP, 27 BF, 9 H, 6 R, 5 ER, 0 BB, 6 SO, 3 HR), surviving three home runs because Texas never walked once against him. Gaylord Perry takes the loss for Texas (5.1 IP, 31 BF, 11 H, 7 R, 7 ER, 4 BB, 6 SO), knocked out in Toronto&#x27;s four-run bottom of the 6th. Scott Downs earns the save (1.0 IP, 5 BF, 2 H, 0 R, 2 SO), allowing two-out singles to Kinsler and Ivan Rodriguez in the 9th before Alex Rodriguez flew out to center to end it; Roberto Osuna and Mark Eichhorn each threw a scoreless inning ahead of him and take holds in the Rec&#x27;s extra line. Scoring: Texas struck in the top of the 1st on Washington&#x27;s hit-and-run (graded paid off, +0.39): Kinsler singled and Ivan Rodriguez&#x27;s double scored him. Toronto stranded two in the bottom half, Delgado&#x27;s fielder&#x27;s choice cutting Fernandez down at home. Texas made it 2-0 in the top of the 2nd with the game&#x27;s only unearned run, traced below. Toronto took the lead in the bottom of the 3rd: Fernandez singled, Delgado&#x27;s double scored him, Bautista&#x27;s double scored Delgado, and Bell&#x27;s single scored Bautista, all off Perry. Texas answered in the top of the 4th with back-to-back home runs by Hamilton and Juan Gonzalez to open the inning, and after Palmeiro&#x27;s double was stranded, Beltre&#x27;s two-run home run in the top of the 6th (Juan Gonzalez aboard on a single) made it 6-3; Gaston&#x27;s decision to leave the fatigued Hentgen in for the next batter was graded paid off (+0.35) when Seager struck out. The bottom of the 6th decided the game: White struck out, Whitt walked, Alomar doubled, Fernandez walked to load the bases, Donaldson walked to force in Whitt (6-4), and Delgado&#x27;s single scored Alomar and Fernandez to tie it 6-6. Washington then went to Darold Knowles (graded neutral, +0.13; the Rec extra line credits Knowles with 2 inherited runners and 1 scored), Bautista flew out, and George Bell&#x27;s single to center scored Donaldson with the go-ahead run, the decisive play the export&#x27;s report names; Barfield walked and White struck out to end the inning. Texas threatened once more in the top of the 7th: Kinsler singled off Osuna and stole second (the steal graded backfired for Washington, -0.61, because no run followed), but Ivan Rodriguez flew out, Alex Rodriguez struck out, and Howard grounded out. Russell threw a scoreless bottom of the 8th for Texas (graded paid off, +0.73). The export&#x27;s player of the game is Juan Gonzalez of the losing club: 2 for 4 with a home run, 1 RBI and 3 runs scored (the unearned run in the 2nd, the solo homer in the 4th, and the single ahead of Beltre&#x27;s homer in the 6th); it is booked exactly as printed. Key lines: Kinsler went 3 for 5 with a run and a stolen base; Ivan Rodriguez 2 for 5 with a double and an RBI; Hamilton and Beltre homered, Beltre driving in 2. For Toronto: Bell went 3 for 4 with 2 RBIs, Delgado 2 for 5 with a double and 3 RBIs, and Donaldson doubled, walked in a run and scored the winner. The game&#x27;s only error was Josh Donaldson&#x27;s at third base (E5, top of the 2nd, play row seq 10), and it produced the game&#x27;s only unearned run: Juan Gonzalez reached on the error, was held on a steal send (graded neutral, +0.14), advanced on Palmeiro&#x27;s groundout and Beltre&#x27;s groundout, and scored on Seager&#x27;s two-out single, Seager keeping the RBI because the run scored on his hit; the run is unearned because Gonzalez reached on the error, which is why Hentgen&#x27;s line reads 6 R against 5 ER and Toronto&#x27;s staff ER total is 5 against Texas&#x27;s 6 runs. Texas&#x27;s staff ER total is 7, equal to Toronto&#x27;s 7 runs. No double play was turned by either club: there are no DP-coded play rows, no printed GIDPs and no fielding DP credits, so no GIDP adoption under the standing practice was needed and every gate passed outright. The defense object books putouts, assists and errors exactly as the printed fielding section carries them. Fielding from the CSV&#x27;s printed fielding section: Texas 24 putouts and 7 assists (Ivan Rodriguez 10 putouts, Palmeiro 6 putouts; Beltre 3 assists), errorless; Toronto 27 putouts and 9 assists (Whitt 11 putouts, Delgado 10 putouts; Alomar 4 assists, Donaldson 3 assists), Donaldson&#x27;s error the game&#x27;s only one. Stolen bases: Kinsler 1 (top of the 7th, off Osuna with Whitt catching); Alex Rodriguez was caught stealing in the top of the 5th (off Hentgen, Whitt throwing to Alomar); Whitt SBA 2, SB against 1, CS against 1, as printed. Wild pitches: none charged in the printed lines (Palmeiro&#x27;s top-of-the-8th strikeout is narrated as coming on a wild pitch with the batter thrown out, but the play row codes it a plain strikeout and the printed WP column is 0 for every pitcher; booked as printed). Passed balls: none. Substitutes: none batted for either club; the only changes were on the mound. Counting checks: Texas plate appearances 39 (39 AB, 0 BB) equal Toronto&#x27;s 39 batters faced (Hentgen 27, Osuna 4, Eichhorn 3, Downs 5); Toronto plate appearances 41 (36 AB, 5 BB) equal Texas&#x27;s 41 batters faced (Perry 31, Knowles 7, Russell 3). Hit, walk, home run and strikeout totals tie across the two boxes both ways (batting SO: TEX 10 = TOR staff 6+1+1+2; TOR 9 = TEX staff 6+1+2). Other pitching: Knowles 1.2 IP, 7 BF, 1 H, 0 R, 1 BB, 1 SO, stranding one of his two inherited runners and finishing the 7th; Russell 1.0 IP, 3 BF, 2 SO. Availability compliance: Jimmy Key (21 outs in Game 3) and Fergie Jenkins (24 outs) were unavailable under the availability convention and neither pitched; neither appears anywhere in this game&#x27;s play rows. Manager grades, exactly as the export&#x27;s decisions summary prints: Ron Washington graded 6 decisions (2 paid off, 2 backfired, 2 neutral): the hit-and-run in the top of the 1st paid off (+0.39, Kinsler scored on Ivan Rodriguez&#x27;s double); steals 3 (the top-of-the-2nd send neutral, +0.14, runner held; the top-of-the-5th send backfired, -0.76, Alex Rodriguez caught stealing; the top-of-the-7th send backfired, -0.61, Kinsler safe at second but no run followed); pitching changes 2 (Knowles in the bottom of the 6th neutral, +0.13; Russell in the bottom of the 8th paid off, +0.73). Cito Gaston graded 4 decisions (3 paid off, 0 backfired, 1 neutral): leaving Hentgen in fatigued in the top of the 6th paid off (+0.35), and pitching changes 3 (Osuna in the top of the 7th neutral, +0.23; Eichhorn in the top of the 8th paid off, +0.73; Downs in the top of the 9th paid off, +0.73). Availability for Game 5 at Texas, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Pat Hentgen (18 outs) and Gaylord Perry (16 outs) are UNAVAILABLE; every other arm on both staffs is free, nobody capped. Managers: Ron Washington (Texas) and Cito Gaston (Toronto). Venue is Rogers Centre, as printed.">
