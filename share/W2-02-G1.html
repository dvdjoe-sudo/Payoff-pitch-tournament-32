  <title>W2-02-G1: Kansas City Royals 2, San Francisco Giants 3</title>
  <meta name="description" content="Winners Round 2, Series 2, Game 1 at San Francisco. This booking OPENS the series: the W2-02 slot (Winners Round 2, reseeded winners pool) was formed with this game, #2 San Francisco (manager John McGraw) against #18 Kansas City (manager Ned Yost), home pattern San Francisco for Games 1, 2, 5 and 7, Kansas City for Games 3, 4 and 6. Booked from the app export, played by Joe in the app: the scorecard PDF, the graded manager-decision log, the box score CSV (with its PLAYS (JSON) section) and the standalone plays JSON. All four sources agree on every figure below. Decisions were derived from the play log and the run charges and they close exactly: the winning run is Will Clark&#x27;s walk-off home run in the bottom of the 11th, the first and only batter Steve Mingori faced, so Mingori takes the loss at 0.0 IP and one batter faced; Gary Lavelle threw a scoreless top of the 11th and takes the win; no save. Christy Mathewson (6.2 IP, 4 hits, 7 strikeouts, no walks) and Kevin Appier (5.1 IP, 2 hits, no runs) both left with no decision. Run charges close: both Kansas City runs are charged to Mathewson in the top of the 7th, one of them unearned (San Francisco&#x27;s two errors: Buster Posey&#x27;s throwing error on Bobby Witt Jr.&#x27;s steal, and Matt Williams&#x27;s error letting Amos Otis reach in the same inning); both San Francisco runs in the bottom of the 8th are charged to Joakim Soria, who also threw the wild pitch that scored one of them, so San Francisco books two RBI for three runs (Mel Ott 1, Will Clark 1); the walk-off run is charged to Mingori. The play rows were gated against the printed lines before staging, and one field failed: the rows rebuild Art Fletcher&#x27;s grounded-into-double-plays at 2 (his bottom-of-the-5th grounder and his bottom-of-the-10th line-out double play on the hit and run), while the app&#x27;s printed line credits Fletcher with 1 GIDP, counting the ground-ball double play only. Every other batting and pitching field, the linescore, the run totals, the error totals and the win-probability chain all passed exactly, but the game is booked lines-only and the rows are held out of the book pending a ruling on that one definition; if the rows are adopted later they attach verbatim. Six scoreless innings: Mathewson struck out seven and Appier five in a duel with almost nothing on the bases (Kansas City never walked all night; San Francisco stranded five, Kansas City six). Ned Yost&#x27;s pinch hitters broke it open in the top of the 7th: Witt singled, stole second and moved up on Posey&#x27;s throwing error; John Mayberry, hitting for Mike Sweeney, drove him in on a groundout; Otis reached on the Williams error and scored on Darrell Porter&#x27;s two-out single off Sergio Romo, Porter hitting for Salvador Pérez. Both pinch hitters paid off in the grading (+1.39 and +0.93). San Francisco answered in the bottom of the 8th off Soria: Fletcher singled, Willie Mays singled on the hit and run (+1.74, McGraw&#x27;s best grade of the game), Clark walked, one run scored on Soria&#x27;s wild pitch and Ott&#x27;s groundout brought in the tying run. The bullpens held from there: Kelvin Herrera, Jeff Montgomery, Romo, Robb Nen, Rod Beck (who stranded Willie Wilson&#x27;s two-out triple in the top of the 10th) and Lavelle. McGraw&#x27;s bottom-of-the-10th hit and run backfired into the line-out double play (-1.11, the worst grade of the game). Yost graded 12 decisions (6 paid off, 4 backfired, 2 neutral; worst the Soria change at -1.27 and the Mingori change at -0.77); McGraw graded 7 (4 paid off, 3 backfired). In the bottom of the 11th Yost went to Mingori and Clark ended it with one swing, the only home run of the game. Counting checks: Kansas City plate appearances 41 equal San Francisco batters faced (Mathewson 25, Romo 5, Nen 4, Beck 4, Lavelle 3); San Francisco plate appearances 38 equal Kansas City batters faced (Appier 19, Holland 6, Soria 5, Herrera 4, Montgomery 3, Mingori 1). Hit, strikeout and walk totals tie across the two boxes both ways. Fielding from the box score&#x27;s printed fielding section: Kansas City 30 putouts and 16 assists, errorless, with one double play (the Sweeney-Witt-White chain on Fletcher&#x27;s bottom-of-the-5th grounder) and a wild pitch charged to Soria; San Francisco 33 putouts and 11 assists with the two errors above and no double play. Availability for Game 2 at San Francisco, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game): San Francisco: Mathewson (20 outs) is unavailable; Romo (4 outs), Nen (3), Beck (3) and Lavelle (3) are all free, nobody capped. Kansas City: Appier (16 outs) is unavailable; Holland (5 outs), Soria (2), Herrera (4), Montgomery (3) and Mingori (0) are all free, nobody capped.">
