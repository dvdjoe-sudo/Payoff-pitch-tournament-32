  <meta name="description" content="Winners Bracket, Round 2, Series 7, Game 6 at Dodger Stadium. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Atlanta beat Los Angeles 4-0 to tie the series 3-3, scoring once in the 2nd and three times in the 6th, the last three runs walking in with the bases loaded. Decisions: Greg Maddux takes the win for Atlanta (7.0 IP, 24 BF, 3 H, 0 R, 0 ER, 3 BB, 4 SO); he is the export&#x27;s player of the game. Gene Garber (1.0 IP, 4 BF, 1 BB) and Jonny Venters (1.0 IP, 5 BF, 1 H, 2 BB, 2 SO) each threw a scoreless inning to finish the shutout. Sandy Koufax takes the loss for Los Angeles (5.0 IP, 21 BF, 1 H, 3 R, 1 ER, 3 BB, 5 SO, 1 HR). Jim Brewer (1.0 IP, 6 BF, 1 H, 1 R, 1 ER, 3 BB, 1 SO) came on in the 6th and walked in all three runs of the rally; the Rec&#x27;s extra line reads 2 inherited, 2 scored, both charged to Koufax and both unearned. Clem Labine (3.0 IP, 11 BF, 1 H, 0 R, 0 ER, 1 BB, 4 SO) finished with three scoreless innings. Scoring: the top of the 2nd, Dale Murphy&#x27;s solo home run off Koufax (the decisive play the export&#x27;s summary names), 1-0; the top of the 6th, Chipper Jones reached on Max Muncy&#x27;s error and Hank Aaron on Steve Garvey&#x27;s error, both off Koufax, Brewer replaced Koufax and struck out Eddie Mathews, Joe Torre singled to load the bases, and Brewer then walked Murphy, Freddie Freeman and Andruw Jones in succession to force in three runs, 4-0; Torre&#x27;s run, on his single off Brewer, is the inning&#x27;s only earned run, and Ozzie Albies then grounded into a double play to end the inning. Atlanta managed only three hits all game (Murphy&#x27;s home run, Torre&#x27;s single, and Albies&#x27;s 9th-inning double) but drew seven walks. For Los Angeles, Mike Piazza went 2 for 3 and Zack Wheat 2 for 4 in a four-hit shutout loss; Wheat&#x27;s bottom-of-the-9th bloop single ended with him out 8-6-3 after tripping rounding first, the native row coding the play a single and Andruw Jones carrying the outfield assist (OFA 1) in the fielding line, booked exactly as printed. Atlanta turned three double plays (Pee Wee Reese in the bottom of the 3rd, coded DP 4-6-3; Wheat in the bottom of the 6th, DP 6-4-3; Shohei Ohtani in the bottom of the 7th, DP 4-6-3) and Los Angeles one (Albies in the top of the 6th, DP 4-6-3); all four are genuine double-play rows and the printed GIDPs match (Wheat 1, Ohtani 1, Reese 1, Albies 1), so no GIDP difference arises. Defensive lines are booked in the established shape from the printed fielding section (Atlanta 27 putouts and 12 assists, Freddie Freeman 10 putouts, Rabbit Maranville 6 assists and a hand in all three Atlanta double plays, Joe Torre 6 putouts catching; Los Angeles 27 putouts and 11 assists, Piazza 10 putouts catching, Pee Wee Reese 5 assists, Steve Garvey 8 putouts with an error, Max Muncy an error). Stolen bases: none, and no caught stealings. Wild pitches: none. Passed balls: none. Hit by pitch: none. Counting checks: Atlanta plate appearances 38 (31 AB, 7 BB) equal Los Angeles&#x27;s 38 batters faced (Koufax 21, Brewer 6, Labine 11); Los Angeles plate appearances 33 (27 AB, 6 BB) equal Atlanta&#x27;s 33 batters faced (Maddux 24, Garber 4, Venters 5). Hit, walk, home run and strikeout totals tie across the two boxes both ways. All four Atlanta runs carry RBIs (team total 4: Murphy 2, Freeman 1, Andruw Jones 1); Los Angeles was shut out. Manager grades: the grades list names both managers directly, so no label mapping is needed. Tommy Lasorda graded 3 decisions (1 paid off, 2 backfired): his pitching change to Brewer in the top of the 6th backfired (three bases-loaded walks forced in three runs), his steal call in the bottom of the 6th backfired (the runner held and Wheat grounded into the double play), and his pitching change to Labine for the 7th paid off (three scoreless innings). Bobby Cox graded 2 decisions (1 paid off, 1 neutral), both pitching changes: Garber for the bottom of the 8th paid off and Venters for the bottom of the 9th was neutral. Availability for Game 7 under the convention: Greg Maddux (21 outs in this game), Sandy Koufax (15 outs) and Clem Labine (9 outs) are unavailable; Jim Brewer (3 outs), Gene Garber (3 outs) and Jonny Venters (3 outs) are free. Game 5&#x27;s availability was honored: Orel Hershiser (20 outs in Game 5) and Tom Glavine (21 outs) sat, and Mike Marshall (7 outs, capped at 3) was not used, which is within the cap. The series is tied 3-3. Managers: Bobby Cox (Atlanta) and Tommy Lasorda (Los Angeles). Venue is Dodger Stadium, as printed.">
