  <title>W2-07-G2: Los Angeles Dodgers 8, Atlanta Braves 5</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 7, Game 2 at Truist Park. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Los Angeles evened the series with steady pressure: runs in six different innings, fifteen hits, and a three-run Atlanta rally in the bottom of the 9th that only closed the gap. Decisions: Clayton Kershaw takes the win for Los Angeles (7.0 IP, 25 BF, 4 H, 2 R, 2 ER, 0 BB, 6 SO, 2 HR), the only damage off him a pair of solo home runs in the bottom of the 2nd, Eddie Mathews&#x27;s and Dale Murphy&#x27;s; the other two hits off him were Mathews&#x27;s single in the 4th and Rabbit Maranville&#x27;s single in the 6th, and he walked nobody. Kid Nichols takes the loss for Atlanta (5.0 IP, 27 BF, 9 H, 6 R, 6 ER, 4 BB, 7 SO, 1 HR). Phil Niekro threw the last four innings for Atlanta (4.0 IP, 18 BF, 6 H, 2 R, 2 ER, 0 BB, 6 SO, 1 HR), charged with the top-of-the-6th run (Jackie Robinson and Zack Wheat singled, Mookie Betts&#x27;s sacrifice fly scored Robinson) and Betts&#x27;s solo home run in the top of the 8th. Clem Labine pitched the 8th and most of the 9th for Los Angeles (1.1 IP, 10 BF, 5 H, 3 R, 3 ER, 1 BB, 2 SO, 1 HR): a scoreless 8th (Andruw Jones and Rabbit Maranville struck out around Ozzie Albies&#x27;s walk and Chipper Jones&#x27;s single), then the 9th-inning rally, Joe Torre&#x27;s home run, Freddie Freeman&#x27;s double, Murphy&#x27;s RBI double, and Andruw Jones&#x27;s RBI double cutting 8-2 to 8-5. Kenley Jansen earns the save (0.2 IP, 2 BF, 0 H, 1 SO), stranding the one runner he inherited from Labine (the Rec&#x27;s extra line reads 1 inherited, 0 scored): Albies&#x27;s groundout moved Andruw Jones to third and Maranville struck out to end it. Jansen was capped at 3 outs for this game under the availability convention (6 outs in Game 1) and recorded exactly 2, legal. Scoring: the top of the 1st, Robinson singled, Wheat singled, Betts walked, and Shohei Ohtani&#x27;s sacrifice fly scored Robinson, the decisive play the export&#x27;s summary names; the top of the 2nd, Pee Wee Reese singled, Robinson doubled him home, and Wheat singled Robinson home for 3-0; the bottom of the 2nd, Mathews and Murphy homered off Kershaw, sandwiched around two groundouts, for 3-2; the top of the 4th, Reese homered off Nichols for 4-2; the top of the 5th, Ohtani and Duke Snider singled, Gil Hodges popped out, and Roy Campanella doubled on the hit and run to score both for 6-2, Ron Cey walked, and Reese grounded into a double play on the hit and run to end it; the top of the 6th and top of the 8th off Niekro as traced above for 8-2; and the bottom of the 9th rally off Labine for the 8-5 final. Mookie Betts is the export&#x27;s player of the game (1 for 3, home run, 2 RBI, 1 walk, 1 sacrifice fly). Robinson went 3 for 5 with a double, three runs, and an RBI; Wheat 3 for 5 with an RBI; Campanella 2 for 5 with two doubles and 2 RBI; Reese 2 for 5 with a home run and two runs. For Atlanta, Murphy went 2 for 4 with a double, a home run, 2 RBI, and two runs; Mathews 2 for 4 with a home run. The game was errorless, and defensive lines are booked in the established shape from the printed fielding section (Los Angeles 27 putouts and 7 assists, Hodges 12 putouts, Campanella 9 putouts catching, Cey 4 assists; Atlanta 27 putouts and 4 assists, Torre 13 putouts catching, Mathews 3 assists). Two bookkeeping notes, both settled by the export&#x27;s own printed sections. First, Campanella&#x27;s doubles: the CSV batting section, the Rec bat array, and the play rows (top of the 5th and top of the 9th, both coded 2B) all print 2 doubles; the box text&#x27;s doubles line lists names only, and the booking brief&#x27;s hand line said 1. Booked as printed: 2. Second, Reese&#x27;s double play: the play rows code his top-of-the-5th play a double play (grounds into a double play on the hit and run), while his printed GIDP is 0 in the CSV, the Rec, and the box, and Atlanta&#x27;s printed fielding section credits no double play. Under the standing practice for this difference (Joe&#x27;s ruling, 2026-11-10), the rows are adopted and the printed lines are booked unchanged: gate_bat&#x27;s only failure is that one rebuilt GIDP (1 vs the printed 0), with gate_pit, the linescore gate, and the PP-WE-2 WPA chain (residual exactly 0.0) all passing on the 89 native rows. No stolen bases and no caught stealings; the two graded steal decisions were Robinson held at first on poor jumps in the 1st and the 6th, both graded neutral. Wild pitches: none. Passed balls: none. Hit by pitch: none. Counting checks: Los Angeles plate appearances 45 (39 AB, 4 BB, 2 SF) equal Atlanta&#x27;s 45 batters faced (Nichols 27, Niekro 18); Atlanta plate appearances 37 (36 AB, 1 BB) equal Los Angeles&#x27;s 37 batters faced (Kershaw 25, Labine 10, Jansen 2). Hit, walk, home run and strikeout totals tie across the two boxes both ways. All eight Los Angeles runs carry RBIs (team total 8) and all five Atlanta runs carry RBIs (team total 5). Manager grades: the grades list names both managers directly, so no label mapping is needed. Tommy Lasorda graded 6 decisions (3 paid off, 1 backfired, 2 neutral): both pitching changes paid off (Labine in the 8th, Jansen in the 9th), the hit and runs split (Campanella&#x27;s double paid off, Reese&#x27;s double play backfired), and both steals graded neutral (Robinson held twice). Bobby Cox graded 3 decisions (2 paid off, 1 backfired): leaving a fatigued pitcher in paid off twice (Nichols in the 3rd, Niekro late), and his one pitching change backfired (Niekro opened the 6th and gave up a run). Availability for Game 3 under the convention: Clayton Kershaw (21 outs in this game), Kid Nichols (15 outs) and Phil Niekro (12 outs) are unavailable; Clem Labine (4 outs) and Kenley Jansen (2 outs) are free. Game 1&#x27;s availability was honored: Greg Maddux (21 outs in Game 1) and Sandy Koufax (16 outs) sat, and Jansen pitched inside his 3-out cap. The series is tied 1-1. Managers: Bobby Cox (Atlanta) and Tommy Lasorda (Los Angeles). Venue is Truist Park, as printed.">
