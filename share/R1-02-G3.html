  <meta name="description" content="Washington won the adopted replay of Game 3, 7-4, and the series result is unchanged: the Giants still take R1-02 four games to one. Bryce Harper was the player of the game: his three-run homer in the bottom of the 5th was the decisive play, and he drove in four of Washington&#x27;s seven runs. Jordan Zimmermann got the win (6.0 IP, 3 H, 2 ER, 6 SO) and Drew Storen pitched a perfect 9th for the save. Juan Marichal took the loss, charged with seven runs but only four earned: Washington&#x27;s three 5th-inning runs were unearned after errors by Will Clark and Willie Mays put Span and Turner aboard ahead of Harper&#x27;s homer. Wilson Ramos added a two-run homer in the 6th. Willie Mays hit a two-run homer for San Francisco in the 5th, and Matt Williams tripled home two in the 7th.">
