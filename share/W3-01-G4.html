  <title>W3-01-G4: New York Yankees 5, Cleveland Guardians 4</title>
  <meta name="description" content="Winners Bracket, Round 3, Series 1, Game 4 at Progressive Field, as the master export&#x27;s box score prints the venue, &quot;PROGRESSIVE FIELD&quot;. The series was formed with the Game 1 booking by reseeding the eight Winners Round 2 winners by original tournament seed, highest against lowest: New York (seed 1) against Cleveland (seed 13), Yankees home for Games 1, 2, 5 and 7, Cleveland for Games 3, 4 and 6. Booked from two files, both played by Joe in the app: the game master export (the report, the box score text, the full CSV block inside the game&#x27;s Rec record, the native PLAYS (JSON) rows, the narrative play log, the graded play-by-play, and the full Rec JSON: W NYY|guidrro01, L CLE|klubeco01, no save; the Rec extra list carries one inherited-runner line) and the series master export, whose Game 1-3 Recs match the booked book in every score, decision, batting line and pitching line, whose Game 4 Rec is identical to the game export&#x27;s Rec, whose totals foot to New York 35 runs and Cleveland 19, and which names the Series MVP (below). The exports&#x27; filenames and header date read 2026-11-22, and the game Rec&#x27;s recorded stamp is 2026-11-22T06:08:14Z; the book carries the header date, 2026-11-22. New York won 5-4 in a rain-shortened six-inning official game and swept the series four games to none. Decisions: Ron Guidry takes the win for New York with a complete game at six innings (6.0 IP, 28 BF, 9 H, 4 R, 4 ER, 1 BB, 8 SO, 1 HR); Corey Kluber takes the loss for Cleveland (4.0 IP, 20 BF, 6 H, 5 R, 5 ER, 2 BB, 3 SO, 2 HR). Cade Smith pitched the fifth (1.0 IP, 3 BF, 3 SO, striking out the side) and Andrew Miller the sixth (1.0 IP, 3 BF, 1 SO, scoreless). Lou Gehrig is the export&#x27;s player of the game (1 for 3, grand slam, 4 RBI). Scoring: the top of the 1st scored four: Derek Jeter singled, Aaron Judge walked, Babe Ruth walked, and Lou Gehrig hit a grand slam off Kluber (the export&#x27;s decisive play); Mickey Mantle grounded out, Joe DiMaggio singled, Alex Rodriguez struck out, and Yogi Berra popped out. The bottom of the 1st answered with one: Tris Speaker singled and Nap Lajoie&#x27;s double on the hit and run scored him; Jim Thome struck out, Manny Ramirez flied out, and Shoeless Joe Jackson grounded out, 4-1. The top of the 3rd scored one, Ruth&#x27;s solo home run off Kluber, 5-1. The bottom of the 4th scored three: Jackson singled, Albert Belle singled, Jose Ramirez struck out, and Lou Boudreau hit a three-run home run off Guidry, 5-4. The top of the 5th: Judge singled off Kluber, Cade Smith relieved, and struck out Ruth, Gehrig and Mantle in order. The bottom of the 6th: Ramirez flied out, Boudreau singled, Victor Martinez struck out, and Speaker popped out; the game was then called for heavy rain after the bottom of the 6th (rare play p22, documented in the closing play row, seq 57), an official game. The extra list, exactly as printed: one line, inherited runners for Cade Smith 1/0 (Judge, aboard when he relieved Kluber with none out in the top of the 5th, stranded when Smith struck out the side). No holds and no blown saves; Miller entered the top of the 6th with the bases empty. Errors: none by either club, confirmed by the play rows&#x27; rebuilt error count (CLE 0 / NYY 0), the printed fielding sections, the batting CSV&#x27;s E column and the Rec fld array alike, and team_errors reads CLE 0, NYY 0. Double plays: none, and no GIDP is printed for either club; the rows record none, so no GIDP-practice divergence arises. Stolen bases: none attempted by either club; no caught stealings. The catching lines as printed: Yogi Berra, PB 0 and nothing against; Victor Martinez, PB 0 and nothing against. Defensive lines are booked in the established shape from the printed fielding section (New York 18 putouts and 3 assists, no errors: Berra 8 putouts catching, DiMaggio 3 putouts, Gehrig 3 putouts, Jeter 2 putouts, Rodriguez 1 putout and 1 assist, Judge 1 putout, Randolph 2 assists; Cleveland 18 putouts and 3 assists, no errors: Martinez 7 putouts catching, Thome 3 putouts, Belle 3 putouts, Speaker 2 putouts, Lajoie 2 putouts, Jose Ramirez 1 putout and 3 assists). Lou Boudreau, Cleveland&#x27;s shortstop, took no fielding chance and carries no fielding line in the box score, the CSV sections or the Rec arrays, so none is booked for him, exactly as printed. Substitutes: none used by either club. Wild pitches: none. Passed balls: none. Hit by pitch: none. Counting checks: New York plate appearances 26 (24 AB, 2 BB) equal Cleveland&#x27;s 26 batters faced (Kluber 20, Smith 3, Miller 3); Cleveland plate appearances 28 (27 AB, 1 BB) equal Guidry&#x27;s 28 batters faced. Hit, walk, home run and strikeout totals tie across the two boxes both ways (New York batting strikeouts 7 = Kluber 3 + Smith 3 + Miller 1; Cleveland batting strikeouts 8 = Guidry 8; New York home runs 2, Ruth and Gehrig, both off Kluber; Cleveland home runs 1, Boudreau off Guidry). Team RBI equals runs for both clubs (New York 5, Cleveland 4; the play rows total 9 runs and 9 RBI, every run carrying an RBI). Staff earned runs: Cleveland&#x27;s staff 5 ER against New York&#x27;s 5 runs, every run earned; New York&#x27;s staff 4 ER against Cleveland&#x27;s 4 runs. Manager grades: Terry Francona graded 4 decisions, all paid off: 1 hit and run (the bottom of the 1st, Lajoie&#x27;s double scoring Speaker), 1 steal (the bottom of the 4th send, Jackson held, and three runs followed on Boudreau&#x27;s home run) and 2 pitching changes (Cade Smith for the 5th, who struck out the side, and Miller for the 6th, scoreless). Casey Stengel graded no decisions in this game; the export&#x27;s decisions summary lists Francona alone, and the game&#x27;s final_grades is populated from the export&#x27;s grades list in the established shape (the W2-07-G7 shape, where the ungraded manager carries no entry). Series graded totals: Terry Francona 24 (12 paid off / 9 backfired / 3 neutral), Casey Stengel 9 (6 paid off / 3 backfired / 0 neutral). Availability was compliant: Game 3&#x27;s unavailable pair (Lefty Gomez, 27 outs, and Addie Joss, 12 outs) appear nowhere in this game and are listed in the Rec&#x27;s own unavailable block among its rest and house-rule entries; Andrew Miller, capped at 3 outs after throwing 6 outs in Game 3, recorded exactly 3 outs, at the cap. The series is complete, so no Game 5 availability arises. Series close: New York wins the series 4-0, outscoring Cleveland 35 runs to 19. Series MVP, named in the series master export and booked under Joe&#x27;s standing rule (2026-11-15, the export MVP is the MVP): Babe Ruth (NYY), booked line &quot;7 for 16, 6 R, 1 2B, 1 3B, 3 HR, 11 RBI, .438&quot; (ruthba01), verified exactly against the four games&#x27; Recs (7 for 16, 1 2B, 1 3B, 3 HR, 11 RBI, 6 R, 2 BB). Runner-up, computed from the book: Yogi Berra (NYY), booked line &quot;8 for 16, 5 R, 1 HR, 4 RBI, .500&quot; (berrayo01), verified against the same Recs; the other leading candidate was Derek Jeter (6 for 17, 6 R, 2 2B, 4 RBI, .353), and Berra&#x27;s .500 average with a home run and a run scored in three of the four games gets the nod. Cleveland&#x27;s best bat was Shoeless Joe Jackson (5 for 15, 2 R, 3 RBI, .333), with Lou Boudreau (4 for 13, 4 R, 2B, HR, 3 RBI, .308) behind him. New York improves to 12-2 in games and 3-0 in series and advances to Winners Round 4; Cleveland falls to 8-8 in games and 2-1 in series and drops to Losers Round 3, its first series loss of the tournament, not an elimination. Managers: Casey Stengel (New York) and Terry Francona (Cleveland). Venue is Progressive Field, as printed.">
