  <title>R1-16-G4: Houston Astros 7, Philadelphia Athletics 2</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-07: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official R1-16 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Series: Houston Astros (seed 16) vs Philadelphia Athletics (seed 17), home pattern 2-2-1-1-1, Game 4 in Philadelphia. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Nolan Ryan takes the win: he started, Houston led from the Top 1 on and never trailed or tied after that, and Ryan completed six innings (6.0 IP, 4 H, 2 R, 2 ER, 2 BB, 0 HBP, 4 SO, 0 HR), leaving with the lead at 6-2, so the win is his on the standard pitcher-of-record rule with no scorer&#x27;s choice needed. Chief Bender takes the loss: the first six Houston runs are charged to him on the card (5.1 IP, 8 H, 6 R, 6 ER, 1 BB, 1 HBP, 9 SO, 1 HR) and Philadelphia never caught up. There is no save: Dave Smith pitched the last three innings scoreless (3.0 IP, 2 H, 0 R, 0 BB, 4 SO) and finished the game, but he entered the Bottom 7 with a four-run lead at 6-2, which is no save situation under any prong the book credits: the lead was more than three runs, the tying run was never on base, at the plate, or on deck while he pitched, and he is not the winning pitcher. Run charges match the printed lines exactly: Philadelphia pitching allows 7 (Bender 6, Rube Walberg 1 in 3.2 innings of relief), and Houston pitching allows 2 (Ryan 2, Smith 0). The duplicate test ran before the number was assigned: the stored series games (Philadelphia 6, Houston 3 in Game 1; Houston 8, Philadelphia 7 in 11 innings in Game 2; Houston 4, Philadelphia 3 in Game 3) differ in score and linescore, so this box score is no duplicate and takes the next unplayed number, Game 4. The game: Houston scored in the Top 1, Biggio striking out, Alvarez walking, Bagwell striking out, Altuve singling Alvarez to third, and Berkman grounding out to third with Alvarez scoring on the play. The Top 3 made it 4-0: Cedeño was hit by a Bender pitch, Biggio singled Cedeño to third, Alvarez struck out, and Bagwell hit a three-run home run, Bender then striking out Altuve and Berkman to end the inning. Philadelphia got one back in the Bottom 3: Moses singled, Joost bunted him to second, Strunk bunted him to third, and Collins singled him home. Philadelphia scored again in the Bottom 4: Simmons walked, Foxx singled him to third, and Johnson hit a sacrifice fly to left; Baker then struck out on the hit and run call while Foxx took second on Ryan&#x27;s wild pitch, and Moses flew out. Houston&#x27;s Top 6 settled the game: Bregman singled, Correa tripled him home, and Alou grounded out to third with Correa scoring, Bender&#x27;s last batter; Walberg relieved and gave up singles to Cedeño and Alvarez around a Biggio popout before striking out Bagwell. Ryan finished his six innings in the Bottom 6, and Smith took over in the Bottom 7, Baker singling before Moses struck out, Joost forced Baker at second, and Strunk popped out. The Bottom 8 ended on the second hit and run call: Collins singled, and Cochrane struck out while Collins was caught stealing, Simmons then grounding out. Houston&#x27;s last run came in the Top 9 off a fatigued Walberg: Bagwell walked, Altuve and Berkman flew out, Bregman walked, and Correa singled Bagwell home. Smith closed it in the Bottom 9, Foxx striking out, Johnson grounding out, and Baker striking out. Houston stranded 10 and Philadelphia only 4. Home runs: one, Bagwell&#x27;s three-run shot for Houston in the Top 3 off Bender, which is why his printed line reads 3 RBI. Triples: one, Correa for Houston in the Top 6. Doubles: none. Errors: none on either side. Hit batters: one, Cedeño hit by Bender in the Top 3; HB 1 for Bender and HBP 1 for Cedeño are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: two as printed in the Gazette pitching footers, one charged to Ryan (the Bottom 4 pitch on Baker&#x27;s strikeout, Foxx advancing) and one charged to Bender. Passed balls: none. Sacrifices: two bunts and one sacrifice fly: Joost in the Bottom 3 and Strunk in the Bottom 3 bunted, and Johnson hit the Bottom 4 sacrifice fly, the split lines reading SH 1 for Joost, SH 1 for Strunk, SF 1 for Johnson, and SH 0 and SF 0 for every other batter; Strunk&#x27;s Bottom 5 bunt went into a double play and is an at-bat, not a sacrifice. Stolen bases: none. Caught stealing: one, Collins in the Bottom 8 on the hit and run strikeout. Double plays grounded into: one, Strunk for Philadelphia in the Bottom 5, the bunt double play off Ryan, the stored line reading GIDP 1 for Strunk and GIDP 0 for every other batter; Joost&#x27;s Bottom 7 forceout, with the batter reaching, is an at-bat, not a double play and not a sacrifice. Substitutions: none with plate appearances; the Gazette prints nine batting lines for each club, and Philadelphia used two pitchers and Houston two. The Athletics exist in this tournament as two clubs, Oakland (OAK) and Philadelphia (PHA); every Philadelphia line in this game sits under PHA keys and nothing merges with Oakland. Plate appearances counted fresh from the printed batting lines and the play log enumeration, a runner out on the bases, Collins&#x27;s caught stealing included, counting as one of the inning&#x27;s outs and never an add-on: Houston PA is AB 40 plus BB 3 plus HBP 1, which is 44, and the outs plus runs plus stranded identity agrees (27 outs plus 7 runs plus 10 stranded is 44); Philadelphia PA is AB 28 plus BB 2 plus SH 2 plus SF 1, which is 33, and the identity agrees (27 outs plus 2 runs plus 4 stranded is 33). Batters faced tie to those totals: Houston 44 PA against 44 Philadelphia BF (Bender 26, Walberg 18), and Philadelphia 33 PA against 33 Houston BF (Ryan 23, Smith 10). Strikeouts tie both ways: Houston batting 12 against Philadelphia pitching 12 (Bender 9, Walberg 3), and Philadelphia batting 8 against Houston pitching 8 (Ryan 4, Smith 4). Printed RBI: Houston 6 for 7 (Bagwell 3, Correa 2, Alou 1), the seventh run carrying no RBI as printed: Alvarez scored from third on Berkman&#x27;s Top 1 groundout and Berkman&#x27;s printed line reads RBI 0 on both the Gazette summary and the grid; Philadelphia 2 for 2 (Collins 1, Johnson 1). Availability: Waddell (21 outs in Game 3) was unavailable for Philadelphia and Scott (12 outs in Game 3) was unavailable for Houston under the house convention, and neither pitched; Berry (6 outs in Game 3) was capped at 3 outs for Philadelphia and did not appear; every other Game 3 pitcher was free, and both clubs complied. Seven decisions were graded. Connie Mack made 5 (0 paid off, 4 backfired, 1 neutral): the Bottom 4 hit and run backfired at -0.76, Baker striking out with Foxx at first and one out; the Bottom 5 sacrifice bunt backfired at -1.11, Strunk bunting into a double play with Joost at first and nobody out; the Top 6 pitching change to Walberg was neutral at +0.00, Cedeño singling as the next batter but no run scoring against 0.25 expected; the Bottom 8 hit and run backfired at -1.11, Cochrane striking out and Collins caught stealing for a double play in effect with nobody out; and leaving a fatigued Walberg in for the Top 9 backfired at -0.77, Bagwell walking as the next batter and one run scoring. A.J. Hinch made 2 (1 paid off, 0 backfired, 1 neutral): the Bottom 7 pitching change to Smith was neutral at +0.23, Baker singling as the next batter but no run scoring, and leaving a fatigued Smith in for the Bottom 9 paid off at +0.73, the game&#x27;s best grade, Foxx striking out as the next batter and Smith finishing the game scoreless. Managers: A.J. Hinch (Houston) and Connie Mack (Philadelphia). Venue is Philadelphia; the graded play log&#x27;s header names Shibe Park, but the archive carries no park name for the Athletics&#x27; home games, so this game, like Games 3 and 6 of this series, is recorded as Philadelphia, city only. Houston leads the series 3-1.">
