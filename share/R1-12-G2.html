  <title>R1-12-G2: New York Mets 5, Minnesota Twins 1</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-03: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-12 Game 2 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Minnesota Twins (seed 12) vs New York Mets (seed 21), home pattern 2-2-1-1-1, Game 2 at Target Field in Minneapolis, and the series is tied 1-1 with this New York win. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number, with one run-accounting settlement, documented below: the earned runs on Santana&#x27;s line in the Top 2, which the card settles and this record books exactly as printed. The decisions are not printed; they are derived from the play log and the run charges on the card. Dwight Gooden takes the win: New York scored in the Top 1 and never trailed, and Gooden carried the lead through eight innings (8.0 IP, 6 H, 1 ER, 3 BB, 5 SO), leaving with a 5-1 lead. Johan Santana takes the loss (6.2 IP, 8 H, 5 R, 3 ER, 2 BB, 8 SO, 1 HR): he was charged with all five New York runs, the last two on Strawberry&#x27;s Top 7 home run after Kelly left the fatigued starter in. No save: Díaz pitched the Bottom 9 with a four-run lead, bases empty to start, which is not a save situation. Run charges match the printed lines exactly: Minnesota pitching allows 5 + 0 + 0 = 5 (Santana all five, Duran and Nathan none), and New York pitching allows 1 + 0 = 1 (Gooden the one, Díaz none). The charge detail: Santana&#x27;s five are Lindor in the Top 1 (singled, stole second, took third on Hernandez&#x27;s groundout, and scored on Wright&#x27;s sacrifice fly), Alonso and Alfonzo in the Top 2 (see the settlement), and Wright and Strawberry in the Top 7 (Wright singled and Strawberry hit a two-run home run). Gooden&#x27;s one is Cronin in the Bottom 7 (doubled and scored on Gaetti&#x27;s single). The Top 2 settlement: with two out, Alonso had singled and Alfonzo had singled him to second, and Jones had struck out. During Lindor&#x27;s at-bat a ball got to the backstop; the card charges the play as an error on Mauer (the grid&#x27;s error row credits Minnesota with its one error in the second inning and the Gazette extras read E: Joe Mauer; it is the game&#x27;s only error, and it is distinct from Mauer&#x27;s passed ball in the Top 5, which the log names a passed ball). Alonso scored on the play from second, with no RBI, and Alfonzo advanced to third; Lindor then walked, and Hernandez singled Alfonzo home for the printed RBI. Printed RBI therefore reads New York 4 (Wright 1, Hernandez 1, Strawberry 2) against 5 runs, the missing RBI being Alonso&#x27;s run on the error. The card prints Santana at 5 runs but only 3 earned, so both Top 2 runs are unearned on the card&#x27;s accounting: Alonso&#x27;s scored on the error itself, and Alfonzo&#x27;s is unearned because the scoring position he scored from, third base, was created entirely by the error advance with two out. The printed RBI and the printed earned runs are booked exactly as they stand. The duplicate test ran before the number was assigned: the one stored game in the series is Game 1 (Minnesota 6, New York 5, on a different linescore: New York 0 3 0 1 1 0 0 0 0, Minnesota 1 1 0 0 0 2 0 0 2), so this box score, a 5-1 New York win on its own linescore, is no duplicate, and this is the second game of the series in play order, booked as Game 2. The game: Lindor opened the scoring in the Top 1 as described, and Strawberry doubled behind the sacrifice fly but was stranded. Minnesota went quietly until the middle innings. New York made it 3-0 in the Top 2 on the error sequence above. Santana settled in for a long stretch of zeroes, striking out eight, and Gooden matched him inning for inning; Minnesota&#x27;s first real chance came in the Bottom 6, when Puckett doubled and Killebrew walked, but Goslin grounded out to strand them. New York threatened in the Top 5, when Strawberry struck out on a passed ball and reached, Piazza walked to load the bases behind Hernandez&#x27;s single, and Alonso popped out to leave all three. In the Top 7, with two out, Wright singled and Strawberry hit a two-run home run off the fatigued Santana for 5-0; Duran relieved and finished the inning. Minnesota&#x27;s only run came in the Bottom 7: Cronin doubled and Gaetti singled him home, and Carew&#x27;s walk put two on before Mauer grounded out. New York could not add on in the Top 8 (Olerud pinch-hit and walked, then was forced at second, and Jones singled but Lindor flied out), Nathan struck out Wright and Strawberry in a clean Top 9, and Díaz closed the Bottom 9 around Oliva&#x27;s single. Home runs: one, Strawberry for New York (Top 7, two-run). Doubles: Strawberry for New York (Top 1), and Puckett and Cronin for Minnesota. Triples: none. Errors: Minnesota one, Mauer in the Top 2 (the backstop ball described in the settlement); no run scored on it directly beyond Alonso&#x27;s, and the earned-run accounting is as settled above. New York played errorless ball. Hit batters: none; every pitcher&#x27;s HBP column on both grids reads zero and no batter on either side was hit, so HB 0 is carried for every pitcher as card-sourced values and the hit batter check runs on real data. Wild pitches: none printed on the card. Passed balls: Mauer 1 (Top 5, Strawberry&#x27;s strikeout reach, the runners moving to second and third; nobody scored on it), log-proven; the Top 2 backstop ball is charged as the error, not as a passed ball or wild pitch, on the card. Sacrifices: one, Wright&#x27;s sacrifice fly in the Top 1, so the split lines read SF 1 for Wright and SH 0 and SF 0 for every other batter, log-proven. Stolen bases: Lindor 1 (Top 1). Caught stealing: none; the printed CS columns are 0 for both clubs. Double plays grounded into, counted from the play log: one, Hrbek in the Bottom 5 for Minnesota, exactly as the card extras read; New York grounded into none, Beltran&#x27;s Top 8 fielder&#x27;s choice being a forceout only. Substitutions: New York made two. John Olerud pinch-hit for Alonso in the Top 8, walked, and was forced at second on Beltran&#x27;s fielder&#x27;s choice, carrying the printed batting line AB 0, R 0, BB 1; the designated hitter spot did not bat again. Jeff McNeil replaced Alfonzo at second base for the Bottom 8, had no plate appearance, and so carries no batting line and is carried in this recap only. Minnesota made no substitutions. Batters faced are counted from the play log and tie to the batting PA totals both ways (New York 40 PA against 40 Minnesota BF: Santana 31, Duran 6, Nathan 3; Minnesota 36 PA against 36 New York BF: Gooden 32, Díaz 4). New York PA is AB 36 plus BB 3 plus SF 1; Minnesota PA is AB 33 plus BB 3. Nine decisions were graded. Davey Johnson made 5 (2 paid off, 1 backfired, 2 neutral): the Top 1 steal send paid off at +0.39 (Lindor safe, then scored on the sacrifice fly), the Bottom 8 defensive substitution of McNeil paid off at +0.48, the Top 8 hit and run backfired at -0.76 (Alfonzo&#x27;s fly out behind Beltran&#x27;s forceout), the Top 8 Olerud pinch hitter was neutral at -0.23, and the Bottom 9 change to Díaz was neutral at +0.23. Tom Kelly made 4 (2 paid off, 2 backfired, 0 neutral): both pitching changes paid off, Duran in the Top 7 at +0.35 and Nathan in the Top 9 at +0.73; his backfires were leaving the fatigued Santana in to open the Top 7 at -1.27, the game&#x27;s worst grade, ahead of Strawberry&#x27;s home run, and the Bottom 9 hit and run at -1.11. Managers: Davey Johnson (New York) and Tom Kelly (Minnesota). Venue is Target Field. Availability compliance: Seaver (17 outs in Game 1) and Walter Johnson (22 outs) were unavailable under the house convention and correctly did not pitch; Duran (5 outs in Game 1) was free and pitched. Game 3 availability, under the house convention that reads only this game: Gooden (24 outs) and Santana (20 outs) are both UNAVAILABLE, and Duran (4 outs), Nathan (3) and Díaz (3) are all free. Each club started its rotation number 2, Gooden for New York and Santana for Minnesota; the rotations turn to the number 3 starters for Game 3, and the series moves to New York.">
