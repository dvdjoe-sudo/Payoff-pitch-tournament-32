  <meta name="description" content="San Francisco won the adopted replay of Game 5, 3-2 in 10 innings, and the series result is unchanged: the Giants take R1-02 four games to one. Mel Ott&#x27;s single to center off Jon Rauch in the bottom of the 10th scored Willie Mays with the winning run; Mays had walked and taken third on Will Clark&#x27;s hit-and-run single. Rod Beck got the win with a scoreless 10th, Zimmerman grounding into a double play after walks to Soto and Harper. Washington&#x27;s runs came in the 4th: Ryan Zimmerman homered, and Daniel Murphy tripled and scored on Tim Lincecum&#x27;s wild pitch during Wilson Ramos&#x27;s plate appearance (Ramos singled on the play but is printed with no RBI). Zimmerman was the player of the game in the loss (2 for 5, a home run). San Francisco tied it in the 5th on Clark&#x27;s two-run single. The game was errorless.">
