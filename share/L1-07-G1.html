  <title>L1-07-G1: San Diego Padres 11, Milwaukee Brewers 8</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 7, Game 1 at American Family Field, as the master export&#x27;s box score prints the venue. This booking OPENS the series: the L1-07 slot (Losers Round 1, reseeded losers pool) was formed with this game, #23 Milwaukee Brewers (manager Pat Murphy) against #26 San Diego Padres (manager Bruce Bochy), home pattern Milwaukee for Games 1, 2, 5 and 7, San Diego for Games 3, 4 and 6; the formation block stays as the shell carries it (rule reseed-high-vs-low, pool &quot;Losers of the 16 opening-round series&quot;, gate &quot;Round 1 is complete (all 16 opening series)&quot;), with the feeder labels as in the formed L1 entries. The pairing was verified against TOURNAMENT_SEEDS.md (Milwaukee line: seed 23; San Diego line: seed 26) and the loser reseeding that fixed L1-01 through L1-06: Milwaukee lost R1-10 to Los Angeles 4-1 and San Diego lost R1-07 to Atlanta 4-0. Both clubs carry one series loss into this series, so the loser of the series is eliminated and the winner advances to Losers Round 2. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every figure in the export agrees with itself across all of its sections. Decisions: Andy Ashby takes the win for San Diego (2.0 IP, 8 BF, 2 H, 1 R, 1 ER, 3 SO, 1 HR). Josh Hader takes the loss for Milwaukee (1.0 IP, 8 BF, 3 H, 5 R, 5 ER, 2 BB, 2 SO, 1 HR, all five runs in the top of the 9th). Trevor Hoffman earns the save (1.0 IP, 4 BF, 0 H, 1 BB): he pitched a scoreless bottom of the 9th with San Diego ahead 11-8. Scoring: Milwaukee scored five in the bottom of the 1st off Jake Peavy, all with two out (Yount single, Fielder single, Scott run-scoring single, Contreras run-scoring single, Jenkins two-run double, Turang run-scoring single). Milwaukee scored one in the bottom of the 2nd: Peavy, who had recorded only three outs, stayed in to face the first batter of the inning and Yelich homered off him; Heath Bell then entered and retired the next three, so all six of Peavy&#x27;s charged runs are accounted for in the log (five in the 1st, Yelich&#x27;s homer in the 2nd) with no inherited runner involved. Milwaukee scored one in the bottom of the 3rd (Scott home run off Mark Davis) and one in the bottom of the 7th (Fielder home run off Ashby). San Diego scored one in the top of the 4th (Caminiti home run off Teddy Higuera), three in the top of the 5th off Dan Plesac (Tatis double, walks to Gwynn and Winfield, Caminiti two-run single, Gonzalez sacrifice fly), two in the top of the 8th (Finley single, Loretta reached on Jeffress&#x27;s two-base error, Tatis&#x27;s groundout scored Finley, Gwynn&#x27;s triple scored Loretta, the unearned run), and five in the top of the 9th off Hader (Finley&#x27;s run-scoring single and Gwynn&#x27;s grand slam, the decisive play of the game). Tony Gwynn was the player of the game: 2 for 5 with a triple, the grand slam, 5 RBIs and 2 runs. Caminiti went 3 for 5 with a homer and 3 RBIs. Rollie Fingers pitched one scoreless inning for EACH club in this game (the bottom of the 5th for San Diego, 4 BF, 1 H, 3 SO; the top of the 7th for Milwaukee, 5 BF, 2 H, 1 SO); both lines are booked keyed per (team, player_id) exactly as played and never merged, the Dawson / Randy Johnson / J.J. Putz precedent. Errors: Milwaukee 4, San Diego 0. Yount committed two (top of the 1st, Tatis reached on the two-base error; top of the 4th, Gonzalez reached on the one-base error), Yelich one (top of the 2nd, Tenace reached on the two-base error) and Jeffress one (top of the 8th, Loretta reached on the two-base error, and Loretta&#x27;s run came home unearned on Gwynn&#x27;s triple). Milwaukee&#x27;s staff earned-run total of 10 against San Diego&#x27;s 11 runs carries that one unearned run (Jeffress charged 2 runs, 1 earned); San Diego&#x27;s staff total of 8 ties to Milwaukee&#x27;s 8 runs. No double plays were turned and no batter grounded into one. Stolen bases: Yelich and Cecil Cooper, one each, both against the Tenace battery (Tenace SBA 2, SB against 2, as the fielding section prints). Wild pitches and passed balls: none for either club. Substitutes: Cecil Cooper pinch-hit for Scott in the bottom of the 5th, singled, and stayed in at first base; B.J. Surhoff replaced Contreras at catcher in the top of the 7th; Ben Oglivie replaced Yelich in left field in the top of the 8th and batted once; Gary Sheffield replaced Machado at third base in the bottom of the 9th for defense, never batted and had no fielding chance, so he carries no batting or fielding line, exactly as the export prints them. Fielding from the CSV&#x27;s printed fielding section: San Diego 27 putouts and 7 assists (Tenace 13 putouts; Tatis 3 assists, Loretta 3 assists); Milwaukee 27 putouts and 8 assists (Scott 7 putouts; Yount 3 assists, Turang 3 assists). Counting checks: San Diego plate appearances 48 (42 AB, 5 BB, 1 SF) equal Milwaukee&#x27;s 48 batters faced (Higuera 19, Plesac 6, Williams 4, Fingers 5, Jeffress 4, Sanders 1, Hader 8, Woodruff 1); Milwaukee plate appearances 40 (39 AB, 1 BB) equal San Diego&#x27;s 40 batters faced (Peavy 10, Bell 3, Davis 4, Gregerson 4, Fingers 4, Adams 3, Ashby 8, Hoffman 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Pat Murphy graded 13 decisions (7 paid off, 5 backfired, 1 neutral): pitching changes 7 (Plesac in the top of the 5th backfired, -2.15, three runs scored in the inning; Williams in the top of the 6th paid off, +0.73; Fingers in the top of the 7th paid off, +0.73; Jeffress in the top of the 8th backfired, -1.77, two runs scored; Sanders in the top of the 8th paid off, +1.20; Hader in the top of the 8th paid off, +0.60; Woodruff in the top of the 9th paid off, +0.35), defensive subs 2 (Surhoff at catcher in the top of the 7th paid off, +0.48; Oglivie in left field in the top of the 8th backfired, -1.77, the error and two runs came in behind the changed defense), hit and runs 2, both backfired (-0.76 each, the bottom of the 4th and the bottom of the 5th), one left-pitcher-in (Plesac left in fatigued in the top of the 5th, paid off, +0.76), and one pinch hitter (Cooper in the bottom of the 5th, neutral, -0.00, singled). Bruce Bochy graded 9 decisions (6 paid off, 2 backfired, 1 neutral): pitching changes 7 (Bell in the bottom of the 2nd paid off, +0.73; Davis in the bottom of the 3rd backfired, -0.77, Scott homered; Gregerson in the bottom of the 4th paid off, +0.73; Fingers in the bottom of the 5th paid off, +0.73; Adams in the bottom of the 6th paid off, +0.73; Ashby in the bottom of the 7th neutral, -0.27, Fielder homered in the inning; Hoffman in the bottom of the 9th paid off, +0.73, the save), one hit and run (the top of the 4th backfired, -1.11), and one defensive sub (Sheffield at third base in the bottom of the 9th paid off, +0.48). Availability for Game 2 at Milwaukee, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game; a new series resets availability, so nothing carried over from Round 1): Milwaukee: Higuera (12 outs) is unavailable; every other Milwaukee arm is free, nobody capped. San Diego: Ashby (6 outs) is capped at 3 outs; every other San Diego arm is free (Peavy threw only 3 outs). Managers: Pat Murphy (Milwaukee) and Bruce Bochy (San Diego). Venue is American Family Field, as printed.">
