  <title>R1-06-G4: Chicago Cubs 9, Montreal Expos 1</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as the app scorecard PDF plus the full graded play-by-play text on 2026-10-29; official R1-06 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Box score record: the two sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number. The decisions are not printed; they are derived from the play log (Pete Alexander pitched a complete game and Chicago led from the 2nd inning on; Bryn Smith started for Montreal, allowed three runs in five innings, and left down 3-0; no save, a nine-run game). Chicago scored in the 2nd (Gabby Hartnett homer), the 5th (Andre Dawson double scoring Hack Wilson), the 6th (Billy Williams homer), and six times in the 9th (Dawson 2-run homer off Jeff Reardon, Sammy Sosa 3-run homer off Reardon, Williams homer off Tim Burke). Montreal scored once, in the 9th (Gary Carter single scoring Vladimir Guerrero). Andre Dawson appears in BOTH lineups: he batted 9th for Chicago (2-for-4, double, homer, 3 RBI) and 5th for Montreal (0-for-4, grounded into a double play in the 7th). Joe ruled on the anomaly in chat on 2026-10-29: they are different teams, and the game counts exactly as played, Dawson on both sides. The two printed tables fold hit batters into the BB column; the play log proves the split: Gabby Hartnett was hit by an Andy McGaffigan pitch in the Top 6 and never walked, and McGaffigan issued no walk in his three innings, so Hartnett is BB 0, HBP 1 and McGaffigan is BB 0, HB 1. Every other walk in the game is a real walk, and with that split walks tie 4 and 4 and hit batters tie 1 and 1. Sacrifices: one, printed in the source: SH Gabby Hartnett (Top 9 bunt). No errors by either club. No substitutions on either side; all 18 starters finished. Mark Grace started at first base for Chicago for the first time since Game 1; Anthony Rizzo and Pete Crow-Armstrong did not appear. Game 3 availability was honored: Rick Reuschel and Dennis Martinez did not pitch, and John Wetteland, capped at 3 outs, was not used. Venue is Stade Olympique, Montreal&#x27;s park in the fixture (the play-by-play header labels it &quot;(neutral)&quot;, a label quirk only).">
