  <meta name="description" content="Losers Bracket, Round 1, Series 7, Game 5 at American Family Field, as the master export&#x27;s box score prints the venue. The series was formed with Game 1&#x27;s booking: #23 Milwaukee Brewers (manager Pat Murphy) against #26 San Diego Padres (manager Bruce Bochy), home pattern Milwaukee for Games 1, 2, 5 and 7, San Diego for Games 3, 4 and 6. Both clubs carry one series loss, so the loser of the series is eliminated and the winner advances to Losers Round 2. San Diego won Game 1, 11-8; Milwaukee won Game 2, 10-7, and Game 3, 5-3; San Diego won Game 4, 4-3; this game gives San Diego a 3-2 series lead, and the series runs stand at San Diego 44, Milwaukee 39. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every figure in the export agrees with itself across all of its sections. Decisions: Mark Davis takes the win for San Diego (1.1 IP, 6 BF, 2 H, 1 R, 1 ER, 1 SO): he relieved Eric Show with two out in the bottom of the 4th and stranded the inning, then pitched the 5th, and was the pitcher of record when San Diego&#x27;s eight-run 6th broke a 9-9 game open. Josh Hader takes the loss for Milwaukee (0.1 IP, 4 BF, 4 H, 4 R, 4 ER, 2 HR): he entered the top of the 6th as the fireman with runners at first and second, nobody out and a 9-7 lead, and gave up Gwynn&#x27;s RBI single, Winfield&#x27;s RBI triple, Caminiti&#x27;s two-run home run and Gonzalez&#x27;s home run to the four batters he faced; the Rec&#x27;s extra list carries his blown save (BS|MIL|MIL|haderjo01). There is no save: Trevor Hoffman pitched the final two innings with the lead at eight, then six. Scoring: Milwaukee one in the bottom of the 1st (Yelich&#x27;s leadoff home run off Show). San Diego two in the top of the 2nd (Caminiti&#x27;s home run off Caldwell; Machado&#x27;s double and Finley&#x27;s single). Milwaukee two in the bottom of the 2nd (Contreras walked, Jenkins singled, Braun&#x27;s forceout, and Yelich&#x27;s two-run double scored Contreras and Braun). Milwaukee one in the bottom of the 3rd (Fielder&#x27;s home run off Show). San Diego four in the top of the 4th, two of them on wild pitches, traced below: Gonzalez walked and Machado singled him to third; a Caldwell wild pitch during Tenace&#x27;s at-bat scored Gonzalez; Finley&#x27;s double scored Machado; Loretta&#x27;s single scored Finley; Gwynn singled Loretta to third, and a Plesac wild pitch during Winfield&#x27;s at-bat scored Loretta. Milwaukee four in the bottom of the 4th (Turang&#x27;s double, Braun&#x27;s RBI double, Molitor&#x27;s RBI single, and Yount&#x27;s two-run home run off Show; Davis relieved and stranded the inning). Milwaukee one in the bottom of the 5th (Contreras singled off Davis and Turang&#x27;s double scored him). San Diego eight in the top of the 6th: Sanders opened the inning and gave up Finley&#x27;s leadoff home run, a Loretta walk and a Tatis single without recording an out; Hader relieved and gave up Gwynn&#x27;s RBI single (Loretta scoring, Tatis thrown out at third on the play), Winfield&#x27;s RBI triple, Caminiti&#x27;s two-run home run, the decisive play, and Gonzalez&#x27;s home run; Sheets relieved and gave up Tenace&#x27;s RBI double and Finley&#x27;s RBI single before closing the inning. Milwaukee two in the bottom of the 6th (Molitor walked off Gregerson, Tenace&#x27;s throwing error moved him up, and Yount hit a two-run home run). San Diego one in the top of the 7th (Gwynn tripled off Sheets with nobody out and, after two outs, Gonzalez&#x27;s single scored him). San Diego four in the top of the 8th (Loretta walked, Gwynn&#x27;s single with Contreras&#x27;s error scored him, Winfield&#x27;s double scored Gwynn, and Caminiti&#x27;s third home run of the game, a two-run shot off Sheets). Milwaukee two in the bottom of the 9th (Fielder&#x27;s home run off Hoffman, Contreras&#x27;s double and Jenkins&#x27;s single). Ken Caminiti was the player of the game: 3 for 6, three home runs and 5 RBIs, one homer in the 2nd off Caldwell, the decisive two-run homer in the 6th off Hader, and a two-run homer in the 8th off Sheets. Tony Gwynn went 5 for 6 with a triple, 3 runs and 2 RBIs for San Diego; Steve Finley had 4 hits, a home run and 4 RBIs; Manny Machado had 4 hits, three of them doubles. For Milwaukee, Robin Yount went 4 for 5 with two home runs and 4 RBIs, and Prince Fielder homered twice. Records, verified against the archive before this booking: San Diego&#x27;s 19 runs pass the tournament&#x27;s previous one-club game record of 16, set by the Philadelphia Athletics in L1-03 Game 6. The series total through five games is 83 runs, already past the R1-09 Texas-Cincinnati series record of 81, with at least one game still to play. Ten home runs were hit, five by each club. The no-RBI runs, traced in the play rows: San Diego scored 19 runs on 17 printed RBIs. Both runs without an RBI are wild pitches in the top of the 4th. At play row seq 32, during Gene Tenace&#x27;s at-bat against Mike Caldwell with Gonzalez at third and Machado at first and nobody out, the row&#x27;s steps read &quot;Wild pitch! Runners advance 1 (p9). Adrian Gonzalez scores.&quot;; Tenace then flew out. At play row seq 38, during Dave Winfield&#x27;s at-bat against Dan Plesac with Loretta at third and Gwynn at first and two out, the same wild-pitch steps score Mark Loretta; Winfield then flew out. Loretta was Caldwell&#x27;s runner: the Rec&#x27;s extra list carries Plesac&#x27;s inherited runners as 2 in and 1 scored (IR|MIL|MIL|plesada01|2|1), so the run is charged to Caldwell, whose wild pitch is the first of the two. The game&#x27;s only wild pitches are Caldwell&#x27;s and Plesac&#x27;s, one each, exactly as the pitching section prints; both runs count earned in the printed lines, and Milwaukee&#x27;s staff earned-run total of 19 ties San Diego&#x27;s 19 runs, as San Diego&#x27;s 13 ties Milwaukee&#x27;s 13. Booked exactly as printed. Errors: one each way. Gene Tenace&#x27;s throwing error in the bottom of the 6th (play row seq 74, &quot;Error, C Tenace (throw sails)&quot;) moved Molitor up before Yount&#x27;s home run but scored nobody itself. William Contreras&#x27;s error in the top of the 8th (play row seq 95) came on Gwynn&#x27;s RBI single; Loretta&#x27;s run scored on the hit, so the error is not one of the no-RBI runs. Double plays: two, both turned by San Diego: Scott grounded into a 4-6-3 double play in the bottom of the 3rd (play row seq 27) and Braun into a 3-4-3 in the bottom of the 8th (play row seq 91); their printed GIDP 1s match the rows&#x27; coded DPs exactly, and the fielding section&#x27;s DP credits read Gonzalez 2, Tatis 2, Loretta 1. Tatis was thrown out at third on Gwynn&#x27;s top-of-the-6th single (Yelich&#x27;s outfield assist, the fielding section&#x27;s OFA 1). Stolen bases: Molitor 1, in the bottom of the 9th off Hoffman (Tenace SBA 1, SB against 1). Caught stealing: none. Sacrifices: none. Passed balls: none. Pitching lines: San Diego - Show 3.2 IP, 21 BF, 10 H, 8 R, 8 ER, 1 BB, 3 SO, 3 HR (Yelich, Fielder and Yount&#x27;s first); Davis the win; Gregerson 1.0 IP, 6 BF, 2 R, 2 ER, 1 HR (Yount&#x27;s second); Fingers 1.0 IP, 3 BF, scoreless; Hoffman 2.0 IP, 9 BF, 3 H, 2 R, 2 ER, 1 HR (Fielder&#x27;s second). Milwaukee - Caldwell 3.2 IP, 20 BF, 8 H, 6 R, 6 ER, 1 BB, 2 SO, 1 HR, 1 WP; Plesac 1.1 IP, 5 BF, 0 H, 0 R, 1 BB, 1 SO, 1 WP; Sanders 0.0 IP, 3 BF, 2 H, 2 R, 2 ER, 1 BB, 1 HR; Hader the loss; Sheets 3.2 IP, 21 BF, 9 H, 7 R, 7 ER, 1 BB, 2 SO, 1 HR, finishing the game from the 6th. Rollie Fingers pitched for San Diego in this game (a scoreless 7th); he pitched for Milwaukee in Game 1 of this series and for both clubs across the series, his lines kept separate per club as always. Substitutes: Milwaukee - Cecil Cooper pinch-hit for George Scott in the bottom of the 6th (play row seq 76 sub marker) and stayed in at first base. San Diego used its starting nine throughout. Fielding from the CSV&#x27;s printed fielding section: San Diego 27 putouts and 11 assists (Gonzalez 9 putouts; Loretta 5 assists; Tenace 7 putouts and the club&#x27;s error); Milwaukee 27 putouts and 6 assists (Jenkins and Braun 6 putouts each; Yount 3 assists; Contreras 5 putouts, 1 assist and the club&#x27;s error). Wild pitches: Caldwell 1, Plesac 1. Counting checks: San Diego plate appearances 53 (49 AB, 4 BB) equal Milwaukee&#x27;s 53 batters faced (Caldwell 20, Plesac 5, Sanders 3, Hader 4, Sheets 21); Milwaukee plate appearances 45 (43 AB, 2 BB) equal San Diego&#x27;s 45 batters faced (Show 21, Davis 6, Gregerson 6, Fingers 3, Hoffman 9). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Availability compliance in this game, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Andy Ashby (21 outs in Game 4) was unavailable for San Diego and did not pitch; Corbin Burnes (14 outs in Game 4) and Teddy Higuera (9 outs in Game 4) were unavailable for Milwaukee and did not pitch. Manager grades, exactly as the export&#x27;s decisions summary prints: Pat Murphy graded 14 decisions (3 paid off, 9 backfired, 2 neutral): pitching changes 4, all backfired (Plesac in the top of the 4th, -0.77; Sanders in the top of the 6th, -7.77, the eight-run inning; Hader in the top of the 6th, -5.81; Sheets in the top of the 6th, -2.00); left pitcher in 4 (1 paid off, 2 backfired, 1 neutral: leaving Hader in fatigued in the 6th backfired, -3.00; leaving Sheets in fatigued in the 8th backfired, -3.27, the four-run inning; leaving Sheets in in the 7th paid off, +0.73); steals 5 (2 paid off, +1.14 and +1.74; 2 backfired; 1 neutral); and a pinch hitter (Cooper in the bottom of the 6th, backfired, -0.50). Bruce Bochy graded 8 decisions (4 paid off, 2 backfired, 2 neutral): pitching changes 4 (Davis in the bottom of the 4th paid off, +0.35; Gregerson in the bottom of the 6th backfired, -1.27; Fingers in the bottom of the 7th neutral, +0.23; Hoffman in the bottom of the 8th paid off, +0.73); left pitcher in 3 (leaving Show in fatigued in the 4th backfired, -2.03; leaving Gregerson in in the 6th paid off, +0.50; leaving Hoffman in in the 9th paid off, +0.76); and a hit and run (neutral, +0.24). Availability for Game 6 at San Diego: Eric Show (11 outs in this game), Mike Caldwell (11 outs) and Ben Sheets (11 outs) are UNAVAILABLE; Trevor Hoffman (6 outs) is CAPPED at 3 outs; every other arm on both staffs is free (next highest: Gregerson and Fingers at 3 outs each, Davis and Plesac at 4). Managers: Pat Murphy (Milwaukee) and Bruce Bochy (San Diego). Venue is American Family Field, as printed.">

 Milwaukee two in the bottom of the 9th (Fielder&#x27;s home run off Hoffman, Contreras&#x27;s double and Jenkins&#x27;s single). Ken Caminiti was the player of the game: 3 for 6, three home runs and 5 RBIs, one homer in the 2nd off Caldwell, the decisive two-run homer in the 6th off Hader, and a two-run homer in the 8th off Sheets. Tony Gwynn went 5 for 6 with a triple, 3 runs and 2 RBIs for San Diego; Steve Finley had 4 hits, a home run and 4 RBIs; Manny Machado had 4 hits, three of them doubles. For Milwaukee, Robin Yount went 4 for 5 with two home runs and 4 RBIs, and Prince Fielder homered twice. Records, verified against the archive before this booking: San Diego&#x27;s 19 runs pass the tournament&#x27;s previous one-club game record of 16, set by the Philadelphia Athletics in L1-03 Game 6. The series total through five games is 83 runs, already past the R1-09 Texas-Cincinnati series record of 81, with at least one game still to play. Ten home runs were hit, five by each club. The no-RBI runs, traced in the play rows: San Diego scored 19 runs on 17 printed RBIs. Both runs without an RBI are wild pitches in the top of the 4th. At play row seq 32, during Gene Tenace&#x27;s at-bat against Mike Caldwell with Gonzalez at third and Machado at first and nobody out, the row&#x27;s steps read &quot;Wild pitch! Runners advance 1 (p9). Adrian Gonzalez scores.&quot;; Tenace then flew out. At play row seq 38, during Dave Winfield&#x27;s at-bat against Dan Plesac with Loretta at third and Gwynn at first and two out, the same wild-pitch steps score Mark Loretta; Winfield then flew out. Loretta was Caldwell&#x27;s runner: the Rec&#x27;s extra list carries Plesac&#x27;s inherited runners as 2 in and 1 scored (IR|MIL|MIL|plesada01|2|1), so the run is charged to Caldwell, whose wild pitch is the first of the two. The game&#x27;s only wild pitches are Caldwell&#x27;s and Plesac&#x27;s, one each, exactly as the pitching section prints; both runs count earned in the printed lines, and Milwaukee&#x27;s staff earned-run total of 19 ties San Diego&#x27;s 19 runs, as San Diego&#x27;s 13 ties Milwaukee&#x27;s 13. Booked exactly as printed. Errors: one each way. Gene Tenace&#x27;s throwing error in the bottom of the 6th (play row seq 74, &quot;Error, C Tenace (throw sails)&quot;) moved Molitor up before Yount&#x27;s home run but scored nobody itself. William Contreras&#x27;s error in the top of the 8th (play row seq 95) came on Gwynn&#x27;s RBI single; Loretta&#x27;s run scored on the hit, so the error is not one of the no-RBI runs. Double plays: two, both turned by San Diego: Scott grounded into a 4-6-3 double play in the bottom of the 3rd (play row seq 27) and Braun into a 3-4-3 in the bottom of the 8th (play row seq 91); their printed GIDP 1s match the rows&#x27; coded DPs exactly, and the fielding section&#x27;s DP credits read Gonzalez 2, Tatis 2, Loretta 1. Tatis was thrown out at third on Gwynn&#x27;s top-of-the-6th single (Yelich&#x27;s outfield assist, the fielding section&#x27;s OFA 1). Stolen bases: Molitor 1, in the bottom of the 9th off Hoffman (Tenace SBA 1, SB against 1). Caught stealing: none. Sacrifices: none. Passed balls: none. Pitching lines: San Diego - Show 3.2 IP, 21 BF, 10 H, 8 R, 8 ER, 1 BB, 3 SO, 3 HR (Yelich, Fielder and Yount&#x27;s first); Davis the win; Gregerson 1.0 IP, 6 BF, 2 R, 2 ER, 1 HR (Yount&#x27;s second); Fingers 1.0 IP, 3 BF, scoreless; Hoffman 2.0 IP, 9 BF, 3 H, 2 R, 2 ER, 1 HR (Fielder&#x27;s second). Milwaukee - Caldwell 3.2 IP, 20 BF, 8 H, 6 R, 6 ER, 1 BB, 2 SO, 1 HR, 1 WP; Plesac 1.1 IP, 5 BF, 0 H, 0 R, 1 BB, 1 SO, 1 WP; Sanders 0.0 IP, 3 BF, 2 H, 2 R, 2 ER, 1 BB, 1 HR; Hader the loss; Sheets 3.2 IP, 21 BF, 9 H, 7 R, 7 ER, 1 BB, 2 SO, 1 HR, finishing the game from the 6th. Rollie Fingers pitched for San Diego in this game (a scoreless 7th); he pitched for Milwaukee in Game 1 of this series and for both clubs across the series, his lines kept separate per club as always. Substitutes: Milwaukee - Cecil Cooper pinch-hit for George Scott in the bottom of the 6th (play row seq 76 sub marker) and stayed in at first base. San Diego used its starting nine throughout. Fielding from the CSV&#x27;s printed fielding section: San Diego 27 putouts and 11 assists (Gonzalez 9 putouts; Loretta 5 assists; Tenace 7 putouts and the club&#x27;s error); Milwaukee 27 putouts and 6 assists (Jenkins and Braun 6 putouts each; Yount 3 assists; Contreras 5 putouts, 1 assist and the club&#x27;s error). Wild pitches: Caldwell 1, Plesac 1. Counting checks: San Diego plate appearances 53 (49 AB, 4 BB) equal Milwaukee&#x27;s 53 batters faced (Caldwell 20, Plesac 5, Sanders 3, Hader 4, Sheets 21); Milwaukee plate appearances 45 (43 AB, 2 BB) equal San Diego&#x27;s 45 batters faced (Show 21, Davis 6, Gregerson 6, Fingers 3, Hoffman 9). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Availability compliance in this game, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Andy Ashby (21 outs in Game 4) was unavailable for San Diego and did not pitch; Corbin Burnes (14 outs in Game 4) and Teddy Higuera (9 outs in Game 4) were unavailable for Milwaukee and did not pitch. Manager grades, exactly as the export&#x27;s decisions summary prints: Pat Murphy graded 14 decisions (3 paid off, 9 backfired, 2 neutral): pitching changes 4, all backfired (Plesac in the top of the 4th, -0.77; Sanders in the top of the 6th, -7.77, the eight-run inning; Hader in the top of the 6th, -5.81; Sheets in the top of the 6th, -2.00); left pitcher in 4 (1 paid off, 2 backfired, 1 neutral: leaving Hader in fatigued in the 6th backfired, -3.00; leaving Sheets in fatigued in the 8th backfired, -3.27, the four-run inning; leaving Sheets in in the 7th paid off, +0.73); steals 5 (2 paid off, +1.14 and +1.74; 2 backfired; 1 neutral); and a pinch hitter (Cooper in the bottom of the 6th, backfired, -0.50). Bruce Bochy graded 8 decisions (4 paid off, 2 backfired, 2 neutral): pitching changes 4 (Davis in the bottom of the 4th paid off, +0.35; Gregerson in the bottom of the 6th backfired, -1.27; Fingers in the bottom of the 7th neutral, +0.23; Hoffman in the bottom of the 8th paid off, +0.73); left pitcher in 3 (leaving Show in fatigued in the 4th backfired, -2.03; leaving Gregerson in in the 6th paid off, +0.50; leaving Hoffman in in the 9th paid off, +0.76); and a hit and run (neutral, +0.24). Availability for Game 6 at San Diego: Eric Show (11 outs in this game), Mike Caldwell (11 outs) and Ben Sheets (11 outs) are UNAVAILABLE; Trevor Hoffman (6 outs) is CAPPED at 3 outs; every other arm on both staffs is free (next highest: Gregerson and Fingers at 3 outs each, Davis and Plesac at 4). Managers: Pat Murphy (Milwaukee) and Bruce Bochy (San Diego). Venue is American Family Field, as printed.">
