  <title>W2-07-G3: Atlanta Braves 7, Los Angeles Dodgers 3</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 7, Game 3 at Dodger Stadium. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Atlanta scored all seven of its runs in the last three innings and took a 2-1 series lead behind a Warren Spahn complete game. Decisions: Warren Spahn takes the win for Atlanta (9.0 IP, 33 BF, 6 H, 3 R, 3 ER, 2 BB, 4 SO, 1 HR), never leaving the mound; Bobby Cox&#x27;s one graded decision was leaving the fatigued Spahn in for the 9th, and it paid off. Eric Gagne takes the loss for Los Angeles (0.1 IP, 6 BF, 3 H, 4 R, 4 ER, 1 BB, 1 HBP, 0 SO, 1 HR): he opened the top of the 9th of a 3-3 game and gave up Rabbit Maranville&#x27;s leadoff home run, a hit batsman, Hank Aaron&#x27;s double, an intentional walk, and Freddie Freeman&#x27;s three-run double before coming out. Dazzy Vance started for Los Angeles (6.1 IP, 29 BF, 5 H, 2 R, 2 ER, 3 BB, 8 SO, 1 HR) and left in the 7th with the game tied 2-2. Kenley Jansen (1.2 IP, 7 BF, 1 H, 1 R, 1 ER, 1 BB, 1 SO, 1 HR) stranded the two runners he inherited from Vance in the 7th (the Rec&#x27;s extra line reads 2 inherited, 0 scored) and was charged with Joe Torre&#x27;s game-tying solo home run in the top of the 8th. Clem Labine (0.2 IP, 2 BF, 2 SO) struck out Dale Murphy and Andruw Jones to finish the 9th, stranding Freeman at second (extra line: 1 inherited, 0 scored). Scoring: the bottom of the 1st, Jackie Robinson and Zack Wheat singled and Mookie Betts grounded into a double play with Robinson scoring on the play, a run with no RBI (the row carries runs 1, rbi 0), 1-0; the bottom of the 2nd, Duke Snider doubled and Gil Hodges singled him home, 2-0; the top of the 7th, Murphy walked off Vance and Andruw Jones hit a two-run home run, 2-2; the bottom of the 7th, Roy Campanella homered off Spahn, 3-2; the top of the 8th, Torre homered off Jansen, 3-3; and the top of the 9th off Gagne as traced above for the 7-3 final. Rabbit Maranville is the export&#x27;s player of the game (3 for 5 with the go-ahead home run, the decisive play the export&#x27;s summary names); his other hits were singles in the 5th and the 7th. Freeman drove in three with the 9th-inning double; Aaron went 2 for 5 with a double; Andruw Jones&#x27;s two-run home run tied the game in the 7th and Torre&#x27;s solo shot tied it again in the 8th. For Los Angeles, Snider doubled and scored, Hodges singled home a run, and Campanella homered. Los Angeles made both of the game&#x27;s errors, Robinson&#x27;s in the top of the 2nd (Eddie Mathews reached) and Pee Wee Reese&#x27;s in the top of the 3rd (Aaron reached); neither cost a run, Mathews was erased on Freeman&#x27;s forceout and Aaron was stranded, and all seven Atlanta runs are earned as printed. Defensive lines are booked in the established shape from the printed fielding section (Atlanta 27 putouts and 11 assists, Freeman 11 putouts, Maranville 5 assists, Albies 4 assists, and two double plays, Betts&#x27;s in the 1st and Campanella&#x27;s in the 4th, both genuine double-play rows with printed GIDPs to match; Los Angeles 27 putouts and 6 assists, Campanella 11 putouts catching, Robinson 3 assists and his error, Reese 1 assist and his error). Two personnel notes, both booked exactly as printed: Reese was ejected after his bottom-of-the-5th strikeout (&quot;batter ejected&quot; in the log) and Maury Wills replaced him at shortstop, flying out in the 8th and taking one putout; and Robinson left in the bottom of the 8th hurt on a checked swing, per the log. The Rec carries no injuries field, and the game&#x27;s booked injuries list is empty, in the established shape. Stolen bases: none; the one graded steal decision was Robinson held at first on a poor jump in the bottom of the 1st, graded neutral, and the run scored anyway. Wild pitches: none. Passed balls: none. Hit by pitch: Chipper Jones, by Gagne in the top of the 9th, and he scored on Freeman&#x27;s double. Counting checks: Atlanta plate appearances 44 (38 AB, 5 BB, 1 HBP) equal Los Angeles&#x27;s 44 batters faced (Vance 29, Jansen 7, Gagne 6, Labine 2); Los Angeles plate appearances 33 (31 AB, 2 BB) equal Spahn&#x27;s 33 batters faced. Hit, walk, home run and strikeout totals tie across the two boxes both ways. Atlanta&#x27;s seven runs carry seven RBIs; Los Angeles&#x27;s three runs carry two RBIs, the first run scoring on Betts&#x27;s double play as traced above. Manager grades: the grades list names both managers directly, so no label mapping is needed. Tommy Lasorda graded 6 decisions (2 paid off, 3 backfired, 1 neutral): his pitching changes split (Jansen in the 7th and Labine in the 9th paid off, Gagne in the 9th backfired), both hit and runs backfired (Campanella&#x27;s flyout and Cey&#x27;s popout in the bottom of the 2nd, each with Hodges at first), and his one steal graded neutral (Robinson held in the 1st). Bobby Cox graded 1 decision (1 paid off): leaving the fatigued Spahn in for the 9th. Availability for Game 4 under the convention: Warren Spahn (27 outs in this game) and Dazzy Vance (19 outs) are unavailable; Kenley Jansen (5 outs), Eric Gagne (1 out) and Clem Labine (2 outs) are free. Game 2&#x27;s availability was honored: Clayton Kershaw (21 outs in Game 2), Kid Nichols (15 outs) and Phil Niekro (12 outs) sat. Atlanta leads the series 2-1. Managers: Bobby Cox (Atlanta) and Tommy Lasorda (Los Angeles). Venue is Dodger Stadium, as printed.">
