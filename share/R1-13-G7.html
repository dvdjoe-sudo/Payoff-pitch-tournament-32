  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-05: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-13 Game 7 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cleveland Guardians (seed 13) vs Los Angeles Angels (seed 20), home pattern 2-2-1-1-1, Game 7 at Progressive Field, the series decider with the series tied 3-3. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with three scoring points settled here and documented, the sources governing throughout. The first settlement is the Cleveland relief sequence and the decisions it produces. Stan Coveleski started and worked into the Top 6: Ohtani popped out, Trout doubled, and Francona brought in Andrew Miller, who faced one batter, Guerrero, whose double off the wall scored Trout. The run is charged to Coveleski as his runner, matching his printed line (5.1 IP, 4 H, 2 R, 2 ER, 0 BB, 5 SO), and Miller is charged with none (0.0 IP, 1 H, 0 R). Cody Allen relieved Miller with one out in the Top 6, stranded Guerrero at second, and worked the Top 7 (1.2 IP, 1 H, 0 R), so he was the pitcher of record when Cleveland scored twice in the Bottom 7 to take the lead for good, and he takes the win. Emmanuel Clase worked the Top 8 and the Top 9 (2.0 IP, 2 H, 0 R, 2 SO) and takes the save: he entered with a one-run lead and the bases empty and pitched two full innings. Frank Tanana takes the loss (8.0 IP, 9 H, 3 R, 2 ER, 1 BB, 4 SO), a complete game, Cleveland not batting in the ninth. The second settlement is the earned run accounting on Tanana&#x27;s line, booked exactly as printed. Cleveland&#x27;s Bottom 6 run is unearned: Lajoie reached on Fregosi&#x27;s error (the game&#x27;s only error, E Fregosi at shortstop), stole second, took third on Manny Ramirez&#x27;s groundout, and scored on Jackson&#x27;s single; because he reached on the error, the card charges the run unearned, and Tanana&#x27;s printed line reads 3 R and 2 ER, the two Bottom 7 runs earned. The third settlement is the Bottom 3 outs accounting. Boudreau singled, Martinez forced him at second, and Speaker bunted Martinez to second; Lajoie&#x27;s single to center then ended the inning with the graded log annotating the play (3 out, bases 1st), Martinez thrown out at home trying to score from second. That baserunning out is the game&#x27;s twenty-fourth Cleveland out recorded against Tanana&#x27;s 33 batters faced (33 PA against 24 outs over the eight innings Cleveland batted, plus the extra out on Belle&#x27;s Bottom 8 double play), and it changes no printed line. The decisions are not printed; they are derived from the play log and the run charges on the card. Run charges match the printed lines exactly: Cleveland pitching allows 2 (Coveleski 2; Miller, Allen, and Clase none), and Los Angeles pitching allows 3 (Tanana 3). The duplicate test ran before the number was assigned: the stored games in the series are Game 1, a 3-2 Cleveland win (Los Angeles 2 0 0 0 0 0 0 0 0, Cleveland 0 0 0 3 0 0 0 0 x), Game 2, a 2-1 Cleveland win (Los Angeles 0 0 0 0 1 0 0 0 0, Cleveland 0 0 0 0 0 1 0 0 1), Game 3, a 9-8 Los Angeles win (Cleveland 1 4 1 1 0 0 0 1 0, Los Angeles 2 0 0 2 0 0 0 0 5), Game 4, a 6-3 Los Angeles win (Cleveland 1 0 0 0 0 0 0 1 1, Los Angeles 0 0 2 0 0 0 0 4 x), Game 5, a 3-2 Los Angeles win (Los Angeles 0 0 1 0 0 2 0 0 0, Cleveland 0 0 1 0 0 1 0 0 0), and Game 6, a 10-7 Cleveland win (Cleveland 0 6 4 0 0 0 0 0 0, Los Angeles 0 0 0 0 5 0 1 0 1), and this box score, a 3-2 Cleveland win at Cleveland, shares Game 1&#x27;s final score and winner but stands on a different linescore with different batting and pitching lines throughout, so it is no duplicate. It is the seventh game of the series in play order, booked as Game 7, and it closes the series. The game: Coveleski and Tanana traded zeroes through two, Speaker singling in the first and stranding at second. Los Angeles scored in the Top 3: Fregosi and Boone made outs, Ohtani singled with two out, and Trout doubled him home, 1-0. Cleveland&#x27;s Bottom 3 ended on the settled baserunning out at home. The fourth and fifth stayed quiet, Jackson&#x27;s Bottom 4 double stranded, and in the Bottom 5 Martinez singled and Speaker popped out behind him. Los Angeles doubled the lead in the Top 6 on the settled sequence, Trout&#x27;s double and Guerrero&#x27;s double off Miller, 2-0, Allen then stranding Guerrero at second on two flyouts to left. Cleveland got on the board in the Bottom 6 on the settled unearned run, Jackson&#x27;s single scoring Lajoie, 2-1, Belle flying out to end it. The Top 7 went nowhere: Anderson singled, Grich&#x27;s bunt forced him at second, and Fregosi grounded into a double play. Cleveland won it in the Bottom 7: Jose Ramirez singled, Boudreau flied deep to right, Martinez struck out, Speaker singled Ramirez to third, and Lajoie doubled both home, 3-2, Thome striking out with Lajoie at second. Clase took over for the Top 8, Doby entering in center in the same frame: Boone singled, Ohtani struck out, Trout singled Boone to third, but Salmon flied out to left and Glaus struck out, the tying run stranded at third. Cleveland&#x27;s Bottom 8 added nothing: Manny walked, Jackson popped up his bunt, and Belle grounded into a double play. Clase finished the Top 9 in order, Joyner flying out to center, Anderson grounding out to second, and Grich grounding out to third. Cleveland stranded 6 and Los Angeles 5. Home runs: none by either club. Doubles: four, Trout (two) and Guerrero for Los Angeles and Jackson and Lajoie for Cleveland. Triples: none. Errors: one, Fregosi in the Bottom 6, on the settled accounting above; Cleveland played errorless ball. Hit batters: none; HB is carried as 0 for all five pitchers (Coveleski, Miller, Allen, and Clase for Cleveland; Tanana for Los Angeles) as card-sourced values, and the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: one bunt, Speaker in the Bottom 3, so the split lines read SH 1 for Speaker and SF 0 for every batter, log-proven (no sacrifice fly was hit); Grich&#x27;s Top 7 bunt is a fielder&#x27;s choice at-bat on the card, the lead runner forced, and Grich carries AB 4 with no sacrifice, exactly as printed. Stolen bases: one, Lajoie in the Bottom 6. Caught stealing: none; the game&#x27;s other steal sends ended with the runner held. Double plays grounded into: two, Fregosi in the Top 7 and Belle in the Bottom 8, counted from the play log and matching the card extras. Substitutions: three defensive substitutions, no pinch hitters. Belle replaced Lofton in left field for the Top 5 and carries the printed line AB 2, H 0, GIDP 1. Salmon replaced Guerrero in right field for the Bottom 7 and carries the printed line AB 1, H 0. Doby replaced Speaker in center field for the Top 8 with no plate appearance and no batting line, carried in this recap only. Batters faced are counted from the play log and tie to the batting PA totals both ways (Los Angeles 34 PA against 34 Cleveland BF: Coveleski 20, Miller 1, Allen 5, Clase 8; Cleveland 33 PA against 33 Tanana BF). Los Angeles PA is AB 34; Cleveland PA is AB 31 plus BB 1 plus SH 1. Strikeouts tie both ways: Los Angeles batting 7 against Cleveland pitching 7, Cleveland batting 4 against Los Angeles pitching 4. Thirteen decisions were graded. Terry Francona made 10 (5 paid off, 2 backfired, 3 neutral): the Bottom 1 hit and run backfired at -1.11; the Top 5 Belle defensive sub was neutral at +0.10; the Top 6 pitching changes went both ways, Miller backfiring at -0.59 on Guerrero&#x27;s double and Allen paying off at +0.91; the Bottom 6 steal sends were neutral at +0.14, Lajoie held, and paid off at +0.74, Lajoie stealing second; both Bottom 7 steal sends with Jose Ramirez held paid off at +1.14 and +1.49, the game&#x27;s best grade, the two-run inning rolling behind them; the Top 8 change to Clase was neutral at +0.23 and the Top 8 Doby defensive sub paid off at +0.48. Mike Scioscia made 3 (0 paid off, 3 backfired, 0 neutral), every decision he made backfiring: the Top 2 steal send at -0.51, Joyner held; the Top 7 sacrifice bunt at -1.11, the lead runner forced and the double play behind it; and the Bottom 7 Salmon defensive sub at -1.52, the game&#x27;s worst grade, Cleveland&#x27;s two-run inning arriving with Salmon newly in right field. Managers: Terry Francona (Cleveland) and Mike Scioscia (Los Angeles). Venue is Progressive Field. Availability compliance: Feller (18 outs in Game 6) and Finley (9 outs in Game 6), both unavailable under the house convention, were correctly unused. Tanana was Los Angeles&#x27;s rotation turn for Game 7 and was free: he had no line in Game 6, and the cap from his 7 outs in Game 3 applied to Game 4 only. Coveleski likewise had no line in Game 6 and started for Cleveland on the rotation cycle. Cleveland wins the series 4-3 and advances on the winners side; Los Angeles drops to the losers side at 0-1 in series and is not eliminated. Series runs across the seven games: Cleveland 31, Los Angeles 30.">
