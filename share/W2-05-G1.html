  <title>W2-05-G1: Cleveland Guardians 3, St. Louis Cardinals 2</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 5, Game 1 at Busch Stadium. This booking forms the series in its archive slot: St. Louis, the #5 seed, against Cleveland, the #13 seed, the reseeded Winners Round 2 pairing, with St. Louis home for Games 1, 2, 5 and 7. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Cade Smith takes the win for Cleveland (1.0 IP, 3 BF, 0 H, 1 SO), pitching a scoreless bottom of the 7th before Cleveland scored the winner. Ryan Helsley takes the loss for St. Louis (1.1 IP, 6 BF, 1 H, 1 R, 1 ER, 1 BB): the only hit off him was Jackson&#x27;s top-of-the-8th triple, and the run scored on the sacrifice fly. Cody Allen takes the save (1.0 IP, 3 BF, 0 H, 2 SO), striking out Pujols and Edmonds in a perfect 9th. Doug Jones takes a hold in the Rec&#x27;s extra line (1.0 IP, 4 BF, 1 H, 1 SO) for the scoreless 8th. Andrew Miller is charged with the blown save in the Rec&#x27;s extra line (1.1 IP, 5 BF, 1 H, 3 SO; 1 inherited runner, 1 scored): he entered in the bottom of the 5th with a 2-1 lead and Yadier Molina, Bob Feller&#x27;s runner, on base, and Molina scored the tying run on Ozzie Smith&#x27;s single; the run is charged to Feller, whose line reads 4.2 IP, 18 BF, 4 H, 2 R, 2 ER, 1 BB, 2 SO, so Miller&#x27;s own line shows no runs. Scoring: St. Louis scored first in the bottom of the 2nd, Jim Edmonds walking and scoring on Molina&#x27;s groundout to second. Cleveland tied it in the top of the 3rd: Kenny Lofton singled, stole second, and scored on Nap Lajoie&#x27;s single. Cleveland went ahead 2-1 in the top of the 5th, Lajoie singling, stealing second, and scoring on Shoeless Joe Jackson&#x27;s single after Manny Ramirez&#x27;s walk. St. Louis tied it in the bottom of the 5th on Molina&#x27;s single off Feller and Ozzie Smith&#x27;s single off Miller. The winner came in the top of the 8th: Jackson tripled off Helsley to open the inning, Albert Belle was walked intentionally, and José Ramírez&#x27;s sacrifice fly to left, the decisive play the export&#x27;s summary names, scored Jackson. Shoeless Joe Jackson is the export&#x27;s player of the game: 3 for 4 with a double, the 8th-inning triple, 1 RBI and the winning run. Key lines: for Cleveland, Lajoie 3 for 5 with a double, an RBI, a stolen base and a run, Lofton 1 for 5 with a stolen base and a run, and Belle 1 for 3 with a double and a walk; for St. Louis, Ozzie Smith 3 for 4 with the tying RBI and a stolen base, and Bob Gibson&#x27;s start (6.1 IP, 29 BF, 7 H, 2 R, 2 ER, 3 BB, 2 SO) went unrewarded. The game&#x27;s only error was Victor Martinez&#x27;s (E2): his throw sailed on Ozzie Smith&#x27;s bottom-of-the-8th single, and it cost nothing, Musial popping out and Hornsby striking out behind it; it is carried in errors_by in the established shape, and defensive lines are booked in the established shape from the printed fielding section (Cleveland 27 putouts and 6 assists, Martinez 9 putouts; St. Louis 27 putouts and 8 assists, Pujols 9 putouts). Cleveland turned the game&#x27;s only double play, Rogers Hornsby&#x27;s bottom-of-the-1st grounder, a genuine double-play row in the log and the game&#x27;s only printed GIDP. Stolen bases: Lofton and Lajoie off Molina (his catching line reads PB 0, 2 stolen bases against, 0 caught stealing), and Ozzie Smith off Martinez (PB 0, 1 against, 0 caught). Wild pitches: none. Passed balls: none. Counting checks: Cleveland plate appearances 39 (34 AB, 4 BB, 1 SF) equal St. Louis&#x27;s 39 batters faced (Gibson 29, Brazle 1, Helsley 6, Isringhausen 3); St. Louis plate appearances 33 (32 AB, 1 BB) equal Cleveland&#x27;s 33 batters faced (Feller 18, Miller 5, C. Smith 3, D. Jones 4, Allen 3). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Every run carries an RBI (Cleveland 3 runs on 3 RBIs, St. Louis 2 on 2). One correction to the booking brief, booked as printed: the brief&#x27;s hand-summed grades tally for Terry Francona read 8 decisions with 3 pitching changes; the export&#x27;s grades list and its own decisions summary both print 9 decisions (5 paid off, 4 backfired, 0 neutral) with 4 pitching changes (3 paid off, 1 backfired), and those are the figures booked. Manager grades: the grades list names both managers directly, so no label mapping is needed. Terry Francona graded 9 decisions (5 paid off, 4 backfired, 0 neutral): four pitching changes at 3 paid off and 1 backfired, four steals at 2 paid off and 2 backfired, and the Speaker pinch-hit backfired. Tony La Russa graded 5 decisions (3 paid off, 1 backfired, 1 neutral): all three pitching changes paid off, the Simmons pinch-hit backfired, and one steal was neutral. Availability for Game 2 under the convention: Feller (14 outs in this game) and Gibson (19 outs) are unavailable; Miller (4 outs), C. Smith (3), D. Jones (3), Allen (3), Brazle (1), Helsley (4) and Isringhausen (3) are free. Cleveland leads the series 1-0. Managers: Terry Francona (Cleveland) and Tony La Russa (St. Louis). Venue is Busch Stadium, as printed.">
