  <meta name="description" content="Losers Bracket, Round 1, Series 6, Game 3 at Olympic Stadium, as the master export&#x27;s box score prints the venue (marked neutral in the print). Montreal leads the series 2-1. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every figure in the export agrees with itself across all of its sections. Decisions: Jacob deGrom takes the win for New York (6.0 IP, 25 BF, 5 H, 0 R, 0 ER, 3 BB, 5 SO); he is the export&#x27;s Player of the Game. Dennis Martinez takes the loss for Montreal (6.0 IP, 25 BF, 5 H, 2 R, 2 ER, 3 BB, 4 SO, 2 HR, Lindor and Alfonzo). Armando Benítez earns the save (1.0 IP, 5 BF, 1 H, 0 R, 1 BB, 1 SO): in the bottom of the 9th he worked around Wallach&#x27;s walk and Raines&#x27;s single, ending the game on Vidro&#x27;s groundout to shortstop. Scoring: New York scored one in the top of the 1st (Lindor&#x27;s leadoff home run off Martinez) and one in the top of the 5th (Alfonzo&#x27;s solo home run off Martinez). Montreal scored its only run in the bottom of the 7th (Cabrera walked off Wagner, took second as Raines struck out on the hit and run, and scored on Vidro&#x27;s single to right). New York added an insurance run in the top of the 8th (Strawberry doubled to center off Rojas, Burke relieved, and Piazza&#x27;s single to left scored him). Errors: none for either club; the game was errorless, and the earned-run totals tie exactly: New York&#x27;s staff total of 1 equals Montreal&#x27;s 1 run and Montreal&#x27;s staff total of 3 equals New York&#x27;s 3 runs. Double plays: one per club. Montreal turned one in the top of the 2nd (Beltran grounds into a double play, 3-4-3 as the rows code it), matching Beltran&#x27;s printed GIDP of 1, and New York turned one in the bottom of the 8th (Dawson grounds into a double play, 4-6-3 as the rows code it), matching Dawson&#x27;s printed GIDP of 1; the printed fielding section&#x27;s DP column credits Fairly and Cabrera one each for Montreal and Lindor, Olerud and McNeil one each for New York, exactly as printed. Stolen bases: Raines and Cabrera, one each, both with Piazza catching (two attempted, two successful, exactly as the printed fielding section records). The printed fielding section also credits Beltran one outfield assist and Walker one runner out on the bases. Wild pitches: none for either club. Passed balls: none. Substitutes: John Olerud replaced Hernandez at first base in the bottom of the 7th (defensive sub) and batted once, flying out to center in the top of the 8th; Howard Johnson pinch-hit for Alonso in the top of the 8th and struck out, not staying in the game; Jeff McNeil replaced Alfonzo at second base in the bottom of the 8th (defensive sub) and batted once in the top of the 9th, flying out to left. Fielding from the CSV&#x27;s printed fielding section: New York 27 putouts and 11 assists (Lindor 4 assists); Montreal 27 putouts and 10 assists (Vidro 5 assists). Counting checks: New York plate appearances 36 (33 AB, 3 BB) equal Montreal&#x27;s 36 batters faced (Martinez 25, Reardon 3, Rojas 3, Burke 5); Montreal plate appearances 38 (33 AB, 5 BB) equal New York&#x27;s 38 batters faced (deGrom 25, Wagner 5, Orosco 3, Benítez 5). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Davey Johnson graded 6 decisions (3 paid off, 2 backfired, 1 neutral): pitching changes 3 (Wagner in the bottom of the 7th neutral, -0.27; Orosco in the bottom of the 8th paid off, +0.73; Benítez in the bottom of the 9th paid off, +0.73), defensive subs 2 (Olerud at first base in the bottom of the 7th backfired, -0.52; McNeil at second base in the bottom of the 8th paid off, +0.48) and one pinch hitter (Howard Johnson in the top of the 8th backfired, -0.47, struck out). Dick Williams graded 5 decisions (1 paid off, 2 backfired, 2 neutral): hit and runs 2 (the bottom of the 1st backfired, -1.11; the bottom of the 7th neutral, +0.24, Raines striking out as Cabrera took second on the play that set up Montreal&#x27;s only run) and pitching changes 3 (Reardon in the top of the 7th paid off, +0.73; Rojas in the top of the 8th neutral, -0.27; Burke in the top of the 8th backfired, -0.93, giving up Piazza&#x27;s run-scoring single). Availability compliance: Pedro Martinez (18 outs in Game 2) was unavailable for Montreal and did not pitch; Dwight Gooden (16 outs in Game 2) was unavailable for New York and did not pitch. Availability for Game 4 at Montreal, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Jacob deGrom (18 outs) is unavailable for New York and Dennis Martinez (18 outs) is unavailable for Montreal; every other arm on both staffs is free; no caps. Managers: Dick Williams (Montreal) and Davey Johnson (New York). Venue is Olympic Stadium, as printed.">
