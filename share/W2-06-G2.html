  <title>W2-06-G2: Minnesota Twins 1, Chicago Cubs 7</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 6, Game 2 at Wrigley Field. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Mordecai Brown takes the win for Chicago, a complete game (9.0 IP, 34 BF, 7 H, 1 R, 1 ER, 2 BB, 1 HBP, 5 SO, no home runs allowed). Johan Santana takes the loss for Minnesota (5.0 IP, 24 BF, 5 H, 5 R, 5 ER, 4 BB, 1 SO, 2 home runs allowed). There is no save, and the Rec carries no extra line at all: no holds, no inherited runners, no blown saves. Scoring: Minnesota&#x27;s only run came in the top of the 3rd: Gary Gaetti doubled to left and Rod Carew doubled him home. Chicago broke through in the bottom of the 5th: Gabby Hartnett walked, Pete Crow-Armstrong bunted him to second, Ryne Sandberg singled Hartnett home, stole second, and Ron Santo hit a two-run home run, the decisive play the export&#x27;s summary names (3-1). The bottom of the 6th added two: Billy Williams singled and Ernie Banks hit a two-run home run off Santana (5-1); Firpo Marberry then relieved and finished the game for Minnesota (3.0 IP, 14 BF, 3 H, 2 R, 2 ER, 2 BB, 4 SO, 2 home runs allowed). Chicago&#x27;s last two runs came in the bottom of the 7th on back-to-back solo home runs by Anthony Rizzo and Santo off Marberry (7-1). Ron Santo is the export&#x27;s player of the game: 2 for 3 with two home runs, 3 RBIs, 2 runs and a walk. Key lines: for Chicago, Banks 2 for 4 with the two-run home run and 2 RBIs; Sandberg 2 for 4 with an RBI, a run and a stolen base; Rizzo 1 for 4 with the solo home run; and Brown&#x27;s complete game. For Minnesota, Carew 1 for 4 with the RBI double; Gaetti 1 for 3 with the double and the run; Joe Cronin 1 for 2 with a double, a hit by pitch and a strikeout. The game was errorless, and defensive lines are booked in the established shape from the printed fielding section (Minnesota 24 putouts and 4 assists, Mauer 6 putouts catching; Chicago 27 putouts and 12 assists, Rizzo 10 putouts, Sandberg 6 assists, Santo 4 assists). Chicago turned three double plays (Puckett&#x27;s top-of-the-1st grounder, range A at third base, and Hrbek&#x27;s grounders in the top of the 2nd and the top of the 9th, all genuine double-play rows in the log and Minnesota&#x27;s printed GIDPs: Puckett 1, Hrbek 2); Minnesota turned none. Stolen bases: Sandberg off Mauer in the bottom of the 5th (Mauer&#x27;s catching line reads PB 0, 1 stolen base against, 0 caught stealing). Wild pitches: none. Passed balls: none. Counting checks: Minnesota plate appearances 34 (31 AB, 2 BB, 1 HBP) equal Chicago&#x27;s 34 batters faced (Brown 34); Chicago plate appearances 38 (31 AB, 6 BB, 1 SH) equal Minnesota&#x27;s 38 batters faced (Santana 24, Marberry 14). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Every run carries an RBI (Minnesota 1 run on 1 RBI, Chicago 7 on 7). Manager grades: the grades list names both managers directly, so no label mapping is needed. Frank Chance graded 7 decisions (3 paid off, 4 backfired, 0 neutral): four steals at 2 paid off and 2 backfired, two hit and runs, both backfired, and one sacrifice bunt, the Crow-Armstrong bunt in the 5th, which paid off. Tom Kelly graded 1 decision (1 paid off): the pitching change to Marberry in the 6th. Availability from Game 1 was honored: Fergie Jenkins and Walter Johnson, both unavailable after their Game 1 workloads, did not pitch. Availability for Game 3 under the convention: Mordecai Brown (27 outs in this game), Johan Santana (15 outs) and Firpo Marberry (9 outs) are unavailable; every other pitcher on both staffs is free. Chicago leads the series 2-0. Managers: Frank Chance (Chicago) and Tom Kelly (Minnesota). Venue is Wrigley Field, as printed.">
