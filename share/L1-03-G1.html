  <title>L1-03-G1: Tampa Bay Rays 1, Philadelphia Athletics 7</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 3, Game 1 at Shibe Park (neutral), as the graded log prints the venue. This booking OPENS the series: the L1-03 slot (Losers Round 1, reseeded losers pool) was formed with this game, #17 Philadelphia Athletics (manager Connie Mack) against #30 Tampa Bay Rays (manager Kevin Cash), home pattern Philadelphia for Games 1, 2, 5 and 7, Tampa Bay for Games 3, 4 and 6; the formation block stays as the shell carries it (rule reseed-high-vs-low, pool &quot;Losers of the 16 opening-round series&quot;, gate &quot;Round 1 is complete (all 16 opening series)&quot;), with the feeder labels as in the formed L1-02 entry. Both clubs carry one series loss into this series, so the loser of the series is eliminated and the winner advances to Losers Round 2. Booked from the app export, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the standalone plays JSON, the graded play-by-play log with its fielding lines, the Gazette scorecard PDF and the scorecard photo. All five sources agree on every figure. Decisions: Lefty Grove takes the win with a complete game (9.0 IP, 7 H, 1 R, 1 ER, 5 BB, 11 SO, 37 batters faced); David Price takes the loss (4.0 IP, 6 H, 5 R, 4 ER, 0 BB, 5 SO, 2 HR, 20 batters faced, 1 wild pitch). No save: Grove finished the game himself. Run charges close exactly and explain the earned-run split on Price&#x27;s line: Philadelphia books 6 RBI for 7 runs. The bottom-of-the-1st run carries no RBI: Collins singled, stole second on Connie Mack&#x27;s send (the game&#x27;s first graded decision, paid off), Cochrane&#x27;s sacrifice bunt moved him to third, and he scored on Price&#x27;s wild pitch during Simmons&#x27;s strikeout, an earned run. The bottom-of-the-4th three runs: Bob Johnson&#x27;s solo home run (earned), then Wally Moses reached on Evan Longoria&#x27;s error and scored on Eddie Joost&#x27;s two-run home run, so Moses&#x27;s run is unearned and Price is charged 4 earned of 5. The other Philadelphia runs: Fain&#x27;s bottom-of-the-2nd groundout brought Moses home after his double and Joost&#x27;s single (RBI Fain), and Moses&#x27;s bottom-of-the-8th triple off J.P. Howell scored Johnson and Baker for the last two, both earned and charged to Howell. Tampa Bay&#x27;s only run came in the top of the 9th: Zobrist and Bartlett singled and Toby Hall&#x27;s two-out single scored Zobrist, the run earned against Grove. The duplicate test ran before the number was assigned: the L1-03 series entry was an unformed shell with no stored games, so this box score takes Game 1. Grove dominated the middle innings: Tampa Bay put two on in the 1st (Longoria&#x27;s walk) and Longoria doubled in the 4th but was thrown out at third on the relay; the Rays loaded the bases in the 8th on Upton&#x27;s single, his caught stealing, and three straight walks, and Grove struck out Longoria and Pena to strand them. Tampa Bay used six pitchers: after Price, Adam, McGee and Castillo each threw a scoreless inning, Howell gave up the two 8th-inning runs, and Roberto Hernandez finished the 8th, Fain grounding into the game&#x27;s only double play (Lowe to Bartlett to Diaz) behind him. Fielding from the printed fielding sections, which agree exactly between the CSV and the graded log: Tampa Bay 24 putouts and 11 assists with one double play and Price&#x27;s wild pitch; Philadelphia 27 putouts and 9 assists, errorless, no double play. Errors: two, both Tampa Bay, carried in errors_by in the established shape: Brandon Lowe in the bottom of the 1st (Jimmie Foxx reached) and Evan Longoria in the bottom of the 4th (Moses reached and later scored unearned). Steals: Collins stole one base (against Hall); Upton was caught stealing (Cochrane to Collins). No passed balls. Counting checks: Tampa Bay plate appearances 37 equal Grove&#x27;s 37 batters faced; Philadelphia plate appearances 36 equal Tampa Bay&#x27;s 36 batters faced (Price 20, Adam 4, McGee 3, Castillo 3, Howell 4, Hernandez 2). Hit, strikeout and walk totals tie across the two boxes both ways. The game&#x27;s play rows traveled with the sources: the 83 rows in the standalone plays JSON (identical to the CSV&#x27;s PLAYS (JSON) section) were gated against the printed lines before booking and passed every gate exactly (every batting and pitching line rebuilt from the rows alone, batters faced included, with the earned-run bound; the linescore rebuilt exactly; the rows&#x27; run totals 1 and 7; the rows&#x27; errors 2 against Tampa Bay and 0 against Philadelphia; and the PP-WE-2 win probability chain closing at a residual of 0.0), and they are staged with the booking for the tournament&#x27;s play-by-play store. Manager grades: Connie Mack graded 1 decision (1 paid off, 0 backfired, 0 neutral): the bottom-of-the-1st steal send, paid off at +0.39. Kevin Cash graded 8 decisions (4 paid off, 3 backfired, 1 neutral): pinch hitters 2 (the Upton pinch hit in the top of the 5th backfired, -0.76; the Arozarena pinch hit in the top of the 6th was neutral, -0.23), pitching changes 5 (Adam +1.11, McGee +0.73, Castillo +0.73 and Hernandez +0.70 paid off; Howell -1.27 backfired), and one steal send (Upton in the top of the 8th, caught stealing, -1.11, backfired). Availability for Game 2 at Philadelphia, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Tampa Bay: Price (12 outs) is unavailable; Adam, McGee and Castillo (3 outs each), Howell (1 out) and Hernandez (2 outs) are all free, nobody capped. Philadelphia: Grove (27 outs, the complete game) is unavailable; every other Athletics arm is free, nobody capped. Managers: Connie Mack (Philadelphia) and Kevin Cash (Tampa Bay). Venue is Shibe Park (neutral).">
