  <meta name="description" content="Played by Joe in the playable app and sent to the co-managed tournament games chat on 2026-11-16 as a four-file set (the game JSON carrying the complete Rec: box, CSV sections, summary, play-by-play, graded decisions, holds and inherited runners, and the native plays string; the standalone CSV; the play-by-play text; and the scorecard PDF); the JSON&#x27;s own stamp reads 2026-11-17T05:38:56Z, the app&#x27;s export dating. Joe&#x27;s ruling in chat the same day adopts this playing as the new R1-06 Game 5 under the R1-05, R1-06, and R1-10 Game 1 adoption precedents, the R1-01 Game 1 through Game 4 adoptions, the R1-04 Game 6 adoption, and the R1-06 Game 1, Game 2, and Game 4 adoptions (Game 4 earlier the same evening). It replaces the booked Game 5 (Chicago 3, Montreal 2; W Mordecai Brown, L Jeff Reardon; played 2026-10-29), which is preserved untouched in the Cubs records at archive/replaced/ (PP_R1_06_G5_OFFICIAL_replaced.md, with its archive, monolith, and detail objects alongside). The replaced game was the walk-off clincher, Wilson scoring on Dawson&#x27;s bottom-of-the-9th double, and Dawson played for both clubs in it, as in the replaced Game 4: 1 for 4 with the walk-off double and an RBI for Chicago, 1 for 4 with an RBI and a stolen base for Montreal. In the adopted game Dawson appears only for Montreal (1 for 4). The series result is unchanged, Chicago winning the series 4-1, Chicago having won Game 5 in both playings, and both club records are unchanged; series runs move from 22 to 18 to 22 to 17. The replacement was made as a guarded manual edit under Joe&#x27;s ruling, confined to this game object, its detail file, and the series entry&#x27;s MVP line. The Series MVP stays Billy Williams; he went 0 for 3 in the adopted game against 0 for 2 with a walk, a hit batter, a steal, and a run scored in the replaced one, so his MVP line is recomputed from the five games as now booked and reads &quot;5 for 20, 2 R, 1 HR, 1 RBI, .250&quot;, where it read &quot;5 for 19, 3 R, 1 HR, 1 RBI, .263&quot; with the replaced game inside it. All four sources agree on every number: the linescore, the batting and pitching sums, plate appearances against batters faced both ways (Montreal 37 against Zambrano&#x27;s 29, Sutter&#x27;s 3, and Lee Smith&#x27;s 5; Chicago 30 against Vazquez&#x27;s 24 and McGaffigan&#x27;s 6), and printed RBI (Montreal 1 for 1, Chicago 3 for 3), booked exactly as printed. Montreal&#x27;s only run came in the 3rd: Raines and Vidro walked, Walker struck out, and Guerrero&#x27;s long single to right center scored Raines. Chicago scored in the 3rd (Crow-Armstrong singled and Sandberg hit a two-run homer off Vazquez, the game&#x27;s only home run) and the 4th (Sosa singled, Williams&#x27;s groundout on the hit and run moved him to second, and Wilson&#x27;s single scored him). Carlos Zambrano won it (6.2 IP, 6 H, 1 ER, 3 BB, 4 SO); Javier Vazquez took the loss (6.0 IP, 7 H, 3 ER, 9 SO, 1 HR); Bruce Sutter held the 7th (0.2 IP, 1 H, 1 WP), entering with a runner on third and two outs and striking out Walker, and Lee Smith earned the save (1.2 IP, 2 SO), entering in the 8th with a runner on third and one out. Hold: Bruce Sutter. Inherited runners: Sutter 1/0, Lee Smith 1/0. Tim Wallach&#x27;s 4th-inning error (Hartnett reached) was the game&#x27;s only error and cost nothing; Chicago&#x27;s defense turned no double play and Montreal&#x27;s neither. The 76 play rows gate clean outright (no GIDP difference, no converter patch). Johnny Kling replaced Hartnett at catcher for the top of the 8th, a graded defensive sub that paid off; he had no plate appearance, and his appearance stands in the defense object (2 putouts). Managers: Frank Chance (Chicago) and Dick Williams (Montreal). Venue is Wrigley Field. Chicago won the series 4-1.">
