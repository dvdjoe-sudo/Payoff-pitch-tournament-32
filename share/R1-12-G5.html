  <title>R1-12-G5: New York Mets 1, Minnesota Twins 7</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-04: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-12 Game 5 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Minnesota Twins (seed 12) vs New York Mets (seed 21), home pattern 2-2-1-1-1, Game 5 at Target Field in Minneapolis, and Minnesota wins the series 4-1 with this win. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number. Two run sequences are settled from the play log and documented here, and one Bottom 7 charge reading is settled the same way; in each case the printed lines govern. First settlement, the Bottom 2: the four runs are Goslin, Killebrew and Hrbek on Cronin&#x27;s bases-loaded double, and Cronin on Carew&#x27;s single behind it. The log order is Goslin&#x27;s single, a walk to Killebrew, Oliva&#x27;s fly out to center, a walk to Hrbek that loaded the bases, Cronin&#x27;s double to the center field wall scoring all three (his cell carries the three RBI markers), Gaetti&#x27;s bunt popped up to the catcher, Carew&#x27;s single up the middle scoring Cronin from second (1 run), and only then Mauer&#x27;s reach on Strawberry&#x27;s error, which produced no run and stranded Carew and Mauer when Puckett flied out. Oliva did not double in the inning; his double came in the Bottom 3. Cronin is credited 3 RBI and Carew 1, exactly as the card prints, and all four runs are earned on the card&#x27;s accounting, Leiter at 4 ER, because Cronin reached on his own double and scored on a single before the error ever happened. Second settlement, New York&#x27;s only run, in the Top 4: Wright walked, took third on Strawberry&#x27;s single, and scored on Alonso&#x27;s deep fly to center. The card charges Alonso no RBI for it: his printed line reads RBI 0 with the fly counted as an at-bat (AB 2 for the game), and the card&#x27;s extras list no sacrifice fly, so New York&#x27;s printed RBI total is 0 for its 1 run and the run is booked with no RBI, exactly as printed. Third settlement, the Bottom 7 charges: Orosco&#x27;s three runs are Gaetti, Mauer and Puckett. Gaetti singled off Orosco to open the inning and scored on Mauer&#x27;s forceout (Mauer RBI 1 on the card), Mauer reached on that forceout off Orosco and scored on Puckett&#x27;s two-run home run off Orosco, and Puckett&#x27;s homer is the third. Goslin walked off McGraw after the change, moved up on Oliva&#x27;s single off McGraw, and was stranded at third when Hrbek&#x27;s fielder&#x27;s choice forced Oliva at second to end the inning; Oliva&#x27;s single did not score him, Oliva carries RBI 0 on the card, and McGraw allowed no runs, exactly as the printed lines read (Orosco 0.1 IP, 3 H, 3 ER; McGraw 1.2 IP, 1 H, 0 R). The decisions are not printed; they are derived from the play log and the run charges on the card. Jim Kaat takes the win (8.0 IP, 4 H, 1 ER, 4 BB, 6 SO): he took a shutout into the fourth, allowed only the one run, and Minnesota led from the Bottom 2 on. Al Leiter takes the loss (6.0 IP, 5 H, 4 ER, 3 BB, 6 SO): all four Bottom 2 runs are his. There is no save: Nathan pitched the Top 9 with a seven-run lead, not a save situation. Run charges match the printed lines exactly: Minnesota pitching allows 1 + 0 = 1 (Kaat the one run, Nathan none), and New York pitching allows 4 + 3 + 0 = 7 (Leiter the four Bottom 2 runs, Orosco the three Bottom 7 runs Gaetti, Mauer and Puckett, McGraw none). The duplicate test ran before the number was assigned: the four stored games in the series are Game 1 (Minnesota 6, New York 5, linescore New York 0 3 0 1 1 0 0 0 0, Minnesota 1 1 0 0 0 2 0 0 2), Game 2 (New York 5, Minnesota 1, linescore New York 1 2 0 0 0 0 2 0 0, Minnesota 0 0 0 0 0 0 1 0 0), Game 3 (Minnesota 1, New York 0, linescore Minnesota 1 0 0 0 0 0 0 0 0, New York 0 0 0 0 0 0 0 0 with the ninth never batted), and Game 4 (Minnesota 5, New York 4, linescore Minnesota 0 0 1 0 0 3 0 1 0, New York 0 0 1 0 0 0 3 0 0); none shares this game&#x27;s final score or linescore, so this box score, a 7-1 Minnesota win on its own linescore, is no duplicate, and this is the fifth game of the series in play order, booked as Game 5. The game: Kaat and Leiter traded a scoreless first, and Minnesota broke it open in the Bottom 2 as settled above, four runs on Cronin&#x27;s bases-clearing double and Carew&#x27;s single. New York&#x27;s only run came in the Top 4, Wright walking, taking third on Strawberry&#x27;s single, and scoring on Alonso&#x27;s deep fly, booked with no RBI as the card prints. Leiter settled in and Davey Johnson&#x27;s graded call to leave the fatigued starter in for the Bottom 6 paid off, and Kaat matched him zero for zero through the middle innings, the only blemish on his line after the run a wild pitch in the Bottom 5 half of his own work (Goslin struck out on it and was thrown out at first, nobody advanced). Minnesota put it away in the Bottom 7 off Orosco: Gaetti singled, Carew singled on the hit and run with Gaetti taking third, Mauer&#x27;s forceout scored Gaetti, and Puckett hit a two-run home run before McGraw came in and stranded Goslin at third. Kaat worked a scoreless eighth around Lindor&#x27;s walk and the held steal send, and Nathan pitched a clean Top 9, striking out Piazza and closing the series on Beltran&#x27;s fly out to center. Both clubs stranded six. Home runs: one, Puckett for Minnesota (Bottom 7, two-run). Doubles: two, Cronin in the Bottom 2 and Oliva in the Bottom 3, both for Minnesota. Triples: none. Errors: one, Strawberry&#x27;s error in right field on Mauer&#x27;s Bottom 2 reach, the game&#x27;s only error; Minnesota played errorless ball. Hit batters: none; every pitcher&#x27;s HBP column on both grids reads zero and no batter on either side was hit, so HB 0 is carried for every pitcher as card-sourced values and the hit batter check runs on real data. Wild pitches: one, Kaat in the Bottom 5, on Goslin&#x27;s strikeout, with the batter thrown out at first and no runner on base. Passed balls: none. Sacrifices: none. Gaetti&#x27;s Bottom 2 bunt popped up to the catcher, an out with no advance, and Alonso&#x27;s Top 4 fly is counted as an at-bat on the card rather than a sacrifice fly, so the split lines read SH 0 and SF 0 for every batter, log-proven. Stolen bases: none; the printed SB and CS columns are 0 for both clubs, and the one send, Lindor in the Top 8, was a held runner. Double plays grounded into, counted from the play log: two, Killebrew in the Bottom 3 for Minnesota and Lindor in the Top 5 for New York, exactly as the card extras read. Substitutions: New York made one. John Olerud pinch-hit for Alonso in the Top 9 and grounded out to second, carrying the printed line AB 1; the walk in the seventh belonged to Alonso himself, whose printed line is AB 2, BB 1. Minnesota made no substitutions; its starting nine played the whole game and Earl Battey did not appear. Batters faced are counted from the play log and tie to the batting PA totals both ways (New York 34 PA against 34 Minnesota BF: Kaat 31, Nathan 3; Minnesota 37 PA against 37 New York BF: Leiter 26, Orosco 4, McGraw 7). New York PA is AB 30 plus BB 4; Minnesota PA is AB 33 plus BB 4. Seven decisions were graded. Tom Kelly made 2, and both paid off: the Bottom 7 hit and run at +2.39, the game&#x27;s best grade, Carew&#x27;s single putting runners at first and third ahead of the three-run inning, and the Top 9 change to Nathan at +0.73. Davey Johnson made 5 (1 paid off, 3 backfired, 1 neutral): leaving the fatigued Leiter in for the Bottom 6 paid off at +0.73; the Bottom 7 change to Orosco backfired at -2.77, the game&#x27;s worst grade, three runs scoring in the inning; the change to McGraw behind him was neutral at +0.00; the Top 8 steal send backfired at -0.86, Lindor held at first; and the Top 9 Olerud pinch hitter backfired at -0.50. Managers: Tom Kelly (Minnesota) and Davey Johnson (New York). Venue is Target Field. Availability compliance: Viola (19 outs in Game 4) and Koosman (22 outs in Game 4) were unavailable under the house convention and correctly did not pitch. Each club started its rotation number 5, Kaat for Minnesota and Leiter for New York. The series is complete, so no next-game availability applies. Minnesota wins the series 4-1 and advances on the winners side; New York drops to the losers side at 0-1 in series and is not eliminated. Series runs: Minnesota 20, New York 15.">
