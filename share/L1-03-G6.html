  <title>L1-03-G6: Philadelphia Athletics 16, Tampa Bay Rays 6</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 3, Game 6 at Tropicana Field, as the graded log prints the venue. #17 Philadelphia Athletics (manager Connie Mack) against #30 Tampa Bay Rays (manager Kevin Cash), home pattern Philadelphia for Games 1, 2, 5 and 7, Tampa Bay for Games 3, 4 and 6. Both clubs carry one series loss, so the loser of the series is eliminated and the winner advances to Losers Round 2; Philadelphia came in leading three games to two, and Tampa Bay faced elimination for the second straight game. Booked from the full app export set, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the standalone plays JSON, the Gazette scorecard PDF, the scorecard photos, the graded play-by-play log for the graded decisions, and the app&#x27;s series summary file. The CSV&#x27;s PLAYS (JSON) section and the standalone plays JSON carry the same 100 play rows. All sources agree on every figure booked. Decisions: Lefty Grove takes the win (6.1 IP, 28 BF, 7 H, 6 R, 6 ER, 3 BB, 7 SO, 3 HR): he took the lead for good in the top of the 3rd and left in the bottom of the 7th after B.J. Upton&#x27;s two-run home run cut the score to 13-6, still a seven-run lead. David Price takes the loss (3.2 IP, 19 BF, 7 H, 7 R, 7 ER, 1 BB, 5 SO). The top-of-the-4th run charges, verified batter by batter from the log: Price is charged with four of the five runs (Baker doubled and scored on Valo&#x27;s single; Joost walked and scored on Collins&#x27;s single; and the two runners Price left, Valo and Collins, both scored on Cochrane&#x27;s three-run home run off Adam), and Jason Adam is charged with two runs in the game (Cochrane&#x27;s own run on that home run, and Bob Johnson&#x27;s run in the top of the 5th, when Johnson singled and scored on Baker&#x27;s double on the hit-and-run). No save: Joe Berry entered in the bottom of the 7th with Philadelphia ahead 13-6, a seven-run lead, and finished the game (2.2 IP, 9 BF, 1 H, 0 R, 0 BB, 2 SO). Scoring: Tampa Bay struck first in the bottom of the 2nd, Brandon Lowe&#x27;s solo home run off Grove. Philadelphia answered with three in the 3rd off Price (Moses double, Joost sacrifice bunt, Valo RBI single, Collins&#x27;s double on the hit-and-run scoring Valo, and Cochrane&#x27;s single scoring Collins), five in the 4th (Baker double, Joost walk, Valo&#x27;s RBI single and Collins&#x27;s RBI single off Price, then Adam relieved and Cochrane hit a three-run home run), one in the 5th off Adam (Johnson single, Baker&#x27;s double on the hit-and-run), and four in the 6th off Jake McGee (Valo single, Collins walk, Simmons single, Foxx RBI single, Johnson two-run single, and Baker&#x27;s forceout scoring Foxx). Tampa Bay answered with three in the 5th (Arozarena single, Hall walk, Upton three-run home run off Grove) and two in the 7th (Hall walk, Upton two-run home run off Grove, Upton&#x27;s second home run of the game). Philadelphia closed the scoring with three in the 8th off Blake Snell (Foxx walk, Johnson forceout, Baker single, Joost walk, Valo bases-loaded walk, Collins two-run single). Each club&#x27;s RBI total equals its run total (PHA 16, TB 6). The game was errorless, neither club turned a double play, and there were no GIDP; the game&#x27;s only stolen-base attempt was Upton&#x27;s in the bottom of the 1st, and Cochrane threw him out (Cochrane assist, Collins putout). Fielding from the CSV&#x27;s printed fielding section: Philadelphia 27 putouts and 7 assists; Tampa Bay 27 putouts and 8 assists; no wild pitches and no passed balls for either club. Counting checks: Philadelphia plate appearances 52 (46 AB, 5 BB, 1 SH) equal Tampa Bay&#x27;s 52 batters faced (Price 19, Adam 7, McGee 7, Hernandez 6, Snell 13); Tampa Bay plate appearances 37 (34 AB, 3 BB) equal Philadelphia&#x27;s 37 batters faced (Grove 28, Berry 9). Hit, walk and strikeout totals tie across the two boxes both ways. Manager grades: Connie Mack graded 4 decisions and all 4 paid off: hit and runs 3 (top of the 3rd, +1.74; top of the 5th, +0.74; top of the 6th, +2.31) and the pitching change to Berry in the bottom of the 7th (+0.50). Kevin Cash graded 13 decisions (3 paid off, 7 backfired, 3 neutral): the steal in the bottom of the 1st backfired (Upton caught stealing, -1.11); pitching changes 4, one paid off and three backfired (Adam in the top of the 4th backfired, -2.77; McGee in the top of the 6th backfired, -3.77; Hernandez in the top of the 6th paid off, +0.47; Snell in the top of the 8th backfired, -2.77); leaving the pitcher in 4, two paid off and two neutral (Adam in the top of the 5th paid off, +0.91; McGee in the top of the 6th neutral, -0.12; Snell in the top of the 8th paid off, +0.73; Snell in the top of the 9th neutral, +0.23); and pinch hitters 4, three backfired and one neutral (Huff in the bottom of the 7th backfired, -0.50; Wendle in the bottom of the 7th backfired, -0.35; Crawford in the bottom of the 9th neutral, -0.00; Kiermaier in the bottom of the 9th backfired, -0.47). Availability compliance for this game, checked against Game 5 usage under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Game 5 made Jack Coombs (24 outs), Pete Fairbanks (12 outs) and Scott Kazmir (10 outs) unavailable for Game 6, and none of them pitched (Grove and Price started). Bobby Shantz (7 outs) was capped at 3 outs and did not appear, so the cap was never tested. Hernandez (3 outs in Game 5) was free and pitched legally; Berry did not pitch in Game 5 and was free. The win closes the series: Philadelphia takes it four games to two and advances to Losers Round 2, and Tampa Bay, with its second series loss, is eliminated. Series MVP is Joe&#x27;s to rule; no MVP is booked with this game. Managers: Connie Mack (Philadelphia) and Kevin Cash (Tampa Bay). Venue is Tropicana Field, as printed.">
