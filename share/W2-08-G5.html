  <title>W2-08-G5: Cincinnati Reds 2, Pittsburgh Pirates 5</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 8, Game 5 at PNC Park. Booked from the series master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Pittsburgh beat Cincinnati 5-2 to win the series 4-1 and advance on the winners side; Cincinnati drops to Losers Round 2 with its first series loss and is not eliminated. Decisions: Bob Friend takes the win for Pittsburgh (7.0 IP, 27 BF, 4 H, 1 R, 1 ER, 3 BB, 6 SO, 1 WP). Jim Maloney takes the loss for Cincinnati (5.1 IP, 21 BF, 5 H, 2 R, 2 ER, 1 BB, 4 SO, 1 HR). Mark Melancon earns the save (1.0 IP, 3 BF, 0 H, 0 R, 1 SO), retiring all three batters he faced in the 9th after Grant Jackson gave up Johnny Bench&#x27;s leadoff home run and recorded no outs. Willie Stargell is the export&#x27;s player of the game (2 for 2, a double and a home run, 3 RBI, 1 run, 1 walk, 1 sacrifice fly); the export&#x27;s decisive play is his bottom-of-the-6th sacrifice fly. Scoring: the top of the 2nd, Bench singled, Joey Votto walked, George Foster reached on Honus Wagner&#x27;s error, and Bench scored on Friend&#x27;s wild pitch during Tony Perez&#x27;s strikeout (no RBI on that run, so Cincinnati&#x27;s two runs carry one RBI), 1-0. The bottom of the 6th, Wagner homered off Maloney to tie it, Paul Waner pinch-hit a single, and after Bucky Walters relieved, Barry Bonds singled and Stargell&#x27;s sacrifice fly scored Waner, an inherited runner (Walters IR 1/1), 2-1. The bottom of the 8th, Bonds walked off Walters, Stargell hit a two-run home run, Ralph Kiner and Manny Sanguillen singled, and Tommy Leach singled home Kiner, 5-1; Aroldis Chapman then inherited two runners and stranded both (Chapman IR 2/0), striking out Bill Mazeroski to end the inning. The top of the 9th, Bench homered off Jackson, 5-2, and Melancon closed it. Pitching: Friend started for Pittsburgh and pitched seven; Dave Giusti (1.0 IP, 3 BF, 0 H, 0 R, 1 BB) pitched a scoreless 8th and earns the hold in the export&#x27;s extra list; Jackson took the 9th and gave up the Bench home run without recording an out; Melancon finished. For Cincinnati, Maloney started and left in the 6th; Walters (2.1 IP, 14 BF, 6 H, 3 R, 3 ER, 1 BB, 2 SO, 1 HR) pitched into the 8th; Chapman (0.1 IP, 1 BF, 1 SO) recorded the final out of the 8th. Errors: one per club, Barry Larkin for Cincinnati (bottom of the 1st, Wagner reached and was erased on Andrew McCutchen&#x27;s double play) and Wagner for Pittsburgh (top of the 2nd, Foster reached); every run in the game is charged earned as printed. Double plays: Cincinnati 2 (McCutchen in the bottom of the 1st, Pie Traynor in the bottom of the 5th) and Pittsburgh 1 (Frank Robinson in the top of the 8th); all three are genuine DP-coded rows matching the printed GIDP lines. Stolen bases: Larkin in the top of the 5th, the game&#x27;s only steal; caught stealing: none. The catching line as printed: Sanguillen PB 0, 1 steal attempt against, 1 stolen base, 0 caught stealing. Defensive lines are booked in the established shape from the printed fielding section (Cincinnati 24 putouts and 9 assists, Votto 8 putouts, Morgan 2 putouts and 3 assists with a run-out in the Rec fld row; Pittsburgh 27 putouts and 10 assists, Sanguillen 10 putouts catching, Wagner 6 assists, and Bonds carries the export&#x27;s 2 outfield assists in the fld OFA column). Substitutes: Paul Waner pinch-hit for Roberto Clemente in the bottom of the 6th and stayed in the game; Tommy Leach replaced Traynor at third base in the top of the 8th and singled home a run in the bottom of the 8th; Ted Kluszewski pinch-hit for Perez in the top of the 7th and stayed in the game. Wild pitches: Friend 1 (top of the 2nd, scoring Bench with the game&#x27;s first run). Passed balls: none. Hit by pitch: none. Counting checks: Cincinnati plate appearances 34 (30 AB, 4 BB) equal Pittsburgh&#x27;s 34 batters faced (Friend 27, Giusti 3, Jackson 1, Melancon 3); Pittsburgh plate appearances 36 (32 AB, 2 BB, 1 SH, 1 SF) equal Cincinnati&#x27;s 36 batters faced (Maloney 21, Walters 14, Chapman 1). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Cincinnati&#x27;s two runs carry one RBI (the wild-pitch run has none); Pittsburgh&#x27;s five runs carry five RBIs. Manager grades: the grades list names both managers directly, so no label mapping is needed. Sparky Anderson graded 5 decisions (1 paid off, 2 backfired, 2 neutral): 2 steals (both neutral), 2 pitching changes (1 paid off, 1 backfired) and 1 pinch hitter (backfired, Kluszewski&#x27;s top-of-the-7th groundout). Danny Murtaugh graded 5 decisions (3 paid off, 1 backfired, 1 neutral): 3 pitching changes (1 paid off, 1 backfired, 1 neutral), 1 pinch hitter (paid off, Waner&#x27;s bottom-of-the-6th single) and 1 defensive sub (paid off, Leach). One correction to the booking brief: its prose line read Murtaugh at 2 paid off, 1 backfired, 1 neutral, which sums to four outcomes across his five entries; the export&#x27;s grades list sums to 3 paid off, 1 backfired, 1 neutral, and that is what books. Series graded totals after this game: Murtaugh 34, Anderson 51. Game 4 availability was honored: John Candelaria and Dolf Luque sat, and Noodles Hahn, capped at 3 outs, was not used. The series is complete, so no Game 6 availability applies. Series MVP, under Joe&#x27;s standing rule that the export&#x27;s named MVP is the MVP: Barry Bonds, whose full archive-computed series line is 7 for 19, 3 runs, 2 doubles, 2 home runs, 7 RBIs and a .368 average, verifying the export&#x27;s printed &quot;7-for-19, 2 HR, 7 RBI, 3 R&quot; exactly. The runner-up booked alongside is Willie Stargell (6 for 18, 3 runs, 1 double, 1 home run, 6 RBIs, .333): of the computed candidates his line pairs the winning club&#x27;s second-best RBI total with player-of-the-game honors in this clincher, ahead of Wagner (7 for 23, 7 runs, 2 HR, 4 RBI, .304) and Mazeroski (3 for 15, 1 HR, 1 RBI, .200); Roberto Clemente&#x27;s series-best 10 hits and .667 average came in 15 at bats across a shortened series for him, and Eric Davis drove in a series-high 8 runs for Cincinnati. Pittsburgh advances on the winners side at 8-2 in games and 2-0 in series; Cincinnati drops to Losers Round 2 at 5-7 and 1-1. Winners Round 2 is now complete. Managers: Danny Murtaugh (Pittsburgh) and Sparky Anderson (Cincinnati). Venue is PNC Park, as printed.">
