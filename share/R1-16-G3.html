  <title>R1-16-G3: Houston Astros 4, Philadelphia Athletics 3</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-07: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official R1-16 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Series: Houston Astros (seed 16) vs Philadelphia Athletics (seed 17), home pattern 2-2-1-1-1, Game 3 in Philadelphia. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Joe Sambito takes the win, and the derivation is this: Mike Scott started for Houston but completed only 4.0 innings and was still the pitcher of record when Houston took the lead for good in the Top 5, Altuve&#x27;s two-run single making it 3-2; a starter who does not complete five innings cannot take that win, so the win falls to the relief corps, and Sambito is the scorer&#x27;s choice as the first reliever, the same scorer&#x27;s-choice derivation the book used in R1-11 Game 2. Sambito entered in the Bottom 5 with the lead at 3-2, runners at first and second, and nobody out, the highest-leverage spot any Houston reliever faced all game, and he got Baker to ground into a 6-4-3 double play and Moses to line out to second, a scoreless inning (1.0 IP, 0 H, 0 R, 0 BB, 0 SO) that held the lead at the moment it was most at risk; Lidge, Pressly, Smith, Wagner, and Richard each protected a lead Sambito handed down the line, and none has a stronger claim. Rube Waddell takes the loss: all four Houston runs are charged to him on the card (7.0 IP, 6 H, 4 R, 4 ER, 4 BB, 1 HBP, 4 SO, 1 HR), and Philadelphia never caught up after the Top 5. J.R. Richard takes the save: Billy Wagner opened the Bottom 9 with the lead at 4-3 and got Collins to ground out, then walked Cochrane, and Simmons bunted Cochrane, the tying run, to second; Richard then entered with two out, the tying run on second base, and the potential winning run, Foxx, at the plate, and got Foxx to ground out to short for the final out. A reliever who enters with the tying run on base, at the plate, or on deck and finishes the game with the lead intact earns the save, and Richard meets that prong exactly (0.1 IP, 0 H, 0 R). Wagner, who did not finish, takes no save. Run charges match the printed lines exactly: Philadelphia pitching allows 4, all to Waddell, with Joe Berry scoreless in relief (2.0 IP, 0 H, 0 R, 2 BB, 0 HBP, 3 SO), and Houston pitching allows 3 (Scott 2, Smith 1, and Sambito, Lidge, Pressly, Wagner, and Richard none). The Top 8 Houston run settles from the card and the log together: Bagwell walked off Waddell to open the inning and Altuve doubled him to third, still off Waddell; Berry then came in, struck out Berkman, walked Bregman to load the bases, got Correa to fly out, and walked Cruz, forcing Bagwell home. A runner is charged to the pitcher who put him on, so the run sits on Waddell&#x27;s line even though it scored on Berry&#x27;s walk, which is how the card prints Waddell with all four runs and Berry with none. The duplicate test ran before the number was assigned: the stored series games (Philadelphia 6, Houston 3 in Game 1, and Houston 8, Philadelphia 7 in 11 innings in Game 2) differ in score and linescore, so this box score is no duplicate and takes the next unplayed number, Game 3. The game: Philadelphia scored first in the Bottom 2, Johnson hit by a Scott pitch, Baker forcing Johnson at second, Moses singling Baker to third, and Joost singling Baker home. Alvarez tied it in the Top 3 with a solo home run off Waddell. Philadelphia went back ahead in the Bottom 3, Cochrane doubling and scoring on Foxx&#x27;s single. Houston took the lead for good in the Top 5: Cruz popped out, Cedeño singled, Biggio was hit by a pitch, Alvarez forced Biggio at second with Cedeño taking third, Bagwell walked to load the bases, and Altuve singled both Cedeño and Alvarez home to make it 3-2. Scott started the Bottom 5 and gave up a Foxx single and a Johnson walk before Hinch went to Sambito, who escaped on the double play and the lineout. Lidge struck out two in a clean Bottom 6 and Pressly was clean in the Bottom 7. The Top 8 produced the insurance run described above. Smith gave one back in the Bottom 8, Johnson&#x27;s solo home run closing it to 4-3, and Moses walked before Joost struck out and Fain grounded out. Berry struck out Biggio and Alvarez in a clean Top 9. In the Bottom 9, Wagner got Collins, walked Cochrane, and left after Simmons&#x27;s sacrifice bunt moved the tying run to second; Richard got Foxx on one pitch sequence, a groundout to short, to end it. Philadelphia stranded 10 and Houston 8. Home runs: two, Alvarez for Houston in the Top 3 off Waddell, a solo shot that was his only hit of the game though he scored twice, and Johnson for Philadelphia in the Bottom 8 off Smith, also solo. Doubles: two, Altuve for Houston in the Top 8 and Cochrane for Philadelphia in the Bottom 3. Triples: none. Errors: none on either side. Hit batters: two, Johnson hit by Scott in the Bottom 2 and Biggio hit by Waddell in the Top 5; HB 1 for Scott and HB 1 for Waddell and HBP 1 for Johnson and HBP 1 for Biggio are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: one bunt and no sacrifice flies, Simmons in the Bottom 9, the split lines reading SH 1 for Simmons and SH 0 and SF 0 for every other batter; the SH column is written as the card&#x27;s SAC line split, and SF 0 for every batter because no sacrifice fly appears in the log. Stolen bases: one, Moses stole third in the Bottom 4. Caught stealing: none. Double plays grounded into: one for each club, Cruz for Houston in the Top 6 (5-4-3) and Baker for Philadelphia in the Bottom 5 (6-4-3), the stored lines reading GIDP 1 for each and GIDP 0 for every other batter; Bregman&#x27;s Top 2 forceout, Alvarez&#x27;s Top 5 forceout, and Baker&#x27;s Bottom 2 forceout are at-bats with the batter reaching, not double plays and not sacrifices. Substitutions: none with plate appearances; the Gazette prints nine batting lines for each club, and Philadelphia used two pitchers and Houston seven. The Athletics exist in this tournament as two clubs, Oakland (OAK) and Philadelphia (PHA); every Philadelphia line in this game sits under PHA keys and nothing merges with Oakland. Plate appearances counted fresh from the printed batting lines and the play log enumeration, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Houston PA is AB 32 plus BB 6 plus HBP 1, which is 39, and the outs plus runs plus stranded identity agrees (27 outs plus 4 runs plus 8 stranded is 39); Philadelphia PA is AB 33 plus BB 5 plus HBP 1 plus SH 1, which is 40, and the identity agrees (27 outs plus 3 runs plus 10 stranded is 40). Batters faced tie to those totals: Houston 39 PA against 39 Philadelphia BF (Waddell 31, Berry 8), and Philadelphia 40 PA against 40 Houston BF (Scott 23, Sambito 2, Lidge 3, Pressly 3, Smith 5, Wagner 3, Richard 1). Strikeouts tie both ways: Houston batting 7 against Philadelphia pitching 7 (Waddell 4, Berry 3), and Philadelphia batting 7 against Houston pitching 7 (Scott 3, Lidge 2, Pressly 1, Smith 1). Printed RBI: Houston 4 for 4 (Altuve 2, Alvarez 1, Cruz 1) and Philadelphia 3 for 3 (Joost 1, Foxx 1, Johnson 1). Availability: Plank (26 outs in Game 2) was unavailable for Philadelphia and Oswalt (13 outs in Game 2) was unavailable for Houston, and neither pitched; every other Game 2 pitcher was free except one. Joe Berry threw 6 outs in Game 2, so under the house convention he was capped at 3 outs for this game; he recorded 6 outs here, a scoreless 2.0 innings. The game stands exactly as played and nothing is adjusted, following the R1-10 Game 2 Gagne precedent: the note is recorded here as provenance only. Nine decisions were graded. A.J. Hinch made 6 (5 paid off, 1 backfired, 0 neutral), all pitching changes: to Sambito in the Bottom 5 paid off at +1.69, the game&#x27;s best grade, to Lidge in the Bottom 6 paid off at +0.73, to Pressly in the Bottom 7 paid off at +0.73, to Wagner in the Bottom 9 paid off at +0.73, to Richard in the Bottom 9 paid off at +0.57, and to Smith in the Bottom 8 backfired at -0.77, Johnson homering off Smith as the next batter. Connie Mack made 3 (1 paid off, 2 backfired, 0 neutral): the Bottom 2 hit and run backfired at -1.13, Fain flying out to right with runners at first and second, the Bottom 4 hit and run backfired at -1.13, Collins striking out on the play, and the Top 8 pitching change to Berry paid off at +1.21, one run scoring on the walk against 1.96 expected with runners at second and third and nobody out. Managers: A.J. Hinch (Houston) and Connie Mack (Philadelphia). Venue is Philadelphia; the graded play log&#x27;s header names Shibe Park, but the archive carries no park name for the Athletics&#x27; home games, so this game, like Games 4 and 6 of this series, is recorded as Philadelphia, city only. Houston leads the series 2-1.">
