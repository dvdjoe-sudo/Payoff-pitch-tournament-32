top of the 2nd made it 3-0; Gary Carter&#x27;s solo home run in the bottom of the 2nd cut it to 3-1. The top of the 3rd made it 5-1 on Mathews&#x27;s single and Crandall&#x27;s two-run home run. Montreal&#x27;s bottom of the 3rd run was unearned: Tim Wallach reached on a one-base error by center fielder Andruw Jones (play row seq 24, coded E8, the row&#x27;s own steps printing the error check and &quot;Error, CF Jones&quot;), moved around on Tim Raines&#x27;s single and a flyout, and scored on Rusty Staub&#x27;s single to center (seq 28, runs 1, rbi 1, the row&#x27;s steps printing &quot;Tim Wallach scores (unearned)&quot;), 5-2; the run is charged to Spahn as unearned, which is why his printed line is 6 R and 5 ER and Atlanta&#x27;s staff totals 6 ER against Montreal&#x27;s 7 runs, while Montreal&#x27;s staff totals 10 ER against Atlanta&#x27;s 10 runs. The top of the 4th made it 6-2, Jones walking, Acuna singling and Mathews singling Jones home; Martinez left there and McGaffigan stranded the two inherited runners. Freddie Freeman scored Atlanta&#x27;s seventh run in the top of the 5th on Rabbit Maranville&#x27;s single, 7-2. Carter&#x27;s second solo home run, in the bottom of the 6th, made it 7-3. The top of the 8th put it away: Maranville and Jones singled and Mathews hit a three-run home run off Fryman (seq 70), 10-3. Montreal&#x27;s bottom of the 8th scored three: Rusty Staub walked, Vladimir Guerrero singled, Carter&#x27;s fielder&#x27;s choice forced Staub at second, Andre Dawson tripled both runners home, and Wallach&#x27;s sacrifice fly scored Dawson, 10-6. The bottom of the 9th added one, Raines singling, Jose Vidro&#x27;s hit-and-run single sending him to third and Staub&#x27;s forceout at second scoring him, before Garber closed it, 10-7. The extra list, exactly as printed: inherited runners for Andy McGaffigan, 2 inherited and 0 scored (he entered in the top of the 4th with runners at first and third and got Crandall on a flyout to center). No holds and no blown saves: Fryman and Vazquez entered with four-run and four-run leads respectively, and Garber entered the 9th up four. Errors: one, Andruw Jones&#x27;s bottom of the 3rd error (E8), confirmed by the play rows&#x27; rebuilt error count (ATL 1 / MON 0) and by the error&#x27;s appearance in Atlanta&#x27;s printed fielding section, the batting CSV&#x27;s E column and the Rec fld array alike; Montreal was errorless. Double plays: one, Del Crandall&#x27;s top of the 6th grounder to short (row seq 52, coded &quot;DP 6-4-3&quot;), matching Crandall&#x27;s printed GIDP 1 and Montreal&#x27;s printed team DP 1 (Ron Fairly, Orlando Cabrera and Jose Vidro each carry DP 1 in the fielding section as the chain&#x27;s fielders), so no GIDP-practice divergence arises. Stolen bases: none attempted by either club; caught stealing: none. The catching lines as printed: Del Crandall, PB 0 and nothing against for Atlanta; Gary Carter, PB 0 and nothing against for Montreal. Defensive lines are booked in the established shape from the printed fielding section (Atlanta 27 putouts and 8 assists: Andruw Jones 9 putouts in center with the game&#x27;s only error, Crandall 6 putouts catching, Freeman 6 putouts and 1 assist at first, Murphy 3 putouts, Maranville 1 putout and 4 assists, Albies 1 putout and 1 assist, Mathews 1 assist, Spahn 1 assist, Acuna 1 putout; Montreal 27 putouts and 8 assists with DP 1: Fairly 10 putouts at first with DP 1, Dawson 5 putouts, Carter 5 putouts catching, Cabrera 3 putouts and 4 assists with DP 1, Vidro 1 putout and 2 assists with DP 1, Raines 2 putouts, Staub 1 putout, Wallach 1 assist, Martinez 1 assist). Substitutes: none for either club; all 18 starters batted and no bench player appeared. Wild pitches: none. Passed balls: none. Hit by pitch: none. Counting checks: Atlanta plate appearances 45 (41 AB, 4 BB) equal Montreal&#x27;s 45 batters faced (Martinez 22, McGaffigan 10, Fryman 10, Vazquez 3); Montreal plate appearances 42 (37 AB, 4 BB, 1 SF) equal Atlanta&#x27;s 42 batters faced (Spahn 36, Garber 6). Hit, walk, home run and strikeout totals tie across the two boxes both ways (Atlanta batting strikeouts 5 = Martinez 2 + McGaffigan 1 + Fryman 1 + Vazquez 1; Montreal batting strikeouts 6, all off Spahn; Atlanta home runs 3 = Martinez 2 + Fryman 1; Montreal home runs 2, both Carter&#x27;s, both off Spahn). Team RBI equals team runs both ways (Atlanta 10, Montreal 7). Manager grades: the grades list names both managers directly, so no label mapping is needed. Dick Williams graded 7 decisions (5 paid off, 1 backfired, 1 neutral): 3 pitching changes (all paid off: McGaffigan for the 4th, Fryman for the 7th, Vazquez for the 9th), 3 hit and runs (1 paid off, Vidro&#x27;s 9th-inning single; 1 backfired, Carter&#x27;s 9th-inning flyout; 1 neutral, Cabrera&#x27;s 3rd-inning flyout) and 1 left-pitcher-in (paid off, Fryman was left in after Mathews&#x27;s three-run home run in the top of the 8th and the next batter, Crandall, flied out). Bobby Cox graded 2 decisions (0 paid off, 2 backfired): 1 left-pitcher-in (backfired, Spahn stayed in for the bottom of the 8th and Montreal scored three) and 1 pitching change (backfired, Garber for the 9th; the immediate batter singled and Montreal scored once, though the game was never tied). Availability: Game 2&#x27;s unavailable pair, Pedro Martinez (18 outs) and Kid Nichols (23 outs), appear nowhere in this game, and the Rec&#x27;s own unavailable block lists both (alongside rest and house-rule entries for Maddux, Rogers, Glavine and Niekro). One availability note is recorded factually: Woodie Fryman threw 6 outs in Game 2, which under the standing availability convention (SERIES_PLAY_SPEC.md: 6 to 8 outs caps the pitcher at 3 outs the next game) capped him at 3 outs for this game; he recorded 6 outs here, the top of the 7th and the top of the 8th, including Mathews&#x27;s three-run home run. The game is booked exactly as played, the same treatment as the W2-05 Andrew Miller cap item; the app does not hard-enforce the cap, and the Rec&#x27;s unavailable block does not list Fryman. Game 4 availability, from this game&#x27;s outs: Warren Spahn (24 outs) and Dennis Martinez (11 outs) both threw 9 or more outs and are unavailable for Game 4; Andy McGaffigan (7 outs) and Woodie Fryman (6 outs) are each capped at 3 outs; Gene Garber (3 outs) and Javier Vazquez (3 outs) are free. Montreal leads the series 2-1 and stands 7-7 in games and 1-1 in series; Atlanta stands 8-6 in games and 1-1 in series. The loser of this series is eliminated. Managers: Dick Williams (Montreal) and Bobby Cox (Atlanta). Venue is Olympic Stadium, printed &quot;OLYMPIC STADIUM (neutral)&quot; in the box header and the Rec alike.">
