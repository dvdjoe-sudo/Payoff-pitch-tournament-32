  <title>R1-11-G3: Philadelphia Phillies 2, Oakland Athletics 3</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-02: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-11 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Oakland Athletics (seed 22) vs Philadelphia Phillies (seed 11), home pattern 2-2-1-1-1, Game 3 at RingCentral Coliseum in Oakland, the first game of the series in Oakland, and Oakland leads the series 3-0 with this win. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number, with no run-accounting knot and no settlement needed. The decisions are not printed; they are derived from the play log and the run charges on the card. Rollie Fingers takes the win, and Dave Stewart does not: Stewart (6.0 IP, 9 H, 1 ER, 0 BB, 2 SO) left after the Top 6 with Oakland trailing 1-0. Oakland tied the game in the Bottom 6 on Ellis&#x27;s double and Henderson&#x27;s single while Stewart was still the pitcher of record, but a tie is not a lead, so Stewart cannot take the win. Liam Hendriks opened the Top 7 and recorded two outs (Daulton&#x27;s groundout and, after Rollins&#x27;s single, Ashburn&#x27;s sacrifice bunt), and Fingers came in and got the last out of the Top 7, Abreu&#x27;s fly out, so Fingers was Oakland&#x27;s pitcher of record when the two go-ahead runs scored in the Bottom 7, a lead Oakland never lost. Grover Cleveland Alexander takes the loss: he threw a complete game (8.0 IP, 7 H, 3 ER, 2 BB, 6 SO, HB 1) and the go-ahead runs came off him in the Bottom 7. Dennis Eckersley takes the save: he entered the Top 9 with a one-run lead, 3-2, bases empty, pitched the full inning, and closed it, striking out Ashburn and Klein around singles by Rollins and Abreu. Run charges match the printed lines exactly: Oakland pitching allows 1 + 0 + 1 + 0 = 2 (Stewart one, Hendriks none, Fingers one, Eckersley none), and Philadelphia pitching allows Alexander&#x27;s three. The charge detail: Stewart&#x27;s one is Daulton in the Top 5 (doubled and scored on Rollins&#x27;s single). Fingers&#x27;s one is Klein in the Top 8 (walked, bunted to second by Harper, and scored on Howard&#x27;s single). Alexander&#x27;s three are Ellis in the Bottom 6 (doubled and scored on Henderson&#x27;s single) and Campaneris and Murphy in the Bottom 7 (Campaneris pinch-ran for Tejada after Tejada&#x27;s forceout and scored on Steinbach&#x27;s single after Murphy&#x27;s walk; Murphy scored on Henderson&#x27;s second RBI single). Printed RBI ties as printed with no settlement: Philadelphia 2 (Rollins 1, Howard 1) against 2 runs, and Oakland 3 (Henderson 2, Steinbach 1) against 3 runs. The duplicate test ran before the number was assigned: the stored R1-11 games are Game 1 (Oakland 11, Philadelphia 5) and Game 2 (Oakland 15, Philadelphia 11), neither sharing this game&#x27;s final score or linescore, so this box score is no duplicate, and this is the third game of the series in play order, booked as Game 3. The game: a pitchers&#x27; duel after two slugfests. Stewart and Alexander matched zeros through four innings while Philadelphia kept wasting chances, thirteen hits and ten left on base on the day. Philadelphia broke through in the Top 5: Daulton doubled and Rollins&#x27;s long single scored him, but Manuel&#x27;s hit and run on the next batter turned into Ashburn&#x27;s double play and killed the rally. Oakland tied it in the Bottom 6: Ellis doubled and Henderson&#x27;s sharp single to center scored him; Williams sent Henderson twice that inning and he was held both times, and McGwire&#x27;s double play ended the inning at 1-1. In the Top 7, Hendriks got Daulton, Rollins singled, and Ashburn bunted him to second, and Fingers came in and retired Abreu, pinch-hitting for Callison, on a fly to left. Oakland won it in the Bottom 7: Alexander hit Canseco, Tejada forced Canseco at second, Campaneris pinch-ran for Tejada and came around on Steinbach&#x27;s single after Murphy walked, and Henderson&#x27;s second single of the game scored Murphy for 3-1. Philadelphia got one back in the Top 8 off Fingers: Klein walked, Harper bunted him to second, and Howard singled him home, but Utley&#x27;s strikeout ended the inning at 3-2. Eckersley closed the Top 9: Daulton flied out, Rollins singled, Ashburn struck out, Abreu singled to put runners at first and third, and Klein struck out to end the game. Home runs: none by either club, the first homerless game of the series after eleven in the first two games. Doubles: Daulton for Philadelphia and Henderson, McGwire and Ellis for Oakland; no triples. Errors: none by either club. Hit batters: one, Canseco, hit by Alexander in the Bottom 7 (the card prints HBP by: Grover Cleveland Alexander 1, and Alexander&#x27;s pitching line carries HB 1); every Oakland pitcher&#x27;s HBP column on the grid reads zero and no Philadelphia batter was hit, so the hit batter check runs on real data. Wild pitches: none. Sacrifices: Philadelphia&#x27;s three runs of offense ran through the bunt, one sacrifice each for Ashburn (Top 7), Klein (Top 3) and Harper (Top 8), all bunts; there was no sacrifice fly on either side, so the split lines read SH 1 for those three and SH 0 and SF 0 for every other batter, log-proven. Oakland had no sacrifice of either kind. Stolen bases: none; no runner attempted one. Henderson was sent twice in the Bottom 6 and Klein once in the Top 8, and all three sends ended with the runner held for a bad jump, not attempts, exactly as the card records them. Caught stealing: none. Double plays grounded into, counted from the play log: four, two by each club. For Philadelphia, Utley in the Top 2 (6-4-3) and Ashburn in the Top 5, whose ground ball on Manuel&#x27;s hit and run became the double play that ended the rally; the Gazette extras line names only Utley for Philadelphia, and the log proves Ashburn&#x27;s as well, so both are carried. For Oakland, McGwire in the Bottom 6 (5-4-3) and Olson in the Bottom 8 (6-4-3), exactly as the card extras read. Substitutions: Philadelphia made one, Bobby Abreu pinch-hit for Callison in the Top 7 (flied out), stayed in right field, and singled in the Top 9 (1 for 2); Daulton caught with Ruiz rested and went 2 for 4 with the double and Philadelphia&#x27;s first run, and Ashburn led off and played center field, going 0 for 4 with the sacrifice and the double play. Oakland made two: Bert Campaneris pinch-ran for Tejada in the Bottom 7, scored the go-ahead run, and stayed in at shortstop, carrying the printed line AB 0, R 1; and Matt Olson replaced McGwire at first base for the Top 8 as a defensive substitution and grounded into a double play in the Bottom 8 (0 for 1). Eric Chavez started at third base with Bando rested and went 0 for 4. Batters faced are counted from the play log and tie to the batting PA totals both ways (Philadelphia 39 PA against 39 Oakland BF: Stewart 25, Hendriks 3, Fingers 6, Eckersley 5; Oakland 32 PA against 32 BF for Alexander, who faced every Oakland batter). Philadelphia PA is AB 35 plus BB 1 plus the three sacrifice bunts; Oakland PA is AB 29 plus BB 2 plus Canseco&#x27;s hit by pitch. Ten decisions were graded. Dick Williams made 7 (4 paid off, 3 backfired, 0 neutral): all three pitching changes paid off, the change to Hendriks for the Top 7 at +0.73, the change to Fingers at +0.57, and the change to Eckersley for the Top 9 at +0.73, and the Campaneris pinch runner in the Bottom 7 paid off at +1.74, the game&#x27;s best single grade; his backfires were the two Bottom 6 steal sends behind Henderson, at -0.86 and -0.51 with the runner held both times, and the Olson defensive substitution at -0.52, graded on the Top 8 run scored behind it. Charlie Manuel made 3 (0 paid off, 2 backfired, 1 neutral): the Top 5 hit and run backfired at -1.11, the game&#x27;s worst single grade, turning a first-and-second start into a double play, and the Abreu pinch hitter in the Top 7 backfired at -0.57; his Top 8 steal send with Klein was neutral at +0.14, the runner held. Managers: Dick Williams (Oakland) and Charlie Manuel (Philadelphia). Venue is RingCentral Coliseum. Availability compliance: Blue (12 outs in Game 2) and Roberts (12 outs) were unavailable under the house convention and correctly did not pitch, and Reed (7 outs in Game 2) was capped at 3 outs and was not used. Game 4 availability, under the house convention that reads only this game: Stewart (18 outs) and Alexander (24 outs) are both UNAVAILABLE, and Fingers (4 outs), Eckersley (3) and Hendriks (2) are all free; no Philadelphia reliever appeared, so the whole Philadelphia bullpen is rested for Game 4. Both clubs started their rotation number 3, Stewart for Oakland and Alexander for Philadelphia; the rotations turn to the number 4 starters for Game 4, again in Oakland.">
