  <title>W2-08-G3: Pittsburgh Pirates 5, Cincinnati Reds 4</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 8, Game 3 at Great American Ball Park. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Pittsburgh beat Cincinnati 5-4 to lead the series 3-0. Decisions: Babe Adams takes the win for Pittsburgh (8.0 IP, 31 BF, 7 H, 4 R, 4 ER, 1 BB, 5 SO, 1 HR), carrying a 5-4 lead into the ninth. Jose Rijo takes the loss for Cincinnati (3.0 IP, 17 BF, 7 H, 4 R, 4 ER, 2 BB, 2 SO, 1 HR): Pittsburgh scored four of its five runs off him in the first three innings. Roy Face earns the save (1.0 IP, 5 BF, 1 H, 0 R, 0 ER, 1 BB): he walked Joey Votto to open the bottom of the 9th and, after George Foster&#x27;s flyout and Ted Kluszewski&#x27;s single put the tying run at second and the winning run at first, got Eric Davis to pop out to third and Barry Larkin to fly out to center. Bill Mazeroski is the export&#x27;s player of the game (2 for 3, a double and a home run, 1 RBI, 1 walk, 1 run). Scoring: the top of the 1st, Honus Wagner led off the game with a home run off Rijo, 1-0. The bottom of the 1st, Joe Morgan and Frank Robinson singled and Johnny Bench&#x27;s sacrifice fly scored Morgan, 1-1. The top of the 3rd, Wagner and Andrew McCutchen singled and Roberto Clemente singled Wagner home (the export&#x27;s decisive play); Willie Stargell&#x27;s single drove in McCutchen and, after Ralph Kiner&#x27;s walk, Manny Sanguillen walked with the bases loaded to force in Clemente, 4-1. The bottom of the 3rd, Larkin doubled and Morgan singled him home, 4-2, before Bench grounded into a double play. The top of the 4th, Mazeroski homered off John Franco, 5-2. The bottom of the 5th, Davis singled off Adams, stole second, moved up on Larkin&#x27;s groundout and scored on Pete Rose&#x27;s groundout (the run on a groundout, the RBI credited to Rose as printed), 5-3. The bottom of the 8th, Robinson homered off Adams, 5-4. Pitching: Adams started and won for Pittsburgh; Face pitched the 9th. For Cincinnati, Rijo started; Franco (1.0 IP, 4 BF, 1 H, 1 ER, 1 HR) pitched the 4th; Francisco Cordero (1.0 IP, 4 BF, 1 H, 0 R, 1 SO, 1 WP) the 5th; Rob Dibble (1.0 IP, 5 BF, 1 H, 0 R, 1 BB, 2 SO) the 6th; Clay Carroll (1.0 IP, 3 BF, 0 H, 1 SO) the 7th; Aroldis Chapman (2.0 IP, 9 BF, 1 H, 0 R, 2 BB, 2 SO) the 8th and 9th. Errors: none; the game was errorless. Double plays: Pittsburgh 1 (Bench in the bottom of the 3rd) and Cincinnati 0. Stolen bases: Davis in the bottom of the 5th, the game&#x27;s only steal; caught stealing: none. The catching line as printed: Sanguillen PB 0, 1 steal attempt against, 1 stolen base, 0 caught stealing; Bench&#x27;s catching line is all zeros. Frank Robinson carries the game&#x27;s one outfield assist. Defensive lines are booked in the established shape from the printed fielding section (Pittsburgh 27 putouts and 13 assists, Stargell 14 putouts, Mazeroski 8 assists; Cincinnati 27 putouts and 12 assists, Votto 12 putouts, Larkin 6 assists). Substitutes: Paul Waner pinch-hit for Clemente in the top of the 6th and stayed in right field; Tommy Leach replaced Pie Traynor at third base for defense in the bottom of the 8th and took Davis&#x27;s pop-up in the 9th; Kluszewski pinch-hit for Perez (the DH) in the bottom of the 7th; Edd Roush pinch-ran for Kluszewski in the bottom of the 9th. Neither Leach nor Roush carries a batting line in the export, and they book exactly as printed. Wild pitches: Cordero 1 (top of the 5th, cost nothing). Passed balls: none. Hit by pitch: none. Counting checks: Pittsburgh plate appearances 42 (37 AB, 5 BB) equal Cincinnati&#x27;s 42 batters faced (Rijo 17, Franco 4, Cordero 4, Dibble 5, Carroll 3, Chapman 9); Cincinnati plate appearances 36 (33 AB, 2 BB, 1 SF) equal Pittsburgh&#x27;s 36 batters faced (Adams 31, Face 5). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Pittsburgh&#x27;s five runs carry five RBIs; Cincinnati&#x27;s four runs carry four RBIs. Manager grades: the grades list names both managers directly, so no label mapping is needed. Sparky Anderson graded 11 decisions (6 paid off, 5 backfired): 5 pitching changes (4 paid off, 1 backfired), 4 steals (2 paid off, 2 backfired), 1 pinch hitter (backfired, Kluszewski&#x27;s bottom-of-the-7th groundout; he singled later in the 9th) and 1 pinch runner (backfired, Roush stranded in the 9th). Danny Murtaugh graded 4 decisions (1 paid off, 2 backfired, 1 neutral): 1 steal (paid off), 1 pinch hitter (backfired, Waner&#x27;s top-of-the-6th groundout), 1 defensive sub (backfired on the grade; Leach took the 9th-inning pop-up) and 1 pitching change (neutral, Face for the 9th). Availability for Game 4 under the convention: Babe Adams (24 outs in this game) and Jose Rijo (9 outs) are unavailable; Aroldis Chapman (6 outs) is capped at 3 outs; everyone else who pitched recorded 3 outs and is free (Roy Face, John Franco, Francisco Cordero, Rob Dibble, Clay Carroll). Game 4 is at Cincinnati, and Cincinnati faces elimination: a loss ends their tournament, a win extends the series. Pittsburgh leads the series 3-0. Managers: Danny Murtaugh (Pittsburgh) and Sparky Anderson (Cincinnati). Venue is Great American Ball Park, as printed.">
