  <title>R1-15-G3: Baltimore Orioles 2, Kansas City Royals 7</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-07: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official R1-15 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Series: Baltimore Orioles (seed 15) vs Kansas City Royals (seed 18), home pattern 2-2-1-1-1, Game 3 at Kauffman Stadium. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Mark Gubicza started for Kansas City (5.1 IP, 2 H, 1 R, 1 ER, 2 BB, 3 SO, 0 HR); Kansas City led from the Bottom 2 on, and he left in the Top 6 with a 6-0 lead after Blair&#x27;s infield single and Grich&#x27;s sacrifice bunt, the run that then scored on Anderson&#x27;s single off Soria being Blair, charged to Gubicza, so he takes the win. Dave McNally started for Baltimore (1.2 IP, 5 H, 6 R, 1 ER, 1 BB, 1 SO, 1 HR) and is charged with all six Kansas City runs in the Bottom 2, so he takes the loss. No save: Jeff Montgomery pitched the Top 9 with a five-run lead, 7-2. Run charges match the printed lines exactly: Baltimore pitching allows 7 (McNally 6, Flanagan 1, and Martinez, Miller, Britton, and Bautista none), and Kansas City pitching allows 2 (Gubicza 1, Soria 1, Mingori and Montgomery none). The duplicate test ran before the number was assigned: the stored games in the series are Game 1 (Baltimore 8, Kansas City 4) and Game 2 (Kansas City 8, Baltimore 5), both with different linescores, so this box score is no duplicate and takes the series&#x27; next unplayed number, Game 3. The game: Gubicza and McNally traded a quiet first. Baltimore put two on in the Top 2 with walks to Powell and Ripken, and Brooks Robinson grounded into a double play to end it. The Bottom 2 decided the game. Sweeney popped out, Otis walked, and on Yost&#x27;s hit and run Gordon singled to left and Otis scored from first. Pérez popped out for the second out, and then White reached on Brooks Robinson&#x27;s error at third (E5), Wilson singled Gordon home, Tartabull singled White home, and Brett hit a three-run home run, 6-0. Weaver went to Tippy Martinez, who retired Witt to end the inning. The earned run accounting matches McNally&#x27;s printed line: only Otis&#x27;s run, scored before the error, is earned; the five runs that followed the two-out error are unearned, so McNally&#x27;s line reads 6 R and 1 ER. Baltimore&#x27;s chances after that were scattered: Frank Robinson doubled in the Top 4 and was stranded, and in the Top 6 Blair beat out an infield single on a collision at first, Grich bunted him to second, and Anderson singled him home off Soria, the run charged to Gubicza. In the Top 7, Powell and Dempsey singled and Jones singled with Gordon&#x27;s error in left (E7) on the play, Powell scoring and Jones taking second; the run is charged to Soria as unearned on his printed line (1 R, 0 ER), and the card prints no RBI for Jones on it. Kansas City&#x27;s seventh run came in the Bottom 8: McRae, who had replaced Gordon in left field for defense in the Top 8, singled off Flanagan and White doubled him home. Baltimore&#x27;s last look was the Top 9: Ripken singled, Brooks Robinson grounded into his second double play of the game, Dempsey doubled, and Jones struck out. Baltimore stranded 7 and Kansas City 6. Home runs: one, Brett&#x27;s three-run shot in the Bottom 2 off McNally; Brett went 4 for 4 with 3 RBI, a stolen base, and a caught stealing. Doubles: three, Frank Robinson in the Top 4 and Dempsey in the Top 9 for Baltimore, White in the Bottom 8 for Kansas City. Triples: none. Errors: two, one for each club, Brooks Robinson (E5) on White&#x27;s Bottom 2 reach and Gordon (E7) on Jones&#x27;s Top 7 single. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: one, Grich&#x27;s bunt in the Top 6, the split lines reading SH 1 for Grich and SF 0 for every batter. Stolen bases: two, Gordon in the Bottom 6 and Brett in the Bottom 7. Caught stealing: one, Brett in the Bottom 5, the out recorded on Britton&#x27;s watch during Witt&#x27;s plate appearance. Double plays grounded into: two, both Brooks Robinson, in the Top 2 and the Top 9. Substitutions: three with plate appearances, Porter pinch-hitting for Pérez in the Bottom 6 (a strikeout, then he stayed at catcher and flied out in the Bottom 8), McRae replacing Gordon in left field for defense in the Top 8 (a single and the seventh run in the Bottom 8), and Jones replacing Blair in center field (he first batted in the Top 7, the single with the error, and struck out in the Top 9), so the Gazette prints ten Baltimore batting lines and eleven Kansas City batting lines. One name is spelled two ways across the sources: the Gazette prints Zack Britton, and the club roster carries the same pitcher as Zach Britton (brittza01), Baltimore&#x27;s bullpen reliever, with no other Britton anywhere in the tournament data; his line is booked under his roster name and id. Plate appearances counted fresh from the printed batting lines and the play log enumeration, a caught stealing counting as one of the inning&#x27;s outs and never an add-on: Kansas City PA is AB 34 plus BB 3, which is 37, and the outs plus runs plus stranded identity agrees (24 outs plus 7 runs plus 6 stranded is 37, Kansas City batting eight innings); Baltimore PA is AB 33 plus BB 2 plus SH 1, which is 36, and the identity agrees (27 outs plus 2 runs plus 7 stranded is 36). Batters faced tie to those totals: Kansas City 37 PA against 37 Baltimore BF (McNally 12, Martinez 4, Miller 4, Britton 4, Bautista 4, Flanagan 9), and Baltimore 36 PA against 36 Kansas City BF (Gubicza 19, Soria 9, Mingori 4, Montgomery 4). Strikeouts tie both ways: Kansas City batting 6 against Baltimore pitching 6 (McNally 1, Miller 2, Bautista 1, Flanagan 2), Baltimore batting 6 against Kansas City pitching 6 (Gubicza 3, Soria 2, Montgomery 1). Printed RBI: Kansas City 7 for 7 (Brett 3, Wilson 1, Tartabull 1, Gordon 1, White 1) and Baltimore 1 for 2 (Anderson 1), the Top 7 run scoring on Jones&#x27;s single plus Gordon&#x27;s error with no RBI printed, exactly as the card carries it. Availability under the house convention, read from Game 2 outs: Saberhagen (16 outs) and Mussina (17 outs) were unavailable and did not pitch; Hall (7 outs) was capped at 3 outs and did not pitch, so the cap never came into play; Bautista (3 outs in Game 2) was free and pitched one inning. Fifteen decisions were graded. Ned Yost made 10 (4 paid off, 4 backfired, 2 neutral): his two hit and runs in the Bottom 2 both paid off, the Gordon one at +5.74, the game&#x27;s best grade, and the Pérez one at +4.24, the inning scoring six against half a run expected; the change to Mingori in the Top 8 paid off at +0.73 and the McRae defensive sub at +0.48; the change to Soria in the Top 6 backfired at -0.59; the Porter pinch hit in the Bottom 6 backfired at -1.11 and the Bottom 5 steal backfired at -1.11 when Brett was caught stealing, the game&#x27;s worst grades; his three steals went 0 paid off, 2 backfired, 1 neutral. Earl Weaver made 5 (3 paid off, 0 backfired, 2 neutral), all five pitching changes as he worked through the pen after McNally&#x27;s early exit: to Miller in the Bottom 4 and to Flanagan in the Bottom 7 paid off at +0.73 each, to Tippy Martinez in the Bottom 2 paid off at +0.35, and to Britton in the Bottom 5 and Bautista in the Bottom 6 were neutral at +0.23 each. Managers: Earl Weaver (Baltimore) and Ned Yost (Kansas City). Venue is Kauffman Stadium. Game 4 availability from Game 3 outs: Gubicza (16 outs) is unavailable under the house convention, moot on the rotation turn; Flanagan (6 outs) is capped at 3 outs in Game 4; every other pitcher is free. Kansas City leads the series 2-1.">
