  <title>R1-14-G3: Chicago White Sox 8, Seattle Mariners 4</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-05: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-14 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Chicago White Sox (seed 14) vs Seattle Mariners (seed 19), home pattern 2-2-1-1-1, Game 3 at T-Mobile Park. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Chris Sale started for Chicago, and Chicago took the lead for good in the Top 3; Sale worked seven innings (7.0 IP, 4 H, 2 R, 2 ER, 4 BB, 8 SO) and left with an 8-2 lead, so he takes the win. Jamie Moyer started for Seattle and was charged with Chicago&#x27;s first six runs (4.0 IP, 8 H, 6 R, 5 ER, 3 BB, 0 SO, 1 HR), leaving after the three-run Top 5 homer, so he takes the loss. No save: Keith Foulke entered the Bottom 9 with a five-run lead (8-3), the bases empty, and no tying run on deck or in the hole, and the game ended 8-4. Run charges match the printed lines exactly: Seattle pitching allows 8 (Moyer 6, Nelson 0, Rhodes 0, Sasaki 2, Putz 0, Díaz 0), and Chicago pitching allows 4 (Sale 2, Marte 1, Foulke 1). The duplicate test ran before the number was assigned: the stored Game 1 (Chicago 6, Seattle 5) and Game 2 (Chicago 4, Seattle 3) differ in score and linescore, so this box score is no duplicate and takes the series&#x27; next unplayed number, Game 3. The game: after a scoreless first in which Ichiro reached on Ventura&#x27;s error and was stranded, Chicago scored in the Top 2, Miñoso singling and coming home on Appling&#x27;s two-out single, 1-0. Seattle tied it in the Bottom 2: Martínez walked and Raleigh doubled him home, 1-1. Chicago took the lead for good in the Top 3: Fisk walked, Fielder Jones reached on Moyer&#x27;s error on the bunt, Collins bunted both runners up, Thomas walked, and Miñoso&#x27;s blooper singled Fisk and Jones home, 3-1, Jackson&#x27;s double play ending the inning. The Top 5 broke it open: Collins walked, Thomas singled, and Miñoso hit a three-run homer off Moyer, 6-1, Nelson finishing the inning after Ventura&#x27;s walk ended in a strikeout and caught stealing double play on the hit and run. Seattle got one back in the Bottom 6: Ichiro walked, A-Rod bunted him to second, and Martínez doubled him home, 6-2. Chicago added two in the Top 7 off Sasaki: Collins walked, Jackson&#x27;s two-out single scored him, and Ventura&#x27;s double scored Jackson, 8-2, Putz getting the last out. Sale finished seven and handed off to Marte, who struck out the side around Martínez&#x27;s solo homer in the Bottom 8, 8-3. Seattle&#x27;s last run came in the Bottom 9 off Foulke and was unearned: A-Rod singled, Griffey reached on Ventura&#x27;s second error of the game, and Martínez singled A-Rod home, 8-4, Ibañez grounding out to end it with two aboard. Chicago stranded 9 and Seattle 10. Home runs: two, Miñoso for Chicago (three-run, Top 5) and Martínez for Seattle (solo, Bottom 8). Doubles: four, Ventura and Fisk for Chicago, Raleigh and Martínez for Seattle. Triples: none. Errors: three, Ventura two for Chicago (both E5, Ichiro&#x27;s first-inning reach and Griffey&#x27;s ninth-inning reach) and Moyer one for Seattle (E1 on Fielder Jones&#x27;s Top 3 bunt; Jones&#x27;s run is Moyer&#x27;s unearned run). Seattle&#x27;s Bottom 9 run is unearned on the same logic: Griffey&#x27;s reach on the error would have been the third out, so A-Rod&#x27;s run, though he reached on a clean single, scores after the error and Foulke is charged a run with no earned run. Hit batters: none; HB is carried as 0 for every pitcher as a card-sourced value and HBP 0 for every batter, so the hit batter check runs on real data. Wild pitches: two, Sale and Sasaki one each. Passed balls: none. Sacrifices: two bunts, Collins in the Top 3 and A-Rod in the Bottom 6, so the split lines read SH 1 each and SF 0 for every batter; Fielder Jones&#x27;s own Top 3 bunt attempt is not a sacrifice on the card, the Gazette printing SH for Collins only, and Jones is charged an at-bat on the error reach (AB 5). Stolen bases: none. Caught stealing: one, Ventura in the Top 5, thrown out on the hit and run strikeout to end the inning. Double plays grounded into: two, Jackson for Chicago in the Top 3 and Griffey for Seattle in the Bottom 1. Substitutions: one with a plate appearance, Jay Buhner pinch-hitting for Ichiro in the Bottom 7 (walk) and batting again in the Bottom 9 (strikeout), so the Gazette prints ten Seattle batting lines; Chicago printed nine. Batters faced are counted from the play log and tie to the batting PA totals both ways (Chicago 44 PA against 44 Seattle BF: Moyer 23, Nelson 3, Rhodes 3, Sasaki 5, Putz 4, Díaz 6; Seattle 41 PA against 41 Chicago BF: Sale 29, Marte 6, Foulke 6). Chicago PA is AB 36 plus BB 7 plus SH 1; Seattle PA is AB 34 plus BB 6 plus SH 1. Strikeouts tie both ways: Chicago batting 3 against Seattle pitching 3, Seattle batting 12 against Chicago pitching 12. Twenty-one decisions were graded. Fielder Jones made 12 (4 paid off, 4 backfired, 4 neutral): his two sacrifice bunt calls in the Top 3 both paid off at +0.89 and +0.81, the Top 5 steal send paid off at +2.14, the game&#x27;s best grade, the runner held but three runs following, and the Top 7 hit and run paid off at +0.89; his hit and run calls backfired in the Top 4 at -1.13, the game&#x27;s worst grade, and in the Top 5 and Top 9 at -0.76 each, the Top 4 steal send backfired at -0.51, and his two pitching changes, to Marte in the Bottom 8 and to Foulke in the Bottom 9, were neutral at -0.27 each. Lou Piniella made 9 (3 paid off, 3 backfired, 3 neutral): his changes to Nelson in the Top 5 and Rhodes in the Top 6 paid off at +0.73 each and the change to Putz in the Top 7 at +0.57, while the change to Sasaki in the Top 7 backfired at -1.77; his steal sends backfired in the Bottom 1 at -0.86 and -0.51, the runner held each time, and went neutral in the Bottom 6 at +0.14; the Buhner pinch hit in the Bottom 7 was neutral at -0.23, and the change to Díaz in the Top 9 was neutral at +0.23. Managers: Fielder Jones (Chicago, also his club&#x27;s leadoff hitter and center fielder) and Lou Piniella (Seattle). Venue is T-Mobile Park. Game 4 availability from Game 3 outs under the house convention: Sale (21 outs) and Moyer (12 outs) are unavailable, a point the rotation turn makes moot for both starters; every reliever is free (Nelson 3 outs, Rhodes 3, Sasaki 2, Putz 4, Díaz 3 for Seattle, Marte 3 and Foulke 3 for Chicago, all under the six-out cap threshold). Chicago leads the series 3-0. Series runs so far: Chicago 18, Seattle 12.">
