  <meta name="description" content="Winners Bracket, Round 3, Series 1, Game 3 at Progressive Field, as the master export&#x27;s box score prints the venue, &quot;PROGRESSIVE FIELD&quot;. The series was formed with the Game 1 booking by reseeding the eight Winners Round 2 winners by original tournament seed, highest against lowest: New York (seed 1) against Cleveland (seed 13), Yankees home for Games 1, 2, 5 and 7, Cleveland for Games 3, 4 and 6. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections, inside the game&#x27;s Rec record), the native PLAYS (JSON) rows, the narrative play log, the graded play-by-play with its manager decisions and decisions summary, and the full Rec JSON (W NYY|gomezle01, L CLE|jossad01, no save; the Rec extra list carries two inherited-runner lines). The export&#x27;s filename and header date read 2026-11-22, and the Rec&#x27;s recorded stamp is 2026-11-22T05:41:22Z; the book carries the header date, 2026-11-22. New York won 7-3 and leads the series 3-0. Decisions: Lefty Gomez takes the win for New York with a complete game (9.0 IP, 35 BF, 4 H, 3 R, 3 ER, 3 BB, 13 SO, 2 HB); Addie Joss takes the loss for Cleveland (4.0 IP, 23 BF, 9 H, 5 R, 3 ER, 1 BB, 3 SO, 1 HR). Andrew Miller relieved in the fifth and threw two scoreless innings (2.0 IP, 7 BF, 0 H, 1 BB, 3 SO), Emmanuel Clase pitched a perfect seventh (1.0 IP, 3 BF, 2 SO), Doug Jones pitched the eighth (0.2 IP, 5 BF, 3 H, 2 R, 2 ER), and Sam McDowell finished (1.1 IP, 7 BF, 0 H, 3 BB, 3 SO). Lefty Gomez is the export&#x27;s player of the game. Scoring: the top of the 2nd scored three: Joe DiMaggio flied out, Alex Rodriguez singled, Yogi Berra singled, Willie Randolph reached on Jose Ramirez&#x27;s error to load the bases, Derek Jeter&#x27;s single plus Shoeless Joe Jackson&#x27;s error in right field scored Rodriguez and Berra (play row seq 14, runs 2, rbi 1: Rodriguez&#x27;s run is the RBI run; the row&#x27;s steps print &quot;Yogi Berra scores (unearned)&quot;), and Aaron Judge&#x27;s sacrifice fly scored Randolph, 3-0. The bottom of the 2nd answered with three: Shoeless Joe Jackson walked, Albert Belle&#x27;s double scored him, Jose Ramirez struck out, Lou Boudreau walked, Victor Martinez was hit by a pitch to load the bases, and Tris Speaker&#x27;s single scored Belle and Boudreau, 3-3. The top of the 3rd, Mickey Mantle homered off Joss (the export&#x27;s decisive play), 4-3. The top of the 5th scored one: Lou Gehrig singled, Mantle singled, Miller relieved Joss, DiMaggio walked to load the bases, and Rodriguez&#x27;s forceout at second scored Gehrig, 5-3. The top of the 8th scored two off Doug Jones: Rodriguez singled, Berra singled, Randolph&#x27;s single scored Rodriguez, Jeter&#x27;s forceout at second put Jeter at first and Berra at third, and Judge&#x27;s forceout at second scored Berra; McDowell relieved Jones and stranded Judge. Gomez allowed nothing after the second: Nap Lajoie&#x27;s fifth-inning triple was stranded (Thome struck out, Manny Ramirez flied out), and he struck out 13 in all, fanning the side in the first after Speaker&#x27;s leadoff single and stolen base. The extra list, exactly as printed: inherited runners for Andrew Miller 2/1 (Gehrig and Mantle, aboard when he relieved Joss with none out in the top of the 5th; Gehrig scored on Rodriguez&#x27;s forceout and Mantle was forced at second on the same play) and for Sam McDowell 1/0 (Judge, aboard at first when he relieved Jones with two out in the top of the 8th, stranded). No holds and no blown saves; Clase entered with the bases empty. Errors: Cleveland 2, New York 0, confirmed by the play rows&#x27; rebuilt error count (CLE 2 / NYY 0), the printed fielding sections, the batting CSV&#x27;s E column and the Rec fld array alike, and team_errors reads CLE 2, NYY 0. Jose Ramirez made the first, in the top of the 2nd (Randolph reached on it); Shoeless Joe Jackson made the second, on Jeter&#x27;s single in the same inning. Double plays: one, turned by New York: Lou Boudreau grounded into it in the bottom of the 4th (play row seq 40, coded &quot;DP 4-6-3&quot;; Randolph, Jeter and Gehrig each carry DP 1 in the fielding section as the chain&#x27;s fielders), matching Boudreau&#x27;s printed GIDP line and New York&#x27;s printed team DP 1, so no GIDP-practice divergence arises. Cleveland turned none. Stolen bases: Tris Speaker stole second in the bottom of the 1st (row seq 6, run_event &quot;SB|CLE|speaktr01&quot;), the game&#x27;s only attempt; no caught stealings. The catching lines as printed: Yogi Berra, PB 0, 1 steal attempt against, 1 stolen base, 0 caught stealing (0%); Victor Martinez, PB 0 and nothing against. Defensive lines are booked in the established shape from the printed fielding section (New York 27 putouts and 6 assists, no errors, team DP 1: Berra 13 putouts catching, Gehrig 7 putouts and DP 1, Jeter 2 putouts and 2 assists with DP 1, Randolph 1 putout and 3 assists with DP 1, Judge 1 putout, Mantle 1 putout, DiMaggio 1 putout, Bernie Williams 1 putout, Rodriguez 1 assist; Cleveland 27 putouts and 3 assists, 2 errors, no double plays: Martinez 11 putouts catching, Thome 4 putouts and 1 assist, Speaker 3 putouts, Jackson 3 putouts and 1 error, Boudreau 3 putouts and 1 assist, Belle 2 putouts, Lajoie 1 putout, Jose Ramirez 1 assist and 1 error). Substitutes: Bernie Williams replaced DiMaggio in center field for the bottom of the 7th (Stengel&#x27;s graded defensive sub) and struck out in the top of the 9th; he carries both a batting line (0 for 1) and a fielding line (1 putout) as printed. Cleveland used no substitutes. Wild pitches: none. Passed balls: none. Hit by pitch: two, both by Gomez (Victor Martinez in the bottom of the 2nd and Jose Ramirez in the bottom of the 9th), tying the batting HBP column (Ramirez 1, Martinez 1) to Gomez&#x27;s printed HB 2. Counting checks: New York plate appearances 45 (39 AB, 5 BB, 1 SF) equal Cleveland&#x27;s 45 batters faced (Joss 23, Miller 7, Clase 3, Jones 5, McDowell 7); Cleveland plate appearances 35 (30 AB, 3 BB, 2 HBP) equal Gomez&#x27;s 35 batters faced. Hit, walk, home run and strikeout totals tie across the two boxes both ways (New York batting strikeouts 11 = Joss 3 + Miller 3 + Clase 2 + McDowell 3; Cleveland batting strikeouts 13 = Gomez 13; New York home runs 1, Mantle off Joss; Cleveland home runs 0). Team RBI: New York 6 against 7 runs (Berra&#x27;s top-of-the-2nd run, scored on Jackson&#x27;s error, carries no RBI); Cleveland 3, equal to its runs. Staff earned runs: Cleveland&#x27;s staff 5 ER against New York&#x27;s 7 runs (Berra&#x27;s and Randolph&#x27;s top-of-the-2nd runs are unearned on Joss&#x27;s line, 5 R against 3 ER; Randolph reached on Ramirez&#x27;s error); New York&#x27;s staff 3 ER against Cleveland&#x27;s 3 runs, every run earned. Manager grades: the grades list names both managers directly, so no label mapping is needed. Terry Francona graded 7 decisions (2 paid off, 3 backfired, 2 neutral): 3 steals (1 paid off, 2 backfired: the bottom-of-the-1st send, Speaker safe at second, graded backfired when no runs followed; the bottom-of-the-2nd send, Jackson held, graded paid off in the three-run inning; the bottom-of-the-4th send, Ramirez held, graded backfired) and 4 pitching changes (1 paid off: Clase for the 7th; 1 backfired: Doug Jones for the 8th; 2 neutral: Miller for the 5th and McDowell in the 8th). Casey Stengel graded 2 decisions (2 paid off): 1 defensive sub (paid off: Bernie Williams in center field for the 7th) and 1 left-pitcher-in (paid off: leaving Gomez in for the bottom of the 9th). Availability was compliant: Game 2&#x27;s unavailable pair (Coveleski 13 outs, Ruffing 27 outs) appear nowhere in this game, and the Rec&#x27;s own unavailable block lists them among its seven rest and house-rule entries; no pitcher was capped out of Game 2 (Cade Smith 5 outs, Clase 3 outs and Doug Jones 3 outs were all free; Smith simply did not appear). Game 4 availability, from this game&#x27;s outs: Gomez (27 outs) and Joss (12 outs) threw 9 or more outs and are unavailable for Game 4; Andrew Miller threw 6 outs and is capped at 3 outs for Game 4; Clase (3 outs), Doug Jones (2 outs) and McDowell (4 outs) are free. New York leads the series 3-0 and improves to 11-2 in games and 2-0 in series; Cleveland falls to 8-7 in games and stands 2-0 in series. The loser of this series drops to the losers bracket. Managers: Casey Stengel (New York) and Terry Francona (Cleveland). Venue is Progressive Field, as printed.">
