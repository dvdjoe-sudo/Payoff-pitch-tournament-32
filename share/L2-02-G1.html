  <title>L2-02-G1: Montreal Expos 3, Atlanta Braves 2</title>
  <meta name="description" content="Losers Bracket, Round 2, Series 2, Game 1 at Truist Park, as the master export&#x27;s box score prints the venue. This booking FORMS the L2-02 series in its archive slot: #7 Atlanta Braves (manager Bobby Cox) against #27 Montreal Expos (manager Dick Williams), the second pairing of the reseeded Losers Round 2 pool (the 8 Losers Round 1 winners plus the 8 Winners Round 2 losers, paired highest surviving seed against lowest, the formation verified when L2-01 was booked), home pattern Atlanta for Games 1, 2, 5 and 7, Montreal for Games 3, 4 and 6; the formation block stays as the shell carries it (rule reseed-high-vs-low, pool &quot;Winners of Losers Round 1, plus the losers of Winners Round 2 dropping in&quot;, gate &quot;Losers Round 1 and Winners Round 2 are complete&quot;), with the feeder labels as in the shell. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the narrative play log, the graded play-by-play with its manager decisions and decisions summary, and the full Rec JSON (W MON|rogerst01, L ATL|maddugr01, S MON|rojasme01; the Rec extra list carries holds for Reardon and Wetteland and inherited runners for Wetteland and Rojas). The export&#x27;s filename and header date read 2026-11-22, but the Rec&#x27;s recorded stamp is 2026-11-22T00:08:23Z, 4:08 PM PT on 2026-11-21, and that is the played date the book carries. Montreal won 3-2. Decisions: Steve Rogers takes the win for Montreal (7.0 IP, 24 BF, 3 H, 0 R, 0 ER, 0 BB, 7 SO), the export&#x27;s player of the game; Greg Maddux takes the loss for Atlanta (7.0 IP, 28 BF, 7 H, 3 R, 3 ER, 0 BB, 3 SO, 1 HR); Mel Rojas takes the save (0.1 IP, 1 BF), entering in the bottom of the 9th with the tying run at second and getting the final out. Scoring: the game was scoreless until the top of the 3rd, when Tim Raines singled with two out and Jose Vidro hit a two-run home run off Maddux, 2-0. The top of the 7th added the insurance run: Andre Dawson singled, Ron Fairly&#x27;s groundout on the hit and run moved him to second, and Orlando Cabrera doubled him home off Maddux, 3-0. Atlanta&#x27;s runs both came in the bottom of the 9th off John Wetteland: Eddie Mathews doubled with one out, Joe Torre doubled him home, and after Freddie Freeman struck out, Dale Murphy doubled home Torre, 3-2, before Rojas relieved and Andruw Jones flied out to left to end it with Murphy, the tying run, at second. The extra list, exactly as printed: holds for Jeff Reardon and John Wetteland (both Montreal); inherited runners Wetteland 2/0 (Murphy, hit by Reardon&#x27;s pitch, and Andruw Jones, aboard when Wetteland relieved Reardon in the bottom of the 8th, neither scored) and Rojas 1/0 (Murphy at second in the 9th, stranded). Reardon (0.1 IP, 3 BF, 1 H, 1 HBP) and Wetteland (1.1 IP, 7 BF, 3 H, 2 R, 2 ER, 3 SO) bridged the 8th and 9th; Phil Niekro pitched two perfect innings for Atlanta (2.0 IP, 6 BF, 1 SO). Errors: none, an errorless game both ways, confirmed by the play rows&#x27; rebuilt error count (MON 0 / ATL 0). Double plays: none turned by either club, no printed GIDP on either side and no DP-coded play row, so no GIDP-practice divergence arises; the fielding section prints DP 0 for both clubs. Stolen bases: none attempted by either club; caught stealing: none. The catching lines as printed: Gary Carter and Brian Schneider, PB 0 and nothing against for Montreal; Joe Torre, PB 0 and nothing against for Atlanta. Defensive lines are booked in the established shape from the printed fielding section (Montreal 27 putouts and 8 assists: Fairly 11 putouts at first, Carter 7 putouts catching, Schneider 3 putouts catching, Raines 2 putouts, Cabrera 1 putout and 3 assists, Vidro 3 assists, Wallach 1 putout and 2 assists, Walker and Dawson 1 putout each; Atlanta 27 putouts and 11 assists: Freeman 14 putouts at first, Albies 2 putouts and 5 assists, Mathews 4 assists, Torre 4 putouts catching, Andruw Jones 4 putouts, Murphy 3 putouts, Maddux and Maranville 1 assist each). Substitutes: Brian Schneider replaced Carter at catcher in the bottom of the 8th (3 putouts, 0 for 1 with a strikeout in the top of the 9th) and Mike Lansing replaced Vidro at second base for the bottom of the 9th; Lansing had no plate appearance and no fielding chance and carries no batting or fielding line in any of the export&#x27;s sources, so none is booked for him, exactly as printed. Wild pitches: none. Passed balls: none. Hit by pitch: Dale Murphy, by Reardon in the bottom of the 8th (his printed line carries the HBP; he later doubled home Atlanta&#x27;s second run in the 9th). Counting checks: Montreal plate appearances 34 (34 AB) equal Atlanta&#x27;s 34 batters faced (Maddux 28, Niekro 6); Atlanta plate appearances 35 (34 AB, 1 HBP) equal Montreal&#x27;s 35 batters faced (Rogers 24, Reardon 3, Wetteland 7, Rojas 1). Hit, walk, home run and strikeout totals tie across the two boxes both ways (Atlanta batting strikeouts 10 = Rogers 7 + Wetteland 3; Montreal batting strikeouts 4 = Maddux 3 + Niekro 1; no walks were issued by either staff). Team RBI equals team runs both ways, and earned runs tie exactly (Montreal&#x27;s staff 2 ER, Atlanta&#x27;s staff 3 ER). Manager grades: the grades list names both managers directly, so no label mapping is needed. Dick Williams graded 6 decisions (3 paid off, 1 backfired, 2 neutral): 3 pitching changes (2 paid off, Wetteland in the 8th and Rojas in the 9th; 1 neutral, Reardon in the 8th), 2 defensive subs (1 paid off, Schneider at catcher in the 8th; 1 backfired, Lansing at second in the 9th, graded on the two runs that followed) and 1 hit and run (neutral, the top of the 7th). Bobby Cox graded 2 decisions (both paid off): 1 left-pitcher-in (Maddux stayed in for the top of the 7th) and 1 pitching change (Niekro for the 8th). Availability was clean entering the series: a new series resets availability, so nothing carried in from R1-07, W2-07, R1-06 or L1-06. Game 2 availability, from this game&#x27;s outs: Rogers (21 outs) and Maddux (21 outs) both threw 9 or more outs and are unavailable for Game 2; Niekro (6 outs) is capped at 3 outs; everyone else is free. Montreal leads the series 1-0 and improves to 6-6 in games and 1-1 in series; Atlanta falls to 7-5 in games and 1-1 in series. The loser of this series is eliminated. Managers: Dick Williams (Montreal) and Bobby Cox (Atlanta). Venue is Truist Park, as printed.">
