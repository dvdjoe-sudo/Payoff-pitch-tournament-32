  <title>R1-16-G2: Philadelphia Athletics 7, Houston Astros 8</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-07: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official R1-16 Game 2 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Series: Houston Astros (seed 16) vs Philadelphia Athletics (seed 17), home pattern 2-2-1-1-1, Game 2 at Minute Maid Park. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. One parent brief figure is corrected on the sources and documented here: the brief placed Home Run Baker&#x27;s error in the Bottom 8, but the graded play log enters it in the Bottom 9 (Berkman reaching with Altuve at second and two out, the score becoming PHA 6, HOU 6 on the play), the Gazette&#x27;s inning error row puts Houston&#x27;s batted-against error in the ninth, and the batting order settles it independently, Berkman having made the last out of the Bottom 7 and the Bottom 8 running Bregman, Correa, and Cruz only; the sources govern and the error is booked in the Bottom 9. Dave Smith takes the win: he pitched a scoreless Top 11 (1.0 IP, 1 H, 0 R, 0 BB, 2 SO) and Houston won the game in the bottom of the inning, Smith the pitcher of record. Joe Berry takes the loss: he entered with two out in the Bottom 9 and both Houston extra-inning runs are charged to him on the card (2.0 IP, 2 H, 2 R, 2 ER, 1 BB, 0 SO, 2 HR), Carlos Correa&#x27;s game-tying home run in the Bottom 10 and Lance Berkman&#x27;s walk-off home run in the Bottom 11. No save: Smith finished the game himself on the winning side. The starters take no decisions: Eddie Plank (8.2 IP, 10 H, 6 R, 5 ER, 8 BB, 0 HBP, 5 SO, 2 HR) left with two out in the Bottom 9 and the tying runs aboard, and Roy Oswalt (4.1 IP, 10 H, 6 R, 6 ER, 0 BB, 0 HBP, 4 SO, 1 HR) left in the Top 5 trailing. The one unearned run settles from the card and the log together: Plank is charged with six runs and five earned, and the unearned run is José Altuve&#x27;s in the Bottom 9, Altuve having doubled off Plank and then scored on Baker&#x27;s two-base error on Berkman&#x27;s grounder with Berry pitching; a runner is charged to the pitcher who put him on, so the run sits on Plank&#x27;s line and is unearned because it scored on the error. Run charges match the printed lines exactly: Philadelphia pitching allows 8 (Plank 6, Berry 2), and Houston pitching allows 7 (Oswalt 6, Pressly 1, and Hader, Lidge, Sambito, Wagner, and Smith none). The duplicate test ran before the number was assigned: the stored series game (Philadelphia 6, Houston 3 in Game 1) differs in score and linescore, so this box score is no duplicate and takes the next unplayed number, Game 2. The game: Philadelphia scored three in the Top 1 on doubles by Collins and Cochrane back to back, a Simmons bunt, and singles by Foxx, Johnson, and Baker. Houston answered with two in the Bottom 3, solo home runs by César Cedeño and Craig Biggio off Plank. Philadelphia stretched the lead to 6-2 in the Top 5: Cochrane homered off Oswalt, Foxx singled, Johnson doubled, and Baker singled home both runners off Hader. Houston got one back in the Bottom 6, Bregman singling and scoring on Cruz&#x27;s single after Correa&#x27;s double play. It stayed 6-3 to the Bottom 9. Mack left the fatigued Plank in to open the ninth; Cedeño singled, Biggio bunted him along, Alvarez grounded out, Bagwell walked, and Altuve doubled both runners home to make it 6-5. Berry came in and Berkman reached on Baker&#x27;s two-base error, Altuve scoring the tying run, before Bregman grounded out. Cochrane&#x27;s second home run, off Pressly in the Top 10, put Philadelphia up 7-6; Correa homered off Berry in the Bottom 10 to tie it again. Smith struck out Baker and Fain around a Moses single and a Joost flyout in the Top 11, and in the Bottom 11 Bagwell and Altuve flied out before Berkman&#x27;s walk-off home run off Berry ended it. Philadelphia stranded 14 and Houston 10. Home runs: six, Cochrane twice for Philadelphia (Top 5 off Oswalt, Top 10 off Pressly), and four solo shots for Houston, Cedeño and Biggio in the Bottom 3 off Plank, Correa in the Bottom 10 off Berry, and Berkman in the Bottom 11 off Berry. Doubles: seven, Collins, Cochrane, Simmons, and Johnson for Philadelphia, and Biggio, Alvarez, and Altuve for Houston. Triples: none. Errors: one, Baker (E5) on Berkman&#x27;s Bottom 9 grounder, charged to Philadelphia; Houston committed none. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: four bunts and no sacrifice flies, Simmons in the Top 1, Foxx in the Top 3, and Moses in the Top 1 for Philadelphia, and Biggio in the Bottom 9 for Houston, the split lines reading SH 1 for Simmons, Foxx, Moses, and Biggio and SH 0 and SF 0 for every other batter; the SH column is written as the card&#x27;s SAC line split, and SF 0 for every batter because no sacrifice fly appears in the log. Stolen bases: none. Caught stealing: none. Double plays grounded into: three named in the Gazette summary for Houston, Bagwell in the Bottom 1, Altuve in the Bottom 5, and Correa twice, in the Bottom 6 and the Bottom 8, the stored lines reading GIDP 1 for Bagwell, GIDP 1 for Altuve, and GIDP 2 for Correa; Philadelphia grounded into none, Simmons&#x27;s Top 6 fielder&#x27;s choice being a forceout with the batter reaching. Substitutions: none with plate appearances; the Gazette prints nine batting lines for each club, and Philadelphia used two pitchers and Houston seven. The Athletics exist in this tournament as two clubs, Oakland (OAK) and Philadelphia (PHA); every Philadelphia line in this game sits under PHA keys and nothing merges with Oakland. Plate appearances counted fresh from the printed batting lines and the play log enumeration, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Philadelphia PA is AB 47 plus BB 4 plus SH 3, which is 54, and the outs plus runs plus stranded identity agrees (33 outs plus 7 runs plus 14 stranded is 54); Houston PA is AB 40 plus BB 9 plus SH 1, which is 50, and the identity agrees on 32 outs, not 33, because the walk-off home run ended the Bottom 11 with two outs recorded (32 outs plus 8 runs plus 10 stranded is 50). Batters faced tie to those totals: Philadelphia 54 PA against 54 Houston BF (Oswalt 23, Hader 8, Lidge 5, Sambito 6, Wagner 3, Pressly 5, Smith 4), and Houston 50 PA against 50 Philadelphia BF (Plank 40, Berry 10). Strikeouts tie both ways: Philadelphia batting 13 against Houston pitching 13 (Oswalt 4, Hader 3, Lidge 1, Sambito 1, Wagner 1, Pressly 1, Smith 2), Houston batting 5 against Philadelphia pitching 5 (Plank 5, Berry 0). Printed RBI: Philadelphia 7 for 7 (Cochrane 3, Baker 3, Foxx 1) and Houston 7 for 8 (Altuve 2, Biggio 1, Berkman 1, Correa 1, Cruz 1, Cedeño 1), the eighth Houston run being Altuve&#x27;s unearned run on the Bottom 9 error, which carries no RBI exactly as printed. Availability: Grove (27 outs in Game 1) was unavailable for Philadelphia and Verlander (14 outs in Game 1) was unavailable for Houston, and neither pitched; Houston&#x27;s Game 1 relievers were all short-outing and free, and Hader, Lidge, Sambito, Wagner, and Pressly all pitched here legally; no cap was in play. Nine decisions were graded. A.J. Hinch made 6 (3 paid off, 1 backfired, 2 neutral), all pitching changes: to Sambito in the Top 8 paid off at +0.73, to Wagner in the Top 9 paid off at +0.73, to Smith in the Top 11 paid off at +0.73, to Lidge in the Top 7 was neutral at +0.23, to Pressly in the Top 10 was neutral at -0.27, and to Hader in the Top 5 backfired at -0.87, Baker&#x27;s two-run single following. Connie Mack made 3 (0 paid off, 3 backfired, 0 neutral): the Top 7 hit and run backfired at -1.11, Baker popping out to the catcher with Johnson aboard, leaving Plank in to open the Bottom 9 backfired at -2.77, the game&#x27;s worst grade, Plank giving up the three-run rally that tied the game, and the Bottom 9 pitching change to Berry backfired at -0.93, Berkman reaching on the error and the tying run scoring on Berry&#x27;s first batter. Managers: A.J. Hinch (Houston) and Connie Mack (Philadelphia). Venue is Minute Maid Park; the archive carries no park name for the Athletics&#x27; home games, so Games 3, 4, and 6 of this series are recorded as Philadelphia, city only. The series is tied 1-1.">
