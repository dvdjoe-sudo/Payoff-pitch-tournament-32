  <title>R1-12-G4: Minnesota Twins 5, New York Mets 4</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-04: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-12 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Minnesota Twins (seed 12) vs New York Mets (seed 21), home pattern 2-2-1-1-1, Game 4 at Citi Field in New York, and Minnesota leads the series 3-1 with this win. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with no run-accounting knot and no settlement: printed RBI ties clean for both clubs, Minnesota 5 for 5 runs (Oliva 2, Hrbek 2, Gaetti 1) and New York 4 for 4 (Alfonzo 3, Beltran 1). The decisions are not printed; they are derived from the play log and the run charges on the card. Rick Aguilera takes the win (1.2 IP, 2 H, 0 R, 0 BB, 3 SO): he entered in the Bottom 7 immediately after Alfonzo&#x27;s game-tying three-run homer, finished that inning and pitched the eighth, and was the pitcher of record when Minnesota retook the lead in the Top 8. Jerry Koosman takes the loss (7.1 IP, 11 H, 5 ER, 1 BB, 5 SO, 1 HR): the go-ahead run was charged to him, Killebrew doubling off Koosman in the Top 8, Rice pinch-running for him, and Oliva singling Rice home off Koosman before Wagner relieved. Joe Nathan takes the save: he pitched the Bottom 9 with a one-run lead, a standard save. Frank Viola takes no decision (6.1 IP, 7 H, 4 ER, 1 BB, 5 SO, 2 HR): he left in the Bottom 7 with the score tied 4-4. Run charges match the printed lines exactly: New York pitching allows 5 + 0 = 5 (Koosman all five, Wagner none), and Minnesota pitching allows 4 + 0 + 0 = 4 (Viola all four, Aguilera and Nathan none). The charge detail: Koosman&#x27;s five are Gaetti in the Top 3 (solo home run), Puckett, Killebrew and Oliva in the Top 6 (Puckett scored on Oliva&#x27;s double, Killebrew and Oliva on Hrbek&#x27;s two-run single), and Rice in the Top 8 as described. Viola&#x27;s four are Beltran in the Bottom 3 (solo home run) and Alonso, Beltran and Alfonzo in the Bottom 7 (Alonso walked, Beltran doubled, and Alfonzo hit a three-run home run, all off Viola). The duplicate test ran before the number was assigned: the three stored games in the series are Game 1 (Minnesota 6, New York 5, linescore New York 0 3 0 1 1 0 0 0 0, Minnesota 1 1 0 0 0 2 0 0 2), Game 2 (New York 5, Minnesota 1, linescore New York 1 2 0 0 0 0 2 0 0, Minnesota 0 0 0 0 0 0 1 0 0), and Game 3 (Minnesota 1, New York 0, linescore Minnesota 1 0 0 0 0 0 0 0 0, New York 0 0 0 0 0 0 0 0 with the ninth never batted); none shares this game&#x27;s final score or linescore, so this box score, a 5-4 Minnesota win on its own linescore, is no duplicate, and this is the fourth game of the series in play order, booked as Game 4. The game: Gaetti&#x27;s leadoff home run in the Top 3 and Beltran&#x27;s leadoff home run in the Bottom 3 made it 1-1, and it stayed there through a scoreless Top 5 in which Cronin and Gaetti singled to open the inning before Carew popped out on the hit and run and Mauer grounded into a double play. Minnesota scored three in the Top 6: Puckett and Killebrew singled, Oliva doubled Puckett home, and Hrbek singled Killebrew and Oliva home for 4-1. New York tied it in the Bottom 7 off Viola: Piazza struck out, Alonso walked, Beltran doubled, and Alfonzo hit a three-run home run; Aguilera came in and got Jones and Lindor to end the inning. In the Top 8, Buxton struck out, Killebrew doubled off Koosman, Rice pinch-ran, and Oliva singled Rice home for the go-ahead run; Wagner relieved and finished the inning around Hrbek&#x27;s single and Cronin&#x27;s sacrifice bunt. New York&#x27;s last chance came in the Bottom 8, when Hernandez singled, Wright forced him, Strawberry struck out, and Piazza singled to put runners at first and third before Olerud pinch-hit and struck out. Nathan closed the Bottom 9 around Alfonzo&#x27;s double. Minnesota stranded seven, New York six. Home runs: three, Gaetti for Minnesota (Top 3, solo), and Beltran (Bottom 3, solo) and Alfonzo (Bottom 7, three-run) for New York. Doubles: Killebrew and Oliva for Minnesota, and Beltran, Alfonzo and Jones for New York. Triples: none. Errors: none; both clubs played errorless ball, every error column zero. Hit batters: none; every pitcher&#x27;s HBP column on both grids reads zero and no batter on either side was hit, so HB 0 is carried for every pitcher as card-sourced values and the hit batter check runs on real data. Wild pitches: none printed on the card. Passed balls: none. Sacrifices: one, Cronin&#x27;s sacrifice bunt in the Top 8, so the split lines read SH 1 for Cronin and SH 0 and SF 0 for every other batter, log-proven. Stolen bases: none; the printed SB and CS columns are 0 for both clubs, and no steal was sent. Double plays grounded into, counted from the play log: two, Mauer in the Top 5 for Minnesota and Piazza in the Bottom 4 for New York, exactly as the card extras read. Substitutions: Minnesota made three. Sam Rice pinch-ran for Killebrew in the Top 8 and scored the winning run, carrying the printed batting line AB 0, R 1. Earl Battey replaced Mauer at catcher for the Bottom 8 and struck out in the Top 9, carrying the printed line AB 1, SO 1; the catching spot batted once more, his turn. Goose Goslin replaced Buxton in left field for the Bottom 9, had no plate appearance, and so carries no batting line and is carried in this recap only. New York made one: John Olerud pinch-hit for Alonso in the Bottom 8 and struck out with runners at first and third, carrying the printed line AB 1, SO 1; the designated hitter spot did not bat again. Batters faced are counted from the play log and tie to the batting PA totals both ways (Minnesota 39 PA against 39 New York BF: Koosman 33, Wagner 6; New York 37 PA against 37 Minnesota BF: Viola 26, Aguilera 7, Nathan 4). Minnesota PA is AB 37 plus BB 1 plus SH 1; New York PA is AB 36 plus BB 1. Eight decisions were graded. Tom Kelly made 6 (5 paid off, 1 backfired, 0 neutral): the Bot 9 change to Nathan paid off at +0.73, the game&#x27;s best grade; the Top 8 Rice pinch runner paid off at +0.59; the Bot 7 Aguilera change paid off at +0.50; both defensive substitutions paid off at +0.48, Battey at catcher in the Bot 8 and Goslin in left field in the Bot 9; his one backfire was the Top 5 hit and run at -1.69, the game&#x27;s worst grade, Carew popping out with runners at first and second and Mauer grounding into the double play behind it. Davey Johnson made 2 (0 paid off, 1 backfired, 1 neutral): the Top 8 change to Wagner was neutral at +0.26, and the Bot 8 Olerud pinch hitter backfired at -0.73, striking out with the tying and go-ahead runs at third and first. Managers: Tom Kelly (Minnesota) and Davey Johnson (New York). Venue is Citi Field. Availability compliance: Blyleven (24 outs in Game 3) and deGrom (18 outs in Game 3) were unavailable under the house convention and correctly did not pitch. Game 5 availability, under the house convention that reads only this game: Viola (19 outs) and Koosman (22 outs) are both UNAVAILABLE, and Aguilera (5 outs), Nathan (3) and Wagner (5) are all free. Each club started its rotation number 4, Viola for Minnesota and Koosman for New York; the rotations turn to the number 5 starters for Game 5, and the series moves back to Minnesota.">
