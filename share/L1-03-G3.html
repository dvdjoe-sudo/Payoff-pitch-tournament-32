  <meta name="description" content="Losers Bracket, Round 1, Series 3, Game 3 at Tropicana Field, as the graded log prints the venue. #17 Philadelphia Athletics (manager Connie Mack) against #30 Tampa Bay Rays (manager Kevin Cash), home pattern Philadelphia for Games 1, 2, 5 and 7, Tampa Bay for Games 3, 4 and 6. Both clubs carry one series loss, so the loser of the series is eliminated and the winner advances to Losers Round 2. Booked from the sources sent for this game: the scorecard photo, the Gazette scorecard PDF and the graded series play-by-play log&#x27;s Game 3 section. No box score CSV and no app Rec JSON were sent for this game; every line booked here is one the photo, the Gazette tables and the log agree on. The duplicate test ran before the number was assigned: the stored L1-03 series held Game 1 (Philadelphia 7, Tampa Bay 1) and Game 2 (Philadelphia 3, Tampa Bay 2), both different linescores, so this game takes Game 3. Decisions are DERIVED from the log and the run charges, as the sources print no decisions line: Jason Adam takes the win (he entered the top of the 5th with Tampa Bay trailing 1-0, worked a scoreless inning, and Tampa Bay scored four in the bottom of the 5th and never trailed again); Rube Waddell takes the loss (a complete game, 8.0 IP, charged with all four Tampa Bay runs); Pete Fairbanks takes a DERIVED save (he entered the top of the 9th with a three-run lead, 4-1, and finished the game in exactly one inning). Blake Snell has no decision (4.0 IP, 2 H, 1 ER, 3 BB, 6 SO, 1 HR). With no CSV sent, Tampa Bay&#x27;s batters-faced figures are derived from the log: Philadelphia&#x27;s 37 plate appearances (30 at-bats, 6 walks, 1 sacrifice bunt) split Snell 17, Adam 3, McGee 5, Castillo 3, Howell 3 and Fairbanks 6, and Waddell&#x27;s 36 batters faced equal Tampa Bay&#x27;s 36 plate appearances (26 at-bats, 9 walks, 1 hit batsman). Scoring: Mickey Cochrane&#x27;s solo home run off Snell in the top of the 1st was Philadelphia&#x27;s only run. All four Tampa Bay runs came in the bottom of the 5th off Waddell: Toby Hall struck out, B.J. Upton tripled, Yandy Diaz singled him home to tie, Evan Longoria walked, and Carlos Pena hit a three-run home run. The game was errorless. Tampa Bay stranded two in the 3rd (Upton&#x27;s double and Hall&#x27;s walk, both left at second and third), two in the 5th and two in the 6th; Philadelphia left the bases loaded in the 9th against Fairbanks (Baker singled, Joost and Fain walked, Collins flied out to right to end the game) and two on in the 3rd and the 6th. Fielding from the graded log&#x27;s printed fielding sections, which agree with its per-play fielding lines: Tampa Bay 27 putouts and 9 assists with no double plays; Philadelphia 24 putouts and 9 assists with four double plays (Zobrist in the 1st, Lowe in the 4th and the 7th, Hall in the 8th). The Gazette&#x27;s pitching summaries credit one wild pitch each to Blake Snell and Rube Waddell, and the log&#x27;s base states corroborate both: Home Run Baker advanced from first to second during the top of the 2nd, and Toby Hall advanced from first to second during the bottom of the 6th. Both are booked in the fielding record; there were no passed balls. Brandon Lowe is booked with 2 GIDP (the bottom of the 4th, 6-4-3, and the bottom of the 7th, 5-4-3), as the log and the scorecard photo both show; the Gazette&#x27;s summary line names each GIDP batter once and does not carry the count. The game&#x27;s play rows: no native app rows exist for this game (no box score CSV and no Rec JSON were sent), and the graded-log conversion path was attempted with the tournament&#x27;s log converter at its pinned revision. The conversion failed on one unmapped play phrase in the bottom of the 8th, Toby Hall&#x27;s double play, printed &#x27;grounds into a double play (SS unassisted at 2nd, to 1st)&#x27;, a wording the converter&#x27;s phrase table does not carry. Under the standing rule the game is booked lines-only and nothing was forced; the rows can be converted later if the converter learns the phrase. Manager grades: Kevin Cash graded 5 decisions (4 paid off, 0 backfired, 1 neutral), all pitching changes: Adam in the top of the 5th paid off (+0.73), McGee in the top of the 6th was neutral (+0.23), Castillo in the top of the 7th paid off (+0.73), Howell in the top of the 8th paid off (+0.73), and Fairbanks in the top of the 9th paid off (+0.73). Connie Mack had no graded decisions in this game; the log&#x27;s decisions summary lists only Cash, and Mack is booked with no graded entry, as the book represents a manager with no decisions. Availability compliance for this game, checked against Game 2 usage under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Game 2 made Eddie Plank (23 outs) and James Shields (18 outs) unavailable for Game 3, and neither pitched; Jake McGee (3 outs in Game 2), Jason Adam (1 out), Pete Fairbanks (3 outs) and Joe Berry (4 outs) were all free, and Berry was not used. Availability for Game 4: Waddell (24 outs) and Snell (12 outs) are unavailable; Adam, McGee, Castillo, Howell and Fairbanks threw 3 outs each in Game 3 and are all free; nobody is capped. Managers: Connie Mack (Philadelphia) and Kevin Cash (Tampa Bay). Venue is Tropicana Field.">
