  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as the app scorecard PDF plus the full graded play-by-play text on 2026-10-30; official R1-08 Game 2 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Box score record: the two sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number. The decisions are not printed; they are derived from the play log (Duane Ward pitched a scoreless Bottom 8 with Toronto down 5-3 and was the pitcher of record when Toronto took the lead in the Top 9, taking the win; Mark Melancon, brought in as the closer for the Top 9, was charged with all three runs of the inning and took the loss; Tom Henke pitched a scoreless Bottom 9 with a 1-run lead for the save). Toronto led early: Roberto Alomar scored on Josh Donaldson&#x27;s Top 1 sacrifice fly, and a Jose Bautista double, a George Bell single, and Jesse Barfield&#x27;s two-run long single made it 3-0 in the 2nd. Pittsburgh answered in the Bottom 2 on Danny Murtaugh&#x27;s hit and run: Pie Traynor doubled, Bill Mazeroski&#x27;s groundout scored a run, and Honus Wagner tripled in another for 3-2. The Pirates tied it in the 3rd on Manny Sanguillen&#x27;s sacrifice fly and went ahead on Traynor&#x27;s RBI single, then made it 5-3 in the 4th on Wagner&#x27;s double and Roberto Clemente&#x27;s sacrifice fly. Wilbur Cooper held Toronto scoreless from the 3rd through the 7th and into the 8th, and Roy Face stranded two in the 8th around Donaldson&#x27;s sacrifice bunt. Pittsburgh led 5-3 into the Top 9. Melancon struck out Alejandro Kirk and Devon White around singles by Bautista and Barfield, then Ernie Whitt hit a 3-run homer with two outs for 6-5. Dave Giusti finished the inning, and Henke closed it: Mazeroski and Arky Vaughan out, Andrew McCutchen singled, Paul Waner popped out to end it. Sacrifices are carried split: Donaldson&#x27;s Top 8 bunt is a sacrifice hit and his Top 1 fly is a sacrifice fly, and Clemente and Sanguillen each have a sacrifice fly. No hit batters: the scorecard grid prints HBP 0 for all eight pitchers, so HB 0 for all 8 pitchers and HBP 0 for all batters are card-sourced values carried in the tables below, and the homer, hit batter, and derived plate appearance checks run on real data. Toronto hit no walks at all: every Blue Jays plate appearance is an at-bat, a sacrifice hit, or a sacrifice fly. Pittsburgh&#x27;s one error is charged to Mazeroski on the scorecard; the play-by-play does not narrate the play, and the tables carry the card as printed. One wild pitch is printed on the scorecard (Cooper); a wild pitch is not a stored archive field and is noted here only. Substitutions: Alejandro Kirk replaced George Bell and first batted in the Top 4 in Bell&#x27;s spot (Bell&#x27;s line: 1 at-bat, 1 run, 1 hit, 1 stolen base); no graded decision was logged for the change. Arky Vaughan pinch-hit for Wagner in the Bottom 6 and stayed in, Paul Waner pinch-hit for Clemente in the Bottom 7 and stayed in, and Tommy Leach entered at third base for Traynor as a defensive substitute in the Top 8 and batted once. Availability held from Game 1: Paul Skenes (unavailable) and Kevin Gausman (capped at 3 outs) both stayed out. Managers: Danny Murtaugh (Pittsburgh) and Cito Gaston (Toronto). Venue is PNC Park.">
