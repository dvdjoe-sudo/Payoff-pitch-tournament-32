  <title>R1-09-G7: Texas Rangers 7, Cincinnati Reds 8</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-10-31: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-09 Game 7 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cincinnati Reds (seed 9) vs Texas Rangers (seed 24), home pattern 2-2-1-1-1, Game 7 at Great American Ball Park, winner take all. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number; no run-accounting settlement was needed, because the printed RBI totals tie exactly to the run totals for both clubs. The decisions are not printed; they are derived from the play log and the run charges on the card. Bucky Walters takes the win: John Franco, Anderson&#x27;s first call of the Top 5, faced five batters and gave the lead away, and Walters entered with one out and Gonzalez&#x27;s go-ahead double fresh on the board, stranded the runner, and was Cincinnati&#x27;s pitcher of record when the Reds retook the lead for good in the Bottom 5; he then threw 3.2 innings of 1-hit ball, the only run off him Seager&#x27;s solo home run in the Top 6. Yu Darvish takes the loss: he was charged with 7 runs, and the Bottom 5 go-ahead run was Votto&#x27;s, a Darvish runner who scored on Larkin&#x27;s 3-run home run off Jeff Zimmerman, so the loss is Darvish&#x27;s even though Zimmerman served the pitch; Zimmerman is charged only with Larkin himself on that homer, the two inherited runners (Votto and Davis) being Darvish&#x27;s, and Darvish&#x27;s seven charges account exactly: Rose in the Bottom 1 (Bench&#x27;s RBI single), Morgan in the Bottom 3, Davis and Larkin on the Bottom 4 home run, and Bench, Votto and Davis in the Bottom 5. Aroldis Chapman takes the save: he entered the Top 9 with an 8-6 lead, gave up Kinsler&#x27;s single and Howard&#x27;s RBI single to make it 8-7, and struck out Hamilton with the tying run on first to end the series. Run charges match the printed lines exactly: Cincinnati pitching allows 1 + 1 + 3 + 1 + 1 = 7 (Rixey, Cordero with the Top 4 run unearned, Franco, Walters, Chapman), and Texas pitching allows 7 + 1 + 0 + 0 = 8 (Darvish, Zimmerman, Feliz, Kern). The duplicate test ran before the number was assigned: the stored games in the series are Game 1 (Texas 7, Cincinnati 4 at Cincinnati), Game 2 (Cincinnati 7, Texas 5 at Cincinnati), Game 3 (Cincinnati 6, Texas 4 at Texas), Game 4 (Texas 11, Cincinnati 0 at Texas), Game 5 (Cincinnati 7, Texas 5 at Cincinnati) and Game 6 (Texas 9, Cincinnati 1 at Texas); an 8-7 Cincinnati win matches none of them on clubs, score or linescore, and it is the next game in play order, booked as the distinct Game 7. Sparky Anderson&#x27;s surprise starter was Eppa Rixey, a bullpen arm all series, and Rixey gave him 3.0 innings of 1-run ball: Texas&#x27;s only run off him came in the Top 3, Kinsler&#x27;s double and Alex Rodriguez&#x27;s RBI single. Cincinnati scored first in the Bottom 1 (Rose singled, Morgan bunted him over, Bench singled him home) and again in the Bottom 3 (Morgan and Robinson singled and Votto&#x27;s forceout scored Morgan) for 2-1. Cordero&#x27;s Top 4 was the error inning: Hamilton reached on Morgan&#x27;s error at second and stole second, Palmeiro&#x27;s deep fly moved him to third, Beltre singled him home (the run unearned, Cordero 1 R and 0 ER as printed), and Seager then reached on Larkin&#x27;s 2-base error at short before Kinsler&#x27;s short fly ended it at 2-2. Cincinnati answered in the Bottom 4: Davis walked and Larkin hit a 2-run home run off Darvish for 4-2. The Top 5 flipped the game: Franco walked Howard and Hamilton around Alex Rodriguez&#x27;s flyout after Ivan Rodriguez&#x27;s single, and Gonzalez doubled all three home to put Texas up 5-4; Anderson&#x27;s Franco call was graded backfired at -2.77, and his immediate hook to Walters was graded paid off at +0.91, Walters stranding Gonzalez at second on two flyouts. The Bottom 5 won the series: Bench walked, Votto singled, and after Kluszewski popped out and Foster struck out, Davis singled Bench home to tie it 5-5, Washington went to Zimmerman (graded backfired at -2.77), and Larkin hit his second home run of the night, a 3-run shot scoring Votto, Davis and himself for 8-5. Seager&#x27;s solo home run off Walters in the Top 6 made it 8-6, Feliz and Kern held Cincinnati over the last two innings, and Texas&#x27;s Top 9 got one back (Kinsler singled, the hit and run moved him to second, Alex Rodriguez&#x27;s groundout moved him to third and Howard singled him home) before Chapman struck out Hamilton to end it. Larkin&#x27;s night is the story of the game: 4 for 4 with 2 home runs, 5 RBI, 2 runs and a stolen base, his 2-run homer in the Bottom 4 and the series-winning 3-run homer in the Bottom 5. Texas&#x27;s Hamilton went 0 for 4 but scored twice, on a walk in the Top 5 and on the error reach and stolen base in the Top 4. Errors: two, both Cincinnati&#x27;s in the Top 4, Morgan&#x27;s at second base on Hamilton&#x27;s reach and Larkin&#x27;s 2-base error at shortstop on Seager&#x27;s reach; Texas had none. Darvish&#x27;s 1 wild pitch is printed on the scorecard; a wild pitch is not a stored archive field and is noted here only, and no run scored on it. Sacrifices: one, Morgan&#x27;s Bottom 1 sacrifice bunt; there were no sacrifice flies, so the split columns below show SH 1 for Morgan and SF all zeros, log-proven. Stolen bases: Hamilton stole second in the Top 4 and Larkin stole second in the Bottom 8, one each as printed. Caught stealing: none for either club; the several steal sends in the log were all held runners, not attempts. Double plays grounded into, counted from the play log: none for either club; the three forceouts (Foster in the Bottom 2, Votto in the Bottom 3, Robinson in the Bottom 6) are not GIDPs. Substitutions: none at all; both clubs batted their starting nine the whole game, Kluszewski starting at designated hitter for Cincinnati (1 for 4) and Foster starting in left field, and Seager starting at designated hitter for Texas. Hit batter: none. The scorecard grids print an HBP column for every pitcher on both clubs, all zeros, so HB 0 is carried for all nine pitchers and HBP 0 for every batter as card-sourced values, and the hit batter check runs on real data. Availability held from Game 6 under the house outs convention: Nolan Ryan (21 outs in Game 6, unavailable) and Noodles Hahn (9 outs, unavailable) did not pitch, and Jose Rijo (6 outs in Game 6, capped at 3 outs) was not used; Chapman, rested since his Game 3 work and the Game 5 sit-out, closed it. Seventeen decisions were graded. Sparky Anderson made 11 (3 paid off, 6 backfired, 2 neutral): five steal sends (the Bottom 4 send paid off at +1.49 and the Bottom 5 send paid off at +3.14, the inning Cincinnati retook the lead for good; the Bottom 2 and Bottom 6 sends backfired and the Bottom 3 send was neutral), four pitching changes (Cordero neutral at -0.27, Franco backfired at -2.77, Walters paid off at +0.91, the move of the game, and the Chapman closer call backfired at -0.77 because of the run allowed, but the save stands), and two hit and runs, both backfired (Bottom 6 at -0.76 and Bottom 8 at -1.11, Rose striking out). Ron Washington made 6 (2 paid off, 1 backfired, 3 neutral): three pitching changes (Zimmerman backfired at -2.77, serving Larkin&#x27;s go-ahead home run; Feliz paid off at +0.73 in the Bottom 7; Kern neutral at +0.23 in the Bottom 8), one steal send (paid off at +2.14, Top 5, the inning Texas took its brief lead), and two hit and runs, both neutral. Managers: Ron Washington (Texas) and Sparky Anderson (Cincinnati). Venue is Great American Ball Park. Cincinnati wins the series 4-3, taking Games 2, 3, 5 and 7 after losing Games 1, 4 and 6, and Texas outscored Cincinnati 48 runs to 33 across the seven games and lost the series anyway: Cincinnati scored 33 (4, 7, 6, 0, 7, 1, 8) and Texas 48 (7, 5, 4, 11, 5, 9, 7). Cincinnati advances on the winners side; Texas drops to the losers side at 0-1 in series play and stays alive. No series MVP is recorded yet; Joe rules on that next.">
