  <title>R1-06-G4: Chicago Cubs 6, Montreal Expos 4</title>
  <meta name="description" content="Played by Joe in the playable app and sent to the co-managed tournament games chat on 2026-11-16 as a single self-contained master export (report, box score, CSV sections, native play rows, narrative log, graded decisions, and the holds and inherited-runner list); the export&#x27;s own stamp reads 2026-11-17, the app&#x27;s export dating. Joe&#x27;s ruling in chat the same day adopts this playing as the new R1-06 Game 4 under the R1-05, R1-06, and R1-10 Game 1 adoption precedents, the R1-01 Game 1 through Game 4 adoptions, the R1-04 Game 6 adoption, and the R1-06 Game 1 and Game 2 adoptions. It replaces the booked Game 4 (Chicago 9, Montreal 1; W Pete Alexander, L Bryn Smith; played 2026-10-29), which is preserved untouched in the Cubs records at archive/replaced/ (PP_R1_06_G4_OFFICIAL_replaced.md, with its archive, monolith, and detail objects alongside). The replaced game is the one in which Andre Dawson played for both clubs (2 for 4 with a double, a homer, and 3 RBI for Chicago; 0 for 4 for Montreal); that game retires from the active book with this adoption, and Dawson appears only for Montreal here (2 for 3, a walk, a run scored). The series result is unchanged, Chicago winning the series 4-1, Chicago having won Game 4 in both playings, and both club records are unchanged; series runs move from 25 to 15 to 22 to 18. The replacement was made as a guarded manual edit under Joe&#x27;s ruling, confined to this game object, its detail file, and the series entry&#x27;s MVP line. The Series MVP stays Billy Williams; he went 1 for 5 in the adopted game after homering twice in the replaced one, so his MVP line is recomputed from the five games as now booked and reads &quot;5 for 19, 3 R, 1 HR, 1 RBI, .263&quot;, where it read &quot;6 for 19, 5 R, 3 HR, 3 RBI, .316&quot; with the replaced game inside it. All of the export&#x27;s sources agree on every number: the linescore, the batting and pitching sums, plate appearances against batters faced both ways (Chicago 41 against Bryn Smith&#x27;s 27, Reardon&#x27;s 4, McGaffigan&#x27;s 2, and Wetteland&#x27;s 8; Montreal 38 against Alexander&#x27;s 22, Sutter&#x27;s 4, Strop&#x27;s 3, Marshall&#x27;s 5, and Lee Smith&#x27;s 4), and printed RBI (Chicago 6 for 6, Montreal 4 for 4), booked exactly as printed. Ron Santo was the player of the game: a two-run home run off Bryn Smith in the top of the 1st (the export&#x27;s decisive play) and a solo home run off Jeff Reardon in the 7th, 3 RBI in all. Pete Alexander won it (5.0 IP, 6 H, 3 R, 3 ER, 1 BB, 1 HB, 5 SO); Bryn Smith took the loss (6.0 IP, 9 H, 4 ER, 2 BB, 4 SO, 1 HR); Lee Smith earned the save, coming on in the bottom of the 8th with two aboard and striking out Tim Wallach, then a scoreless 9th. Holds: Bruce Sutter, Pedro Strop, and Sean Marshall. Inherited runners: Sutter 2/1, Lee Smith 2/0, John Wetteland 1/1. Chicago scored in the 1st (Santo&#x27;s two-run homer), the 3rd (Sandberg walked, Rizzo singled on the hit-and-run, Sosa singled him home), the 4th (Wilson singled, stole second, and scored on Crow-Armstrong&#x27;s double), the 7th (Santo&#x27;s solo homer), and the 8th (Banks doubled off McGaffigan and scored on Crow-Armstrong&#x27;s single off Wetteland). Montreal scored in the 5th (Carter singled, Dawson walked, Fairly&#x27;s hit-and-run single scored Carter, and Raines singled home Dawson), the 6th (Walker and Guerrero singled off Alexander, and Carter&#x27;s forceout off Sutter scored Walker), and the 8th (Fairly&#x27;s single off Marshall). Errorless game; Chicago turned two double plays (Guerrero&#x27;s grounder in the 4th and Raines&#x27;s game-ending grounder in the 9th). One GIDP-practice case: Gabby Hartnett has two double-play rows, the top-of-the-2nd line drive on the hit-and-run and the top-of-the-6th ground ball on the hit-and-run, which the play rows rebuild as 2 GIDP against his printed 0 (Montreal&#x27;s printed DP total is also 0); under the standing practice (Joe, 2026-11-10) the rows govern and the printed line stands unchanged, and the difference is documented here. Johnny Kling replaced Hartnett at catcher for the bottom of the 8th; he had no plate appearance, and his appearance stands in the defense object (2 putouts). Game 5 availability note: this adopted game&#x27;s pitching lines differ from the replaced game&#x27;s (Alexander threw 15 outs here against a complete game in the replaced playing), which changes Game 5&#x27;s availability basis on paper; Game 5 stands exactly as played and booked, per the adoption precedents. Managers: Frank Chance (Chicago) and Dick Williams (Montreal). Venue is Olympic Stadium, Montreal&#x27;s park in the fixture (the export labels it &quot;(neutral)&quot;, a label quirk only). Chicago won the series 4-1.">
