  <title>L1-07-G4: Milwaukee Brewers 3, San Diego Padres 4</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 7, Game 4 at Petco Park, as the master export&#x27;s box score prints the venue. The series was formed with Game 1&#x27;s booking: #23 Milwaukee Brewers (manager Pat Murphy) against #26 San Diego Padres (manager Bruce Bochy), home pattern Milwaukee for Games 1, 2, 5 and 7, San Diego for Games 3, 4 and 6. Both clubs carry one series loss, so the loser of the series is eliminated and the winner advances to Losers Round 2. San Diego won Game 1, 11-8; Milwaukee won Game 2, 10-7, and Game 3, 5-3; this game ties the series 2-2, and the series runs stand at Milwaukee 26, San Diego 25. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every figure in the export agrees with itself across all of its sections. Decisions: Luke Gregerson takes the win for San Diego (1.0 IP, 3 BF, 0 H, 0 R, 1 SO): he relieved Trevor Hoffman with Milwaukee ahead in the top of the 9th, retired the three batters he faced, and was the pitcher of record when San Diego walked it off. Teddy Higuera takes the loss for Milwaukee (3.0 IP, 15 BF, 6 H, 4 R, 4 ER, 2 BB, 2 SO, 1 WP): three innings of relief, charged with all four San Diego runs and with a blown save in the Rec&#x27;s extra list for the bottom of the 9th. There is no save. Scoring: the game was scoreless through five. Milwaukee scored one in the top of the 6th, Robin Yount&#x27;s solo home run off Andy Ashby. San Diego scored two in the bottom of the 8th off Higuera: Tatis singled, Higuera&#x27;s wild pitch during Gwynn&#x27;s at-bat moved him to second, Gwynn&#x27;s single scored him, Winfield struck out, Caminiti singled Gwynn to third, and Gonzalez reached on Molitor&#x27;s error at third as Gwynn scored, the game&#x27;s one run without an RBI, traced below; Machado&#x27;s 6-4-3 double play ended the inning. Milwaukee scored two in the top of the 9th off Hoffman: Surhoff singled and Geoff Jenkins hit a two-run home run, putting Milwaukee ahead 3-2. San Diego scored two in the bottom of the 9th off Higuera: Tenace walked, Finley and Loretta singled to load the bases with nobody out, and Tatis&#x27;s opposite-field single scored Tenace and Finley to win it; Loretta, who had reached second on the hit, was thrown out on Jenkins&#x27;s throw trying for the extra base, the inning&#x27;s only out. Fernando Tatis Jr. was the player of the game: 3 for 5 with a run and 2 RBIs, the game-tying rally started by his bottom-of-the-8th single and the walk-off single in the 9th. Tony Gwynn also had three hits for San Diego. The no-RBI run, traced in the play rows: San Diego scored four runs on three printed RBIs (Tatis 2, Gwynn 1). The fourth run is the bottom-of-the-8th run at play row seq 72: with Gwynn at third and Caminiti at first, one out, Adrian Gonzalez reached on Paul Molitor&#x27;s 1-base error at third base (the row&#x27;s steps read &quot;Error, 3B Molitor (1-base error)&quot;), Gwynn scored on the play, and the row carries runs 1, rbi 0. The run is charged to Higuera and counts earned in his printed line (4 R, 4 ER); Milwaukee&#x27;s staff earned-run total of 4 ties San Diego&#x27;s 4 runs, and San Diego&#x27;s staff total of 3 ties Milwaukee&#x27;s 3 runs. It is not the wild pitch (Higuera&#x27;s wild pitch in the same inning only advanced Tatis during Gwynn&#x27;s at-bat, and that run carries Gwynn&#x27;s RBI) and not Machado&#x27;s double play, which scored nobody and ended the inning. Booked exactly as printed. Milwaukee&#x27;s home runs: Yount&#x27;s in the top of the 6th came off Ashby (play row seq 42), and Jenkins&#x27;s two-run home run in the top of the 9th came off Hoffman (play row seq 77). Trevor Hoffman&#x27;s line (0.0 IP, 2 BF, 2 H, 2 R, 2 ER, 1 HR) is his second straight blown 9th inning of the series: he entered with a 2-1 lead, recorded no outs, and the Rec&#x27;s extra list carries his blown save (BS|SD|SD|hoffmtr01), as it carries Higuera&#x27;s for the bottom half (BS|MIL|MIL|higuete01). Andy Ashby started for San Diego and pitched well in a no-decision (7.0 IP, 29 BF, 6 H, 1 R, 1 ER, 2 BB, 4 SO, 1 HR, 1 WP), and Mark Davis threw a scoreless top of the 8th. Corbin Burnes started for Milwaukee (4.2 IP, 18 BF, 3 H, 0 R, 0 ER, 1 BB, 7 SO); Ken Sanders relieved him in the bottom of the 5th with runners at second and third and retired Tatis to end the inning (the Rec&#x27;s extra list carries Sanders&#x27;s two inherited runners, none scored), then Higuera entered as the fireman in the bottom of the 6th and ended that inning on Gonzalez&#x27;s strikeout on the hit and run, Gwynn caught stealing third on the same play. The play rows flag Higuera as fatigued during Tatis&#x27;s walk-off at-bat, in his third inning of relief. One double play was turned: Machado grounded into a 6-4-3 double play in the bottom of the 8th (Yount unassisted at second, to Cooper at first, the credits as the fielding section&#x27;s DP column prints them), and Machado&#x27;s printed GIDP 1 matches the play rows&#x27; coded DP exactly. Molitor&#x27;s error was the game&#x27;s only error; San Diego was errorless. Stolen bases: none. Caught stealing: Gwynn 1, in the bottom of the 6th against the Contreras battery (Contreras SBA 1, SB against 0, CS against 1, as the fielding section prints). Wild pitches: Ashby 1 (top of the 6th, during Jenkins&#x27;s strikeout, moving Cooper to third), Higuera 1 (bottom of the 8th, during Gwynn&#x27;s at-bat). Passed balls: none. Substitutes: Milwaukee - Cecil Cooper pinch-hit for Scott in the top of the 6th, singled, and stayed in at first base; Carlos Gómez pinch-ran for Yelich in the top of the 7th and stayed in; B.J. Surhoff replaced Contreras at catcher in the bottom of the 7th, then singled in the top of the 9th and scored on Jenkins&#x27;s home run; Ben Oglivie replaced Braun in left field in the bottom of the 8th and batted in the top of the 9th. For San Diego: Gary Sheffield replaced Machado at third base in the top of the 9th, never batted and had no fielding chance. Sheffield carries no batting or fielding line, exactly as the export prints him. Fielding from the CSV&#x27;s printed fielding section: Milwaukee 25 putouts and 7 assists (Contreras 8 putouts; Yount 4 assists; Jenkins 1 outfield assist, the throw that retired Loretta in the bottom of the 9th; the walk-off ended the bottom of the 9th with one out recorded, so Milwaukee&#x27;s putout total is 25); San Diego 27 putouts and 10 assists (Gonzalez 13 putouts; Tatis and Machado 4 assists each). Counting checks: Milwaukee plate appearances 37 (35 AB, 2 BB) equal San Diego&#x27;s 37 batters faced (Ashby 29, Davis 3, Hoffman 2, Gregerson 3); San Diego plate appearances 37 (33 AB, 4 BB) equal Milwaukee&#x27;s 37 batters faced (Burnes 18, Sanders 4, Higuera 15). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Availability compliance in this game, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Ed Whitson (21 outs in Game 3) was unavailable for San Diego and did not pitch; Brandon Woodruff (10 outs in Game 3) was unavailable for Milwaukee and did not pitch. Manager grades, exactly as the export&#x27;s decisions summary prints: Pat Murphy graded 10 decisions (3 paid off, 5 backfired, 2 neutral): pitching changes 2, both paid off (Sanders in the bottom of the 5th, +0.83, escaped second and third; Higuera in the bottom of the 6th, +1.13, the fireman call that ended the inning on the strikeout and caught stealing), a pinch hitter (Cooper in the top of the 6th neutral, -0.23), a pinch runner (Gómez in the top of the 7th neutral, -0.22), defensive subs 2 (Surhoff at catcher in the bottom of the 7th paid off, +0.48; Oglivie in left field in the bottom of the 8th backfired, -1.77, the inning of Molitor&#x27;s error and San Diego&#x27;s two runs), hit and runs 2, both backfired (the top of the 1st, -0.76; the top of the 6th, -1.11), and steals 2, both backfired (the top of the 5th twice, -0.86 and -0.51, Turang held both times). Bruce Bochy graded 6 decisions (2 paid off, 4 backfired, 0 neutral): pitching changes 3 (Davis in the top of the 8th paid off, +0.73; Hoffman in the top of the 9th backfired, -1.77, the blown save; Gregerson in the top of the 9th paid off, +0.73, the win), hit and runs 2, both backfired (the bottom of the 5th, -1.13; the bottom of the 6th, -1.13, the strikeout and caught stealing), and a defensive sub (Sheffield at third base in the top of the 9th backfired, -1.52). Availability for Game 5 at Milwaukee: Andy Ashby (21 outs in this game), Corbin Burnes (14 outs) and Teddy Higuera (9 outs) are UNAVAILABLE; nobody on either staff finished in the 6-to-8-out band (next highest: Sanders, Davis and Gregerson at 3), so there are no caps and every other arm is free, Hoffman included after recording no outs. Managers: Pat Murphy (Milwaukee) and Bruce Bochy (San Diego). Venue is Petco Park, as printed.">
