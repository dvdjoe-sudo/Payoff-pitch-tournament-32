  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as the app scorecard PDF plus the full graded play-by-play text on 2026-10-29; official R1-07 Game 2 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Box score record: the two sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number. The decisions are not printed; they are derived from the play log (Kid Nichols pitched a complete game for Atlanta and took the win; Randy Jones took the loss, charged with 7 runs in 3 innings; no save situation arose). Nichols threw a 9-inning complete game: 9 hits, 3 earned runs, 1 walk, 6 strikeouts, no homers allowed. Bobby Cox made no pitching change and had no graded decision all game. Atlanta scored 3 in the 2nd on solo homers by Freddie Freeman and Andruw Jones and a Chipper Jones RBI single, and 4 in the 3rd on Dale Murphy&#x27;s RBI double and Ozzie Albies&#x27;s 3-run homer, all off Randy Jones. Joe Torre homered off Mark Davis in the 7th for the 8th run. San Diego scored all 3 of its runs in the 8th off Nichols: Mark Loretta&#x27;s RBI double, Tony Gwynn&#x27;s RBI single, and Ken Caminiti&#x27;s RBI single. San Diego used five relievers for one inning each after Jones: Heath Bell, Luke Gregerson, Mike Adams, Mark Davis, and Rollie Fingers. Bell threw the game&#x27;s only wild pitch, which the scorecard prints; the archive carries no wild pitch field, so it is recorded here only. The only sacrifice was Tony Gwynn&#x27;s Top 6 bunt, printed in the box as SH and carried in the SH column; no sacrifice flies anywhere in the play log, so SF is 0 for every batter. No hit batters anywhere in the play log, and the scorecard grid prints HBP 0 for all seven pitchers, so HB 0 for all 7 pitchers and HBP 0 for all 18 batters are sourced values carried in the tables below, and the homer, hit batter, and derived plate appearance checks run on real data. No errors by either club. No substitutions on either side; all 18 starters finished. Game 1 availability was honored: Greg Maddux and Jake Peavy, both unavailable off their Game 1 outs, did not pitch. Managers: Bobby Cox (Atlanta) and Bruce Bochy (San Diego). Venue is Truist Park. Atlanta leads the series 2-0.">
