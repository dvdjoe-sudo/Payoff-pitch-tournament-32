  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as four files on 2026-11-08: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), the full graded play-by-play text, and the scorecard CSV export; official W2-01 Game 5 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This is Winners Bracket Round 2, Series 1: the New York Yankees (seed 1) against the Oakland Athletics (seed 22), home pattern 2-2-1-1-1, Game 5 at Yankee Stadium, the series back in New York. The series entry was formed in the Game 1 booking and is not re-formed here. The series is tied 2-2, and the loser of this series takes its first series loss, not elimination. Box score record: the four sources carry the linescore, the full batting and pitching lines, the fielding lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Mike Stanton takes the win (1.1 IP, 0 H, 0 R, 0 ER, 0 BB, 0 SO): he entered in the Top 6 with two out and the bases loaded and Oakland leading 8-7, got Tejada&#x27;s groundout to end the inning, and threw a scoreless Top 7, so he was New York&#x27;s pitcher of record when New York retook the lead for good in the Bottom 7. Rick Honeycutt takes the loss (4.0 IP, 5 H, 3 R, 3 ER, 3 BB, 4 SO, 0 HR, 1 WP): he had been Oakland&#x27;s pitcher since the Bottom 5, he was its pitcher of record when Oakland took its 8-7 lead in the Top 6, and all three of New York&#x27;s Bottom 7 runs are charged to him, the go-ahead run among them, so the loss follows the go-ahead runs&#x27; charge, the book&#x27;s standing derivation; Barry Zito&#x27;s five charged runs came in the early innings, before Oakland ever led, and carry no decision. Mariano Rivera takes the save (1.0 IP, 1 H, 0 R, 0 ER, 0 BB, 1 SO): he pitched the full Top 9 with a 10-8 lead of two, the save on the lead-of-three-or-fewer plus at-least-one-inning prong, the same prong as Papelbon&#x27;s save in Game 4 of L1-01. The starters took no decisions. Andy Pettitte (4.2 IP, 7 H, 4 R, 4 ER, 2 BB, 0 HBP, 5 SO, 1 HR) left in the Top 5 with two out, a 7-3 lead, and McGwire at first, and Dave Righetti (1.0 IP, 1 H, 4 R, 4 ER, 6 BB, 2 SO, 0 HR) struck out Canseco to end the fifth, then walked four and gave up Henderson&#x27;s two-run single in the Top 6, all four sixth-inning runs charged to him. Barry Zito (2.0 IP, 5 H, 5 R, 5 ER, 3 BB, 2 SO, 0 HR) left in the Bottom 3 with nobody out and his two walked runners aboard, and Sean Doolittle (1.0 IP, 3 H, 2 R, 2 ER, 0 BB, 1 SO, 1 HR) is charged with DiMaggio, who singled off him, and Berra, whose three-run home run was hit off him, while Zito keeps Gehrig and Mantle from the home run&#x27;s scoring. Liam Hendriks (1.0 IP, 0 H, 0 R, 0 ER, 0 BB, 0 SO) threw a scoreless Bottom 4, and Sparky Lyle (1.0 IP, 1 H, 0 R, 0 ER, 0 BB, 1 SO) a scoreless Top 8 for New York. Run charges match the printed lines exactly: Oakland pitching allows 10 (Zito 5, Doolittle 2, Hendriks 0, Honeycutt 3), and New York pitching allows 8 (Pettitte 4, Righetti 4, Stanton 0, Lyle 0, Rivera 0). The duplicate test ran before the number was assigned: the series&#x27; four stored games are Game 1 (New York 8, Oakland 1), Game 2 (Oakland 6, New York 5), Game 3 (New York 6, Oakland 4 in 10 innings), and Game 4 (Oakland 3, New York 1), all with different linescores, so this box score takes Game 5. The game: New York scored two in the Bottom 1 on three doubles, Judge doubling, Ruth doubling him in, Gehrig flying out, and Mantle doubling Ruth in. Oakland&#x27;s Top 1 single died on Bando&#x27;s double play. Berra doubled in the Bottom 2 and Randolph singled him in for 3-0. Ellis hit a solo home run off Pettitte in the Top 3. New York scored four in the Bottom 3: Gehrig and Mantle walked off Zito, Doolittle came in, DiMaggio singled Gehrig home, Rodriguez struck out, and Berra hit a three-run home run for 7-1. Murphy singled McGwire in off Pettitte in the Top 4 for 7-2. Oakland scored two in the Top 5: Ellis singled, Henderson walked, Bando struck out, Jackson singled Ellis in with Henderson taking third, and McGwire&#x27;s fielder&#x27;s choice, forcing Jackson at second, scored Henderson; Righetti struck out Canseco to end it at 7-4. Oakland scored four in the Top 6 off Righetti to lead 8-7: Murphy, Steinbach, and Ellis walked, Henderson singled Murphy and Steinbach home, Bando walked, Jackson struck out, and McGwire and Canseco walked in Ellis and Henderson; Stanton came in and got Tejada&#x27;s groundout with the bases loaded. New York went scoreless in the Bottom 6 despite Jeter&#x27;s single, Judge&#x27;s walk, and Ruth&#x27;s sacrifice bunt putting runners at second and third, and Stanton held the Top 7 in order. New York retook the lead with three in the Bottom 7 off Honeycutt: DiMaggio walked, Rodriguez singled, Berra singled DiMaggio home to tie, Randolph&#x27;s sacrifice fly scored Rodriguez to lead, Jeter bunted Berra to second, and Judge singled him home for 10-8. Lyle held the Top 8 and Rivera the Top 9, Murphy&#x27;s two-out double the only mark against either. Berra finished with 3 hits, 3 runs, a double, the three-run home run, and 4 RBI. Ellis scored 3 of Oakland&#x27;s 8 runs. New York stranded 9 and Oakland 9. Home runs: two, Ellis (solo, Top 3, off Pettitte) and Berra (three-run, Bottom 3, off Doolittle). Doubles: six (New York five: Jeter, Judge, Ruth, Mantle, Berra; Oakland one: Murphy). Triples: none. Errors: none, an errorless game both ways; Games 1, 2, and 4 were also errorless and Game 3 carried the series&#x27; only error, Tejada&#x27;s, so four of the five games have been errorless. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: one, Honeycutt, as the Gazette prints (WP: Rick Honeycutt 1); every other pitcher reads 0. Passed balls: none, the fielding tables printing PB 0 for both catchers, Berra and Steinbach. Sacrifices: three, Ruth&#x27;s sacrifice bunt in the Bottom 6, Jeter&#x27;s sacrifice bunt in the Bottom 7, and Randolph&#x27;s sacrifice fly in the Bottom 7; every other batter reads SH 0 and SF 0. Stolen bases: none; Williams sent Henderson in the Top 1 and the runner did not get a good jump and stayed put, so no steal is credited to anyone. Caught stealing: none. Double plays grounded into: one, Bando for Oakland in the Top 1, turned by Pettitte, Jeter, and Gehrig, New York&#x27;s one double play. Substitutions: New York made one, Bernie Williams replacing DiMaggio in center field for the Top 8 and walking in the Bottom 8, so New York prints ten batting lines; Oakland made none, printing nine. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Oakland PA is AB 36 plus BB 8, which is 44, and the outs plus runs plus stranded identity agrees (27 outs plus 8 runs plus 9 stranded is 44); New York PA is AB 34 plus BB 6 plus SH 2 plus SF 1, which is 43, and the identity agrees (24 outs plus 10 runs plus 9 stranded is 43). Batters faced tie to those totals: Oakland 44 PA against 44 New York BF (Pettitte 22, Righetti 10, Stanton 4, Lyle 4, Rivera 4), counted from the card, and New York 43 PA against 43 Oakland BF (Zito 14, Doolittle 6, Hendriks 3, Honeycutt 20). Strikeouts tie both ways: Oakland batting 9 against New York pitching 9 (Pettitte 5, Righetti 2, Stanton 0, Lyle 1, Rivera 1), and New York batting 7 against Oakland pitching 7 (Zito 2, Doolittle 1, Hendriks 0, Honeycutt 4). Printed RBI: Oakland 8 for 8 (Henderson 2, McGwire 2, Jackson 1, Canseco 1, Murphy 1, Ellis 1) and New York 10 for 10 (Berra 4, Randolph 2, Judge 1, Ruth 1, Mantle 1, DiMaggio 1); every run in the game carried an RBI. Availability: Game 4&#x27;s long starts sat out as required, Hudson (18 outs in Game 4) and Guidry (21) unavailable and both unused, and every arm used was free (Game 4 outs all under 6: Fingers 4, Eckersley 3, Doolittle 2, Rivera 3), all under the house outs convention (under 6 outs free, 6 to 8 outs capped at 3, 9 or more outs unavailable). For Game 6, Pettitte (14 outs) and Honeycutt (12 outs) are unavailable, Zito (6 outs) is capped at 3 outs, and every other arm used is free (Doolittle 3 outs, Hendriks 3, Righetti 3, Stanton 4, Lyle 3, Rivera 3). Fourteen decisions were graded. Dick Williams (Oakland) made 7 (3 paid off, 3 backfired, 1 neutral): the Top 1 steal backfired at -0.86 (Henderson did not get a good jump and stayed put, and the inning ended on the double play); the Bottom 3 change to Doolittle backfired at -2.81, the game&#x27;s worst grade (four runs scored in the rest of the inning, DiMaggio&#x27;s single and Berra&#x27;s three-run home run); the Bottom 3 leave-in of Doolittle paid off at +0.50 (Randolph grounded out and no more runs scored); the Bottom 4 change to Hendriks paid off at +0.73 (a scoreless inning); the Bottom 5 change to Honeycutt was neutral at +0.23 (DiMaggio singled, no runs scored); the Bottom 7 leave-in of Honeycutt backfired at -2.77 (all three Bottom 7 runs scored after DiMaggio&#x27;s leadoff walk); and the Bottom 8 leave-in of Honeycutt paid off at +0.73 (a scoreless inning). Casey Stengel (New York) made 7 (5 paid off, 1 backfired, 1 neutral): the Top 5 leave-in of Pettitte was neutral at -0.12 (McGwire reached on the fielder&#x27;s choice and one run scored in the rest of the inning); the Top 5 change to Righetti paid off at +0.47 (Canseco struck out to end the inning); the Top 6 leave-in of Righetti backfired at -0.50 (Canseco walked in the go-ahead run); the Top 6 change to Stanton paid off at +1.00, the game&#x27;s best grade (Tejada grounded out with the bases loaded to end the inning); the Top 8 change to Lyle paid off at +0.73 (a scoreless inning); the Top 8 defensive sub of Bernie Williams in center field paid off at +0.48 (a clean inning in the field); and the Top 9 change to Rivera paid off at +0.73 (a scoreless inning). Managers: Casey Stengel (New York) and Dick Williams (Oakland). Venue is Yankee Stadium. New York leads the series 3-2.">
