  <meta name="description" content="Losers Bracket, Round 1, Series 8, Game 3 at Rogers Centre, as the master export&#x27;s box score prints the venue. Toronto leads the series 2-1. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. The export&#x27;s own sections all agree with each other; one parent-brief label did not survive the cross-foot and the line was booked as the export prints: the brief&#x27;s plate-appearance formula grouped Tony Fernandez&#x27;s extra plate appearance as a sacrifice bunt, but the CSV batting line and his Rec batting array both read SH 0, SF 1 (PA 7), the play being his bottom-of-the-13th sacrifice fly (play row seq 126, coded &quot;SF9&quot;). A sacrifice fly and a sacrifice bunt each add one plate appearance, so Toronto&#x27;s total of 62 is unchanged. At 14 innings this is the longest game of the tournament so far, passing the 13-inning R1-04 Game 2 (the archive&#x27;s next-longest games are five 11-inning games). Decisions: Charlie Hough takes the win for Texas (1.1 IP, 6 BF, 1 H, 0 R, 1 BB, 3 SO), entering in the bottom of the 13th with two inherited runners and stranding both, then holding the 14th. Kevin Gausman takes the loss for Toronto (1.0 IP, 5 BF, 1 H, 1 R, 1 ER, 1 SO): the winning run he allowed prints as earned (see below). No save. Scoring: Toronto struck first in the bottom of the 1st (Alomar tripled and scored on Fernandez&#x27;s run-scoring groundout) and again in the bottom of the 3rd (Alomar singled, Fernandez walked, Donaldson&#x27;s single scored Alomar) to lead 2-0. Texas got on the board in the top of the 5th on back-to-back doubles by Beltre and Seager off Jimmy Key, then took the lead in the top of the 7th: Kinsler doubled, Alex Rodriguez walked, and Frank Howard hit a three-run home run off Key, the fatigued starter Gaston left in to open the inning (graded paid off only because the next batter made an out; the homer came two batters later). Toronto tied it in the bottom of the 8th on back-to-back solo home runs by Donaldson and Delgado off Fergie Jenkins, whom Washington left in fatigued (graded backfired, -1.15). Both bullpens then held through the 9th: Ward struck out three around Beltre&#x27;s double in the top of the 8th, Henke struck out the side in the top of the 9th, and Wetteland stranded White and Whitt after their one-out singles in the bottom of the 9th. The teams matched each other three straight times in extra innings. Top of the 10th: Howard and Palmeiro hit solo home runs off Roberto Osuna for a 6-4 Texas lead. Bottom of the 10th: with one out Donaldson reached on Palmeiro&#x27;s error at first (E3), and Delgado hit a two-run home run off Neftali Feliz; the play row&#x27;s steps mark Donaldson&#x27;s run unearned (he reached on the error), so Feliz&#x27;s line reads 2 R, 1 ER, and it is the only unearned run Toronto scored (Texas staff ER 8 against 9 runs). Zimmerman then struck out Bautista and Bell to end the inning. Top of the 12th: Alex Rodriguez homered off Scott Downs for a 7-6 lead. Bottom of the 12th: Fernandez doubled off Darold Knowles and Donaldson&#x27;s double scored him to tie it again. Top of the 13th: Beltre walked off Paul Quantrill, stole second with catcher Ernie Whitt&#x27;s throw sailing for an error (E2) that put him on third, and scored on Seager&#x27;s single; Kinsler singled and Alex Rodriguez&#x27;s single scored Seager for a 9-7 lead, both runs earned as printed (Quantrill 2 R, 2 ER). Bottom of the 13th: Bell singled off Jeff Russell, Barfield was hit by a pitch, White&#x27;s forceout moved Bell to third, Whitt&#x27;s single scored Bell, Alomar walked to load the bases, and Fernandez&#x27;s sacrifice fly scored White to tie it 9-9; Hough then relieved Russell, inherited the two runners, and struck out Donaldson to end the inning. The winner came in the top of the 14th off Gausman: Hamilton singled to left, stole second (graded paid off for Washington, +0.39), and took third on Juan Gonzalez&#x27;s groundout; with the infield in, Palmeiro&#x27;s grounder went to the defense chart and Alomar mishandled it (E4, play row seq 133), Palmeiro reaching and Hamilton scoring. The row carries 1 run and 0 RBIs and no unearned marker in its steps, and Gausman&#x27;s printed line charges him the run as earned, so the run books exactly as printed: no RBI, because the batter reached on the error and the run scored on the error play itself, and earned to Gausman, with Toronto&#x27;s staff ER total of 10 equal to Texas&#x27;s 10 runs. Palmeiro was then held on a steal attempt (graded backfired, -0.51), Beltre struck out, and Seager grounded out. In the bottom of the 14th Delgado doubled and Bautista was intentionally walked, but Hough struck out Bell and Barfield (both on the TOUGH rare play) and got White on a groundout to end the game. Frank Howard was the player of the game: 4 for 6 with two home runs, 4 RBIs, 2 runs and a walk. Alex Rodriguez went 2 for 5 with a home run, 2 RBIs, 2 runs and 2 walks; Beltre went 2 for 6 with two doubles, 2 runs and a stolen base; Seager drove in 2. For Toronto: Donaldson went 4 for 7 with a double, a home run, 3 RBIs and 2 runs; Delgado went 3 for 7 with two home runs and 3 RBIs; Alomar went 3 for 6 with a triple and 2 runs. Errors: Texas 1 (Palmeiro), Toronto 2 (Whitt, Alomar); team_errors reads TEX 1, TOR 2, confirmed by the play rows&#x27; rebuilt error count. Exactly one double play was turned (Ivan Rodriguez&#x27;s 5-4-3 in the top of the 11th off Eichhorn, play row seq 96, coded &quot;DP 5-4-3&quot;), and the printed lines credit it the same way (Ivan Rodriguez GIDP 1; Delgado, Alomar and Donaldson carry the fielding DP credits), so no GIDP adoption was needed and every gate passed outright. The defense object books putouts, assists and errors exactly as the printed fielding section carries them, DP credits and Hamilton&#x27;s outfield assist included. Stolen bases: Hamilton 1 (top of the 14th) and Beltre 1 (top of the 13th), both with Whitt catching; Whitt SBA 2, SB against 2, as printed. Wild pitches: none. Passed balls: none. Substitutes: none batted for either club; the only changes were on the mound. Fielding from the CSV&#x27;s printed fielding section: Texas 42 putouts and 15 assists (Ivan Rodriguez 21 putouts, Palmeiro 14 putouts; Kinsler 6 assists, Beltre 5 assists); Toronto 42 putouts and 13 assists (Whitt 20 putouts, Delgado 13 putouts; Alomar 5 assists). Counting checks: Texas plate appearances 63 (56 AB, 7 BB) equal Toronto&#x27;s 63 batters faced (Key 32, Ward 4, Henke 3, Osuna 5, Eichhorn 3, Downs 4, Quantrill 7, Gausman 5); Toronto plate appearances 62 (57 AB, 3 BB, 1 HBP, 1 SF) equal Texas&#x27;s 62 batters faced (Jenkins 32, Wetteland 5, Feliz 3, Zimmerman 5, Knowles 5, Russell 6, Hough 6). Hit, walk, home run and strikeout totals tie across the two boxes both ways (batting SO: TEX 19 = TOR staff 7+3+3+2+0+1+2+1; TOR 21 = TEX staff 7+3+0+5+2+0+3). Earned runs: Texas&#x27;s staff ER 8 against Toronto&#x27;s 9 runs, the one unearned run traced to Palmeiro&#x27;s error above; Toronto&#x27;s staff ER 10 = Texas&#x27;s 10 runs. Other pitching: Jenkins 8.0 IP, 32 BF, 7 H, 4 R, 4 ER, 1 BB, 7 SO, 2 HR in a no-decision; Key 7.0 IP, 32 BF, 6 H, 4 R, 4 ER, 5 BB, 7 SO, 1 HR in a no-decision; Zimmerman struck out all five batters he faced across the 10th and 11th (1.2 IP, 5 BF, 5 SO). The Rec&#x27;s extra line records blown saves for Feliz, Knowles and Russell (Texas) and an inherited-runners line for Hough (2 in, 0 scored). Availability compliance: Roy Halladay (18 outs in Game 2) and Yu Darvish (17 outs) were unavailable under the availability convention and neither pitched; neither appears anywhere in this game&#x27;s play rows. Manager grades, exactly as the export&#x27;s decisions summary prints: Cito Gaston graded 10 decisions (5 paid off, 4 backfired, 1 neutral): left pitcher in 3, all paid off (Key left in fatigued in the top of the 7th, +0.35; Osuna left in fatigued in the top of the 10th, +0.35; Quantrill left in fatigued in the top of the 13th, +0.73), and pitching changes 7 (Ward in the top of the 8th paid off, +0.73; Henke in the top of the 9th paid off, +0.73; Osuna in the top of the 10th backfired, -1.77, Howard&#x27;s home run the next batter and Palmeiro&#x27;s later in the inning; Eichhorn in the top of the 11th neutral, +0.23; Downs in the top of the 12th backfired, -0.77, Alex Rodriguez&#x27;s home run the next batter; Quantrill in the top of the 13th backfired, -1.27, two runs scored the rest of the inning; Gausman in the top of the 14th backfired, -0.77, the winning run scored the rest of the inning). Ron Washington graded 11 decisions (5 paid off, 6 backfired, 0 neutral): one left pitcher in (Jenkins left in fatigued in the bottom of the 8th backfired, -1.15, Donaldson&#x27;s home run the next batter and Delgado&#x27;s right after), pitching changes 6 (Wetteland in the bottom of the 9th paid off, +0.73; Feliz in the bottom of the 10th backfired, -1.27, two runs scored the rest of the inning; Zimmerman in the bottom of the 10th paid off, +0.50; Knowles in the bottom of the 12th backfired, -0.77, the tying run scored the rest of the inning; Russell in the bottom of the 13th backfired, -1.77, two runs scored the rest of the inning; Hough in the bottom of the 13th paid off, +0.68), and steals 4 (one send in the top of the 11th backfired, -0.51, runner held; Beltre sent in the top of the 13th paid off, +1.74, safe at second with Whitt&#x27;s throw sailing, and two runs scored the rest of the inning; Hamilton sent in the top of the 14th paid off, +0.39, safe at second and the winning run scored the rest of the inning; Palmeiro sent in the top of the 14th backfired, -0.51, runner held). Availability for Game 4 at Toronto, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Jimmy Key (21 outs) and Fergie Jenkins (24 outs) are UNAVAILABLE; every other arm on both staffs is free, nobody capped. Managers: Ron Washington (Texas) and Cito Gaston (Toronto). Venue is Rogers Centre, as printed.">
