  <title>W2-02-G4: San Francisco Giants 4, Kansas City Royals 3</title>
  <meta name="description" content="Winners Round 2, Series 2, Game 4 at Kansas City (Kauffman Stadium). Booked from the app export, played by Joe in the app: the Gazette scorecard PDF, the scorecard photo, the graded manager-decision log, the box score CSV (with its PLAYS (JSON) section) and the standalone plays JSON. San Francisco completes the sweep behind Tim Lincecum and two perfect innings of relief. The Giants wasted their early chances: Willie Mays singled to open the game and was caught stealing (Pérez to Witt), and John McGraw&#x27;s 2nd-inning hit and run and steal send both backfired. The breakthrough came in the 3rd off Zack Greinke: Mays singled, Will Clark doubled, Mel Ott&#x27;s double scored them both, and Barry Bonds doubled Ott home for 3-0. A fourth run came in the 6th off Steve Mingori: Willie McCovey singled, Jeff Kent&#x27;s hit-and-run single put him on third, and Buster Posey singled him home. Tim Lincecum takes the win: seven innings, four hits, two walks, five strikeouts, one wild pitch, and all three Kansas City runs charged to him, all at once in the 6th: Darrell Porter, pinch-hitting for Salvador Pérez, grounded out, Frank White flied out, Willie Wilson was hit by a pitch, Carlos Beltrán singled, and George Brett hit a three-run home run, the game&#x27;s only homer, to make it 4-3. McGraw twice left the fatigued Lincecum in and was paid off both times: Witt struck out to end the 6th, and Lincecum worked a scoreless 7th. Zack Greinke takes the loss, charged with the three 3rd-inning runs (eight hits and one walk in 22 batters faced). Rod Beck takes the save: he entered the 9th with a one-run lead and retired Brett, Bobby Witt Jr. and John Mayberry in order. Decisions: no source prints them (the Gazette carries no win/loss/save annotations and the export prints no decisions section), so they are derived from the play log and the run charges; Beck&#x27;s save follows the standard rule from his entry state (9th inning, 4-3 lead, one full inning pitched, finished the game). San Francisco&#x27;s last threat went unrewarded: in the 8th Posey singled and took second on Frank White&#x27;s error, the game&#x27;s only error, Matt Williams was intentionally walked and Art Fletcher sacrificed both runners over, but Mays struck out. Sergio Romo pitched a perfect 8th and Beck a perfect 9th. Bob Brenly (in at catcher for Posey from the 8th) and Monte Irvin (in at left field for Bonds in the 9th) were defensive substitutes who never batted and recorded no fielding chances, so neither carries a batting or defensive line, exactly as printed. San Francisco books four RBI for four runs (Ott 2, Bonds 1, Posey 1); Kansas City books three, all Brett&#x27;s. Fielding from the box score&#x27;s printed fielding section: San Francisco 27 putouts and 14 assists with no double plays; Kansas City 27 putouts and 12 assists with one double play, the 4-6-3 on Ott&#x27;s 9th-inning grounder (Witt to White to Mayberry), and Ott is printed with 1 GIDP. Caught stealing: Mays in the 1st, and Mike Sweeney in the 5th after his single on Yost&#x27;s hit and run, a play on which the lead runner Witt was thrown out. Wild pitch: Lincecum 1 for San Francisco; no passed balls. Manager grades: McGraw graded 11 decisions (8 paid off, 3 backfired, 0 neutral), his best-graded game of the series: the top-of-the-1st steal send (Mays caught stealing, -1.11), the top-of-the-2nd hit and run (-1.11) and the top-of-the-2nd steal send (Kent held, -0.51) backfired, and everything else paid off, the top-of-the-3rd steal send best at +2.14 (Mays held on the send, then the inning produced three runs), the top-of-the-6th hit and run +0.39, the two leave-Lincecum-in calls +0.35 and +0.73, the Romo and Beck changes +0.73 each, and the Brenly and Irvin defensive substitutions +0.48 each. Yost graded 7 (3 paid off, 4 backfired): Darrell Porter&#x27;s pinch hit graded +2.27, the best grade of the game (his groundout opened the three-run 6th), and the Quisenberry and Montgomery changes paid off at +0.73 each; the Mingori change backfired (-0.77, the 6th-inning run), the 5th-inning hit and run (-0.61, Witt thrown out on Sweeney&#x27;s single) and steal send (Sweeney caught stealing, -0.76) backfired, and the Mayberry pinch hit backfired (-0.73). Counting checks: San Francisco plate appearances 40 equal Kansas City batters faced (Greinke 22, Mingori 6, Quisenberry 4, Montgomery 8); Kansas City plate appearances 32 equal San Francisco batters faced (Lincecum 26, Romo 3, Beck 3). Hit, strikeout and walk totals tie across the two boxes both ways. San Francisco wins the series 4-0 and advances on the winners side; Kansas City takes its first series loss of the tournament and drops to the losers bracket, not eliminated.">
