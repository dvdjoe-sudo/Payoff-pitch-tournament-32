  <title>R1-01-G1: Miami Marlins 1, New York Yankees 8</title>
  <meta name="description" content="Played by Joe in the playable app and sent to the co-managed tournament games chat on 2026-11-08 as three files: the full graded play by play, the app scorecard PDF (the Payoff Pitch Gazette, Final Edition, Sunday, November 8, 2026), and the scorecard photo. Joe ruled in chat the same day: &quot;Use this replace Yankees vs Miami game 1,&quot; adopting this playing as the new R1-01 Game 1 under the R1-05, R1-06, and R1-10 Game 1 adoption precedents; the replaced game (New York 6, Miami 2; W Whitey Ford, L Josh Johnson, SV Goose Gossage) is preserved untouched in the Yankees records at archive/replaced/. R1-01 is a frozen series and cannot be edited by import, so the replacement was made as a guarded manual edit under Joe&#x27;s ruling, with the validator&#x27;s locked-game fingerprint and the pins the replaced game fed (its roll count, its seed expectation, the locked counting totals) reset under dated comments in validate_results.py. The R1-01 series entry and both club records are unchanged, the Yankees having won the replaced game as well, and the series carries no MVP, before or after. All three sources agree on every number: the linescore, the batting and pitching sums, plate appearances against batters faced for every pitcher (Miami 33 against Ford&#x27;s 30 and Robertson&#x27;s 3; New York 41 against Johnson&#x27;s 26, Ramos&#x27;s 8, Scott&#x27;s 3, and Cishek&#x27;s 4), and printed RBI (Miami 1 for 1, Yelich; New York 8 for 8). No seed is printed in any source, so rng_seed is 0, as in the R1-06 and R1-10 adoptions. The decisions are printed in the log: Whitey Ford takes the win (8.0 IP, 5 H, 1 R, 0 ER, 1 BB, 4 SO, 0 HR) and Josh Johnson the loss (4.2 IP, 7 H, 6 R, 6 ER, 5 BB, 5 SO, 1 HR); no save, David Robertson pitching a scoreless ninth with a seven-run lead. New York scored two in the 1st (Jeter&#x27;s double, Judge&#x27;s walk, Gehrig&#x27;s RBI single, Mantle&#x27;s bunt fielder&#x27;s choice forcing Judge at third, and DiMaggio&#x27;s RBI single), three in the 3rd (Gehrig and Mantle walked and DiMaggio hit a three-run home run), one in the 5th (Mantle and Rodriguez singled and Berra hit a sacrifice fly), and two in the 6th (Ruth and Gehrig walked and Mantle tripled both home). Miami&#x27;s only run came in the 3rd and was unearned: Realmuto struck out on Ford&#x27;s wild pitch and was thrown out at first, Castillo reached on Rodriguez&#x27;s error, stole third on McKeon&#x27;s graded steal call with Berra&#x27;s throw sailing for a second error, and scored on Yelich&#x27;s groundout. The game&#x27;s only home run is DiMaggio&#x27;s. Errors three: Rodriguez (E5) and Berra (E2) for New York, Ramirez (E6, Rodriguez reaching in the Bottom 3) for Miami. Hit batters none, printed 0 for both clubs on the scorecard (batter HBP 0 for every hitter and pitcher HB 0 for every pitcher), not a default. Wild pitches: Ford 1, as the log and the catching line print; passed balls none. Sacrifices: Ruth&#x27;s Bottom 8 bunt is the game&#x27;s only sacrifice hit (SH 1) and Berra&#x27;s Bottom 5 fly the only sacrifice fly. Grounded into double plays: Judge (Bottom 2) and Sheffield (Top 6), one each. Stolen bases: Castillo&#x27;s steal of third is the game&#x27;s only steal; no caught stealing. Substitutes: none; all 18 starters finished. Defensive lines are booked as a defense object in the established shape, a one-game exception at Joe&#x27;s express direction for this replay (he asked for the advanced stats and the defense from this game), departing from the R1-06 and R1-10 adoptions, which booked no defense object under his 2026-11-05 ruling that defensive tracking begins with Winners Round 2 and Losers Round 1 and is never backfilled for Round 1; no other Round 1 game changes, and New York&#x27;s 27 putouts and 9 assists and Miami&#x27;s 24 putouts and 10 assists are exactly the printed fielding tables. Graded decisions, narrated here because final_grades stays empty as in every imported game in this archive: Jack McKeon (Miami) 5 (3 paid off, 0 backfired, 2 neutral): the Top 3 steal paid off (+0.74), the Bottom 5 pitching change to Ramos was neutral (-0.03), the Bottom 6 leave-in of a fatigued Ramos paid off (+1.20), the Bottom 7 change to Scott paid off (+0.73), and the Bottom 8 change to Cishek was neutral (+0.23). Casey Stengel (New York) 1 (1 paid off): the Top 9 change to Robertson paid off (+0.73). Managers: Casey Stengel (New York) and Jack McKeon (Miami). Venue is Yankee Stadium. Availability: Game 2 is unaffected by the swap. Ford (23 outs in the replaced game, 24 here) and Johnson (18, then 14) were unavailable for Game 2 under either version and neither pitched in it, and every reliever who worked Game 2 was a free arm under both versions: Cishek threw 3 outs in each version, Alfonseca was free under the replaced game and does not appear in this one, and Robertson was free at 3 outs here and does not appear in the replaced one; Gossage&#x27;s replaced-game save leaves the book with the replaced game. New York leads the series 1-0.">
