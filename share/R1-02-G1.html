  <title>R1-02-G1: Washington Nationals 7, San Francisco Giants 12</title>
  <meta name="description" content="San Francisco won the adopted replay of Game 1, 12-7, and the series result is unchanged: the Giants still take R1-02 four games to one. Washington jumped on Christy Mathewson for five runs in the top of the first, but the Giants answered steadily and then broke the game open late. Matt Williams was the player of the game, going 2 for 4 with a triple, a home run, 4 RBI, and 3 runs scored. The decisive play was Willie Mays&#x27;s hit-and-run double in the bottom of the fifth. San Francisco&#x27;s six runs in the bottom of the sixth were all unearned off Tyler Clippard after Buster Posey reached on Ryan Zimmerman&#x27;s error to extend the inning. The bottom of the second run scored on Jeff Kent&#x27;s groundout after Willie McCovey singled and Wilson Ramos&#x27;s throwing error moved him along. Mathewson took the win despite the five-run first; Max Scherzer took the loss. Sean Doolittle stranded his one inherited runner for Washington and Hoyt Wilhelm stranded his one for San Francisco. There were no holds and no save.">
