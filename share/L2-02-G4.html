  <meta name="description" content="Losers Bracket, Round 2, Series 2, Game 4 at Olympic Stadium, as the master export&#x27;s box header and the Rec print the venue, &quot;OLYMPIC STADIUM (neutral)&quot;; the book carries the venue string exactly as the Rec prints it, neutral tag included, the same handling as Game 3. The L2-02 series was formed with Game 1: #7 Atlanta Braves (manager Bobby Cox) against #27 Montreal Expos (manager Dick Williams), home pattern Atlanta for Games 1, 2, 5 and 7, Montreal for Games 3, 4 and 6. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the narrative play log, the graded play-by-play with its manager decisions and decisions summary, and the full Rec JSON (W MON|smithbr01, L ATL|smoltjo01, SV MON|wettejo01; the Rec extra list carries two hold lines, for Jeff Reardon and Mel Rojas). The export&#x27;s filename and header date read 2026-11-22, but the Rec&#x27;s recorded stamp is 2026-11-22T00:34:41Z, 4:34 PM PT on 2026-11-21, and that is the played date the book carries. Montreal won 7-6; Montreal leads the series 3-1 and Atlanta faces elimination in Game 5. Decisions: Bryn Smith takes the win for Montreal (6.0 IP, 29 BF, 9 H, 5 R, 5 ER, 5 BB, 1 SO, 1 HR); John Smoltz takes the loss for Atlanta (5.0 IP, 23 BF, 9 H, 6 R, 6 ER, 0 BB, 4 SO, 3 HR); John Wetteland saves it with a perfect top of the 9th (1.0 IP, 3 BF). Jeff Reardon (1.0 IP, 3 BF, 1 SO) and Mel Rojas (1.0 IP, 4 BF, 1 H, 1 R, 1 ER, 1 SO, 1 HR) bridged the 7th and 8th for Montreal. Mike Remlinger (1.0 IP, 4 BF, 1 H, 1 R, 1 ER, 2 SO, 1 HR), Gene Garber (1.0 IP, 3 BF, perfect) and Raisel Iglesias (1.0 IP, 3 BF, 1 SO) finished for Atlanta. Player of the game: Andre Dawson, 3 for 4 with a home run, 3 runs scored and 1 RBI. Scoring: Atlanta jumped ahead in the top of the 1st on Rabbit Maranville&#x27;s leadoff home run, Ronald Acuna Jr.&#x27;s walk and Eddie Mathews&#x27;s RBI double, and Dale Murphy&#x27;s RBI single after walks to Del Crandall and Freddie Freeman, 3-0. The top of the 2nd made it 5-0, Maranville doubling, Chipper Jones doubling him home and Crandall doubling Jones home. Montreal&#x27;s bottom of the 2nd scored two: Gary Carter doubled, Dawson singled, Ron Fairly&#x27;s single scored Carter, Tim Wallach singled, and Orlando Cabrera&#x27;s sacrifice fly scored Dawson; the inning&#x27;s third out came on the same play, Fairly thrown out on the sacrifice fly (play row seq 23, coded SF7, the row recording outs 1 to 3 and its steps printing &quot;Ron Fairly is thrown out&quot;), 5-2. Jose Vidro&#x27;s solo home run in the bottom of the 3rd made it 5-3. The bottom of the 4th made it 5-4, Dawson and Fairly singling and Wallach&#x27;s sacrifice fly scoring Dawson. Montreal took the lead in the bottom of the 5th on back-to-back solo home runs by Rusty Staub and Vladimir Guerrero off Smoltz, 6-5. Dawson&#x27;s solo home run off Remlinger in the bottom of the 6th made it 7-5. Murphy&#x27;s solo home run off Rojas in the top of the 8th cut it to 7-6, and Wetteland retired Maranville, Jones and pinch-hitter Hank Aaron in order in the 9th. The extra list, exactly as printed: holds for Jeff Reardon (he entered the top of the 7th up 7-5 and retired the side in order) and Mel Rojas (he entered the top of the 8th up 7-5; Murphy&#x27;s home run cut the lead to one but the hold stands). No inherited-runner lines: every reliever on both clubs entered with the bases empty. No blown saves. Errors: none; the game was errorless, confirmed by the play rows&#x27; rebuilt error count (ATL 0 / MON 0), the printed fielding sections, the batting CSV&#x27;s E column and the Rec fld array alike. Double plays: three, all turned by Montreal: Ozzie Albies&#x27;s top of the 3rd grounder to third (row seq 26, coded &quot;DP 5-4-3&quot;), Andruw Jones&#x27;s top of the 5th grounder to third (row seq 43, coded &quot;DP 5-4-3&quot;) and Maranville&#x27;s top of the 6th grounder (row seq 50, coded &quot;DP&quot;; the play log prints it as a 1-6-3 double play), matching the printed GIDP 1 for each of the three batters and Montreal&#x27;s printed team DP 3 (Ron Fairly carries DP 3 in the fielding section as the chain&#x27;s first baseman, with Jose Vidro and Tim Wallach at 2 each and Bryn Smith and Orlando Cabrera at 1 each), so no GIDP-practice divergence arises. The bottom of the 2nd&#x27;s second run scored on a sacrifice fly that also produced a runner out on the bases (Fairly, seq 23): it is not a double play, no GIDP is charged, and the rows and the printed lines agree exactly as printed. Stolen bases: none attempted by either club; caught stealing: none. The catching lines as printed: Del Crandall, PB 0 and nothing against for Atlanta; Gary Carter and Brian Schneider, PB 0 and nothing against for Montreal. Defensive lines are booked in the established shape from the printed fielding section (Atlanta 24 putouts and 8 assists: Freeman 9 putouts at first, Crandall 7 putouts catching, Andruw Jones 5 putouts, Acuna 2 putouts and 1 assist with OFA 1 as printed, Mathews 1 putout and 3 assists, Maranville 4 assists; Montreal 27 putouts and 11 assists with DP 3: Fairly 11 putouts at first, Dawson 4 putouts, Vidro 3 putouts and 4 assists, Wallach 1 putout and 4 assists, Staub 2 putouts, Carter 2 putouts catching, Raines 2 putouts, Cabrera 1 putout and 2 assists, Schneider 1 putout, Smith 1 assist). Substitutes: Montreal: Brian Schneider (top of the 8th at catcher; struck out in his one plate appearance; 1 putout) and Mike Lansing (top of the 9th at second base; no plate appearance and no fielding line in the box score, the CSV fielding section or the Rec fld array, so none is booked for him, the same as Game 1). Atlanta: Hank Aaron (pinch-hit for Acuna in the top of the 9th and grounded out to third to end the game). Wild pitches: none. Passed balls: none. Hit by pitch: none. Counting checks: Atlanta plate appearances 39 (34 AB, 5 BB) equal Montreal&#x27;s 39 batters faced (Smith 29, Reardon 3, Rojas 4, Wetteland 3); Montreal plate appearances 33 (31 AB, 2 SF) equal Atlanta&#x27;s 33 batters faced (Smoltz 23, Remlinger 4, Garber 3, Iglesias 3). Hit, walk, home run and strikeout totals tie across the two boxes both ways (Atlanta batting strikeouts 3 = Smith 1 + Reardon 1 + Rojas 1; Montreal batting strikeouts 7 = Smoltz 4 + Remlinger 2 + Iglesias 1; Atlanta home runs 2 = Smith 1 (Maranville) + Rojas 1 (Murphy); Montreal home runs 4 = Smoltz 3 (Vidro, Staub, Guerrero) + Remlinger 1 (Dawson)). Team RBI equals team runs both ways (Atlanta 6, Montreal 7), and staff earned runs tie exactly both ways (Atlanta staff 7 ER against Montreal&#x27;s 7 runs; Montreal staff 6 ER against Atlanta&#x27;s 6 runs). Manager grades: the grades list names both managers directly, so no label mapping is needed. Bobby Cox graded 5 decisions (3 paid off, 2 backfired): 3 pitching changes (2 paid off: Garber for the 7th and Iglesias for the 8th, both scoreless; 1 backfired: Remlinger for the 6th, Dawson homered off him), 1 left-pitcher-in (paid off: Smoltz was left in during the bottom of the 5th and, after the back-to-back home runs, struck out Carter to end the inning with no further scoring) and 1 pinch hitter (backfired: Aaron grounded out to end the game). Dick Williams graded 5 decisions (3 paid off, 1 backfired, 1 neutral): 3 pitching changes (2 paid off: Reardon for the 7th and Wetteland for the 9th, both perfect; 1 neutral: Rojas for the 8th, Murphy homered off him but the lead held) and 2 defensive subs (1 paid off: Lansing at second base for the 9th, a clean inning; 1 backfired: Schneider at catcher for the 8th, graded down because Atlanta scored in the inning). Availability: Game 3&#x27;s unavailable pair, Warren Spahn (24 outs) and Dennis Martinez (11 outs), and its capped pair, Andy McGaffigan (7 outs) and Woodie Fryman (6 outs), appear nowhere in this game, and the Rec&#x27;s own unavailable block lists all four among its rest and house-rule entries. Game 5 availability, from this game&#x27;s outs: Bryn Smith (18 outs) and John Smoltz (15 outs) both threw 9 or more outs and are unavailable for Game 5; every other pitcher who appeared recorded exactly 3 outs and is free. Montreal leads the series 3-1 and stands 8-7 in games and 1-1 in series; Atlanta stands 8-7 in games and 1-1 in series and faces elimination in Game 5. The loser of this series is eliminated. Managers: Dick Williams (Montreal) and Bobby Cox (Atlanta). Venue is Olympic Stadium, printed &quot;OLYMPIC STADIUM (neutral)&quot; in the box header and the Rec alike.">
