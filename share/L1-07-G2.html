  <title>L1-07-G2: San Diego Padres 7, Milwaukee Brewers 10</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 7, Game 2 at American Family Field, as the master export&#x27;s box score prints the venue. The series was formed with Game 1&#x27;s booking: #23 Milwaukee Brewers (manager Pat Murphy) against #26 San Diego Padres (manager Bruce Bochy), home pattern Milwaukee for Games 1, 2, 5 and 7, San Diego for Games 3, 4 and 6. Both clubs carry one series loss, so the loser of the series is eliminated and the winner advances to Losers Round 2. San Diego won Game 1, 11-8; this game ties the series 1-1, and the series runs are dead even at 18-18. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every figure in the export agrees with itself across all of its sections. Decisions: Josh Hader takes the win for Milwaukee (1.1 IP, 5 BF, 0 H, 0 R, 1 BB, 3 SO). He entered in the top of the 6th with two out and a runner at second, finished that inning, held the 7th scoreless, and was the pitcher of record when Milwaukee took the lead for good in the bottom of the 6th. Randy Jones takes the loss for San Diego (5.0 IP, 26 BF, 8 H, 8 R, 8 ER, 3 BB, 4 SO, 3 HR): he started the bottom of the 6th as well and was charged with all four runs in it before Mike Adams relieved him. Jeremy Jeffress earns the save (1.0 IP, 3 BF, 0 H, 0 R, 1 SO): a scoreless top of the 9th with Milwaukee ahead 10-7. Scoring: San Diego scored two in the top of the 1st off Ben Sheets (Tatis walked; on Gwynn&#x27;s strike three the ball got away for a passed ball and Tatis advanced to second, Gwynn himself being retired with first base occupied; Winfield walked, Caminiti singled to load the bases, and Machado&#x27;s two-out single scored Tatis and Winfield; the play row&#x27;s own steps mark Tatis&#x27;s run unearned, the passed ball having put him in scoring position). Milwaukee scored one in the bottom of the 1st (Yelich leadoff home run off Jones). San Diego scored three in the top of the 3rd (Tenace three-run home run off Sheets). San Diego scored one in the top of the 4th: Loretta reached against Sheets, Dan Plesac relieved, and Winfield&#x27;s forceout at second scored Loretta, the run charged to Sheets. Milwaukee scored one in the bottom of the 4th (Fielder&#x27;s double on the hit-and-run scored Scott). Milwaukee scored two in the bottom of the 5th (Braun walked, stole second, and Yount hit a two-run home run). Milwaukee scored four in the bottom of the 6th, all off Jones (Fielder single, Contreras single, Jenkins run-scoring single, and Turang&#x27;s three-run home run, the decisive play of the game); Adams then entered and retired the side, striking out all three batters he faced in the game. San Diego scored one in the top of the 8th (Gwynn&#x27;s single off Rollie Fingers scored Tatis). Milwaukee scored two in the bottom of the 8th (Molitor&#x27;s double off Mark Davis scored Turang and Braun). Brice Turang was the player of the game: 1 for 3 with the three-run home run, 3 RBIs, 2 runs and a walk. Ben Sheets&#x27;s line (3.1 IP, 19 BF, 6 H, 6 R, 5 ER, 3 BB, 5 SO, 1 HR) carries the game&#x27;s only unearned run: Milwaukee&#x27;s staff earned-run total of 6 against San Diego&#x27;s 7 runs is exactly the passed-ball run traced above, while San Diego&#x27;s staff total of 10 ties Milwaukee&#x27;s 10 runs. The game was errorless, the only one of the series so far: neither club committed an error, after Milwaukee&#x27;s four in Game 1. One double play was turned: Winfield grounded into a 4-6-3 double play in the top of the 8th (Turang to Yount to Cooper, the credits as the fielding section prints them), and Winfield&#x27;s printed GIDP 1 matches the play rows&#x27; coded DP exactly. Stolen bases: Jenkins and Braun, one each, both against the Tenace battery (Tenace SBA 2, SB against 2, as the fielding section prints). Passed balls: Contreras 1 (the top of the 1st, above). Wild pitches: none. Rollie Fingers pitched the top of the 8th for Milwaukee only in this game (4 BF, 2 H, 1 R, 1 ER); his inning for each club was Game 1. Substitutes: B.J. Surhoff replaced Contreras at catcher in the top of the 7th and batted once; Cecil Cooper pinch-hit for Scott in the bottom of the 7th, struck out, and stayed in at first base; Ben Oglivie replaced Braun in left field in the top of the 8th and never batted, then Braun pinch-hit for Oglivie in the bottom of the 8th and walked; Gorman Thomas replaced Yelich in center field in the top of the 9th, never batted and had no fielding chance. Oglivie and Thomas carry no batting or fielding line, exactly as the export prints them. San Diego used its nine starters throughout. Fielding from the CSV&#x27;s printed fielding section: San Diego 24 putouts and 7 assists (Tenace 9 putouts; Machado 4 assists); Milwaukee 27 putouts and 10 assists (Contreras 7 putouts; Yount 4 assists, Molitor 3 assists, Turang 3 assists). Counting checks: San Diego plate appearances 42 (36 AB, 6 BB) equal Milwaukee&#x27;s 42 batters faced (Sheets 19, Plesac 8, Williams 3, Hader 5, Fingers 4, Jeffress 3); Milwaukee plate appearances 39 (33 AB, 6 BB) equal San Diego&#x27;s 39 batters faced (Jones 26, Adams 3, Bell 4, Davis 5, Gregerson 1). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Availability compliance in this game, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Teddy Higuera (12 outs in Game 1) was unavailable for Milwaukee and did not pitch; Andy Ashby (6 outs in Game 1) was capped at 3 outs for San Diego and did not pitch at all. Manager grades, exactly as the export&#x27;s decisions summary prints: Pat Murphy graded 15 decisions (9 paid off, 4 backfired, 2 neutral): pitching changes 5 (Plesac in the top of the 4th backfired, -0.59, the inherited runner scored in the inning; Williams in the top of the 6th paid off, +0.73; Hader in the top of the 6th paid off, +0.57; Fingers in the top of the 8th neutral, -0.27; Jeffress in the top of the 9th paid off, +0.73, the save), defensive subs 3 (Surhoff at catcher in the top of the 7th paid off, +0.48; Oglivie in left field in the top of the 8th backfired, -0.52; Thomas in center field in the top of the 9th paid off, +0.48), hit and runs 2, both paid off (bottom of the 4th, +0.39; bottom of the 8th, +0.87), pinch hitters 2 (Cooper in the bottom of the 7th backfired, -0.50, struck out; Braun in the bottom of the 8th paid off, +1.74, walked and scored), and steals 3 (bottom of the 1st backfired, -0.51, runner held; bottom of the 2nd neutral, -0.26, Jenkins safe; bottom of the 5th paid off, +1.39, Braun safe and scored on Yount&#x27;s home run). Bruce Bochy graded 5 decisions (3 paid off, 1 backfired, 1 neutral): pitching changes 4 (Adams in the bottom of the 6th paid off, +0.73, entered after Turang&#x27;s home run and struck out the side; Bell in the bottom of the 7th paid off, +0.73; Davis in the bottom of the 8th backfired, -1.27, two runs scored in the inning; Gregerson in the bottom of the 8th paid off, +0.57), and one hit and run (the top of the 4th neutral, -0.11). Availability for Game 3 at San Diego: Randy Jones (15 outs in this game) and Ben Sheets (10 outs) are UNAVAILABLE; nobody else on either staff reached 6 outs, so there are no caps and every other arm is free. Managers: Pat Murphy (Milwaukee) and Bruce Bochy (San Diego). Venue is American Family Field, as printed.">
