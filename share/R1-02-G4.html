  <meta name="description" content="San Francisco won the adopted replay of Game 4, 10-8, and the series result is unchanged: the Giants still take R1-02 four games to one. Willie Mays was the player of the game (2 for 5, two home runs, 3 RBI), and Matt Williams went 4 for 5, his two-run homer off Jon Rauch in the top of the 8th the decisive play. The lead changed hands all afternoon: Washington went ahead 8-7 in the 7th on back-to-back homers by Anthony Rendon and Ryan Zimmerman off Rod Beck (the blown save), but Gary Lavelle got the win with a scoreless 7th, Hoyt Wilhelm held the 8th, and Robb Nen saved it. Ryan Zimmerman went 4 for 5 in the loss. Washington&#x27;s eight runs carry seven printed RBI: Daniel Murphy scored on Gaylord Perry&#x27;s wild pitch in the 2nd.">
