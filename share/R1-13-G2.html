  <title>R1-13-G2: Los Angeles Angels 1, Cleveland Guardians 2</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-04: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-13 Game 2 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cleveland Guardians (seed 13) vs Los Angeles Angels (seed 20), home pattern 2-2-1-1-1, Game 2 at Progressive Field in Cleveland. One ordering note: Joe sent this game&#x27;s three files first today, before the files of the 3-2 game, and corrected the order himself in chat: this 2-1 game is Game 2, played second, and the 3-2 game is Game 1; the game numbers follow play order, Game 1 is already booked, and this game takes the series&#x27; next unplayed number. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number. One counting point is settled here and documented: batters faced for Los Angeles are counted from the play log, plate appearance by plate appearance, and the split reads Ryan 21 and Rodriguez 3. Ryan faced 3, 5, 3, 4, and 3 batters through the Bottom 5, then Speaker, Lajoie, and Thome in the Bottom 6 before his ejection, 21 in all, which is also what his printed line gives (16 outs plus 2 hits plus 3 walks plus 0 hit batters). Rodriguez faced Jackson, Belle, and Jose Ramirez in the Bottom 9, 3 in all (1 out plus 1 hit plus 1 hit batter). The decisions are not printed; they are derived from the play log and the run charges on the card. Cody Allen takes the win (1.0 IP, 0 H, 0 R, 2 SO): he pitched a scoreless Top 9 with the game tied 1-1 and was the pitcher of record when Cleveland walked it off. Francisco Rodriguez takes the loss (0.1 IP, 1 H, 1 ER, 1 HBP): in the Bottom 9 he retired Jackson, hit Belle, and gave up Jose Ramirez&#x27;s hit-and-run single, which scored Belle from first with the winning run. No save is credited in a walk-off win. The starters take no decisions: Nolan Ryan (5.1 IP, 2 H, 1 ER, 3 BB, 7 SO) left in the Bottom 6 after being ejected for arguing the Thome walk, with the game still scoreless on his side of the ledger at his exit and the tying run charged to him after it; Stan Coveleski (4.0 IP, 2 H, 1 R, 0 ER, 0 BB, 2 SO) left after four with the game scoreless, and the Angels&#x27; only run, unearned, was charged to him as his runner after Miller relieved. Run charges match the printed lines exactly: Cleveland pitching allows 1 + 0 + 0 + 0 + 0 = 1 (Coveleski the Top 5 run, unearned; Miller, Smith, Jones, and Allen none), and Los Angeles pitching allows 1 + 0 + 0 + 1 = 2 (Ryan the Bottom 6 run, Rodriguez the Bottom 9 run; Percival and Harvey none). The duplicate test ran before the number was assigned: the only stored game in the series is Game 1, a 3-2 Cleveland win on its own linescore (Los Angeles 2 0 0 0 0 0 0 0 0, Cleveland 0 0 0 3 0 0 0 0 x), and this box score, a 2-1 Cleveland win on a different linescore with different batting and pitching lines throughout, is no duplicate; it is the second game of the series in play order, booked as Game 2. The game: a scoreless duel through four. Ryan struck out the side in the Bottom 1 and seven in all, and Coveleski matched him before leaving after the Top 4. Los Angeles scored in the Top 5 without a hit: Joyner reached on Jose Ramirez&#x27;s error at third, Anderson reached on Coveleski&#x27;s error, Miller relieved, Grich sacrificed both runners up, and Joyner scored on Fregosi&#x27;s groundout, unearned, 1-0. Cleveland tied it in the Bottom 6: Speaker singled, Lajoie sacrificed, Thome walked, Ryan argued the call and was ejected, Percival hit Manny Ramirez to load the bases, and Jackson&#x27;s fielder&#x27;s choice scored Speaker, 1-1. Harvey held the Bottom 8, and Allen struck out two in a perfect Top 9. In the Bottom 9 Rodriguez got Jackson on a fly to center, hit Belle, and Jose Ramirez, with the hit and run on, singled to center and Belle scored from first to end it, 2-1. Cleveland stranded 7 and Los Angeles 4. Home runs: none. Doubles: two, Fregosi in the Top 3 for Los Angeles and Jackson in the Bottom 2 for Cleveland. Triples: none. Errors: two, both by Cleveland and both in the Top 5: Jose Ramirez at third on Joyner&#x27;s reach (E5) and Coveleski on Anderson&#x27;s reach (E1). The Gazette extras line names only Jose Ramirez; the grid&#x27;s error row (two in the fifth) and the log&#x27;s error by 3B and error by P plays settle Coveleski&#x27;s. Los Angeles played errorless ball. Hit batters: two, Manny Ramirez by Percival in the Bottom 6 and Belle by Rodriguez in the Bottom 9, so HB is carried for Percival (1) and Rodriguez (1) and 0 for Ryan, Harvey, and every Cleveland pitcher as card-sourced values, and the hit batter check runs on real data. Wild pitches: none. Passed balls: none. Sacrifices: two bunts, Grich in the Top 5 for Los Angeles and Lajoie in the Bottom 6 for Cleveland, so the split lines read SH 1 for Grich and Lajoie, SH 0 for every other batter, and SF 0 for every batter, log-proven (no sacrifice fly was hit). Stolen bases: none; Scioscia sent the runner three times and all three sends ended with the runner held. Caught stealing: none. Double plays grounded into, counted from the play log: one, Guerrero in the Top 1 for Los Angeles, matching the card extras. Substitutions: none for either club; each side used its starting nine and its listed pitchers only, and no substitute recorded a plate appearance. Batters faced are counted from the play log and tie to the batting PA totals both ways (Los Angeles 32 PA against 32 Cleveland BF: Coveleski 15, Miller 6, Smith 4, Jones 4, Allen 3; Cleveland 34 PA against 34 Los Angeles BF: Ryan 21, Percival 7, Harvey 3, Rodriguez 3). Los Angeles PA is AB 31 plus SH 1; Cleveland PA is AB 28 plus BB 3 plus HBP 2 plus SH 1. Cleveland recorded only 25 outs because the Bottom 9 ended on the walk-off single after one out. Strikeouts tie both ways: Los Angeles batting 7 against Cleveland pitching 7, Cleveland batting 8 against Los Angeles pitching 8. Twelve decisions were graded. Mike Scioscia made 6 (1 paid off, 3 backfired, 2 neutral): all three steal sends backfired, the Top 1 send at -0.51 with Trout held, and the two Top 7 sends at -0.86 and -0.51 with Glaus held at first both times; the Bottom 8 change to Harvey paid off at +0.73; the Bottom 9 change to Rodriguez was neutral at -0.27; and the Top 5 sacrifice bunt was neutral at -0.19. Terry Francona made 6 (4 paid off, 1 backfired, 1 neutral): the Bottom 9 hit and run paid off at +0.74, the game&#x27;s best grade, Jose Ramirez&#x27;s single scoring Belle from first for the walk-off; three of his four pitching changes paid off, Miller in the Top 5 at +0.69, Jones in the Top 8 at +0.73, and Allen in the Top 9 at +0.73, with the Top 7 change to Smith neutral at +0.23; and the Bottom 7 hit and run backfired at -0.76. Managers: Mike Scioscia (Los Angeles) and Terry Francona (Cleveland). Venue is Progressive Field. Availability compliance: Feller (24 outs in Game 1) and Finley (18 outs in Game 1) were unavailable under the house convention and correctly went unused; each club started its rotation number 2, Ryan for Los Angeles and Coveleski for Cleveland; Percival and Harvey, free after 3 outs each in Game 1, both pitched. Game 3 availability: Ryan (16 outs in Game 2) and Coveleski (12 outs) are UNAVAILABLE under the house convention, and the rotations turn to the number 3 starters in any case; Miller (6 outs) is capped at 3 outs; Percival (5 outs), Smith, Jones, Allen, and Harvey (3 outs each), and Rodriguez (1 out) are free. Cleveland leads the series 2-0. The series moves to Los Angeles for Game 3.">
