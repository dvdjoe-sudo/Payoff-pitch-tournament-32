  <meta name="description" content="Played by Joe in the playable app and sent to the co-managed tournament games chat on 2026-11-08 as a complete final game: the app scorecard (the Payoff Pitch Gazette, Final Edition, Sunday, November 8, 2026), the scorecard CSV export (line, batting, pitching, fielding, and play sections), the full graded play by play with Fielding tables and a Decisions summary, and the scorecard photo. Joe ruled in chat the same day: adopt it as the new R1-06 Game 1, replacing the booked Game 1 (Chicago 5, Montreal 4, seed 229154) under the R1-05 Game 1 adoption precedent; the replaced game is preserved untouched in the Cubs records at archive/replaced/. All four sources agree on every number: the linescore, the batting and pitching sums, plate appearances against batters faced for both pitchers, and printed RBI (Montreal 3 for 3, Chicago 5 for 5). No seed is printed in any of the four sources, so rng_seed is 0 as in Games 2 through 5 of this series. Fergie Jenkins and Steve Rogers both went the distance in a game called for heavy rain after the bottom of the 8th (the log&#x27;s rare play p22); the game is official, on the R1-12 Game 3 precedent. Chicago scored twice in the 2nd: Billy Williams singled and Hack Wilson hit a two-run homer. Chicago scored three times in the 5th: Ryne Sandberg singled and stole second, Ron Santo singled him home, and Sammy Sosa hit a two-run homer. Montreal&#x27;s three runs all came in the 6th: Orlando Cabrera walked, Tim Raines doubled him home, Jose Vidro popped out, Larry Walker bunted Raines to third, and Vladimir Guerrero hit a two-run homer. Errorless game. Larry Walker grounded into two double plays. Hit by pitch: none, printed 0 for both clubs on the scorecard and the CSV export (batter HBP 0 for every hitter and pitcher HB 0 for both starters), not a default. Wild pitches 0 and passed balls 0. Sacrifices: Walker&#x27;s 6th inning bunt is the game&#x27;s only sacrifice (SH 1); no sacrifice flies. Substitutes: none; all 18 starters finished. Graded decisions, narrated here because final_grades stays empty as in every imported game in this archive: Frank Chance 3 (2 paid off, 1 backfired, 0 neutral), the 2nd inning hit and run paid off (+1.24), the 3rd inning hit and run backfired (-0.76), and the 5th inning hit and run paid off (+2.24). Montreal&#x27;s one decision graded in the source under the label MON (you), leaving Rogers in for the 8th, paid off (+0.73); Joe played Montreal&#x27;s side in the app session, and the club&#x27;s book manager remains Dick Williams. Availability: Game 2 is unaffected by the swap. Jenkins and Rogers were unavailable for Game 2 under either version of Game 1 (19 outs in the replaced game, 24 in this one); Kerry Wood&#x27;s cap and Tim Burke&#x27;s line leave the book with the replaced game and neither pitched in Game 2; Bruce Sutter was a free arm under the replaced game (2 outs) and does not appear in this one, so his Game 2 appearance stands clean either way. Fielding lines are printed in the sources and are carried in the official record; no defense object is booked, under Joe&#x27;s 2026-11-05 ruling that defensive tracking begins with Winners Round 2 and Losers Round 1 and is never backfilled for Round 1.">
