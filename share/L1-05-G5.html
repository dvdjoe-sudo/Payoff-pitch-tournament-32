  <title>L1-05-G5: Colorado Rockies 7, Los Angeles Angels 2</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 5, Game 5 at Angel Stadium of Anaheim, as the master export&#x27;s box score prints the venue. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every source inside the export agrees on every figure booked. Decisions: Jhoulys Chacin takes the win for Colorado (7.0 IP, 29 BF, 5 H, 2 R, 2 ER, 3 BB, 5 SO). Mark Langston takes the loss for Los Angeles (5.2 IP, 25 BF, 9 H, 5 R, 5 ER, 5 SO, 1 HR). No save: Huston Street closed the bottom of the 9th scoreless with Colorado ahead 7-2, and the export&#x27;s report credits none. Scoring: Colorado scored one in the top of the 1st off Langston (Blackmon flyout, LeMahieu strikeout, Helton double, Arenado RBI single, Walker flyout). Los Angeles tied it in the bottom of the 1st off Chacin (Ohtani single and a steal of second, Trout strikeout, Guerrero flyout, Glaus RBI single, Joyner groundout). Colorado scored two in the top of the 2nd off Langston (Story flyout, Holliday groundout, Torrealba single, Tulowitzki two-run home run, Blackmon groundout). Colorado scored two in the top of the 6th: Story doubled and Holliday doubled him home off Langston; Percival then relieved and Torrealba singled Holliday home, that run charged to Langston as his fifth; Tulowitzki struck out to end the inning. Los Angeles scored one in the bottom of the 6th off Chacin (Trout walk and a steal of second, Guerrero groundout, Glaus RBI single, Joyner flyout, Edmonds strikeout). Colorado scored one in the top of the 7th off Percival (Helton solo home run with one out, between LeMahieu&#x27;s flyout and Arenado&#x27;s strikeout). Colorado scored one in the top of the 9th off Rodríguez (Torrealba single, two wild pitches during Tulowitzki&#x27;s at-bat moving Torrealba to third, Tulowitzki and Hampson strikeouts, LeMahieu RBI single, Helton groundout). Errorless game: neither club was charged with an error, and every run scored was earned, the earned-run totals tying to the runs both ways (Colorado&#x27;s staff 2, Los Angeles&#x27;s staff 7). The game&#x27;s only double play was Los Angeles&#x27;s, in the top of the 3rd: Walker grounded into a double play (4-6-3), with Joyner, Grich and Fregosi each credited in the printed fielding section. Stolen bases: Ohtani in the bottom of the 1st and Trout in the bottom of the 6th, both off Chacin and both against Torrealba, whose catching line prints 2 stolen bases against and no caught stealings. Wild pitches: Rodríguez 2, both in the top of the 9th during Tulowitzki&#x27;s at-bat, moving Torrealba from first to third ahead of LeMahieu&#x27;s RBI single. Passed balls: none for either club. Substitutes: Carlos González entered at left field in the bottom of the 7th for Holliday and flew out in his only at-bat (top of the 8th); Garrett Hampson entered at center field in the bottom of the 8th for Blackmon, struck out batting in the top of the 9th, and had no fielding chance, so he carries a batting line but no fielding line, exactly as the export prints him. Fielding from the CSV&#x27;s printed fielding section: Colorado 27 putouts and 9 assists (Helton 11 putouts; Story 5 assists); Los Angeles 27 putouts and 6 assists (Boone 10 putouts; Grich 3 assists, Fregosi 3). Counting checks: Colorado plate appearances 39 (39 AB) equal Los Angeles&#x27;s 39 batters faced (Langston 25, Percival 6, Harvey 3, Rodríguez 5); Los Angeles plate appearances 35 (31 AB, 3 BB, 1 SH) equal Colorado&#x27;s 35 batters faced (Chacin 29, Fuentes 3, Street 3). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Bud Black graded 4 decisions (4 paid off, 0 backfired, 0 neutral): defensive subs 2 (González at left field in the bottom of the 7th paid off, +0.48; Hampson at center field in the bottom of the 8th paid off, +0.48) and pitching changes 2 (Fuentes in the bottom of the 8th paid off, +0.73; Street in the bottom of the 9th paid off, +0.73). Mike Scioscia graded 6 decisions (3 paid off, 3 backfired, 0 neutral): steals 3 (the bottom of the 1st paid off, +0.39, Ohtani safe; the bottom of the 6th paid off, +0.39, Trout safe; the bottom of the 6th backfired, -0.51, Glaus held at first) and pitching changes 3 (Percival in the top of the 6th backfired, -0.93; Harvey in the top of the 8th paid off, +0.73; Rodríguez in the top of the 9th backfired, -0.77). Game 4&#x27;s availability was honored in this game: Jered Weaver (14 outs in Game 4, unavailable) did not pitch, and German Marquez (11 outs in Game 4) and Ubaldo Jimenez (12 outs in Game 4), both unavailable, did not pitch. Availability for Game 6 at Colorado (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; availability reads only the previous game and lasts exactly one game, so the Game 4 restrictions expire with this game): Los Angeles: Langston (17 outs) is unavailable; Percival (4 outs), Harvey (3) and Rodríguez (3) are free; every other Los Angeles arm is free, nobody capped. Colorado: Chacin (21 outs) is unavailable; Fuentes (3 outs) and Street (3) are free; every other Colorado arm is free, nobody capped. Managers: Mike Scioscia (Los Angeles) and Bud Black (Colorado). Venue is Angel Stadium of Anaheim, as printed.">
