  <title>R1-11-G5: Oakland Athletics 0, Philadelphia Phillies 2</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-02: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-11 Game 5 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Oakland Athletics (seed 22) vs Philadelphia Phillies (seed 11), home pattern 2-2-1-1-1, Game 5 at Citizens Bank Park in Philadelphia, and Oakland leads the series 3-2 with this Philadelphia win, the Phillies&#x27; second straight to stay alive. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number, with no run-accounting knot and no settlement needed. The decisions are not printed; they are derived from the play log and the run charges on the card. Steve Carlton takes the win: eight scoreless innings (8.0 IP, 3 H, 0 R, 5 BB, 6 SO), scattering three singles and five walks with Oakland stranding eight, and Philadelphia took the lead for good on Klein&#x27;s home run in the Bottom 4. This is Carlton&#x27;s second start of the series: he started Game 1, took the Game 5 turn in rotation, and is fully legal under the house availability convention, which restricts only the game after a long outing (his 22 outs in Game 1 made him unavailable for Game 2 only, and he did not pitch in Games 2 through 4). Barry Zito takes the loss: 5.0 IP, 2 H, 1 ER, 4 BB, 1 SO, 1 HR, his only run Klein&#x27;s solo home run in the Bottom 4. Jonathan Papelbon takes the save: he entered the Top 9 with a 2-0 lead, struck out Canseco and Tejada, allowed Murphy&#x27;s two-out single, and struck out Steinbach to end the game. Run charges match the printed lines exactly: Oakland pitching allows 1 + 1 + 0 + 0 = 2 (Zito one, Doolittle one, Bailey none, Honeycutt none), and Philadelphia pitching allows none (Carlton and Papelbon both scoreless). The charge detail: Zito&#x27;s one is Klein&#x27;s Bottom 4 home run; Doolittle&#x27;s one is Schmidt&#x27;s Bottom 6 home run. Printed RBI ties as printed with no settlement: Philadelphia 2 (Klein 1, Schmidt 1) against 2 runs, and Oakland 0 against 0 runs. The duplicate test ran before the number was assigned: the stored R1-11 games are Game 1 (Oakland 11, Philadelphia 5), Game 2 (Oakland 15, Philadelphia 11), Game 3 (Oakland 3, Philadelphia 2) and Game 4 (Philadelphia 5, Oakland 2), none sharing this game&#x27;s final score or linescore, so this box score is no duplicate, and this is the fifth game of the series in play order, booked as Game 5. The game: a three-hit shutout, and Philadelphia&#x27;s entire offense was two solo home runs and one single. Carlton loaded the bases with three straight two-out walks in the Top 1 and got Tejada to fly out; after that Oakland did not put a runner on third again until the Top 7, when Canseco and Tejada opened with singles to put runners at first and third, and Murphy popped out and Steinbach struck out before Ellis flied out, Oakland&#x27;s one real chance stranding both runners. Klein homered off Zito leading off the Bottom 4, Schmidt homered off Doolittle with one out in the Bottom 6, and Utley&#x27;s Bottom 4 single was Philadelphia&#x27;s only other hit. Oakland&#x27;s four hits were all singles (Canseco and Tejada in the seventh, Chavez in the eighth, Murphy in the ninth), and Papelbon struck out the side around Murphy&#x27;s hit in the ninth to end it. Home runs: Philadelphia two, Klein and Schmidt, both solo; Oakland none. Doubles and triples: none by either club; every non-home-run hit in the game was a single. Errors: none; both clubs played errorless ball. Hit batters: none; every pitcher&#x27;s HBP column on both grids reads zero and no batter on either side was hit, so HB 0 is carried for every pitcher as card-sourced values and the hit batter check runs on real data. Wild pitches: none. Sacrifices: none; there was no bunt and no sacrifice fly on either side, so the split lines read SH 0 and SF 0 for every batter, log-proven. Stolen bases and caught stealing: none; the printed SB and CS columns are 0 for both clubs. Dick Williams sent Henderson twice in the Top 3 and both sends were graded backfired, but the runner was held for a bad jump both times, so neither is a steal attempt on the record. Double plays grounded into, counted from the play log: two, Jackson for Oakland in the Top 3 (6-4-3) and Ashburn for Philadelphia in the Bottom 5 (6-4-3), exactly as the card extras read. Substitutions: none by either club; all nine starters on each side played the whole game. Philadelphia&#x27;s starting nine had Dick Allen as the designated hitter (0 for 2 with a walk) with Howard at first base and Harper out of the lineup, and Chavez started at third base again for Oakland with Bando rested. Batters faced are counted from the play log and tie to the batting PA totals both ways (Philadelphia 31 PA against 31 Oakland BF: Zito 20, Doolittle 5, Bailey 3, Honeycutt 3; Oakland 35 PA against 35 Philadelphia BF: Carlton 31, Papelbon 4). Philadelphia PA is AB 26 plus BB 5; Oakland PA is AB 30 plus BB 5. Six decisions were graded. Charlie Manuel made 1 (1 paid off, 0 backfired, 0 neutral): the Top 9 pitching change to Papelbon paid off at +0.73. Dick Williams made 5 (2 paid off, 2 backfired, 1 neutral): his two Top 3 steal sends backfired at -0.86 and -0.51 on held runners, the game&#x27;s two worst grades; the Bottom 6 change to Doolittle was neutral at -0.27 (he struck out Klein, then Schmidt homered); and the changes to Bailey for the Bottom 7 and to Honeycutt for the Bottom 8 paid off at +0.73 each. Managers: Dick Williams (Oakland) and Charlie Manuel (Philadelphia). Venue is Citizens Bank Park. Availability compliance: Hudson (15 outs in Game 4) and Schilling (24 outs) were unavailable under the house convention and correctly did not pitch, and Honeycutt (6 outs in Game 4) was capped at 3 outs and recorded exactly 3. Game 6 availability, under the house convention that reads only this game: Zito (15 outs) and Carlton (24 outs) are both UNAVAILABLE, and Doolittle (3 outs), Bailey (3), Honeycutt (3) and Papelbon (3) are all free. Zito was Oakland&#x27;s rotation number 5 making his first start of the series; the series goes back to Oakland for Game 6.">
