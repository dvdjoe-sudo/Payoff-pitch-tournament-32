  <title>R1-08-G1: Toronto Blue Jays 4, Pittsburgh Pirates 9</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as the app scorecard PDF plus the full graded play-by-play text on 2026-10-30; official R1-08 Game 1 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count, opening the series. Box score record: the two sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number. The decisions are not printed; they are derived from the play log (Paul Skenes pitched five scoreless innings and left with a 9-0 lead Pittsburgh never lost, taking the win; Dave Stieb was charged with all 8 first-inning runs and took the loss; no save). Pittsburgh scored 8 runs in the Bottom 1, all charged to Stieb in his one inning: Honus Wagner and Andrew McCutchen singled, Roberto Clemente doubled in a run, Barry Bonds reached on Josh Donaldson&#x27;s error as another run scored, Willie Stargell hit a sacrifice fly, Ralph Kiner reached on Jesse Barfield&#x27;s two-base right field error as Bonds scored, Manny Sanguillen singled, Pie Traynor hit a sacrifice fly, Bill Mazeroski and Wagner walked, and McCutchen doubled in three more before Clemente popped out to end it. The card charges Stieb only 3 earned runs of the 8; the two Toronto errors did the rest, and the tables below carry the card&#x27;s figures exactly as printed. Pittsburgh&#x27;s printed RBI total is 7, not 9: the two runs that scored on the error plays carry no RBI, exactly as the card prints it. Wagner&#x27;s RBI double in the Bottom 3 made it 9-0. Toronto scored twice in the 6th off Sam Leever (Carlos Delgado double), once in the 7th (Roberto Alomar single, the run charged to Leever before Roy Face entered and finished the inning), and once in the 8th off Face (Jose Bautista double scoring Delgado). Neither club hit a home run; Pittsburgh&#x27;s only extra-base hits were doubles by Wagner, McCutchen, and Clemente, and Toronto&#x27;s were doubles by Delgado and Bautista. Sacrifices: sacrifice flies by Stargell and Traynor, both in the 1st, and one sacrifice hit, Paul Waner&#x27;s Bottom 8 bunt. Alomar&#x27;s Top 3 bunt was a bunt double play and Honus Wagner&#x27;s Bottom 5 bunt was a fielder&#x27;s choice; neither is a sacrifice, and the tables carry them that way, with Alomar charged with two double plays on the day (the bunt double play and a Top 9 double play). Stolen bases and caught stealing: Alomar stole one base; Bonds was caught stealing once, a card-only entry the play log does not narrate (Bonds reached base three times and scored once). No hit batters: the scorecard grid prints HBP 0 for all eleven pitchers, so HB 0 for all 11 pitchers and HBP 0 for all 20 batters are card-sourced values carried in the tables below, and the homer, hit batter, and derived plate appearance checks run on real data. Two wild pitches are printed on the scorecard (Roberto Osuna in the 6th, Mark Melancon in the 9th); a wild pitch is not a stored archive field and is noted here only. Devon White&#x27;s Top 9 strikeout came on Melancon&#x27;s wild pitch and he reached first on it; the strikeout counts for both pitcher and batter exactly as the card prints it. One listing quirk in the sources, with nothing fixed over it: the scorecard&#x27;s Toronto batting summary lists Barfield 4th and Delgado 5th, while the play log&#x27;s batting order is Delgado 4th, Bautista 5th, Bell 6th, Barfield 7th; the tables below follow the play log&#x27;s order and every name resolves to its own complete line. Substitutions, Pittsburgh only: Paul Waner pinch-hit for Clemente in the Bottom 6 and stayed in right field, and Arky Vaughan pinch-hit for Wagner in the Bottom 7. All nine Toronto starters finished. This is the opening game of the series, so no prior-game availability limits applied; Kevin Gausman, Toronto&#x27;s rotation number 5, threw the final two innings in relief. Managers: Danny Murtaugh (Pittsburgh) and Cito Gaston (Toronto). Venue is PNC Park.">
