  <title>W2-06-G1: Minnesota Twins 5, Chicago Cubs 6</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 6, Game 1 at Wrigley Field. This booking forms the series in its archive slot: Chicago, the #6 seed, against Minnesota, the #12 seed, the reseeded Winners Round 2 pairing, with Chicago home for Games 1, 2, 5 and 7. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Lee Smith takes the win for Chicago (0.2 IP, 2 BF, 0 H, 1 SO): he came on in the top of the 10th with Goose Goslin at second and one out (1 inherited runner, 0 scored, per the Rec&#x27;s extra line), struck out Bob Allison and got Kent Hrbek on a groundout to strand him. Rick Aguilera takes the loss for Minnesota (0.0 IP, 1 BF, 1 H, 1 R, 1 ER, 1 HR): the only batter he faced, Billy Williams, led off the bottom of the 10th with the walk-off home run, the decisive play the export&#x27;s summary names. There is no save. Two blown saves are charged in the Rec&#x27;s extra line, both to Minnesota relievers. Jhoan Duran (0.2 IP, 3 BF, 1 H, 0 R; 2 inherited runners, 1 scored) entered in the bottom of the 8th with a 4-3 lead and Anthony Rizzo and Ron Santo, Walter Johnson&#x27;s runners, aboard, and Rizzo scored the tying run on Billy Williams&#x27;s single; the run is charged to Johnson, whose line reads 7.1 IP, 30 BF, 5 H, 4 R, 4 ER, 5 BB, 9 SO, so Duran&#x27;s own line shows no runs. Joe Nathan (1.0 IP, 7 BF, 3 H, 1 R, 1 ER, 1 HBP, 3 SO) entered in the bottom of the 9th with a 5-4 lead and gave up the tying run himself: Hack Wilson singled, Pete Crow-Armstrong&#x27;s hit-and-run single put Wilson at third, and Ryne Sandberg singled him home; Nathan then hit Rizzo to load the bases before striking out Santo and Sosa to send the game to extra innings. Scoring: Minnesota scored first in the top of the 2nd, Harmon Killebrew leading off with a home run; Tony Oliva then walked and was thrown out at home on Kent Hrbek&#x27;s double (Crow-Armstrong to Hartnett). Minnesota added two in the top of the 3rd: Rod Carew was hit by a pitch, Joe Mauer&#x27;s forceout erased him, Kirby Puckett doubled Mauer home, and Killebrew singled Puckett home (3-0). Chicago&#x27;s first run came in the bottom of the 6th: Crow-Armstrong walked, Sandberg&#x27;s groundout advanced him on the hit and run, and Rizzo singled him home (3-1). Carew&#x27;s leadoff home run in the top of the 7th made it 4-1. Chicago answered with two in the bottom of the 7th: Williams singled, Ernie Banks&#x27;s groundout advanced him on the hit and run, and Hack Wilson hit a two-run home run (4-3). The bottom of the 8th tied it at 4-4 on Williams&#x27;s single off Duran (above). Gary Gaetti&#x27;s leadoff home run in the top of the 9th off Fergie Jenkins, left in fatigued, put Minnesota back in front 5-4; the bottom of the 9th tied it again at 5-5 (above); and Williams&#x27;s walk-off home run opened the bottom of the 10th. Billy Williams is the export&#x27;s player of the game: 3 for 5 with the walk-off home run, 2 RBIs and 2 runs, and he also singled home the tying run in the 8th. Key lines: for Chicago, Hack Wilson 2 for 3 with the two-run home run, 2 runs, a walk and a stolen base; Rizzo 1 for 2 with an RBI, a run, 2 walks and a hit by pitch; Sandberg 2 for 5 with the game-tying RBI single in the 9th; and Fergie Jenkins went the first nine innings (9.0 IP, 39 BF, 12 H, 5 R, 5 ER, 2 BB, 1 HBP, 4 SO, 3 home runs allowed) and took a no-decision. For Minnesota, Joe Mauer 3 for 4 with a double and a run; Killebrew 2 for 4 with the home run, 2 RBIs, a walk and a run; Carew 1 for 4 with the solo home run, a hit by pitch and a run; and Walter Johnson&#x27;s start (7.1 IP, 30 BF, 5 H, 4 ER, 5 BB, 9 SO) went unrewarded. The game was errorless, and defensive lines are booked in the established shape from the printed fielding section (Minnesota 27 putouts and 6 assists, Mauer 9 putouts catching; Chicago 30 putouts and 15 assists, Rizzo 12 putouts, Sandberg 6 assists, Banks 4 assists). Chicago turned two double plays (Puckett&#x27;s top-of-the-1st grounder and Cronin&#x27;s top-of-the-8th grounder, both genuine double-play rows in the log and the game&#x27;s printed GIDPs for Minnesota); Minnesota turned one (Santo&#x27;s bottom-of-the-1st grounder, SS unassisted at 2nd to 1st, a genuine double-play row and Chicago&#x27;s only printed GIDP). Stolen bases: Hack Wilson off Mauer in the bottom of the 3rd, on the hit-and-run strikeout (Mauer&#x27;s catching line reads PB 0, 1 stolen base against, 0 caught stealing); Sandberg was caught stealing in the bottom of the 8th, Battey to Cronin (Battey&#x27;s catching line reads PB 0, 0 against, 1 caught). Wild pitches: none. Passed balls: none. Counting checks: Minnesota plate appearances 43 (39 AB, 2 BB, 1 HBP, 1 SH) equal Chicago&#x27;s 43 batters faced (Jenkins 39, Sutter 2, Smith 2); Chicago plate appearances 41 (35 AB, 5 BB, 1 HBP) equal Minnesota&#x27;s 41 batters faced (Johnson 30, Duran 3, Nathan 7, Aguilera 1). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Every run carries an RBI (Minnesota 5 runs on 5 RBIs, Chicago 6 on 6). Manager grades: the grades list names both managers directly, so no label mapping is needed. Frank Chance graded 12 decisions (5 paid off, 4 backfired, 3 neutral): five steals at 1 paid off, 2 backfired and 2 neutral, four hit and runs at 2 paid off, 1 backfired and 1 neutral, two pitching changes, both paid off (Sutter and Smith in the 10th), and leaving Jenkins in for the 9th backfired (Gaetti&#x27;s home run). Tom Kelly graded 5 decisions (0 paid off, 4 backfired, 1 neutral): three pitching changes at 0 paid off, 2 backfired and 1 neutral (Duran in the 8th neutral on the sheet, Nathan in the 9th and Aguilera in the 10th backfired), and two defensive subs, both backfired (Battey at catcher in the 8th, Allison in right field in the 9th). Availability for Game 2 under the convention: Fergie Jenkins (27 outs in this game) and Walter Johnson (22 outs) are unavailable; Bruce Sutter (1 out), Lee Smith (2), Jhoan Duran (2), Joe Nathan (3) and Rick Aguilera (0) are free. Chicago leads the series 1-0. Managers: Frank Chance (Chicago) and Tom Kelly (Minnesota). Venue is Wrigley Field, as printed.">
