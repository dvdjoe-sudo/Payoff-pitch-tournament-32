  <title>W2-02-G2: Kansas City Royals 1, San Francisco Giants 3</title>
  <meta name="description" content="Winners Round 2, Series 2, Game 2 at San Francisco. Booked from the app export, played by Joe in the app: the Gazette scorecard PDF, the scorecard photo, the graded manager-decision log, the box score CSV (with its PLAYS (JSON) section) and the standalone plays JSON. Carl Hubbell threw eight scoreless innings (3 hits, 1 walk, 8 strikeouts, 26 batters faced) and takes the win; Bret Saberhagen takes the loss, charged with San Francisco&#x27;s first two runs. Decisions: no source prints them (the Gazette carries no win/loss/save annotations and the export prints no decisions section), so they are derived from the play log and the run charges. The save is derived under the standard rule: Robb Nen entered the top of the 9th with a 3-0 lead, pitched exactly one inning and finished the game, which qualifies (a lead of three or fewer, at least one inning pitched, and not the winning pitcher); the log&#x27;s own narration calls him the closer brought in for the ninth. Run charges close exactly: the bottom-of-the-2nd run (Bonds doubled, McCovey singled him to third, and Bonds scored when Posey&#x27;s grounder forced McCovey at second, Posey credited with the RBI) and Willie Mays&#x27;s solo home run in the bottom of the 3rd, the game&#x27;s only homer, are charged to Saberhagen; the bottom-of-the-8th run (Mays doubled off Kelvin Herrera, Mel Ott singled him in) is charged to Herrera; Kansas City&#x27;s top-of-the-9th run (Frank White walked, was forced at second by Wilson, Wilson stole second on Ned Yost&#x27;s send and scored on George Brett&#x27;s two-out single) is charged to Nen, earned. San Francisco books three RBI for three runs (Posey 1, Mays 1, Ott 1). Settlement (2026-11-09): an audit flag suggested the export credited Buster Posey with a walk Kansas City&#x27;s pitching lines could not support. The graded log and the play rows settle it: Posey batted exactly three times (the bottom-of-the-2nd forceout, a bottom-of-the-4th groundout to first, a bottom-of-the-7th strikeout) and never walked; the only walk Kansas City allowed all game is Greg Holland&#x27;s to Barry Bonds in the bottom of the 6th, and the Gazette&#x27;s batting table likewise prints Posey with no walk. Posey is booked as printed in every source, AB 3 and BB 0, and San Francisco&#x27;s 31 plate appearances equal Kansas City&#x27;s 31 batters faced with no adjustment. The play rows were gated against the printed lines before staging, and one field failed: the rows rebuild Willie McCovey&#x27;s grounded-into-double-plays at 1 (his bottom-of-the-6th ground-ball double play on John McGraw&#x27;s hit and run, Bonds forced at second and McCovey out at first), while the printed line credits McCovey with 0. Every other batting and pitching field, the linescore, the run totals (3 and 1), the error totals (0 and 0) and the win-probability chain (residual 0.0) passed exactly, but the game is booked lines-only and the 72 rows are held out of the book pending a ruling on that one definition, the same treatment as Game 1&#x27;s Fletcher GIDP; if the rows are adopted later they attach verbatim. The game was errorless. Fielding from the box score&#x27;s printed fielding section: Kansas City 24 putouts and 9 assists; San Francisco 27 putouts and 10 assists; no wild pitches and no passed balls. Bob Brenly, McGraw&#x27;s top-of-the-8th defensive replacement at catcher for Posey, carries a defense line only (4 putouts, 1 assist, no plate appearance), with both Kansas City running plays against him: Hal McRae, who pinch-hit a single in the top of the 8th, was caught stealing on Yost&#x27;s hit and run, and Wilson stole second in the ninth. Monte Irvin, the top-of-the-9th defensive replacement in left field for Bonds, had no fielding chance and carries no line, exactly as printed. Manager grades: McGraw graded 5 decisions (1 paid off, 4 backfired): the Brenly substitution paid off (+0.48), while the bottom-of-the-4th steal send (-0.51), the bottom-of-the-6th hit and run that produced the McCovey double play (-0.76), the Nen change (-0.77, the worst grade of the game) and the Irvin substitution (-0.52) all backfired, and San Francisco won anyway. Yost graded 6 (3 paid off, 1 backfired, 2 neutral): the Holland and Soria changes (+0.73 each) and the top-of-the-9th steal send (+0.74) paid off; his top-of-the-8th hit and run backfired into the strikeout-caught-stealing double play (-0.76). Hubbell&#x27;s gem and Mays&#x27;s day (3 for 4, a double, the home run, both of San Francisco&#x27;s first two runs scored) decided it; Kansas City managed four hits and did not score until two outs in the ninth. Counting checks: Kansas City plate appearances 31 equal San Francisco batters faced (Hubbell 26, Nen 5); San Francisco plate appearances 31 equal Kansas City batters faced (Saberhagen 20, Holland 3, Soria 3, Herrera 5). Hit, strikeout and walk totals tie across the two boxes both ways. Availability for Game 3 at Kansas City, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): San Francisco: Hubbell (24 outs) is unavailable; Nen (3 outs) is free; Mathewson, who threw Game 1, is free again. Kansas City: Saberhagen (15 outs) is unavailable; Holland (3 outs), Soria (3) and Herrera (3) are free; Appier, who threw Game 1, is free again. Nobody is capped on either side. Play rows adopted on Joe&#x27;s ruling (2026-11-10): the 72 native rows are attached verbatim, staged at ~/workspace/plays-extract-2026-11-09/staged-W2-02-G2.plays.json (game tag set to &quot;G2&quot;; the raw export carried an empty tag), with the one definitional difference on the record: the rows rebuild Willie McCovey at 1 GIDP (his bottom-of-the-6th ground-ball double play on the hit and run) while the app&#x27;s printed batting line credits 0. Joe&#x27;s standing definition, ruled the same day: double plays count as they happened, and play rows are adopted when this definition is the only difference. The printed line in the book is unchanged.">
