 Cabrera doubled him home, and Conine&#x27;s single scored Cabrera, 6-4. The top of the 5th scored two off Anthony Bender: Brock walked, a wild pitch moved him up during McGwire&#x27;s at-bat (Bender&#x27;s WP 1, as printed), McGwire singled him home, Molina&#x27;s hit-and-run single put runners at the corners, and Smith&#x27;s forceout scored McGwire, 8-4. The top of the 7th, Molina singled off Jose Fernandez, Smith&#x27;s hit-and-run single moved him to third, and Musial singled him home, 9-4. The bottom of the 7th scored two off Lindy McDaniel, both unearned: Castillo reached on Ken Boyer&#x27;s error at third base and Gary Sheffield hit a two-run home run, 9-6; McDaniel is charged with no earned runs in the game (2.2 IP, 3 H, 2 R, 0 ER). The bottom of the 9th, Castillo walked off Isringhausen, stole second, and scored on Cabrera&#x27;s two-out single, 9-7. The extra list, booked exactly as printed: a hold for Lindy McDaniel (STL); inherited runners McDaniel 2 inherited / 0 scored (Cabrera and Ramirez, aboard when he relieved Wainwright in the bottom of the 6th) and Ramos 1/0 (Brock). No blown save is charged. Errors: two, both St. Louis: Boyer (E at 3B, bottom of the 7th) and Pujols (E at 1B, bottom of the 8th, Conine reached after Floyd&#x27;s single; it cost nothing), confirmed by the play rows&#x27; rebuilt error count (STL 2 / MIA 0); Miami was errorless. Miami&#x27;s staff earned-run total is 9, matching St. Louis&#x27;s 9 runs; St. Louis&#x27;s staff total is 5 against Miami&#x27;s 7 runs, the difference the two unearned runs in the 7th. Team RBI equals team runs both ways (St. Louis 9, Miami 7); no run lacks an RBI in this game. Double plays: three turned, each matching its printed GIDP line and its DP-coded play row, so no GIDP-practice divergence arises: Yelich grounded into a 4-6-3 double play in the bottom of the 5th, Ramirez a 6-4-3 in the bottom of the 8th, and Schoendienst a 6-4-3 in the top of the 9th; the fielding sections print DP 2 for St. Louis and DP 1 for Miami. Stolen bases: Smith (top of the 1st, off Willis and Realmuto) and Castillo (bottom of the 9th, off Isringhausen and Molina), one against each catcher, exactly as the catching lines print (Molina PB 0, SBA 1, SB 1, CS 0; Realmuto PB 0, SBA 1, SB 1, CS 0). Caught stealing: none. Defensive lines are booked in the established shape from the printed fielding section (St. Louis 27 putouts and 7 assists, Molina 9 putouts catching, Pujols 8 putouts with the error, Edmonds 4 putouts, Hornsby 3 assists, Boyer 2 putouts, 1 assist and the error; Miami 27 putouts and 7 assists, Conine 7 putouts at first, Realmuto 6 putouts catching, Yelich 5 putouts in center, Ramirez 1 putout and 3 assists, Cabrera 1 putout and 2 assists, Castillo 1 putout and 2 assists). Substitutes: Joe Medwick pinch-hit for Brock in the top of the 6th and stayed in left field (0 for 2, a strikeout and a groundout; he recorded no fielding chance and carries no fielding line, exactly as printed); Red Schoendienst replaced Hornsby at second base in the bottom of the 8th (1 putout, 1 assist, and the top-of-the-9th double play against him at bat). Wild pitches: Bender 1 (top of the 5th). Passed balls: none. Hit by pitch: none. Counting checks: St. Louis plate appearances 48 (43 AB, 5 BB) equal Miami&#x27;s 48 batters faced (Willis 15, Ramos 3, Cishek 5, Bender 6, Scott 5, Fernandez 14); Miami plate appearances 42 (39 AB, 2 BB, 1 SF) equal St. Louis&#x27;s 42 batters faced (Wainwright 24, McDaniel 12, Isringhausen 6). Hit, walk, home run and strikeout totals tie across the two boxes both ways (St. Louis batting strikeouts 6 = Ramos 1 + Scott 2 + Fernandez 3; Miami batting strikeouts 9 = Wainwright 5 + McDaniel 2 + Isringhausen 2). Manager grades: the grades list names both managers directly, so no label mapping is needed. Tony La Russa graded 8 decisions (4 paid off, 3 backfired, 1 neutral): 2 steals (1 paid off, 1 backfired), 2 hit and runs (both paid off), 2 pitching changes (1 paid off, 1 backfired), 1 pinch hitter (backfired, Medwick) and 1 defensive sub (neutral, Schoendienst). Jack McKeon graded 7 decisions (4 paid off, 2 backfired, 1 neutral): 5 pitching changes (2 paid off, 2 backfired, 1 neutral), 1 left-pitcher-in (paid off) and 1 steal (paid off, Castillo in the 9th). Game 2 availability was honored: Dizzy Dean (19 outs in Game 2) and Sandy Alcantara (13 outs), both unavailable after Game 2, appear nowhere in this game; the export&#x27;s own pre-game unavailable list also names them. Game 4 availability, from this game&#x27;s outs: Adam Wainwright (16 outs) and Jose Fernandez (9 outs) threw 9 or more outs and are UNAVAILABLE for Game 4; Dontrelle Willis (6 outs) and Lindy McDaniel (8 outs) are CAPPED at 3 outs each; everyone else who pitched recorded 3 outs or fewer and is free. St. Louis leads the series 2-1 and Miami faces elimination in Game 4, at home. Series runs: St. Louis 32, Miami 17. St. Louis is 7-5 in games and 1-1 in series; Miami is 5-8 in games and 1-1 in series. The loser of this series is eliminated. Managers: Tony La Russa (St. Louis) and Jack McKeon (Miami). Venue is loanDepot Park, as printed.">
