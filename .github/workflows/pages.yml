name: Tournament site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scorecard tools
        run: python3 -m pip install -r requirements.txt
      - name: Validate the archive
        run: python3 scripts/validate_results.py
      - name: Verify the playable data file
        run: python3 scripts/verify_playable_data.py
      - name: Rebuild generated pages
        run: |
          python3 scripts/build_peak162.py
          python3 scripts/build_rosters.py
          python3 scripts/build_leaders.py
          python3 scripts/build_series_previews.py
          python3 scripts/build_bracket_image.py
      - name: Generated files match the commit
        run: git diff --exit-code

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Announce new finals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: python3 scripts/announce.py
