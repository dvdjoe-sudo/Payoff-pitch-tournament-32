  <title>W2-01-G4: New York Yankees 1, Oakland Athletics 3</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat on 2026-11-08 as the corrected set of three files: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the scorecard CSV export carrying the linescore, the full batting and pitching lines with batters faced and wild pitches, a full fielding section, and a structured play log; official W2-01 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. An earlier send the same day carried Game 3&#x27;s scorecard photo and graded play-by-play by mistake alongside a first copy of this game&#x27;s PDF; those crossed files were identified before anything was booked and were not used, and the corrected set&#x27;s PDF is identical to the first copy&#x27;s, so the first copy served as a cross-check only. This is Winners Bracket Round 2, Series 1: the New York Yankees (seed 1) against the Oakland Athletics (seed 22), home pattern 2-2-1-1-1, Game 4 at RingCentral Coliseum in Oakland. The series entry was formed in the Game 1 booking and is not re-formed here. New York leads the series 2-1, and the loser of this series takes its first series loss, not elimination. Box score record: the three sources carry the linescore, the full batting and pitching lines, the fielding lines, and a complete play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Tim Hudson takes the win (6.0 IP, 6 H, 1 R, 1 ER, 4 BB, 0 HBP, 5 SO, 0 HR): he left after six innings with a 3-1 lead that Oakland never lost, having completed five innings. Ron Guidry takes the loss (7.0 IP, 6 H, 3 R, 3 ER, 1 BB, 1 HBP, 6 SO, 1 HR): all three Oakland runs scored off him in the Bottom 5. Dennis Eckersley takes the save (1.0 IP, 2 H, 0 R, 0 ER, 0 BB, 3 SO, 0 HR): he pitched the full Top 9 with a 3-1 lead of two, the save on the lead-of-three-or-fewer plus at-least-one-inning prong. Oakland&#x27;s other relief ran Sean Doolittle (0.2 IP, 2 H, 0 R, 0 ER, 0 BB, 1 SO, 0 HR) and Rollie Fingers (1.1 IP, 0 H, 0 R, 0 ER, 1 BB, 3 SO, 0 HR), scoreless. Mariano Rivera (1.0 IP, 0 H, 0 R, 0 ER, 0 BB, 0 SO, 0 HR) threw a scoreless Bottom 8 for New York, entering after Bando&#x27;s hit by pitch put runners at first and second with nobody out and getting Jackson&#x27;s double play and Olson&#x27;s groundout. Run charges match the printed lines exactly: New York pitching allows 3 (Guidry 3, Rivera 0), and Oakland pitching allows 1 (Hudson 1, Doolittle 0, Fingers 0, Eckersley 0). The duplicate test ran before the number was assigned: the series&#x27; three stored games are Game 1 (New York 8, Oakland 1), Game 2 (Oakland 6, New York 5), and Game 3 (New York 6, Oakland 4 in 10 innings), all with different linescores, so this box score takes Game 4. The game: New York put pressure on Hudson all day and stranded 14 runners. In the Top 1, Jeter and Judge singled, Ruth&#x27;s bunt forced Judge at second, Gehrig&#x27;s forceout forced Ruth at second, and Mantle grounded out. New York&#x27;s only run came in the Top 3: Randolph singled, Jeter flied out, Judge singled, Ruth walked, and Gehrig&#x27;s sacrifice fly scored Randolph; Mantle struck out to end it. New York reached Hudson again in the fourth (DiMaggio&#x27;s single), the sixth (DiMaggio&#x27;s single and Berra&#x27;s walk), the seventh off Doolittle (Judge&#x27;s and Mantle&#x27;s singles around Fingers&#x27;s entry), and the ninth off Eckersley (Ruth&#x27;s and Gehrig&#x27;s singles), and scored no more. Oakland&#x27;s three runs came in the Bottom 5: Canseco led off with a home run, Tejada doubled, Murphy doubled Tejada home, Steinbach flied out, and Ellis&#x27;s sacrifice fly scored Murphy; Henderson&#x27;s single followed and Bando grounded out. Guidry finished seven innings, allowing nothing after the fifth. Rivera&#x27;s scoreless eighth kept it 3-1, and Eckersley struck out Judge to open the ninth, allowed the two singles, then struck out Mantle and DiMaggio to end the game. Oakland stranded 4. Home runs: one, Canseco (solo, Bottom 5, off Guidry). Doubles: two, Tejada and Murphy, both in the Bottom 5. Triples: none. Errors: none, an errorless game both ways. Hit batters: one, Bando by Guidry in the Bottom 8; HB 1 for Guidry and 0 for every other pitcher and HBP 1 for Bando and 0 for every other batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: none, the CSV printing WP 0 for all six pitchers. Passed balls: none, the fielding tables printing PB 0 for both catchers, Berra and Steinbach. Sacrifices: two sacrifice bunts (Berra in the Top 4 and Ruth in the Top 5, both fielded by Hudson) and two sacrifice flies (Gehrig in the Top 3, Ellis in the Bottom 5); Ruth&#x27;s Top 1 bunt was a fielder&#x27;s choice, the lead runner forced and the batter safe, an at-bat and not a sacrifice, so Ruth carries SH 1, not 2. Stolen bases: none. Caught stealing: none. Double plays grounded into: one, Jackson for Oakland in the Bottom 8, turned 5-4-3 by Rodriguez, Randolph, and Gehrig, New York&#x27;s one double play; Oakland turned none. Substitutions: Oakland made two defensive substitutions: Matt Olson replaced McGwire at first base for the Top 8 and batted once, so Oakland prints ten batting lines; Eric Chavez replaced Bando at third base for the Top 9, did not bat, and recorded no fielding chance, and is carried in this recap only. New York made no batting substitution and prints nine batting lines. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: New York PA is AB 34 plus BB 5 plus SH 2 plus SF 1, which is 42, and the outs plus runs plus stranded identity agrees (27 outs plus 1 run plus 14 stranded is 42); Oakland PA is AB 28 plus BB 1 plus HBP 1 plus SF 1, which is 31, and the identity agrees (24 outs plus 3 runs plus 4 stranded is 31). Batters faced tie to those totals: New York 42 PA against 42 Oakland BF (Hudson 28, Doolittle 4, Fingers 5, Eckersley 5), as the CSV prints, and Oakland 31 PA against 31 New York BF (Guidry 29, Rivera 2). Strikeouts tie both ways: New York batting 12 against Oakland pitching 12 (Hudson 5, Doolittle 1, Fingers 3, Eckersley 3), and Oakland batting 6 against New York pitching 6 (Guidry 6, Rivera 0). Printed RBI: New York 1 for 1 (Gehrig) and Oakland 3 for 3 (Canseco 1, Murphy 1, Ellis 1); every run in the game carried an RBI. Availability: Game 3&#x27;s long starts sat out as required, Gomez (19 outs in Game 3) and Stewart (17 outs) unavailable and both unused in Game 4, and every arm used was free (Game 3 outs: Gossage 5, Bailey 4, Hendriks 4, Robertson 3, Rivera 3, Doolittle 2, Eckersley 1, Fingers 1, Honeycutt 1), all under the house outs convention (under 6 outs free, 6 to 8 outs capped at 3, 9 or more outs unavailable). For Game 5, Hudson (18 outs) and Guidry (21 outs) are unavailable, and every reliever used is free (Fingers 4 outs, Eckersley 3, Rivera 3, Doolittle 2). No graded decisions are booked for this game: the corrected source set carried no graded play-by-play and no Decisions summary (no graded log was sent for Game 4), so there are no manager grades to record, following the R1-12 Game 3 precedent; the game&#x27;s manager_log is null, the same as every imported game. Defensive lines were built with this booking under Joe&#x27;s 2026-11-07 standing instruction: errors_by is empty in the established shape because the game was errorless, and a defense object in the established shape was added (Oakland 27 putouts and 4 assists, New York 24 putouts and 8 assists with Oakland batting only eight innings; Steinbach&#x27;s 12 catcher putouts are exactly New York&#x27;s 12 strikeouts, and Berra&#x27;s 7 are Oakland&#x27;s 6 strikeouts plus Ellis&#x27;s Bottom 3 popout to the catcher, with no caught stealing to adjust either tie; wild pitches true zeros for all six pitchers as the CSV prints, and passed balls true zeros for both catchers). Managers: Casey Stengel (New York) and Dick Williams (Oakland). Venue is RingCentral Coliseum. The series is tied 2-2.">
