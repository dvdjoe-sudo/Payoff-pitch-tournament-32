  <title>L1-08-G1: Toronto Blue Jays 9, Texas Rangers 3</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 8, Game 1 at Globe Life Field, as the master export&#x27;s box score prints the venue. This booking OPENS the series: the L1-08 slot (Losers Round 1, reseeded losers pool) was formed with this game, #24 Texas Rangers (manager Ron Washington) against #25 Toronto Blue Jays (manager Cito Gaston), home pattern Texas for Games 1, 2, 5 and 7, Toronto for Games 3, 4 and 6; the formation block stays as the shell carries it (rule reseed-high-vs-low, pool &quot;Losers of the 16 opening-round series&quot;, gate &quot;Round 1 is complete (all 16 opening series)&quot;), with the feeder labels as in the formed L1 entries. The pairing was verified against TOURNAMENT_SEEDS.md (Texas Rangers line: seed 24; Toronto Blue Jays line: seed 25) and the loser reseeding that fixed L1-01 through L1-07: Texas lost R1-09 to Cincinnati 4-3 and Toronto lost R1-08 to Pittsburgh 4-1. Both clubs carry one series loss into this series, so the loser of the series is eliminated and the winner advances to Losers Round 2. This is the last Losers Round 1 series to form. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every figure in the export agrees with itself across all of its sections. One parent-brief correction: the brief credited Roberto Alomar with 1 run; the export&#x27;s CSV, its Rec batting array and its printed box score all show Alomar with 0 runs, and Toronto&#x27;s nine runs are fully accounted for without him (Donaldson 1, Delgado 1, Bautista 1, Bell 1, Barfield 2, White 2, Whitt 1). Booked as the export prints. Decisions: Dave Stieb takes the win for Toronto (7.0 IP, 28 BF, 8 H, 3 R, 3 ER, 0 BB, 6 SO, 1 HR). Nolan Ryan takes the loss for Texas (6.0 IP, 32 BF, 11 H, 7 R, 7 ER, 2 BB, 1 HBP, 5 SO, 1 HR, 1 WP). No save: Duane Ward (1.0 IP, 3 BF, 1 SO) and Tom Henke (1.0 IP, 4 BF, 1 H, 2 SO) each threw a scoreless inning with Toronto ahead by six. Scoring: Toronto scored two in the top of the 4th (Bell single, Barfield two-run home run, the decisive play of the game), two in the top of the 6th with two out (White walked, Whitt&#x27;s triple scored him, Alomar&#x27;s single scored Whitt), and five in the top of the 7th (Donaldson single, Delgado single, Bautista&#x27;s run-scoring single off the fatigued Ryan; then Kern came in and, around a flyout and Whitt&#x27;s groundout, walked Barfield, gave up White&#x27;s three-run double, and walked Alomar, Fernandez and Donaldson, the last walk forcing in White; Kern was charged with two runs, Barfield&#x27;s and White&#x27;s, and Feliz then popped Delgado up to end the inning with the bases loaded). Texas scored two in the bottom of the 7th (Howard single, Hamilton single, Palmeiro&#x27;s two-run double on the hit and run) and one in the bottom of the 8th: Stieb, who had completed seven innings (21 outs), stayed in to face the first batter of the inning and Kinsler homered off him; Ward then entered and retired the next three, so all three of Stieb&#x27;s charged runs are accounted for in the log (two in the 7th, Kinsler&#x27;s homer in the 8th) with no inherited runner involved. Jesse Barfield was the player of the game: 2 for 4 with the two-run homer, 2 RBIs, 2 runs and a walk. Devon White went 1 for 4 with a double, 3 RBIs, 2 runs and a walk. Alomar went 3 for 5 with an RBI. For Texas: Palmeiro 3 for 4 with two doubles and 2 RBIs; Kinsler 2 for 4 with the home run and a stolen base. Errors: none by either club, an errorless game; errors_by is empty and team_errors reads TOR 0, TEX 0. One double play was turned: Beltre&#x27;s line-drive double play in the bottom of the 5th (Palmeiro aboard at first, two out; the play row, seq 40, is coded &quot;DP&quot; and reads &quot;trapped? Call stands: line-drive double play&quot;), but no printed batting line carries a GIDP and the printed fielding section carries no DP credits, so gate_bat&#x27;s only failure was Beltre&#x27;s GIDP (rows 1 vs printed 0) and the rows were adopted under Joe&#x27;s standing GIDP practice (2026-11-10: the play rows govern over the app&#x27;s printed GIDP definition; a double play counts however it happened, ground ball or line out; the printed line stays unchanged), the sixth case of the practice after Fletcher (W2-02 Game 1), McCovey (W2-02 Game 2), Valo (L1-03 Game 4), Yelich (L1-07 Game 3) and Tatis (L1-07 Game 6). Every other gate passed outright. The defense object books putouts, assists and errors exactly as the printed fielding section carries them (no DP credits, as printed). Stolen bases: Kinsler 1 (bottom of the 6th, off the Whitt battery); Beltre was caught stealing in the bottom of the 3rd (Whitt SBA 2, SB against 1, CS against 1, as the fielding section prints). Wild pitches: Ryan 1, and no run scored on it (all nine Toronto runs carry RBIs, as do all three Texas runs). Passed balls: none. Substitutes: none batted for either club; both starting lineups went the full game, and the only changes were on the mound. Fielding from the CSV&#x27;s printed fielding section: Toronto 27 putouts and 7 assists (Delgado 9 putouts, Whitt 9 putouts, Bell 5 putouts; Alomar 4 assists); Texas 27 putouts and 7 assists (Ivan Rodriguez 9 putouts, Palmeiro 6 putouts; Beltre 3 assists, Alex Rodriguez 3 assists). Counting checks: Toronto plate appearances 46 (39 AB, 6 BB, 1 HBP) equal Texas&#x27;s 46 batters faced (Ryan 32, Kern 7, Feliz 4, Wetteland 3); Texas plate appearances 35 (35 AB) equal Toronto&#x27;s 35 batters faced (Stieb 28, Ward 3, Henke 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways (batting SO: TOR 9 = TEX staff 5+0+3+1; TEX 9 = TOR staff 6+1+2). Earned runs tie exactly: Toronto&#x27;s staff ER 3 = Texas&#x27;s 3 runs; Texas&#x27;s staff ER 9 = Toronto&#x27;s 9 runs. Identity notes: Nolan Ryan pitches for Texas here (he also carries Houston and Los Angeles stints in the book), John Wetteland pitches for Texas here (he was Montreal&#x27;s closer in L1-06), and Alex Rodriguez plays shortstop for Texas (he also carries New York and Seattle stints); every line is booked keyed per (team, player_id) exactly as played and never merged. Manager grades, exactly as the export&#x27;s decisions summary prints: Ron Washington graded 8 decisions (3 paid off, 4 backfired, 1 neutral): left pitcher in 2, both backfired (Ryan left in fatigued in the top of the 6th, -0.90, one run scored the rest of the inning; Ryan left in fatigued in the top of the 7th, -4.77, five runs scored), pitching changes 3 (Kern in the top of the 7th backfired, -2.31, four runs scored the rest of the inning; Feliz in the top of the 7th paid off, +1.00, nothing scored with the bases loaded; Wetteland in the top of the 9th paid off, +0.73), steals 2 (Beltre sent in the bottom of the 3rd backfired, -0.76, caught stealing; Kinsler sent in the bottom of the 6th neutral, -0.26, safe at second), and one hit and run (the bottom of the 7th paid off, +1.37, Palmeiro&#x27;s two-run double). Cito Gaston graded 2 decisions, both pitching changes, both paid off (Ward in the bottom of the 8th, +0.73; Henke in the bottom of the 9th, +0.73). Availability for Game 2 at Texas, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game; a new series resets availability, so nothing carried over from Round 1): Dave Stieb (21 outs) and Nolan Ryan (18 outs) are UNAVAILABLE; every other arm on both staffs is free, nobody capped. Managers: Ron Washington (Texas) and Cito Gaston (Toronto). Venue is Globe Life Field, as printed.">
