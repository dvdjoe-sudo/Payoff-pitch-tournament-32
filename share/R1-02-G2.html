  <meta name="description" content="San Francisco won the adopted replay of Game 2, 6-0, and the series result is unchanged: the Giants still take R1-02 four games to one. Carl Hubbell and Hoyt Wilhelm combined on a seven-hit shutout: Hubbell worked five scoreless innings for the win and Wilhelm four more for the save, stranding both of his inherited runners. Barry Bonds was the player of the game, going 2 for 3 with a home run, 3 RBI, a run, a walk, and a stolen base. The decisive play was Mel Ott&#x27;s single in the bottom of the third. San Francisco scored three in the 3rd: Ott&#x27;s single scored Mays, a Strasburg wild pitch scored Clark during Bonds&#x27;s plate appearance, and Bonds&#x27;s single scored Ott. Bonds&#x27;s two-run homer in the 5th and Buster Posey&#x27;s homer in the 8th finished the scoring. Stephen Strasburg took the loss. The game was errorless, and Washington never scored.">
