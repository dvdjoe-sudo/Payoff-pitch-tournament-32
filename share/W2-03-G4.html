  <title>W2-03-G4: Boston Red Sox 16, Houston Astros 4</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 3, Game 4 at Minute Maid Park. Boston wins the series 4-0 and advances on the winners side; Houston drops to the losers bracket with its first series loss. Boston won Game 1 (3-1), Game 2 (6-5) and Game 3 (8-2). Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. A series master export Joe sent for the whole Red Sox-Astros series carries this same game as its Game 4 record, and the two exports agree in every field checked: the Game 4 Rec is identical between them in its batting, pitching and fielding arrays, its CSV block, its grades list and all 91 play rows, and the series export&#x27;s printed series totals match this book&#x27;s four games exactly, for every batter and pitcher on both clubs. Decisions: Smoky Joe Wood takes the win for Boston with a complete game (9.0 IP, 37 BF, 7 H, 4 R, 4 ER, 2 BB, 1 HBP, 11 SO, 3 HR). Nolan Ryan takes the loss for Houston (5.0 IP, 27 BF, 9 H, 6 R, 6 ER, 2 BB, 1 HBP, 6 SO, 0 HR). No save. Scoring: Boston scored in the top of the 1st on the play the report names decisive: Speaker and Pedroia singled and Ted Williams doubled both home. Three more came in the top of the 3rd off Ryan, all with two outs: Foxx&#x27;s single scored one, Boggs&#x27;s single scored one, and Garciaparra&#x27;s single scored one. In the top of the 5th, Boggs was hit by a pitch and Garciaparra doubled him home for 6-0. Houston&#x27;s first run came in the bottom of the 5th, Bregman&#x27;s solo home run off Wood. The eight-run top of the 6th ended it, and all eight runs are charged to Brad Lidge, who opened the inning in relief of Ryan and faced ten batters: Speaker walked, Pedroia struck out, Williams singled, Ortiz&#x27;s double scored Speaker, Foxx hit a three-run home run, Evans walked, Boggs sacrificed Evans to second, Garciaparra hit a two-run home run, Fisk singled, and Speaker hit a two-run home run; Ryan Pressly then came on and finished the inning. Boston&#x27;s last two runs came in the top of the 7th off Pressly: Foxx singled and Boggs hit a two-run home run. Houston&#x27;s last three runs: Bregman&#x27;s second solo home run and Alou&#x27;s solo home run in the bottom of the 7th, and in the bottom of the 9th Bregman walked, Correa singled, and Alou&#x27;s single scored Bregman. The export&#x27;s player of the game is Garciaparra: 3 for 4 with a double, a home run, 4 RBIs, a run and a walk. Key lines: for Boston, Speaker 3 for 5 with a home run, a double, 3 runs and 2 RBIs; Foxx 3 for 6 with a home run, 3 runs and 4 RBIs; Williams 3 for 6 with a double and 2 RBIs; Boggs 2 for 3 with a home run, 3 RBIs, a hit by pitch and the sacrifice bunt; Pedroia 3 for 5 with a double and 2 runs. For Houston, Bregman 2 for 3 with two home runs, 3 runs, 2 RBIs and a walk; Alou 2 for 4 with a home run and 2 RBIs; Correa 2 for 4 with a triple. Pitching lines of note: Wood struck out 11 and went the distance on 37 batters faced; Pressly 3.1 IP, 14 BF, 4 H, 2 ER, 4 SO, 1 HR, 2 WP; Lidge 0.2 IP, 10 BF, 6 H, 8 R, 8 ER, 2 BB, 1 SO, 3 HR. Errors: none, an errorless game for both clubs; the series&#x27; only errors remain Correa&#x27;s in Game 1 and Bregman&#x27;s and Garciaparra&#x27;s in Game 2. Double plays: none turned by either club, and no GIDP was printed for either side or coded in the rows, so no GIDP difference arises in this game. Stolen bases: none. Wild pitches: Pressly 2, as the printed pitching section carries them. Passed balls: none. The Rec carries no extra list for this game: Lidge opened the 6th inning fresh and Pressly entered with the bases empty, so no inherited runners figure in it. The defense object books putouts, assists and errors exactly as the printed fielding section carries them: Boston 27 putouts and 10 assists (Fisk 11 putouts, Ortiz 10 putouts, Boggs 5 assists, Garciaparra 1 putout and 4 assists), Houston 27 putouts and 8 assists (Biggio 11 putouts, Bagwell 10 putouts, Bregman 4 assists). Substitutes: none batted for either club; the only changes were on the mound, and Alou started for Houston in place of Cruz. Counting checks: Boston plate appearances 51 (45 AB, 4 BB, 1 HBP, 1 SH) equal Houston&#x27;s 51 batters faced (Ryan 27, Lidge 10, Pressly 14); Houston plate appearances 37 (34 AB, 2 BB, 1 HBP) equal Wood&#x27;s 37 batters faced. Hit, walk, hit-by-pitch, home run and strikeout totals tie across the two boxes both ways. Every run on both sides carries an RBI: Boston 16 runs on 16 RBIs, Houston 4 runs on 4 RBIs. Manager grades: A.J. Hinch graded 7 decisions (4 paid off, 2 backfired, 1 neutral): leaving his pitcher in five times went 4 paid off and 1 backfired (the backfire was leaving the fatigued Lidge in during the 6th, ahead of four more runs), and his two pitching changes split 1 backfired (Lidge to open the 6th) and 1 neutral (Pressly, mid-6th). Terry Francona graded 1 decision (1 paid off): leaving Wood in. Series graded totals: Hinch 22 decisions (12 paid off, 6 backfired, 4 neutral); Francona 6 (4 paid off, 1 backfired, 1 neutral). Availability compliance: Cy Young (27 outs in Game 3) and Dave Smith (9 outs) were unavailable under the availability convention and neither pitched; Mike Scott (7 outs) and Joe Sambito (6 outs) were capped at 3 outs and went unused, the caps honored. Series final: Boston wins 4-0. Series runs: Boston 33, Houston 12. Boston advances on the winners side at 8-3 in games and 2-0 in series; Houston drops to the losers bracket with one series loss, at 4-5 in games and 1-1 in series, not eliminated. Series MVP: the series export&#x27;s header names Nomar Garciaparra (8-for-14, 4 HR, 9 RBI, 4 R), and under Joe&#x27;s standing rule that the MVP from the export is the MVP, Garciaparra is booked as the series MVP in the archive series entry with his full computed line (8 for 14, 4 R, 1 2B, 4 HR, 9 RBI, .571); Ted Williams is booked as the runner-up (8 for 17, 5 R, 1 2B, 1 HR, 3 RBI, .471). Managers: Terry Francona (Boston) and A.J. Hinch (Houston). Venue is Minute Maid Park, as printed.">
