  <title>W2-02-G3: San Francisco Giants 10, Kansas City Royals 5</title>
  <meta name="description" content="Winners Round 2, Series 2, Game 3 at Kansas City (Kauffman Stadium). Booked from the app export, played by Joe in the app: the Gazette scorecard PDF, the scorecard photo, the graded manager-decision log, the box score CSV (with its PLAYS (JSON) section) and the standalone plays JSON. San Francisco&#x27;s 18-hit attack buried Kansas City early. Willie Mays doubled to open the game and Will Clark followed with a two-run home run. Three more scored in the 2nd: Mays&#x27;s two-run double on John McGraw&#x27;s hit and run (graded +2.37) scored Buster Posey and Art Fletcher, and Mel Ott singled Mays home. Jeff Kent&#x27;s double in the 3rd scored Willie McCovey to make it 6-0. Mark Gubicza takes the loss, charged with all six runs (9 hits and the Clark home run in 15 batters faced; McCovey and Kent both reached and scored off him to open the 3rd before Joakim Soria entered). Juan Marichal takes the win: eight innings, seven hits, no walks, eight strikeouts, and all five Kansas City runs charged to him, every one on a home run: Salvador Pérez&#x27;s two-run shot in the 2nd after Alex Gordon&#x27;s double, back-to-back solo homers by Danny Tartabull and Gordon in the 4th, and Tartabull&#x27;s second solo homer in the 6th. Decisions: no source prints them (the Gazette carries no win/loss/save annotations and the export prints no decisions section), so they are derived from the play log and the run charges. There is no save: Robb Nen pitched a scoreless 9th with a five-run lead, walking John Mayberry (who took second on Nen&#x27;s wild pitch) and striking out Darrell Porter to end it. San Francisco added one run in the 7th off Dan Quisenberry: Barry Bonds singled and was caught stealing (Pérez to Witt), McCovey doubled, Frankie Frisch pinch-ran for him and scored on Posey&#x27;s single after Kent&#x27;s single moved him to third. Three more scored in the 9th off David Cone, McGraw&#x27;s second hit and run producing Bonds&#x27;s two-run home run (+2.39, the best grade of the game), Frisch then tripling and scoring on Kent&#x27;s single. San Francisco books ten RBI for ten runs (Mays 2, Clark 2, Bonds 2, Kent 2, Ott 1, Posey 1). Kansas City used eight pitchers: Gubicza and seven relievers at exactly one inning each (Soria, Herrera, Mingori, Holland, Quisenberry, Cone, Montgomery). The game was errorless. Fielding from the box score&#x27;s printed fielding section: San Francisco 27 putouts and 7 assists with no double plays; Kansas City 27 putouts and 11 assists with two double plays, both 6-4-3 on Matt Williams grounders (the 7th, Witt to White to Mayberry; the 9th, Witt unassisted at second to Mayberry), and Williams is printed with 2 GIDP. Wild pitches: Soria 1 for Kansas City (the 3rd) and Nen 1 for San Francisco (the 9th); no passed balls. Bob Brenly, McGraw&#x27;s bottom-of-the-8th defensive replacement at catcher for Posey, walked in his only plate appearance in the 9th and caught the last two innings. Frisch stayed in McCovey&#x27;s DH slot and batted once, the 9th-inning triple. Manager grades: Yost graded 10 decisions (7 paid off, 3 backfired): six of his seven pitching changes paid off (Soria +0.85, Herrera +0.73, Mingori +0.73, Holland +0.73, Cone +0.73, Montgomery +0.61) and only the Quisenberry change backfired (-0.77); the Mayberry pinch hit paid off (+0.50), the Porter pinch hit backfired (-0.73), and his bottom-of-the-1st hit and run backfired (-0.76). McGraw graded 7 (4 paid off, 1 backfired, 2 neutral): both hit and runs paid off (+2.37 and +2.39, the two best grades of the game), the Frisch pinch run paid off (+0.59) and the Brenly substitution paid off (+0.48); the top-of-the-9th steal send backfired (-0.86, Kent held), the top-of-the-7th steal was neutral (-0.11, Bonds caught stealing) and the Nen change was neutral (+0.23). Counting checks: San Francisco plate appearances 45 equal Kansas City batters faced (Gubicza 15, Soria 4, Herrera 4, Mingori 4, Holland 3, Quisenberry 5, Cone 7, Montgomery 3); Kansas City plate appearances 35 equal San Francisco batters faced (Marichal 31, Nen 4). Hit, strikeout and walk totals tie across the two boxes both ways. Availability for Game 4 at Kansas City, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): San Francisco: Marichal (24 outs) is unavailable; Nen (3 outs) is free; Hubbell, shelved for Game 3, is free again. Kansas City: Gubicza (6 outs) is capped at 3 outs; Soria, Herrera, Mingori, Holland, Quisenberry, Cone and Montgomery (3 outs each) are free; Saberhagen and Appier are free again. San Francisco leads the series 3-0: one more win sweeps it, and a Kansas City series loss drops the Royals to the losers bracket with one series loss, not eliminated.">
