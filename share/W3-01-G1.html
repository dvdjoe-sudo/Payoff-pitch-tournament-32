r Miller 2/2 (Rodriguez and Berra, aboard when he relieved Feller with two out in the bottom of the 5th, both scoring on the Jeter double row), for Dave Righetti 2/1 (Lofton and Lajoie, aboard when he relieved Ford in the top of the 5th; Jackson&#x27;s single scored Lofton), and for Andy Pettitte 1/0 (Jackson, aboard when Pettitte relieved with two out in the top of the 9th, stranded). No holds. Errors: none, an errorless game both ways, confirmed by the play rows&#x27; rebuilt error count (CLE 0 / NYY 0), the printed fielding sections, the batting CSV&#x27;s E column and the Rec fld array alike, and team_errors reads CLE 0, NYY 0. Double plays: one per club, each matching its printed GIDP line: Ruth grounded into Cleveland&#x27;s in the bottom of the 1st (play row seq 5, coded &quot;DP 6-4-3&quot;; Boudreau, Lajoie and Thome each carry DP 1 in the fielding section as the chain&#x27;s fielders) and Jackson grounded into New York&#x27;s in the top of the 7th (row seq 71, coded &quot;DP 6-4-3&quot;; Jeter, Randolph and Gehrig each carry DP 1), so no GIDP-practice divergence arises. The bottom of the 3rd also produced two outs on one play that is not a double play: Randolph was forced at second on Jeter&#x27;s grounder with the batter safe at first; no GIDP is charged, exactly as printed. Stolen bases: none by either club; caught stealing: Jackson, thrown out at second in the top of the 2nd (row seq 8, run_event &quot;CS|CLE|jacksjo01&quot;, on Francona&#x27;s graded steal call). The catching lines as printed: Yogi Berra, PB 0, 1 steal attempt against, 0 stolen bases, 1 caught stealing (100%); Victor Martinez, PB 0 and nothing against. Defensive lines are booked in the established shape from the printed fielding section (Cleveland 24 putouts and 3 assists: Martinez 11 putouts catching, Lofton 3 putouts, Lajoie 3 putouts and 1 assist, Thome 3 putouts, Boudreau 1 putout and 1 assist, Jose Ramirez 1 putout and 1 assist, Belle 1 putout, Jackson 1 putout; New York 27 putouts and 8 assists: Gehrig 9 putouts at first, Berra 9 putouts and 1 assist catching, Jeter 2 putouts and 4 assists, Randolph 3 putouts and 2 assists, Judge 3 putouts, DiMaggio 1 putout, Rodriguez 1 assist). Substitutes: Bernie Williams replaced DiMaggio in center field for the top of the 7th (Stengel&#x27;s graded defensive sub) and grounded out in the bottom of the inning; he carries a batting line (0 for 1) but no fielding line in the box score, the CSV sections or the Rec arrays, so none is booked for him, exactly as printed. Cleveland used no substitutes. Wild pitches: one, Andrew Miller in the bottom of the 5th (inside play row seq 56, during Jeter&#x27;s plate appearance; Rodriguez scored on it), carried in Cleveland&#x27;s defense wp map as printed. Passed balls: none. Hit by pitch: none. Counting checks: Cleveland plate appearances 42 (37 AB, 5 BB) equal New York&#x27;s 42 batters faced (Ford 20, Righetti 21, Pettitte 1); New York plate appearances 47 (40 AB, 7 BB) equal Cleveland&#x27;s 47 batters faced (Feller 26, Miller 4, Wynn 17). Hit, walk, home run and strikeout totals tie across the two boxes both ways (Cleveland batting strikeouts 9 = Ford 5 + Righetti 4; New York batting strikeouts 10 = Feller 7 + Wynn 3; Cleveland home runs 2, both off Ford (Ramirez, Belle); New York home runs 3, all off Wynn (Berra, Ruth, Mantle)). Team RBI: Cleveland 10, equal to its runs; New York 14 against 15 runs (the wild-pitch run carries no RBI). Staff earned runs: Cleveland&#x27;s staff 15 ER against New York&#x27;s 15 runs, every run earned; New York&#x27;s staff 10 ER against Cleveland&#x27;s 10 runs, every run earned. Manager grades: the grades list names both managers directly, so no label mapping is needed. Terry Francona graded 9 decisions (4 paid off, 4 backfired, 1 neutral): 2 steals (1 paid off, 1 backfired: Jackson caught stealing in the 2nd), 2 hit and runs (both paid off), 2 pitching changes (1 backfired: Miller for the 5th; 1 neutral: Wynn for the 6th) and 3 left-pitcher-in (1 paid off, 2 backfired). Casey Stengel graded 5 decisions (4 paid off, 1 backfired): 2 pitching changes (both paid off: Righetti in the 5th and Pettitte in the 9th), 1 defensive sub (paid off: Bernie Williams in center field for the 7th) and 2 left-pitcher-in (1 paid off, 1 backfired). Availability was clean entering the series: a new series resets availability, so nothing carried in from W2-01 or W2-05, and the Rec&#x27;s own unavailable block is empty. Game 2 availability, from this game&#x27;s outs: Ford (12 outs), Feller (14 outs), Righetti (14 outs) and Wynn (9 outs) all threw 9 or more outs and are unavailable for Game 2; Miller (1 out) and Pettitte (1 out) are free. New York leads the series 1-0 and improves to 9-2 in games and 2-0 in series; Cleveland falls to 8-5 in games and stands 2-0 in series. The loser of this series drops to the losers bracket. Managers: Casey Stengel (New York) and Terry Francona (Cleveland). Venue is Yankee Stadium, as printed.">
