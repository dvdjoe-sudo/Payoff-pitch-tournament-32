  <title>L1-08-G2: Toronto Blue Jays 9, Texas Rangers 8</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 8, Game 2 at Globe Life Field, as the master export&#x27;s box score prints the venue. Toronto leads the series 2-0. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. The export&#x27;s own sections all agree with each other; two parent-brief figures did not survive the cross-foot and were booked as the export prints. First, the brief&#x27;s plate-appearance flag: the brief&#x27;s hand arithmetic gave Toronto 52 plate appearances (47 AB, 4 BB, and a sacrifice fly credited to Jesse Barfield) against a printed Texas total of 51 batters faced. There is no misprint in the export and no sacrifice fly in the game: the word &quot;sacrifice&quot; appears nowhere in the file, and Barfield&#x27;s line reads SF 0, GIDP 1 in the CSV, in his Rec batting array (PA 5) and in the printed box score (which lists &quot;GIDP: Jesse Barfield&quot;); the brief had transposed the last two batting columns. Toronto&#x27;s plate appearances are 51 (47 AB, 4 BB), tying Texas&#x27;s 51 batters faced exactly, and Toronto&#x27;s batter-stamped play rows also count 51; every Texas pitcher&#x27;s printed BF equals his play-row count (Darvish 26, Kern 7, Feliz 3, Zimmerman 9, Wetteland 6). The two component sums the brief flagged (outs plus hits plus walks falling one short of BF for Zimmerman and for Wetteland) are explained by exactly one reach-on-error apiece: Devon White&#x27;s E4 off Zimmerman in the top of the 9th (play row seq 88) and Carlos Delgado&#x27;s E5 off Wetteland in the top of the 10th (seq 99); a batter who reaches on an error adds a batters-faced with no hit, walk or out, and Darvish&#x27;s own arithmetic closes the same way once the second out of Barfield&#x27;s double play is counted. Second, the brief credited Roberto Osuna with 1 strikeout; the CSV, the Rec pitching array and the printed box score all read 0 (nobody struck out in his bottom-of-the-8th inning, whose only hit was Ivan Rodriguez&#x27;s home run), and Toronto&#x27;s staff strikeouts tie Texas&#x27;s batting strikeouts at 9 only with Osuna at 0. Booked 0. Decisions: Tom Henke takes the win for Toronto (1.0 IP, 4 BF, 1 H, 1 R, 1 ER, 1 SO, 1 HR) despite giving up Frank Howard&#x27;s game-tying home run in the bottom of the 9th. John Wetteland takes the loss for Texas (1.0 IP, 6 BF, 2 H, 1 R, 0 ER): the winning run he allowed was unearned (see below). Mark Eichhorn earns the save (1.0 IP, 4 BF, 1 H) with a scoreless bottom of the 10th. Scoring: Texas scored three in the bottom of the 2nd (Beltre&#x27;s run-scoring single, then Seager&#x27;s two-run single), one in the bottom of the 4th (Hamilton singled and scored on Juan Gonzalez&#x27;s double), and Toronto got on the board in the top of the 5th (Bautista walked, Bell singled, Barfield grounded into a 4-6-3 double play, and White&#x27;s double scored Bautista). Texas answered in the bottom of the 5th (Kinsler walked, advanced on Ivan Rodriguez&#x27;s groundout, and scored on Howard&#x27;s single) to lead 5-1. Toronto tied it with four in the top of the 6th off the fatigued Darvish: Fernandez singled and Donaldson hit a two-run home run; Delgado popped out; then, with two out, Bautista reached on Beltre&#x27;s error (E5, the would-be third out), Bell singled, Barfield&#x27;s single scored Bautista (unearned) and White&#x27;s single scored Bell (unearned), so Darvish&#x27;s line reads 5 runs but only 3 earned; Kern relieved and retired Whitt with two aboard, stranding both inherited runners. Texas went back ahead in the bottom of the 6th (Seager doubled and scored on Ivan Rodriguez&#x27;s double). Toronto took the lead in the top of the 8th: Feliz gave up a single to Barfield and, after White flied out, Ernie Whitt&#x27;s two-run home run; Zimmerman then finished the inning. Texas tied it in the bottom of the 8th on Ivan Rodriguez&#x27;s home run off Osuna. Toronto went ahead again in the top of the 9th on Delgado&#x27;s home run off Zimmerman, and Texas tied it again in the bottom of the 9th on Howard&#x27;s home run off Henke. The winner came in the top of the 10th off Wetteland: Alomar grounded out and Fernandez flied out; Donaldson singled to center with two out and held at first; Delgado&#x27;s grounder should have ended the inning, but Beltre&#x27;s throw was wild (E5, his second error of the game) and Delgado reached with Donaldson taking second; Bautista then singled to center and Donaldson scored. The play row&#x27;s own steps mark the run unearned, because the inning should have ended on Delgado&#x27;s grounder, while Bautista keeps the run batted in because his clean single drove the run home; Toronto&#x27;s printed RBIs therefore total 9, equal to its runs, even though the winning run is unearned. In the bottom of the 10th Eichhorn allowed only Seager&#x27;s single and stolen base. Ernie Whitt was the player of the game: 2 for 5 with a double, the two-run home run, 2 RBIs and a run. Donaldson went 2 for 6 with the two-run homer; Delgado homered; Bautista went 2 for 4 with 2 runs, a double, the winning RBI and 2 walks. For Texas: Hamilton went 4 for 5 with a double and 2 runs; Ivan Rodriguez went 2 for 6 with a double, a home run and 2 RBIs; Howard homered and drove in 2; Seager went 3 for 5 with a double, 2 RBIs and a stolen base. Errors: Texas 3 (Beltre 2, Kinsler 1), Toronto none; team_errors reads TOR 0, TEX 3, confirmed by the play rows&#x27; rebuilt error count. All three Toronto unearned runs trace to Texas errors: the two in the top of the 6th after Beltre&#x27;s first E5, and the winner in the 10th after his second; Kinsler&#x27;s E4 in the top of the 9th (White reaching) produced no run. One double play was turned (Barfield&#x27;s 4-6-3 in the top of the 5th, play row seq 34, coded &quot;DP&quot;), and the printed lines credit it the same way (Barfield GIDP 1; Palmeiro, Alex Rodriguez and Kinsler carry the fielding DP credits), so no GIDP adoption was needed and every gate passed outright. The defense object books putouts, assists and errors exactly as the printed fielding section carries them, DP credits included. Stolen bases: Seager 1 (bottom of the 10th, off the Whitt battery; Whitt SBA 1, SB against 1, as printed). Wild pitches: none. Passed balls: none. Substitutes: none batted for either club; the only changes were on the mound. Fielding from the CSV&#x27;s printed fielding section: Toronto 30 putouts and 10 assists, errorless (Delgado 11 putouts, Whitt 9 putouts; Alomar 4 assists, Donaldson 3 assists; Bell carries a range out); Texas 30 putouts and 12 assists (Palmeiro 10 putouts, Ivan Rodriguez 9 putouts; Alex Rodriguez 8 assists). Counting checks: Toronto plate appearances 51 (47 AB, 4 BB) equal Texas&#x27;s 51 batters faced (Darvish 26, Kern 7, Feliz 3, Zimmerman 9, Wetteland 6); Texas plate appearances 47 (44 AB, 3 BB) equal Toronto&#x27;s 47 batters faced (Halladay 30, Ward 5, Osuna 4, Henke 4, Eichhorn 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways (batting SO: TOR 9 = TEX staff 8+0+0+1+0; TEX 9 = TOR staff 6+2+0+1+0). Earned runs: Toronto&#x27;s staff ER 8 = Texas&#x27;s 8 runs; Texas&#x27;s staff ER 6 against Toronto&#x27;s 9 runs, the 3 unearned runs all traced to Texas errors above. Other pitching: Halladay 6.0 IP, 30 BF, 10 H, 6 R, 6 ER, 2 BB, 6 SO in a no-decision; Ward threw a scoreless 7th (1.0 IP, 5 BF, 1 H, 1 BB, 2 SO); Darvish 5.2 IP, 26 BF, 8 H, 5 R, 3 ER, 1 BB, 8 SO, 1 HR in a no-decision; Kern 1.1 scoreless IP (7 BF, 1 H, 2 BB, inherited 2 and stranded both). The Rec&#x27;s extra line records blown saves for Osuna and Henke (Toronto) and Feliz (Texas). Availability compliance: Dave Stieb (21 outs in Game 1) and Nolan Ryan (18 outs) were unavailable under the availability convention and neither pitched; neither appears anywhere in this game&#x27;s play rows. Manager grades, exactly as the export&#x27;s decisions summary prints: Ron Washington graded 8 decisions (3 paid off, 2 backfired, 3 neutral): pitching changes 4 (Kern in the top of the 6th paid off, +0.73; Feliz in the top of the 8th backfired, -1.77, Whitt&#x27;s two-run homer; Zimmerman in the top of the 8th paid off, +0.50; Wetteland in the top of the 10th neutral, -0.27), one left pitcher in (Darvish left in fatigued in the top of the 6th backfired, -1.50, two runs scored the rest of the inning), steals 2 (the bottom-of-the-2nd send paid off, +2.49, three runs scored the rest of the inning; Seager sent in the bottom of the 10th neutral, -0.26, safe at second), and one hit and run (the bottom of the 5th neutral, -0.11). Cito Gaston graded 5 decisions (3 paid off, 1 backfired, 1 neutral): pitching changes 4 (Ward in the bottom of the 7th paid off, +0.73; Osuna in the bottom of the 8th neutral, -0.27; Henke in the bottom of the 9th backfired, -0.77, Howard&#x27;s tying home run the next batter; Eichhorn in the bottom of the 10th paid off, +0.73) and one left pitcher in (Halladay left in fatigued in the bottom of the 6th paid off, +0.57). Availability for Game 3 at Toronto, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Roy Halladay (18 outs) and Yu Darvish (17 outs) are UNAVAILABLE; every other arm on both staffs is free, nobody capped. Managers: Ron Washington (Texas) and Cito Gaston (Toronto). Venue is Globe Life Field, as printed.">
