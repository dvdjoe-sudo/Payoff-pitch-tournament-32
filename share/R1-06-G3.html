  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as the app scorecard PDF plus the full graded play-by-play text on 2026-10-29; official R1-06 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Box score record: the two sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number. The decisions are not printed; they are derived from the play log (Rick Reuschel pitched eight innings, allowed two earned runs, and left up 5-2; Dennis Martinez left after six down 3-1 and Chicago never trailed or was tied after; Bruce Sutter recorded the final two outs of the 9th with a one-run lead after Lee Smith gave up Tim Wallach&#x27;s 2-run homer). Chicago scored in the 1st (Sammy Sosa single), twice in the 3rd (Ron Santo forceout, Sosa sacrifice fly), and twice in the 8th (Santo homer off Jeff Reardon, Hack Wilson groundout). Montreal scored in the 1st (Vladimir Guerrero double), the 7th (Orlando Cabrera single), and twice in the 9th (Wallach homer off Smith). Sacrifices are printed in the source: SH Ernie Banks, Pete Crow-Armstrong, and Tim Wallach; SF Sammy Sosa. The archive&#x27;s SAC column carries sacrifice hits and flies combined (the archive stores SF as folded into SAC for imported games), so SAC is 1 for Banks, Crow-Armstrong, Wallach, and Sosa, and the split is recorded in the official record file. Pitcher hit batters are not carried in either source and stay unrecorded; batter hit-by-pitch is 0 for every batter because the play log accounts for every plate appearance on both clubs (Chicago 39 PA, Montreal 37 PA) with no hit batter. The only error: Orlando Cabrera (SS), on Billy Williams&#x27;s Top 6 single. No substitutions on either side; all 18 starters finished. Anthony Rizzo started at first base for Chicago and Mark Grace did not appear. Game 2 availability was honored: Pedro Martinez and Mordecai Brown did not pitch. Venue is Stade Olympique, Montreal&#x27;s park in the fixture (the play-by-play header labels it &quot;(neutral)&quot;, a label quirk only).">
