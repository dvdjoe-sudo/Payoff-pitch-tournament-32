t sacrificed the runners to second and third, and Pujols walked to load the bases. During Edmonds&#x27;s plate appearance the ball got to the backstop (row seq 65, a rare play off the PATIENT chart): the export&#x27;s own steps print &quot;Passed ball: runners advance 1&quot; and &quot;Ken Boyer scores (unearned)&quot;, then &quot;Error, C Realmuto (wild throw)&quot; and &quot;Ozzie Smith scores (unearned)&quot;, Pujols taking third on the throw, before Edmonds completed the walk. The two runs are traced exactly as printed: the passed ball is Realmuto&#x27;s (his catching line prints PB 1 and the Rec extra list carries the PB line), the error is Realmuto&#x27;s (his fielding line prints E 1, the batting section&#x27;s E column carries the same 1, and the row carries errors 1, the rows&#x27; rebuilt count MIA 1 / STL 0), Edmonds is credited with no RBI (his printed RBI is 0 and St. Louis&#x27;s team RBI is 4 against 6 runs), and both runs are charged to Tanner Scott as unearned runs, half of his printed 4 R / 2 ER line; his other two charged runs, Pujols and Edmonds, scored earned on Medwick&#x27;s double. Willis then relieved Scott and Medwick, who had pinch-hit for Brock in the 6th, doubled home Pujols and Edmonds, 6-1. The extra list, exactly as printed: hold for Worrell (STL); inherited runners Scott 2/0 (Hornsby, who had walked, and Edmonds, hit by a pitch, the two runners aboard when Scott relieved Fernandez in the 6th, neither scored) and Willis 2/2 (Pujols and Edmonds, both scoring on Medwick&#x27;s double); passed ball Realmuto 1. No blown save is charged. Errors: one, Realmuto&#x27;s, above; St. Louis was errorless. Earned runs: Miami&#x27;s staff carries 4 ER against St. Louis&#x27;s 6 runs (the two backstop runs unearned) and St. Louis&#x27;s staff carries 1 ER, matching Miami&#x27;s run. Double plays: none turned by either club, no printed GIDP on either side and no DP-coded play row, so no GIDP-practice divergence arises; the fielding section prints DP 0 for both clubs. Ozzie Smith&#x27;s fielding line carries RO 1 and GDP 1 exactly as printed, from the top of the 8th, when Ramirez grounded out to short on a great play (Smith the assist, Pujols the putout, one out, row seq 73, coded 6-3); it is a fielding-section middle, not a double play. Stolen bases: none by either club (McKeon&#x27;s 1st-inning steal call left Yelich held). Caught stealing: none. The catching lines: Molina, PB 0 and nothing against; Realmuto, PB 1 (the bottom-of-the-7th backstop ball) and no stolen bases against. Defensive lines are booked in the established shape from the printed fielding section (Miami 24 putouts and 3 assists: Yelich 6 putouts, Realmuto 9 putouts catching with the error and the passed ball, Conine 3 putouts, Ramirez 2 putouts, Cabrera 2 putouts and 1 assist, Floyd 2 putouts, Castillo 1 assist, Scott 1 assist; Willis carries the game&#x27;s only wild pitch, thrown during McGwire&#x27;s bottom-of-the-7th at-bat, Medwick advancing to third on it; St. Louis 27 putouts and 7 assists: Edmonds 7 putouts, Molina 8 putouts catching, Pujols 7 putouts, Smith 2 putouts and 5 assists, Hornsby 1 putout and 1 assist, Boyer 1 putout and 1 assist, Musial 1 putout). Brock, Medwick and Schoendienst recorded no fielding chance and carry no line, exactly as printed. Substitutes: Medwick pinch-hit for Brock in the bottom of the 6th (struck out, then doubled home two in the 7th and stayed in left field); Schoendienst replaced Hornsby at second base in the top of the 7th and laid down the sacrifice bunt in the bottom of the inning; Miami used nine men. Hit by pitch: Edmonds, by Fernandez in the bottom of the 6th. Counting checks: St. Louis plate appearances 38 (28 AB, 8 BB, 1 HBP, 1 SH) equal Miami&#x27;s 38 batters faced (Fernandez 23, Scott 9, Willis 6); Miami plate appearances 37 (35 AB, 2 BB) equal St. Louis&#x27;s 37 batters faced (Carpenter 26, Worrell 3, McDaniel 8). Hit, walk, home run and strikeout totals tie across the two boxes both ways (St. Louis batting strikeouts 9 = Fernandez 6 + Scott 2 + Willis 1; Miami batting strikeouts 7 = Carpenter 4 + Worrell 2 + McDaniel 1; no home runs in the game). Manager grades: the grades list names both managers directly, so no label mapping is needed. Jack McKeon graded 3 decisions (1 paid off, 2 backfired, 0 neutral): 2 pitching changes (1 paid off, the move to Scott in the 6th; 1 backfired, the move to Willis in the 7th) and 1 steal (backfired, Yelich held in the 1st). Tony La Russa graded 4 decisions (2 paid off, 1 backfired, 1 neutral): 2 pitching changes (1 paid off, Worrell for the 7th; 1 neutral, McDaniel for the 8th), 1 defensive sub (paid off, Schoendienst) and 1 pinch hitter (backfired, Medwick struck out in the 6th before his 7th-inning double). Series graded totals: La Russa 31 (15 paid off, 12 backfired, 4 neutral), McKeon 32 (13 paid off, 14 backfired, 5 neutral). Game 4 availability was honored: Harry Brecheen (16 outs in Game 4), Ryan Helsley (11 outs), Josh Beckett (18 outs) and Antonio Alfonseca (9 outs), all unavailable after Game 4, appear nowhere in this game; McDaniel and Willis, who were capped for Game 4 only and sat it out, were free and both pitched. The series is complete, so no availability carries forward. Series MVP, named by the series export and booked under Joe&#x27;s standing rule (2026-11-15, the export MVP is the MVP): Ozzie Smith (St. Louis), 14 for 26, 5 R, 1 2B, 1 3B, 8 RBI, .538, the line verified against the book&#x27;s own series totals. Runner-up: Ken Boyer (St. Louis), 8 for 18, 7 R, 1 2B, 1 HR, 4 RBI, .444. Miami&#x27;s best bats in defeat: Miguel Cabrera and Giancarlo Stanton, each 8 for 21 and .381 (Cabrera 2 R, 1 2B, 2 RBIs; Stanton 3 R, 1 2B, 2 HR, 4 RBIs). St. Louis wins the series 4-1 and advances to Losers Round 3; Miami is eliminated, the ninth club out of the tournament. Series runs: St. Louis 47, Miami 19. St. Louis is 9-5 in games and 2-1 in series; Miami is 5-10 in games and 1-2 in series. Managers: Tony La Russa (St. Louis) and Jack McKeon (Miami). Venue is Busch Stadium, as printed.">
