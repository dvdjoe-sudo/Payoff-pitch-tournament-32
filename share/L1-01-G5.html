  <title>L1-01-G5: Miami Marlins 8, Philadelphia Phillies 2</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-08: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official L1-01 Game 5 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This is Losers Bracket Round 1, Series 1: the Miami Marlins (seed 32) against the Philadelphia Phillies (seed 11), home pattern 2-2-1-1-1, Game 5 at Citizens Bank Park in Philadelphia. Both clubs carry one series loss and the loser of this series is eliminated. Box score record: the three sources carry the linescore, the full batting and pitching lines, a complete graded play log with its own Fielding accounting, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Jose Fernandez takes the win (6.0 IP, 3 H, 0 R, 0 ER, 2 BB, 5 SO, 0 HR); he shut Philadelphia out for six innings and left with a 4-0 lead. Cole Hamels takes the loss (6.0 IP, 8 H, 6 R, 6 ER, 1 BB, 4 SO, 2 HR); all six runs against him are earned and charged to him. No save: Tanner Scott (1.0 IP, 0 H, 1 BB, 1 SO) and Steve Cishek (1.0 IP, 0 H, 1 SO) bridged scoreless with a six-run lead, Anthony Bender recorded no outs in the Bottom 9 (2 H, 2 R, 2 ER, 1 HR) and Antonio Alfonseca (1.0 IP, 1 H, 1 SO) finished the 8-2 game, entering after Harper&#x27;s homer with the bases empty; no Miami reliever faced a save situation. Gene Garber (1.0 IP, 0 H) and Ron Reed (1.1 IP, 0 H, 1 SO) were scoreless for Philadelphia; Tug McGraw took the Top 8 damage (0.2 IP, 2 H, 2 R, 2 ER, 1 BB, 1 HR). Run charges match the printed lines exactly: Philadelphia pitching allows 8 (Hamels 6, Garber 0, McGraw 2, Reed 0), and Miami pitching allows 2 (Fernandez 0, Scott 0, Cishek 0, Bender 2, Alfonseca 0). The duplicate test ran before the number was assigned: the series&#x27; four stored games are Game 1 (Philadelphia 3, Miami 1), Game 2 (Miami 9, Philadelphia 3), Game 3 (Miami 8, Philadelphia 6 in 11 innings), and Game 4 (Philadelphia 4, Miami 2), all with different scores and linescores, so this box score takes Game 5. The game: after two scoreless innings, Miami scored in five different innings. In the Top 3, Conine singled, Castillo tripled him home, and Yelich doubled Castillo home. In the Top 4, Stanton doubled and scored on Conine&#x27;s single after Ramirez walked. Cabrera&#x27;s solo home run in the Top 6 made it 4-0. In the Top 7, Conine singled and Realmuto hit a two-run home run off Hamels. In the Top 8, Stanton hit a solo home run off McGraw and Conine doubled home Ramirez, who had walked, for 8-0. Philadelphia was held scoreless until the Bottom 9, when Schmidt singled off Bender and Harper hit a two-run home run; Alfonseca then finished it, Howard singling before Utley struck out, Ruiz forced Howard at second, and Rollins grounded out. Miami stranded 4 and Philadelphia 7. Home runs: four, Cabrera&#x27;s solo shot in the Top 6 off Hamels, Realmuto&#x27;s two-run shot in the Top 7 off Hamels, Stanton&#x27;s solo shot in the Top 8 off McGraw, and Harper&#x27;s two-run shot in the Bottom 9 off Bender. Doubles: five, Ashburn and Abreu for Philadelphia, Yelich, Stanton, and Conine for Miami. Triples: one, Castillo in the Top 3. Errors: none, by either club; the game was errorless. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are card-sourced values, so the hit batter check runs on real data. Wild pitches: none, for any pitcher on either club; the logs record no wild pitch, and the zero is a finding, not a gap. Passed balls: none; Realmuto and Ruiz both read 0 in the Fielding tables. Sacrifices: none, no bunts and no sacrifice flies, so the lines read SH 0 and SF 0 for every batter. Stolen bases: none, and no caught stealing. Double plays grounded into: none; Ruiz&#x27;s Bottom 9 forceout is a fielder&#x27;s choice with the batter safe at first, and neither club turned a double play. Substitutions with plate appearances: none; each club printed nine batting lines. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Miami PA is AB 37 plus BB 2, which is 39, and the outs plus runs plus stranded identity agrees (27 outs plus 8 runs plus 4 stranded is 39); Philadelphia PA is AB 33 plus BB 3, which is 36, and the identity agrees (27 outs plus 2 runs plus 7 stranded is 36). Batters faced tie to those totals: Miami 39 PA against 39 Philadelphia BF (Hamels 27, Garber 3, McGraw 5, Reed 4), counted from the play log, and Philadelphia 36 PA against 36 Miami BF (Fernandez 23, Scott 4, Cishek 3, Bender 2, Alfonseca 4). Strikeouts tie both ways: Miami batting 5 against Philadelphia pitching 5 (Hamels 4, Reed 1), and Philadelphia batting 8 against Miami pitching 8 (Fernandez 5, Scott 1, Cishek 1, Alfonseca 1). Printed RBI: Miami 8 for 8 (Castillo 1, Yelich 1, Stanton 1, Cabrera 1, Conine 2, Realmuto 2); Philadelphia 2 for 2 (Harper 2). Defensive lines were built with this booking under Joe&#x27;s 2026-11-07 standing instruction: errors_by stays empty in the existing schema shape because the game was errorless, and a defense object in the established shape carries the putout and assist lines (27 putouts a side; wild pitches and passed balls true zeros for every pitcher and catcher). Availability: inside the series the house outs convention reads Game 4 only, and it runs under 6 outs free, 6 to 8 outs capped at 3, 9 or more unavailable. Curt Schilling threw 24 outs in Game 4 and Josh Beckett 18, so both were unavailable under the convention and correctly went unused. Jonathan Papelbon, Steve Cishek, Anthony Bender, and Antonio Alfonseca each threw 3 outs in Game 4, under 6 and therefore free; Cishek, Bender, and Alfonseca pitched in this game and Papelbon did not. Nine decisions were graded. Charlie Manuel (Philadelphia) made 5 (3 paid off, 2 backfired, 0 neutral): leaving Hamels in for the Top 6, fatigued by the book, paid off at +0.50; leaving him in for the Top 7 backfired at -1.77, the two-run homer scoring in the inning; the change to Garber in the Top 7 paid off at +0.73; the change to McGraw for the Top 8 backfired at -1.77, Stanton homering as the first batter; and the change to Reed in the Top 8 paid off at +0.57. Jack McKeon (Miami) made 4 (2 paid off, 1 backfired, 1 neutral), all pitching changes: Scott for the Bottom 7 paid off at +0.73, Cishek for the Bottom 8 paid off at +0.73, Bender for the Bottom 9 backfired at -1.77, and Alfonseca for the Bottom 9 was neutral at +0.23. Managers: Charlie Manuel (Philadelphia) and Jack McKeon (Miami). Venue is Citizens Bank Park. Miami leads the series 3-2.">
