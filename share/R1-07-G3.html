  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as the app scorecard PDF plus the full graded play-by-play text on 2026-10-29; official R1-07 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Box score record: the two sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number. The decisions are not printed; they are derived from the play log (Warren Spahn pitched 8 innings and left with an 8-6 lead that Atlanta never lost, taking the win; Ed Whitson was charged with 6 runs in 2 innings and took the loss; Craig Kimbrel pitched a scoreless 9th with a 2-run lead for the save). Hank Aaron&#x27;s solo homer in the 1st put Atlanta up 1-0; San Diego answered with 3 in the bottom half on four straight singles and Manny Machado&#x27;s run-scoring forceout. Atlanta&#x27;s 5-run 2nd all came off Whitson: Joe Torre reached on Adrian Gonzalez&#x27;s 2-base error leading off, Dale Murphy hit a 2-run homer, and Chipper Jones hit a 3-run homer. Ozzie Albies homered off Luke Gregerson in the 4th, Machado&#x27;s sacrifice fly in the 5th made it 7-4, Murphy homered again off Mike Adams in the 6th for 8-4, and San Diego closed to 8-6 in the 8th on Mark Loretta&#x27;s RBI single and Fernando Tatis Jr.&#x27;s run-scoring forceout off Spahn before Kimbrel closed it. Earned runs: the scorecard charges Whitson only 2 earned runs of his 6; the Gonzalez error opened the Top 2 before the 5-run inning, and the card&#x27;s earned-run treatment makes most of that inning unearned. The card governs every line, and the 2 earned runs are booked exactly as printed, not recomputed from the play log. Atlanta hit five homers (Aaron, Murphy twice, Chipper Jones&#x27;s 3-run shot, Albies); San Diego hit none, and Machado&#x27;s double was its only extra-base hit. Rabbit Maranville&#x27;s stolen base is printed on the scorecard; the play log does not narrate the steal, so it rests on the card alone. Ozzie Albies&#x27;s Top 9 double play is printed on the scorecard (GIDP: Ozzie Albies) and matches the play log. Steve Finley&#x27;s Bot 4 bunt is scored a fielder&#x27;s choice in the scorecard grid (the lead runner was forced), not a sacrifice, so no batter in this game has a sacrifice hit; Machado&#x27;s sacrifice fly is printed in the scorecard extras and its grid (SF9) and is carried in the SF column. No hit batters: the scorecard grid prints HBP 0 for all nine pitchers, so HB 0 for all 9 pitchers and HBP 0 for all 18 batters are card-sourced values carried in the tables below, and the homer, hit batter, and derived plate appearance checks run on real data. One error in the game: Adrian Gonzalez (San Diego, 1B, Top 2, Torre reached on a 2-base error). Eric Show, San Diego&#x27;s fifth starter in posted rotation order, threw 2 relief innings (the 8th and 9th); the play log names no new San Diego pitcher in the 9th. No substitutions on either side; all 18 starters finished. Game 2 availability was honored: Kid Nichols (27 outs in Game 2) and Randy Jones (9 outs in Game 2), both unavailable under the house outs convention, did not pitch. Managers: Bobby Cox (Atlanta) and Bruce Bochy (San Diego). Venue is Petco Park. Atlanta leads the series 3-0.">
