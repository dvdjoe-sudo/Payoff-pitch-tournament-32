  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-04: the paper scorecard grid photo, the app scorecard PDF, and the play-by-play text; official R1-12 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Minnesota Twins (seed 12) vs New York Mets (seed 21), home pattern 2-2-1-1-1, Game 3 at Citi Field in New York, and Minnesota leads the series 2-1 with this win. The game was CALLED FOR HEAVY RAIN after the top of the 9th inning, an official game (the log&#x27;s rare play line, p22): New York never batted in the bottom of the 9th, so New York&#x27;s batting lines cover eight innings and Minnesota threw exactly eight innings; the linescore above carries New York&#x27;s 9th as x, the home club not batting, exactly as the card prints it. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number, with no run-accounting knot and no settlement. The decisions are not printed; they are derived from the play log and the run charges on the card. Bert Blyleven takes the win: he was Minnesota&#x27;s only pitcher, started and finished the game by the call (8.0 IP, 3 H, 0 R, 1 BB, 8 SO), and Minnesota led from the top of the 1st on. No save is possible: Blyleven started the game, and a starter who finishes his own game earns no save. Jacob deGrom takes the loss (6.0 IP, 4 H, 1 ER, 0 BB, 12 SO, 1 HR), a hard-luck loss: the only run charged to him, and the only run of the game, is Puckett&#x27;s solo home run in the Top 1. Run charges match the printed lines exactly: New York pitching allows 1 + 0 + 0 + 0 = 1 (deGrom the one, Benítez, Wagner and Díaz none), and Minnesota pitching allows 0 (Blyleven none). The duplicate test ran before the number was assigned: the two stored games in the series are Game 1 (Minnesota 6, New York 5, linescore New York 0 3 0 1 1 0 0 0 0, Minnesota 1 1 0 0 0 2 0 0 2) and Game 2 (New York 5, Minnesota 1, linescore New York 1 2 0 0 0 0 2 0 0, Minnesota 0 0 0 0 0 0 1 0 0); neither shares this game&#x27;s final score or linescore, so this box score, a 1-0 Minnesota win on its own linescore, is no duplicate, and this is the third game of the series in play order, booked as Game 3. The game: with two out in the Top 1, after Carew grounded out and Mauer struck out, Puckett homered off deGrom for the game&#x27;s only run, and Buxton struck out to end the inning. That was all the scoring in a game that was one long duel. deGrom struck out twelve in six innings and allowed nothing else; Minnesota&#x27;s other chances were Cronin&#x27;s double in the Top 3, stranded when Gaetti struck out and Carew and Mauer went down, and the Top 4, when Killebrew and Oliva singled back to back before Hrbek struck out. New York&#x27;s only hits were three singles: Alfonzo in the Bottom 3 (Jones&#x27;s forceout erased him), Alonso in the Bottom 5, and Wright in the Bottom 7. New York grounded into two double plays, Hernandez in the Bottom 1 behind Lindor&#x27;s leadoff walk and Beltran in the Bottom 5 behind Alonso&#x27;s single, and stranded two runners all game; Minnesota stranded four. After deGrom, Benítez pitched a scoreless Top 7, Wagner a scoreless Top 8, and Díaz the Top 9, walking Battey, getting Puckett on a forceout, and striking out Buxton and Killebrew, before the rain ended it with New York&#x27;s last turn never coming. Home runs: one, Puckett for Minnesota (Top 1, solo, the game&#x27;s only run and only RBI). Doubles: one, Cronin for Minnesota. Triples: none. Errors: none; both clubs played errorless ball, every error column zero. Hit batters: none; every pitcher&#x27;s HBP column on both grids reads zero and no batter on either side was hit, so HB 0 is carried for every pitcher as card-sourced values and the hit batter check runs on real data. Wild pitches: none printed on the card. Passed balls: none. Sacrifices: none of either kind, so SH 0 and SF 0 for every batter, log-proven. Stolen bases: none; the printed SB and CS columns are 0 for both clubs. Double plays grounded into, counted from the play log: two for New York, Hernandez in the Bottom 1 and Beltran in the Bottom 5, exactly as the card extras read; Minnesota grounded into none. Substitutions: Minnesota made one. Earl Battey replaced Mauer at catcher for the Bottom 8 and walked in the Top 9, carrying the printed batting line AB 0, R 0, BB 1; the catching spot did not bat again. Byron Buxton started in left field and struck out four times; Goose Goslin did not appear. New York made one: Gary Carter replaced Piazza at catcher during the game, first batting in the Bottom 5; Piazza carries AB 1 (a Bottom 2 strikeout) and Carter AB 2, neither with a hit. Batters faced are counted from the play log and tie to the batting PA totals both ways (Minnesota 32 PA against 32 New York BF: deGrom 22, Benítez 3, Wagner 3, Díaz 4; New York 26 PA against 26 Blyleven BF). Minnesota PA is AB 31 plus BB 1; New York PA is AB 25 plus BB 1, over eight innings, with Blyleven recording 24 outs, the two double plays accounting for the extra outs. Graded decisions: none. The play-by-play text for this game is the structured play export rather than the graded prose format and carries no Decisions summary section, so no decisions are graded for this game and none are invented here; the earlier games of the series carried graded counts, this one does not. Managers: Tom Kelly (Minnesota) and Davey Johnson (New York). Venue is Citi Field. Availability compliance: Gooden (24 outs in Game 2) and Santana (20 outs in Game 2) were unavailable under the house convention and correctly did not pitch. Game 4 availability, under the house convention that reads only this game: Blyleven (24 outs) and deGrom (18 outs) are both UNAVAILABLE, and Benítez (3 outs), Wagner (3) and Díaz (3) are all free. Each club started its rotation number 3, Blyleven for Minnesota and deGrom for New York; the rotations turn to the number 4 starters for Game 4, and the series stays in New York.">
