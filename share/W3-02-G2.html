  <title>W3-02-G2: Los Angeles Dodgers 1, San Francisco Giants 2</title>
  <meta name="description" content="Winners Bracket, Round 3, Series 2, Game 2 at Oracle Park, as the master export&#x27;s box score prints the venue, &quot;ORACLE PARK&quot;. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections, inside the game&#x27;s Rec record), the native PLAYS (JSON) rows, the narrative play log, the graded play-by-play with its manager decisions and decisions summary, and the full Rec JSON (W SF|hubbeca01, L LAD|gagneer01, no save; the Rec extra list carries two inherited-runner lines, both for Los Angeles relievers, both 1/0). The export&#x27;s filename and header date read 2026-11-26, and the Rec&#x27;s recorded stamp is 2026-11-26T20:58:32Z; the book carries the header date, 2026-11-26. San Francisco won 2-1 in 10 innings and ties the series 1-1. Decisions: Carl Hubbell takes the win for San Francisco, a complete game (10.0 IP, 44 BF, 8 H, 1 R, 1 ER, 6 BB, 5 SO, 1 HR), and is the export&#x27;s player of the game; Eric Gagne takes the loss for Los Angeles (1.1 IP, 6 BF, 2 H, 1 R, 1 ER, 3 SO), beaten in the bottom of the 10th after a scoreless 9th. Clayton Kershaw started for Los Angeles (5.2 IP, 22 BF, 4 H, 1 R, 1 ER, 2 BB, 2 SO); Jim Brewer relieved him in the 6th and pitched into the 7th (1.0 IP, 4 BF, 1 H, 0 R, 2 SO), and Kenley Jansen finished the 7th and threw the 8th (1.1 IP, 6 BF, 0 H, 0 R, 2 BB, 3 SO). Hubbell was San Francisco&#x27;s only pitcher. Scoring: the bottom of the 1st, Mel Ott doubled with two out, Barry Bonds walked, and Willie McCovey&#x27;s single to left scored Ott, 1-0 San Francisco. The top of the 3rd, Zack Wheat hit a solo home run off Hubbell, 1-1, and nothing scored for either club for the next six innings. The bottom of the 10th won it: Art Fletcher singled to center off Gagne, Mays struck out on McGraw&#x27;s hit and run with Fletcher stealing second on the play, and Will Clark singled to center, Fletcher scoring from second on the extra-base advance for the walk-off run, 2-1; Clark&#x27;s single is the Rec summary&#x27;s decisive play and carries the game&#x27;s last RBI. The extra list, exactly as printed: inherited runners for Kenley Jansen 1/0 (Matt Williams, who had doubled off Brewer with two out in the bottom of the 7th, stranded at second when Fletcher struck out) and for Jim Brewer 1/0 (Will Clark, Kershaw&#x27;s runner, who singled to open the bottom of the 6th, took third on Bonds&#x27;s hit-and-run groundout, and was stranded when Brewer struck out McCovey). No holds, no blown saves, no save. Errors: none, an errorless game both ways, confirmed by the play rows&#x27; rebuilt error count (LAD 0 / SF 0), the printed fielding sections, the batting CSV&#x27;s E column and the Rec fld array alike, and team_errors reads LAD 0, SF 0. Double plays: one. Mays grounded into a double play in the bottom of the 2nd (seq 19), shortstop to second to first, Reese to Jackie Robinson to Hodges, each of the three carrying the DP flag on his printed fielding line exactly as printed, matching Mays&#x27;s printed GIDP 1 and Los Angeles&#x27;s printed team DP total of 1; San Francisco turned none. The play rows and the printed GIDP agree, so no GIDP-practice divergence arises; the only other rows recording a two-out jump are the two Los Angeles pitching-change marker rows (seq 50, Brewer in for the bottom of the 6th, and seq 59, Jansen in for the bottom of the 7th). Stolen bases: Fletcher stole second in the bottom of the 10th on the hit-and-run strikeout row (seq 83 carries the SB run_event), against Piazza; Hodges stole second in the top of the 10th on Piazza&#x27;s hit-and-run strikeout, against Posey. Caught stealing: none. The catching lines as printed: Mike Piazza, PB 0, 1 stolen base against, 0 caught stealing (0%), with 11 putouts catching; Buster Posey, PB 0, 1 stolen base against, 0 caught stealing (0%). Defensive lines are booked in the established shape from the printed fielding section (Los Angeles 28 putouts and 6 assists: Piazza 11 putouts catching, Hodges 6 putouts, Snider 3 putouts, Wheat 2 putouts, Reese 2 putouts and 4 assists, Robinson 2 putouts and 1 assist, Betts 1 putout, Guerrero 1 putout, Brewer 1 assist; San Francisco 30 putouts and 10 assists: Clark 12 putouts, Mays 6 putouts, Posey 6 putouts catching, Ott 2 putouts, Fletcher 2 putouts and 4 assists, Bonds 1 putout, Kent 1 putout and 3 assists, Williams 2 assists, Hubbell 1 assist). Substitutes: none on either club; both starting lineups went the full 10 innings and Hubbell and the four Los Angeles pitchers are the only pitchers. Wild pitches: none. Passed balls: none. Hit by pitch: none (Hubbell&#x27;s printed HB 0, and every Los Angeles pitcher&#x27;s HB 0). Counting checks: Los Angeles plate appearances 44 (38 AB, 6 BB) equal Hubbell&#x27;s 44 batters faced; San Francisco plate appearances 38 (34 AB, 4 BB) equal Los Angeles&#x27;s 38 batters faced (Kershaw 22, Brewer 4, Jansen 6, Gagne 6). Hit, walk, home run and strikeout totals tie across the two boxes both ways (San Francisco batting strikeouts 10 = Kershaw 2 + Brewer 2 + Jansen 3 + Gagne 3; Los Angeles batting strikeouts 5 = Hubbell 5; Los Angeles walks drawn 6 = Hubbell&#x27;s 6; San Francisco walks drawn 4 = Kershaw 2 + Jansen 2; the game&#x27;s only home run is Wheat&#x27;s, off Hubbell). Team RBI equals runs for both clubs (San Francisco 2, Los Angeles 1; the play rows total 3 runs and 3 RBI, every run in the game carrying an RBI). Staff earned runs equal runs allowed both ways (San Francisco 1 ER, Los Angeles 2 ER); every run in the game was earned. Manager grades: the grades list names both managers directly, so no label mapping is needed. Tommy Lasorda graded 5 decisions (3 paid off, 1 backfired, 1 neutral): 3 pitching changes, all paid off (Brewer for the 6th, who struck out McCovey with Clark at third; Jansen for the 7th, who struck out Fletcher with Williams at second and threw a scoreless 8th; Gagne for the 9th, a scoreless inning before the 10th beat him) and 2 hit and runs (1 neutral: Guerrero&#x27;s hit-and-run single in the top of the 2nd, runners taking two bases and no run following; 1 backfired: Piazza striking out on the hit and run in the top of the 10th, Hodges stealing second on the play but stranded). John McGraw graded 2 decisions (0 paid off, 1 backfired, 1 neutral), both hit and runs: 1 neutral (the bottom of the 6th, Bonds&#x27;s groundout advancing Clark to third on the hit and run, Clark stranded) and 1 backfired (the bottom of the 10th, Mays striking out on the hit and run, graded backfired even though Fletcher stole second on the play and Clark&#x27;s single won the game two pitches later). Availability compliance: Game 1&#x27;s unavailable three (Koufax 15 outs, Mathewson 17 outs, Labine 9 outs) appear nowhere in this game, and Wilhelm, capped at 3 outs after throwing 7 in Game 1, did not appear at all; the Rec&#x27;s own unavailable block names Mathewson, Koufax, Wilhelm and Labine. Nothing to flag. Game 3 availability, from this game&#x27;s outs (the series shifts to Los Angeles): Hubbell (30 outs) and Kershaw (17 outs) are unavailable; Brewer (3 outs), Jansen (4 outs) and Gagne (4 outs) are free; no pitcher falls in the capped band. The series is tied 1-1; San Francisco improves to 9-2 in games and Los Angeles falls to 9-5 in games, both clubs still 2-0 in series. The loser of this series drops to the losers bracket. Managers: John McGraw (San Francisco) and Tommy Lasorda (Los Angeles). Venue is Oracle Park, as printed.">
