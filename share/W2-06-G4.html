  <title>W2-06-G4: Chicago Cubs 9, Minnesota Twins 5</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 6, Game 4 at Target Field. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON; the series master export&#x27;s Game 4 record agrees with the game export in every field. Decisions: Pete Alexander takes the win for Chicago with a complete game (9.0 IP, 41 BF, 12 H, 5 R, 5 ER, 2 BB, 11 SO, 1 home run allowed). Frank Viola takes the loss for Minnesota (3.1 IP, 16 BF, 5 H, 6 R, 6 ER, 1 BB, 2 SO, 2 home runs allowed), knocked out in the top of the 4th. There is no save, and the Rec carries no extra line: no holds, no blown saves, no inherited runners. Scoring: the game opened with matching triples and sacrifice flies, Ryne Sandberg tripling and scoring on Anthony Rizzo&#x27;s sacrifice fly in the top of the 1st, and Rod Carew tripling and scoring on Joe Mauer&#x27;s sacrifice fly in the bottom half (1-1). Sandberg&#x27;s top-of-the-3rd solo home run off Viola, the decisive play the export&#x27;s summary names, put Chicago ahead to stay (2-1). Chicago&#x27;s four-run top of the 4th: Ron Santo singled, Sammy Sosa walked, Billy Williams singled Santo home, and after Ernie Banks flied out on the hit and run, Hack Wilson hit a three-run home run off Viola (6-1); Rick Aguilera relieved and finished the inning. Minnesota&#x27;s two-run bottom of the 5th: Joe Cronin singled, Mauer singled, and Kirby Puckett tripled both home (6-3). Chicago&#x27;s three-run top of the 7th: Gabby Hartnett singled off Al Worthington, Pete Crow-Armstrong hit a two-run home run, Taylor Rogers relieved, and Sandberg homered again (9-3). Minnesota&#x27;s last runs came on Puckett&#x27;s bottom-of-the-7th sacrifice fly, scoring Cronin after Cronin and Gary Gaetti singled and Carew walked to load the bases (9-4), and Goose Goslin&#x27;s bottom-of-the-8th solo home run (9-5). Alexander finished it himself in the 9th: Mauer and Puckett struck out, Harmon Killebrew walked, and Goslin flied out to end the game and the series. Ryne Sandberg is the export&#x27;s player of the game: 3 for 5 with a triple, two home runs, 2 RBIs and 3 runs. Key lines: for Chicago, Wilson 2 for 4 with the three-run home run, 3 RBIs, a run and a stolen base; Crow-Armstrong 1 for 4 with the two-run home run; Hartnett 1 for 4 with a run and 12 putouts catching. For Minnesota, Puckett 1 for 4 with the triple, 3 RBIs and a sacrifice fly; Mauer 2 for 4 with a double, an RBI and a run; Cronin 2 for 4 with 2 runs; Goslin 1 for 5 with the solo home run. Pitching lines of note: behind Viola, Aguilera threw 1.2 scoreless innings, Jhoan Duran a scoreless 6th (1 BB, 1 SO), Worthington took 2 ER in 0.1 IP, Rogers 1 ER in 1.2 IP, and Joe Nathan struck out three in a scoreless 9th. The game was errorless, and neither club turned a double play; no batter on either side grounded into one. Defensive lines are booked in the established shape from the printed fielding section (Chicago 27 putouts and 8 assists, Hartnett 12 putouts; Minnesota 27 putouts and 7 assists, Mauer 10 putouts catching, Cronin 4 assists); the fielding section prints no run-out, GDP or outfield-assist credits in this game, and the defense object&#x27;s putout/assist/error lines are booked exactly as printed. Stolen bases: Wilson off Mauer in the top of the 9th; Billy Williams was caught stealing in the top of the 6th (Mauer&#x27;s catching line reads PB 0, 1 stolen base against, 1 caught stealing). Wild pitches and passed balls: none. Hit by pitch: none on either side. Counting checks: Chicago plate appearances 37 (34 AB, 2 BB, 1 SF) equal Minnesota&#x27;s 37 batters faced (Viola 16, Aguilera 5, Duran 3, Worthington 3, Rogers 6, Nathan 4); Minnesota plate appearances 41 (37 AB, 2 BB, 2 SF) equal Chicago&#x27;s 41 batters faced (Alexander 41). Hit, walk, home run and strikeout totals tie across the two boxes both ways, and every run on both sides carries an RBI and is earned exactly as printed. Manager grades: the grades list names both managers directly, so no label mapping is needed. Frank Chance graded 3 decisions (1 paid off, 2 backfired, 0 neutral): his top-of-the-4th hit and run paid off, and both his steals backfired as graded, Williams caught stealing in the 6th and Wilson&#x27;s successful top-of-the-9th steal, after which no run scored. Tom Kelly graded 5 decisions (2 paid off, 2 backfired, 1 neutral), all pitching changes: Aguilera in the 4th and Duran in the 6th paid off, Worthington and Rogers in the 7th backfired, and Nathan in the 9th was neutral. Series graded totals: Chance 31 decisions (14 paid off, 13 backfired, 4 neutral); Kelly 14 (4 paid off, 8 backfired, 2 neutral). Availability from Game 3 was honored: Rick Reuschel, Bert Blyleven and Kerry Wood, all unavailable after their Game 3 workloads, did not pitch. Series MVP, under Joe&#x27;s standing rule that the MVP named in the series export is the MVP: Ryne Sandberg of Chicago, 10 for 19 with 5 runs, a double, a triple, two home runs and 6 RBIs (.526); the runner-up is his teammate Ron Santo, 6 for 15 with 4 runs, two home runs and 3 RBIs (.400), including the two-homer Game 2. Chicago wins the series four games to none and advances on the winners side; Minnesota takes its first series loss of the tournament and drops to the losers bracket, still alive. Managers: Frank Chance (Chicago) and Tom Kelly (Minnesota). Venue is Target Field, as printed.">
