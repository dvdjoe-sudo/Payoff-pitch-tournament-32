  <meta name="description" content="Losers Bracket, Round 2, Series 1, Game 2 at Busch Stadium, as the master export&#x27;s box score prints the venue. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the narrative play log, the graded play-by-play with its manager decisions and decisions summary, and the full Rec JSON (W MIA|scottta01, L STL|worreto01, S MIA|nenro01). The Rec&#x27;s recorded stamp is 2026-11-21T20:02:25Z, 12:02 PM PT on 2026-11-21, and that is the played date the book carries. Miami won 10-9 to tie the series 1-1. Decisions: Tanner Scott takes the win for Miami (1.0 IP, 4 BF, 1 H, 0 R, 1 SO), a scoreless 7th after St. Louis had built a 9-3 lead; Todd Worrell takes the loss for St. Louis and is charged with the blown save in the export&#x27;s extra list (0.0 IP, 2 BF, 2 H, 2 R, 2 ER, 1 HR): he opened the top of the 8th protecting a 9-8 lead, gave up Jeff Conine&#x27;s single and J.T. Realmuto&#x27;s go-ahead two-run home run, and recorded no outs. Robb Nen earns the save (1.0 IP, 4 BF, 1 H, 0 R, 1 SO), working around Albert Pujols&#x27;s one-out single in the 9th. Scoring: the top of the 3rd, Christian Yelich singled, Gary Sheffield doubled him home, and Giancarlo Stanton hit a two-run home run off Dizzy Dean, 3-0. The bottom of the 4th, Rogers Hornsby reached on Jeff Conine&#x27;s error at first base and Jim Edmonds hit a two-run home run off Sandy Alcantara, 3-2; Hornsby&#x27;s run is unearned, the one unearned run in Alcantara&#x27;s line (4.1 IP, 6 R, 5 ER). The bottom of the 5th scored four: Yadier Molina walked, Ken Boyer and Ozzie Smith singled, Stan Musial singled home two, Hornsby singled home Smith, and Pujols&#x27;s sacrifice fly scored Musial, 6-3; A.J. Ramos relieved Alcantara with Hornsby on second (inherited runners 1/0 in the extra list) and finished the inning. The bottom of the 6th scored three: Mark McGwire walked, Ted Simmons pinch-hit a single, Boyer walked, Smith singled home two, and Musial&#x27;s sacrifice fly scored Boyer, 9-3. Miami&#x27;s five-run top of the 7th: Cliff Floyd doubled, Conine singled him home, Realmuto popped out, Luis Castillo singled, Yelich reached on Hornsby&#x27;s error at second base as Conine scored, Sheffield doubled home Castillo and Yelich, Ryan Helsley relieved (inherited runners 1/1: Stanton singled home Sheffield, Helsley&#x27;s only inherited runner), Hanley Ramirez singled, and Al Brazle relieved (inherited runners 2/0) and got Floyd&#x27;s flyout to end it, 9-8. The top of the 8th, Worrell gave up Conine&#x27;s single and Realmuto&#x27;s two-run home run, 10-9; Bruce Sutter and Jason Isringhausen closed out the 8th and 9th scoreless for St. Louis. The extra list, booked exactly as printed: holds for Steve Cishek (a perfect bottom of the 8th), Helsley and Brazle; the blown save to Worrell; inherited runners Ramos 1/0, Helsley 1/1, Brazle 2/0. One Miami run carries no RBI: the 10th run overall, Conine in the 7th, scored on Hornsby&#x27;s error during Yelich&#x27;s plate appearance (play row seq 64 carries runs 1, rbi 0, Conine in its scored list), so Miami&#x27;s 10 runs carry 9 RBIs as printed. One brief figure is corrected to the printed lines: Stan Musial&#x27;s sacrifice flies book at 1, with Pujols&#x27;s at 1 (the club&#x27;s two), as the box score, the CSV and the Rec bat array all print; the brief&#x27;s prose credited Musial with 2. Errors: one per club, Conine (E at 1B, bottom of the 4th) and Hornsby (E at 2B, top of the 7th), confirmed by the play rows&#x27; rebuilt error count (MIA 1 / STL 1); each staff carries exactly one unearned run against the other&#x27;s error. Double plays: none turned, no printed GIDP for either club, and no DP-coded rows, so no GIDP-practice divergence arises. Stolen bases: none. Caught stealing: Ozzie Smith in the bottom of the 1st (Realmuto to Castillo), the only attempt of the game; the catching line as printed is Realmuto PB 0, 1 steal attempt against, 0 stolen bases, 1 caught stealing. Defensive lines are booked in the established shape from the printed fielding section (Miami 27 putouts and 5 assists, Yelich 7 putouts in center, Realmuto 6 putouts and 1 assist catching, Conine 5 putouts and the error, and Stanton carries a run-out in the Rec fld row; St. Louis 27 putouts and 7 assists, Pujols 10 putouts at first, Molina 7 putouts catching, Boyer 2 putouts and 3 assists with a run-out in the Rec fld row, Hornsby the error). Substitutes: Simmons pinch-hit for Molina in the bottom of the 6th and stayed in at catcher (1 for 2, a single and a run, 1 putout); Red Schoendienst replaced Hornsby at second base in the top of the 8th (0 for 1, 2 assists); Charles Johnson replaced Realmuto at catcher in the bottom of the 9th (1 putout, never batted). Wild pitches: none. Passed balls: none. Hit by pitch: none. Counting checks: Miami plate appearances 43 (43 AB, no walks, hit by pitches, sacrifices or sacrifice flies; St. Louis&#x27;s staff walked nobody) equal St. Louis&#x27;s 43 batters faced (Dean 30, Helsley 3, Brazle 1, Worrell 2, Sutter 4, Isringhausen 3); St. Louis plate appearances 42 (37 AB, 3 BB, 2 SF) equal Miami&#x27;s 42 batters faced (Alcantara 22, Ramos 9, Scott 4, Cishek 3, Nen 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways (Miami batting strikeouts 8 = Dean 7 + Isringhausen 1; St. Louis batting strikeouts 7 = Alcantara 3 + Ramos 2 + Scott 1 + Nen 1). Manager grades: the grades list names both managers directly, so no label mapping is needed. Jack McKeon graded 8 decisions (5 paid off, 2 backfired, 1 neutral): 4 pitching changes (3 paid off, 1 neutral), 2 left-pitcher-in (1 paid off, 1 backfired), 1 defensive sub (paid off, Charles Johnson in the 9th) and 1 steal (backfired). Tony La Russa graded 9 decisions (4 paid off, 5 backfired, 0 neutral): 5 pitching changes (3 paid off, 2 backfired), 2 steals (both backfired), 1 pinch hitter (paid off, Simmons) and 1 defensive sub (backfired, Schoendienst). Game 1 availability was honored: Bob Gibson (27 outs), Josh Johnson (14 outs) and Antonio Alfonseca (10 outs), all unavailable after Game 1, appear nowhere in this game. Game 3 availability, from this game&#x27;s outs: Dizzy Dean (19 outs) and Sandy Alcantara (13 outs) threw 9 or more outs and are unavailable for Game 3; everyone else who pitched recorded 5 outs or fewer (A.J. Ramos exactly 5) and is free, with no caps. The series is tied 1-1 and moves to Miami for Game 3. St. Louis is 6-5 in games and 1-1 in series; Miami is 5-7 in games and 1-1 in series. The loser of this series is eliminated. Managers: Tony La Russa (St. Louis) and Jack McKeon (Miami). Venue is Busch Stadium, as printed.">
