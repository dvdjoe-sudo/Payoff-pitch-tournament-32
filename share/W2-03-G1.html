  <title>W2-03-G1: Houston Astros 1, Boston Red Sox 3</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 3, Game 1 at Fenway Park. This booking forms the series in its archive slot: Boston, the #3 seed, against Houston, the #16 seed, the reseeded Winners Round 2 pairing, with Boston home for Games 1, 2, 5 and 7. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. The standalone box score CSV and the standalone Rec JSON Joe sent agree with the master export in every field: the Rec is identical, and the Rec&#x27;s csv string is byte-for-byte the standalone CSV file. Decisions: Pedro Martinez takes the win for Boston (7.0 IP, 29 BF, 8 H, 1 R, 1 ER, 1 BB, 9 SO), seven innings of one-run ball, and he is the export&#x27;s player of the game. Justin Verlander takes the loss for Houston (5.0 IP, 19 BF, 3 H, 3 R, 3 ER, 1 BB, 9 SO, 2 HR): both Boston home runs came off him. Jonathan Papelbon takes the save (1.0 IP, 3 BF, 1 SO), a perfect 9th with a two-run lead. Koji Uehara takes a hold in the Rec&#x27;s extra line (1.0 IP, 3 BF, 1 H): a scoreless 8th. Scoring: Boston scored in the bottom of the 1st on Ted Williams&#x27;s single and David Ortiz&#x27;s two-run home run, the decisive play the export&#x27;s summary names. Nomar Garciaparra&#x27;s solo home run in the bottom of the 2nd made it 3-0. Houston&#x27;s only run came in the top of the 5th: Jose Cruz tripled and Yordan Alvarez singled him home; Alvarez went 3 for 4 with the club&#x27;s only RBI. Houston outhit Boston 9 to 6 and never got another run home. The game&#x27;s hinge came in the bottom of the 7th: Boston loaded the bases with nobody out (Dwight Evans singled and Wade Boggs reached on Carlos Correa&#x27;s two-base error, both off Mike Scott, then Nolan Ryan, on in the fireman role, hit Garciaparra with a pitch), and scored nothing: Carlton Fisk struck out and Tris Speaker grounded into an inning-ending double play. Ryan inherited two runners and stranded all three (the Rec&#x27;s extra line reads 2 inherited, 0 scored); his line is 2.0 scoreless innings with 3 strikeouts and the hit batter. Brad Lidge threw a scoreless bottom of the 6th for Houston (1.0 IP, 4 BF, 1 H, 1 SO); Mike Scott faced two batters in the 7th and recorded no outs (1 H, both runners left for Ryan). Key lines: for Boston, Williams 2 for 4 with a run, Ortiz 1 for 3 with the two-run home run and a walk, Garciaparra 1 for 2 with the solo home run and a hit by pitch; for Houston, Alvarez 3 for 4, Lance Berkman 2 for 4, and Craig Biggio 1 for 4 with 14 putouts at catcher. The game&#x27;s only error was Correa&#x27;s (E6, the two-base error on Boggs&#x27;s grounder in the 7th); Boston was errorless. Both staffs&#x27; earned-run totals equal the runs (Boston&#x27;s staff 1 ER against Houston&#x27;s 1 run, Houston&#x27;s staff 3 ER against Boston&#x27;s 3), and every run carries an RBI (Houston 1 run on 1 RBI, Boston 3 runs on 3 RBIs). Double plays: Boston turned two (Berkman and Cruz grounded into them) and Houston one (Speaker&#x27;s, ending the 7th); all three are genuine double-play rows in the play log and match the printed GIDP lines exactly, so no GIDP difference arises in this game. Stolen bases: none, and nobody was caught stealing. Wild pitches: none. Passed balls: none. The defense object books putouts, assists and errors exactly as the printed fielding section carries them: Houston 24 putouts and 4 assists (Biggio 14 putouts, Correa the error), Boston 27 putouts and 9 assists (Fisk 10 putouts, Ortiz 8 putouts). Substitutes: Mookie Betts entered in the top of the 8th as a defensive replacement in right field for Evans and batted once, in the bottom of the 8th (struck out); the only other changes were on the mound. Counting checks: Houston plate appearances 35 (34 AB, 1 BB) equal Boston&#x27;s 35 batters faced (Martinez 29, Uehara 3, Papelbon 3); Boston plate appearances 33 (30 AB, 2 BB, 1 HBP) equal Houston&#x27;s 33 batters faced (Verlander 19, Lidge 4, Scott 2, Ryan 8). Hit, walk, hit-by-pitch, home run and strikeout totals tie across the two boxes both ways. Manager grades: the grades list names both managers directly, so no label mapping is needed. A.J. Hinch graded 3 decisions (2 paid off, 0 backfired, 1 neutral), all pitching changes: Lidge paid off, Scott neutral, Ryan paid off. Terry Francona graded 3 decisions (2 paid off, 0 backfired, 1 neutral): the Uehara pitching change neutral, the Betts defensive sub paid off, and the Papelbon pitching change paid off. Availability for Game 2 under the convention: Verlander (15 outs in this game) and Martinez (21 outs) are unavailable; Ryan (6 outs) is capped at 3 outs; every other arm used is free. Boston leads the series 1-0. Managers: Terry Francona (Boston) and A.J. Hinch (Houston). Venue is Fenway Park, as printed.">
