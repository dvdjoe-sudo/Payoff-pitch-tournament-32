  <title>R1-01-G4: New York Yankees 15, Miami Marlins 2</title>
  <meta name="description" content="Played by Joe in the playable app and sent to the co-managed tournament games chat on 2026-11-08 as four files: the full graded play by play, the scorecard CSV export, the app scorecard PDF (the Payoff Pitch Gazette, Final Edition, Sunday, November 8, 2026), and the scorecard photo. Joe ruled in chat the same day: &quot;And replace game 4,&quot; adopting this playing as the new R1-01 Game 4 under the R1-05, R1-06, and R1-10 Game 1 adoption precedents and the R1-01 Game 1, Game 2, and Game 3 adoptions made earlier that evening; the replaced game (New York 17, Miami 8; W Ron Guidry, L Josh Beckett, no save; seed 1104), the old series clincher, is preserved untouched in the Yankees records at archive/replaced/. With this adoption the full four-game replay is the series of record: New York won the series 4-0 and outscored Miami 34 to 5 across the four replays. R1-01 is a frozen series and cannot be edited by import, so the replacement was made as a guarded manual edit under Joe&#x27;s ruling, with the validator&#x27;s locked-game fingerprint and the pins the replaced game fed (the locked counting totals and the game&#x27;s played-date pin) reset under dated comments in validate_results.py. The R1-01 series entry and both club records are unchanged, the Yankees having won the replaced game as well, and the series carries no MVP, before or after. All four sources agree on every number: the linescore, the batting and pitching sums, plate appearances against batters faced for every pitcher (New York 53 against Beckett&#x27;s 27, Scott&#x27;s 2, Ramos&#x27;s 5, Cishek&#x27;s 4, Bender&#x27;s 8, Nen&#x27;s 3, and Alfonseca&#x27;s 4; Miami 37 against Guidry&#x27;s 37), and printed RBI (New York 15 for 15; Miami 2 for 2, Stanton and Ramirez). No seed is printed in any source, so rng_seed is 0, as in the R1-06 and R1-10 adoptions. The decisions are printed in the log: Ron Guidry takes the win with a complete game (9.0 IP, 9 H, 2 R, 2 ER, 3 BB, 8 SO, 0 HR) and Josh Beckett the loss (6.0 IP, 9 H, 4 R, 4 ER, 3 BB, 4 SO, 2 HR); there is no save. Miami&#x27;s runs came on Stanton&#x27;s Bottom 3 double scoring Yelich and on Ramirez&#x27;s Bottom 8 sacrifice fly scoring Stanton. New York scored on Rodriguez&#x27;s three-run home run in the Top 4 (Gehrig and DiMaggio aboard, off Beckett), on Mantle&#x27;s solo home run leading off the Top 6 (off Beckett), in an eight-run Top 7 (Judge&#x27;s two-run home run off Scott; Ruth&#x27;s solo home run off Ramos; Rodriguez&#x27;s double off Ramos scoring Gehrig; Berra&#x27;s sacrifice fly off Cishek scoring Rodriguez; Randolph&#x27;s single off Cishek scoring DiMaggio; and Judge&#x27;s double off Cishek scoring Randolph and Jeter), on Berra&#x27;s Top 8 groundout scoring DiMaggio, and on back-to-back solo home runs by Ruth and Gehrig off Nen in the Top 9. Ruth homered twice in the game; six home runs in all, all New York&#x27;s. The game was errorless. Hit batters: DiMaggio, hit by Bender in the Top 8, printed on the scorecard (batter HBP 1 for DiMaggio and pitcher HB 1 for Bender), not a default. Wild pitches: Bender 1, as printed; passed balls none, as printed. Sacrifices: Mantle&#x27;s Top 7 bunt is the game&#x27;s only sacrifice hit (SH 1); sacrifice flies: Berra (Top 7) and Ramirez (Bottom 8). Grounded into double plays: Ruth twice (Top 3 and Top 5), Berra (Top 2), and Realmuto (Bottom 9). Stolen bases: none; McKeon&#x27;s Bottom 3 steal call on Yelich ended with the runner held and no jump, and no steal is charged; Castillo was caught stealing in the Bottom 5 (Berra to Jeter), the game&#x27;s only runner thrown out on the bases. Substitutes: none on either club; every starter finished, Miami&#x27;s only changes being its six pitching changes. Defensive lines are booked as a defense object in the established shape, under the same one-series exception Joe directed for the Game 1, Game 2, and Game 3 replays adopted earlier that evening (he asked for the advanced stats and the defense from these replays), departing from his 2026-11-05 ruling that defensive tracking begins with Winners Round 2 and Losers Round 1 and is never backfilled for Round 1; no other Round 1 game changes, and New York&#x27;s 27 putouts and 10 assists and Miami&#x27;s 27 putouts and 12 assists are exactly the printed fielding tables. Graded decisions, narrated here because final_grades stays empty as in every imported game in this archive: Jack McKeon (Miami) 9 (1 paid off, 6 backfired, 2 neutral): the Bottom 3 steal paid off (+0.49; the runner held, and Stanton&#x27;s double scored him anyway), the Bottom 5 steal backfired (-0.76, Castillo caught stealing), the Top 6 leave-in of a fatigued Beckett backfired (-0.77, Mantle&#x27;s home run), the Top 7 change to Scott backfired (-7.77, the worst single decision grade in the book), the Top 7 change to Ramos backfired (-5.77), the Top 7 change to Cishek backfired (-2.87), the Top 7 change to Bender was neutral (+0.07), the Top 9 change to Nen backfired (-1.27, the Ruth and Gehrig home runs), and the Top 9 change to Alfonseca was neutral (+0.00). Casey Stengel (New York) had no graded decisions. Managers: Casey Stengel (New York) and Jack McKeon (Miami). Venue is loanDepot Park. New York won the series 4-0.">
