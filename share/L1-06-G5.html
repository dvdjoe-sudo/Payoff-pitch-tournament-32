  <meta name="description" content="Losers Bracket, Round 1, Series 6, Game 5 at Citi Field, as the master export&#x27;s box score prints the venue. Montreal leads the series 3-2. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every figure in the export agrees with itself across all of its sections. Decisions: Tom Seaver takes the win for New York with a complete-game shutout (9.0 IP, 31 BF, 3 H, 0 R, 0 ER, 2 BB, 6 SO); he is the export&#x27;s Player of the Game. Javier Vazquez takes the loss for Montreal (6.0 IP, 24 BF, 6 H, 3 R, 3 ER, 2 BB, 3 SO, 1 HR, Beltran&#x27;s solo shot). There is no save: Seaver finished the game himself, and the export&#x27;s record carries no save (its summary prints S: -). Tim Burke threw a scoreless 7th for Montreal (4 BF, 1 H, 1 BB), and Andy McGaffigan a perfect 8th (3 BF). Scoring: New York scored its first two runs in the bottom of the 2nd off Vazquez: Piazza singled, Alonso struck out, Beltran singled to left, and Alfonzo&#x27;s hit-and-run single to center scored Piazza and sent Beltran to third; Cleon Jones&#x27;s sacrifice fly to center scored Beltran. New York added its third run in the bottom of the 4th on Beltran&#x27;s solo home run off Vazquez. Montreal never scored: Seaver allowed only three hits (Wallach a double and a single, Cabrera a single) and two walks in the shutout. Errors: none for either club; the game was errorless, and the earned-run totals tie exactly: Montreal&#x27;s staff total of 3 equals New York&#x27;s 3 runs and New York&#x27;s staff total of 0 equals Montreal&#x27;s 0 runs. Double plays: three, all turned by Montreal, each matching a printed New York GIDP of 1 exactly: Hernandez in the bottom of the 5th (6-4-3 as the rows code it), Piazza in the bottom of the 6th (3-4-3), and Lindor in the bottom of the 7th (5-4-3); the printed fielding section&#x27;s DP column credits Fairly three, Cabrera two, Vidro two and Wallach one for Montreal, exactly as printed. New York turned no double play. Stolen bases: Beltran stole one for New York in the bottom of the 7th with Carter catching (one attempted, one successful, exactly as the printed fielding section records). Wild pitches: none for either club. Passed balls: none. Substitutes: John Olerud entered at first base for Keith Hernandez in the top of the 7th (defensive sub) and batted once in Hernandez&#x27;s spot, flying out to left; Jeff McNeil entered at second base for Edgardo Alfonzo in the top of the 8th (defensive sub), had no plate appearance and no fielding chance, and carries no batting or fielding line, exactly as printed. Fielding from the CSV&#x27;s printed fielding section: Montreal 24 putouts and 12 assists (Wallach 7 assists); New York 27 putouts and 9 assists. Counting checks: Montreal plate appearances 31 (29 AB, 2 BB) equal New York&#x27;s 31 batters faced (Seaver 31); New York plate appearances 31 (27 AB, 3 BB, 1 SF) equal Montreal&#x27;s 31 batters faced (Vazquez 24, Burke 4, McGaffigan 3). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Davey Johnson graded 4 decisions (3 paid off, 0 backfired, 1 neutral): one hit and run (Alfonzo in the bottom of the 2nd paid off, +1.37), two defensive subs (Olerud at first base in the top of the 7th paid off, +0.48; McNeil at second base in the top of the 8th paid off, +0.48) and one steal (Beltran in the bottom of the 7th neutral, -0.26; the runner was safe but no run followed). Dick Williams graded 3 decisions (1 paid off, 1 backfired, 1 neutral): one hit and run (the top of the 6th backfired, -0.76) and two pitching changes (Burke in the bottom of the 7th neutral, +0.23; McGaffigan in the bottom of the 8th paid off, +0.73). Availability compliance: Jerry Koosman (20 outs in Game 4) was unavailable for New York and did not pitch; Bryn Smith (18 outs in Game 4) was unavailable for Montreal and did not pitch; Andy McGaffigan was capped at 3 outs for Montreal and recorded exactly 3, the perfect 8th inning, legal at the cap. A closing note on Game 1&#x27;s brawl: Tom Seaver, ejected in that game, started this Game 5 and threw the complete-game shutout; the app&#x27;s printed &quot;suspended 5 games each&quot; plainly never sidelined him either, the same as Larry Walker, who has played since Game 2. Under the book&#x27;s outs-based availability Seaver was only capped in Game 2, when he did not pitch, and he was free for this game. Availability for Game 6 at Montreal, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Tom Seaver (27 outs) is unavailable for New York and Javier Vazquez (18 outs) is unavailable for Montreal; Andy McGaffigan&#x27;s cap applied to Game 5 only and his 3 outs there leave him free; every other arm on both staffs is free. New York faces elimination in Game 6. Managers: Dick Williams (Montreal) and Davey Johnson (New York). Venue is Citi Field, as printed.">
