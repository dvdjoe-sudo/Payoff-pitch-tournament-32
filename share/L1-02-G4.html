  <title>L1-02-G4: Baltimore Orioles 4, Washington Nationals 3</title>
  <meta name="description" content="Played by Joe in the fixed app build and sent to the co-managed tournament games chat on 2026-11-09 as six files: the box score CSV export carrying the new PLAYS (JSON) section, a second CSV whose printed sections are identical to the first (the same export sent twice), the standalone plays JSON holding the same rows as the CSV&#x27;s PLAYS section, the app scorecard PDF (the Payoff Pitch Gazette), the full graded play-by-play text, and the app&#x27;s full Rec JSON record; official L1-02 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Losers Bracket Round 1, Series 2: the Baltimore Orioles (seed 15) against the Washington Nationals (seed 31), from the reseeded pool of the 16 opening-round losers, paired highest against lowest in pairing order. Both clubs carry one series loss into this series, so the loser of this series is eliminated and the winner survives to Losers Round 2. Home pattern 2-2-1-1-1, Game 4 at Nationals Park in Washington, with Game 5 back at Baltimore next. Box score record: the sources carry the linescore, the full batting and pitching lines, the fielding lines, a complete graded play log, and the game&#x27;s full play rows, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed in the Gazette, the CSV, or the log and are derived from the play log and the run charges on the card; the app&#x27;s stored record (the Rec JSON) carries the identical three names in its own W, L, and S fields, corroborating the derivation exactly. Tippy Martinez takes the win: he threw a scoreless Bottom 10 (Harper struck out, Rendon grounded out to second, Zimmerman grounded out to short) and was Baltimore&#x27;s pitcher of record when his club took the lead for good in the Top 11. Sean Burnett takes the loss: he pitched both extra innings for Washington, a scoreless Top 10, and the Top 11 run (Blair&#x27;s triple and Anderson&#x27;s sacrifice fly) is charged to his line as printed. Stu Miller takes the save: he threw a scoreless Bottom 11 (Murphy flied out to left, Johnson grounded out to short, Ramos flied out to right) protecting a one-run lead and finished the game, the save on the lead-of-three-or-fewer plus at-least-one-inning prong. The starters took no decisions: Mike Cuellar (8.0 IP, 7 H, 3 R, 3 ER, 4 BB, 2 SO, 1 HR) left after the Bottom 8 with the game tied 3-3 on Zimmerman&#x27;s home run, and Gio Gonzalez (6.0 IP, 8 H, 3 R, 3 ER, 3 BB, 3 SO, 1 HR) left after the Top 6 with Washington trailing 3-0 and never held a lead. Run charges match the printed lines exactly: Washington pitching allows 4 (Gonzalez 3, Rauch 0, Storen 0, Cordero 0, Burnett 1), and Baltimore pitching allows 3 (Cuellar 3, Olson 0, Tippy Martinez 0, Miller 0). Every run in the game is earned as printed; there is no earned-run settlement in this game. The duplicate test ran before the number was assigned: the series had three stored games, Baltimore 6, Washington 1 in Game 1, Washington 6, Baltimore 4 in Game 2, and Baltimore 9, Washington 5 in Game 3, all different linescores, so this box score takes Game 4. The game: Baltimore struck in the Top 1, Anderson and Frank Robinson singling to the corners and Murray&#x27;s sacrifice fly scoring Anderson. Washington&#x27;s Bottom 1 hit and run moved Turner to second on Soto&#x27;s groundout but Harper grounded out behind it. Baltimore added two in the Top 3: Blair hit a solo home run off Gonzalez, Grich doubled, Anderson bunted him to third, and after Frank Robinson struck out, Murray doubled Grich home for 3-0. Washington did nothing with Rendon&#x27;s Bottom 2 walk and Johnson&#x27;s two-out single, and the middle innings went quiet: Dempsey&#x27;s Top 4 bunt forced Brooks Robinson at second, and Baltimore left the bases loaded in the Top 6 when Anderson flied out to left against a fatigued Gonzalez left in by the book. Washington&#x27;s comeback came one run at a time. In the Bottom 6 Turner singled, did not get a good jump on the steal call and stayed put, Soto doubled him to third, and after Harper struck out and Rendon walked to load the bases, Zimmerman&#x27;s forceout at second scored Turner, the run earned as printed, for 3-1. In the Bottom 7, with Sisler just in at first base for Murray, Ramos and Span singled, Turner&#x27;s forceout put runners at the corners, and Soto singled Ramos home for 3-2. In the Bottom 8 Zimmerman hit a solo home run off Cuellar to tie it 3-3, Weaver leaving his fatigued starter in and the next two batters going quietly. The ninth and tenth stayed scoreless: Frank Robinson doubled off Cordero in the Top 9 but Sisler lined out and Powell flied out; Olson struck out Span and Soto around Turner&#x27;s double in the Bottom 9; Burnett&#x27;s Top 10 ended on Harper&#x27;s range play on Ripken&#x27;s deep fly to right; and Tippy Martinez threw a perfect Bottom 10. The Top 11 decided it: Blair tripled off Burnett, Grich grounded out with the infield in and Blair held, and Anderson&#x27;s sacrifice fly to center scored him for 4-3. Miller closed the Bottom 11 in order. Baltimore stranded 11 and Washington 9. Home runs: two, Blair&#x27;s solo shot in the Top 3 off Gonzalez and Zimmerman&#x27;s solo shot in the Bottom 8 off Cuellar. Doubles: six, Grich, Murray, Powell, and Frank Robinson for Baltimore and Soto and Turner for Washington. Triples: one, Blair&#x27;s in the Top 11, the game&#x27;s decisive hit. Errors: none, an errorless game both ways, and errors_by is empty in the established shape. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: none, the CSV printing WP 0 for all nine pitchers. Passed balls: none, the fielding tables printing PB 0 for Dempsey and for Ramos. Sacrifices: three: Anderson&#x27;s sacrifice bunt in the Top 3 and the two sacrifice flies, Murray&#x27;s in the Top 1 and Anderson&#x27;s in the Top 11; Dempsey&#x27;s Top 4 bunt is a fielder&#x27;s choice at-bat (the lead runner forced, the batter safe), not a sacrifice, and reads SH 0. Stolen bases: none, and none caught; Martinez sent Turner in the Bottom 6 and Turner did not get a good jump and stayed put, the sources charging no attempt, and each catcher reads no steals against. Double plays grounded into: none; no double play was turned, the three forceout plays (Murray Top 5, Zimmerman Bottom 6, Turner Bottom 7) being fielder&#x27;s choices, not double plays. Substitutions: one: George Sisler replacing Eddie Murray at first base as a defensive sub for the Bottom 7 for Baltimore, then batting once (a lineout to third in the Top 9), so he carries both a batting line (AB 1) and a defense players line (6 putouts, including both Bottom 10 putouts on the Rendon and Zimmerman groundouts and the Bottom 11 Johnson groundout); Washington made none and prints nine batting lines, Baltimore ten. Defensive lines are built with this booking under Joe&#x27;s 2026-11-07 standing instruction: errors_by is empty because the game was errorless, and a defense object in the established shape (Baltimore 33 putouts and 17 assists, Washington 33 putouts and 9 assists; Dempsey&#x27;s 5 catcher putouts are exactly Washington&#x27;s 5 strikeouts, and Ramos&#x27;s 7 are exactly Baltimore&#x27;s 7 strikeouts, with no caught stealing to adjust either tie; Harper&#x27;s Top 10 range out on Ripken&#x27;s deep fly is carried in his fielding row&#x27;s range column and in the play rows, the defense object carrying putouts, assists, and errors in the established shape; wild pitches true zeros for all nine pitchers as the CSV prints, and passed balls true zeros for both catchers). Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Baltimore PA is AB 41 plus BB 4 plus SH 1 plus SF 2, which is 48, and the outs plus runs plus stranded identity agrees (33 outs plus 4 runs plus 11 stranded is 48); Washington PA is AB 41 plus BB 4, which is 45, and the identity agrees (33 outs plus 3 runs plus 9 stranded is 45). Batters faced tie to those totals: Baltimore 48 PA against 48 Washington BF (Gonzalez 29, Rauch 5, Storen 3, Cordero 4, Burnett 7), and Washington 45 PA against 45 Baltimore BF (Cuellar 35, Olson 4, Tippy Martinez 3, Miller 3), counted from the card. Strikeouts tie both ways: Baltimore batting 7 against Washington pitching 7 (Gonzalez 3, Storen 2, Cordero 1, Burnett 1), and Washington batting 5 against Baltimore pitching 5 (Cuellar 2, Olson 2, Tippy Martinez 1). Printed RBI: Baltimore 4 for 4 (Murray 2, Anderson 1, Blair 1) and Washington 3 for 3 (Zimmerman 2, Soto 1); every run in the game carried an RBI. The game&#x27;s play rows travel with the sources for the first time under the new export: the 103 rows in the CSV&#x27;s PLAYS (JSON) section and the standalone plays JSON were gated against the printed lines before booking (every batting and pitching line rebuilt from the rows alone exactly, batters faced included, the linescore rebuilt exactly, the rows&#x27; run totals 4 and 3, and the win probability chain closing at zero), and they are staged with the booking for the tournament&#x27;s play-by-play store. Availability from Game 3 was honored: McNally (21 outs in Game 3) and Zimmermann (18 outs) were unavailable and neither pitched, Zimmermann not appearing in the game at all, every other arm on both clubs was free, and all usage stayed inside it. Availability for Game 5, read from Game 4 outs under the standing convention (under 6 outs free, 6 to 8 outs capped at 3, 9 or more unavailable): Cuellar (24 outs) and Gonzalez (18 outs) are unavailable, Burnett (6 outs) is capped at 3 outs, and every other arm used in Game 4 (Olson, Tippy Martinez, and Miller at 3 outs each, Rauch, Storen, and Cordero at 3 outs each) is free. Twelve decisions were graded. Dave Martinez (Washington) made 7 (4 paid off, 1 backfired, 2 neutral): the Bottom 1 hit and run backfired at -0.76 (Soto grounded out and no runs scored in the rest of the inning), the game&#x27;s worst grade; the Top 6 leave-in of Gonzalez, fatigued by the book, paid off at +0.73 (Ripken popped out and the bases-loaded threat died with no runs); the Bottom 6 steal was neutral at +0.14 (Turner held, one run scoring in the rest of the inning); the Top 7 pitching change to Rauch was neutral at +0.23 (Frank Robinson walked, no runs); the Top 8 pitching change to Storen paid off at +0.73; the Top 9 pitching change to Cordero paid off at +0.73; and the Top 10 pitching change to Burnett paid off at +0.73. Earl Weaver (Baltimore) made 5 (4 paid off, 1 backfired, 0 neutral): the Bottom 7 defensive sub of Sisler at first base backfired at -0.52 (a clean inning in the field, one run scoring in the rest of the inning); the Bottom 8 leave-in of Cuellar, fatigued by the book, paid off at +0.50 (Murphy grounded out after the tying home run, no more runs); the Bottom 9 pitching change to Olson paid off at +0.73; the Bottom 10 pitching change to Tippy Martinez paid off at +0.73; and the Bottom 11 pitching change to Miller paid off at +0.73. Managers: Earl Weaver (Baltimore) and Dave Martinez (Washington). Venue is Nationals Park. Baltimore leads the series 3-1, and Washington faces elimination in Game 5 at Baltimore.">
