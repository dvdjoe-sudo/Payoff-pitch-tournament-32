  <title>L1-04-G4: Seattle Mariners 14, Arizona Diamondbacks 11</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 4, Game 4 at Chase Field, as the graded log prints the venue. Booked from the full app export set, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the standalone plays JSON, the Gazette scorecard PDF, the scorecard photo, and the graded play-by-play log. All sources agree on every figure booked. Decisions (derived from the play log and the run charges, the way this pipeline derives them when the export prints none): J.J. Putz takes the win for Seattle. He entered in the bottom of the 7th with two outs, immediately after Paul Goldschmidt&#x27;s three-run home run off Kazuhiro Sasaki had tied the game 11-11, retired Luis Gonzalez to end the inning, and then threw scoreless ball through the 8th, 9th, 10th and 11th (4.1 IP, 14 BF, 2 H, 0 R, 1 BB, 3 SO); Seattle took the lead for good in the top of the 11th, so the win is his. Randy Johnson takes the loss for Arizona: all three of Seattle&#x27;s 11th-inning runs are charged to his line (1.0 IP, 6 BF, 3 H, 3 R, 3 ER, 1 BB, 1 SO, 1 HR). No save: Putz is the winning pitcher. Scoring: Arizona scored four in the bottom of the 1st off Mark Langston (Marte triple, Carroll RBI single, Goldschmidt strikeout, Gonzalez walk, Walker three-run home run). Seattle answered with two in the top of the 3rd off Zac Gallen (Ichiro single, Rodriguez two-run home run). Arizona added one in the bottom of the 4th off Langston (Moreno single, Perdomo walk, Marte RBI double; Perdomo was then thrown out at home, Davis to Raleigh, on Carroll&#x27;s groundout) and two in the bottom of the 5th (Gonzalez single, Walker double, Williams two-run double), all off Langston, whose line closed at 4.0 innings and 7 earned runs; Jeff Nelson stranded the rest of that inning. Seattle&#x27;s seven-run top of the 7th flipped the game: Byung-Hyun Kim walked Buhner, struck out Raleigh, walked Davis, gave up Boone&#x27;s RBI single, walked Seager (pinch-hitting for Beltré) and walked Ichiro to force in a run, and five of the inning&#x27;s seven runs are charged to Kim; Andrew Chafin, who faced two batters and retired neither, gave up Rodriguez&#x27;s two-run single and Griffey&#x27;s three-run home run, and the two runs charged to Chafin are Rodriguez and Griffey themselves. Arizona tied it in the bottom of the 7th with four runs off Sasaki, only one of them earned: Upton&#x27;s ground-rule double came home when Perdomo reached on Sasaki&#x27;s two-base error (unearned); Marte struck out; Carroll struck out but reached on the dropped third strike, which the graded log calls a passed ball on Raleigh while the CSV also prints a wild pitch on Sasaki&#x27;s line for the inning, and both are booked as printed (PB Raleigh, WP Sasaki; Carroll&#x27;s run unearned); and Goldschmidt&#x27;s three-run home run scored Perdomo, Carroll and himself, of which only Goldschmidt&#x27;s own run is earned. Seattle went back ahead with two in the top of the 8th off Archie Bradley (Boone walk, Seager single, Ichiro RBI single, Rodriguez strikeout, Griffey RBI single). The 9th and 10th were scoreless: Seattle&#x27;s Putz held Arizona, and Arizona&#x27;s own J.J. Putz threw a scoreless top of the 10th (1.0 IP, 2 H). The same pitcher appears on both clubs&#x27; pitching lines in this game, each keyed per (team, player_id) exactly as played, the same treatment as Randy Johnson&#x27;s two-club game in Game 1 of this series. In the top of the 10th Arizona also got a second out on Rodriguez&#x27;s flyout to Upton in center, Upton throwing home for the outfield assist and Moreno the putout as Seager tried to score. Seattle won it in the top of the 11th off Johnson: Martínez doubled, Harold Reynolds pinch-ran and scored on Buhner&#x27;s RBI single, Raleigh hit a two-run home run, Davis flied out, and Boone walked and was caught stealing. Errors: one in the game, Sasaki&#x27;s two-base error in the bottom of the 7th, carried in errors_by in the established shape; Arizona was errorless. Double plays: two each. Arizona turned Martínez&#x27;s in the top of the 3rd and Ichiro&#x27;s in the top of the 5th; Seattle turned Upton&#x27;s in the bottom of the 8th and Walker&#x27;s in the bottom of the 10th. Substitutions: Seager pinch-hit for Beltré in the top of the 7th (walk), stayed in at third base, and went 2 for 3 with two runs scored; Reynolds pinch-ran for Martínez in the top of the 11th and scored the go-ahead run without an at-bat. Ketel Marte returned to Arizona&#x27;s lineup at second base (he sat in Game 3) and Justin Upton started in center field in place of Finley. Fielding from the CSV&#x27;s printed fielding section: Seattle 33 putouts and 15 assists with the one error, one wild pitch (Sasaki) and one passed ball (Raleigh); Arizona 33 putouts and 13 assists, errorless, one wild pitch (Ziegler). Counting checks: Seattle plate appearances 54 (45 AB, 9 BB) equal Arizona&#x27;s 54 batters faced (Gallen 22, Kim 6, Chafin 2, Bradley 9, Ziegler 5, Putz 4, Johnson 6); Arizona plate appearances 53 (47 AB, 6 BB) equal Seattle&#x27;s 53 batters faced (Langston 24, Nelson 4, Rhodes 5, Sasaki 6, Putz 14). Hit, walk and strikeout totals tie across the two boxes both ways (Seattle batting 12 strikeouts against Arizona pitching 12: Gallen 5, Kim 1, Bradley 3, Ziegler 2, Johnson 1; Arizona batting 10 against Seattle pitching 10: Langston 2, Nelson 2, Rhodes 1, Sasaki 2, Putz 3). RBI totals: Seattle 14, equal to its run total; Arizona 10 against 11 runs, the difference being Upton&#x27;s unearned run in the 7th, which carries no RBI. Manager grades: Lou Piniella graded 13 decisions (8 paid off, 4 backfired, 1 neutral): the top-of-the-7th pinch hitter (Seager, platoon) paid off at +5.12, the top-of-the-11th pinch runner (Reynolds) at +2.15, the top-of-the-8th steal send at +1.49, the bottom-of-the-5th pitching change (Nelson) at +1.35, three fatigued left-pitcher-in calls on Putz in the bottoms of the 9th, 10th and 11th at +0.73 each, and the bottom-of-the-7th change to Putz at +0.35; against those, the bottom-of-the-7th change to Sasaki backfired at -3.77, steal sends in the tops of the 3rd and 5th backfired at -0.51 each, the top-of-the-11th steal backfired at -0.76 (Boone caught stealing), and the bottom-of-the-6th change (Rhodes) was neutral at +0.23. Bob Brenly graded 7 decisions (3 paid off, 3 backfired, 1 neutral): the top-of-the-7th change to Kim backfired at -6.77, the worst single grade of the series, the top-of-the-7th change to Chafin backfired at -3.71, and the top-of-the-11th change to Johnson backfired at -2.77; the top-of-the-7th change to Bradley paid off at +0.50, the top-of-the-8th change to Ziegler at +0.73 and leaving Johnson in against Davis in the top of the 11th at +0.73, and the top-of-the-10th change to his own Putz was neutral at +0.23. Availability audit for this game, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Brandon Webb (21 outs in Game 3) and Jamie Moyer (21 outs in Game 3) were both UNAVAILABLE, and neither pitched (the starters were Gallen and Langston). Both clubs stayed legal. The win closes the series: Seattle sweeps it four games to none and advances to Losers Round 2, and Arizona, with its second series loss, is eliminated. Series MVP is Joe&#x27;s to rule; no MVP is booked with this game. Managers: Lou Piniella (Seattle) and Bob Brenly (Arizona). Venue is Chase Field, as printed.">
