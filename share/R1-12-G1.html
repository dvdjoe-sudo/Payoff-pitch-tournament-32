  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-03: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-12 Game 1 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Minnesota Twins (seed 12) vs New York Mets (seed 21), home pattern 2-2-1-1-1, Game 1 at Target Field in Minneapolis, and Minnesota leads the series 1-0 with this win. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number, with no run-accounting knot and no settlement needed. The decisions are not printed; they are derived from the play log and the run charges on the card. Jhoan Duran takes the win: he entered the Top 8 with one out, after Piazza and Alonso had reached on errors to put runners at second and third, and held New York scoreless through the ninth (1.2 IP, 1 H, 0 R, 1 BB, 2 SO), so he was Minnesota&#x27;s pitcher of record when the walk-off runs scored in the Bottom 9. Edwin Díaz takes the loss: he entered the Bottom 9 with a 5-4 lead and gave up Carew&#x27;s single, Mauer&#x27;s game-tying triple, and, after Puckett&#x27;s strikeout and Killebrew&#x27;s intentional walk, Goslin&#x27;s walk-off double (0.1 IP, 3 H, 2 ER, 1 BB, 1 SO). No save: the game ended on the walk-off. Both starters took no-decisions. Tom Seaver (5.2 IP, 6 H, 4 ER, 3 BB, 6 SO, 1 HR) left in the Bottom 6 with New York ahead 5-2; the two runs charged to him in that inning were his runners, Oliva and Hrbek, who scored on singles by Cronin (off Seaver) and Gaetti (off Wagner). Walter Johnson (7.1 IP, 7 H, 5 ER, 3 BB, 4 SO, 1 HR) left in the Top 8 trailing 5-4 and escaped the loss when Minnesota tied the game in the ninth. Run charges match the printed lines exactly: New York pitching allows 4 + 0 + 0 + 2 = 6 (Seaver four, Wagner and Benítez none, Díaz the two ninth-inning runs), and Minnesota pitching allows 5 + 0 = 5 (Johnson all five, Duran none). The charge detail: Seaver&#x27;s four are Puckett in the Bottom 1 (solo home run), Goslin in the Bottom 2 (singled and scored from first on Oliva&#x27;s hit-and-run single), and Oliva and Hrbek in the Bottom 6 as described above. Johnson&#x27;s five are Strawberry and Piazza in the Top 2 (Strawberry walked and scored on Piazza&#x27;s two-run home run), Beltran in the Top 2 (walked, reached third on Jones&#x27;s forceout, which retired Alfonzo at second, and scored on Lindor&#x27;s single), Alonso in the Top 4 (singled and scored on Alfonzo&#x27;s single), and Wright in the Top 5 (doubled and scored on Piazza&#x27;s groundout). Díaz&#x27;s two are Carew (singled) and Mauer (tripled) in the Bottom 9. Printed RBI ties as printed with no settlement: New York 5 (Piazza 3, Lindor 1, Alfonzo 1) against 5 runs, and Minnesota 6 (Mauer 1, Puckett 1, Goslin 1, Oliva 1, Cronin 1, Gaetti 1) against 6 runs. The duplicate test ran before the number was assigned: the R1-12 series entry held no stored games, so this box score is no duplicate, and this is the first game of the series in play order, booked as Game 1. The game: Seaver and Johnson traded a scoreless top of the first, and Puckett&#x27;s solo home run in the Bottom 1 gave Minnesota the first lead. New York answered with three in the Top 2: Strawberry walked, Piazza hit a two-run home run, and after Alonso struck out, Beltran and Alfonzo walked, Jones forced Alfonzo at second, and Lindor singled Beltran home. Minnesota got one back in the Bottom 2 on Oliva&#x27;s hit-and-run single, which scored Goslin from first. New York stretched the lead in the Top 4, when Alonso and Beltran singled and Alfonzo singled Alonso home, and again in the Top 5, when Wright doubled and scored on Piazza&#x27;s groundout, for 5-2. In the Bottom 6 Minnesota closed within one: Oliva walked, Hrbek and Cronin singled him home, Wagner relieved Seaver, and Gaetti singled Hrbek home for 5-4. Johnson&#x27;s day ended in the Top 8: he struck out Strawberry, then Piazza reached on Hrbek&#x27;s error at first and Alonso on Carew&#x27;s two-base error at second, and Duran came in with runners at second and third and struck out Beltran and got Alfonzo&#x27;s fly out to strand them. Benítez pitched a scoreless Bottom 8 for New York. Duran finished a scoreless Top 9 around Olerud&#x27;s walk and Wright&#x27;s single, and in the Bottom 9 Carew singled off Díaz, Mauer tripled him home to tie the game, and after Puckett struck out and Killebrew was walked intentionally, Goslin doubled Mauer home to win it. Home runs: one for each club, Piazza for New York (Top 2, two-run) and Puckett for Minnesota (Bottom 1, solo). Doubles: Wright for New York and Goslin for Minnesota (the walk-off). Triples: Mauer for Minnesota (Bottom 9, the tying run batted in). Errors: Minnesota two, Hrbek (Top 8, at first base on Piazza&#x27;s grounder) and Carew (Top 8, two-base error at second base on Alonso&#x27;s grounder); the two errors put the tying and go-ahead runs at second and third with one out in the Top 8, but no run scored on them or after them in the inning, and all five New York runs are earned. New York played errorless ball. Hit batters: none; every pitcher&#x27;s HBP column on both grids reads zero and no batter on either side was hit, so HB 0 is carried for every pitcher as card-sourced values and the hit batter check runs on real data. Wild pitches: Armando Benítez 1, printed on the card; no run scored on it. Sacrifices: none; there was no bunt and no sacrifice fly on either side (Piazza&#x27;s Top 5 run-scoring play was an ordinary groundout to second base), so the split lines read SH 0 and SF 0 for every batter, log-proven. Stolen bases: none; the printed SB and CS columns are 0 for both clubs. Davey Johnson sent Beltran twice (Top 2 and Top 6) and the runner was held for a bad jump both times, so neither send is a steal attempt on the record; Kelly&#x27;s three hit-and-run calls are not steals either. Double plays grounded into, counted from the play log: one, Alfonzo in the Top 6 for New York, exactly as the card extras read; Minnesota grounded into none, Cronin&#x27;s Bottom 2 fielder&#x27;s choice being a forceout only. Substitutions: New York made two, both defensive and both graded as paid off: John Olerud replaced Hernandez at first base for the Bottom 7 and walked in his only plate appearance, carrying the printed batting line AB 0, R 0, BB 1; and Jeff McNeil replaced Alfonzo at second base for the Bottom 8, had no plate appearance, and so carries no batting line and is carried in this recap only. Minnesota made one: Sam Rice pinch-ran for Killebrew in the Bottom 9 after the intentional walk, did not score, and carries the printed line AB 0, R 0; Killebrew&#x27;s designated hitter spot did not bat again. Batters faced are counted from the play log and tie to the batting PA totals both ways (New York 40 PA against 40 Minnesota BF: Johnson 33, Duran 7; Minnesota 41 PA against 41 New York BF: Seaver 26, Wagner 6, Benítez 4, Díaz 5). New York PA is AB 36 plus BB 4; Minnesota PA is AB 37 plus BB 4. Twelve decisions were graded. Davey Johnson made 7 (4 paid off, 3 backfired, 0 neutral): the two defensive substitutions paid off at +0.48 each (Olerud in the Bottom 7, McNeil in the Bottom 8), the Bottom 8 change to Benítez paid off at +0.73, and the Top 2 steal send paid off at +0.49 on the held runner; his backfires were the Top 6 steal send at -0.86, the Bottom 6 change to Wagner at -0.77 (Gaetti&#x27;s single scored Seaver&#x27;s runner behind it), and the Bottom 9 change to Díaz at -1.77, the game&#x27;s worst grade, the closer giving up the tie and the winner. Tom Kelly made 5 (2 paid off, 2 backfired, 1 neutral): the Top 8 change to Duran paid off at +1.63, the game&#x27;s best grade, stranding the two error runners at second and third, and the Bottom 2 hit and run that scored Goslin from first paid off at +0.39; his backfires were the second Bottom 2 hit and run at -0.76 (Cronin&#x27;s fielder&#x27;s choice) and the Bottom 7 hit and run at -0.76; the Bottom 9 Rice pinch runner was neutral at -0.13, Rice not scoring on Goslin&#x27;s double. Managers: Davey Johnson (New York) and Tom Kelly (Minnesota). Venue is Target Field. Availability compliance: this is the first game of the series, so no pitcher carried a restriction into it. Game 2 availability, under the house convention that reads only this game: Seaver (17 outs) and Walter Johnson (22 outs) are both UNAVAILABLE, and Wagner (4 outs), Duran (5), Benítez (3) and Díaz (1) are all free. Each club started its rotation number 1, Seaver for New York and Walter Johnson for Minnesota; the rotations turn to the number 2 starters for Game 2, again in Minneapolis.">
