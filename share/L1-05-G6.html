  <meta name="description" content="Losers Bracket, Round 1, Series 5, Game 6 at Coors Field, as the master export&#x27;s box score prints the venue. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every source inside the export agrees on every figure booked. Decisions: Chuck Finley takes the win for Los Angeles (6.0 IP, 25 BF, 5 H, 2 R, 2 ER, 1 BB, 4 SO). Kyle Freeland takes the loss for Colorado (1.2 IP, 12 BF, 5 H, 4 R, 4 ER, 2 BB, 1 SO). No save: Huston Street pitched the last two innings for Colorado in a nine-run game, and the export&#x27;s report credits none. Scoring: Colorado scored one in the bottom of the 1st off Finley (Blackmon single, LeMahieu strikeout, Helton fielder&#x27;s choice forcing Blackmon at second, Arenado double scoring Helton from first, Walker groundout). Los Angeles scored four in the top of the 2nd off Freeland (Edmonds single, Grich sacrifice bunt, Fregosi RBI single, Boone RBI double, Ohtani lineout, Trout RBI double, Guerrero RBI single; Fuentes then relieved Freeland and retired Glaus on a flyout). Los Angeles scored one in the top of the 3rd off Fuentes (Joyner single, Edmonds flyout, Grich sacrifice bunt, Fregosi RBI single). Los Angeles scored two in the top of the 4th off Logan (Trout solo home run, Guerrero strikeout, Glaus double, Joyner RBI single). Los Angeles scored two in the top of the 5th off DiPoto (Grich single, Fregosi walk, Boone groundout advancing both runners, Ohtani popout, Trout two-run single). Colorado scored one in the bottom of the 5th off Finley (Torrealba single, Tulowitzki forceout at second with the batter safe at first, Blackmon hit-and-run single scoring Tulowitzki from first). Los Angeles scored two in the top of the 7th off Belisle (Grich solo home run, Fregosi single and groundouts by Boone and Ohtani moving him to third, then Fregosi scored on Belisle&#x27;s wild pitch during Trout&#x27;s at-bat before Trout struck out to end the inning). Los Angeles&#x27;s 11 runs carry only 10 RBI: the 11th run is Fregosi&#x27;s, scored from third on the wild pitch with no RBI charged, exactly as the play rows record it (the row for Trout&#x27;s strikeout shows 1 run, 0 RBI, Fregosi scored, with the step &quot;Wild pitch! Runners advance 1 (p9).&quot;). Errors: Los Angeles 1, Jim Edmonds in left field (Arenado reached on the one-base error in the bottom of the 6th); it cost nothing, both Colorado runs were earned, and Colorado&#x27;s staff earned-run total ties to Los Angeles&#x27;s 11 runs because Colorado was errorless. No double play was turned by either club: no play produced two outs, no batter carries a printed GIDP, and the play rows contain no double-play code; the printed fielding section&#x27;s GDP credits for Story and LeMahieu sit on [great play] range-out plays (Ohtani&#x27;s top of the 4th popout to short, and Boone&#x27;s top of the 5th groundout with runners advancing), as the log tags them. Stolen bases: Trout in the top of the 1st, off Freeland and against Torrealba, whose catching line prints 1 stolen base against and no caught stealings. Wild pitches: Harvey 1 (bottom of the 7th, advancing Tulowitzki, no run) and Belisle 1 (the run-scoring pitch in the top of the 7th). Passed balls: none for either club. No substitutes appeared for either club; all nine starters batted for each side. Fielding from the CSV&#x27;s printed fielding section: Los Angeles 27 putouts and 11 assists (Boone 10 putouts; Fregosi 7 assists); Colorado 27 putouts and 12 assists (Helton 13 putouts; Story 5 assists). Counting checks: Los Angeles plate appearances 45 (40 AB, 3 BB, 2 SH) equal Colorado&#x27;s 45 batters faced (Freeland 12, Fuentes 6, Logan 6, DiPoto 6, Betancourt 3, Belisle 5, Street 7); Colorado plate appearances 36 (35 AB, 1 BB) equal Los Angeles&#x27;s 36 batters faced (Finley 25, Harvey 4, Shields 4, Rodríguez 3). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Mike Scioscia graded 10 decisions (6 paid off, 1 backfired, 3 neutral): hit and runs 3 (the top of the 1st backfired, -0.76; the top of the 5th paid off, +0.31; the top of the 7th neutral, -0.11), steals 3 (the top of the 2nd paid off, +2.49; one in the top of the 3rd neutral, +0.14; the other in the top of the 3rd paid off, +0.49), one sacrifice bunt (the top of the 2nd paid off, +3.39), and pitching changes 3 (Harvey in the bottom of the 7th neutral, +0.23; Shields in the bottom of the 8th paid off, +0.73; Rodríguez in the bottom of the 9th paid off, +0.73). Bud Black graded 10 decisions (6 paid off, 3 backfired, 1 neutral): pitching changes 6 (Fuentes in the top of the 2nd paid off, +0.47; Logan in the top of the 4th backfired, -1.27; DiPoto in the top of the 5th backfired, -1.77; Betancourt in the top of the 6th paid off, +0.73; Belisle in the top of the 7th backfired, -1.77; Street in the top of the 8th paid off, +0.73), left pitcher in 2 (Logan left in during the top of the 4th paid off, +0.47; DiPoto left in during the top of the 5th paid off, +0.47), and hit and runs 2 (the bottom of the 1st neutral, +0.24; the bottom of the 5th paid off, +0.74). Game 5&#x27;s availability was honored in this game: Mark Langston (17 outs in Game 5, unavailable) did not pitch for Los Angeles, and Jhoulys Chacin (21 outs in Game 5, unavailable) did not pitch for Colorado; neither appears in the pitching lines or the play rows. Availability for Game 7 at Los Angeles (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; availability reads only the previous game and lasts exactly one game, so the Game 5 restrictions expire with this game): Los Angeles: Finley (18 outs) is unavailable; Harvey (3 outs), Shields (3) and Rodríguez (3) are free; every other Los Angeles arm is free, nobody capped. Colorado: Street (6 outs) is capped at 3 outs; Freeland (5 outs), Fuentes (4), Logan (3), DiPoto (3), Betancourt (3) and Belisle (3) are free; every other Colorado arm is free. Managers: Mike Scioscia (Los Angeles) and Bud Black (Colorado). Venue is Coors Field, as printed.">
