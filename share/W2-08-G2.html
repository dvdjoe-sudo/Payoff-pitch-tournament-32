  <title>W2-08-G2: Cincinnati Reds 7, Pittsburgh Pirates 10</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 8, Game 2 at PNC Park. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Pittsburgh beat Cincinnati 10-7 to lead the series 2-0, in a game that changed hands all afternoon. Decisions: Mark Melancon takes the win for Pittsburgh (2.0 IP, 5 BF, 0 H, 0 R, 0 ER, 0 BB, 2 SO), the fireman call in the top of the 7th: Kent Tekulve had put two on with nobody out (George Foster&#x27;s single and Ted Kluszewski&#x27;s single plus Barry Bonds&#x27;s error in left), and Melancon stranded both inherited runners (2 inherited, 0 scored), Davis&#x27;s fielder&#x27;s choice cutting Foster down at home with the infield in and Barry Larkin flying out. Rob Dibble takes the loss for Cincinnati (1.0 IP, 5 BF, 1 H, 1 R, 1 ER, 1 BB, 1 SO): in the bottom of the 7th he walked Manny Sanguillen, Pie Traynor and Bill Mazeroski sacrificed in turn, and Honus Wagner doubled Sanguillen home for the 8-7 lead, the export&#x27;s decisive play. Grant Jackson earns the save (1.0 IP, 3 BF, 1 H, 0 R, 0 ER, 1 SO), ending it on Foster&#x27;s double play in the top of the 9th. Francisco Cordero is charged with the blown save in the Rec extra list: his bottom of the 5th (0.2 IP, 6 BF, 3 H, 3 R, 3 ER, 3 BB, 1 WP) let Pittsburgh tie the game 6-6. Barry Bonds is the export&#x27;s player of the game (2 for 3, a double and a home run, 3 RBI, 2 walks, 1 run). Scoring: the top of the 2nd, Joey Votto walked, stole second and scored on Eric Davis&#x27;s single off Wilbur Cooper, 1-0. The bottom of the 3rd, Traynor singled, stole second, and after Mazeroski&#x27;s popped-up bunt and Wagner&#x27;s strikeout, Andrew McCutchen singled him home; Roberto Clemente singled and Bonds walked, and Willie Stargell&#x27;s two-run single off Bucky Walters made it 3-1. The top of the 4th, two forceouts and singles by Larkin, Pete Rose (1 run) and Joe Morgan (1 run) off Cooper tied it 3-3. The top of the 5th, all three runs unearned as printed: Johnny Bench reached on Bill Mazeroski&#x27;s error, Votto singled, Foster struck out and Tony Perez lined out, and Davis hit a three-run home run; a clean inning ends before Davis bats, so Cooper&#x27;s line reads 6 R and 3 ER. The bottom of the 5th tied it again off Cordero: Clemente and Bonds were both caught stealing, but Stargell and Ralph Kiner walked and Sanguillen&#x27;s single drove in two, then Traynor&#x27;s triple drove in Sanguillen, 6-6; Clay Carroll finished the inning (1 inherited, 0 scored). The top of the 6th, Rose and Morgan singled off Dave Giusti, Roy Face came on (2 inherited, 1 scored) and Bench singled Rose home, 7-6, before Votto grounded into a double play. The bottom of the 6th, Wagner walked, McCutchen singled, Paul Waner pinch-hit for Clemente and flew out, and Bonds doubled Wagner home off Carroll, 7-7. The bottom of the 7th made it 8-7 as above. The bottom of the 8th, Waner singled off Jim Maloney and Bonds hit a two-run home run, 10-7. Pitching: Cooper started for Pittsburgh (4.2 IP, 26 BF, 9 H, 6 R, 3 ER, 2 BB, 2 SO, 1 HR); Giusti (0.1 IP, 3 BF, 2 H, 1 ER) finished the 5th and opened the 6th; Face (1.0 IP, 3 BF, 1 H, 0 R) finished the 6th; Tekulve (0.0 IP, 2 BF, 2 H, 0 R) opened the 7th and Melancon and Jackson closed it. For Cincinnati, Walters (3.0 IP, 15 BF, 4 H, 3 ER, 2 BB, 3 SO) and John Franco (1.0 IP, 5 BF, 0 H, 0 R, 1 BB) covered the first four innings; Cordero and Carroll (1.1 IP, 7 BF, 2 H, 1 ER, 1 BB) the middle; Dibble the 7th; Maloney (1.0 IP, 6 BF, 3 H, 2 ER, 1 BB, 1 HR) the 8th. Errors: three: Franco in the bottom of the 4th (Wagner reached, cost nothing), Mazeroski in the top of the 5th (the unearned inning above) and Bonds in the top of the 7th (cost nothing, Melancon stranding both runners). Double plays: Pittsburgh 2 (Votto in the top of the 6th, Foster in the top of the 9th) and Cincinnati 1 (Sanguillen in the bottom of the 8th). One GIDP-definition note under the standing practice: the play rows code Davis&#x27;s top-of-the-4th forceout &quot;DP 5-4-3&quot;, but the row itself records one out and the log says no double play, so Davis&#x27;s printed GIDP of 0 stands in the book and the rows are booked as they stand. Caught stealing: Clemente and Bonds, both in the bottom of the 5th, both thrown out by Johnny Bench; stolen bases: Votto in the top of the 2nd and Traynor in the bottom of the 3rd. The catching lines as printed: Bench PB 0, 3 steal attempts against, 1 stolen base, 2 caught stealing; Sanguillen PB 0, 1 attempt against, 1 stolen base, 0 caught stealing. Defensive lines are booked in the established shape from the printed fielding section (Cincinnati 24 putouts and 14 assists, Votto 12 putouts, Rose 4 assists; Pittsburgh 27 putouts and 14 assists, Stargell 8 putouts, Wagner 5 assists). Substitutes: Waner for Clemente in the bottom of the 6th, staying in right field; Kluszewski for Perez (the DH) in the top of the 7th; Tommy Leach for Traynor at third base for defense in the top of the 8th. Wild pitches: Cordero 1. Passed balls: none. Hit by pitch: none. One brief correction against the export: the brief credited Clemente with a sacrifice, but the export prints none for him (its SH line names only Traynor and Mazeroski, and Mazeroski&#x27;s bottom-of-the-3rd popped-up bunt is an at bat), so he books with SH 0. Counting checks: Cincinnati plate appearances 42 (40 AB, 2 BB) equal Pittsburgh&#x27;s 42 batters faced (Cooper 26, Giusti 3, Face 3, Tekulve 2, Melancon 5, Jackson 3); Pittsburgh plate appearances 44 (33 AB, 9 BB, 2 SH) equal Cincinnati&#x27;s 44 batters faced (Walters 15, Franco 5, Cordero 6, Carroll 7, Dibble 5, Maloney 6). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Cincinnati&#x27;s seven runs carry seven RBIs; Pittsburgh&#x27;s ten runs carry ten RBIs. Manager grades: the grades list names both managers directly, so no label mapping is needed. Danny Murtaugh graded 13 decisions (9 paid off, 2 backfired, 2 neutral): 5 steals (4 paid off, 1 backfired), 5 pitching changes (3 paid off, 2 neutral), 1 pinch hitter (backfired, Waner&#x27;s bottom-of-the-6th flyout), 1 sacrifice bunt (paid off, Traynor in the bottom of the 7th) and 1 defensive sub (paid off, Leach). Sparky Anderson graded 12 decisions (5 paid off, 7 backfired): 5 steals (3 paid off, 2 backfired), 5 pitching changes (2 paid off, 3 backfired), 1 left pitcher in (backfired) and 1 pinch hitter (backfired on the grade, though Kluszewski singled). Availability for Game 3 under the convention: Wilbur Cooper (14 outs in this game) and Bucky Walters (9 outs) are unavailable; Mark Melancon (6 outs) is capped at 3 outs; everyone else who pitched recorded 4 outs or fewer and is free (Clay Carroll 4, Dave Giusti 1, Roy Face 3, Kent Tekulve 0, Grant Jackson 3, John Franco 3, Francisco Cordero 2, Rob Dibble 3, Jim Maloney 3). Pittsburgh leads the series 2-0. Managers: Danny Murtaugh (Pittsburgh) and Sparky Anderson (Cincinnati). Venue is PNC Park, as printed.">
