  <title>L1-07-G7: San Diego Padres 7, Milwaukee Brewers 2</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 7, Game 7 at American Family Field, as the master export&#x27;s box score prints the venue. San Diego wins the series 4-3 and advances to Losers Round 2; Milwaukee is eliminated. San Diego won Game 1 (11-8), Milwaukee won Game 2 (10-7) and Game 3 (5-3), San Diego won Game 4 (4-3) and Game 5 (19-13), and Milwaukee won Game 6 (4-3) to tie the series 3-3 and force this game. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. A series master export Joe sent for the whole Brewers-Padres series carries this same game as its Game 7 record, and the two exports agree in every field checked (linescore, batting, pitching and fielding lines, decisions, graded decisions, and all 92 play rows identical). Decisions: Randy Jones takes the win for San Diego (8.0 IP, 33 BF, 5 H, 2 R, 2 ER, 3 BB, 3 SO), eight innings of two-run ball in the deciding game. Brandon Woodruff takes the loss for Milwaukee (3.2 IP, 18 BF, 6 H, 3 R, 3 ER, 1 BB, 2 SO, 1 HR). Mike Adams pitched a scoreless 9th for San Diego (1.0 IP, 5 BF, 2 H, 0 R, 2 SO) with a five-run lead, so there is no save. Ken Caminiti was the export&#x27;s Player of the Game (3 for 5, 1 2B, 1 HR, 3 R, 3 RBI); the Report names Mark Loretta&#x27;s top-of-the-4th single as the decisive play. Scoring: San Diego opened the scoring in the top of the 2nd on Caminiti&#x27;s solo home run off Woodruff. Milwaukee answered with both of its runs in the bottom of the 2nd: Cooper doubled, Fielder&#x27;s single scored Cooper, Contreras singled, and Jenkins&#x27;s forceout at second scored Fielder; Jenkins then stole second with shortstop Tatis dropping the throw (SB+E6), Turang and Braun walked to load the bases, and Jones escaped on Yelich&#x27;s flyout and Molitor&#x27;s lineout. Milwaukee never scored again. San Diego went ahead for good in the top of the 4th, all off Woodruff: Sheffield singled, Machado reached on a forceout, Tenace walked, Finley&#x27;s single scored Machado, and Loretta&#x27;s single scored Tenace, the go-ahead run; Dan Plesac relieved with runners at the corners and two out and got Tatis on a groundout (the export carries Plesac&#x27;s inherited runners as 2 in, 0 scored). San Diego added two in the top of the 5th off Plesac: Gwynn singled, Winfield&#x27;s groundout advanced him, Caminiti&#x27;s single scored Gwynn, and Machado&#x27;s double scored Caminiti. In the bottom of the 6th, with two out and the bases empty and Milwaukee trailing 5-2, William Contreras was robbed of a home run by San Diego center fielder Steve Finley, who took it away at the wall for the third out. In the bottom of the 8th Milwaukee made its last threat against Jones: Yount doubled with two out, Cooper reached on Tatis&#x27;s one-base error, Fielder walked to load the bases, and Contreras grounded out to first, to Adrian Gonzalez, the defensive substitute. San Diego closed it in the top of the 9th off Josh Hader: Tatis struck out, Gwynn popped out, Winfield walked, Caminiti&#x27;s double scored Winfield, and one more run scored without an RBI (below); Machado walked and Tenace grounded out. Adams finished the bottom of the 9th: Jenkins and Braun singled around Turang&#x27;s strikeout, Yelich flied out and Molitor struck out. The no-RBI run: San Diego scored 7 runs on 6 printed RBIs (Caminiti 3, Machado 1, Finley 1, Loretta 1); the seventh is play row sequence 80 in the top of the 9th: Adrian Gonzalez struck out against Hader, but the third strike was dropped and catcher William Contreras&#x27;s throw to first went wild (E2), Gonzalez reached, and Caminiti scored from second with no RBI; the inning continued under the export&#x27;s extra-out note before Tenace&#x27;s groundout ended it. The run is charged earned to Hader exactly as printed (his line carries both 9th-inning runs as earned, 2 R and 2 ER), and the earned-run totals tie exactly: Milwaukee&#x27;s staff total of 7 equals San Diego&#x27;s 7 runs and San Diego&#x27;s staff total of 2 equals Milwaukee&#x27;s 2 runs. The play is a dropped third strike with a throwing error, not a wild pitch: there are no wild pitches in the game. Errors: three. Tatis made both of San Diego&#x27;s (the dropped throw on Jenkins&#x27;s 2nd-inning steal, and the one-base error on Cooper in the 8th); neither scored a run. Milwaukee&#x27;s one error is Contreras&#x27;s E2 on the dropped third strike, the game&#x27;s only run-scoring error. Double plays: none, in the play rows or the print; no GIDP difference arises in this game. Stolen bases: Jenkins one (with the error); no one was caught stealing. Passed balls: none. Hit by pitch: none. Substitutes: San Diego&#x27;s Adrian Gonzalez replaced Gary Sheffield at first base in the bottom of the 8th (defensive sub) and batted once, the dropped-third-strike play in the top of the 9th; he carries 3 putouts, including Contreras&#x27;s bases-loaded groundout that ended the 8th. Neither club used another substitute who batted or fielded. Fielding from the CSV&#x27;s printed fielding section: San Diego 27 putouts and 6 assists and 2 errors (Tatis 3 assists and both errors; stolen-base attempts against Tenace 1, Jenkins successful); Milwaukee 27 putouts and 7 assists and 1 error (Yount 4 assists; Yelich also carries one range out, as printed). Counting checks: San Diego plate appearances 43 (39 AB, 4 BB) equal Milwaukee&#x27;s 43 batters faced (Woodruff 18, Plesac 7, Williams 3, Fingers 4, Jeffress 4, Hader 7); Milwaukee plate appearances 38 (35 AB, 3 BB) equal San Diego&#x27;s 38 batters faced (Jones 33, Adams 5). Hit, walk, hit-by-pitch, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Pat Murphy graded 11 decisions (4 paid off, 4 backfired, 3 neutral): three steals (Jenkins&#x27;s in the bottom of the 2nd neutral, -0.26; two in the bottom of the 9th backfired, -0.86 and -0.51, the runner held each time), five pitching changes (Plesac in the top of the 4th paid off, +0.73; Devin Williams in the top of the 6th paid off, +0.73; Fingers in the top of the 7th paid off, +0.73; Jeffress in the top of the 8th neutral, +0.23; Hader in the top of the 9th backfired, -1.27, with two runs scoring in the rest of the inning), two left-pitcher-in calls (Plesac staying in for the top of the 5th paid off, +0.57; Hader staying in during the top of the 9th neutral, -0.03) and one hit and run (the bottom of the 9th backfired, -1.13). Bruce Bochy graded 4 decisions (0 paid off, 1 backfired, 3 neutral): two hit and runs (the top of the 5th neutral, +0.24; the top of the 8th backfired, -0.76), one defensive sub (Gonzalez at first base in the bottom of the 8th neutral, +0.23) and one pitching change (Adams in the bottom of the 9th neutral, +0.23). Series graded totals: Murphy 85 decisions (33 paid off, 36 backfired, 16 neutral); Bochy 48 (22 paid off, 16 backfired, 10 neutral). Availability compliance: Jake Peavy (18 outs in Game 6) was unavailable for San Diego and did not pitch; Teddy Higuera (13 outs in Game 6) was unavailable for Milwaukee and did not pitch. Series final: San Diego wins 4-3. Series runs: San Diego 54, Milwaukee 45 (99 total, the tournament&#x27;s highest-scoring series). San Diego advances to Losers Round 2; Milwaukee is eliminated with its second series loss. No series MVP is booked with this game: Joe rules the MVP separately. Managers: Pat Murphy (Milwaukee) and Bruce Bochy (San Diego). Venue is American Family Field, as printed.">
