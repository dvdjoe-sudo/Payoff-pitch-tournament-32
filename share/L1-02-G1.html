  <title>L1-02-G1: Washington Nationals 1, Baltimore Orioles 6</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as four files on 2026-11-08: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), the full graded play-by-play text, and the scorecard CSV export; official L1-02 Game 1 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This is Losers Bracket Round 1, Series 2: the Baltimore Orioles (seed 15) against the Washington Nationals (seed 31), from the reseeded pool of the 16 opening-round losers, paired highest against lowest in pairing order; Philadelphia (11) against Miami (32) took L1-01, so the next pairing is the next highest seed against the next lowest, Baltimore against Washington, L1-02, and the archive slot&#x27;s own formation entry states the same rule and gate (reseed-high-vs-low, losers of the 16 opening-round series, forms when Round 1 is complete). The seeds are verified against the archive&#x27;s completed opening entries: Baltimore was seed 15 in R1-15 and lost that series to Kansas City, and Washington was seed 31 in R1-02 and lost that series to San Francisco. Both clubs carry one series loss into this series, so the loser of this series is eliminated and the winner survives to Losers Round 2. The slot still sat as an unfilled shell with no clubs when this box score arrived, the opening round having closed on 2026-11-07, so the formation was written into the L1-02 entry as part of this booking: Baltimore as team_a at seed 15, Washington as team_b at seed 31, home pattern 2-2-1-1-1 with Baltimore home for Games 1, 2, 5, and 7 and Washington home for Games 3, 4, and 6, the shell&#x27;s other fields untouched and no other slot formed. Home pattern 2-2-1-1-1, Game 1 at Oriole Park at Camden Yards in Baltimore. Box score record: the four sources carry the linescore, the full batting and pitching lines, the fielding lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Jim Palmer takes the win: he pitched the complete game (9.0 IP, 4 H, 1 R, 1 ER, 2 BB, 4 SO, 0 HR) and was Baltimore&#x27;s pitcher of record throughout, the lead taken for good in the Bottom 3. Max Scherzer takes the loss (7.0 IP, 10 H, 4 R, 4 ER, 4 BB, 10 SO, 2 HR): the first four Baltimore runs are charged to him, Grich&#x27;s and Dempsey&#x27;s home runs among them. There is no save: Palmer, the winning pitcher, finished the game himself. Tyler Clippard (0.2 IP, 3 H, 2 R, 2 ER, 1 BB, 0 SO, 0 HR) is charged with both Bottom 8 runs, and Sean Doolittle (0.1 IP, 0 H, 0 R, 0 ER, 0 BB, 1 SO, 0 HR) struck out Ripken to finish the eighth; Doolittle is rostered on more than one club in this tournament, and his line here keys under (WSH, doolise01) and never merges with his Oakland lines from W2-01. Run charges match the printed lines exactly: Washington pitching allows 6 (Scherzer 4, Clippard 2, Doolittle 0), and Baltimore pitching allows 1 (Palmer 1). The duplicate test ran before the number was assigned: the series had no stored games, this being its first, so the box score takes Game 1. The game: Palmer and Scherzer traded two scoreless innings, Washington&#x27;s one early chance dying in the Top 2 when Rendon doubled and Murphy and Johnson walked to load the bases with two out before Ramos grounded out to third. Baltimore broke through in the Bottom 3: Grich hit a solo home run with one out, Anderson singled, Murray singled him to third, Powell walked to load the bases, and Ripken walked to force Anderson home, 2-0. Dempsey led off the Bottom 4 with a home run for 3-0. Washington&#x27;s only run came in the Top 7: Sisler had just entered at first base as a defensive sub, Zimmerman singled to center, stole second and took third on Dempsey&#x27;s throwing error on the steal, and Murphy grounded out to second to score him, the run earned on the card as printed. Baltimore answered in the Bottom 7: Sisler singled, Powell walked, and Ripken singled Sisler home for 4-1. The Bottom 8 finished it against Clippard: Blair doubled, Grich singled, Anderson singled Blair home, Sisler walked to load the bases, and Powell grounded out to short to score Grich for 6-1 before Doolittle struck out Ripken. Palmer closed the ninth in order, Harper and Rendon on groundouts and Zimmerman on a flyout to center. Baltimore stranded 12 and Washington 5. Home runs: two, Grich&#x27;s solo shot in the Bottom 3 and Dempsey&#x27;s solo shot in the Bottom 4, both off Scherzer, the only home runs he allowed. Doubles: two, Rendon for Washington (Top 2) and Blair for Baltimore (Bottom 8). Triples: none. Errors: one, Dempsey for Baltimore (E2, throwing, Top 7, on Zimmerman&#x27;s steal, the throw sailing and Zimmerman taking third); Washington was errorless, and the archive summary carries the single errors_by entry for Dempsey in the established shape. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: none, the CSV export printing WP 0 for all four pitchers. Passed balls: one, Ramos for Washington in the Bottom 5, on Brooks Robinson&#x27;s strikeout, Ripken advancing from first to second; the fielding tables and the catching lines print PB 1 for Ramos and PB 0 for Dempsey. Sacrifices: none; every batter reads SH 0 and SF 0, and the four forceout plays (Brooks Robinson in the Bottom 2 and Bottom 7, Frank Robinson in the Bottom 4 and Bottom 8) are at-bats, not sacrifices. Stolen bases: one, Zimmerman in the Top 7, the steal of second with third taken on the error, the Gazette grid marking it SB3; Dempsey&#x27;s catching line reads SB against 1. Caught stealing: none. Double plays grounded into: none; no double play was turned. Substitutions: one, George Sisler replacing Eddie Murray at first base as a defensive sub for the Top 7 and then singling and walking at the plate, so Baltimore prints ten batting lines; Washington printed nine and made none. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Washington PA is AB 31 plus BB 2, which is 33, and the outs plus runs plus stranded identity agrees (27 outs plus 1 run plus 5 stranded is 33); Baltimore PA is AB 37 plus BB 5, which is 42, and the identity agrees (24 outs plus 6 runs plus 12 stranded is 42, Baltimore batting eight innings). Batters faced tie to those totals: Washington 33 PA against 33 Baltimore BF (Palmer 33), and Baltimore 42 PA against 42 Washington BF (Scherzer 35, Clippard 6, Doolittle 1), counted from the card. Strikeouts tie both ways: Washington batting 4 against Baltimore pitching 4 (Palmer 4), and Baltimore batting 11 against Washington pitching 11 (Scherzer 10, Doolittle 1). Printed RBI: Washington 1 for 1 (Murphy 1, his Top 7 groundout scoring Zimmerman) and Baltimore 6 for 6 (Ripken 2, Grich 1, Anderson 1, Powell 1, Dempsey 1); every run in the game carried an RBI. Availability: this is the first game of a new series in a new round, and availability resets between series, so every arm on both clubs was free; no restriction from either club&#x27;s opening series carries in. Five decisions were graded. Earl Weaver (Baltimore) made 1 (0 paid off, 1 backfired, 0 neutral): the Top 7 defensive sub of Sisler at first base backfired at -0.77, the error behind him and Washington&#x27;s only run scoring in the rest of the inning. Dave Martinez (Washington) made 4 (2 paid off, 1 backfired, 1 neutral): the Top 7 steal paid off at +0.39 (Zimmerman safe and scoring in the inning); the Bottom 7 leave-in of Scherzer, fatigued by the book, was neutral at -0.27 (the next batter struck out, one run scoring in the rest of the inning); the Bottom 8 pitching change to Clippard backfired at -1.77, the game&#x27;s worst grade (Blair doubled and two runs scored in the rest of the inning); and the Bottom 8 pitching change to Doolittle paid off at +0.83, the game&#x27;s best grade (Ripken struck out, no runs scoring). Managers: Earl Weaver (Baltimore) and Dave Martinez (Washington). Venue is Oriole Park at Camden Yards. Baltimore leads the series 1-0.">
