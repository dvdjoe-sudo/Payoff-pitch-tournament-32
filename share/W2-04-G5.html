  <title>W2-04-G5: Chicago White Sox 1, Detroit Tigers 12</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 4, Game 5 at Comerica Park. Detroit wins the series 4-1 and advances on the winners side; Chicago drops to the losers bracket with its first series loss. Chicago won Game 1 (7-6); Detroit won Game 2 (3-2), Game 3 (10-9) and Game 4 (6-5). Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, fielding sections), the full Rec with its bat/pit/fld/grades/extra arrays, the native PLAYS JSON rows, and the narrative play log. The game export was cross-checked against the series master export: the two Game 5 Recs agree in every field. One line was booked as printed where the booking brief differed: Robin Ventura is carried with 1 RBI and no hit by pitch, as the export&#x27;s CSV section, Rec array and play log all print (his second-inning groundout scored Chicago&#x27;s only run); the brief had carried no RBI and one hit by pitch. Fielder Jones managed Chicago but did not play; Chet Lemon led off and played center field. Detroit scored two in the 1st: Cobb walked, Gehringer lined into a double play on the hit and run, Kaline doubled, Greenberg&#x27;s single to right scored Kaline (the Report&#x27;s decisive play), and Cabrera&#x27;s double to center scored Greenberg. Chicago&#x27;s only run came in the 2nd: Jackson tripled to right and Ventura&#x27;s groundout scored him. Detroit broke it open in the 3rd: Kaline walked, Crawford singled, and Freehan&#x27;s double to left scored both; Kell&#x27;s single scored Freehan, and after Trammell singled, Cobb&#x27;s single scored Kell to make it 6-1 and finish Buehrle. Marte inherited two runners and stranded both, Wilhelm threw a scoreless 5th, and Foulke took the last three innings: Cabrera homered off him in the 6th, and in the 8th Cobb singled and stole second, Gehringer&#x27;s single scored him, Kaline hit a two-run home run, and after Cabrera singled, Freehan&#x27;s two-run home run made it 12-1. Bridges went the distance: nine innings, 36 batters faced, five hits, one earned run, six walks, two strikeouts. Detroit&#x27;s hits were spread through the order: Cabrera went 4 for 5 with a double and a home run, Cobb 3 for 4 with a steal, Trammell 3 for 4 with a double, and Freehan, the player of the game, drove in four with a double and a home run. Chicago managed five hits off Bridges, Jackson&#x27;s triple the only extra-base hit besides Thomas&#x27;s double. Availability from Game 4 was honored: Morris, Lyons and Jenks, all unavailable, did not appear. The play rows&#x27; GIDP count differs from the app&#x27;s printed GIDP definition on two plays: Thomas&#x27;s top-of-the-5th double play on the hit and run and Gehringer&#x27;s bottom-of-the-1st line-out double play on the hit and run are both counted in the rows while the printed lines carry no GIDP for either man; per Joe&#x27;s standing practice (2026-11-10) the rows are adopted and the printed book lines stay unchanged. Graded decisions (final_grades) were booked from the export&#x27;s graded list for both managers: Jones 8 decisions (2 paid off, 3 backfired, 3 neutral), Anderson 2 (2 paid off, 0 backfired, 0 neutral). Series MVP: the series export names Bill Freehan, and under Joe&#x27;s standing rule (2026-11-15) he is booked as the series MVP in the series entry: 7 for 22, 5 R, 2 2B, 3 HR, 9 RBI, .318. The runner-up booked with him is Ty Cobb: 11 for 23, 4 R, 1 2B, 1 HR, 3 RBI, .478.">
