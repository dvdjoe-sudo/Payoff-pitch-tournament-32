  <title>W2-05-G3: St. Louis Cardinals 7, Cleveland Guardians 9</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 5, Game 3 at Progressive Field. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Doug Jones takes the win for Cleveland (1.0 IP, 3 BF, 0 H, 1 SO), pitching a scoreless 8th. Todd Worrell takes the loss for St. Louis (0.2 IP, 4 BF, 1 H, 2 R, 2 ER, 1 BB), charged with both bottom-of-the-8th runs. Cody Allen takes the save (1.0 IP, 4 BF, 0 H, 1 HBP), pitching the 9th. Andrew Miller takes a hold (2.0 IP, 11 BF, 2 H, 1 R, 1 ER, 3 BB, 4 SO; the Rec&#x27;s extra line reads 1 inherited, 0 scored for him), and Cade Smith is charged with the blown save (1.0 IP, 6 BF, 3 H, 1 R, 1 ER, 1 SO): he entered the top of the 7th with a 7-6 lead and gave up the tying run on Ken Boyer&#x27;s single, the run charged to Smith himself. Lindy McDaniel&#x27;s extra line reads 1 inherited, 1 scored: Nap Lajoie&#x27;s bottom-of-the-4th single scored Kenny Lofton, Adam Wainwright&#x27;s runner, and that run sits inside Wainwright&#x27;s 7 ER. Scoring: St. Louis scored three in the top of the 1st off Addie Joss: Ozzie Smith and Rogers Hornsby walked, Albert Pujols doubled both home on the hit and run, and Jim Edmonds doubled Pujols home. Cleveland answered with four in the bottom of the 2nd off Wainwright: Manny Ramirez and Shoeless Joe Jackson singled, Albert Belle doubled both home, Lou Boudreau tripled Belle home, and Lofton&#x27;s double scored Boudreau. St. Louis retook the lead in the top of the 3rd, Hornsby and Edmonds walking and Joe Medwick doubling both home (5-4). Cleveland went ahead for the middle innings in the bottom of the 4th: José Ramírez walked, Boudreau singled, Victor Martinez struck out on the hit and run, and Lofton&#x27;s second double scored both runners; McDaniel replaced Wainwright and Lajoie&#x27;s single scored Lofton (7-5). St. Louis cut it to one in the top of the 6th off Miller, Yadier Molina singling, Boyer walking, and Stan Musial singling Molina home, then tied it 7-7 in the top of the 7th off Smith: Edmonds singled, Ted Simmons pinch-hit a single, and Boyer&#x27;s single scored Edmonds. Cleveland won it in the bottom of the 8th off Worrell: Boudreau walked and scored on Martinez&#x27;s double on the hit and run, the decisive play the export&#x27;s summary names, and Lajoie&#x27;s groundout to Worrell scored Martinez with the second run; Bruce Sutter then struck out Jim Thome to end the inning. Kenny Lofton is the export&#x27;s player of the game: 2 for 5 with two doubles, 3 RBIs and a run. Key lines: for Cleveland, Boudreau 2 for 3 with a triple, 3 runs, an RBI and a walk, Martinez 2 for 3 with the winning double, an RBI, a run and a walk, Belle 1 for 4 with the two-run double, and Lajoie 1 for 4 with 2 RBIs, a walk and a stolen base; for St. Louis, Edmonds 2 for 3 with a double, an RBI, 2 runs and 2 walks, Pujols 1 for 4 with a double and 2 RBIs, Medwick 1 for 4 with a double and 2 RBIs, and Musial 2 for 5 with a double and an RBI. Pitching lines of note: Joss 4.0 IP, 20 BF, 4 H, 5 ER, 4 BB, 3 SO in the start; Wainwright 3.1 IP, 19 BF, 7 H, 7 ER, 2 BB, 2 SO, all seven Cleveland runs of the first four innings his; McDaniel 2.2 scoreless innings in relief of him; Ryan Helsley a scoreless 7th for St. Louis. The game was errorless, no double play was turned by either side, and every run on both sides carries an RBI and is earned exactly as printed. Defensive lines are booked in the established shape from the printed fielding section (St. Louis 24 putouts and 9 assists, Pujols 11 putouts; Cleveland 27 putouts and 7 assists, Martinez and Thome 9 putouts each); the fielding section also prints an outfield-assist credit for Medwick and a credit of 1 in its RO column for Boudreau, neither of which enters the defense object&#x27;s putout/assist/error lines, which are booked exactly as printed. Stolen bases: Lajoie, José Ramírez and Tris Speaker, all for Cleveland; Molina&#x27;s catching line reads PB 0, 2 stolen bases against, 0 caught stealing (Lajoie and Ramírez, both in the 4th), and Simmons&#x27;s reads PB 0, 1 against (Speaker in the 7th), 0 caught; Martinez&#x27;s reads PB 0, 0 against, St. Louis stealing none. Hit by pitch: Medwick by Allen in the 9th, the game&#x27;s only one. Wild pitches and passed balls: none. Substitutes: Simmons pinch-hit for Molina in the top of the 7th, singled, and stayed in at catcher; Speaker pinch-hit for Manny Ramirez in the bottom of the 7th, walked and stole second. One correction to the booking brief, booked as printed: the brief carried José Ramírez with no stolen base; the export&#x27;s CSV batting section, its Rec bat array and the box score&#x27;s stolen-base listing all show one (Bot 4), and one is booked. Counting checks: St. Louis plate appearances 44 (36 AB, 7 BB, 1 HBP) equal Cleveland&#x27;s 44 batters faced (Joss 20, Miller 11, Smith 6, Jones 3, Allen 4); Cleveland plate appearances 39 (34 AB, 5 BB) equal St. Louis&#x27;s 39 batters faced (Wainwright 19, McDaniel 11, Helsley 4, Worrell 4, Sutter 1). Hit, walk and strikeout totals tie across the two boxes both ways, and neither side hit a home run. Manager grades: the grades list names both managers directly, so no label mapping is needed. Terry Francona graded 11 decisions (6 paid off, 2 backfired, 3 neutral): four steals at 1 paid off, 1 backfired and 2 neutral, four pitching changes at 3 paid off and 1 backfired, two hit and runs at 2 paid off, and the Speaker pinch-hit neutral. Tony La Russa graded 7 decisions (4 paid off, 2 backfired, 1 neutral): four pitching changes at 1 paid off, 2 backfired and 1 neutral, and his one steal, one hit and run and one pinch-hit (Simmons) all paid off. Series graded totals through three games: Francona 25 decisions (13 paid off, 7 backfired, 5 neutral); La Russa 17 (9 paid off, 5 backfired, 3 neutral). Availability from Game 2 was honored in this game: Coveleski and Dean sat, and Early Wynn, capped at 3 outs, went unused. Availability for Game 4 under the convention: Joss (12 outs in this game) and Wainwright (10 outs) are unavailable; Miller (6 outs) and McDaniel (8 outs) are capped at 3 outs; Cade Smith, Doug Jones, Allen, Helsley, Worrell and Sutter are free. Game 4 is in Cleveland. Managers: Terry Francona (Cleveland) and Tony La Russa (St. Louis). Venue is Progressive Field, as printed.">
