  <title>W2-01-G6: New York Yankees 5, Oakland Athletics 4</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as four files on 2026-11-08: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), the full graded play-by-play text, and the scorecard CSV export; official W2-01 Game 6 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This is Winners Bracket Round 2, Series 1: the New York Yankees (seed 1) against the Oakland Athletics (seed 22), home pattern 2-2-1-1-1, Game 6 at RingCentral Coliseum in Oakland, the series back in Oakland. The series entry was formed in the Game 1 booking and is not re-formed here. New York leads the series 3-2, and the loser of this series takes its first series loss and drops to the losers bracket; nobody is eliminated by this series. Box score record: the four sources carry the linescore, the full batting and pitching lines, the fielding lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Whitey Ford takes the win (8.0 IP, 3 H, 0 R, 0 ER, 2 BB, 7 SO, 0 HR): he carried a three-hit shutout through eight innings and left with a 5-0 lead that was never lost, having long completed five innings. Catfish Hunter takes the loss (7.0 IP, 8 H, 5 R, 5 ER, 1 BB, 7 SO, 3 HR): all five New York runs are charged to him, Ruth&#x27;s first-inning homer and the four-run fourth. Goose Gossage takes the save (0.1 IP, 0 H, 0 R, 0 ER, 0 BB, 0 SO): he entered in the Bottom 9 with two out and the score 5-4 after Steinbach&#x27;s grand slam, with Ellis at the plate as the tying run, and got the final out on Ellis&#x27;s popout to first; the save rests on the tying-run-at-the-plate prong, his having entered with the potential tying run at the plate and finished the game. David Robertson (0.2 IP, 2 H, 4 R, 4 ER, 2 BB, 1 SO, 1 HR) is charged with all four Bottom 9 runs. Andrew Bailey (1.0 IP, 0 H, 0 R, 0 ER, 0 BB, 2 SO, 0 HR) threw a scoreless Top 8 for Oakland, and Liam Hendriks (1.0 IP, 1 H, 0 R, 0 ER, 0 BB, 1 SO, 0 HR) a scoreless Top 9. Run charges match the printed lines exactly: Oakland pitching allows 5 (Hunter 5, Bailey 0, Hendriks 0), and New York pitching allows 4 (Ford 0, Robertson 4, Gossage 0). The duplicate test ran before the number was assigned: the series&#x27; five stored games are Game 1 (New York 8, Oakland 1), Game 2 (Oakland 6, New York 5), Game 3 (New York 6, Oakland 4 in 10 innings), Game 4 (Oakland 3, New York 1), and Game 5 (New York 10, Oakland 8), all with different linescores, so this box score takes Game 6. The game: Ruth hit a solo home run off Hunter with two out in the Top 1 for 1-0, and that was the only run until the Top 4, when Gehrig led off with a home run, Mantle singled, DiMaggio hit a two-run home run, and after two outs Randolph walked, Henderson singled him to third, and Jeter singled him home for 5-0, all off Hunter. Ford allowed three hits in eight scoreless innings: Henderson&#x27;s Bottom 3 single, Tejada&#x27;s Bottom 5 leadoff double, and Steinbach&#x27;s Bottom 8 single, with Bando&#x27;s Bottom 6 sacrifice bunt and Ellis&#x27;s Bottom 8 sacrifice bunt the only advances. Bailey and Hendriks held New York scoreless in the eighth and ninth. Robertson opened the Bottom 9 for New York: Jackson walked, McGwire struck out, Canseco lined out to short, Tejada singled Jackson to third, Murphy walked to load the bases, and Steinbach hit a grand slam to make it 5-4. Gossage came in and got Ellis&#x27;s popout to Gehrig at first for the final out and the series. New York wins the series 4-2 and advances on the winners side; Oakland drops to the losers bracket with one series loss, its first of the tournament, and is not eliminated. Steinbach drove in all four Oakland runs with the grand slam, his second hit of the game. New York stranded 5 and Oakland stranded 5. Home runs: four, Ruth (solo, Top 1), Gehrig (solo, Top 4), and DiMaggio (two-run, Top 4), all off Hunter, and Steinbach (grand slam, Bottom 9, off Robertson). Doubles: one, Tejada. Triples: none. Errors: none, an errorless game both ways; Games 1, 2, 4, and 5 were also errorless and Game 3 carried the series&#x27; only error, Tejada&#x27;s, so five of the six games were errorless. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: none, the CSV export printing WP 0 for all six pitchers. Passed balls: none, the fielding tables printing PB 0 for both catchers, Berra and Steinbach. Sacrifices: two, Bando&#x27;s sacrifice bunt in the Bottom 6 and Ellis&#x27;s sacrifice bunt in the Bottom 8, both against Ford; every other batter reads SH 0 and SF 0. Stolen bases: none. Caught stealing: none. Double plays grounded into: none. Substitutions: New York made one, Bernie Williams replacing DiMaggio in center field for the Bottom 7 as a defensive sub and striking out in the Top 8, so New York prints ten batting lines; Oakland made none, printing nine. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: New York PA is AB 36 plus BB 1, which is 37, and the outs plus runs plus stranded identity agrees (27 outs plus 5 runs plus 5 stranded is 37); Oakland PA is AB 30 plus BB 4 plus SH 2, which is 36, and the identity agrees (27 outs plus 4 runs plus 5 stranded is 36). Batters faced tie to those totals: New York 37 PA against 37 Oakland BF (Hunter 30, Bailey 3, Hendriks 4), counted from the card, and Oakland 36 PA against 36 New York BF (Ford 29, Robertson 6, Gossage 1). Strikeouts tie both ways: New York batting 10 against Oakland pitching 10 (Hunter 7, Bailey 2, Hendriks 1), and Oakland batting 8 against New York pitching 8 (Ford 7, Robertson 1, Gossage 0). Printed RBI: New York 5 for 5 (DiMaggio 2, Ruth 1, Gehrig 1, Jeter 1) and Oakland 4 for 4 (Steinbach 4); every run in the game carried an RBI. Availability: Game 5&#x27;s long outings sat out as required, Pettitte (14 outs in Game 5) and Honeycutt (12) unavailable and both unused, and Zito (6 outs) capped at 3 outs and unused; every arm used was free, Ford, Robertson, Gossage, Hunter, and Bailey not having pitched in Game 5 at all and Hendriks having thrown only 3 outs in it, all under the house outs convention (under 6 outs free, 6 to 8 outs capped at 3, 9 or more outs unavailable; restrictions last exactly one game and read only the previous game). Five decisions were graded. Casey Stengel (New York) made 3 (2 paid off, 1 backfired, 0 neutral): the Bottom 7 defensive sub of Bernie Williams in center field paid off at +0.48 (a clean inning in the field); the Bottom 9 pitching change to Robertson backfired at -3.77, the game&#x27;s worst grade (Jackson walked to open the inning and four runs scored in the rest of it, Steinbach&#x27;s grand slam); and the Bottom 9 pitching change to Gossage paid off at +0.35 (Ellis popped out to first with the tying run at the plate, the final out of the game and the series). Dick Williams (Oakland) made 2 (2 paid off, 0 backfired, 0 neutral): the Top 8 pitching change to Bailey paid off at +0.73 (a scoreless inning, next batter struck out), and the Top 9 pitching change to Hendriks paid off at +0.73 (a scoreless inning, the next batter out 5-3). Managers: Casey Stengel (New York) and Dick Williams (Oakland). Venue is RingCentral Coliseum. New York wins the series 4-2.">
