  <meta name="description" content="Losers Bracket, Round 2, Series 2, Game 7 at Truist Park, as the master export&#x27;s box score prints the venue, &quot;TRUIST PARK&quot;. The L2-02 series was formed with Game 1: #7 Atlanta Braves (manager Bobby Cox) against #27 Montreal Expos (manager Dick Williams), home pattern Atlanta for Games 1, 2, 5 and 7, Montreal for Games 3, 4 and 6. Booked from the game master export file and the series master export file, both played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections, inside the game&#x27;s Rec record), the native PLAYS (JSON) rows, the narrative play log, the graded play-by-play with its manager decisions and decisions summary, and the full Rec JSON (W ATL|spahnwa01, L MON|martipe02, S ATL|kimbrcr01; the Rec extra list carries one inherited-runner line, for Jeff Reardon). The series export&#x27;s Game 1-6 Recs match the booked book in every score, decision, batting line and pitching line, its Game 7 Rec is identical to the game export&#x27;s Rec, and its totals foot to 36 runs for each club. The export&#x27;s filename and header date read 2026-11-22, but the Rec&#x27;s recorded stamp is 2026-11-22T00:55:37Z, 4:55 PM PT on 2026-11-21, and that is the played date the book carries. Atlanta won 5-3 and wins the series 4-3, coming back from three games to one down; Montreal is eliminated. Decisions: Warren Spahn takes the win for Atlanta (8.0 IP, 29 BF, 6 H, 2 R, 2 ER, 0 BB, 5 SO, 1 HR, 1 WP), the export&#x27;s player of the game; Pedro Martinez takes the loss for Montreal (6.0 IP, 28 BF, 7 H, 5 R, 3 ER, 2 BB, 6 SO); Craig Kimbrel takes the save (1.0 IP, 6 BF, 1 H, 1 R, 1 ER, 2 BB, 2 SO), allowing one run in the 9th before closing it. Andy McGaffigan (1.2 IP, 8 BF, 1 H, 2 BB, 2 SO) and Jeff Reardon (0.1 IP, 1 BF) finished scoreless for Montreal. Scoring: the bottom of the 2nd scored Atlanta&#x27;s first two off Pedro: Eddie Mathews singled, Del Crandall doubled, and Freddie Freeman&#x27;s double to center scored both, 2-0 (the export&#x27;s decisive play). The bottom of the 4th made it 3-0: Crandall walked, Freeman&#x27;s fielder&#x27;s choice forced Crandall at second, Dale Murphy&#x27;s forceout put Murphy at first, and Andruw Jones doubled Murphy home. The bottom of the 5th scored two unearned runs on two Montreal errors in the inning: Rabbit Maranville flied out, Chipper Jones singled and took second on Tim Wallach&#x27;s throwing error, Ronald Acuna Jr. singled and took second on Andre Dawson&#x27;s throwing error with Chipper scoring unearned on the play (play row seq 38, runs 1, rbi 0, its steps printing &quot;Chipper Jones scores (unearned)&quot;), Mathews struck out, and Del Crandall&#x27;s single scored Acuna, also unearned (row seq 40, its steps printing &quot;Ronald Acuna Jr. scores (unearned)&quot;; Crandall keeps his printed 1 RBI), 5-0; Pedro&#x27;s printed line (5 R, 3 ER) carries both runs as unearned, and Atlanta&#x27;s team RBI reads 4 against its 5 runs. Montreal&#x27;s top of the 6th scored two, Jose Vidro singling and Rusty Staub hitting a two-run home run off Spahn, 5-2. Montreal&#x27;s last run came in the top of the 9th off Kimbrel: Staub and Vladimir Guerrero walked, Gary Carter popped out, Dawson struck out, Ron Fairly&#x27;s single scored Staub, and Tim Wallach struck out to end the game and the series, 5-3. The extra list, exactly as printed: one line, inherited runners for Jeff Reardon, 2/0 (Ozzie Albies at first and Andruw Jones at second, aboard when Reardon relieved McGaffigan with two out in the bottom of the 8th; Maranville&#x27;s groundout stranded both). No holds and no blown saves. Errors: four, three by Montreal and one by Atlanta, confirmed by the play rows&#x27; rebuilt error count (MON 3 / ATL 1), the printed fielding sections, the batting CSV&#x27;s E column and the Rec fld array alike, and team_errors reads MON 3, ATL 1. Ron Fairly&#x27;s 1-base error at first (E3, play row seq 22, coded &quot;E3&quot;) let Acuna reach with two out in the bottom of the 3rd; Acuna did not score. Tim Wallach&#x27;s throwing error (bottom of the 5th, row seq 37) put Chipper at second, and Andre Dawson&#x27;s throwing error on the next play (row seq 38) put Acuna at second and scored Chipper unearned. Rabbit Maranville&#x27;s 2-base error at short (E6, top of the 5th, row seq 34, coded &quot;E6&quot;) let Wallach reach second with two out; Wallach did not score. Double plays: one, turned by Atlanta: Orlando Cabrera&#x27;s top-of-the-3rd grounder to short (row seq 17, coded &quot;DP 6-4-3&quot;), matching Cabrera&#x27;s printed GIDP 1 and Atlanta&#x27;s printed team DP 1 (Rabbit Maranville, Ozzie Albies and Freddie Freeman each carry DP 1 in the fielding section as the chain&#x27;s fielders), so no GIDP-practice divergence arises. The top of the 1st also produced two outs on one play that is not a double play: on the hit and run, Jose Vidro&#x27;s flyout to center doubled Tim Raines off first (row seq 1, coded &quot;F&quot;, outs 0 to 2); no GIDP is charged, exactly as printed. Stolen bases: none attempted by either club; caught stealing: none. The catching lines as printed: Gary Carter, PB 0 and nothing against for Montreal; Del Crandall, PB 0 and nothing against for Atlanta. Defensive lines are booked in the established shape from the printed fielding section (Montreal 24 putouts and 9 assists with 3 errors: Carter 8 putouts catching, Fairly 8 putouts at first with 1 error, Wallach 2 putouts and 4 assists with 1 error, Cabrera 3 putouts and 2 assists, Staub 2 putouts, Vidro 2 assists, Raines 1 putout, Pedro 1 assist, Dawson no putouts or assists with 1 error; Atlanta 27 putouts and 11 assists with DP 1 and 1 error: Freeman 11 putouts at first with DP 1, Crandall 7 putouts catching, Maranville 1 putout and 4 assists with DP 1 and 1 error, Mathews 1 putout and 4 assists, Acuna 2 putouts, Andruw Jones 2 putouts and 1 assist with OFA 1 as printed, Murphy 2 putouts, Albies 1 putout and 2 assists with DP 1). Substitutes: Atlanta: Hank Aaron replaced Acuna in left field for the top of the 8th (a graded defensive sub); he had no plate appearance and no fielding chance and carries no batting or fielding line in the box score, the CSV sections or the Rec arrays, so none is booked for him, exactly as printed. Montreal used no substitutes. Wild pitches: one, Warren Spahn in the top of the 1st (row seq 3, during Guerrero&#x27;s plate appearance; Staub advanced from second to third on it); it scored nobody and is carried in Atlanta&#x27;s defense wp map as printed. Passed balls: none. Hit by pitch: none. Counting checks: Montreal plate appearances 35 (33 AB, 2 BB) equal Atlanta&#x27;s 35 batters faced (Spahn 29, Kimbrel 6); Atlanta plate appearances 37 (33 AB, 4 BB) equal Montreal&#x27;s 37 batters faced (Pedro 28, McGaffigan 8, Reardon 1). Hit, walk, home run and strikeout totals tie across the two boxes both ways (Montreal batting strikeouts 7 = Spahn 5 + Kimbrel 2; Atlanta batting strikeouts 8 = Pedro 6 + McGaffigan 2; Montreal home runs 1 = Spahn 1 (Staub); Atlanta home runs 0). Team RBI: Montreal 3, equal to its runs; Atlanta 4 against 5 runs (the bottom-of-the-5th Chipper run carries no RBI, scored on Dawson&#x27;s error). Staff earned runs: Montreal&#x27;s staff 3 ER against Atlanta&#x27;s 5 runs (the two bottom-of-the-5th runs unearned); Atlanta&#x27;s staff 3 ER, equal to Montreal&#x27;s 3 runs. Manager grades: the grades list names both managers directly, so no label mapping is needed. Dick Williams graded 3 decisions (2 paid off, 1 backfired): 2 pitching changes (both paid off: McGaffigan for the 7th and Reardon for the 8th, both scoreless) and 1 hit and run (backfired: the top of the 1st, Vidro&#x27;s flyout doubling Raines off first). Bobby Cox graded 2 decisions (1 paid off, 1 backfired): 1 defensive sub (paid off: Aaron in left field for the 8th, a clean inning) and 1 pitching change (backfired: Kimbrel for the 9th; he allowed a run but got the save). Series graded totals: Dick Williams 35 (21 paid off, 9 backfired, 5 neutral), Bobby Cox 19 (12 paid off, 6 backfired, 1 neutral). Availability: Game 6&#x27;s unavailable pair, Greg Maddux (27 outs) and Steve Rogers (20 outs), and its capped pitcher, Woodie Fryman (7 outs, capped at 3), appear nowhere in this game, and the Rec&#x27;s own unavailable block lists all three among its rest and house-rule entries. Series MVP, named in the series master export and booked under Joe&#x27;s standing rule (2026-11-15, the export MVP is the MVP): Ronald Acuna Jr. (Atlanta), 7 for 21, 6 runs, 1 double, 3 home runs, 5 RBI, .333, verified exactly against the seven games&#x27; Recs (7 for 21, 3 BB). Runner-up: Warren Spahn (Atlanta), 16.0 IP, 14 H, 7 ER, 3 BB, 11 SO, 2-0, 3.94 ERA, who won Games 3 and 7, the winner-take-all game as its player of the game; Eddie Mathews (.393, 11 for 28, 5 RBI) was the other leading candidate. Montreal&#x27;s best bat between the two candidates was Andre Dawson (8 for 29, 7 runs, .276, and Game 4&#x27;s player of the game) over Gary Carter (5 for 28, .179); Rusty Staub led Montreal with 7 RBI. Atlanta wins the series 4-3 and stands 11-7 in games and 2-1 in series, advancing to Losers Round 3; Montreal finishes 8-10 in games and 1-2 in series and is eliminated, the tenth club out of the tournament. Series runs finished dead even, 36 for Atlanta and 36 for Montreal. Managers: Dick Williams (Montreal) and Bobby Cox (Atlanta). Venue is Truist Park.">
