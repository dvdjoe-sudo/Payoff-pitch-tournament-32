  <title>W2-05-G4: St. Louis Cardinals 4, Cleveland Guardians 7</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 5, Game 4 at Progressive Field. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Corey Kluber takes the win for Cleveland (5.2 IP, 23 BF, 5 H, 2 ER, 1 BB, 4 SO). Harry Brecheen takes the loss for St. Louis (2.1 IP, 14 BF, 5 H, 6 ER, 2 BB, 2 HR allowed), knocked out in the bottom of the 3rd. There is no save: Doug Jones entered the top of the 9th with a three-run lead and finished the game, and the Rec carries no save for him. The Rec&#x27;s extra line carries one inherited-runner line for Andrew Miller, 1 inherited and 1 scored: Jim Edmonds, Kluber&#x27;s runner, scored on Joe Medwick&#x27;s top-of-the-6th triple, and that run sits inside Kluber&#x27;s 2 ER; Medwick then scored on Yadier Molina&#x27;s single, Miller&#x27;s own run. Scoring: St. Louis scored first in the top of the 1st, Stan Musial doubling and Rogers Hornsby doubling him home. Cleveland answered in the bottom of the 1st: Kenny Lofton walked, stole second, and Jim Thome hit a two-run home run, the decisive play the export&#x27;s summary names. Cleveland broke it open with four in the bottom of the 3rd off Brecheen: Lofton singled, Nap Lajoie walked, Thome doubled Lofton home, and Shoeless Joe Jackson hit a three-run home run; Todd Worrell replaced Brecheen and stopped it there. St. Louis scored two in the top of the 6th: Edmonds tripled off Kluber with two out, Miller replaced him, Medwick tripled Edmonds home and scored on Molina&#x27;s single (6-3). José Ramírez answered with a solo home run off Ryan Helsley in the bottom of the 6th (7-3). St. Louis&#x27;s last run came in the top of the 9th off Jones: Ken Boyer walked, Ozzie Smith singled, and Musial singled Boyer home; Jones then walked Albert Pujols to load the bases before striking out Edmonds to end the game. Jim Thome is the export&#x27;s player of the game: 2 for 4 with a double, the bottom-of-the-1st two-run home run, 3 RBIs and 2 runs. Key lines: for Cleveland, Jackson 1 for 4 with the three-run home run and 3 RBIs, Ramírez 1 for 3 with the solo home run, a walk and an RBI, Lou Boudreau 2 for 4, and Lofton 1 for 3 with 2 runs, a walk and a stolen base; for St. Louis, Medwick 2 for 4 with a triple, an RBI and a run, Musial 2 for 5 with a double, an RBI and a run, Edmonds 1 for 4 with a triple, a run and a walk, and Hornsby 1 for 4 with a double, an RBI and a walk. Pitching lines of note: Kluber 5.2 IP, 23 BF, 5 H, 2 ER, 1 BB, 4 SO in the start; Miller 1.1 IP, 7 BF, 2 H, 1 ER, his only run Medwick&#x27;s; Emmanuel Clase a scoreless 8th; Jones 1.0 IP, 7 BF, 2 H, 1 ER, 2 BB, 2 SO in the 9th; Worrell 1.2 scoreless innings in relief of Brecheen, and Jason Isringhausen 2.0 scoreless innings with 2 strikeouts to close for St. Louis. The game was errorless, and every run on both sides carries an RBI and is earned exactly as printed. St. Louis turned two double plays (Albert Belle&#x27;s bottom-of-the-5th double play off Bruce Sutter and Lofton&#x27;s bottom-of-the-6th ground-ball double play on the hit and run, both genuine double-play rows in the log and the game&#x27;s only printed GIDPs); Cleveland turned none. Defensive lines are booked in the established shape from the printed fielding section (St. Louis 24 putouts and 8 assists, Pujols 11 putouts; Cleveland 27 putouts and 9 assists, Thome 11 putouts and Boudreau 5 assists); the fielding section also prints a run-out credit and a GDP credit for Ozzie Smith alongside his double-play credit, none of which enters the defense object&#x27;s putout/assist/error lines, which are booked exactly as printed. Stolen bases: Lofton, the game&#x27;s only one; Molina&#x27;s catching line reads PB 0, 1 stolen base against, 0 caught stealing, and Victor Martinez&#x27;s reads PB 0, 0 against, St. Louis stealing none. Hit by pitch: none on either side. Wild pitches and passed balls: none. Substitutes: Tris Speaker pinch-hit for Manny Ramirez in the bottom of the 7th for Cleveland and walked; Ted Simmons pinch-hit for Molina in the top of the 9th for St. Louis and struck out. Counting checks: St. Louis plate appearances 41 (36 AB, 5 BB) equal Cleveland&#x27;s 41 batters faced (Kluber 23, Miller 7, Clase 4, Jones 7); Cleveland plate appearances 35 (31 AB, 4 BB) equal St. Louis&#x27;s 35 batters faced (Brecheen 14, Worrell 7, Sutter 3, Helsley 4, Isringhausen 7). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades: the grades list names both managers directly, so no label mapping is needed. Terry Francona graded 8 decisions (4 paid off, 2 backfired, 2 neutral): two steals at 2 paid off, three pitching changes at 1 paid off, 1 backfired and 1 neutral (Miller in the 6th backfired, Clase in the 8th paid off, Jones in the 9th neutral), two hit and runs at 1 paid off and 1 backfired, and the Speaker pinch-hit neutral. Tony La Russa graded 5 decisions (2 paid off, 1 backfired, 2 neutral): four pitching changes at 2 paid off, 1 backfired and 1 neutral (Worrell in the 3rd and Isringhausen in the 7th paid off, Helsley in the 6th backfired, Sutter in the 5th neutral), and the Simmons pinch-hit neutral. Series graded totals through four games: Francona 33 decisions (17 paid off, 9 backfired, 7 neutral); La Russa 22 (11 paid off, 6 backfired, 5 neutral). Availability from Game 3 was honored except for one overage, booked exactly as played: Joss and Wainwright sat, and Lindy McDaniel, capped at 3 outs, went unused, but Andrew Miller, capped at 3 outs from his 6 outs in Game 3, recorded 4 outs (1.1 IP) in this game. Availability for Game 5 under the convention: Kluber (17 outs in this game) is unavailable; Brecheen (7 outs) and Isringhausen (6 outs) are capped at 3 outs; Miller (4 outs), Clase (3), Jones (3), Worrell (5), Sutter (3) and Helsley (3) are free. Game 5 is in St. Louis, and St. Louis faces elimination. Managers: Terry Francona (Cleveland) and Tony La Russa (St. Louis). Venue is Progressive Field, as printed.">
