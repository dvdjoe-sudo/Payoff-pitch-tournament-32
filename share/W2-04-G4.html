  <title>W2-04-G4: Detroit Tigers 6, Chicago White Sox 5</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 4, Game 4 at Guaranteed Rate Field. Detroit wins 6-5 and leads the series 3-1. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Jack Morris takes the win for Detroit (5.2 IP, 25 BF, 5 H, 5 R, 5 ER, 3 BB, 4 SO); he was charged with all five Chicago runs, the last of them his inherited runner, who scored on the reliever&#x27;s first batter. Ted Lyons takes the loss for Chicago (3.0 IP, 16 BF, 6 H, 6 R, 6 ER, 1 BB, 0 SO, 1 HR allowed, 1 WP), knocked out after three innings with all six Detroit runs on his line. Willie Hernandez takes the save (1.0 IP, 4 BF, 1 H, 0 R, 1 SO): a scoreless bottom of the 9th, Collins&#x27;s two-out single his only blemish, Thomas struck out to end the game. Scoring: Detroit scored five in the top of the 1st off Lyons: Cobb singled to left, Gehringer forced Cobb at second, Kaline singled Gehringer along, and Greenberg&#x27;s single to right scored Gehringer, the decisive play the export&#x27;s summary names; Cabrera&#x27;s sacrifice fly to left scored Kaline, Crawford walked, and Freehan&#x27;s three-run home run made it 5-0 before Kell doubled to right and Trammell grounded out. Top of the 2nd: Cobb singled again, moved up on Gehringer&#x27;s groundout, and scored on Kaline&#x27;s groundout to second (6-0). Chicago got two back in the bottom of the 3rd: Appling singled, Fisk forced him at second, Jones struck out on the hit and run, Collins walked, and Thomas doubled to left scoring both runners (6-2). Bottom of the 4th: Jackson singled, Ventura forced him at second, Ordóñez flied out, and Appling&#x27;s double to center scored Ventura (6-3). Detroit never scored again: Hoyt Wilhelm (1.0 IP, 6 BF, 2 H, 1 BB, 1 SO), Bobby Thigpen (1.0 IP, 4 BF, 0 H, 1 BB, 1 SO) and Bobby Jenks (4.0 IP, 17 BF, 5 H, 1 BB, 1 SO) combined for six scoreless innings, and in the top of the 9th Jenks, after Greenberg flied out to Phillips in left, walked Cabrera and gave up a single to the substitute Phillips before Freehan grounded into the double play that ended the inning. Bottom of the 6th: Ventura walked off Morris, Ordóñez doubled him home (6-4), and Mike Henneman replaced Morris with Ordóñez on second; Appling&#x27;s single to right scored Ordóñez (6-5), the run charged to Morris as an inherited runner (the Rec&#x27;s extra line reads 1 inherited, 1 scored for Henneman), and Henneman struck out Fisk, then worked a scoreless 7th (Jones groundout, Collins walk and a steal of second, Thomas popout, Miñoso groundout) for the hold. Aurelio Lopez took the second hold with a scoreless bottom of the 8th: Jackson struck out, Ventura flied out, Ordóñez singled, and Appling popped out to third. Bottom of the 9th, traced from the play rows: Fisk popped out to Freehan, the pinch-hitter Chet Lemon flied out to Phillips in left, Collins singled to left, and Thomas struck out to end the game. Ty Cobb is the export&#x27;s player of the game: 5 for 5, all singles (in the 1st, 2nd, 4th, 6th and 8th), with one run scored. Key lines: for Detroit, Freehan 1 for 4 with the three-run home run, a walk and a run, Greenberg 2 for 5 with the game&#x27;s first RBI and a run, Kaline 1 for 4 with an RBI and a run, Cabrera 0 for 3 with the sacrifice-fly RBI and a walk, Kell 1 for 4 with the 1st-inning double; for Chicago, Appling 3 for 4 with a double and 2 RBIs, Thomas 1 for 5 with the two-run double, Ordóñez 2 for 4 with a double, an RBI and a run, Ventura 0 for 3 with a walk and 2 runs, Collins 1 for 3 with 2 walks, a stolen base and a run. Pitching lines of note: Henneman 1.1 IP, 6 BF, 1 H, 0 R, 1 BB, 1 SO and the hold despite the inherited runner scoring; Lopez 1.0 IP, 4 BF, 1 H, 1 SO and the hold; Jenks&#x27;s four scoreless innings came in a losing cause. Errors: none on either side; every run in the game is earned as printed, and every run carries an RBI (Detroit 6 runs on 6 RBIs, Chicago 5 on 5). Double plays: Chicago turned one, Freehan&#x27;s top-of-the-9th grounder (Ventura to Collins to Thomas), a genuine double-play row in the log and the game&#x27;s only printed GIDP; Detroit turned none. Stolen bases: Collins and Carlton Fisk, both off Freehan (his catching line reads SB against 2, CS 0, PB 0). Wild pitches: Lyons 1, and it produced no run. Passed balls: none. Hit by pitch: none on either side. Substitutes: Tony Phillips replaced Sam Crawford in left field before the bottom of the 8th, singled in the top of the 9th batting in Crawford&#x27;s spot, and caught Lemon&#x27;s flyout in the 9th; he carries a fielding line in this game (PO 1), unlike Game 3, where the export carried none for him. Chet Lemon pinch-hit for Jones in the bottom of the 9th and flied out to left; he did not stay in the game. The defense object books putouts, assists and errors exactly as printed: Detroit 27 putouts and 7 assists (Freehan 9 putouts; Kell 5 assists, Trammell 2 assists), Chicago 27 putouts and 12 assists (Thomas 13 putouts; Collins 5 assists, Ventura 4 assists, Appling 3 assists). Counting checks: Detroit plate appearances 43 (38 AB, 4 BB, 1 SF) equal Chicago&#x27;s 43 batters faced (Lyons 16, Wilhelm 6, Thigpen 4, Jenks 17); Chicago plate appearances 39 (35 AB, 4 BB) equal Detroit&#x27;s 39 batters faced (Morris 25, Henneman 6, Lopez 4, Hernandez 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades: the grades list names both managers directly, so no label mapping is needed. Fielder Jones graded 13 decisions (8 paid off, 2 backfired, 3 neutral): all four left-pitcher-in calls paid off, all three pitching changes paid off, three hit and runs at 1 paid off, 1 backfired and 1 neutral, two steals both neutral, and the Lemon pinch-hit backfired. Sparky Anderson graded 6 decisions (3 paid off, 3 backfired, 0 neutral): three pitching changes at 2 paid off and 1 backfired, two hit and runs both backfired, and the Phillips defensive sub paid off. Series graded totals through four games: Jones 40 decisions (19 paid off, 11 backfired, 10 neutral); Anderson 18 (11 paid off, 5 backfired, 2 neutral). Availability for Game 5 under the convention: Morris (17 outs in this game), Lyons (9 outs) and Jenks (12 outs) are unavailable; Henneman (4 outs), Lopez (3), Hernandez (3), Wilhelm (3) and Thigpen (3) are free. Game 3&#x27;s rest rules were honored in this game: Lolich and Sale sat, and Marte and Buehrle, both capped at 3 outs, went unused. Managers: Fielder Jones (Chicago) and Sparky Anderson (Detroit). Venue is Guaranteed Rate Field, as printed.">
