  <title>L1-01-G4: Philadelphia Phillies 4, Miami Marlins 2</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-08: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official L1-01 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This is Losers Bracket Round 1, Series 1: the Philadelphia Phillies (seed 11) against the Miami Marlins (seed 32), home pattern 2-2-1-1-1, Game 4 at loanDepot Park in Miami. Both clubs carry one series loss and the loser of this series is eliminated. Box score record: the three sources carry the linescore, the full batting and pitching lines, a complete graded play log with its own Fielding accounting, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Curt Schilling takes the win (8.0 IP, 4 H, 1 R, 0 ER, 2 BB, 10 SO, 0 HR); the only run against him was unearned. Josh Beckett takes the loss (6.0 IP, 8 H, 4 R, 4 ER, 2 BB, 1 HBP, 6 SO, 1 HR); all four Philadelphia runs are charged to him. Jonathan Papelbon takes the save (1.0 IP, 1 H, 1 R, 1 ER, 2 SO, 1 HR): he entered the Bottom 9 with a 4-1 lead and pitched the full inning, so the save rests on the lead of three or fewer plus at least one full inning prong, the same prong as Kelvin Herrera&#x27;s save in Game 2 of R1-15. Miami&#x27;s pen was scoreless: Steve Cishek (1.0 IP, 1 H, 1 SO), Anthony Bender (1.0 IP, 0 H, 1 BB, 1 SO), and Antonio Alfonseca (1.0 IP, 0 H, 2 SO). Run charges match the printed lines exactly: Miami pitching allows 4 (Beckett 4, Cishek 0, Bender 0, Alfonseca 0), and Philadelphia pitching allows 2 (Schilling 1, Papelbon 1). The duplicate test ran before the number was assigned: the series&#x27; three stored games are Game 1 (Philadelphia 3, Miami 1), Game 2 (Miami 9, Philadelphia 3), and Game 3 (Miami 8, Philadelphia 6 in 11 innings), all with different scores and linescores, so this box score takes Game 4. The game: Philadelphia scored two in the Top 2, Harper&#x27;s solo home run off Beckett and Howard scoring on Rollins&#x27;s single after walking and taking second on Utley&#x27;s single. Rollins singled Howard home again in the Top 4 after Howard walked and Utley was hit by a pitch, and Callison singled Howard home in the Top 6 after Howard and Ruiz singled, Howard scoring three of Philadelphia&#x27;s four runs. Miami was shut out until the Bottom 7: Yelich singled, took second on Sheffield&#x27;s groundout, and scored when Cabrera reached on Schilling&#x27;s error and Ramirez reached on Utley&#x27;s error, the run unearned. Ramirez&#x27;s solo home run off Papelbon in the Bottom 9 closed it to 4-2 before Papelbon struck out Conine to end it. Philadelphia stranded 9 and Miami 6. Home runs: two, Harper&#x27;s solo shot in the Top 2 off Beckett and Ramirez&#x27;s solo shot in the Bottom 9 off Papelbon. Doubles: one, Schmidt in the Top 7 off Cishek. Triples: none. Errors: two, both Philadelphia&#x27;s: Schilling E1 (Cabrera&#x27;s Bottom 7 reach) and Utley E4 (Ramirez&#x27;s Bottom 7 reach); Miami committed none. Hit batters: one, Utley by Beckett in the Top 4; HB 1 for Beckett and 0 for every other pitcher and HBP 1 for Utley and 0 for every other batter are card-sourced values, so the hit batter check runs on real data. Wild pitches: none, for any pitcher on either club; the logs record no wild pitch, and the zero is a finding, not a gap. Passed balls: none; Ruiz and Realmuto both read 0 in the Fielding tables. Sacrifices: one sacrifice bunt, Castillo in the Bottom 8, and no sacrifice flies, so the lines read SH 1 for Castillo and SF 0 for every batter. Stolen bases: none. Charlie Manuel&#x27;s Top 3 steal call never became an attempt: Klein did not get a good jump and stayed put, and no caught stealing is recorded for either club. Double plays grounded into: one, Realmuto for Miami in the Bottom 6 (turned Utley to Rollins to Harper); Philadelphia turned the game&#x27;s only double play. Substitutions with plate appearances: none; each club printed nine batting lines. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Philadelphia PA is AB 36 plus BB 3 plus HBP 1, which is 40, and the outs plus runs plus stranded identity agrees (27 outs plus 4 runs plus 9 stranded is 40); Miami PA is AB 32 plus BB 2 plus SH 1, which is 35, and the identity agrees (27 outs plus 2 runs plus 6 stranded is 35). Batters faced tie to those totals: Philadelphia 40 PA against 40 Miami BF (Beckett 29, Cishek 4, Bender 4, Alfonseca 3), counted from the play log, and Miami 35 PA against 35 Philadelphia BF (Schilling 31, Papelbon 4). Strikeouts tie both ways: Philadelphia batting 10 against Miami pitching 10 (Beckett 6, Cishek 1, Bender 1, Alfonseca 2), and Miami batting 12 against Philadelphia pitching 12 (Schilling 10, Papelbon 2). Printed RBI: Philadelphia 4 for 4 (Rollins 2, Harper 1, Callison 1); Miami 1 for 2 (Ramirez 1), the Bottom 7 run scoring on the error plays with no RBI. Availability: inside the series the house outs convention reads Game 3 only. Grover Cleveland Alexander threw 23 outs in Game 3 and Dontrelle Willis 18, so both were unavailable under the convention and correctly went unused. Brad Lidge threw 4 outs in Game 3 and did not pitch in this game, so no availability question arises on his line. Six decisions were graded. Charlie Manuel (Philadelphia) made 2 (0 paid off, 1 backfired, 1 neutral): the Top 3 steal call backfired at -0.51, Klein never getting a jump; and the change to Papelbon for the Bottom 9 was neutral at -0.27. Jack McKeon (Miami) made 4 (3 paid off, 1 backfired, 0 neutral): leaving Beckett in for the Top 6, fatigued by the book, backfired at -0.77, the fourth Philadelphia run scoring in the inning; and the changes to Cishek for the Top 7, Bender for the Top 8, and Alfonseca for the Top 9 each paid off at +0.73. Managers: Charlie Manuel (Philadelphia) and Jack McKeon (Miami). Venue is loanDepot Park. The series is tied 2-2.">
