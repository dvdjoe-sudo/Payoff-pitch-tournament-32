  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-08: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official L1-01 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This is Losers Bracket Round 1, Series 1: the Philadelphia Phillies (seed 11) against the Miami Marlins (seed 32), home pattern 2-2-1-1-1, Game 3 at loanDepot Park in Miami, the first game of the series in Miami. Both clubs carry one series loss and the loser of this series is eliminated. Box score record: the three sources carry the linescore, the full batting and pitching lines, a complete graded play log with its own Fielding accounting, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Antonio Alfonseca takes the win (1.0 IP, 1 H, 0 R, 0 ER, 1 BB, 2 SO): he held Philadelphia scoreless in the Top 11 and was Miami&#x27;s pitcher of record when Miami walked it off in the bottom half. Gene Garber takes the loss (0.1 IP, 2 H, 2 R, 2 ER, 1 BB, 1 SO); both Bottom 11 runs are charged to him. There is no save. The starters took no decisions: Grover Cleveland Alexander (7.2 IP, 11 H, 6 R, 5 ER, 3 BB, 0 HBP, 11 SO, 0 HR) left in the Bottom 8 with a 5-4 lead that the rest of the inning spent, and Dontrelle Willis (6.0 IP, 7 H, 5 R, 5 ER, 7 BB, 1 HBP, 3 SO, 1 HR) left after the Top 6 with Philadelphia ahead 5-1. Brad Lidge (1.1 IP, 1 H, 0 R, 1 BB, 1 SO) and Jonathan Papelbon (1.0 IP, 1 H, 0 R, 1 SO) bridged scoreless for Philadelphia before Garber. Miami&#x27;s pen ran A.J. Ramos (1.0 IP, 1 H, 0 R, 1 SO), Steve Cishek (1.0 IP, 0 H, 0 R, 1 SO), Robb Nen (1.0 IP, 2 H, 1 R, 1 ER, 1 BB, 0 SO; the Top 9 tying run), Anthony Bender (1.0 IP, 0 H, 0 R, 2 SO), and Alfonseca. Run charges match the printed lines exactly: Philadelphia pitching allows 8 (Alexander 6, Lidge 0, Papelbon 0, Garber 2), and Miami pitching allows 6 (Willis 5, Ramos 0, Cishek 0, Nen 1, Bender 0, Alfonseca 0). The duplicate test ran before the number was assigned: the series&#x27; two stored games are Game 1 (Philadelphia 3, Miami 1) and Game 2 (Miami 9, Philadelphia 3), both with different scores and linescores, so this box score takes Game 3. The game: Philadelphia scored in the Top 2 without a hit driving in the run, Harper walking, Ruiz walking, and Harper scoring as Rollins struck out, reached on Realmuto&#x27;s dropped third strike, and Realmuto&#x27;s throw went wild; no RBI on the play. Schmidt&#x27;s two-run home run off Willis in the Top 3, Abreu aboard after a walk, made it 3-0. Miami&#x27;s first answer came in the Bottom 5, Conine doubling, Realmuto reaching on Schmidt&#x27;s error, and Castillo singling Conine home, and two more Philadelphia runs in the Top 6 (Callison walking, Klein singling, Schmidt and Harper singling the runs home) restored the margin at 5-1. Three in the Bottom 6 closed it to 5-4: Cabrera doubled, Floyd singled, Conine doubled Cabrera home, Realmuto reached on Schmidt&#x27;s second error with Floyd scoring on the play, and Castillo&#x27;s forceout scored Conine. Miami took the lead in the Bottom 8: Floyd and Conine singled, Realmuto walked, pinch hitter Dan Uggla walked to force Floyd home and tie it, and Yelich&#x27;s sacrifice fly scored Conine for a 6-5 lead. Philadelphia tied it in the Top 9 off Nen, Howard walking and scoring on Ruiz&#x27;s single, before Rollins grounded into a double play. A scoreless tenth, a scoreless Top 11 (Harper doubling and Delahanty intentionally walked, Alfonseca striking out Ruiz and Rollins to strand them), and Miami walked it off in the Bottom 11 off Garber: Stanton walked, Cabrera struck out, Ramirez doubled Stanton to third, and Cliff Floyd singled to center scoring both, his fifth hit of the game. Philadelphia stranded 15 and Miami 13. Home runs: one, Schmidt&#x27;s two-run shot in the Top 3 off Willis, the game&#x27;s only homer. Doubles: eight, four for each club: Abreu, Howard, Rollins, and Harper for Philadelphia; Conine twice, Cabrera, and Ramirez for Miami. Triples: none. Errors: four, three by Philadelphia and one by Miami. Schmidt erred twice for Philadelphia (E5 in the Bottom 5 and the Bottom 6, Realmuto reaching both times) and Ruiz once (E2 in the Bottom 1, his throwing error on Yelich&#x27;s stolen base sending Yelich to third); Realmuto&#x27;s E2 in the Top 2, the dropped third strike and wild throw that let Rollins reach and Harper score, is Miami&#x27;s one error. One run is unearned on the card: Floyd&#x27;s Bottom 6 run against Alexander, who is printed at 6 R and 5 ER, that run scoring on Schmidt&#x27;s error play itself. Willis is printed at 5 R and 5 ER, so the Top 2 run, though it scored on Realmuto&#x27;s error play and carries no RBI, stands as earned on the card. Hit batters: one, Utley by Willis in the Top 5; HB 1 for Willis and 0 for every other pitcher and HBP 0 for every other batter are card-sourced values, so the hit batter check runs on real data. Wild pitches: none, for any pitcher on either club; the logs record no wild pitch, and the zero is a finding, not a gap. Passed balls: none; Realmuto, Charles Johnson, and Ruiz all read 0 in the Fielding tables. Sacrifices: one sacrifice fly, Yelich in the Bottom 8, and no sacrifice bunts, so the lines read SF 1 for Yelich and SH 0 for every batter. Stolen bases: one, Yelich for Miami in the Bottom 1 (second base, taking third on Ruiz&#x27;s error on the same play). Caught stealing: none. Double plays grounded into: two, Rollins for Philadelphia in the Top 9 (turned Conine to Ramirez to Conine) and Cabrera for Miami in the Bottom 7 (turned Rollins to Utley to Harper), one turned by each club. Substitutions: three with plate appearances. Dan Uggla pinch-hit for Castillo in the Bottom 8 and walked in the tying run, then batted again in the Bottom 10; Charles Johnson replaced Realmuto at catcher for defense in the Top 9 and batted in the Bottom 10; Ed Delahanty pinch-hit for Howard in the Top 11 and was intentionally walked, so Philadelphia printed ten batting lines and Miami eleven. Plate appearances counted fresh from the printed batting lines and the play log, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Philadelphia PA is AB 44 plus BB 9 plus HBP 1, which is 54, and the outs plus runs plus stranded identity agrees (33 outs plus 6 runs plus 15 stranded is 54); Miami PA is AB 46 plus BB 5 plus SF 1, which is 52, and the identity agrees (31 outs plus 8 runs plus 13 stranded is 52), Miami&#x27;s outs being 31 rather than 33 because the walk-off single ended the Bottom 11 after one out. Batters faced tie to those totals: Philadelphia 54 PA against 54 Miami BF (Willis 34, Ramos 4, Cishek 3, Nen 5, Bender 3, Alfonseca 5), counted from the play log, and Miami 52 PA against 52 Philadelphia BF (Alexander 38, Lidge 6, Papelbon 4, Garber 4). Strikeouts tie both ways: Philadelphia batting 9 against Miami pitching 9 (Willis 3, Ramos 1, Cishek 1, Nen 0, Bender 2, Alfonseca 2), and Miami batting 14 against Philadelphia pitching 14 (Alexander 11, Lidge 1, Papelbon 1, Garber 1). Printed RBI: Philadelphia 5 for 6 (Schmidt 3, Harper 1, Ruiz 1), the Top 2 run scoring on the error play with no RBI; Miami 7 for 8 (Castillo 2, Floyd 2, Yelich 1, Conine 1, Uggla 1), the Bottom 6 Floyd run scoring on the error play with no RBI. Availability: inside the series the house outs convention reads Game 2 only. Robin Roberts threw 24 outs in Game 2 and was unavailable, and correctly went unused; Sandy Alcantara threw 17 outs in Game 2 and was likewise unavailable and unused. Tanner Scott threw 4 outs in Game 2 and was capped at 3 outs for this game, and did not pitch, so the cap was honored. Ramos (3 outs), Nen (3), Papelbon (1), and Lidge (2) were all free after short Game 2 outings, and every other arm used had no Game 2 line. Thirteen decisions were graded. Jack McKeon (Miami) made 9 (4 paid off, 4 backfired, 1 neutral): the Bottom 1 hit and run backfired at -0.76, Sheffield striking out; leaving Willis in for the Top 6, fatigued by the book, backfired at -1.27, two runs scoring; the changes to Ramos for the Top 7 and Cishek for the Top 8 each paid off at +0.73; the Uggla pinch hit in the Bottom 8 paid off at +0.71; the change to Nen for the Top 9 backfired at -0.77, the tying run scoring; the Charles Johnson defensive sub in the Top 9 backfired at -0.52; the change to Bender for the Top 10 paid off at +0.73; and the change to Alfonseca for the Top 11 was neutral at +0.23. Charlie Manuel (Philadelphia) made 4 (2 paid off, 2 backfired, 0 neutral): the change to Lidge in the Bottom 8 paid off at +0.73 and the change to Papelbon for the Bottom 10 paid off at +0.73; the Delahanty pinch hit for Howard in the Top 11 backfired at -0.85, an intentional walk that loaded nothing and led nowhere; and the change to Garber for the Bottom 11 backfired at -1.77, the game&#x27;s worst grade, both runs scoring. Managers: Jack McKeon (Miami) and Charlie Manuel (Philadelphia). Venue is loanDepot Park. Miami leads the series 2-1.">
