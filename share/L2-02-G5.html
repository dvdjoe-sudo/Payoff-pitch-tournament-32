  <title>L2-02-G5: Montreal Expos 3, Atlanta Braves 5</title>
  <meta name="description" content="Losers Bracket, Round 2, Series 2, Game 5 at Truist Park, as the master export&#x27;s box header and the Rec print the venue, &quot;TRUIST PARK&quot;. The L2-02 series was formed with Game 1: #7 Atlanta Braves (manager Bobby Cox) against #27 Montreal Expos (manager Dick Williams), home pattern Atlanta for Games 1, 2, 5 and 7, Montreal for Games 3, 4 and 6. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the narrative play log, the graded play-by-play with its manager decisions and decisions summary, and the full Rec JSON (W ATL|glavito02, L MON|vazquja01, SV ATL|kimbrcr01; the Rec extra list carries two hold lines, for Jonny Venters and Raisel Iglesias). The export&#x27;s filename and header date read 2026-11-22, but the Rec&#x27;s recorded stamp is 2026-11-22T00:40:39Z, 4:40 PM PT on 2026-11-21, and that is the played date the book carries. Atlanta won 5-3; Montreal leads the series 3-2 and Atlanta still faces elimination in Game 6. Decisions: Tom Glavine takes the win for Atlanta (6.0 IP, 23 BF, 5 H, 3 R, 3 ER, 1 BB, 3 SO, 2 HR); Javier Vazquez takes the loss for Montreal (5.1 IP, 24 BF, 7 H, 5 R, 5 ER, 0 BB, 4 SO, 3 HR); Craig Kimbrel saves it with a perfect top of the 9th (1.0 IP, 3 BF). Andy McGaffigan (2.2 IP, 9 BF, 1 H, 2 SO) finished the 6th through the 8th scoreless for Montreal. Jonny Venters (1.0 IP, 5 BF, 2 H, 1 WP) and Raisel Iglesias (1.0 IP, 3 BF, 1 SO) bridged the 7th and 8th scoreless for Atlanta. Player of the game: Freddie Freeman, 2 for 4 with a home run, 2 RBI and 2 runs scored. Scoring: Atlanta&#x27;s bottom of the 1st scored four off Vazquez: Chipper Jones and Ronald Acuna Jr. hit back-to-back solo home runs, Eddie Mathews doubled, Del Crandall grounded out, Freeman&#x27;s single scored Mathews, and Dale Murphy&#x27;s double scored Freeman, 4-0. Montreal&#x27;s top of the 3rd scored one off Glavine, Orlando Cabrera&#x27;s solo home run, 4-1. The top of the 4th made it 4-2 on Rusty Staub&#x27;s solo home run. The top of the 6th made it 4-3: Cabrera tripled and Tim Raines singled him home; Raines was twice sent on graded steal decisions in the inning and held both times, and Glavine finished the inning with no further scoring. Atlanta&#x27;s bottom of the 6th scored its last run, Freeman&#x27;s solo home run off Vazquez, 5-3; McGaffigan relieved Vazquez after the homer and allowed one hit the rest of the way. Venters allowed two singles and a wild pitch in the top of the 7th but no run, Iglesias retired the top of the 8th in order, and Kimbrel retired Carter, Dawson and Fairly in order in the 9th. The extra list, exactly as printed: holds for Jonny Venters (he entered the top of the 7th up 5-3 and kept the lead) and Raisel Iglesias (he entered the top of the 8th up 5-3 and retired the side in order). No inherited-runner lines: every reliever on both clubs entered with the bases empty (McGaffigan entered after Freeman&#x27;s home run). No blown saves. Errors: one, charged to Montreal: Rusty Staub&#x27;s 1-base error in right field (E9) in the bottom of the 3rd, Freeman reaching with two out (play row seq 24, the row&#x27;s own steps printing &quot;Error, RF Staub (1-base error)&quot;); Freeman did not score, Murphy striking out to end the inning. The error is confirmed by the play rows&#x27; rebuilt error count (MON 1 / ATL 0), the printed fielding sections, the batting CSV&#x27;s E column and the Rec fld array alike, and team_errors reads MON 1, ATL 0. Double plays: one, turned by Atlanta: Andre Dawson&#x27;s top of the 2nd grounder to second (row seq 13, coded &quot;DP 4-6-3&quot;), matching Dawson&#x27;s printed GIDP 1 and Atlanta&#x27;s printed team DP 1 (Freddie Freeman, Rabbit Maranville and Ozzie Albies each carry DP 1 in the fielding section as the chain&#x27;s fielders), so no GIDP-practice divergence arises. Stolen bases: none recorded by either club; Raines&#x27;s two graded steal sends in the top of the 6th both ended with the runner held (the play log prints that he &quot;does not get a good jump and stays put&quot;), so no attempt appears in the lines; caught stealing: none. The catching lines as printed: Del Crandall, PB 0 and nothing against for Atlanta; Gary Carter, PB 0 and nothing against for Montreal. Defensive lines are booked in the established shape from the printed fielding section (Montreal 24 putouts and 11 assists: Fairly 12 putouts at first, Carter 6 putouts catching, Raines 3 putouts, Cabrera 1 putout and 4 assists, Vidro 1 putout and 4 assists, Wallach 3 assists, Dawson 1 putout, Staub no putouts or assists with the game&#x27;s one error; Atlanta 27 putouts and 16 assists with DP 1: Freeman 16 putouts at first with DP 1, Mathews 7 assists, Maranville 1 putout and 5 assists with DP 1, Albies 1 putout and 3 assists with DP 1, Andruw Jones 4 putouts, Crandall 4 putouts catching, Murphy 1 putout, Glavine 1 assist). Substitutes: Atlanta: Hank Aaron (defensive sub at left field for Acuna for the top of the 8th, a graded defensive sub; he grounded out in the bottom of the 8th in Acuna&#x27;s spot; he has no fielding line in the box score, the CSV fielding section or the Rec fld array, so none is booked for him). Montreal used no substitutes. Wild pitches: one, Jonny Venters in the top of the 7th; it scored nobody and is carried in Atlanta&#x27;s defense wp map as printed. Passed balls: none. Hit by pitch: none. Counting checks: Montreal plate appearances 34 (33 AB, 1 BB) equal Atlanta&#x27;s 34 batters faced (Glavine 23, Venters 5, Iglesias 3, Kimbrel 3); Atlanta plate appearances 33 (33 AB, no walks) equal Montreal&#x27;s 33 batters faced (Vazquez 24, McGaffigan 9). Hit, walk, home run and strikeout totals tie across the two boxes both ways (Montreal batting strikeouts 4 = Glavine 3 + Iglesias 1; Atlanta batting strikeouts 6 = Vazquez 4 + McGaffigan 2; Montreal home runs 2 = Glavine 2 (Cabrera, Staub); Atlanta home runs 3 = Vazquez 3 (Chipper Jones, Acuna, Freeman)). Team RBI equals team runs both ways (Montreal 3, Atlanta 5), and staff earned runs tie exactly both ways (Montreal staff 5 ER against Atlanta&#x27;s 5 runs; Atlanta staff 3 ER against Montreal&#x27;s 3 runs). Manager grades: the grades list names both managers directly, so no label mapping is needed. Bobby Cox graded 5 decisions, all 5 paid off: 3 pitching changes (Venters for the 7th, Iglesias for the 8th and Kimbrel for the 9th, all scoreless), 1 left-pitcher-in (Glavine was left in for the top of the 6th; Cabrera&#x27;s run scored in the inning but Glavine finished it and took the win) and 1 defensive sub (Aaron at left field for the 8th, a clean inning in the field). Dick Williams graded 4 decisions (1 paid off, 3 backfired): 2 steals (both backfired: Raines sent twice in the top of the 6th and held both times), 1 hit and run (backfired: Cabrera flied out in the top of the 7th) and 1 pitching change (paid off: McGaffigan for Vazquez in the bottom of the 6th, scoreless the rest of the way). Availability: Game 4&#x27;s unavailable pair, Bryn Smith (18 outs) and John Smoltz (15 outs), appear nowhere in this game, and the Rec&#x27;s own unavailable block lists both among its rest and house-rule entries. Andy McGaffigan&#x27;s cap from Game 3 applied to Game 4 only, and he sat Game 4 out, so his 2.2 innings here are clean. Game 6 availability, from this game&#x27;s outs: Javier Vazquez (16 outs) and Tom Glavine (18 outs) both threw 9 or more outs and are unavailable for Game 6; Andy McGaffigan (8 outs) is capped at 3 outs; Jonny Venters, Raisel Iglesias and Craig Kimbrel (3 outs each) are free. Montreal leads the series 3-2 and stands 8-8 in games and 1-1 in series; Atlanta stands 9-7 in games and 1-1 in series and faces elimination in Game 6 at Montreal. The loser of this series is eliminated. Managers: Dick Williams (Montreal) and Bobby Cox (Atlanta). Venue is Truist Park.">
