  <title>W2-04-G3: Detroit Tigers 10, Chicago White Sox 9</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 4, Game 3 at Guaranteed Rate Field. Detroit wins 10-9 and leads the series 2-1. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Mickey Lolich takes the win for Detroit (6.0 IP, 34 BF, 13 H, 6 ER, 3 BB, 2 SO, 1 WP); he came back out for the bottom of the 7th and was charged with all three runs in it. Chris Sale takes the loss for Chicago (4.1 IP, 23 BF, 10 H, 7 ER, 3 SO, 3 HR allowed), knocked out in the top of the 5th. Aurelio Lopez takes the save (0.1 IP, 1 BF): he entered in the bottom of the 9th after Eddie Collins&#x27;s two-run home run cut the lead to one, two out and the bases empty, and got Frank Thomas on a grounder to third to end the game; Sparky Anderson&#x27;s pitching change to Lopez is graded paid off in the log. Scoring: Detroit scored four in the top of the 1st off Sale: Ty Cobb led off the game with a home run, the decisive play the export&#x27;s summary names, Charlie Gehringer singled and took second on Al Kaline&#x27;s groundout, Hank Greenberg struck out, and Miguel Cabrera singled Gehringer home, Sam Crawford doubled Cabrera home, and Bill Freehan singled Crawford home; George Kell singled and Alan Trammell flied out to end it. Chicago answered in the bottom of the 1st: Fielder Jones singled, Collins&#x27;s groundout moved him to third, and Frank Thomas&#x27;s sacrifice fly scored him; Minnie Miñoso doubled and Joe Jackson&#x27;s infield single ended in a hidden-ball trick for the third out. Bottom of the 2nd: Luke Appling reached on Trammell&#x27;s one-base error and never scored. Top of the 3rd: Greenberg homered off Sale (5-1). Bottom of the 3rd: Collins singled, took third on Thomas&#x27;s hit-and-run single, and scored on Miñoso&#x27;s single (5-2). Top of the 5th: Greenberg doubled and Cabrera&#x27;s two-run home run made it 7-2 and finished Sale; against Dámaso Marte, Crawford reached on Miñoso&#x27;s error in left, Freehan singled and Kell bunted them along, but Trammell grounded out and Crawford never scored. Bottom of the 5th: Collins singled off Lolich, stole second and took third on Freehan&#x27;s wild throw, and scored on Thomas&#x27;s clean single to right (7-3); the run is earned as printed, the error only advancing him. Top of the 6th, off Marte: two more, Cobb singled, Gehringer&#x27;s hit-and-run single put runners at the corners, Kaline walked to load the bases, Greenberg walked to force in Cobb, Cabrera flied out, and Crawford&#x27;s forceout grounder scored Gehringer (9-3). Bottom of the 7th: Lolich came back out and Chicago scored three: Thomas walked, Miñoso singled, Jackson doubled both home on the hit and run, Ventura walked, and Magglio Ordóñez&#x27;s hit-and-run single scored Jackson. John Hiller then inherited two runners and struck out Carlton Fisk, the pinch-hitter Chet Lemon, and Collins with the bases loaded to end the inning; the Rec&#x27;s extra line reads 2 inherited, 0 scored for Hiller, and he takes the hold. Bottom of the 8th: Hiller struck out Thomas and Miñoso, Jackson doubled, and Robin Ventura doubled him home (9-7); Willie Hernandez replaced Hiller with Ventura on second (1 inherited, 0 scored in the extra line) and Ordóñez popped out, and Hernandez takes the second hold. Top of the 9th: Freehan homered off Mark Buehrle (10-7), the insurance run that decided the game. Bottom of the 9th, traced from the play rows: Appling singled off Hernandez, Fisk popped out to short, Lemon forced Appling at second, and Collins homered to cut it to 10-9; Lopez came on for Hernandez and Thomas grounded out to third (Kell to Greenberg) to end it. Hank Greenberg is the export&#x27;s player of the game: 2 for 4 with a double, the top-of-the-3rd home run, 2 RBIs, 2 runs and the bases-loaded walk. Key lines: for Detroit, Freehan 3 for 5 with the 9th-inning home run and 2 RBIs, Cabrera 2 for 5 with the two-run home run and 3 RBIs, Cobb 2 for 5 with the leadoff home run, Crawford 1 for 4 with a double and 2 RBIs, Gehringer 2 for 5 with 2 runs; for Chicago, Collins 3 for 6 with 3 runs, the 9th-inning two-run homer, a stolen base and 2 RBIs, Jackson 3 for 5 with two doubles and 2 RBIs, Miñoso 3 for 5 with a double and an RBI, Thomas 2 for 4 with 2 RBIs and the sacrifice fly, Ventura 2 for 4 with the 8th-inning RBI double. Pitching lines of note: Hiller 1.2 IP, 8 BF, 2 H, 1 ER, 1 BB, 5 SO and the hold, his only run Ventura&#x27;s double; Hernandez 1.0 IP, 5 BF, 2 H, 2 ER, 1 HR and the hold despite the 9th-inning homer; Marte 2.2 IP, 15 BF, 4 H, 2 ER, 2 BB in relief of Sale; Buehrle 2.0 IP, 7 BF, 2 H, 1 ER, 2 SO, Freehan&#x27;s homer his only run. Errors: Detroit 2 (Trammell in the 2nd, Freehan&#x27;s throwing error in the 5th), Chicago 1 (Miñoso in the 5th); no run in the game was unearned: Appling never scored after reaching on Trammell&#x27;s error, Collins&#x27;s 5th-inning run scored on a clean single after Freehan&#x27;s error only advanced him, and Crawford never scored after reaching on Miñoso&#x27;s error, so both staffs&#x27; earned runs equal their runs exactly as printed. Double plays: Chicago turned one, Cabrera&#x27;s top-of-the-8th grounder, a genuine double-play row in the log and the game&#x27;s only printed GIDP. Stolen bases: Collins and Carlton Fisk, both off Freehan (his catching line reads SB against 2, CS 0, PB 0). Wild pitches: Lolich 1. Passed balls: none. Hit by pitch: none on either side. Substitutes: Chet Lemon pinch-hit for Jones in the bottom of the 7th, struck out, and stayed in the game in center field; he caught Trammell&#x27;s 9th-inning flyout and forced Appling at second in the bottom of the 9th. Tony Phillips replaced Sam Crawford in left field before the bottom of the 8th and batted in his spot in the top of the 9th, flying out to left; he carries no fielding line in the export and none is booked. The defense object books putouts, assists and errors exactly as printed: Detroit 27 putouts and 9 assists (Greenberg 10 putouts; Gehringer 4 assists, Kell 4 assists), Chicago 27 putouts and 6 assists (Thomas 7 putouts, Fisk 6 putouts and 1 assist, Ventura 3 assists). Counting checks: Detroit plate appearances 45 (42 AB, 2 BB, 1 SH) equal Chicago&#x27;s 45 batters faced (Sale 23, Marte 15, Buehrle 7); Chicago plate appearances 48 (43 AB, 4 BB, 1 SF) equal Detroit&#x27;s 48 batters faced (Lolich 34, Hiller 8, Hernandez 5, Lopez 1). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Every run carries an RBI (Detroit 10 runs on 10 RBIs, Chicago 9 on 9). One correction to the booking brief, booked as printed: the brief carried Joe Jackson with one double; the export&#x27;s CSV batting section, its Rec bat array and the play rows (the bottom-of-the-7th double and a bottom-of-the-8th double to right) all show two, and two are booked. Manager grades: the grades list names both managers directly, so no label mapping is needed. Fielder Jones graded 13 decisions (6 paid off, 2 backfired, 5 neutral): six hit and runs at 3 paid off, 1 backfired and 2 neutral, two pitching changes at 1 paid off and 1 neutral, two steals at 1 paid off and 1 neutral, two left-pitcher-in calls at 1 paid off and 1 neutral, and the Lemon pinch-hit backfired. Sparky Anderson graded 5 decisions (4 paid off, 1 backfired, 0 neutral): all three pitching changes paid off (Hiller in the 7th, Hernandez in the 8th, Lopez in the 9th), his one hit and run paid off, and the Phillips defensive sub backfired. Series graded totals through three games: Jones 27 decisions (11 paid off, 9 backfired, 7 neutral); Anderson 12 (8 paid off, 2 backfired, 2 neutral). Availability for Game 4 under the convention: Lolich (18 outs in this game) and Sale (13 outs) are unavailable; Marte (8 outs) and Buehrle (6 outs) are capped at 3 outs; Hiller (5 outs), Hernandez (3) and Lopez (1) are free. Game 2&#x27;s rest rules were honored in this game: Faber and Verlander sat. Managers: Fielder Jones (Chicago) and Sparky Anderson (Detroit). Venue is Guaranteed Rate Field, as printed.">
