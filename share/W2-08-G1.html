  <title>W2-08-G1: Cincinnati Reds 4, Pittsburgh Pirates 6</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 8, Game 1 at PNC Park. This booking forms the series in its archive slot: Pittsburgh, the #8 seed, against Cincinnati, the #9 seed, the reseeded Winners Round 2 pairing, with Pittsburgh home for Games 1, 2, 5 and 7. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Pittsburgh beat Cincinnati 6-4 in 10 innings, leading 4-0 into the top of the 7th before Eric Davis&#x27;s grand slam tied it, and winning on Barry Bonds&#x27;s walk-off two-run home run in the bottom of the 10th. Decisions: Kent Tekulve takes the win for Pittsburgh (1.0 IP, 3 BF, 0 H, 0 R, 0 ER, 0 BB, 2 SO), a perfect top of the 10th. John Franco takes the loss for Cincinnati (0.2 IP, 4 BF, 2 H, 2 R, 2 ER, 0 BB, 0 SO, 1 HR). Barry Bonds is the export&#x27;s player of the game (1 for 4, the walk-off home run, 2 RBI, 1 walk, 1 run). Scoring: the bottom of the 2nd, Willie Stargell singled and Ralph Kiner hit a two-run home run off Noodles Hahn, 2-0. The bottom of the 3rd, Honus Wagner singled and Roberto Clemente singled him home, 3-0. The bottom of the 5th, Andrew McCutchen doubled off Eppa Rixey and Clemente singled him home again, 4-0. The top of the 7th, off Sam Leever: Joey Votto was hit by a pitch, George Foster singled, Ted Kluszewski pinch-hit for Tony Perez and walked, and Eric Davis hit a grand slam, all four runs charged to Leever, 4-4; Roy Face came on and finished the inning. The bottom of the 10th, off Franco: Wagner singled, Paul Waner sacrificed him to second, and Bonds hit the two-run home run that ended it, 6-4; a home run clears the bases, so both runs count and no walk-off trim applies. Pitching: Paul Skenes started for Pittsburgh and threw five scoreless innings (5.0 IP, 19 BF, 3 H, 0 R, 0 ER, 3 BB, 6 SO); Leever&#x27;s one inning carried all four Cincinnati runs (1.0 IP, 7 BF, 2 H, 4 ER, 1 BB, 1 HBP, 1 SO, the Davis home run), and Face (1.0 IP, 3 BF, 1 SO), Dave Giusti (1.0 IP, 3 BF) and Mark Melancon (1.0 IP, 5 BF, 2 BB; he walked Foster, survived two hit-and-run groundouts and intentionally walked Davis) held the tie before Tekulve. For Cincinnati, Hahn (3.0 IP, 13 BF, 5 H, 3 ER, 4 SO, 1 HR, 1 WP) and Rixey (3.0 IP, 13 BF, 3 H, 1 ER, 1 BB, 4 SO) split the first six innings, and Francisco Cordero (1.0 IP, 4 BF, 1 H, 1 SO), Rob Dibble (1.0 IP, 3 BF, 2 SO) and Aroldis Chapman (1.0 IP, 3 BF, 2 SO) each threw a scoreless inning before Franco. The game was errorless and neither club turned a double play. Caught stealing: three, all in the first four innings: Votto in the top of the 2nd and Johnny Bench in the top of the 4th, both thrown out by Manny Sanguillen, and Clemente in the bottom of the 3rd, thrown out by Bench. The catching lines as printed: Bench PB 0, 1 steal attempt against, 0 stolen bases, 1 caught stealing; Sanguillen PB 0, 2 steal attempts against, 0 stolen bases, 2 caught stealing. Defensive lines are booked in the established shape from the printed fielding section (Cincinnati 29 putouts and 10 assists, Bench 13 putouts catching, Joey Votto 10 putouts, Barry Larkin 4 assists; Pittsburgh 30 putouts and 12 assists, Stargell 11 putouts, Sanguillen 10 putouts catching, Honus Wagner 5 assists). Substitutes: Kluszewski for Perez in the top of the 7th and Waner for Clemente in the bottom of the 7th, both staying in for the rest of the game. Wild pitches: Hahn 1. Passed balls: none. Hit by pitch: Votto, by Leever in the top of the 7th, the game&#x27;s only one, and he scored on the grand slam. Counting checks: Cincinnati plate appearances 40 (33 AB, 6 BB, 1 HBP) equal Pittsburgh&#x27;s 40 batters faced (Skenes 19, Leever 7, Face 3, Giusti 3, Melancon 5, Tekulve 3); Pittsburgh plate appearances 40 (38 AB, 1 BB, 1 SH) equal Cincinnati&#x27;s 40 batters faced (Hahn 13, Rixey 13, Cordero 4, Dibble 3, Chapman 3, Franco 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways. All four Cincinnati runs carry RBIs (Davis&#x27;s grand slam accounts for all four); Pittsburgh&#x27;s six runs carry six RBIs (Clemente 2, Bonds 2, Kiner 2). Manager grades: the grades list names both managers directly, so no label mapping is needed. Sparky Anderson graded 13 decisions (5 paid off, 7 backfired, 1 neutral): 5 steals (1 paid off, 4 backfired), 5 pitching changes (3 paid off, 1 backfired, 1 neutral), 2 hit and runs (both backfired, the top-of-the-9th groundouts) and 1 pinch hitter (paid off, Kluszewski&#x27;s walk in front of the grand slam). Danny Murtaugh graded 8 decisions (4 paid off, 2 backfired, 2 neutral): 5 pitching changes (4 paid off, 1 neutral), 2 steals (1 backfired, 1 neutral) and 1 pinch hitter (backfired, Waner&#x27;s bottom-of-the-7th groundout). Availability for Game 2 under the convention: Paul Skenes (15 outs in this game), Noodles Hahn (9 outs) and Eppa Rixey (9 outs) are unavailable; everyone else who pitched recorded 3 outs or fewer and is free (John Franco 2 outs). Pittsburgh leads the series 1-0. Managers: Danny Murtaugh (Pittsburgh) and Sparky Anderson (Cincinnati). Venue is PNC Park, as printed.">
