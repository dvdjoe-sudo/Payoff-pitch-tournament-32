  <title>L1-05-G7: Colorado Rockies 1, Los Angeles Angels 3</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 5, Game 7 at Angel Stadium of Anaheim, as the master export&#x27;s box score prints the venue. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Joe also sent a series export for the full seven games; its Game 7 record is identical to the game export&#x27;s in every field, and its series totals agree with the book (Los Angeles 41 runs, Colorado 28 across the seven games). Every source agrees on every figure booked. Decisions: Nolan Ryan takes the win for Los Angeles (7.2 IP, 32 BF, 5 H, 1 R, 1 ER, 5 BB, 1 HBP, 6 SO). Aaron Cook takes the loss for Colorado (5.0 IP, 23 BF, 6 H, 2 R, 2 ER, 2 BB, 1 SO, 1 HR). Francisco Rodríguez earns the save with a perfect top of the 9th (1.0 IP, 3 BF, 3 SO). Scoring: Los Angeles scored one in the bottom of the 4th off Cook (Glaus solo home run leading off). Los Angeles scored one in the bottom of the 5th off Cook (Boone single, Ohtani flyout, Trout single, Guerrero forceout at second moving Boone to third, Glaus RBI single). Los Angeles scored one in the bottom of the 6th off Betancourt (Edmonds strikeout, Grich groundout, Fregosi solo home run with two out). Colorado scored its only run in the top of the 8th: Salmon had just entered at right field, Blackmon singled off Ryan and LeMahieu walked, Helton grounded into a 5-4-3 double play moving Blackmon to third, Arenado and Walker walked to load the bases, Shields relieved Ryan, and during Story&#x27;s at-bat Shields threw a wild pitch that scored Blackmon from third before Story grounded out to short to end the inning. Colorado&#x27;s run carries no RBI: it scored on the wild pitch (play row seq 72, 1 run, 0 RBI, Blackmon the scorer, steps &quot;Wild pitch! Runners advance 1 (p9).&quot; and &quot;Charlie Blackmon scores.&quot;), and the run is charged to Ryan, whose line reads 1 R and 1 ER, with Shields&#x27;s line carrying the WP 1. Los Angeles&#x27;s plate appearances tie exactly: 35 (33 AB, 2 BB: Ohtani in the bottom of the 1st and Grich in the bottom of the 4th) against Colorado&#x27;s 35 batters faced (Cook 23, Betancourt 4, Logan 4, DiPoto 4), and the play rows carry exactly 35 Los Angeles batter rows; no catcher&#x27;s interference or any other non-at-bat plate appearance exists anywhere in the export. Errors: Colorado 1, Torrealba, a throwing error (E2) on Joyner&#x27;s stolen base in the bottom of the 8th, the throw sailing as Joyner took third; it cost nothing, and Colorado&#x27;s staff earned-run total of 3 ties to Los Angeles&#x27;s 3 runs. Los Angeles was errorless. Double plays: one, Los Angeles&#x27;s, in the top of the 8th: Helton grounded into a double play (5-4-3), with Glaus, Grich and Joyner each credited in the printed fielding section and Helton carrying the game&#x27;s only printed GIDP. Stolen bases: 3, all Los Angeles and all against Torrealba, whose catching line prints 3 stolen bases against: Ohtani in the bottom of the 3rd, Trout in the bottom of the 1st, and Joyner in the bottom of the 8th (taking third on the error). Caught stealing: 1, Holliday in the top of the 7th, thrown out by Boone with Grich taking the throw; Boone&#x27;s catching line prints 1 caught stealing against. Wild pitches: Shields 1, the run-scoring pitch in the top of the 8th. Passed balls: none for either club. Substitutes: Garret Anderson entered at left field for Edmonds in the top of the 7th and flew out in his only at-bat (bottom of the 8th); Tim Salmon entered at right field for Guerrero in the top of the 8th and never batted; neither had a fielding chance, so neither carries a fielding line, exactly as the export prints them. Fielding from the CSV&#x27;s printed fielding section: Colorado 24 putouts and 9 assists (Blackmon 7 putouts; Arenado 5 assists); Los Angeles 27 putouts and 12 assists (Joyner 10 putouts; Glaus 5 assists). Counting checks: Colorado plate appearances 36 (30 AB, 5 BB, 1 HBP) equal Los Angeles&#x27;s 36 batters faced (Ryan 32, Shields 1, Rodríguez 3). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Mike Scioscia graded 10 decisions (2 paid off, 5 backfired, 3 neutral): steals 5 (the bottom of the 1st backfired, -0.86, Ohtani held; the bottom of the 1st neutral, -0.26, Trout safe; the bottom of the 3rd neutral, -0.26, Ohtani safe; the bottom of the 8th backfired, -0.86, Joyner held; the bottom of the 8th neutral, -0.26, Joyner safe and to third on the error), defensive subs 2 (Anderson at left field in the top of the 7th paid off, +0.48; Salmon at right field in the top of the 8th backfired, -0.52), one hit and run (the bottom of the 7th backfired, -0.76, Guerrero popped out), and pitching changes 2 (Shields in the top of the 8th backfired, -0.50; Rodríguez in the top of the 9th paid off, +0.73). Bud Black graded 5 decisions (1 paid off, 2 backfired, 2 neutral): pitching changes 3 (Betancourt in the bottom of the 6th neutral, -0.27; Logan in the bottom of the 7th paid off, +0.73; DiPoto in the bottom of the 8th neutral, +0.23), one hit and run (the top of the 3rd backfired, -0.76, LeMahieu flew out), and one steal (the top of the 7th backfired, -0.76, Holliday caught stealing). Game 6&#x27;s availability was honored in this game: Chuck Finley (18 outs in Game 6, unavailable) did not pitch for Los Angeles, and Huston Street (6 outs in Game 6, capped at 3 outs) did not pitch for Colorado; neither appears in the pitching lines or the play rows. The win closes the series: Los Angeles takes it 4-3, outscoring Colorado 41-28 over the seven games, and advances to Losers Round 2; Colorado, swept by St. Louis in its opening series and beaten here, is eliminated with its second series loss. Series MVP, by Joe&#x27;s ruling on 2026-11-13: Mike Trout (Los Angeles); runner-up Nolan Ryan (Los Angeles). Managers: Mike Scioscia (Los Angeles) and Bud Black (Colorado). Venue is Angel Stadium of Anaheim, as printed.">
