  <title>R1-10-G1: Milwaukee Brewers 1, Los Angeles Dodgers 12</title>
  <meta name="description" content="Played by Joe in the playable app and sent to the co-managed tournament games chat on 2026-11-08 as four files: the full graded play by play, the scorecard CSV export (line, batting, pitching, fielding, and play sections), the app scorecard PDF (the Payoff Pitch Gazette, Final Edition, Sunday, November 8, 2026), and the scorecard photo. Joe ruled in chat the same day: &quot;Replace this with game 1 dodger vs brewers,&quot; adopting this playing as the new R1-10 Game 1 under the R1-05 Game 1 and R1-06 Game 1 adoption precedents; the replaced game (Los Angeles 6, Milwaukee 5 in 10 innings, W Eric Gagne, L Rollie Fingers, Roy Campanella&#x27;s walk-off home run in the Bottom 10, booked 2026-11-01) is preserved untouched in the Dodgers records at archive/replaced/. All four sources agree on every number: the linescore, the batting and pitching sums, plate appearances against batters faced for every pitcher, and printed RBI (Milwaukee 0 for 1, its run scoring on a wild pitch; Los Angeles 11 for 12, Pee Wee Reese&#x27;s Bottom 4 run scoring on Zack Wheat&#x27;s single with no RBI printed in any source, booked as printed). No seed is printed in any of the four sources, so rng_seed is 0, as in the replaced game and the rest of the series. The decisions are not printed; they are derived from the play log and the run charges. Sandy Koufax takes the win with a complete game: 9.0 IP, 3 H, 1 R, 1 ER, 3 BB, 1 HB, 9 SO, 0 HR, 34 BF. Teddy Higuera takes the loss: Los Angeles took the lead for good in the Bottom 1 on Shohei Ohtani&#x27;s two-run home run, and Higuera is charged with six runs (Ohtani&#x27;s homer scored Zack Wheat and Ohtani in the 1st, Ron Cey&#x27;s homer scored Gil Hodges and Cey in the 4th, and Reese and Jackie Robinson, who singled off him in the 4th, scored on singles off Dan Plesac); his printed line reads 4 ER, the two Bottom 1 runs unearned as printed after Brice Turang&#x27;s error. No save. Run charges match the printed lines exactly: Milwaukee pitching allows 6 + 3 + 3 + 0 + 0 + 0 = 12 (Higuera, Plesac, Fingers, Devin Williams, Jeremy Jeffress, Ken Sanders), and Los Angeles pitching allows 1 (Koufax). The game: Milwaukee scored in the Top 1, Christian Yelich singling, stealing second during Paul Molitor&#x27;s hit-and-run strikeout, taking third on Robin Yount&#x27;s fly out, and scoring on Koufax&#x27;s wild pitch during Prince Fielder&#x27;s at-bat (Koufax WP 1 as printed). Los Angeles answered in the Bottom 1: Wheat reached on Turang&#x27;s error (E4) and Ohtani hit a two-run home run off Higuera. The Bottom 4 scored seven: Hodges singled, Roy Campanella bunted him to second, Cey hit a two-run home run, Reese and Robinson singled, Plesac relieved, Wheat singled home Reese, Mookie Betts singled home Robinson, and Duke Snider hit a three-run home run. The Bottom 5 scored three off Fingers: Campanella and Reese singled and Wheat hit a three-run home run. Los Angeles hit four home runs (Ohtani, Cey, Snider, Wheat) and Milwaukee none; home runs allowed split Higuera 2, Plesac 1, Fingers 1. Errors: Turang&#x27;s E4 is the game&#x27;s only error, and errors_by carries him as the sources print it; Los Angeles made none. Hit batter: Geoff Jenkins, hit by Koufax in the Top 7 (HB 1 for Koufax, HBP 1 for Jenkins), as printed on the card, so the hit batter check runs on real data. Wild pitches as printed: Koufax 1 and Plesac 1; a wild pitch is not a stored archive field and both are noted here only. Sacrifices: Campanella&#x27;s Bottom 4 bunt is the game&#x27;s only sacrifice (SH 1); no sacrifice flies. Stolen bases: Yelich&#x27;s steal of second is the game&#x27;s only steal; the three other steal sends (Jenkins in the Top 5, Molitor in the Top 6, Carlos Gómez in the Top 8) were held runners who did not get a good jump, not attempts, and there was no caught stealing. Double plays grounded into: none for either club; the two forceouts (Ohtani&#x27;s fielder&#x27;s choice in the Bottom 3 and Robinson&#x27;s forceout in the Bottom 7) are not GIDPs. Substitutions: Ryan Braun pinch-hit for Yelich in the Top 6 and stayed in left field (0 for 2); Los Angeles made none, its starting nine batting the whole game. Batters faced tie to the batting PA totals both ways: Milwaukee 34 PA against Koufax&#x27;s 34 BF; Los Angeles 41 PA against 41 Milwaukee BF (Higuera 19, Plesac 5, Fingers 6, Williams 4, Jeffress 4, Sanders 3). The printed fielding lines are carried in the official record; no defense object is booked, under Joe&#x27;s 2026-11-05 ruling that defensive tracking begins with Winners Round 2 and Losers Round 1 and is never backfilled for Round 1. Thirteen decisions were graded, all for Pat Murphy (Milwaukee): 5 paid off, 7 backfired, 1 neutral. The Bottom 4 pitching change to Plesac backfired at -4.12 (five runs scored in the rest of the inning) and the Bottom 5 change to Fingers backfired at -2.77; the two leave-in calls on fatigued pitchers paid off at +0.35 each, and the changes to Williams (Bottom 6), Jeffress (Bottom 7), and Sanders (Bottom 8) paid off at +0.73 each as the game quieted down. Tommy Lasorda (Los Angeles) made no graded decisions. Managers: Pat Murphy (Milwaukee) and Tommy Lasorda (Los Angeles). Venue is Dodger Stadium. Game 2 availability, under the house outs convention read off this game only: Koufax threw 27 outs and Higuera 10, so both are UNAVAILABLE for Game 2 (the rotations turn to the number 2 starters anyway); Plesac (2 outs), Fingers (3), Williams (3), Jeffress (3), and Sanders (3) are all free. Eric Gagne and Kenley Jansen, who pitched in the replaced Game 1, did not pitch in this one; Game 2 stands as played, and its official record carries a dated note that its availability provenance referred to the replaced game. Los Angeles leads the series 1-0.">
