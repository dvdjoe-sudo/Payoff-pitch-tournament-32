  <title>L1-05-G3: Los Angeles Angels 3, Colorado Rockies 6</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 5, Game 3 at Coors Field, as the master export&#x27;s box score prints the venue. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. Every source inside the export agrees on every figure booked. Decisions: Aaron Cook takes the win for Colorado (5.0 IP, 22 BF, 5 H, 3 R, 1 ER, 3 BB, 3 SO), Frank Tanana takes the loss for Los Angeles (6.2 IP, 32 BF, 9 H, 6 R, 4 ER, 2 BB, 6 SO), and Huston Street takes the save (1.0 IP, 3 BF, 0 H; he entered the top of the 9th with Colorado ahead 6-3, a three-run lead, exactly a save situation). Scoring: Colorado scored two in the bottom of the 2nd off Tanana (Arenado single, Walker walk, Tulowitzki RBI single, Diaz sacrifice fly), both earned. Los Angeles scored two in the top of the 3rd off Cook, both unearned: Fregosi reached on Diaz&#x27;s error and was caught stealing, then Ohtani singled, Trout walked, and Guerrero doubled both home. Los Angeles scored one in the top of the 5th off Cook (Boone single, Ohtani double, Trout RBI groundout), Cook&#x27;s only earned run. Colorado scored two in the bottom of the 5th off Tanana, both unearned: Galarraga reached on Glaus&#x27;s error and advanced on Boone&#x27;s throwing error on the hit-and-run strikeout play (Blackmon struck out, Galarraga stole second and took third on the throw), LeMahieu singled Galarraga home, Helton walked, and Walker singled LeMahieu home. Colorado scored two in the bottom of the 7th off Tanana, both earned (Blackmon triple, Arenado RBI triple, Walker RBI double); Percival then relieved and finished the game (1.1 IP, 5 BF, 1 H, 1 SO). Errors: Los Angeles 2 (Glaus, on the Galarraga grounder in the bottom of the 5th; Boone, the throwing error on the same inning&#x27;s steal play), Colorado 1 (Diaz, on the Fregosi grounder in the top of the 3rd). Neither club turned a double play. Stolen bases: Galarraga one, against Boone, on the bottom-of-the-5th hit-and-run play. Caught stealing, all against Diaz: Ohtani twice (the top of the 1st, and the top of the 7th on Guerrero&#x27;s hit-and-run strikeout) and Fregosi once (the top of the 3rd). Fielding from the CSV&#x27;s printed fielding section: Los Angeles 24 putouts and 5 assists (Boone 7 putouts; Glaus 1 putout, 2 assists, 1 error); Colorado 27 putouts and 14 assists (Helton 12 putouts; Tulowitzki and Arenado 4 assists each; Diaz 5 putouts, 3 assists, 1 error). No wild pitches and no passed balls for either club. Counting checks: Los Angeles plate appearances 40 (34 AB, 5 BB, 1 sacrifice bunt) equal Colorado&#x27;s 40 batters faced (Cook 22, Betancourt 5, Logan 5, DiPoto 5, Street 3); Colorado plate appearances 37 (33 AB, 2 BB, 1 sacrifice bunt, 1 sacrifice fly) equal Los Angeles&#x27;s 37 batters faced (Tanana 32, Percival 5). Hit, walk and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Bud Black graded 8 decisions (5 paid off, 0 backfired, 3 neutral): pitching changes 4 (Cook to Betancourt in the top of the 6th neutral, +0.23; Logan in the top of the 7th neutral, +0.23; DiPoto in the top of the 8th paid off, +0.73; Street, the closer, in the top of the 9th paid off, +0.73), defensive subs 2 (González at left field in the top of the 7th paid off, +0.48; Hampson at center field in the top of the 8th paid off, +0.48), one hit and run (the bottom of the 5th paid off, +0.89, 2 runs scored the rest of the inning), and one left-pitcher-in (Cook left in, fatigued, in the top of the 5th neutral, +0.07). Mike Scioscia graded 6 decisions (2 paid off, 4 backfired, 0 neutral): steal sends 3 (the top of the 1st backfired, -1.11, Ohtani caught stealing; the top of the 3rd paid off, +0.89, Fregosi caught stealing but 2 runs scored the rest of the inning; the top of the 6th backfired, -0.86, runner held), one sacrifice bunt (Grich in the top of the 6th backfired, -1.19), one hit and run (the top of the 7th backfired, -1.69, Guerrero struck out and Ohtani was caught stealing), and one pitching change (Percival in the bottom of the 7th paid off, +0.57). Game 2&#x27;s availability was honored in this game: Nolan Ryan (24 outs in Game 2, unavailable) did not pitch, and Kyle Freeland (7 outs in Game 2, capped at 3 outs) did not pitch. Availability for Game 4 at Colorado (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; availability reads only the previous game and lasts exactly one game, so the Game 2 restrictions expire with this game): Los Angeles: Tanana (20 outs) is unavailable; Percival (4 outs) is free; every other Los Angeles arm is free, nobody capped. Colorado: Cook (15 outs) is unavailable; Betancourt (3 outs), Logan (3), DiPoto (3) and Street (3) are free; every other Colorado arm is free. Managers: Mike Scioscia (Los Angeles) and Bud Black (Colorado). Venue is Coors Field, as printed.">
