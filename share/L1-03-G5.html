  <title>L1-03-G5: Tampa Bay Rays 10, Philadelphia Athletics 7</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 3, Game 5 at Shibe Park (neutral), as the graded log prints the venue. #17 Philadelphia Athletics (manager Connie Mack) against #30 Tampa Bay Rays (manager Kevin Cash), home pattern Philadelphia for Games 1, 2, 5 and 7, Tampa Bay for Games 3, 4 and 6. Both clubs carry one series loss, so the loser of the series is eliminated and the winner advances to Losers Round 2; Tampa Bay came in trailing three games to one and facing elimination. Booked from the full app export set, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the standalone plays JSON, the Gazette scorecard PDF, the scorecard photo, and the graded play-by-play log for the graded decisions. The CSV&#x27;s PLAYS (JSON) section and the standalone plays JSON carry the same 113 play rows. All sources agree on every figure booked. One presentation note: the scorecard photo&#x27;s R column runs by lineup slot, so runs by substitutes land on the starter&#x27;s row (the photo shows Upton 2, Diaz 2, Longoria 1, Arozarena 1); the CSV is by player and governs, and it is not a discrepancy. Decisions: Pete Fairbanks takes the win (4.0 IP, 14 BF, 2 H, 0 R, 0 BB, 5 SO; he entered in the bottom of the 8th with Philadelphia ahead 7-3, held Philadelphia scoreless through the 8th, 9th, 10th and 11th, and was Tampa Bay&#x27;s pitcher of record when the Rays took the lead in the top of the 11th). Bobby Shantz takes the loss, derived: he entered in the top of the 9th right after Crawford&#x27;s triple tied the game 7-7, finished that inning, threw a scoreless 10th, and in the top of the 11th walked pinch-hitter Mike Zunino and gave up Junior Caminero&#x27;s single; both were his runners and both scored on Carlos Pena&#x27;s three-run home run off Russ Christopher, so the two go-ahead runs are charged to Shantz (2.1 IP, 10 BF, 2 H, 2 R, 2 ER, 1 BB, 2 SO). Christopher is charged only Pena&#x27;s own run (0.2 IP, 4 BF, 2 H, 1 R, 1 ER, 2 SO, 1 HR). No save: Fairbanks is the winning pitcher. Scott Kazmir has no decision (3.1 IP, 19 BF, 6 H, 6 R, 6 ER, 3 BB, 2 SO, 2 HR): he left in the bottom of the 4th trailing 6-1, and Tampa Bay&#x27;s comeback took him off the loss. Jack Coombs has no decision (8.0 IP, 38 BF, 10 H, 7 R, 7 ER, 4 BB, 7 SO, 1 HR, 1 WP): he started the top of the 9th ahead 7-3, and all four tying runs are charged to him, Crawford included, because Crawford reached on Coombs&#x27;s triple before Shantz relieved. Scoring: Tampa Bay struck first in the top of the 1st, Upton doubling and scoring on Pena&#x27;s two-out single off Coombs. Philadelphia answered with three in the bottom of the 2nd off Kazmir (Johnson double, Baker two-run home run, Moses double, Joost RBI single), two in the 3rd (Cochrane walk, Simmons two-run home run) and one in the 4th (Joost walk, Valo sacrifice bunt, Collins RBI double) for a 6-1 lead. Hall&#x27;s solo home run off Coombs in the 5th and Lowe&#x27;s RBI single in the 6th (after Pena&#x27;s double) cut it to 6-3, and Baker&#x27;s sacrifice fly off Hernandez in the 7th (Cochrane and Simmons singles, Foxx walk) made it 7-3. Tampa Bay tied it with four in the top of the 9th off Coombs: Huff double, Hall RBI single, Kiermaier walk, Crawford two-run triple, and, after Shantz relieved, pinch-hitter Caminero&#x27;s RBI single scoring Crawford. The 10th was scoreless. In the top of the 11th, pinch-hitter Zunino walked and Caminero singled off Shantz, Christopher relieved, and Pena hit a three-run home run (Zunino, Caminero and Pena scoring) for 10-7. Fairbanks closed it in the bottom of the 11th: Valo singled, Collins flied out, Cochrane sacrificed Valo to second, and Simmons struck out. Each club&#x27;s RBI total equals its run total (TB 10, PHA 7). The game was errorless, and neither club turned a double play or stole a base; there were no GIDP. Special play, booked as printed: in the bottom of the 4th, Al Simmons struck out but reached on the play the log text calls a passed ball (the CSV play text reads &quot;passed ball; strikes out but reaches on the wild pitch&quot;); the CSV&#x27;s pitching section charges Diego Castillo with a wild pitch (WP 1) for the game and its fielding section charges Toby Hall with a passed ball (PB 1), while Philadelphia&#x27;s fielding section charges Mickey Cochrane with a passed ball (PB 1) as well, with no separate log line naming Cochrane&#x27;s. The printed numbers are booked as printed: Castillo WP 1 and Coombs WP 1 in the pitching lines, and the defense object carries WP Castillo 1 (TB) and Coombs 1 (PHA), PB Hall 1 (TB) and Cochrane 1 (PHA). Fielding from the CSV&#x27;s printed fielding section: Tampa Bay 33 putouts and 8 assists; Philadelphia 33 putouts and 11 assists. Counting checks: Tampa Bay plate appearances 52 equal Philadelphia&#x27;s 52 batters faced (Coombs 38, Shantz 10, Christopher 4); Philadelphia plate appearances 48 (41 AB, 4 BB, 2 SH, 1 SF) equal Tampa Bay&#x27;s 48 batters faced (Kazmir 19, Castillo 6, Howell 3, Hernandez 6, Fairbanks 14). Hit, walk and strikeout totals tie across the two boxes both ways. Manager grades: Kevin Cash graded 12 decisions (5 paid off, 3 backfired, 4 neutral): pitching changes 4 (Castillo in the bottom of the 4th paid off, +0.91; Howell in the bottom of the 6th paid off, +0.73; Hernandez in the bottom of the 7th backfired, -0.77; Fairbanks in the bottom of the 8th paid off, +0.73), pinch hitters 6 (Huff in the top of the 5th neutral, +0.27; Kiermaier in the top of the 5th backfired, -0.50; Crawford in the top of the 5th backfired, -0.35; Wendle in the top of the 6th neutral, +0.27; Caminero in the top of the 9th neutral, -0.10; Zunino in the top of the 11th paid off, +3.00), and leaving Fairbanks in twice (for the bottom of the 10th paid off, +0.73; for the bottom of the 11th neutral, +0.23). Connie Mack graded 5 decisions (0 paid off, 4 backfired, 1 neutral): hit and runs 2, both backfired (bottom of the 3rd, -0.76; bottom of the 11th, -1.11); leaving Coombs in for the top of the 9th backfired (-2.39, three runs scored the rest of the inning after the decision point); the top-of-the-9th pitching change to Shantz was neutral (+0.10); and the top-of-the-11th pitching change to Christopher backfired (-2.12, Pena&#x27;s home run). Availability compliance for this game, checked against Game 4 usage under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Game 4 made Chief Bender (16 outs) and Shane McClanahan (12 outs) unavailable for Game 5, and neither pitched (Coombs and Kazmir started). Joe Berry (8 outs) and David Price (6 outs) were capped at 3 outs; neither appeared, so no cap was tested. Castillo, Howell and Hernandez (3 outs each in Game 4) were free and pitched legally; Walberg (3 outs) was free and did not appear. Availability for Game 6 at Tampa Bay, from Game 5 outs: Jack Coombs (24 outs), Pete Fairbanks (12 outs) and Scott Kazmir (10 outs) are unavailable; Bobby Shantz (7 outs) is capped at 3 outs; Diego Castillo (5 outs), Russ Christopher (2 outs), J.P. Howell (3 outs) and Roberto Hernandez (3 outs) are free, as is every arm that did not pitch in Game 5. Managers: Connie Mack (Philadelphia) and Kevin Cash (Tampa Bay). Venue is Shibe Park (neutral), as printed.">
