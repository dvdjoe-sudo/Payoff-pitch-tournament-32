load the bases. Jackson struck out, and Belle walked on a full count, forcing Speaker home to tie the game 2-2. Belle carries the RBI (RBI 1, his printed line), not a play by anyone else; Jose Ramirez then popped out with the bases still loaded. The fourth settlement is the Cleveland Top 9 run and the last Cleveland RBI. Boudreau singled past the right fielder and Martinez singled in front of the left fielder, putting runners at first and second. Speaker then forced Martinez at second (fielder&#x27;s choice to shortstop), Boudreau taking third and Speaker reaching first, and Lajoie&#x27;s double into left center scored Boudreau. Lajoie carries the RBI (RBI 1); Martinez, who was forced out on the play, carries RBI 0, exactly as the printed lines read. Cleveland printed RBI ties clean at 3 for 3: Thome 1, Belle 1, Lajoie 1. The fifth settlement is Cade Smith&#x27;s Bottom 8. Smith entered to open the inning and faced five batters: he struck out Boone, his only out (SO 1), then gave up singles to Ohtani, Trout, and Salmon and Glaus&#x27;s three-run homer, all four Bottom 8 runs charged to him, before Jones relieved and struck out Joyner. Smith is booked at BF 5 (0.1 IP, 4 H, 4 R, 4 ER, 1 SO, 1 HR), and Jones at BF 3 with SO 1 (0.2 IP, 1 H, 0 R): Joyner&#x27;s strikeout belongs to Jones, not Smith. Weaver carries a wild pitch, WP 1, from the Gazette extras line (the play log does not annotate which play). The decisions are not printed; they are derived from the play log and the run charges on the card. Darren Oliver takes the win (1.0 IP, 2 H, 1 ER, 2 BB, 1 SO): Cleveland tied the game on his watch in the Top 8, and he was the pitcher of record when Los Angeles scored four in the Bottom 8 to win it. Cade Smith takes the loss (0.1 IP, 4 H, 4 ER, 1 SO, 1 HR): all four Bottom 8 runs are his, including Trout&#x27;s go-ahead run. No save is credited: Rodriguez pitched the Top 9 with a four-run lead (6-2) and the final margin was three (6-3). The starters take no decisions: Corey Kluber (5.1 IP, 4 H, 2 ER, 0 BB, 7 SO, 1 HR) left in the Bottom 6 trailing 2-1 after Trout&#x27;s double, but Cleveland&#x27;s Top 8 tie erased his loss; Jered Weaver (6.0 IP, 1 H, 1 ER, 4 BB, 5 SO) left after six leading 2-1, but the same tie erased his win. Run charges match the printed lines exactly: Cleveland pitching allows 2 + 0 + 0 + 4 + 0 = 6 (Kluber the two Bottom 3 runs, Smith the four Bottom 8 runs; Wynn, Miller, and Jones none), and Los Angeles pitching allows 1 + 0 + 1 + 1 = 3 (Weaver the Top 1 run, Oliver the Top 8 run, Rodriguez the Top 9 run; Shields none). The duplicate test ran before the number was assigned: the stored games in the series are Game 1, a 3-2 Cleveland win (Los Angeles 2 0 0 0 0 0 0 0 0, Cleveland 0 0 0 3 0 0 0 0 x), Game 2, a 2-1 Cleveland win (Los Angeles 0 0 0 0 1 0 0 0 0, Cleveland 0 0 0 0 0 1 0 0 1), and Game 3, a 9-8 Los Angeles win (Cleveland 1 4 1 1 0 0 0 1 0, Los Angeles 2 0 0 2 0 0 0 0 5), and this box score, a 6-3 Los Angeles win on its own linescore with different batting and pitching lines throughout, is no duplicate; it is the fourth game of the series in play order, booked as Game 4. The game: Cleveland scored in the Top 1 on the settled sequence above, Speaker&#x27;s walk, stolen base, Boone&#x27;s error, and Thome&#x27;s groundout, 1-0, and Weaver allowed nothing else, one hit over six innings. Los Angeles took the lead in the Bottom 3: Fregosi doubled to left and, after Boone struck out, Ohtani hit a two-run homer off Kluber, 2-1. Kluber held it there into the Bottom 6, when Trout doubled with one out; Francona went to Wynn, who walked Guerrero, then to Miller, who struck out Glaus and retired Joyner to strand both. Shields worked a clean Top 7 for Los Angeles, Salmon entering in right field for defense in the same frame. Cleveland tied it in the Top 8 on the settled sequence above, Belle&#x27;s bases-loaded walk off Oliver, 2-2, leaving the bases loaded. Los Angeles won it in the Bottom 8 off Smith: Boone struck out, Ohtani singled and stole second, Trout singled him home for the lead, 3-2, Salmon singled Trout to third, and Glaus hit a three-run homer, 6-2; Jones finished the inning. Cleveland got one back in the Top 9 off Rodriguez on the settled sequence above, Boudreau scoring on Lajoie&#x27;s double, 6-3, and stranded the last two runners. Cleveland stranded 10 and Los Angeles 4. Home runs: two, Ohtani&#x27;s two-run homer in the Bottom 3 and Glaus&#x27;s three-run homer in the Bottom 8, both for Los Angeles. Doubles: three, Fregosi and Trout for Los Angeles and Lajoie for Cleveland. Triples: none. Errors: one, Boone&#x27;s throwing error on Speaker&#x27;s steal in the Top 1; Cleveland played errorless ball and Los Angeles&#x27;s printed error total is 1. Hit batters: none; HB is carried as 0 for all nine pitchers (Kluber, Wynn, Miller, Smith, Jones, Weaver, Shields, Oliver, and Rodriguez) as card-sourced values, and the hit batter check runs on real data. Wild pitches: one, Weaver, per the Gazette extras. Passed balls: none. Sacrifices: none, so the split lines read SH 0 and SF 0 for every batter, log-proven (no bunt and no sacrifice fly was hit). Stolen bases: three, Speaker in the Top 1 and Jose Ramirez in the Top 2 (he reached second during Boudreau&#x27;s hit-and-run strikeout) for Cleveland, and Ohtani in the Bottom 8 for Los Angeles. Caught stealing: none. Double plays grounded into: none for either club, counted from the play log (Speaker&#x27;s Top 9 forceout was a fielder&#x27;s choice with one out recorded, not a double play). Substitutions: one. Tim Salmon replaced Guerrero in right field for the Top 7 as a defensive substitute and carries the printed line AB 1, R 1, H 1 (the Bottom 8 single and run). No other substitution was made by either club. Batters faced are counted from the play log and tie to the batting PA totals both ways (Cleveland 40 PA against 40 Los Angeles BF: Weaver 23, Shields 4, Oliver 7, Rodriguez 6; Los Angeles 34 PA against 34 Cleveland BF: Kluber 20, Wynn 1, Miller 5, Smith 5, Jones 3). Cleveland PA is AB 33 plus BB 7; Los Angeles PA is AB 33 plus BB 1. Strikeouts tie both ways: Cleveland batting 9 against Los Angeles pitching 9, Los Angeles batting 11 against Cleveland pitching 11. Sixteen decisions were graded. Terry Francona made 8 (4 paid off, 2 backfired, 2 neutral): the Bottom 8 change to Smith backfired at -3.27, the game&#x27;s worst grade, four runs coming home behind him; the Bottom 6 changes paid off, Wynn at +0.41 and Miller at +1.13, stranding Trout at second; the Bottom 8 change to Jones paid off at +0.50, ending the inning; his two steal sends in the Top 1 went neutral at +0.14 (Speaker held) and paid off at +0.74 (Speaker safe to second, then third on the error); the Top 2 hit and run backfired at -0.76, Boudreau striking out; and the Top 8 hit and run was neutral at -0.11, Lajoie&#x27;s groundout still advancing Speaker in the tying rally. Mike Scioscia made 8 (4 paid off, 4 backfired, 0 neutral): the Bottom 8 steal send with Ohtani paid off at +3.74, the game&#x27;s best grade, Ohtani taking second ahead of Trout&#x27;s go-ahead single; the Bottom 8 steal send with Trout paid off at +2.49, Trout held at first before Salmon&#x27;s single and the Glaus homer; the Top 7 change to Shields paid off at +0.73 and the Salmon defensive sub at +0.48; the Top 8 change to Oliver backfired at -0.77, the tying run scoring on his watch though he still took the win, and the Top 9 change to Rodriguez backfired at -0.77, Cleveland&#x27;s last run scoring; and both Bottom 4 steal sends backfired, Guerrero held at -0.86 and Glaus held at -0.51. Managers: Terry Francona (Cleveland) and Mike Scioscia (Los Angeles). Venue is Angel Stadium of Anaheim. Availability compliance: Tanana (7 outs in Game 3, capped at 3 outs) and Langston (6 outs in Game 3, capped at 3 outs) were correctly unused; Miller (0 outs in Game 3) was free and pitched; each club started its rotation number 4, Kluber for Cleveland and Weaver for Los Angeles. Game 5 availability: Kluber (16 outs in Game 4) and Weaver (18 outs in Game 4) are UNAVAILABLE under the house convention, and the rotations turn to the number 5 starters in any case; Miller (5 outs), Smith (1 out), Jones (2 outs), Wynn (0 outs, one batter faced), Shields, Oliver, and Rodriguez (3 outs each) are free. The series is tied 2-2. The series returns to Cleveland for Game 5.">
