  <title>L1-05-G1: Colorado Rockies 4, Los Angeles Angels 9</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 5, Game 1 at Angel Stadium of Anaheim, as the graded log prints the venue. This booking OPENS the series: the L1-05 slot (Losers Round 1, reseeded losers pool) was formed with this game, #20 Los Angeles Angels (manager Mike Scioscia) against #28 Colorado Rockies (manager Bud Black), home pattern Los Angeles for Games 1, 2, 5 and 7, Colorado for Games 3, 4 and 6; the formation block stays as the shell carries it (rule reseed-high-vs-low, pool &quot;Losers of the 16 opening-round series&quot;, gate &quot;Round 1 is complete (all 16 opening series)&quot;), with the feeder labels as in the formed L1 entries. Both clubs carry one series loss into this series, so the loser of the series is eliminated and the winner advances to Losers Round 2. Booked from the full app export set, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the standalone plays JSON, the Gazette scorecard PDF, the scorecard photo, and the graded play-by-play log. All sources agree on every figure booked. Decisions: Chuck Finley takes the win for Los Angeles (5.1 IP, 24 BF, 6 H, 4 R, 2 ER, 1 BB, 2 SO, 1 WP) and Ubaldo Jimenez takes the loss for Colorado (3.2 IP, 19 BF, 6 H, 5 R, 5 ER, 4 BB, 3 SO). No save: Francisco Rodríguez pitched the top of the 9th with Los Angeles ahead 9-4 (1.0 IP, 4 BF, 1 H, 1 BB, 1 SO). Scoring: Los Angeles scored one in the bottom of the 1st (Ohtani walk, Trout forceout, Guerrero&#x27;s hit-and-run single scoring Trout from first; Guerrero was then caught stealing). Colorado tied it in the top of the 4th on a run with no RBI (Helton double, Arenado single plus Trout&#x27;s error in center field; the run is unearned on Finley). Los Angeles scored five in the bottom of the 4th: the first four charged to Jimenez (Anderson single, Grich sacrifice bunt, Fregosi RBI single, Boone single, Ohtani two-run single) and the fifth to Brian Fuentes, who relieved with two out and gave up Trout&#x27;s two-run home run; Ohtani&#x27;s run charges to Jimenez as his fifth run, and Trout&#x27;s own run charges to Fuentes. Colorado scored two earned runs in the top of the 5th off Finley (Holliday double, Diaz RBI double, LeMahieu RBI single) and one unearned run in the top of the 6th (Arenado reached on Grich&#x27;s two-base error at second base, Tulowitzki RBI double off Finley). Los Angeles scored two in the bottom of the 7th off Boone Logan, who faced two batters and recorded no outs (Trout walk, Salmon two-run home run; Salmon had entered as the defensive replacement in right field for Guerrero in the top of the 7th), and one in the bottom of the 8th off Matt Belisle (Fregosi single, Trout RBI double). Finley&#x27;s earned-run accounting is as printed: of Colorado&#x27;s four runs, the two in the top of the 5th are earned and the top-of-the-4th and top-of-the-6th runs are unearned. Errors: Los Angeles 3 (Trout E8 in the top of the 4th; Grich E4 in the top of the 6th; Glaus E5 in the top of the 7th, LeMahieu reaching); Colorado errorless. No batter grounded into a double play and no club is credited with a double play; two hit-and-run plays ended as strikeout-and-caught-stealing double plays (Boone struck out with Grich thrown out in the bottom of the 2nd; LeMahieu struck out with Blackmon thrown out in the top of the 9th), which with Guerrero (bottom of the 1st) and Glaus (bottom of the 5th) gives Diaz three caught stealings against and Boone one. Fielding from the CSV&#x27;s printed fielding section: Colorado 24 putouts and 13 assists; Los Angeles 27 putouts and 11 assists; no passed balls. Wild pitches: Los Angeles&#x27;s Finley one and Harvey one; none for Colorado. Counting checks: Colorado plate appearances 40 (37 AB, 3 BB) equal Los Angeles&#x27;s 40 batters faced (Finley 24, Percival 8, Harvey 4, Rodríguez 4); Los Angeles plate appearances 39 (31 AB, 7 BB, 1 sacrifice bunt) equal Colorado&#x27;s 39 batters faced (Jimenez 19, Fuentes 6, Betancourt 3, Logan 2, DiPoto 4, Belisle 5). Hit, walk and strikeout totals tie across the two boxes both ways. Manager grades: Mike Scioscia graded 11 decisions (4 paid off, 3 backfired, 4 neutral): steal sends 5 (the bottom-of-the-1st send with Ohtani aboard neutral, +0.14, runner held; the bottom-of-the-1st send with Guerrero aboard backfired, -0.76, Guerrero caught stealing; the bottom-of-the-5th send backfired, -1.11, Glaus caught stealing; the bottom-of-the-7th send paid off, +1.14, runner held and two runs scored in the inning; the bottom-of-the-8th send with Fregosi aboard neutral, +0.14, runner held), hit and runs 2 (the bottom-of-the-1st call paid off, +0.74, Guerrero&#x27;s single scored Trout from first; the bottom-of-the-2nd call backfired, -1.13, Boone struck out and Grich was thrown out), pitching changes 3 (Percival in the top of the 6th paid off, +0.41; Harvey in the top of the 8th paid off, +0.73; Rodríguez in the top of the 9th neutral, +0.23), and one defensive sub (Salmon into right field in the top of the 7th neutral, +0.23, an error behind him and no runs). Bud Black graded 7 decisions (2 paid off, 5 backfired, 0 neutral): pitching changes 5 (Fuentes in the bottom of the 4th backfired, -2.03, Trout homered on the next plate appearance; Betancourt in the bottom of the 6th paid off, +0.73; Logan in the bottom of the 7th backfired, -1.77; DiPoto in the bottom of the 7th paid off, +0.73; Belisle in the bottom of the 8th backfired, -0.77), one steal send (the top of the 8th with Holliday aboard backfired, -0.51, runner held), and one hit and run (the top of the 9th backfired, -1.11, LeMahieu struck out and Blackmon was thrown out). Availability for Game 2 at Los Angeles, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game; a new series resets availability, so nothing carried over from Round 1): Colorado: Jimenez (11 outs) is unavailable; every other Colorado arm is free, nobody capped. Los Angeles: Finley (16 outs) is unavailable; every other Los Angeles arm is free, nobody capped. Managers: Mike Scioscia (Los Angeles) and Bud Black (Colorado). Venue is Angel Stadium of Anaheim, as printed.">
