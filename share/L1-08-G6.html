  <title>L1-08-G6: Texas Rangers 4, Toronto Blue Jays 8</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 8, Game 6 at Rogers Centre, as the master export&#x27;s box score prints the venue. Toronto wins the series 4-2 and advances to Losers Round 2; Texas is eliminated. Toronto won Game 1 (9-3) and Game 2 (9-8 in 10 innings), Texas won Game 3 (10-9 in 14 innings) and Game 5 (12-7), and Toronto won Game 4 (7-6). Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. A series master export Joe sent for the whole Rangers-Blue Jays series carries this same game as its Game 6 record, and the two exports agree in every field checked (linescore, batting, pitching and fielding lines, decisions, graded decisions, and all 81 play rows identical); the series export&#x27;s printed team totals also match this book&#x27;s six games exactly. Decisions: Dave Stieb takes the win for Toronto (7.0 IP, 28 BF, 4 H, 4 R, 4 ER, 2 BB, 1 HBP, 5 SO, 1 HR), seven innings of four-run ball in the clincher; he also won Game 1, beating Ryan in both. Nolan Ryan takes the loss for Texas (2.0 IP, 15 BF, 7 H, 6 R, 6 ER, 2 BB, 3 SO, 2 HR, 1 WP): Toronto scored in each of the first three innings off him and he was gone after George Bell&#x27;s leadoff home run in the 3rd, the last batter he faced. There is no save: Tom Henke pitched the 9th (1.0 IP, 4 BF, 1 H, 1 SO) with a four-run lead. Duane Ward takes a hold in the Rec&#x27;s extra line (1.0 IP, 3 BF, 2 SO): a scoreless 8th with a two-run lead, before Toronto&#x27;s insurance runs. Scoring: Texas scored first in the top of the 1st: Kinsler and Ivan Rodriguez singled, Howard was hit by a pitch to load the bases, and Hamilton&#x27;s groundout to third scored Kinsler. Toronto answered in the bottom of the 1st: Fernandez doubled and Donaldson&#x27;s two-run home run, the decisive play the export&#x27;s report names, made it 2-1. Toronto added three in the 2nd off Ryan: Barfield singled, White&#x27;s double scored him, Whitt walked, Alomar&#x27;s single scored White, and Delgado&#x27;s two-out single scored Whitt. Bell&#x27;s leadoff home run in the 3rd made it 6-1 and finished Ryan; Kern, Feliz and Wetteland each threw a scoreless inning and Zimmerman added scoreless 6th and 7th innings. Texas&#x27;s only answer came in the top of the 6th off Stieb: Ivan Rodriguez tripled, Alex Rodriguez walked, and Howard&#x27;s three-run home run cut it to 6-4. Toronto&#x27;s two insurance runs came in the bottom of the 8th off Zimmerman: Bell singled, Barfield and White walked to load the bases, Whitt&#x27;s sacrifice fly scored Bell, Alomar walked to reload the bases, and Fernandez&#x27;s bases-loaded walk scored Barfield. The export&#x27;s player of the game is Frank Howard of the losing club: 1 for 3 with the three-run home run, 3 RBIs, a run and a hit by pitch, booked as printed. Key lines: for Toronto, Bell went 2 for 4 with a home run and 2 runs, Donaldson homered with 2 RBIs, and Barfield scored twice; for Texas, Ivan Rodriguez went 2 for 4 with a triple. The game was ERRORLESS: no error rows in the play log, no errors in either fielding line, and both staffs&#x27; earned-run totals equal the runs (Texas&#x27;s staff 8 ER against Toronto&#x27;s 8 runs, Toronto&#x27;s staff 4 ER against Texas&#x27;s 4 runs). Every run on both sides carries an RBI (Texas 4 runs on 4 RBIs, Toronto 8 on 8). Double plays: none, in the play rows or the print, so no GIDP difference arises in this game. Stolen bases: none, and nobody was caught stealing. Wild pitches: one, Ryan&#x27;s, in the bottom of the 1st during Bell&#x27;s strikeout, moving Delgado to second; it scored nobody. Passed balls: none. The defense object books putouts, assists and errors exactly as the printed fielding section carries them. Fielding from the CSV&#x27;s printed fielding section: Texas 24 putouts and 4 assists (Ivan Rodriguez 11 putouts, Palmeiro 5 putouts, Hamilton 5 putouts, Alex Rodriguez and Beltre 2 assists each), errorless; Toronto 27 putouts and 9 assists (Delgado 10 putouts, Whitt 8 putouts, Alomar 4 assists and the game&#x27;s one range-out credit on Seager in the top of the 2nd, Donaldson 3 assists), errorless. Substitutes: none batted for either club; the only changes were on the mound. Counting checks: Texas plate appearances 35 (32 AB, 2 BB, 1 HBP) equal Toronto&#x27;s 35 batters faced (Stieb 28, Ward 3, Henke 4); Toronto plate appearances 39 (32 AB, 6 BB, 1 SF) equal Texas&#x27;s 39 batters faced (Ryan 15, Kern 3, Feliz 3, Wetteland 4, Zimmerman 14). Hit, walk, hit-by-pitch, home run and strikeout totals tie across the two boxes both ways. Manager grades: this game&#x27;s export labels its decision-makers TEX CPU and TOR CPU in the decisions summary, the graded log and the grades list (both clubs were CPU-managed in the app for this game), where Games 1-5 of this series named the managers; the counts are booked exactly as printed, and final_grades keys them under the series managers&#x27; names, Ron Washington and Cito Gaston, so the series totals aggregate under the names this series carries. Ron Washington graded 5 decisions (4 paid off, 1 backfired, 0 neutral): all four pitching changes paid off (Kern in the bottom of the 3rd, Feliz in the 4th, Wetteland in the 5th and Zimmerman in the 6th, +0.73 each), and leaving the fatigued Zimmerman in for the bottom of the 8th backfired (-1.27) ahead of Toronto&#x27;s two insurance runs. Cito Gaston graded 3 decisions (2 paid off, 1 backfired, 0 neutral): both pitching changes paid off (Ward in the top of the 8th and Henke in the top of the 9th, +0.73 each), and the hit and run in the bottom of the 2nd backfired (-0.69, Fernandez popped out to first). Series graded totals: Washington 49 decisions (23 paid off, 18 backfired, 8 neutral); Gaston 30 (17 paid off, 9 backfired, 4 neutral). Availability compliance: Charlie Hough (18 outs in Game 5), Kevin Gausman (9 outs) and Paul Quantrill (12 outs) were unavailable under the availability convention and none pitched; Jeff Russell (6 outs in Game 5) was capped at 3 outs and did not pitch, the cap honored unused; none of the four appears anywhere in this game&#x27;s play rows. Stieb&#x27;s start is legal: his 21 outs in Game 1 made him unavailable for Game 2 only. Series final: Toronto wins 4-2. Series runs: Toronto 49, Texas 43. Toronto advances to Losers Round 2 as the eighth and final advancer; Texas is eliminated with its second series loss. The series export&#x27;s header names Josh Donaldson its series MVP (12 for 30, 3 HR, 11 RBI, 8 R); no series MVP is booked with this game: Joe rules the MVP separately. Managers: Ron Washington (Texas) and Cito Gaston (Toronto). Venue is Rogers Centre, as printed.">
