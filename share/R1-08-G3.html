  <title>R1-08-G3: Pittsburgh Pirates 7, Toronto Blue Jays 3</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-10-30: a photo of the paper scorecard grid, the app scorecard PDF, and the full graded play-by-play text; official R1-08 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number subject to one scoring settlement, documented below. The decisions are not printed; they are derived from the play log (Babe Adams pitched a complete game, the only Pittsburgh pitcher, and takes the win; Jimmy Key was charged with all 7 Pittsburgh runs and took the loss; Roberto Osuna, Duane Ward, and Tom Henke each threw one scoreless inning of relief; there is no save in a complete game win). Pittsburgh struck first: Roberto Clemente and Barry Bonds hit back-to-back home runs in the Top 1 for 2-0. Toronto answered in the Bottom 1: Tony Fernandez doubled, Carlos Delgado walked, and Fred McGriff doubled both in for 2-2. Clemente doubled in the Top 4, Willie Stargell walked, and Ralph Kiner&#x27;s sacrifice fly made it 3-2. Toronto tied it again in the Bottom 4: McGriff doubled a second time and Jesse Barfield singled him in, 3-3. Tommy Leach tripled to open the Top 5 and Honus Wagner&#x27;s groundout scored him for 4-3. The Top 6 settled the game: Clemente walked, Bonds singled him to 3rd, Stargell flew out, Clemente scored (on Key&#x27;s wild pitch; see the settlement below), Kiner flew out to right, and Manny Sanguillen hit a 2-run home run for 7-3. Adams allowed nothing after the 4th; over the last five innings his only baserunners were Delgado&#x27;s double in the 6th, Delgado&#x27;s walk in the 8th, and Barfield&#x27;s double in the 9th. The scoring settlement: Pittsburgh&#x27;s printed RBI total is 6 against 7 runs. Kiner&#x27;s line is 3 at-bats, 1 RBI, and one sacrifice fly, the Top 4 fly that scored Clemente, narrated as a sacrifice fly in the play log. In the Top 6 the play log attaches the score change (PIT 5) to Kiner&#x27;s flyout line, but the scorecard counts that at-bat as a plain flyout (an at-bat, no sacrifice fly, no RBI) and charges Key with a wild pitch (WP 1, printed on the card). The only reading consistent with the card is that Clemente scored his Top 6 run on Key&#x27;s wild pitch during Sanguillen&#x27;s at-bat, before the 2-run homer; the play log does not narrate the wild pitch, the same way it does not narrate this game&#x27;s two card-only caught stealings. The card governs: Kiner is booked exactly as printed (3 at-bats, sacrifice fly 1, RBI 1), the wild pitch stands charged to Key in this record (a wild pitch is not a stored archive field), no RBI is given for the wild pitch run, and Pittsburgh&#x27;s team RBI total stands at 6. No hit batters: the scorecard grid&#x27;s pitching tables, in both the PDF and the paper scorecard photo, print HBP 0 for all five pitchers, so HB 0 for all 5 pitchers and HBP 0 for all batters are card-sourced values carried in the tables below, and the homer, hit batter, and derived plate appearance checks run on real data. The caught stealings are card-only: the scorecard charges Roberto Alomar (Bottom 3, after his walk) and Tony Fernandez (Bottom 5, after his walk) with one each; the play log shows each runner gone by the end of the next at-bat without narrating the play, and the tables carry the card as printed. The game&#x27;s only sacrifice is Kiner&#x27;s Top 4 sacrifice fly; there were no sacrifice bunts. Neither club made an error. Substitutions: Pittsburgh only. Arky Vaughan pinch-hit for Wagner in the Top 7 and stayed in, and Paul Waner pinch-hit for Clemente in the Top 8 and stayed in. Toronto made no batting substitutions. Availability held from Game 2: Roy Halladay (unavailable, 18 outs in Game 2) and Wilbur Cooper (unavailable, 22 outs in Game 2) both stayed out, correct. Managers: Danny Murtaugh (Pittsburgh) and Cito Gaston (Toronto). Venue is Rogers Centre.">
