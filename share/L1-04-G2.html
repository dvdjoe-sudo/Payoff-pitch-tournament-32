  <title>L1-04-G2: Arizona Diamondbacks 4, Seattle Mariners 5</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 4, Game 2 at T-Mobile Park, as the graded log prints the venue. Booked from the full app export set, played by Joe in the app: the box score CSV (with its fielding section and PLAYS (JSON) section), the standalone plays JSON, the Gazette scorecard PDF, the scorecard photo, and the graded play-by-play log. All sources agree on every figure booked. Decisions: Félix Hernández takes the win for Seattle (6.0 IP, 23 BF, 5 H, 1 R, 1 ER, 1 BB, 1 HBP, 4 SO); he left after six innings with Seattle ahead 4-1, a lead Seattle never lost. Curt Schilling takes the loss for Arizona (7.0 IP, 27 BF, 9 H, 5 R, 5 ER, 0 BB, 8 SO, 5 HR): all five Seattle runs scored on solo home runs off him. Edwin Díaz takes the save, derived from the play log and the run charges under the standard rule: he entered the top of the 9th with a 5-4 lead, pitched exactly one scoreless inning and finished the game (a lead of three or fewer, at least one inning pitched, and not the winning pitcher), and the log&#x27;s own narration calls him the closer brought in for the ninth. Scoring: Seattle&#x27;s five runs were five solo home runs off Schilling: Griffey in the bottom of the 1st (after Ichiro singled and was caught stealing), Buhner in the bottom of the 2nd, Rodriguez in the bottom of the 3rd (after Ichiro singled and was caught stealing again), Rodriguez again in the bottom of the 6th for his second of the game, and Raleigh in the bottom of the 7th. Arizona scored one in the top of the 5th off Hernández (Williams single, Perdomo single, Carroll RBI single), two in the top of the 7th off Muñoz (Rhodes opened the inning by striking out Finley; then Williams single, Moreno strikeout, Perdomo walk, Carroll RBI single and Goldschmidt RBI single; Nelson came in and got the last out), and one in the top of the 8th off Nelson (Walker solo home run). Each club&#x27;s RBI total equals its run total (Arizona 4, Seattle 5). The game was errorless. Seattle turned two double plays (both 6-4-3: Marte in the top of the 1st, Walker in the top of the 2nd) and Arizona one (Buhner in the bottom of the 6th). Ichiro was caught stealing twice by Moreno, in the bottom of the 1st and the bottom of the 3rd; Boone&#x27;s steal of second in the bottom of the 5th was the game&#x27;s only successful steal (Moreno&#x27;s printed line: 3 stolen-base attempts against, 1 stolen base, 2 caught stealing). Fielding from the CSV&#x27;s printed fielding section: Arizona 24 putouts and 8 assists; Seattle 27 putouts and 8 assists; no wild pitches and no passed balls. Alvin Davis, Piniella&#x27;s defensive replacement at first base for Olerud to open the top of the 8th, carries a defense line only (3 putouts, no plate appearance), exactly as printed. Counting checks: Arizona plate appearances 38 (35 AB, 2 BB, 1 HBP) equal Seattle&#x27;s 38 batters faced (Hernández 23, Rhodes 1, Muñoz 5, Nelson 5, Díaz 4); Seattle plate appearances 32 (31 AB, 1 BB) equal Arizona&#x27;s 32 batters faced (Schilling 27, Valverde 5). Hit, walk and strikeout totals tie across the two boxes both ways. Manager grades: Lou Piniella graded 11 decisions (2 paid off, 5 backfired, 4 neutral): steal sends 6 (the bottom-of-the-1st hold neutral, +0.14; Ichiro caught stealing in the 1st neutral, +0.24; Ichiro caught stealing again in the 3rd neutral, +0.24; Boone&#x27;s successful steal in the 5th neutral, -0.26; two holds in the 6th backfired, -0.86 and -0.51), pitching changes 4 (Rhodes in the top of the 7th backfired, -1.27; Muñoz in the top of the 7th backfired, -2.00, the worst grade of the game; Nelson in the top of the 7th paid off, +0.73; Díaz in the top of the 9th paid off, +0.73), and one defensive substitution (Davis at first base in the top of the 8th backfired, -0.52). Bob Brenly graded 3 decisions (1 paid off, 1 backfired, 1 neutral): leaving Schilling in twice (bottom of the 6th neutral, +0.23; bottom of the 7th backfired, -0.77, when Raleigh homered for the fifth Seattle solo shot) and one pitching change (Valverde in the bottom of the 8th paid off, +0.73). Availability audit for this game, under the availability convention (9 or more outs unavailable; 6 to 8 outs capped at 3 outs; under 6 outs free; a cap lasts exactly one game and reads only the previous game): Seattle&#x27;s Randy Johnson (21 outs in Game 1) was unavailable and did not pitch; Arizona&#x27;s Brandon Webb (6 outs in Game 1) was capped at 3 outs and did not appear. Both clubs stayed legal. Availability for Game 3 at Arizona: Schilling (21 outs) and Hernández (18 outs) are unavailable; Valverde (3 outs), Rhodes (1), Muñoz (1), Nelson (4) and Díaz (3) are all free; nobody is capped on either side. Managers: Lou Piniella (Seattle) and Bob Brenly (Arizona). Venue is T-Mobile Park, as printed.">
