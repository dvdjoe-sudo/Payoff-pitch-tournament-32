  <title>R1-01-G3: New York Yankees 7, Miami Marlins 1</title>
  <meta name="description" content="Played by Joe in the playable app and sent to the co-managed tournament games chat on 2026-11-08 as four files: the full graded play by play, the scorecard CSV export, the app scorecard PDF (the Payoff Pitch Gazette, Final Edition, Sunday, November 8, 2026), and the scorecard photo. Joe ruled in chat the same day: &quot;Replace game 3 with this,&quot; adopting this playing as the new R1-01 Game 3 under the R1-05, R1-06, and R1-10 Game 1 adoption precedents and the R1-01 Game 1 and Game 2 adoptions made earlier that evening; the replaced game (New York 22, Miami 5; W Lefty Gomez, L Dontrelle Willis, no save; seed 1103) is preserved untouched in the Yankees records at archive/replaced/, with its dispute history carried in its README there. The replaced game was the disputed game of the series: its rolls stream gives Jeter two consecutive plate appearances in the Top 6 and leaves Rodriguez, who had doubled, with no legal exit, so its rolls-deduced conversion failed (candidate set 58, satisfying assignments 0); Joe&#x27;s override directive of that evening was tested against the production converter and not booked, failing on the reliever entry anchors, on steals the stream cannot encode, and on the full gates; and Joe closed the episode with &quot;Leave it 22-5, the replay decides&quot; before sending this replay the same night. R1-01 is a frozen series and cannot be edited by import, so the replacement was made as a guarded manual edit under Joe&#x27;s ruling, with the validator&#x27;s locked-game fingerprint and the pins the replaced game fed (the locked counting totals and the game&#x27;s played-date pin) reset under dated comments in validate_results.py. The R1-01 series entry and both club records are unchanged, the Yankees having won the replaced game as well, and the series carries no MVP, before or after. All four sources agree on every number: the linescore, the batting and pitching sums, plate appearances against batters faced for every pitcher (Miami 35 against Gomez&#x27;s 35; New York 39 against Willis&#x27;s 24, Scott&#x27;s 3, Ramos&#x27;s 7, and Cishek&#x27;s 5), and printed RBI (New York 7 for 7; Miami 1 for 1, Stanton). No seed is printed in any source, so rng_seed is 0, as in the R1-06 and R1-10 adoptions. The decisions are printed in the log: Lefty Gomez takes the win with a complete game (9.0 IP, 7 H, 1 R, 1 ER, 2 BB, 9 SO, 0 HR) and Dontrelle Willis the loss (6.0 IP, 5 H, 4 R, 4 ER, 2 BB, 4 SO, 1 HR); there is no save. New York&#x27;s runs came on Judge&#x27;s two-run home run in the Top 3 (Randolph aboard, the game&#x27;s only homer), on Gehrig&#x27;s Top 6 triple scoring Ruth and Mantle&#x27;s groundout scoring Gehrig, and on three consecutive bases-loaded walks in the Top 8 (Bernie Williams, Alex Rodriguez, and Yogi Berra, off Ramos then Cishek) scoring Jeter, Ruth, and Mantle. Miami&#x27;s only run came in the Bottom 4 and was earned: Sheffield doubled and Stanton doubled him home. The game was errorless. Hit batters none, printed 0 for both clubs on the scorecard (batter HBP 0 for every hitter and pitcher HB 0 for every pitcher), not a default. Wild pitches none and passed balls none, as printed. Sacrifices: Mantle&#x27;s Top 4 bunt is the game&#x27;s only sacrifice hit (SH 1); there is no sacrifice fly. Grounded into double plays: Rodriguez (Top 2), Berra (Top 7), and Conine (Bottom 2). Stolen bases: none; Castillo&#x27;s Bottom 8 steal call ended with the runner held and no jump, and no steal is charged. Substitutes: Bernie Williams replaced DiMaggio in center field to start the Bottom 7 (Stengel&#x27;s graded defensive sub); his only plate appearance was the Top 8 bases-loaded walk that forced in a run, so his line is 0 at-bats, 1 walk, 1 RBI; every other starter on both clubs finished, Miami&#x27;s only changes being its three pitching changes. Defensive lines are booked as a defense object in the established shape, under the same one-series exception Joe directed for the Game 1 and Game 2 replays adopted earlier that evening (he asked for the advanced stats and the defense from these replays), departing from his 2026-11-05 ruling that defensive tracking begins with Winners Round 2 and Losers Round 1 and is never backfilled for Round 1; no other Round 1 game changes, and New York&#x27;s 27 putouts and 9 assists and Miami&#x27;s 27 putouts and 12 assists are exactly the printed fielding tables. Graded decisions, narrated here because final_grades stays empty as in every imported game in this archive: Jack McKeon (Miami) 6 (0 paid off, 5 backfired, 1 neutral): the Top 6 leave-in of a fatigued Willis backfired (-0.30), the Top 7 pitching change to Scott was neutral (+0.23), the Top 8 change to Ramos backfired (-2.77), the Top 8 change to Cishek backfired (-0.50), the Bottom 8 steal backfired (-0.86), and the Bottom 8 hit and run backfired (-0.76). Casey Stengel (New York) 1 (1 paid off): the Bottom 7 defensive sub, Williams for DiMaggio, paid off (+0.48). Managers: Casey Stengel (New York) and Jack McKeon (Miami). Venue is loanDepot Park. Availability: Game 4&#x27;s recorded lines stand exactly as played under either version of this game, and its data is unchanged; the note is provenance only. Under this adopted game, Gomez (27 outs) and Willis (18 outs) sit in the unavailable band for Game 4, and neither appears in it (Guidry started for New York and Beckett for Miami); Scott (3 outs), Ramos (2 outs), and Cishek (4 outs) are all under the six-out line and free, and all three worked Game 4 as played. Under the replaced game the same three were likewise free (Scott 0 outs, Ramos 5, Cishek 2) and Gomez was likewise unavailable, so Game 4 is legal under both versions. New York leads the series 3-0.">
