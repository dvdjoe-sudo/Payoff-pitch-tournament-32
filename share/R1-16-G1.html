  <title>R1-16-G1: Philadelphia Athletics 6, Houston Astros 3</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-07: the paper scorecard grid photo, the app scorecard PDF (the Payoff Pitch Gazette), and the full graded play-by-play text; official R1-16 Game 1 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Series: Houston Astros (seed 16) vs Philadelphia Athletics (seed 17), home pattern 2-2-1-1-1, Game 1 at Minute Maid Park. This game opens R1-16, the last opening-round series. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Lefty Grove pitched the whole game for Philadelphia (9.0 IP, 4 H, 3 R, 3 ER, 0 BB, 5 SO, 3 HR); Philadelphia took the lead for good in the Top 8 on his watch and he finished the game, so he takes the win. The loss takes a line of derivation. Houston led 3-0 into the Top 8. Joe Sambito opened the eighth and gave up a Cochrane single, a Simmons double, and Jimmie Foxx&#x27;s three-run home run; all three runs are charged to Sambito on the card (0.1 IP, 3 H, 3 R, 3 ER, 1 HR), and they only tied the game at 3-3. Pressly and Ryan finished the eighth scoreless. Ryan stayed on for the Top 9 and gave up Ferris Fain&#x27;s leadoff triple, Eddie Collins&#x27;s single through the drawn-in infield (Fain scoring the go-ahead run), a Cochrane walk, Simmons&#x27;s sacrifice bunt, an intentional walk to Foxx, Bob Johnson&#x27;s single, and Home Run Baker&#x27;s sacrifice fly; all three Top 9 runs are charged to Ryan on the card (1.0 IP, 3 H, 3 R, 3 ER, 2 BB, 1 SO), the go-ahead run among them, and Ryan was the pitcher of record when the lead changed for good, so Ryan takes the loss. Billy Wagner recorded the last out of the ninth. No save: Grove finished the game himself. Run charges match the printed lines exactly: Houston pitching allows 6 (Sambito 3, Ryan 3, and Verlander, Hader, Lidge, Pressly, and Wagner none), and Philadelphia pitching allows 3 (Grove 3). The duplicate test ran before the number was assigned: the R1-16 series entry carried no stored games, so this box score is no duplicate and takes the series&#x27; first game, Game 1. The game: Houston&#x27;s Justin Verlander threw 4.2 scoreless innings and left in the Top 5 after Collins&#x27;s hit-and-run groundout, Josh Hader finished the fifth and threw a scoreless sixth, and Brad Lidge threw a scoreless seventh, so Philadelphia was shut out for seven innings on four hits. Houston&#x27;s whole offense was three solo home runs off Grove: Jeff Bagwell in the Bottom 4, and Lance Berkman and Carlos Correa back to back in the Bottom 5; Houston&#x27;s only other hit was Berkman&#x27;s Bottom 7 single, and Houston stranded exactly one runner all game, Berkman in the seventh. Philadelphia&#x27;s Top 8: Collins grounded out, Cochrane singled, Simmons doubled off the wall, and Foxx hit the three-run home run off Sambito that tied the game. Pressly walked Johnson, Baker forced Johnson at second, and Moses walked, before Ryan struck out Joost to end the inning. Philadelphia&#x27;s Top 9 off Ryan: Fain tripled, Collins singled him home for the lead, Cochrane walked, Simmons bunted the runners along, Foxx was walked intentionally, Johnson singled home a run, and Baker hit a sacrifice fly for the third run; Wagner came in and walked Moses before Joost flied out, leaving the bases loaded. Grove set down Alvarez, Bagwell, and Altuve in the Bottom 9 to close it. Philadelphia stranded 11 and Houston 1. Home runs: four, Foxx&#x27;s three-run shot in the Top 8 off Sambito for Philadelphia, and the three solo shots for Houston, Bagwell in the Bottom 4, Berkman in the Bottom 5, and Correa in the Bottom 5, all off Grove. Doubles: one, Simmons in the Top 8. Triples: one, Fain in the Top 9. Errors: none on either side. Hit batters: none; HB 0 for every pitcher and HBP 0 for every batter are carried as card-sourced values, so the hit batter check runs on real data. Wild pitches: one, Lidge in the Top 7, Moses striking out and beating the throw to first on it. Passed balls: none. Sacrifices: three, Baker&#x27;s bunt in the Top 4 and Simmons&#x27;s bunt in the Top 9 and Baker&#x27;s sacrifice fly in the Top 9, the split lines reading SH 1 for Simmons, SH 1 and SF 1 for Baker, and SH 0 and SF 0 for every other batter; Simmons&#x27;s Top 1 bunt is not a sacrifice, the lead runner was forced and Simmons reached on the fielder&#x27;s choice, an at-bat. Stolen bases: none. Caught stealing: none. Double plays grounded into: none; the Top 1 play was a bunt forceout, one out only. Substitutions: none with plate appearances; the Gazette prints nine batting lines for each club, and Philadelphia used one pitcher and Houston seven. The Athletics exist in this tournament as two clubs, Oakland (OAK) and Philadelphia (PHA); every Philadelphia line in this game sits under PHA keys and nothing merges with Oakland. Plate appearances counted fresh from the printed batting lines and the play log enumeration, a runner out on the bases counting as one of the inning&#x27;s outs and never an add-on: Philadelphia PA is AB 35 plus BB 6 plus SH 2 plus SF 1, which is 44, and the outs plus runs plus stranded identity agrees (27 outs plus 6 runs plus 11 stranded is 44); Houston PA is AB 31, which is 31, and the identity agrees (27 outs plus 3 runs plus 1 stranded is 31). Batters faced tie to those totals: Philadelphia 44 PA against 44 Houston BF (Verlander 19, Hader 4, Lidge 4, Sambito 4, Pressly 3, Ryan 8, Wagner 2; Lidge faced four batters while recording three outs because Moses reached on the dropped third strike), and Houston 31 PA against 31 Philadelphia BF (Grove 31). Strikeouts tie both ways: Philadelphia batting 6 against Houston pitching 6 (Verlander 3, Lidge 2, Ryan 1), Houston batting 5 against Philadelphia pitching 5 (Grove 5). Printed RBI: Philadelphia 6 for 6 (Foxx 3, Collins 1, Johnson 1, Baker 1) and Houston 3 for 3 (Bagwell 1, Berkman 1, Correa 1). Availability: this is the series opener with no previous game, so every pitcher on both clubs was free and no cap was in play. Seven decisions were graded. Connie Mack made 1 (0 paid off, 1 backfired, 0 neutral): the Top 5 hit and run with Collins batting backfired at -0.76, Collins grounding out 6-3 with Fain advancing. A.J. Hinch made 6 (3 paid off, 1 backfired, 2 neutral), all pitching changes: to Hader in the Top 5 paid off at +0.57, to Lidge in the Top 7 paid off at +0.73, the game&#x27;s best grade, to Ryan in the Top 8 paid off at +0.68, to Pressly in the Top 8 was neutral at +0.00, to Wagner in the Top 9 was neutral at +0.23, and to Sambito in the Top 8 backfired at -2.27, the game&#x27;s worst grade, Sambito giving up the three runs that tied the game. Managers: A.J. Hinch (Houston) and Connie Mack (Philadelphia). Venue is Minute Maid Park; the archive carries no park name for the Athletics&#x27; home games, so Games 3, 4, and 6 of this series are recorded as Philadelphia, city only. Philadelphia leads the series 1-0.">
