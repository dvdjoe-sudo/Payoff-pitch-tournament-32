  <title>W2-03-G2: Houston Astros 5, Boston Red Sox 6</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 3, Game 2 at Fenway Park. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. The export&#x27;s Rec carries the app&#x27;s own walk-off repair note: the game was originally recorded as an 8-5 Boston final, and the app repaired it to 6-5 under Rules 5.08(b) and 9.06(f), because the game ends when the winning run scores and the game-ending hit is scored a single; the export as sent is the repaired record and is booked as printed. Decisions: Jonathan Papelbon takes the win for Boston (1.0 IP, 3 BF, 2 SO), a perfect top of the 9th with the game tied. Ryan Pressly takes the loss for Houston (0.2 IP, 5 BF, 1 H, 1 R, 0 ER, 2 BB, 1 SO): the winning run was his runner and is unearned. No save. Joe Sambito is charged with the blown save in the Rec&#x27;s extra line, and Brad Lidge takes a hold there. Scoring: Houston scored first in the top of the 2nd: Jose Altuve doubled, took third as Alex Bregman reached on Nomar Garciaparra&#x27;s error, and scored on Carlos Correa&#x27;s groundout; the run is unearned to Roger Clemens, the only unearned run in his line (8.0 IP, 35 BF, 11 H, 5 R, 4 ER, 4 SO, 1 HR). Boston answered in the bottom of the 3rd: Carlton Fisk homered off Roy Oswalt, and Tris Speaker doubled and scored on Dustin Pedroia&#x27;s single. Correa drove in Altuve again in the top of the 4th with a single (Altuve had singled and stolen second, the game&#x27;s only stolen base), and in the top of the 6th Correa hit a three-run home run off Clemens after Lance Berkman&#x27;s double and Bregman&#x27;s single: 5-2 Houston. Correa drove in all five Houston runs and is the export&#x27;s player of the game (2 for 4, HR, 5 RBI) in a losing cause. Clemens finished eight innings and kept Boston in it. The tie came in the bottom of the 8th off Sambito: Dwight Evans homered, Wade Boggs singled, and Garciaparra hit a two-run home run; Pressly then finished the inning (Fisk struck out, Speaker walked, pinch-hitter Bobby Doerr flied out). Papelbon struck out two in a perfect 9th. The winner came in the bottom of the 9th: Ted Williams walked off Pressly and David Ortiz singled; Billy Wagner came on and got Jimmie Foxx on a flyout and Evans on a strikeout, then Boggs reached on Bregman&#x27;s error at third, the would-be third out, and Garciaparra singled Williams home. The run is unearned to Pressly exactly as printed, Garciaparra keeps the RBI (2 for 4, HR, 3 RBI on the day), and Wagner&#x27;s inherited line reads 2 inherited, 1 scored in the Rec&#x27;s extra line. Key lines: for Houston, Altuve 3 for 4 with 2 runs, a double and the stolen base, Berkman 1 for 4 with a double and a run, Yordan Alvarez 2 for 5; for Boston, Garciaparra 2 for 4 with the homer and 3 RBIs, Pedroia 2 for 3 with an RBI and a walk, Boggs 2 for 5 with a run, Williams 1 for 3 with 2 walks and the winning run. Pitching lines of note: Oswalt 4.2 IP, 20 BF, 6 H, 2 ER, 3 SO, 1 HR in the start; Josh Hader 1.1 scoreless innings with 2 walks and 2 strikeouts, inheriting 1 runner and stranding him (the Rec&#x27;s extra line reads 1 inherited, 0 scored); Lidge a scoreless 7th (1.0 IP, 4 BF, 1 BB, 2 SO) for the hold; Sambito 0.1 IP, 4 BF, 3 H, 3 ER, 2 HR for the blown save; Wagner 0.2 IP, 4 BF, 1 H, 1 SO. Errors: one per club, Garciaparra&#x27;s E6 in the 2nd and Bregman&#x27;s E5 in the 9th, and both figured in the scoring: Houston&#x27;s first run and Boston&#x27;s winning run are the game&#x27;s two unearned runs. Double plays: Boston turned one (Berkman grounded into it in the top of the 7th, the game&#x27;s only printed GIDP and a genuine double-play row in the log); Houston turned none. Stolen bases: Altuve&#x27;s one, against Fisk (the fielding section credits Fisk 1 stolen base against, 0 caught stealing, 0 passed balls). Wild pitches: none. Passed balls: none. The defense object books putouts, assists and errors exactly as the printed fielding section carries them: Houston 26 putouts and 8 assists (Bagwell 9 putouts, Biggio 9 putouts at catcher, Bregman the error), Boston 27 putouts and 12 assists (Ortiz 9 putouts, Garciaparra the error). Substitutes: George Springer entered in the bottom of the 8th as a defensive replacement in right field for Berkman and never batted; he carries no batting or fielding line in the export and none is booked. Doerr pinch-hit for Pedroia in the 8th and flied out. The only other changes were on the mound. Counting checks: Houston plate appearances 38 (38 AB) equal Boston&#x27;s 38 batters faced (Clemens 35, Papelbon 3); Boston plate appearances 44 (39 AB, 5 BB) equal Houston&#x27;s 44 batters faced (Oswalt 20, Hader 7, Lidge 4, Sambito 4, Pressly 5, Wagner 4). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades: the grades list names both managers directly, so no label mapping is needed. A.J. Hinch graded 7 decisions (4 paid off, 2 backfired, 1 neutral): the Altuve steal paid off, five pitching changes split 3 paid off, 1 backfired (the Sambito change) and 1 neutral, and the Springer defensive sub backfired. Terry Francona graded 2 decisions (1 paid off, 1 backfired): the Doerr pinch-hit backfired and the Papelbon pitching change paid off. Availability for Game 3 under the convention: Clemens (24 outs in this game) and Oswalt (14 outs) are unavailable; every other arm used is free (Hader 4 outs, Lidge 3, Sambito 1, Pressly 2, Wagner 2, Papelbon 3, all under 6). Game 1&#x27;s rest rules were honored in this game: Verlander and Martinez sat, and Ryan, capped at 3 outs, did not pitch. Boston leads the series 2-0. Managers: Terry Francona (Boston) and A.J. Hinch (Houston). Venue is Fenway Park, as printed.">
