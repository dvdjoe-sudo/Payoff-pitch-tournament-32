  <title>W2-05-G5: Cleveland Guardians 6, St. Louis Cardinals 5</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 5, Game 5 at Busch Stadium. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON; the series master export&#x27;s Game 5 record agrees with the game export in every field. Decisions: Cody Allen takes the win for Cleveland (2.0 IP, 8 BF, 2 H, 0 ER, 3 SO, scoreless 8th and 9th). Ryan Helsley takes the loss for St. Louis (1.0 IP, 4 BF, 1 H, 1 ER), on Lou Boudreau&#x27;s top-of-the-9th solo home run, the decisive play the export&#x27;s summary names. There is no save. The Rec&#x27;s extra line carries one blown save, for Lindy McDaniel: he entered the top of the 6th with a 5-3 lead and Jim Thome&#x27;s top-of-the-8th two-run home run tied the game on his watch (3.0 IP, 13 BF, 2 H, 2 ER, 2 BB, 2 SO). Scoring: St. Louis scored first in the bottom of the 2nd, Joe Medwick tripling and Mark McGwire hitting a two-run home run off Sam McDowell (2-0). Cleveland answered with three in the top of the 4th off Chris Carpenter: Nap Lajoie singled, Jim Thome&#x27;s forceout erased him, Carlos Santana doubled Thome to third, Shoeless Joe Jackson&#x27;s groundout scored Thome, Albert Belle walked, and José Ramírez singled both runners home on a play the log describes as the fielder taking his foot off the bag (3-2). St. Louis retook the lead with three in the bottom of the 4th off McDowell: McGwire walked, Yadier Molina singled, Ken Boyer walked, and Ozzie Smith cleared the bases with a double (5-3). Cleveland tied it in the top of the 8th off McDaniel, Lajoie singling and Thome homering (5-5), and won it in the top of the 9th on Boudreau&#x27;s solo home run off Helsley (6-5). Allen closed the bottom of the 9th: Stan Musial struck out, Red Schoendienst flied out, Albert Pujols singled, and Jim Edmonds struck out to end the game and the series. Mark McGwire is the export&#x27;s player of the game, in defeat: 1 for 3 with the two-run home run, 2 RBIs, 2 runs and a walk. Manny Ramirez was ejected after his top-of-the-2nd strikeout (the log&#x27;s rare-play line reads &quot;batter ejected&quot;); Santana took his spot in the order and doubled in the top of the 4th. Key lines: for Cleveland, Thome 1 for 4 with the tying two-run home run, 2 RBIs and 2 runs, José Ramírez 2 for 4 with 2 RBIs, Lajoie 2 for 4 with a run, Boudreau 1 for 3 with the winning home run, a walk and an RBI, and Santana 1 for 2 with a double, a run and a walk; for St. Louis, Ozzie Smith 2 for 5 with the bases-clearing double and 3 RBIs, McGwire&#x27;s line above, Rogers Hornsby 2 for 3 with a double, a walk and the game&#x27;s only stolen base, and Medwick 1 for 4 with a triple and a run. Pitching lines of note: McDowell 4.0 IP, 23 BF, 7 H, 5 ER, 4 BB, 7 SO, 1 home run allowed in the start; Cleveland&#x27;s bullpen threw five scoreless innings behind him, Cade Smith a perfect 5th with 3 strikeouts, Doug Jones a scoreless 6th, Emmanuel Clase a scoreless 7th, and Allen the scoreless 8th and 9th for the win; Carpenter 5.0 IP, 20 BF, 5 H, 3 ER, 1 BB, 2 SO for St. Louis, and McDaniel the blown save above. St. Louis&#x27;s only error was McDaniel&#x27;s own throwing error in the top of the 7th (José Ramírez reached, cost nothing); Cleveland was errorless. St. Louis turned two double plays (Boudreau&#x27;s top-of-the-3rd ground-ball double play off Carpenter and Jackson&#x27;s top-of-the-8th ground-ball double play off McDaniel, both genuine double-play rows in the log and the game&#x27;s only printed GIDPs); Cleveland turned none. Defensive lines are booked in the established shape from the printed fielding section (St. Louis 27 putouts and 20 assists, Pujols 14 putouts, Ozzie Smith 6 assists, Hornsby 4 assists; Cleveland 27 putouts and 7 assists, Victor Martinez 15 putouts catching, Lajoie 4 assists); the fielding section also prints double-play credits for Pujols (2) and Ozzie Smith (2), Hornsby (1) and Schoendienst (1), plus a run-out credit and a GDP credit for Ozzie Smith and for Schoendienst alongside, none of which enters the defense object&#x27;s putout/assist/error lines, which are booked exactly as printed. Stolen bases: Hornsby, the game&#x27;s only one; Martinez&#x27;s catching line reads PB 0, 1 stolen base against, 0 caught stealing, and Molina&#x27;s reads PB 0, 0 against, Cleveland stealing none. Hit by pitch: none on either side. Wild pitches and passed balls: the box text and the CSV pitching section charge Cody Allen with 1 wild pitch, and the defense object books it exactly as printed; the play log&#x27;s only wild-pitch strikeout (bottom of the 6th, Boyer) came with Doug Jones pitching, a printing discrepancy between the export&#x27;s own sections that is documented here and in the game&#x27;s official record; there were no passed balls. Substitutes: Santana entered for the ejected Ramirez and doubled in the 4th for Cleveland; for St. Louis, Schoendienst entered at second base for Hornsby in the top of the 7th and batted in the 9th, and Ted Simmons pinch-hit for Molina in the bottom of the 8th and singled. Counting checks: Cleveland plate appearances 37 (34 AB, 3 BB) equal St. Louis&#x27;s 37 batters faced (Carpenter 20, McDaniel 13, Helsley 4); St. Louis plate appearances 41 (37 AB, 4 BB) equal Cleveland&#x27;s 41 batters faced (McDowell 23, Cade Smith 3, Jones 4, Clase 3, Allen 8). Hit, walk, home run and strikeout totals tie across the two boxes both ways, and every run on both sides carries an RBI and is earned exactly as printed. Manager grades: the grades list names both managers directly, so no label mapping is needed. Terry Francona graded 7 decisions (5 paid off, 2 backfired, 0 neutral): four pitching changes, all paid off (Cade Smith in the 5th, Jones in the 6th, Clase in the 7th, Allen in the 8th), and three steals at 1 paid off and 2 backfired (Lajoie&#x27;s top-of-the-1st steal paid off; Belle&#x27;s top-of-the-4th and Lofton&#x27;s top-of-the-5th backfired). Tony La Russa graded 5 decisions (1 paid off, 1 backfired, 3 neutral): two pitching changes at 1 paid off and 1 neutral (McDaniel in the 6th paid off as graded, Helsley in the 9th neutral), one hit and run backfired (Pujols&#x27;s bottom-of-the-3rd strikeout on the hit and run), the Schoendienst defensive sub neutral, and the Simmons pinch-hit neutral. Series graded totals: Francona 40 decisions (22 paid off, 11 backfired, 7 neutral); La Russa 27 (12 paid off, 7 backfired, 8 neutral). Availability from Game 4 was honored: Corey Kluber, unavailable, sat, and Harry Brecheen and Jason Isringhausen, each capped at 3 outs, went unused, exactly as the Rec&#x27;s unavailable list prints them. Series MVP, under Joe&#x27;s standing rule that the MVP named in the series export is the MVP: Shoeless Joe Jackson of Cleveland, 6 for 19 with 3 runs, a double, a triple, a home run and 5 RBIs (.316); the runner-up is his teammate Cody Allen, who saved Games 1 and 3 and won this clincher without allowing an earned run (4.0 IP, 2 H, 0 ER, 0 BB, 5 SO, 1-0, 2 saves). Managers: Terry Francona (Cleveland) and Tony La Russa (St. Louis). Venue is Busch Stadium, as printed.">
