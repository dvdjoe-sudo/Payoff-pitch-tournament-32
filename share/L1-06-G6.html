  <title>L1-06-G6: New York Mets 1, Montreal Expos 2</title>
  <meta name="description" content="Losers Bracket, Round 1, Series 6, Game 6 at Olympic Stadium, as the master export&#x27;s box score prints the venue (marked neutral). Montreal wins the series 4-2 and advances to Losers Round 2; New York is eliminated. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, and the graded play-by-play log with its manager decisions and decisions summary. A series master export Joe sent for the whole Mets-Expos series carries this same game as its Game 6 record, and the two exports agree in every field checked (linescore, batting, pitching and fielding lines, decisions, graded decisions, and all 73 play rows identical). Decisions: Steve Rogers takes the win for Montreal (7.0 IP, 26 BF, 4 H, 0 R, 0 ER, 0 BB, 1 HBP, 5 SO); he is the export&#x27;s Player of the Game. Dwight Gooden takes the loss for New York with a complete game (8.0 IP, 30 BF, 4 H, 2 R, 2 ER, 2 BB, 7 SO, 2 HR). John Wetteland earns the save (2.0 IP, 9 BF, 1 H, 0 R, 2 BB, 2 SO, 1 WP), entering in the top of the 8th with runners on first and second, nobody out and a two-run lead, and finishing the game. Jeff Reardon faced two batters in the top of the 8th and retired neither (2 H, 1 R, 1 ER). Scoring: Montreal scored both of its runs on solo home runs off Gooden: Orlando Cabrera&#x27;s in the bottom of the 3rd (the export report&#x27;s decisive play) and Tim Wallach&#x27;s in the bottom of the 4th. New York&#x27;s only run came in the top of the 8th and carries no RBI: Cleon Jones singled off Reardon, Lindor singled, Hernandez walked off Wetteland to load the bases, Wright popped out and Strawberry struck out, and during Mike Piazza&#x27;s plate appearance Wetteland threw a wild pitch and Jones scored from third; Piazza then popped out to third, stranding Lindor and Hernandez. The run is charged earned to Reardon, exactly as printed: Jones reached and advanced entirely on hits and a walk. Errors: one, Montreal&#x27;s Orlando Cabrera (E6) in the top of the 7th, when Beltran reached on a one-base error by the shortstop with two out and the bases empty; it cost nothing. New York was errorless, and the earned-run totals tie exactly: Montreal&#x27;s staff total of 1 equals New York&#x27;s 1 run and New York&#x27;s staff total of 2 equals Montreal&#x27;s 2 runs. Double plays: one, turned by Montreal in the top of the 7th (Alonso grounds into a double play, 6-4-3 as the rows code it), matching Alonso&#x27;s printed GIDP of 1 and the printed fielding section&#x27;s DP credits (Fairly one, Cabrera one, Vidro one) exactly. New York turned no double play. Stolen bases: none attempted by either club. Wild pitches: one, Wetteland in the top of the 8th, the pitch Jones scored on. Passed balls: none. Substitutes: Brian Schneider entered at catcher for Gary Carter in the top of the 8th (defensive sub) and did not bat; he carries a fielding line only (2 putouts), exactly as printed. Mike Lansing entered at second base in the top of the 9th (defensive sub); he had no plate appearance and no fielding chance and carries no batting or fielding line, exactly as printed. John Olerud pinch-hit for Alonso in the top of the 9th and walked. Fielding from the CSV&#x27;s printed fielding section: New York 24 putouts and 8 assists (Hernandez 10 putouts; Strawberry also carries one range out, as printed); Montreal 27 putouts and 6 assists. Counting checks: New York plate appearances 37 (34 AB, 2 BB, 1 HBP) equal Montreal&#x27;s 37 batters faced (Rogers 26, Reardon 2, Wetteland 9); Montreal plate appearances 30 (28 AB, 2 BB) equal New York&#x27;s 30 batters faced (Gooden 30). Hit, walk, hit-by-pitch, home run and strikeout totals tie across the two boxes both ways. Manager grades, exactly as the export&#x27;s decisions summary prints: Dick Williams graded 5 decisions (1 paid off, 3 backfired, 1 neutral): one hit and run (the bottom of the 3rd backfired, -1.13), two pitching changes (Reardon in the top of the 8th backfired, -0.77; Wetteland in the top of the 8th neutral, +0.19) and two defensive subs (Schneider at catcher in the top of the 8th backfired, -0.52; Lansing at second base in the top of the 9th paid off, +0.48). Davey Johnson graded 1 decision (0 paid off, 0 backfired, 1 neutral): one pinch hitter (Olerud in the top of the 9th, neutral, -0.23; the batter walked but no run followed). Series graded totals: Williams 33 decisions (17 paid off, 9 backfired, 7 neutral); Johnson 24 (13 paid off, 6 backfired, 5 neutral). Availability compliance: Tom Seaver (27 outs in Game 5) was unavailable for New York and did not pitch; Javier Vazquez (18 outs in Game 5) was unavailable for Montreal and did not pitch. The export&#x27;s own pre-game unavailable list names both, and the book&#x27;s outs convention agrees. Series final: Montreal wins 4-2. Series runs: Montreal 18, New York 13. Montreal advances to Losers Round 2; New York is eliminated with its second series loss. Managers: Dick Williams (Montreal) and Davey Johnson (New York). Venue is Olympic Stadium, as printed.">
