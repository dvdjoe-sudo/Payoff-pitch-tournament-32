  <title>R1-10-G1: Milwaukee Brewers 5, Los Angeles Dodgers 6</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-01: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-10 Game 1 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Los Angeles Dodgers (seed 10) vs Milwaukee Brewers (seed 23), home pattern 2-2-1-1-1, Game 1 at Dodger Stadium. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number; no run-accounting settlement was needed, because the printed RBI totals tie exactly to the run totals for both clubs (Milwaukee 5 for 5, Los Angeles 6 for 6). The decisions are not printed; they are derived from the play log and the run charges on the card. Eric Gagne takes the win: he threw scoreless 9th and 10th innings and was Los Angeles&#x27;s pitcher of record when Roy Campanella homered to end the game in the Bottom 10. Rollie Fingers takes the loss: he opened the Bottom 10, got Gil Hodges on a groundout, and Campanella&#x27;s walk-off home run is the run charged to him. No save. Both starters took no decision: Sandy Koufax left during the Top 7 trailing 5-3 and was in line for the loss until Jackie Robinson&#x27;s Bottom 9 homer tied the game, and Teddy Higuera left during the Bottom 5 with the game tied 3-3, his three charges all the Bottom 1 runs. Run charges match the printed lines exactly: Milwaukee pitching allows 3 + 0 + 0 + 1 + 1 + 1 = 6 (Higuera, Jeffress, Williams, Plesac, Hader, Fingers), and Los Angeles pitching allows 5 + 0 + 0 = 5 (Koufax, Jansen, Gagne), Koufax charged with both Top 7 runs (Braun singled off him and scored on Molitor&#x27;s hit-and-run single, and Molitor, who singled off Koufax, scored on Fielder&#x27;s single off Jansen as an inherited runner). The duplicate test ran before the number was assigned: no R1-10 game was stored anywhere on the book, and this is the first game of the series in play order, booked as Game 1. The game: Robinson singled and Shohei Ohtani walked in the Bottom 1 and Duke Snider hit a 3-run home run off Higuera for 3-0. Milwaukee tied it in the Top 4: Prince Fielder walked, George Scott singled, and Geoff Jenkins hit a 3-run home run off Koufax. Milwaukee went ahead in the Top 7: Ryan Braun singled off Koufax, Paul Molitor&#x27;s hit-and-run single scored him from first, Kenley Jansen relieved, and Fielder&#x27;s single scored Molitor for 5-3. Los Angeles then homered its way back one swing at a time: Snider&#x27;s second home run of the game, a solo shot off Dan Plesac in the Bottom 8 (Snider 2 for 4, 2 home runs, 4 RBI); Robinson&#x27;s solo homer off Josh Hader in the Bottom 9 to tie it 5-5 (Robinson 3 for 5, 2 runs); and Campanella&#x27;s walk-off solo home run off Fingers with one out in the Bottom 10, his only hit of the night. Doubles: Molitor for Milwaukee and Ron Cey for Los Angeles. Koufax&#x27;s 1 wild pitch is printed on the scorecard; a wild pitch is not a stored archive field and is noted here only, and no run scored on it. Sacrifices: none for either club, and no sacrifice flies, so the split columns below show SH 0 and SF 0 for every batter, log-proven; Zack Wheat&#x27;s Bottom 5 bunt is scored a fielder&#x27;s choice on the card (the lead runner was forced and Wheat safe at first) and counts as an at-bat exactly as printed (Wheat AB 5). Stolen bases: none for either club, as printed; the three steal sends in the log (Lasorda in the Bottom 1 and Bottom 5, Murphy in the Top 3) were all held runners who did not get a good jump, not attempts, and there was no caught stealing. Double plays grounded into, counted from the play log: none for either club; the two Bottom 5 forceouts (Wheat&#x27;s fielder&#x27;s choice and Betts&#x27;s forceout at second) are not GIDPs. Substitutions: Braun pinch-hit for Christian Yelich in the Top 5 and stayed in left field (1 for 2, and scored the go-ahead run in the Top 7); Ben Oglivie replaced Braun in left field as a defensive sub in the Bottom 8 and singled in the Top 10; Cecil Cooper pinch-hit for Scott in the Top 7, walked, and stayed in at first base; B.J. Surhoff replaced William Contreras at catcher as a defensive sub in the Bottom 7 and singled in the Top 10. Los Angeles made no substitutions. Hit batter: none. The scorecard grids print an HBP column for every pitcher on both clubs, all zeros, so HB 0 is carried for all nine pitchers and HBP 0 for every batter as card-sourced values, and the hit batter check runs on real data. Batters faced are counted from the play log and tie to the batting PA totals both ways (Milwaukee 44 PA against 44 Los Angeles BF: Koufax 30, Jansen 6, Gagne 8; Los Angeles 43 PA against 43 Milwaukee BF: Higuera 22, Jeffress 6, Williams 3, Plesac 4, Hader 6, Fingers 2). Seventeen decisions were graded. Tommy Lasorda made 4 (1 paid off, 2 backfired, 1 neutral): the Bottom 1 steal send paid off at +2.14 (Robinson held, and Snider&#x27;s 3-run homer followed), the Bottom 5 steal send backfired at -0.86, the Top 7 pitching change to Jansen backfired at -0.93 (Fielder&#x27;s RBI single scored the inherited Molitor), and the Top 9 pitching change to Gagne was neutral at +0.23. Pat Murphy made 13 (5 paid off, 4 backfired, 4 neutral): the Top 3 steal send backfired at -0.51; the Top 4 hit and run paid off at +1.31 in the 3-run inning; the Top 5 pinch hitter Braun backfired at -0.73 on the strikeout that greeted him; the Bottom 5 change to Jeffress was neutral at +0.23; two Top 7 hit and runs went paid off at +1.74 (Molitor&#x27;s single scoring Braun from first) and neutral at +0.24 (Yount struck out on the second); the Top 7 pinch hitter Cooper was neutral at +0.03 on his walk; the Bottom 7 change to Devin Williams paid off at +0.73 and the Surhoff defensive sub paid off at +0.48; the Bottom 8 change to Plesac backfired at -0.77 (Snider&#x27;s second homer) and the Oglivie defensive sub backfired at -0.52 in the same inning; the Bottom 8 change to Hader paid off at +0.57; and the Bottom 10 change to Fingers was neutral at -0.27, his grading surviving on the Hodges groundout even though Campanella ended the game two pitches of record later. Managers: Pat Murphy (Milwaukee) and Tommy Lasorda (Los Angeles). Venue is Dodger Stadium. Game 2 availability, under the house outs convention read off this game only: Koufax threw 20 outs and Higuera 14, so both are UNAVAILABLE for Game 2 (the rotations turn to the number 2 starters anyway); Gagne threw 6 outs and is capped at 3 outs; Jansen (4 outs), Jeffress (4), Williams (3), Plesac (2), Hader (4) and Fingers (1) are all free. Los Angeles leads the series 1-0.">
