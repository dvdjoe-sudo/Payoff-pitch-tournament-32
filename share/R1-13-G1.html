  <title>R1-13-G1: Los Angeles Angels 2, Cleveland Guardians 3</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-04: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-13 Game 1 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Cleveland Guardians (seed 13) vs Los Angeles Angels (seed 20), home pattern 2-2-1-1-1, Game 1 at Progressive Field in Cleveland. One ordering note: Joe sent this game&#x27;s three files second today, after the files of the 2-1 game, and corrected the order himself in chat: this 3-2 game is Game 1, played first, and the 2-1 game is Game 2; the game numbers follow play order, and this game is booked first. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with one run sequence settled from the play log and the printed lines, documented here. The settlement, the Bottom 4: Cleveland scored all three of its runs in the inning, every one unearned. Manny Ramirez reached on Finley&#x27;s error to open the inning, Jackson sacrificed him to second, Belle popped out, and Jose Ramirez singled to the infield; Finley&#x27;s second error of the inning on the play let Ramirez score from second and put Jose Ramirez on second. The printed line governs Jose Ramirez&#x27;s credit: his Gazette batting line reads RBI 0, and the card prints Cleveland&#x27;s RBI total as 2 for its 3 runs, both of them Martinez&#x27;s on the double that followed. The run is booked with no RBI, exactly as printed, the same shape as the no-RBI run settled in R1-12 Game 5. Boudreau then reached on Glaus&#x27;s error at third, putting runners at first and third, and Martinez doubled to the opposite field, scoring Jose Ramirez and Boudreau (2 RBI, his cell carrying both markers). Printed RBI therefore reads Los Angeles 2 for 2 (Glaus 1, Joyner 1) and Cleveland 2 for 3 (Martinez 2, Jose Ramirez 0). The decisions are not printed; they are derived from the play log and the run charges on the card. Bob Feller takes the win (8.0 IP, 4 H, 2 ER, 5 BB, 1 HBP, 11 SO): Los Angeles scored both of its runs off him in the Top 1 and he allowed nothing after, leaving with a 3-2 lead after eight. Chuck Finley takes the loss (6.0 IP, 5 H, 3 R, 0 ER, 4 BB, 4 SO): all three Cleveland runs in the Bottom 4 were unearned, charged to him as pitcher of record, two of the inning&#x27;s three errors his own. Cody Allen takes the save (1.0 IP, 1 H, 0 R, 2 SO): he pitched the Top 9 protecting a one-run lead, the standard save. Run charges match the printed lines exactly: Cleveland pitching allows 2 + 0 = 2 (Feller the two Top 1 runs, Allen none), and Los Angeles pitching allows 3 + 0 + 0 = 3 (Finley the three Bottom 4 runs, Percival and Harvey none). The duplicate test ran before the number was assigned: the R1-13 series entry holds no stored games, so no stored game in the series shares this game&#x27;s clubs, final score, or linescore, and this box score, a 3-2 Cleveland win on its own linescore, is no duplicate; it is the first game of the series in play order, booked as Game 1. The game: Los Angeles jumped on Feller in the Top 1. Ohtani flew out, Trout walked and stole second, Guerrero struck out on the hit and run with Trout taking second, Glaus singled to the opposite field to score Trout, and Joyner doubled down the line to score Glaus, 2-0 before Cleveland batted. Feller settled in from there and struck out 11 over eight innings, and Finley matched him zero for zero until the Bottom 4 settled above turned the game: three unearned runs on three Los Angeles errors, Finley&#x27;s two and Glaus&#x27;s one, with Martinez&#x27;s two-run double the only clean hit of the rally. Los Angeles never got another runner past second until the Top 9, when Fregosi singled off Allen and stole second, but Napoli struck out pinch-hitting, Ohtani struck out, and Trout flew out to center to end it. Percival and Harvey each threw a scoreless inning of relief for Los Angeles, Harvey working around Ramirez&#x27;s double, Boudreau&#x27;s single, and Lofton&#x27;s hit by pitch in the Bottom 8. Cleveland stranded 11 and Los Angeles 9. Home runs: none. Doubles: three, Joyner in the Top 1 for Los Angeles, and Jose Ramirez in the Bottom 8 and Martinez in the Bottom 4 for Cleveland. Triples: none. Errors: four, all by Los Angeles: Finley twice in the Bottom 4 (Manny Ramirez&#x27;s reach and the throw on Jose Ramirez&#x27;s single), Glaus at third in the Bottom 4 (Boudreau&#x27;s reach, E5), and Fregosi at short in the Bottom 5 (Jackson&#x27;s reach, E6). The Gazette extras line names only Glaus and Fregosi; the grid&#x27;s error row (three in the fourth, one in the fifth) and the log&#x27;s two error by P plays settle Finley&#x27;s two. Cleveland played errorless ball. Hit batters: two, Fregosi by Feller in the Top 2 and Lofton by Harvey in the Bottom 8, so HB is carried for Feller (1) and Harvey (1) and 0 for the other three pitchers as card-sourced values, and the hit batter check runs on real data. Wild pitches: one, Finley, per the Gazette extras. Passed balls: none. Sacrifices: two, both Cleveland bunts, Jackson in the Bottom 4 and Belle in the Bottom 5, so the split lines read SH 1 for Jackson and Belle, SH 0 for every other batter, and SF 0 for every batter, log-proven (no sacrifice fly was hit). Stolen bases: two, Trout in the Top 1 and Fregosi in the Top 9, both for Los Angeles. Caught stealing: one, Speaker in the Bottom 7 for Cleveland. Double plays grounded into, counted from the play log: one, Jose Ramirez in the Bottom 2 for Cleveland, matching the card extras. Substitutions: Los Angeles made one. Mike Napoli pinch-hit for Boone in the Top 9 and struck out, carrying the printed line AB 1. Cleveland made one. Tris Speaker pinch-hit for Manny Ramirez in the Bottom 7, walked, and was caught stealing, carrying the printed line AB 0, BB 1, CS 1. Batters faced are counted from the play log and tie to the batting PA totals both ways (Los Angeles 38 PA against 38 Cleveland BF: Feller 34, Allen 4; Cleveland 38 PA against 38 Los Angeles BF: Finley 29, Percival 3, Harvey 6). Los Angeles PA is AB 32 plus BB 5 plus HBP 1; Cleveland PA is AB 30 plus BB 5 plus HBP 1 plus SH 2. Thirteen decisions were graded. Mike Scioscia made 8 (3 paid off, 4 backfired, 1 neutral): the Top 1 hit and run paid off at +1.24, the game&#x27;s best grade, Guerrero&#x27;s strikeout on the play still moving Trout into scoring position ahead of the two run-scoring hits; both of his pitching changes paid off at +0.73, Percival for the Bottom 7 and Harvey for the Bottom 8; the Top 3 hit and run backfired at -1.11; both Top 9 moves backfired, the Napoli pinch hitter at -1.11 and the first steal send at -0.86, Fregosi held at first, while the second steal send was neutral at -0.26, Fregosi taking second; and the Top 2 steal send backfired at -0.51, Fregosi held after his hit by pitch. Terry Francona made 5 (0 paid off, 3 backfired, 2 neutral): the Bottom 1 hit and run backfired at -1.11, Lajoie&#x27;s groundout still advancing Lofton; the Bottom 2 steal send backfired at -0.86, Jackson held; the Bottom 7 steal send backfired at -0.76, Speaker caught stealing; the Speaker pinch hitter was neutral at -0.00, a walk with one out; and the Top 9 change to Allen was neutral at +0.23 and closed the game. Managers: Mike Scioscia (Los Angeles) and Terry Francona (Cleveland). Venue is Progressive Field. Availability compliance: this is Game 1 of the series, so no prior-game restriction applies; each club started its rotation number 1, Feller for Cleveland and Finley for Los Angeles. Game 2 availability: Feller (24 outs in Game 1) and Finley (18 outs) are UNAVAILABLE under the house convention, and the rotations turn to the number 2 starters in any case; Allen, Percival, and Harvey (3 outs each) are free. Cleveland leads the series 1-0. The series stays in Cleveland for Game 2.">
