  <title>R1-06-G2: Montreal Expos 5, Chicago Cubs 3</title>
  <meta name="description" content="Played by Joe in the playable app and sent to the co-managed tournament games chat on 2026-11-09 as four files: the full graded play by play, the scorecard CSV export, the app scorecard PDF (the Payoff Pitch Gazette, Final Edition, Monday, November 9, 2026), and the scorecard photo. Joe&#x27;s instruction in chat the same day: &quot;Game 2 cubs replacement,&quot; adopting this playing as the new R1-06 Game 2 under the R1-05, R1-06, and R1-10 Game 1 adoption precedents, the R1-01 Game 1 through Game 4 adoptions of 2026-11-08 and 2026-11-09, and the R1-04 Game 6 adoption earlier on 2026-11-09; the replaced game (Montreal 4, Chicago 2; W Pedro Martinez, L Pedro Strop, SV John Wetteland, all derived; played 2026-10-29) is preserved untouched in the Cubs records at archive/replaced/, with a README closing the reconstruction episode described below. The series result is unchanged, Chicago winning the series 4-1, Montreal having won Game 2 in both playings; series runs move from 24 to 14 to 25 to 15, and both club records are unchanged. The replacement was made as a guarded manual edit under Joe&#x27;s ruling, confined to this game object, its detail file, and the series entry&#x27;s MVP line. The Series MVP stays Ron Santo, on Joe&#x27;s 2026-11-08 ruling (&quot;Keep Santo as R1-06 MVP&quot;); Santo went 0 for 5 in the adopted game, so his MVP line is recomputed from the five games as now booked and reads &quot;4 for 22, 2 R, 2 2B, 1 HR, 3 RBI, .182&quot;, where it read &quot;6 for 21, 4 R, 3 2B, 2 HR, 4 RBI, .286&quot; with the replaced game inside it. The replaced game was one of the tournament&#x27;s two lines-only games: its scorecard log under-records one base state (Top 7, whether Ron Fairly tagged at second on Orlando Cabrera&#x27;s fly out to center), its play-by-play never converted, and it carried no defense object. A box-score reconstruction PDF offered on 2026-11-08 as a cure was rejected because it rewrote two recorded plays (a Raines double became a single, and Cabrera&#x27;s fly out became a groundout advancing Fairly); Joe chose the replay cure instead, and this adopted game, played with full tracking, carries its defense object under the same replay exception as the R1-01 replays and the R1-04 Game 6 adoption. All four sources agree on every number: the linescore, the batting and pitching sums, plate appearances against batters faced for every pitcher (Montreal 45 against Brown&#x27;s 26, Sutter&#x27;s 6, Lee Smith&#x27;s 4, Strop&#x27;s 3, Marshall&#x27;s 3, and Wood&#x27;s 3; Chicago 43 against Pedro Martinez&#x27;s 25, Reardon&#x27;s 5, Rojas&#x27;s 4, Wetteland&#x27;s 3, Burke&#x27;s 3, and McGaffigan&#x27;s 3), and printed RBI (Montreal 5 for 5, Chicago 3 for 3), booked exactly as printed. No seed is printed in any source, so rng_seed is 0, as in the other adoptions. The decisions are not printed in any source and are derived by the run charges: Tim Burke takes the win (a scoreless Bottom 10, and he was the pitcher of record when Montreal took the lead in the Top 11), Sean Marshall the loss (both Top 11 runs his: Gary Carter&#x27;s single and Andre Dawson&#x27;s two-run home run), and Andy McGaffigan the save (he entered the Bottom 11 up two, threw a scoreless inning, and finished the game). Chicago scored first, in the Bottom 3: Pete Crow-Armstrong walked, stole second on the play Jose Vidro dropped Gary Carter&#x27;s throw (the game&#x27;s only error, E4), moved to third on Ryne Sandberg&#x27;s groundout, and scored on Anthony Rizzo&#x27;s single. Billy Williams&#x27;s solo home run off Pedro Martinez made it 2-0 in the Bottom 4. Montreal took the lead in the Top 6 off Mordecai Brown: Vidro singled, Larry Walker hit a two-run home run, Vladimir Guerrero grounded out, and Gary Carter homered. Chicago tied it in the Bottom 7 off Jeff Reardon: Gabby Hartnett singled, Crow-Armstrong bunted him to second, and Rizzo singled him home. The game stayed 3-3 until the Top 11, when Carter singled off Marshall and Dawson followed with a two-run home run. Brown started for Chicago (6.1 IP, 7 H, 3 R, 3 ER, 0 BB, 1 HB, 5 SO, 2 HR) and Pedro Martinez for Montreal (6.0 IP, 6 H, 2 R, 2 ER, 2 BB, 8 SO, 1 HR); twelve pitchers appeared in all. The only error is Vidro&#x27;s; Chicago turned the game&#x27;s only double play (Tim Wallach&#x27;s Top 5 grounder, Banks to Sandberg to Rizzo); Ernie Banks was caught stealing in the Bottom 4 on the hit-and-run strikeout (Carter&#x27;s throw, Cabrera covering), and Crow-Armstrong&#x27;s Bottom 3 steal is the game&#x27;s only stolen base. Wild pitch: Brown 1, as printed; passed balls: none. Crow-Armstrong&#x27;s Bottom 7 bunt is the game&#x27;s only sacrifice, and there are no sacrifice flies. Brian Schneider replaced Carter at catcher for the Bottom 11 (a graded defensive sub, below); he had no plate appearance and no fielding chance (the inning&#x27;s outs were Dawson&#x27;s fly to center, Cabrera&#x27;s 6-3 groundout, and Raines&#x27;s fly to left), so no batting or defense line is carried for him, his appearance standing in the graded log and in this record. Defensive lines are booked as a defense object in the established shape, under the replay exception above: Montreal&#x27;s 33 putouts and 14 assists and Chicago&#x27;s 33 putouts and 9 assists are exactly the printed fielding tables. Graded decisions, narrated here because final_grades stays empty as in every app-era game in this archive: Frank Chance (Chicago) 10 (5 paid off, 3 backfired, 2 neutral), the best his Top 7 change to Bruce Sutter with Wallach on third (+1.20) and the worst his Top 11 change to Sean Marshall (-1.27); Dick Williams (Montreal) 7 (4 paid off, 1 backfired, 2 neutral), his one backfire the Bottom 7 change to Jeff Reardon (-0.77), and his Bottom 11 change to McGaffigan and the Schneider defensive sub both paying off. Game 3 availability: under this adopted game Pedro Martinez threw 18 outs and Brown 19 (the replaced game had 24 and 18), both still in the unavailable band for Game 3, and every other arm threw five outs or fewer and stays free, so Game 3&#x27;s availability was honored identically under either playing; a dated provenance note is appended to Game 3&#x27;s official record, and its data stands as played. Managers: Frank Chance (Chicago) and Dick Williams (Montreal). Venue is Wrigley Field. Chicago won the series 4-1.">
