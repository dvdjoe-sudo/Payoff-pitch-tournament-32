  <meta name="description" content="Losers Bracket, Round 2, Series 2, Game 6 at Olympic Stadium, as the master export&#x27;s box header and the Rec print the venue, &quot;OLYMPIC STADIUM (neutral)&quot;. The L2-02 series was formed with Game 1: #7 Atlanta Braves (manager Bobby Cox) against #27 Montreal Expos (manager Dick Williams), home pattern Atlanta for Games 1, 2, 5 and 7, Montreal for Games 3, 4 and 6. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the narrative play log, the graded play-by-play with its manager decisions and decisions summary, and the full Rec JSON (W ATL|maddugr01, L MON|rogerst01, no save; the Rec carries no extra list at all, and no injuries field). The export&#x27;s filename and header date read 2026-11-22, but the Rec&#x27;s recorded stamp is 2026-11-22T00:46:15Z, 4:46 PM PT on 2026-11-21, and that is the played date the book carries. Atlanta won 6-3; the series is tied 3-3 and Game 7 in Atlanta decides it, with the loser eliminated. Decisions: Greg Maddux takes the win for Atlanta with a complete game (9.0 IP, 38 BF, 11 H, 3 R, 3 ER, 3 BB, 5 SO, no home runs allowed); Steve Rogers takes the loss for Montreal (6.2 IP, 28 BF, 5 H, 5 R, 5 ER, 3 BB, 9 SO, 2 HR, 1 HBP, 1 WP). Woodie Fryman (2.1 IP, 8 BF, 1 H, 1 ER, 1 SO, 1 HR) finished the 7th through the 9th for Montreal. Player of the game: Ronald Acuna Jr., 2 for 4 with two home runs, 4 RBI and 2 runs scored. Scoring: Atlanta&#x27;s top of the 1st scored three off Rogers: Rabbit Maranville was hit by a pitch, Chipper Jones walked, and Acuna hit a three-run home run, 3-0. The top of the 7th scored two more off Rogers: Andruw Jones walked, Ozzie Albies struck out, and Maranville hit a two-run home run, 5-0; Fryman relieved Rogers after the homer and finished the inning. The top of the 8th scored Atlanta&#x27;s last run, Acuna&#x27;s solo home run off Fryman, 6-0. Montreal&#x27;s three runs all came in the bottom of the 9th off Maddux: Vladimir Guerrero singled, Gary Carter struck out, Andre Dawson singled, Ron Fairly grounded out on the hit and run with the runners taking second and third, Tim Wallach doubled home both runners, Orlando Cabrera&#x27;s single scored Wallach, Tim Raines singled, and Jose Vidro grounded out to end it, 6-3. The extra list: the Rec carries no extra field for this game, so there is nothing to book for one: no holds (Maddux pitched a complete game, and Fryman entered with the bases empty down 5-0), no blown saves, and no inherited-runner lines (Fryman was the game&#x27;s only reliever and entered after Maranville&#x27;s home run with nobody on). Errors: none, an errorless game; team_errors reads ATL 0, MON 0, confirmed by the play rows&#x27; rebuilt error count (0/0), the printed fielding sections, the batting CSV&#x27;s E column and the Rec fld array alike, and errors_by is empty. Double plays: two, one by each club. Montreal turned the first: Maranville&#x27;s top-of-the-5th grounder to second (row seq 34, coded &quot;DP 4-6-3&quot;), matching Maranville&#x27;s printed GIDP 1 and Montreal&#x27;s printed team DP 1 (Jose Vidro, Orlando Cabrera and Ron Fairly each carry DP 1 in the fielding section as the chain&#x27;s fielders). Atlanta turned the second: Rusty Staub&#x27;s bottom-of-the-6th grounder to short (row seq 45, coded &quot;DP 6-4-3&quot;), matching Staub&#x27;s printed GIDP 1 and Atlanta&#x27;s printed team DP 1 (Rabbit Maranville, Ozzie Albies and Freddie Freeman each carry DP 1 as the chain&#x27;s fielders). So no GIDP-practice divergence arises in this game. The bottom of the 2nd also produced a double play that is not a DP-coded row: on the hit and run, Carter struck out and Guerrero was caught stealing on the same play (row seq 15, coded K, outs 0 to 2, the row&#x27;s run_event printing &quot;CS|MON|guerrvl01&quot;); no GIDP is charged, exactly as printed, and it is booked exactly as the row prints it. Stolen bases: none successful by either club. Caught stealing: two, both Montreal runners thrown out by Del Crandall: Raines in the bottom of the 1st (row seq 7, a graded steal send that backfired) and Guerrero in the bottom of the 2nd on the hit and run. The catching lines as printed: Del Crandall, PB 0, SB against 0, CS 2 (100%) for Atlanta; Gary Carter, PB 0 and nothing against for Montreal. Defensive lines are booked in the established shape from the printed fielding section (Atlanta 27 putouts and 12 assists with DP 1: Freeman 10 putouts at first with DP 1, Andruw Jones 6 putouts, Crandall 5 putouts and 2 assists catching, Maranville 2 putouts and 4 assists with DP 1, Albies 2 putouts and 3 assists with DP 1, Acuna 2 putouts, Mathews 3 assists; Maranville also carries RO 1 and GDP 1 as printed, from the bottom-of-the-8th Staub groundout, a great play at short with nobody on; Montreal 27 putouts and 6 assists with DP 1: Carter 10 putouts catching, Fairly 6 putouts at first with DP 1, Raines 5 putouts, Wallach 2 putouts and 2 assists, Dawson 2 putouts, Staub 1 putout, Cabrera 1 putout and 2 assists with DP 1, Vidro 2 assists with DP 1). Substitutes: none for either club; all eighteen starters played the whole game. Wild pitches: one, Steve Rogers in the top of the 2nd (row seq 13, during Maranville&#x27;s plate appearance; Dale Murphy advanced to second on it); it scored nobody and is carried in Montreal&#x27;s defense wp map as printed. Passed balls: none. Hit by pitch: one, Maranville by Rogers to open the game. Counting checks: Atlanta plate appearances 36 (32 AB, 3 BB, 1 HBP) equal Montreal&#x27;s 36 batters faced (Rogers 28, Fryman 8); Montreal plate appearances 38 (35 AB, 3 BB) equal Atlanta&#x27;s 38 batters faced (Maddux 38). Hit, walk, home run and strikeout totals tie across the two boxes both ways (Atlanta batting strikeouts 10 = Rogers 9 + Fryman 1; Montreal batting strikeouts 5 = Maddux 5; Atlanta home runs 3 = Rogers 2 (Acuna, Maranville) + Fryman 1 (Acuna); Montreal home runs 0 = Maddux 0). Team RBI equals team runs both ways (Atlanta 6, Montreal 3), and staff earned runs tie exactly both ways (Montreal staff 6 ER against Atlanta&#x27;s 6 runs; Atlanta staff 3 ER against Montreal&#x27;s 3 runs). Manager grades: the grades list names both managers directly, so no label mapping is needed. Dick Williams graded 4 decisions (2 paid off, 2 backfired): 1 steal (backfired: Raines sent in the bottom of the 1st and caught stealing), 2 hit and runs (the bottom-of-the-2nd one backfired, Carter striking out with Guerrero caught stealing on the play; the bottom-of-the-9th one paid off, Fairly&#x27;s groundout moving the runners to second and third with three runs scoring in the inning) and 1 pitching change (paid off: Fryman for Rogers in the top of the 7th, one run the rest of the way). Bobby Cox graded 1 decision, neutral: 1 left-pitcher-in (Maddux left in for the bottom of the 9th; Raines singled after Cabrera&#x27;s RBI single but no further run scored and Maddux finished his complete game). Availability: Game 5&#x27;s unavailable pair, Javier Vazquez (16 outs) and Tom Glavine (18 outs), and its capped pitcher, Andy McGaffigan (8 outs, capped at 3), appear nowhere in this game, and the Rec&#x27;s own unavailable block lists all three among its rest and house-rule entries. Woodie Fryman was free: his Game 2 throw of 6 outs capped him for Game 3 only under the standing convention (the game in which he recorded 6 outs over the cap, booked as played), and he sat Games 4 and 5 out. Game 7 availability, from this game&#x27;s outs: Greg Maddux (27 outs) and Steve Rogers (20 outs) both threw 9 or more outs and are unavailable for Game 7; Woodie Fryman (7 outs) is capped at 3 outs; everyone else on both staffs is free. The series is tied 3-3 and stands at 33 runs for Montreal and 31 for Atlanta; Atlanta stands 10-7 in games and 1-1 in series, Montreal 8-9 in games and 1-1 in series. Game 7 is in Atlanta and the loser of this series is eliminated. Managers: Dick Williams (Montreal) and Bobby Cox (Atlanta). Venue is Olympic Stadium.">
