 tripled and scored on Albert Pujols&#x27;s groundout to first; Edmonds walked and Mark McGwire hit a two-run home run off Johnson; Alfonseca relieved, Molina walked, Boyer singled, Smith doubled home both runners, and Stan Musial doubled home Smith, 11-0. The bottom of the 7th, Boyer homered off Alfonseca, 12-0. The bottom of the 8th, Edmonds singled and McGwire hit his second two-run home run, 14-0. One St. Louis run carries no RBI: the Hornsby run in the 5th scored on Pujols&#x27;s groundout, the play log and the play row (seq 40) credit the run, and Pujols&#x27;s printed RBI is 0, so St. Louis&#x27;s 14 runs carry 13 RBIs and the printed lines stand exactly as played. Miami never advanced a runner past second: its four hits were Luis Castillo&#x27;s 1st-inning single, Miguel Cabrera&#x27;s singles in the 5th and 7th, and J.T. Realmuto&#x27;s 6th-inning double. Errors: none, an errorless game both ways, confirmed by the play rows&#x27; rebuilt error count (MIA 0 / STL 0). Double plays: one per club, each matching its printed GIDP line: Hornsby grounded into Miami&#x27;s in the bottom of the 1st (Ramirez to Castillo to Conine) and Hanley Ramirez grounded into St. Louis&#x27;s in the top of the 7th (Smith to Hornsby to Pujols), both DP 6-4-3 in the rows. Stolen bases: Smith 2 (bottom of the 1st and 7th) and Medwick 1 (bottom of the 2nd); caught stealing: Castillo in the top of the 1st (thrown out at second on the hit and run as Sheffield struck out) and Musial in the bottom of the 3rd. The catching lines as printed: Realmuto PB 0, 4 steal attempts against, 3 stolen bases, 1 caught stealing; Molina PB 0, 1 attempt against, 0 stolen bases, 1 caught stealing (Castillo). Defensive lines are booked in the established shape from the printed fielding section (Miami 24 putouts and 7 assists, Conine 9 putouts at first, Realmuto 4 putouts and 1 assist catching, and Conine carries a run-out in the Rec fld row from the Pujols groundout play; St. Louis 27 putouts and 9 assists, Molina 8 putouts and 1 assist catching, Pujols 6 putouts, Hornsby 4 putouts and 3 assists). Substitutes: Ted Simmons pinch-hit for Molina in the bottom of the 7th and stayed in at catcher (1 putout, 0 for 2 at the plate). Wild pitches: none. Passed balls: none. Hit by pitch: none. Counting checks: Miami plate appearances 32 (29 AB, 3 BB) equal Gibson&#x27;s 32 batters faced; St. Louis plate appearances 44 (39 AB, 5 BB) equal Miami&#x27;s 44 batters faced (Johnson 25, Alfonseca 19). Hit, walk, home run and strikeout totals tie across the two boxes both ways. Manager grades: the grades list names both managers directly, so no label mapping is needed. Jack McKeon graded 8 decisions (0 paid off, 6 backfired, 2 neutral): 2 hit and runs (both backfired), 5 left-pitcher-in (3 backfired, 2 neutral) and 1 pitching change (backfired, Alfonseca in the 5th). Tony La Russa graded 5 decisions (1 paid off, 2 backfired, 2 neutral): 4 steals (1 paid off, 2 backfired, 1 neutral) and 1 pinch hitter (neutral, Simmons). Availability was clean entering the series: a new series resets availability, so nothing carried in from W2-05 or L1-01. Game 2 availability, from this game&#x27;s outs: Gibson (27 outs), Johnson (14 outs) and Alfonseca (10 outs) all threw 9 or more outs and are unavailable for Game 2. St. Louis leads the series 1-0 and improves to 6-4 in games and 1-1 in series; Miami falls to 4-7 in games and 1-1 in series. The loser of this series is eliminated. Managers: Tony La Russa (St. Louis) and Jack McKeon (Miami). Venue is Busch Stadium, as printed.">
