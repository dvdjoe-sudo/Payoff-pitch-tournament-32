  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as the app scorecard PDF plus the full graded play-by-play text on 2026-10-29; official R1-07 Game 4 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Box score record: the two sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every number. The decisions are not printed; they are derived from the play log (John Smoltz pitched 7 innings, allowed both San Diego runs, and left with an 11-2 lead Atlanta never lost, taking the win; Andy Ashby was charged with 7 runs in 5 innings and took the loss; no save, an 11-2 game). San Diego scored first, Fernando Tatis Jr. doubling in the 1st and coming home on Dave Winfield&#x27;s single, but Atlanta answered at once: Dale Murphy and Freddie Freeman hit back to back solo homers off Ashby in the 2nd. Atlanta&#x27;s 3-run 3rd came on Chipper Jones&#x27;s double, Andrelton Simmons&#x27;s single, Hank Aaron&#x27;s RBI double, Eddie Mathews&#x27;s RBI single, and a run scoring on Murphy&#x27;s double play ball; Atlanta&#x27;s printed RBI total is 10, not 11, because a run scoring on a double play earns no RBI, exactly as the card prints it, and the tables below carry it that way. Gary Sheffield&#x27;s RBI single in the 3rd made it 5-2, the last San Diego run. Murphy&#x27;s 2-run homer off Ashby in the 5th made it 7-2, Freeman&#x27;s 3-run homer off Rollie Fingers in the 7th made it 10-2, and Murphy&#x27;s RBI single off Trevor Hoffman in the 9th closed the scoring. Murphy finished 4 for 5 with 2 homers and 4 RBI; Freeman 3 for 5 with 2 homers and 4 RBI; Aaron 3 for 5 with two doubles. Atlanta hit four homers, all off Ashby (3) and Fingers (1); San Diego hit none, and Tatis&#x27;s double was its only extra-base hit. No errors by either club and no stolen bases. No hit batters: the scorecard grid prints HBP 0 for all seven pitchers, so HB
