  <title>R1-11-G6: Philadelphia Phillies 4, Oakland Athletics 5</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-02: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-11 Game 6 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Philadelphia Phillies (seed 11) vs Oakland Athletics (seed 22), home pattern 2-2-1-1-1, Game 6 at RingCentral Coliseum in Oakland, and Oakland wins the series 4-2 with this win. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number, with no run-accounting knot and no settlement needed. The decisions are not printed; they are derived from the play log and the run charges on the card. Rollie Fingers takes the win: he entered the Top 9 of a 4-4 game with two out and runners at first and second, walked Howard to load the bases, and got Utley to ground out, and he was Oakland&#x27;s pitcher of record when the walk-off run scored in the Bottom 9; it is his second win of the series, both in relief (also Game 3). Both starters took no-decisions. Catfish Hunter (7.0 IP, 11 H, 4 ER, 1 BB, 4 SO) left after the Top 7 with Oakland trailing 4-3, all four of his runs in the Top 5. Robin Roberts (7.0 IP, 8 H, 4 ER, 2 BB, 5 SO, 1 HR, WP 1) started the Bottom 8 and gave McGwire the tying home run without recording an out before Lidge relieved him, so his line stays at 7.0 innings with four earned runs charged. Jonathan Papelbon takes the loss: he entered the Bottom 9 tied 4-4, retired Henderson and Chavez, and gave up Jackson&#x27;s walk-off home run (0.2 IP, 1 H, 1 ER, 1 HR). No save: the game ended on the walk-off. Both starters were making their second start of the series on the Game 6 turn (Hunter started Game 1, Roberts Game 2), each with three full games of rest since his first start and neither having pitched since, fully legal under the house availability convention. Run charges match the printed lines exactly: Oakland pitching allows 4 + 0 + 0 + 0 = 4 (Hunter all four, Hendriks, Doolittle and Fingers none), and Philadelphia pitching allows 4 + 0 + 1 = 5 (Roberts four, Lidge none, Papelbon the walk-off run). The charge detail: Hunter&#x27;s four are Rollins (doubled), Klein (walked), Schmidt and Harper in the Top 5, Schmidt&#x27;s two-run double scoring Rollins and Klein, Harper&#x27;s single scoring Schmidt, and Utley&#x27;s single scoring Harper, all four runs with two out. Roberts&#x27;s four are Ellis and Bando in the Bottom 3 (McGwire&#x27;s two-run double), Ellis again in the Bottom 5 (Jackson&#x27;s single), and McGwire in the Bottom 8 (the tying home run); Papelbon&#x27;s one is Jackson&#x27;s walk-off home run in the Bottom 9. Printed RBI ties as printed with no settlement: Philadelphia 4 (Schmidt 2, Harper 1, Utley 1) against 4 runs, and Oakland 5 (McGwire 3, Jackson 2) against 5 runs. The duplicate test ran before the number was assigned: the stored R1-11 games are Game 1 (Oakland 11, Philadelphia 5), Game 2 (Oakland 15, Philadelphia 11), Game 3 (Oakland 3, Philadelphia 2), Game 4 (Philadelphia 5, Oakland 2) and Game 5 (Philadelphia 2, Oakland 0), none sharing this game&#x27;s final score or linescore, so this box score is no duplicate, and this is the sixth game of the series in play order, booked as Game 6. The game: Hunter and Roberts traded two scoreless innings, then Oakland struck in the Bottom 3: Ellis singled, Henderson flied out, Bando singled, Jackson&#x27;s grounder moved both runners up, and McGwire doubled them both home. Philadelphia&#x27;s answer came with two out in the Top 5: Rollins doubled, and after Ashburn&#x27;s grounder moved him to third and Callison popped out, Klein walked, Schmidt doubled both home, Harper singled Schmidt home, Howard singled, and Utley singled Harper home before Daulton grounded out, four runs on five hits in the inning. Oakland got one back in the Bottom 5: Ellis singled, Henderson&#x27;s at-bat was extended when Daulton dropped his foul pop (the game&#x27;s only error), Henderson flew out anyway, Bando flew out, and Jackson singled Ellis home for 4-3. It stayed there through the seventh: Williams pinch-hit Chavez for Bando with two on in the Bottom 7 and Jackson struck out to strand them, and Hendriks struck out two in a scoreless Top 8. McGwire led off the Bottom 8 with the tying home run off Roberts, Lidge relieved and finished the inning with Oakland stranding runners at first and third, and in the Top 9 Doolittle struck out Callison, gave up Klein&#x27;s single, and watched Schmidt force Klein at second before Delahanty pinch-hit for Harper and walked; Fingers came on, walked Howard to load the bases, and got Utley to ground out to end the threat. In the Bottom 9 Papelbon retired Henderson and Chavez, and Jackson homered to left-center to end the game and the series. Home runs: Oakland two, McGwire (Bottom 8, solo, the tying run) and Jackson (Bottom 9, solo, the walk-off); Philadelphia none. Doubles: Schmidt, Howard and Rollins for Philadelphia and McGwire for Oakland; no triples. Errors: Philadelphia one, Daulton, the dropped foul pop in the Bottom 5 that extended Henderson&#x27;s at-bat; Henderson flew out anyway, no run resulted, and all five Oakland runs are earned. Oakland played errorless ball. Hit batters: none; every pitcher&#x27;s HBP column on both grids reads zero and no batter on either side was hit, so HB 0 is carried for every pitcher as card-sourced values and the hit batter check runs on real data. Wild pitches: Robin Roberts 1, printed on the card; no run scored on it, and all five Oakland runs are accounted for by hits. Sacrifices: none; there was no bunt and no sacrifice fly on either side, so the split lines read SH 0 and SF 0 for every batter, log-proven. Stolen bases and caught stealing: none; the printed SB and CS columns are 0 for both clubs. Manuel sent Klein in the Top 9 and it was graded backfired, but Klein did not get a good jump and stayed put, so it is not a steal attempt on the record. Double plays grounded into, counted from the play log: none by either club; the log records forceouts (Murphy and Steinbach in the Bottom 2, Callison in the Top 3 and Top 6, Schmidt in the Top 9) but no double play, and the card extras list none. Substitutions: Chavez pinch-hit for Bando in the Bottom 7 and stayed in at third base (0 for 2), and Delahanty pinch-hit for Harper in the Top 9 and walked, carrying the printed batting line AB 0, R 0, BB 1; Harper&#x27;s designated hitter spot did not bat again. Batters faced are counted from the play log and tie to the batting PA totals both ways (Philadelphia 43 PA against 43 Oakland BF: Hunter 33, Hendriks 4, Doolittle 4, Fingers 2; Oakland 39 PA against 39 Philadelphia BF: Roberts 31, Lidge 5, Papelbon 3). Philadelphia PA is AB 39 plus BB 4; Oakland PA is AB 37 plus BB 2; Philadelphia recorded only 26 outs because the Bottom 9 ended on the walk-off with one out still unused. Eight decisions were graded. Dick Williams made 4 (2 paid off, 1 backfired, 1 neutral): the Top 8 change to Hendriks and the Top 9 change to Doolittle paid off at +0.73 each, the Bottom 7 pinch hitter Chavez backfired at -1.13, the game&#x27;s worst grade, and the Top 9 change to Fingers was neutral at +0.18. Charlie Manuel made 4 (1 paid off, 1 backfired, 2 neutral): the Bottom 8 change to Lidge paid off at +0.73, the Top 9 steal send backfired at -0.51 on the held runner, the Top 9 pinch hitter Delahanty was neutral at +0.03, and the Bottom 9 change to Papelbon was neutral at -0.27. Managers: Dick Williams (Oakland) and Charlie Manuel (Philadelphia). Venue is RingCentral Coliseum. Availability compliance: Zito (15 outs in Game 5) and Carlton (24 outs) were unavailable under the house convention and correctly did not pitch. Series runs: Oakland 36, Philadelphia 29. Oakland wins the series 4-2 and advances on the winners side; Philadelphia drops to the losers side at 0-1 in series and is not eliminated. No series MVP is recorded; the MVP slot on the series entry stays open pending Joe&#x27;s ruling.">
