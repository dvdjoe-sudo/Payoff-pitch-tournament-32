  <title>R1-09-G1: Texas Rangers 7, Cincinnati Reds 4</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-10-31: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-09 Game 1 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. This game opens the series: Cincinnati Reds (seed 9) vs Texas Rangers (seed 24), home pattern 2-2-1-1-1, Game 1 at Great American Ball Park. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number. The decisions are not printed; they are derived from the play log (Nolan Ryan takes the win: Texas took the lead for good in the Top 3 on Frank Howard&#x27;s RBI single and Ryan pitched 7 innings; Noodles Hahn takes the loss as the starter charged with the go-ahead runs; Jeff Zimmerman takes the save: John Wetteland opened the Bottom 9 at 7-2 and gave up a walk and George Foster&#x27;s 2-run home run without recording an out, and Zimmerman entered at 7-4 with the bases empty and pitched the full scoreless inning, a save under the lead-of-three-plus-one-inning condition, the same condition as Melancon&#x27;s R1-08 Game 5 save). A clean game in the field: no errors, no sacrifices and no sacrifice flies for either club; Adrian Beltre&#x27;s Top 4 RBI groundout is a plain groundout, not a sacrifice. Johnny Bench opened the scoring with a solo home run off Ryan in the Bottom 2. Texas answered in the Top 3: Corey Seager and Ian Kinsler hit back-to-back doubles to tie it, and Howard&#x27;s 2-out single put Texas ahead to stay. Beltre&#x27;s groundout scored Juan Gonzalez in the Top 4 for 3-1, and Gonzalez&#x27;s solo home run off Eppa Rixey in the Top 6 made it 4-1; Gonzalez finished 4 for 4 with a double, the home run and 3 runs scored, and he was also caught stealing in the 2nd. Pete Rose&#x27;s solo home run off Ryan in the Bottom 6 cut it to 4-2. Texas added two in the Top 8 off Francisco Cordero on doubles by Gonzalez and Rafael Palmeiro and a single by Beltre, and one more in the Top 9 off John Franco: Ian Kinsler was hit by a pitch, Ivan Rodriguez singled, Kinsler was retired on the bases on Alex Rodriguez&#x27;s flyout, and Howard&#x27;s single scored Ivan Rodriguez for 7-2. Ryan&#x27;s line: 7.0 innings, 4 hits, 2 earned runs, 4 walks, 7 strikeouts, home runs allowed to Bench and Rose. The Bottom 9 nearly flipped it: Wetteland walked Joey Votto and Foster hit a 2-run home run, the closer call graded backfired at -1.77, before Zimmerman retired Ted Kluszewski, Eric Davis and Barry Larkin in order. Batters faced settlement: batters faced are counted from the play log. The log&#x27;s ordering and the printed hit lines agree that Adrian Beltre&#x27;s Top 8 single was hit off Cordero (the single is logged before Franco&#x27;s entry, and the card charges Cordero with 3 hits, Beltre&#x27;s among them, and Franco with 2), so Cordero is booked at 5 batters faced and Franco at 6; the club total is 41 either way and ties to Texas&#x27;s 41 plate appearances. Wild pitch: the card charges Franco with 1 wild pitch; a wild pitch is not a stored archive field and is noted here only. Hit batter: Kinsler, hit by Franco in the Top 9, a card-sourced value carried in the tables below (Franco HB 1, every other pitcher 0), so the hit batter check runs on real data. Stolen bases and caught stealing, as printed: Kinsler stole second in the Top 1; Gonzalez was caught stealing in the Top 2; Frank Robinson was caught stealing in the Bottom 6 and Eric Davis was caught stealing in the Bottom 3 on the strikeout double play. Double plays grounded into: Hamilton, Top 5, Texas&#x27;s only one; Cincinnati grounded into none (the Bottom 3 play was a strikeout with Davis thrown out stealing, not a GIDP). Substitution: Ted Kluszewski pinch-hit for Tony Perez in the Bottom 7 and stayed in as the DH, batting again in the Bottom 9; he finished 0 for 2. Basepath chaos graded all night: 18 decisions total. Ron Washington made 8 (2 paid off, 5 backfired, 1 neutral): both Top 1 hit and run calls backfired, his three steal sends produced two backfires and one neutral, but the Feliz change in the Bottom 8 and the Zimmerman change in the Bottom 9 both paid off; the Wetteland closer call backfired at -1.77. Sparky Anderson made 10 (4 paid off, 6 backfired): the Rixey, Dibble and Franco pitching changes paid off, the Cordero change backfired at -1.27 when Texas scored its 2 Top 8 runs, his Bottom 3 hit and run became a strikeout double play, the Kluszewski pinch hit backfired, and his four steal sends produced one paid off (Bottom 9, the Foster home run inning) against three held or thrown out. Game 2 availability under the house outs convention, read off this game only: Ryan threw 21 outs and Hahn 10 outs, so both would be unavailable for Game 2; Rixey threw 8 outs and would be capped at 3 outs; Wetteland threw 0 outs and is free; the rotations turn over to each club&#x27;s number 2 starter for Game 2 in any case. Managers: Ron Washington (Texas) and Sparky Anderson (Cincinnati). Venue is Great American Ball Park. Texas leads the series 1-0.">
