  <meta name="description" content="Winners Bracket, Round 3, Series 1, Game 2 at Yankee Stadium, as the master export&#x27;s box score prints the venue, &quot;YANKEE STADIUM&quot;. The series was formed with the Game 1 booking by reseeding the eight Winners Round 2 winners by original tournament seed, highest against lowest: New York (seed 1) against Cleveland (seed 13), Yankees home for Games 1, 2, 5 and 7. Booked from the single master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections, inside the game&#x27;s Rec record), the native PLAYS (JSON) rows, the narrative play log, the graded play-by-play with its manager decisions and decisions summary, and the full Rec JSON (W NYY|ruffire01, L CLE|covelst01, no save; the Rec extra list carries one inherited-runner line). The export&#x27;s filename and header date read 2026-11-22, and the Rec&#x27;s recorded stamp is 2026-11-22T05:25:48Z; the book carries the header date, 2026-11-22. New York won 8-2 and leads the series 2-0. Decisions: Red Ruffing takes the win for New York with a complete game (9.0 IP, 34 BF, 6 H, 2 R, 2 ER, 2 BB, 8 SO); Stan Coveleski takes the loss for Cleveland (4.1 IP, 20 BF, 5 H, 4 R, 3 ER, 2 BB, 2 SO). Cade Smith relieved in the fifth (1.2 IP, 9 BF, 2 H, 1 R, 1 ER, 2 BB, 3 SO, WP 1), Emmanuel Clase pitched a scoreless seventh (1.0 IP, 5 BF, 1 H, 1 SO), and Doug Jones pitched the eighth (1.0 IP, 6 BF, 2 H, 3 R, 3 ER, 1 BB, 2 SO, 1 HR). Red Ruffing is the export&#x27;s player of the game. Scoring: the bottom of the 2nd, Lou Gehrig singled, Mickey Mantle grounded into a double play, Joe DiMaggio reached on Coveleski&#x27;s error, Alex Rodriguez reached on Jose Ramirez&#x27;s error, and Yogi Berra&#x27;s single scored DiMaggio, 1-0 (the run unearned, DiMaggio having reached on the pitcher&#x27;s own error). The bottom of the 3rd, Derek Jeter walked, Aaron Judge flied out, Babe Ruth&#x27;s triple scored Jeter, Gehrig walked, and Mantle lined to third base, Ruth doubled off third to end the inning, 2-0. The bottom of the 4th, DiMaggio doubled and Berra&#x27;s groundout scored him, 3-0. The bottom of the 5th scored two: Jeter grounded out, Judge singled off Coveleski, Cade Smith relieved, Ruth singled, Gehrig struck out, and Mantle&#x27;s single scored Judge and Ruth (Smith&#x27;s wild pitch inside the plate appearance advanced both runners first; no run scored on the pitch itself), 5-0. The top of the 7th, Jim Thome doubled and Manny Ramirez&#x27;s double scored him, 5-1. The top of the 8th, Lou Boudreau doubled, Victor Martinez walked, Tris Speaker grounded into a double play, and Nap Lajoie&#x27;s double scored Boudreau, 5-2. The bottom of the 8th scored three off Doug Jones: Berra singled, Willie Randolph struck out, Jeter walked, Judge struck out, and Ruth hit a three-run home run, 8-2. Ruffing closed it in the ninth: Manny Ramirez singled, Shoeless Joe Jackson flied out, Albert Belle struck out, and Jose Ramirez flied out. The extra list, exactly as printed: one line, inherited runners for Cade Smith 1/1 (Judge, aboard when he relieved Coveleski with one out in the bottom of the 5th, scoring on Mantle&#x27;s single). No holds and no blown saves; Clase and Doug Jones both entered with the bases empty. Errors: Cleveland 3, New York 0, confirmed by the play rows&#x27; rebuilt error count (CLE 3 / NYY 0), the printed fielding sections, the batting CSV&#x27;s E column and the Rec fld array alike, and team_errors reads CLE 3, NYY 0. Coveleski made the first, in the bottom of the 2nd (DiMaggio reached on it); Jose Ramirez made the other two, in the bottom of the 2nd (Rodriguez reached) and the bottom of the 7th (Mantle reached). One run was unearned: the bottom-of-the-2nd run, DiMaggio, who reached on Coveleski&#x27;s own error and scored on Berra&#x27;s single; Coveleski&#x27;s printed line (4 R, 3 ER) carries it. Double plays: one per club, each matching its printed GIDP line: Mantle grounded into Cleveland&#x27;s in the bottom of the 2nd (play row seq 10, coded &quot;DP 6-4-3&quot;; Boudreau, Lajoie and Thome each carry DP 1 in the fielding section as the chain&#x27;s fielders) and Speaker grounded into New York&#x27;s in the top of the 8th (row seq 65, coded &quot;DP 4-6-3&quot;; Jeter, Randolph and Gehrig each carry DP 1 as printed). One further play is documented under Joe&#x27;s standing GIDP practice (2026-11-10: play rows govern, the printed book line stays, the difference is documented in the official record; this is the sixteenth such case in the book): the bottom of the 3rd, row seq 23, Mantle lined to third base with Ruth on third and Gehrig on first, one out; the row records outs 1 to 3 with Ruth doubled off third (bases X-X to X--), a double play in the rows that is not a GIDP: no GIDP is charged on a line-drive double-off, and Mantle&#x27;s only printed GIDP is the bottom-of-the-2nd grounder. Cleveland&#x27;s printed team DP total stays 1 and Jose Ramirez, the third baseman who took the liner, carries no DP flag in the printed fielding line. The defense object is booked exactly as printed and the converted plays string carries the row as it stands. Stolen bases: none attempted by either club; no caught stealings. The catching lines as printed: Yogi Berra, PB 0 and nothing against; Victor Martinez, PB 0 and nothing against. Defensive lines are booked in the established shape from the printed fielding section (Cleveland 24 putouts and 9 assists, 3 errors, team DP 1: Martinez 9 putouts catching, Thome 7 putouts and DP 1, Speaker 4 putouts, Lajoie 1 putout and 4 assists with DP 1, Boudreau 1 putout and 2 assists with DP 1, Jose Ramirez 1 putout and 3 assists with 2 errors, Belle 1 putout, Coveleski 1 error; New York 27 putouts and 5 assists, no errors, team DP 1: Berra 8 putouts catching, Gehrig 7 putouts and DP 1, Judge 4 putouts, Lazzeri 2 putouts and 1 assist, DiMaggio 2 putouts, Mantle 2 putouts, Jeter 1 putout and 2 assists with DP 1, Rodriguez 1 assist, Randolph 1 assist and DP 1 as printed, Bernie Williams 1 putout). Substitutes: Willie Randolph replaced Tony Lazzeri at second base for the top of the 7th (Stengel&#x27;s graded defensive sub) and struck out in the bottom of the 8th; he carries a batting line (0 for 1) and a fielding line as printed. Bernie Williams replaced DiMaggio in center field for the top of the 8th (Stengel&#x27;s other graded defensive sub); he carries a fielding line (1 putout) but no batting line in the box score, the CSV sections or the Rec arrays, so none is booked for him, exactly as printed (the mirror of his Game 1 appearance, where he batted but had no fielding line). Cleveland used no substitutes; Tris Speaker started in center field for Cleveland with Kenny Lofton sitting. Wild pitches: one, Cade Smith in the bottom of the 5th (inside play row seq 39, during Mantle&#x27;s plate appearance; it advanced Judge and Ruth one base and scored nobody), carried in Cleveland&#x27;s defense wp map as printed. Passed balls: none. Hit by pitch: none. Counting checks: Cleveland plate appearances 34 (32 AB, 2 BB) equal Ruffing&#x27;s 34 batters faced; New York plate appearances 40 (35 AB, 5 BB) equal Cleveland&#x27;s 40 batters faced (Coveleski 20, Smith 9, Clase 5, Jones 6). Hit, walk, home run and strikeout totals tie across the two boxes both ways (Cleveland batting strikeouts 8 = Ruffing 8; New York batting strikeouts 8 = Coveleski 2 + Smith 3 + Clase 1 + Jones 2; Cleveland home runs 0; New York home runs 1, Ruth off Jones). Team RBI: Cleveland 2, equal to its runs; New York 8, equal to its runs. Staff earned runs: Cleveland&#x27;s staff 7 ER against New York&#x27;s 8 runs (the one unearned run above); New York&#x27;s staff 2 ER against Cleveland&#x27;s 2 runs, both earned. Manager grades: the grades list names both managers directly, so no label mapping is needed. Terry Francona graded 4 decisions (2 paid off, 2 backfired): 3 pitching changes (1 paid off: Clase for the 7th; 2 backfired: Cade Smith for the 5th and Doug Jones for the 8th) and 1 left-pitcher-in (paid off: leaving Jones in for the rest of the 8th). Casey Stengel graded 2 decisions (0 paid off, 2 backfired): 2 defensive subs, both graded backfired (Randolph in at second for the 7th and Bernie Williams in center for the 8th; both innings were clean in the field, but Cleveland scored in each). Availability was compliant: Game 1&#x27;s unavailable four (Feller 14 outs, Wynn 9, Ford 12, Righetti 14) appear nowhere in this game, and Andy Pettitte also sat, the Rec&#x27;s own unavailable block listing all five (the four on the rest chart and Pettitte under the house rule for a starter already used in relief once this series). Game 3 availability, from this game&#x27;s outs: Coveleski (13 outs) and Ruffing (27 outs) threw 9 or more outs and are unavailable for Game 3; Cade Smith (5 outs), Clase (3 outs) and Doug Jones (3 outs) all stayed under 6 outs and are free; no pitcher fell in the 6-to-8-out capped band. New York leads the series 2-0 and improves to 10-2 in games and 2-0 in series; Cleveland falls to 8-6 in games and stands 2-0 in series. The series moves to Cleveland for Game 3. The loser of this series drops to the losers bracket. Managers: Casey Stengel (New York) and Terry Francona (Cleveland). Venue is Yankee Stadium, as printed.">
