  <title>W2-04-G1: Chicago White Sox 7, Detroit Tigers 6</title>
  <meta name="description" content="Winners Bracket, Round 2, Series 4, Game 1 at Comerica Park. This booking forms the series in its archive slot: Detroit, the #4 seed, against Chicago, the #14 seed, the reseeded Winners Round 2 pairing, with Detroit home for Games 1, 2, 5 and 7. Booked from the master export file, played by Joe in the app: the report, the box score text, the full CSV block (linescore, batting, pitching, and fielding sections), the native PLAYS (JSON) rows, the graded play-by-play log with its manager decisions and decisions summary, and the full Rec JSON. Decisions: Ed Walsh takes the win for Chicago (5.2 IP, 24 BF, 5 H, 3 R, 2 ER, 1 BB, 1 SO, 1 HR). Hal Newhouser takes the loss for Detroit (6.1 IP, 29 BF, 6 H, 6 R, 6 ER, 5 BB, 9 SO, 2 HR): both Chicago home runs came off him. There is no save: Keith Foulke takes a hold in the Rec&#x27;s extra line (1.1 IP, 4 BF, 0 H, 1 SO), entering in the bottom of the 6th with two inherited runners and stranding both (the Rec&#x27;s extra line reads 2 inherited, 0 scored), and Eddie Cicotte pitched the last two innings, entering with a four-run lead so no save was available; he allowed Detroit&#x27;s three-run 9th and finished the game. Scoring: Detroit scored first, Hank Greenberg&#x27;s solo home run in the bottom of the 2nd. Chicago&#x27;s four-run top of the 3rd decided it: Luke Appling tripled, Carlton Fisk walked, Eddie Collins singled Appling home, and Frank Thomas hit the three-run home run the export&#x27;s summary names as the decisive play. Detroit answered in the bottom of the 3rd when Alan Trammell reached on Robin Ventura&#x27;s one-base error and Ty Cobb doubled him home, the run unearned to Walsh, who is charged 3 runs against 2 earned; Cobb keeps the RBI. Chicago made it 5-2 in the top of the 4th (Ventura singled, Appling singled on the hit and run, Fisk walked, and Fielder Jones&#x27;s forceout scored Ventura), and Detroit answered again in the bottom of the 4th (Greenberg doubled and Sam Crawford singled him home). Collins&#x27;s solo home run in the top of the 7th made it 6-3. Chicago&#x27;s 7th run, in the top of the 8th, is the game&#x27;s only run without an RBI: Appling singled off Aurelio Lopez, took an extra base when Fisk struck out on the hit and run and Bill Freehan&#x27;s throw went wild (E2), and scored on Lopez&#x27;s wild pitch during Jones&#x27;s walk (play row seq 67 carries 1 run and 0 RBI); Jones&#x27;s printed RBI 1 is his top-of-the-4th forceout only, and Chicago&#x27;s team RBI total is 6 against 7 runs. Detroit&#x27;s bottom of the 9th nearly flipped the game: Freehan doubled, Trammell walked, and Charlie Gehringer hit a three-run home run off Cicotte to make it 7-6, but Al Kaline&#x27;s single was followed by Greenberg&#x27;s groundout to end it. Eddie Collins is the export&#x27;s player of the game: 3 for 5 with the home run, 2 RBIs and 2 runs. Key lines: for Chicago, Appling 3 for 3 with a triple, a walk, 2 runs and a stolen base, Thomas 1 for 3 with the three-run home run and 2 walks, and Jones, Chicago&#x27;s playing manager, 0 for 4 with a walk, the forceout RBI, and the walk during which the wild-pitch run scored; for Detroit, Greenberg 2 for 5 with a home run and a double and 2 runs, Gehringer 1 for 5 with the three-run home run, and Freehan 1 for 4 with a double and 11 putouts. The errors were Ventura&#x27;s (E5, on Trammell&#x27;s grounder in the 3rd) and Freehan&#x27;s (E2, the wild throw in the 8th), one per club, carried in errors_by in the established shape; defensive lines booked in the established shape from the printed fielding section (Chicago 27 putouts and 10 assists, Frank Thomas 12 putouts; Detroit 27 putouts and 9 assists). Wild pitches: one each for Walsh and Lopez, Lopez&#x27;s scoring Appling. Passed balls: none (Freehan&#x27;s catching line reads PB 0, 1 stolen base against in 2 attempts, 1 caught stealing: Appling stole second and Minnie Miñoso was caught). No double plays were turned by either club, and no printed GIDP arises. Counting checks: Chicago plate appearances 43 (34 AB, 8 BB, 1 HBP) equal Detroit&#x27;s 43 batters faced (Newhouser 29, Lopez 14); Detroit plate appearances 40 (36 AB, 4 BB) equal Chicago&#x27;s 40 batters faced (Walsh 24, Foulke 4, Cicotte 12). Hit, walk, hit-by-pitch, home run and strikeout totals tie across the two boxes both ways. Earned runs: Chicago&#x27;s staff is charged 5 earned runs against Detroit&#x27;s 6 runs (Trammell&#x27;s run unearned), and Detroit&#x27;s staff 7 earned runs against Chicago&#x27;s 7 (the wild-pitch run stays earned to Lopez). Manager grades: the grades list names both managers directly, so no label mapping is needed. Fielder Jones, who manages Chicago and also leads off for them, graded 7 decisions (3 paid off, 2 backfired, 2 neutral): four hit and runs at 1 paid off, 2 backfired and 1 neutral, both pitching changes (Foulke and Cicotte) paid off, and leaving a pitcher in neutral. Sparky Anderson graded 1 decision (0 paid off, 0 backfired, 1 neutral): the Lopez pitching change, neutral. Availability for Game 2 under the convention: Walsh (17 outs in this game) and Newhouser (19 outs) are unavailable; Cicotte (6 outs) and Lopez (8 outs) are capped at 3 outs; Foulke (4 outs) is free. Chicago leads the series 1-0. Managers: Fielder Jones (Chicago) and Sparky Anderson (Detroit). Venue is Comerica Park, as printed.">
