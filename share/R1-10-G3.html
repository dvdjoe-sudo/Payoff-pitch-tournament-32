  <title>R1-10-G3: Los Angeles Dodgers 4, Milwaukee Brewers 1</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-01: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-10 Game 3 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Los Angeles Dodgers (seed 10) vs Milwaukee Brewers (seed 23), home pattern 2-2-1-1-1, Game 3 at American Family Field in Milwaukee. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete play log, and they agree on every printed number, with no run-accounting knot and no settlement needed. The decisions are not printed; they are derived from the play log and the run charges on the card. Dazzy Vance takes the win: 5.1 innings, five hits, one earned run, two walks, and he left in the Bottom 6 with a 2-1 lead his bullpen held the rest of the way. Brandon Woodruff takes the loss: both Los Angeles runs in the Top 4 are charged to him (Robinson&#x27;s walk, Wheat&#x27;s RBI triple, Betts&#x27;s RBI single), and Milwaukee never tied it after that. Mike Marshall takes the save: he entered the Bottom 9 with a 4-1 lead, exactly three runs, the bases empty, pitched a full inning and finished the game, so the save stands on the lead-of-three-plus-one-full-inning prong, the same shape as Dan Plesac&#x27;s Game 2 save in this series. Run charges match the printed lines exactly: Milwaukee pitching allows 2 + 0 + 0 + 2 + 0 = 4 (Woodruff: Robinson and Wheat in the Top 4; Williams and Jeffress none; Plesac: Campanella&#x27;s solo homer and Cey, who singled off him and scored on Guerrero&#x27;s single off Fingers as an inherited runner; Fingers: none of his own), and Los Angeles pitching allows 1 + 0 + 0 + 0 = 1 (Vance: Yount in the Bottom 4; Brewer, Perranoski and Marshall none). Printed RBI ties clean both ways: Los Angeles 4 (Wheat, Betts, Campanella and Guerrero 1 each) against 4 runs, and Milwaukee 1 (Scott) against 1 run. The duplicate test ran before the number was assigned: the stored R1-10 games are Game 1 (Milwaukee 5, Los Angeles 6) and Game 2 (Milwaukee 6, Los Angeles 3), neither sharing this game&#x27;s final score or linescore, so this box score is no duplicate, and this is the third game of the series in play order, booked as Game 3. The game: three scoreless innings, then the Top 4: Robinson walked, Wheat tripled him home, Betts singled Wheat home, and Ohtani grounded into a double play to keep it at two. Milwaukee&#x27;s only run came in the Bottom 4: Yount walked, Fielder&#x27;s hit-and-run single sent him to third, and Scott singled him home off Vance; Contreras&#x27;s hit-and-run groundout then moved the runners to second and third with two out, but Jenkins grounded out and the tying and go-ahead runs were stranded. Vance left in the Bottom 6 after Molitor walked, stole second, and took third on Yount&#x27;s groundout with one out; Brewer stranded him there, Fielder grounding out and Scott striking out. Los Angeles added two insurance runs in the Top 8 off Plesac: Campanella&#x27;s solo home run, Cey&#x27;s single, Reese&#x27;s hit-and-run groundout moving Cey to second, and, after Fingers relieved, Guerrero&#x27;s pinch-hit single scoring Cey for 4-1. Milwaukee&#x27;s last threat came in the Bottom 8: Perranoski hit Gómez with a pitch, Braun pinch-hit and flied out, Molitor singled, Yount&#x27;s groundout moved the runners to second and third, and Fielder flied out. Marshall then closed a clean Bottom 9. Wheat&#x27;s triple is the game&#x27;s only triple and Campanella&#x27;s homer its only home run; neither club hit a double. Stolen bases: Molitor stole second in the Bottom 6 (printed). Caught stealing: Jenkins in the Bottom 3 (printed). The other steal sends in the log (Murphy in the Bottom 1, the first Bottom 3 send, and both Bottom 8 sends, Lasorda in the Top 4) were held runners who did not get a good jump, not attempts. Double plays grounded into, counted from the play log: Ohtani in the Top 4 for Los Angeles; Yount in the Bottom 1 for Milwaukee. Sacrifices: none; no sacrifice bunt or fly occurred anywhere in the game, so the split columns below show SH 0 and SF 0 for every batter, log-proven. Substitutions: Guerrero pinch-hit for Wheat in the Top 8, singled Cey home, and stayed in left field (1 for 1, his line carries no walk: the game&#x27;s only Los Angeles walk is Robinson&#x27;s in the Top 4); Braun pinch-hit for Yelich in the Bottom 8 and flied out (0 for 1), staying in left field for the 9th; Cooper pinch-hit for Scott in the Bottom 9 and grounded out (0 for 1). Hit batter: Gómez was hit by Perranoski in the Bottom 8 (printed on the Gazette extras line, HBP 1, and in the grid). The scorecard grids print an HBP column for every pitcher on both clubs, so HB 1 is carried for Perranoski and HB 0 for the other eight pitchers as card-sourced values, and Gómez carries HBP 1, so the hit batter check runs on real data. Batters faced are counted from the play log and tie to the batting PA totals both ways (Los Angeles 34 PA against 34 Milwaukee BF: Woodruff 17, Williams 3, Jeffress 4, Plesac 3, Fingers 7; Milwaukee 34 PA against 34 Los Angeles BF: Vance 21, Brewer 5, Perranoski 5, Marshall 3). Twenty decisions were graded. Tommy Lasorda made 6 (4 paid off, 0 backfired, 2 neutral): the Top 4 steal send paid off at +1.14 in the 2-run inning even though Robinson was held; the Bottom 6 change to Brewer paid off at +1.20, stranding Molitor at third; the Top 8 hit and run was neutral at -0.11; the Top 8 pinch hitter Guerrero paid off at +0.93 with the RBI single that made it 4-1; the Bottom 8 change to Perranoski was neutral at +0.23 even though he greeted Gómez with a hit by pitch; and the Bottom 9 change to Marshall paid off at +0.73. Pat Murphy made 14 (3 paid off, 10 backfired, 1 neutral): all six of his graded steal decisions backfired, the Bottom 1 send at -0.51, the two Bottom 3 sends at -0.86 and -0.76 (the second ending with Jenkins caught stealing), the Bottom 6 send at -0.61 (Molitor stole second safely and the inning still died), and the two Bottom 8 sends at -0.86 and -0.51 with Gómez held both times; the Bottom 4 hit and run on Fielder paid off at +0.74, and the second Bottom 4 hit and run backfired at -1.13 when Contreras grounded out, the runners advancing anyway before Jenkins made the third out; the Top 6 change to Williams paid off at +0.73 and the Top 7 change to Jeffress paid off at +0.73; the Top 8 change to Plesac backfired at -1.77, Campanella homering on his first batter and both insurance runs charged to him, and the Top 8 change to Fingers was neutral at -0.09; and both pinch hitters backfired, Braun at -1.11 in the Bottom 8 and Cooper at -0.73 in the Bottom 9. Managers: Tommy Lasorda (Los Angeles) and Pat Murphy (Milwaukee). Venue is American Family Field. Availability compliance: Kershaw (17 outs in Game 2) and Sheets (18) were unavailable under the house convention and correctly did not pitch. Game 4 availability, under the house outs convention read off this game only: Vance threw 16 outs and Woodruff 15, so both are UNAVAILABLE for Game 4 (the rotations turn to the number 4 starters anyway); Fingers (5 outs), Brewer (5), Williams (3), Jeffress (3), Perranoski (3), Marshall (3) and Plesac (1) are all free. Los Angeles leads the series 2-1, and Game 4 stays in Milwaukee.">
