  <title>R1-14-G2: Seattle Mariners 3, Chicago White Sox 4</title>
  <meta name="description" content="Played by Joe and sent to the co-managed tournament games chat as three files on 2026-11-05: the paper scorecard grid photo, the app scorecard PDF, and the full graded play-by-play text; official R1-14 Game 2 under Joe&#x27;s standing rule that sending a fixture&#x27;s box score makes the game count. Chicago White Sox (seed 14) vs Seattle Mariners (seed 19), home pattern 2-2-1-1-1, Game 2 at Guaranteed Rate Field. Box score record: the three sources carry the linescore, the full batting and pitching lines, and a complete graded play log, and they agree on every printed number, with the decisions settled here and documented, the sources governing throughout. The decisions are not printed and are derived from the play log and the run charges on the card. Red Faber started for Chicago and was the pitcher of record when Chicago took the lead for good in the Bottom 7 (8.0 IP, 7 H, 3 R, 3 ER, 1 BB, 3 SO, 1 HR), so he takes the win. Andrés Muñoz relieved in the Bottom 7 and gave up Frank Thomas&#x27;s go-ahead solo homer, the only run charged to him (1.2 IP, 2 H, 1 R, 1 ER, 1 BB, 1 SO, 1 HR), so he takes the loss. Bobby Jenks worked a scoreless Top 9 (1.0 IP, 0 H, 0 R) and takes the save, entering with a one-run lead and the bases empty, his second save in two games. Run charges match the printed lines exactly: Seattle pitching allows 4 (Hernández 3, Rhodes 0, Muñoz 1), and Chicago pitching allows 3 (Faber 3, Jenks 0). The duplicate test ran before the number was assigned: the stored Game 1 (Chicago 6, Seattle 5) differs in score and linescore, so this box score is no duplicate and takes the series&#x27; next unplayed number, Game 2. The game: Seattle scored in the Top 1, Ichiro singling, A-Rod walking, Griffey forcing A-Rod at second with Ichiro taking third, and Martínez singling Ichiro home, 1-0. Chicago left two in the first and did not score until the Bottom 4, Jackson doubling and Ventura lifting a sacrifice fly to left, 1-1. Chicago moved ahead in the Bottom 5: Fielder Jones singled, Collins bunted him to second, Thomas singled him to third, Miñoso&#x27;s sacrifice fly to center scored him, and Jackson&#x27;s second double scored Thomas, 3-1. Seattle tied it in the Top 7: Ibañez singled, and after two outs Boone hit a two-run homer off Faber, 3-3. Rhodes opened the Bottom 7 for Seattle and got Collins, and Muñoz then gave up Thomas&#x27;s solo homer, 4-3 Chicago, before finishing the seventh and working a scoreless eighth. Faber worked a scoreless Top 8, and Jenks closed the Top 9 on three fly balls and groundouts. One baserunning out belongs in the record: in the Bottom 3, Fielder Jones, who had walked and been bunted to second, was thrown out at home on Thomas&#x27;s single to left; it is an out on the bases, not a double play, and it changes no printed line. Seattle stranded 4 and Chicago 9. Home runs: two, Boone for Seattle (two-run, Top 7) and Thomas for Chicago (solo, Bottom 7). Doubles: three, Jackson two and Ordóñez one, all for Chicago. Triples: none. Errors: none by either club. Hit batters: none; HB is carried as 0 for every pitcher as a card-sourced value and HBP 0 for every batter, so the hit batter check runs on real data. Wild pitches: one, Hernández. Passed balls: none. Sacrifices: four, Collins two bunts (Bottom 3 and Bottom 5) and two flies, Miñoso in the Bottom 5 and Ventura in the Bottom 4, so the split lines read SH 2 for Collins and SF 1 each for Miñoso and Ventura, log-proven. Stolen bases: one, Collins in the Bottom 1. Caught stealing: none. Double plays grounded into: one, Martínez for Seattle in the Top 6; Miñoso&#x27;s Bottom 1 forceout is a fielder&#x27;s choice, a single-out play. Substitutions: none with a plate appearance for either club; the Gazette prints nine batting lines per side, and the only changes were pitching changes. Batters faced are counted from the play log and tie to the batting PA totals both ways (Seattle 34 PA against 34 Chicago BF: Faber 31, Jenks 3; Chicago 37 PA against 37 Seattle BF: Hernández 28, Rhodes 1, Muñoz 8). Seattle PA is AB 33 plus BB 1; Chicago PA is AB 29 plus BB 4 plus SH 2 plus SF 2. Strikeouts tie both ways: Seattle batting 3 against Chicago pitching 3, Chicago batting 2 against Seattle pitching 2. Twelve decisions were graded. Fielder Jones made 7 (2 paid off, 4 backfired, 1 neutral): the Bottom 1 steal send was neutral at -0.26, Collins safe at second; all three of his hit and run calls backfired at -0.76 each, in the Bottom 2, the Bottom 4, and the Bottom 7; his two sacrifice bunt calls split, the Bottom 3 call backfiring at -0.61 and the Bottom 5 call paying off at +1.39; and the Top 9 change to Jenks paid off at +0.73, the game&#x27;s best grade. Lou Piniella made 5 (0 paid off, 3 backfired, 2 neutral): his three steal sends went neutral at +0.14 in the Top 1 and backfired at -0.51 in the Top 3 and -0.86 in the Top 6, the runner held each time; the Bottom 7 change to Rhodes was neutral at -0.27; and the Bottom 7 change to Muñoz backfired at -1.00, the game&#x27;s worst grade, Thomas homering off the new arm. Managers: Fielder Jones (Chicago, also his club&#x27;s leadoff hitter and center fielder) and Lou Piniella (Seattle). Venue is Guaranteed Rate Field. Game 3 availability from Game 2 outs under the house convention: Faber (24 outs) and Hernández (18 outs) are unavailable, a point the rotation turn makes moot for both starters; Rhodes (1 out), Muñoz (5 outs), and Jenks (3 outs) are all free, Jenks having recorded 3 outs in each of Games 1 and 2, each game read on its own. Chicago leads the series 2-0. Series runs so far: Chicago 10, Seattle 8.">
